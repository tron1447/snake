<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,
 initial-scale=1,
 maximum-scale=1,
 user-scalable=no">

<title>Snake Arena</title>

<style>

*{
 box-sizing:border-box;
 margin:0;
 padding:0;
 user-select:none;
}

html,body{
 width:100%;
 height:100%;
 overflow:hidden;
 background:#071008;
 font-family:Arial,sans-serif;
 touch-action:none;
}

canvas{
 position:fixed;
 inset:0;
 width:100%;
 height:100%;
}

#menu{
 position:fixed;
 inset:0;
 z-index:100;
 display:flex;
 align-items:center;
 justify-content:center;
 background:
 radial-gradient(
  circle,
  #245c2d,
  #071008 70%
 );
}

.panel{
 width:min(440px,94vw);
 max-height:94vh;
 overflow:auto;
 padding:25px;
 border-radius:25px;
 background:#081109;
 border:1px solid #426b47;
 color:white;
 box-shadow:0 20px 70px #000;
}

.logo{
 text-align:center;
 font-size:65px;
}

h1{
 text-align:center;
 color:#59ff70;
 font-size:38px;
}

.sub{
 text-align:center;
 color:#839187;
 margin:5px 0 18px;
}

input{
 width:100%;
 height:48px;
 margin:5px 0;
 border-radius:12px;
 border:1px solid #34583a;
 background:#101a11;
 color:white;
 text-align:center;
 font-size:16px;
 outline:none;
}

button{
 cursor:pointer;
 border:0;
}

.main,
.secondary{
 width:100%;
 height:48px;
 margin-top:8px;
 border-radius:12px;
 font-weight:bold;
}

.main{
 background:#55f66a;
 color:#041006;
}

.secondary{
 background:#152117;
 color:white;
 border:1px solid #36553a;
}

#roomLobby{
 display:none;
 margin-top:15px;
}

.roomTop{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin-bottom:10px;
}

.roomTitle{
 color:#55ff70;
 font-weight:bold;
}

#roomCode{
 font-size:25px;
 color:#fff;
 letter-spacing:4px;
 font-weight:bold;
}

#players{
 border:1px solid #29432d;
 border-radius:12px;
 overflow:hidden;
 margin-top:10px;
}

.playerRow{
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:10px;
 background:#0d190f;
 border-bottom:1px solid #1d3020;
}

.playerLeft{
 display:flex;
 align-items:center;
 gap:9px;
}

.playerDot{
 width:14px;
 height:14px;
 border-radius:50%;
}

.playerName{
 font-weight:bold;
}

.host{
 font-size:11px;
 color:#ffd84a;
 font-weight:bold;
}

.waiting{
 text-align:center;
 color:#718073;
 font-size:13px;
 margin:10px;
}

#notHost{
 display:none;
 text-align:center;
 padding:10px;
 color:#ffd84a;
}

#error{
 min-height:20px;
 color:#ff6677;
 font-size:13px;
 margin-top:7px;
 text-align:center;
}

#hud{
 display:none;
 position:fixed;
 top:12px;
 left:12px;
 z-index:20;
 gap:6px;
}

.stat{
 background:rgba(0,0,0,.75);
 border:1px solid #27442b;
 border-radius:10px;
 padding:7px 10px;
 color:white;
}

.stat small{
 display:block;
 color:#718073;
 font-size:9px;
}

#leaderboard{
 display:none;
 position:fixed;
 right:12px;
 top:12px;
 z-index:20;
 width:190px;
 padding:10px;
 border-radius:13px;
 background:rgba(0,0,0,.82);
 color:white;
}

.lbTitle{
 color:#62ff72;
 font-weight:bold;
 margin-bottom:4px;
}

.lbRow{
 display:flex;
 justify-content:space-between;
 padding:4px;
 font-size:12px;
}

#minimap{
 display:none;
 position:fixed;
 right:12px;
 top:140px;
 width:180px;
 height:180px;
 z-index:20;
 border-radius:14px;
 border:2px solid #3e7547;
 background:#071008;
}

#shopButton{
 display:none;
 position:fixed;
 bottom:12px;
 left:12px;
 z-index:30;
 width:110px;
 height:44px;
 border-radius:12px;
 background:#ffd84a;
 font-weight:bold;
}

#boost{
 display:none;
 position:fixed;
 right:22px;
 bottom:22px;
 z-index:30;
 width:80px;
 height:80px;
 border-radius:50%;
 background:#1685bf;
 border:3px solid white;
 color:white;
 font-size:27px;
}

#joystick{
 display:none;
 position:fixed;
 left:20px;
 bottom:20px;
 width:140px;
 height:140px;
 z-index:30;
 border-radius:50%;
 background:rgba(80,255,100,.08);
 border:2px solid rgba(80,255,100,.3);
}

#stick{
 position:absolute;
 width:58px;
 height:58px;
 left:50%;
 top:50%;
 transform:translate(-50%,-50%);
 border-radius:50%;
 background:#4bed61;
 border:3px solid white;
}

#gameOver{
 display:none;
 position:fixed;
 inset:0;
 z-index:200;
 justify-content:center;
 align-items:center;
 background:rgba(0,0,0,.82);
}

.overPanel{
 width:min(380px,90vw);
 padding:30px;
 border-radius:22px;
 background:#0b160d;
 color:white;
 text-align:center;
}

.overPanel h2{
 color:#ff5366;
 font-size:40px;
}

.overPanel button{
 width:100%;
 height:48px;
 margin-top:15px;
 border-radius:12px;
 background:#55f56a;
 font-weight:bold;
}

</style>
</head>

<body>

<canvas id="game"></canvas>

<canvas
 id="minimap"
 width="180"
 height="180">
</canvas>

<div id="menu">

<div class="panel">

<div class="logo">🐍</div>

<h1>SNAKE ARENA</h1>

<div class="sub">
Kasva suureks ja võida!
</div>

<input
 id="name"
 maxlength="16"
 placeholder="Sinu nimi">

<button
 class="main"
 id="single">
🤖 SINGLEPLAYER
</button>

<button
 class="secondary"
 id="create">
🏠 LOO ROOM
</button>

<input
 id="roomInput"
 maxlength="5"
 placeholder="ROOM CODE">

<button
 class="secondary"
 id="join">
🚪 LIITU ROOMI
</button>

<div id="roomLobby">

 <div class="roomTop">

  <div>
   <div style="font-size:11px;color:#718073">
    ROOM
   </div>

   <div id="roomCode">
    -----
   </div>
  </div>

  <div>
   <div style="font-size:11px;color:#718073">
    MÄNGIJAID
   </div>

   <div id="playerCount">
    0/8
   </div>
  </div>

 </div>

 <div id="players"></div>

 <div id="notHost">
  ⏳ Ootad hosti, et mäng algaks...
 </div>

 <button
  class="main"
  id="startRoom"
  style="display:none">
  ▶ ALUSTA MÄNGU
 </button>

</div>

<div id="error"></div>

</div>

</div>

<div id="hud">

<div class="stat">
<small>SKOOR</small>
<b id="score">0</b>
</div>

<div class="stat">
<small>KILLID</small>
<b id="kills">0</b>
</div>

<div class="stat">
<small>PIKKUS</small>
<b id="length">75</b>
</div>

<div class="stat">
<small>🪙</small>
<b id="coins">0</b>
</div>

</div>

<div id="leaderboard">

<div class="lbTitle">
🏆 TOP 3
</div>

<div id="lb"></div>

</div>

<button id="shopButton">
🛒 POOD
</button>

<div id="joystick">
<div id="stick"></div>
</div>

<button id="boost">
⚡
</button>

<div id="gameOver">

<div class="overPanel">

<h2>GAME OVER</h2>

<p id="reason"></p>

<p style="margin-top:12px">
Skoor: <b id="finalScore">0</b>
</p>

<p>
Killid: <b id="finalKills">0</b>
</p>

<button onclick="location.reload()">
🔄 UUESTI
</button>

</div>

</div>

<script>

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

canvas.width=W;
canvas.height=H;

addEventListener("resize",()=>{

 W=innerWidth;
 H=innerHeight;

 canvas.width=W;
 canvas.height=H;
});

const WORLD=14000;

let running=false;
let single=false;
let dead=false;

let socket=null;
let roomCode=null;

let isHost=false;

let multiplayerPlayers=[];

let coins=
 Number(localStorage.getItem(
  "snakeCoins"
 ))||0;

let selectedSkin=
 localStorage.getItem(
  "snakeSkin"
 )||"#54ff6b";

const skins=[

 {
  name:"Neon",
  color:"#54ff6b",
  price:0
 },

 {
  name:"Ocean",
  color:"#35a9ff",
  price:50
 },

 {
  name:"Fire",
  color:"#ff465f",
  price:100
 },

 {
  name:"Gold",
  color:"#ffd43b",
  price:200
 },

 {
  name:"Purple",
  color:"#ae61ff",
  price:300
 },

 {
  name:"Pink",
  color:"#ff55c7",
  price:400
 }

];

const player={

 id:null,

 name:
  localStorage.getItem(
   "snakeName"
  )||"Player",

 x:WORLD/2,

 y:WORLD/2,

 angle:0,

 targetAngle:0,

 length:75,

 score:0,

 kills:0,

 color:selectedSkin,

 body:[],

 alive:true
};

document.getElementById(
 "name"
).value=player.name;

document.getElementById(
 "name"
).oninput=e=>{

 player.name=
  e.target.value
   .replace(/[<>]/g,"")
   .slice(0,16)||"Player";

 localStorage.setItem(
  "snakeName",
  player.name
 );
};

/* FOOD */

const food=[];

function makeFood(){

 return{

  x:100+
   Math.random()*(WORLD-200),

  y:100+
   Math.random()*(WORLD-200),

  r:5+
   Math.random()*4,

  value:1+
   Math.floor(Math.random()*4),

  color:
   skins[
    Math.floor(
     Math.random()*skins.length
    )
   ].color
 };
}

for(let i=0;i<1600;i++)
 food.push(makeFood());

/* BOTS */

const bots=[];

const botNames=[
 "Shadow",
 "Viper",
 "Blaze",
 "Ghost",
 "Python",
 "Storm",
 "Ninja",
 "Cobra",
 "Turbo",
 "Venom"
];

function makeBot(){

 const b={

  id:
   Math.random().toString(36),

  name:
   botNames[
    Math.floor(
     Math.random()*botNames.length
    )
   ],

  x:
   1000+
   Math.random()*
   (WORLD-2000),

  y:
   1000+
   Math.random()*
   (WORLD-2000),

  angle:
   Math.random()*Math.PI*2,

  target:
   Math.random()*Math.PI*2,

  length:
   75+
   Math.random()*200,

  score:
   Math.floor(
    Math.random()*200
   ),

  color:
   skins[
    Math.floor(
     Math.random()*skins.length
    )
   ].color,

  body:[],

  timer:0
 };

 for(let i=0;i<b.length;i++){

  b.body.push({

   x:
    b.x-
    Math.cos(b.angle)*
    i*7,

   y:
    b.y-
    Math.sin(b.angle)*
    i*7
  });
 }

 return b;
}

function createBots(){

 bots.length=0;

 for(let i=0;i<20;i++)
  bots.push(makeBot());
}

/* PLAYER */

function resetPlayer(){

 player.x=
  1500+
  Math.random()*
  (WORLD-3000);

 player.y=
  1500+
  Math.random()*
  (WORLD-3000);

 player.angle=
  Math.random()*
  Math.PI*2;

 player.targetAngle=
  player.angle;

 player.length=75;

 player.score=0;

 player.kills=0;

 player.alive=true;

 player.body=[];

 for(let i=0;i<75;i++){

  player.body.push({

   x:
    player.x-
    Math.cos(player.angle)*
    i*7,

   y:
    player.y-
    Math.sin(player.angle)*
    i*7
  });
 }
}

/* MOUSE */

let mouseX=W/2;
let mouseY=H/2;

addEventListener(
 "mousemove",
 e=>{

  mouseX=e.clientX;
  mouseY=e.clientY;
 }
);

/* BOOST */

let boosting=false;

addEventListener(
 "keydown",
 e=>{

  if(e.code==="Space")
   boosting=true;
 });

addEventListener(
 "keyup",
 e=>{

  if(e.code==="Space")
   boosting=false;
 });

const boostBtn=
 document.getElementById(
  "boost"
 );

boostBtn.addEventListener(
 "pointerdown",
 ()=>{
  boosting=true;
 });

boostBtn.addEventListener(
 "pointerup",
 ()=>{
  boosting=false;
 });

boostBtn.addEventListener(
 "pointercancel",
 ()=>{
  boosting=false;
 });

/* PLAYER UPDATE */

function updatePlayer(){

 if(!player.alive)
  return;

 if(innerWidth>800){

  const dx=
   mouseX-W/2;

  const dy=
   mouseY-H/2;

  if(
   Math.hypot(dx,dy)>12
  ){

   player.targetAngle=
    Math.atan2(dy,dx);
  }
 }

 let diff=
  player.targetAngle-
  player.angle;

 while(diff>Math.PI)
  diff-=Math.PI*2;

 while(diff<-Math.PI)
  diff+=Math.PI*2;

 player.angle+=
  diff*.13;

 const speed=
  boosting&&player.length>70
  ?10
  :7.4;

 player.x+=
  Math.cos(player.angle)*
  speed;

 player.y+=
  Math.sin(player.angle)*
  speed;

 if(
  boosting&&
  player.length>70
 ){

  player.length-=.045;
 }

 if(
  player.x<35||
  player.y<35||
  player.x>WORLD-35||
  player.y>WORLD-35
 ){

  die(
   "Läksid vastu kaardi äärt!"
  );

  return;
 }

 player.body.unshift({

  x:player.x,
  y:player.y
 });

 const wanted=
  Math.max(
   60,
   Math.floor(player.length)
  );

 while(
  player.body.length<wanted
 ){

  const last=
   player.body[
    player.body.length-1
   ];

  player.body.push({

   x:last.x,
   y:last.y
  });
 }

 while(
  player.body.length>wanted
 )
  player.body.pop();

 eatFood(player);
}

/* FOOD */

function eatFood(s){

 for(
  let i=food.length-1;
  i>=0;
  i--
 ){

  const f=food[i];

  if(
   Math.hypot(
    s.x-f.x,
    s.y-f.y
   )<34
  ){

   s.score+=f.value;

   s.length+=
    f.value*.85;

   food.splice(i,1);

   food.push(makeFood());
  }
 }
}

/* BOTS */

function updateBots(){

 for(const b of bots){

  b.timer--;

  if(b.timer<=0){

   b.timer=
    30+
    Math.random()*80;

   b.target=
    Math.random()*
    Math.PI*2;
  }

  let diff=
   b.target-b.angle;

  while(diff>Math.PI)
   diff-=Math.PI*2;

  while(diff<-Math.PI)
   diff+=Math.PI*2;

  b.angle+=
   diff*.055;

  b.x+=
   Math.cos(b.angle)*5.5;

  b.y+=
   Math.sin(b.angle)*5.5;

  if(
   b.x<100||
   b.x>WORLD-100
  )
   b.target=Math.PI-b.angle;

  if(
   b.y<100||
   b.y>WORLD-100
  )
   b.target=-b.angle;

  b.body.unshift({

   x:b.x,
   y:b.y
  });

  while(
   b.body.length<
   Math.floor(b.length)
  ){

   const last=
    b.body[
     b.body.length-1
    ];

   b.body.push({

    x:last.x,
    y:last.y
   });
  }

  while(
   b.body.length>
   Math.floor(b.length)
  )
   b.body.pop();

  eatFood(b);
 }
}

/* BOT COLLISION */

function botCollisions(){

 if(!player.alive)
  return;

 for(
  let bi=bots.length-1;
  bi>=0;
  bi--
 ){

  const b=bots[bi];

  /* PLAYER HEAD -> BOT BODY */

  for(
   let i=12;
   i<b.body.length;
   i+=2
  ){

   const p=b.body[i];

   if(
    Math.hypot(
     player.x-p.x,
     player.y-p.y
    )<31
   ){

    die(
     "Sinu pea läks vastase keha vastu!"
    );

    return;
   }
  }

  /* BOT HEAD -> PLAYER BODY */

  for(
   let i=12;
   i<player.body.length;
   i+=2
  ){

   const p=
    player.body[i];

   if(
    Math.hypot(
     b.x-p.x,
     b.y-p.y
    )<31
   ){

    player.kills++;

    player.score+=100;

    player.length+=25;

    coins+=10;

    localStorage.setItem(
     "snakeCoins",
     coins
    );

    bots.splice(bi,1);

    setTimeout(
     ()=>{
      if(running&&single)
       bots.push(makeBot());
     },
     800
    );

    break;
   }
  }
 }
}

/* DRAW WORM */

function drawWorm(s){

 if(
  !s.body||
  s.body.length<2
 )
  return;

 ctx.save();

 ctx.beginPath();

 for(
  let i=s.body.length-1;
  i>=0;
  i--
 ){

  const p=s.body[i];

  if(
   i===
   s.body.length-1
  )
   ctx.moveTo(
    p.x+7,
    p.y+7
   );
  else
   ctx.lineTo(
    p.x+7,
    p.y+7
   );
 }

 ctx.strokeStyle=
  "rgba(0,0,0,.5)";

 ctx.lineWidth=48;

 ctx.lineCap="round";

 ctx.stroke();

 ctx.beginPath();

 for(
  let i=s.body.length-1;
  i>=0;
  i--
 ){

  const p=s.body[i];

  if(
   i===
   s.body.length-1
  )
   ctx.moveTo(p.x,p.y);
  else
   ctx.lineTo(p.x,p.y);
 }

 ctx.strokeStyle=s.color;

 ctx.lineWidth=36;

 ctx.lineCap="round";

 ctx.stroke();

 ctx.translate(
  s.x,
  s.y
 );

 ctx.rotate(s.angle);

 ctx.fillStyle=s.color;

 ctx.beginPath();

 ctx.ellipse(
  0,
  0,
  41,
  35,
  0,
  0,
  Math.PI*2
 );

 ctx.fill();

 ctx.fillStyle="white";

 ctx.beginPath();

 ctx.arc(
  18,
  -14,
  10,
  0,
  Math.PI*2
 );

 ctx.fill();

 ctx.beginPath();

 ctx.arc(
  18,
  14,
  10,
  0,
  Math.PI*2
 );

 ctx.fill();

 ctx.fillStyle="#111";

 ctx.beginPath();

 ctx.arc(
  21,
  -14,
  5,
  0,
  Math.PI*2
 );

 ctx.fill();

 ctx.beginPath();

 ctx.arc(
  21,
  14,
  5,
  0,
  Math.PI*2
 );

 ctx.fill();

 ctx.restore();

 ctx.textAlign="center";

 ctx.font=
  "bold 14px Arial";

 ctx.lineWidth=5;

 ctx.strokeStyle=
  "rgba(0,0,0,.9)";

 ctx.strokeText(
  s.name||"Player",
  s.x,
  s.y-55
 );

 ctx.fillStyle="white";

 ctx.fillText(
  s.name||"Player",
  s.x,
  s.y-55
 );
}

/* DRAW */

function draw(){

 ctx.clearRect(
  0,
  0,
  W,
  H
 );

 if(!running)
  return;

 ctx.save();

 ctx.translate(
  W/2-player.x,
  H/2-player.y
 );

 ctx.fillStyle="#102716";

 ctx.fillRect(
  0,
  0,
  WORLD,
  WORLD
 );

 const grid=120;

 ctx.strokeStyle=
  "rgba(180,255,190,.035)";

 const left=
  Math.floor(
   (player.x-W)/grid
  )*grid;

 const right=
  Math.ceil(
   (player.x+W)/grid
  )*grid;

 const top=
  Math.floor(
   (player.y-H)/grid
  )*grid;

 const bottom=
  Math.ceil(
   (player.y+H)/grid
  )*grid;

 for(
  let x=left;
  x<=right;
  x+=grid
 ){

  ctx.beginPath();

  ctx.moveTo(
   x,
   player.y-H
  );

  ctx.lineTo(
   x,
   player.y+H
  );

  ctx.stroke();
 }

 for(
  let y=top;
  y<=bottom;
  y+=grid
 ){

  ctx.beginPath();

  ctx.moveTo(
   player.x-W,
   y
  );

  ctx.lineTo(
   player.x+W,
   y
  );

  ctx.stroke();
 }

 for(const f of food){

  if(
   Math.abs(f.x-player.x)>
   W/2+150||
   Math.abs(f.y-player.y)>
   H/2+150
  )
   continue;

  ctx.fillStyle=f.color;

  ctx.beginPath();

  ctx.arc(
   f.x,
   f.y,
   f.r,
   0,
   Math.PI*2
  );

  ctx.fill();
 }

 if(single){

  for(const b of bots)
   drawWorm(b);

 }else{

  for(
   const p of multiplayerPlayers
  )
   drawWorm(p);
 }

 drawWorm(player);

 ctx.strokeStyle="#52ff69";

 ctx.lineWidth=24;

 ctx.strokeRect(
  0,
  0,
  WORLD,
  WORLD
 );

 ctx.restore();

 drawMinimap();
}

/* MINIMAP */

function drawMinimap(){

 const c=
  document.getElementById(
   "minimap"
  );

 const m=c.getContext("2d");

 m.clearRect(
  0,
  0,
  180,
  180
 );

 m.fillStyle="#071208";

 m.fillRect(
  0,
  0,
  180,
  180
 );

 const drawDot=(s,r)=>{

  m.fillStyle=s.color;

  m.beginPath();

  m.arc(
   s.x/WORLD*180,
   s.y/WORLD*180,
   r,
   0,
   Math.PI*2
  );

  m.fill();
 };

 if(single){

  for(const b of bots)
   drawDot(b,3);

 }else{

  for(
   const p of multiplayerPlayers
  )
   drawDot(p,4);
 }

 drawDot(player,5);
}

/* SOCKET */

function connectServer(){

 const protocol=
  location.protocol==="https:"
  ?"wss:"
  :"ws:";

 socket=
  new WebSocket(
   protocol+
   "//"+
   location.host
  );

 socket.onopen=()=>{

  document.getElementById(
   "error"
  ).textContent="";
 };

 socket.onmessage=e=>{

  let data;

  try{
   data=JSON.parse(e.data);
  }catch{
   return;
  }

  if(data.type==="connected"){

   player.id=data.id;
  }

  /*
     ROOM CREATED
  */

  if(
   data.type===
   "roomCreated"
  ){

   roomCode=data.code;

   isHost=true;

   showLobby();

   return;
  }

  /*
     ROOM JOINED
  */

  if(
   data.type===
   "roomJoined"
  ){

   roomCode=data.code;

   isHost=false;

   showLobby();

   return;
  }

  /*
     ROOM INFO
  */

  if(
   data.type===
   "roomInfo"
  ){

   roomCode=data.code;

   isHost=
    data.hostId===
    player.id;

   renderLobby(
    data.players
   );

   return;
  }

  /*
     GAME START
  */

  if(
   data.type===
   "gameStart"
  ){

   single=false;

   startGame();

   return;
  }

  /*
     GAME STATE
  */

  if(
   data.type===
   "state"
  ){

   multiplayerPlayers=
    (data.players||[])
    .filter(
     p=>p.id!==player.id
    )
    .map(p=>({

     id:p.id,

     name:p.name,

     color:p.color||"#ff465f",

     x:Number(p.x)||0,

     y:Number(p.y)||0,

     angle:Number(p.angle)||0,

     length:Number(p.length)||75,

     score:Number(p.score)||0,

     kills:Number(p.kills)||0,

     alive:p.alive,

     body:Array.isArray(p.body)
      ?p.body
      :[]
    }));

   return;
  }

  if(
   data.type==="error"
  ){

   document.getElementById(
    "error"
   ).textContent=
    data.message;
  }
 };

 socket.onclose=()=>{

  if(running&&!single){

   console.log(
    "Serveriga ühendus katkes."
   );
  }
 };
}

/* JOYSTICK */

const joystick=
 document.getElementById(
  "joystick"
 );

const stick=
 document.getElementById(
  "stick"
 );

let joy=false;

function moveJoy(x,y){

 const r=
  joystick.getBoundingClientRect();

 const cx=
  r.left+r.width/2;

 const cy=
  r.top+r.height/2;

 let dx=x-cx;

 let dy=y-cy;

 const max=48;

 const d=
  Math.hypot(dx,dy);

 if(d>max){

  dx=dx/d*max;

  dy=dy/d*max;
 }

 stick.style.left=
  `calc(50% + ${dx}px)`;

 stick.style.top=
  `calc(50% + ${dy}px)`;

 if(d>7){

  player.targetAngle=
   Math.atan2(dy,dx);
 }
}

joystick.addEventListener(
 "pointerdown",
 e=>{

  joy=true;

  joystick.setPointerCapture(
   e.pointerId
  );

  moveJoy(
   e.clientX,
   e.clientY
  );
 });

joystick.addEventListener(
 "pointermove",
 e=>{

  if(joy)
   moveJoy(
    e.clientX,
    e.clientY
   );
 });

function stopJoy(){

 joy=false;

 stick.style.left="50%";

 stick.style.top="50%";
}

joystick.addEventListener(
 "pointerup",
 stopJoy
);

joystick.addEventListener(
 "pointercancel",
 stopJoy
);

   botCollisions();

 }

 draw();

 requestAnimationFrame(
  loop
 );
}

resetPlayer();
