<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>Snake Arena</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#030603;
    font-family:Arial,sans-serif;
}

body{
    touch-action:none;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

#menu{
    position:fixed;
    inset:0;
    z-index:50;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:15px;

    overflow:auto;

    background:
        radial-gradient(
            circle at 50% 15%,
            #1c5928 0%,
            #09170b 35%,
            #020402 80%
        );
}

.panel{
    width:min(94vw,470px);

    max-height:calc(100vh - 30px);

    overflow-y:auto;

    padding:25px;

    background:rgba(3,10,4,.97);

    border:
        1px solid
        rgba(99,255,120,.35);

    border-radius:25px;

    box-shadow:
        0 0 70px
        rgba(99,255,120,.15);

    color:white;

    text-align:center;
}

.logo{
    font-size:60px;
}

h1{
    color:#63ff78;
    font-size:38px;
}

.subtitle{
    color:#849485;
    margin:5px 0 15px;
}

input{
    width:100%;
    height:48px;

    margin:5px 0;

    background:#071007;

    border:
        1px solid
        #315c37;

    border-radius:12px;

    color:white;

    text-align:center;

    font-size:16px;

    outline:none;
}

button{
    font-family:Arial;
    font-weight:bold;
    cursor:pointer;
}

.mainBtn{
    width:100%;
    min-height:48px;

    margin-top:7px;

    border:0;

    border-radius:12px;

    font-size:15px;
}

.green{
    background:#63ff78;
    color:#031006;
}

.dark{
    background:#102014;
    color:white;

    border:
        1px solid
        #315b36;
}

#coinsMenu{
    margin:10px 0;

    color:#ffd84d;

    font-weight:bold;

    font-size:18px;
}

#skins{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;

    gap:9px;

    margin:13px 0;
}

.skin{
    position:relative;

    width:65px;
    height:65px;

    border-radius:15px;

    border:
        2px solid
        #294d2f;

    font-size:27px;

    background:#102014;

    color:white;
}

.skin.selected{
    border-color:white;

    box-shadow:
        0 0 18px
        rgba(255,255,255,.4);

    transform:scale(1.05);
}

.skin.locked{
    filter:grayscale(.6);
    opacity:.7;
}

.skinPrice{
    position:absolute;

    left:2px;
    right:2px;
    bottom:2px;

    font-size:9px;

    color:#ffd84d;
}

#roomBox{
    display:none;
    margin-top:15px;
}

.roomTitle{
    color:#829483;
    font-size:11px;
}

#roomCode{
    color:#63ff78;

    font-size:32px;

    font-weight:bold;

    letter-spacing:6px;

    margin:4px 0 10px;
}

#players{
    max-height:130px;
    overflow-y:auto;
}

.playerRow{
    padding:8px;

    margin:4px 0;

    background:#0b170d;

    border-radius:8px;

    text-align:left;
}

#error{
    min-height:20px;

    color:#ff6172;

    margin-top:8px;
}

#connection{
    margin-top:7px;

    color:#718172;

    font-size:11px;
}

#hud{
    position:fixed;

    z-index:10;

    top:10px;
    left:10px;

    display:none;

    gap:6px;
}

.stat{
    padding:7px 10px;

    background:rgba(0,0,0,.7);

    border:
        1px solid
        rgba(99,255,120,.25);

    border-radius:10px;

    color:white;
}

.stat small{
    display:block;

    color:#78907c;

    font-size:9px;
}

.stat b{
    font-size:16px;
}

#coinHud{
    color:#ffd84d;
}

#minimap{
    position:fixed;

    z-index:12;

    right:10px;
    top:10px;

    width:170px;
    height:170px;

    display:none;

    border:
        2px solid
        rgba(99,255,120,.7);

    border-radius:15px;

    background:#061007;
}

#joystick{
    position:fixed;

    z-index:20;

    left:22px;
    bottom:22px;

    width:145px;
    height:145px;

    display:none;

    border:
        2px solid
        rgba(99,255,120,.35);

    border-radius:50%;

    background:
        rgba(99,255,120,.08);
}

#stick{
    position:absolute;

    left:50%;
    top:50%;

    width:62px;
    height:62px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:#63ff78;

    border:3px solid white;

    box-shadow:
        0 0 20px
        rgba(99,255,120,.5);
}

#boost{
    position:fixed;

    z-index:20;

    right:25px;
    bottom:30px;

    width:90px;
    height:90px;

    display:none;

    border-radius:50%;

    background:#087bb0;

    color:white;

    border:
        3px solid
        #a5e3ff;

    font-size:28px;
}

#killText{
    position:fixed;

    z-index:40;

    left:50%;
    top:25%;

    transform:
        translateX(-50%)
        scale(.7);

    opacity:0;

    color:#63ff78;

    font-size:38px;

    font-weight:900;

    text-shadow:
        0 0 20px
        #63ff78;

    pointer-events:none;

    transition:.2s;
}

#killText.show{
    opacity:1;

    transform:
        translateX(-50%)
        scale(1);
}

#gameOver{
    position:fixed;

    inset:0;

    z-index:60;

    display:none;

    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.8);
}

.overPanel{
    width:min(90vw,390px);

    padding:30px;

    background:#081008;

    border:
        1px solid
        #315b36;

    border-radius:25px;

    color:white;

    text-align:center;
}

.overPanel h2{
    color:#ff596c;

    font-size:38px;
}

@media(max-width:800px){

    #joystick,
    #boost{
        display:block;
    }

    #minimap{
        width:125px;
        height:125px;
    }

    #hud{
        transform:scale(.88);
        transform-origin:top left;
    }
}

</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="menu">

<div class="panel">

<div class="logo">🐍</div>

<h1>SNAKE ARENA</h1>

<div class="subtitle">
Eat • Grow • Fight • Eliminate
</div>

<input
    id="name"
    maxlength="16"
    placeholder="Sinu nimi"
>

<div id="coinsMenu">
    🪙 <span id="menuCoins">0</span> COINS
</div>

<h3>🎨 SKINID</h3>

<div id="skins">

<button
    class="skin selected"
    data-color="#63ff78"

>
🐍
<span class="skinPrice">FREE</span>

😎
<span class="skinPrice">25 🪙</span>

<button

    data-color="#ff5570"

    data-price="50"
>
😈
<span class="skinPrice">50 🪙</span>
</button>

<button

    data-skin="yellow"

😄
<span class="skinPrice">75 🪙</span>

<button

    data-color="#b86cff"

>
👾

<button
    class="skin"

    data-price="125"
>
🔥
<span class="skinPrice">125 🪙</span>

<button

>
👻
<span class="skinPrice">150 🪙</span>
</button>

<button
    class="skin"
    data-color="#00e5d4"

    data-price="200"

🤖
<span class="skinPrice">200 🪙</span>

</div>

<button

>
🏠 CREATE ROOM
</button>

<input

<button

ROOM CODE

------

>

</div>

</div>

</div>
</div>

<div id="hud">

<div class="stat">
<small>SCORE</small>
<b id="score">0</b>
</div>

<div class="stat">
<small>LENGTH</small>
<b id="length">20</b>
</div>

<div class="stat">
<small>PLAYERS</small>
<b id="playerCount">1</b>
</div>

<div class="stat">
<small>COINS</small>
<b id="coinHud">0</b>
</div>

</div>

<canvas
    id="minimap"

    height="170"
></canvas>

💥 +10 COINS!

</div>

⚡

Sind elimineeriti!
</p>

Skoor:

>
🔄 TAGASI MENÜÜS
</button>

<script>

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

const minimap =
document.getElementById("minimap");

const mapCtx =
minimap.getContext("2d");

let W =
innerWidth;

let H =
innerHeight;

function resize(){

    W =
        innerWidth;

    H =
        innerHeight;

    canvas.width =
        W;

    canvas.height =
        H;
}

addEventListener(
    "resize",
    resize
);

resize();


/* WORLD */

const WORLD =
    20000;


/* FOOD */

const foods = [];

const FOOD_COUNT =
    1400;

const foodColors = [
    "#63ff78",
    "#ffd84d",
    "#ff6075",
    "#55c9ff",
    "#c76cff",
    "#ff963d"
];

function makeFood(){

    return {
        x:
            Math.random() *
            WORLD,

        y:
            Math.random() *
            WORLD,

        radius:
            3 +
            Math.random() *
            4,

        color:
            foodColors[
                Math.floor(
                    Math.random() *
                    foodColors.length
                )
            ],

        value:
            1 +
            Math.floor(
                Math.random() * 4
            )
    };
}

for(
    let i = 0;
    i < FOOD_COUNT;
    i++
){
    foods.push(
        makeFood()
    );
}


/* PLAYER */

const me = {

    id:null,

    x:10000,

    y:10000,

    angle:0,

    targetAngle:0,

    length:20,

    color:"#63ff78",

    skin:"green",

    name:"Player"
};

let body=[];

let others={};

let running=false;

let dead=false;

let boosting=false;

let score=0;


/* COINS */

let coins =
    Number(
        localStorage.getItem(
            "snakeCoins"
        ) || 0
    );

function saveCoins(){

    localStorage.setItem(
        "snakeCoins",
        String(coins)
    );

    updateCoinsUI();
}

function updateCoinsUI(){

    document
        .getElementById(
            "menuCoins"
        )
        .textContent =
            coins;

    document
        .getElementById(
            "coinHud"
        )
        .textContent =
            coins;
}

updateCoinsUI();


/* OWNED SKINS */

let ownedSkins =
    JSON.parse(
        localStorage.getItem(
            "snakeSkins"
        ) ||
        '["green"]'
    );

function saveSkins(){

    localStorage.setItem(
        "snakeSkins",
        JSON.stringify(
            ownedSkins
        )
    );
}


/* SKINS */

document
.querySelectorAll(".skin")
.forEach(
    button => {

        const skin =
            button.dataset.skin;

        const price =
            Number(
                button.dataset.price
            );

        if(
            ownedSkins.includes(
                skin
            )
        ){

            button.classList.remove(
                "locked"
            );
        }

        button.onclick =
        () => {

            if(
                !ownedSkins.includes(
                    skin
                )
            ){

                if(
                    coins < price
                ){

                    showError(
                        "Sul ei ole piisavalt coine!"
                    );

                    return;
                }

                coins -= price;

                ownedSkins.push(
                    skin
                );

                saveCoins();

                saveSkins();
            }

            document
                .querySelectorAll(
                    ".skin"
                )
                .forEach(
                    b =>
                        b.classList.remove(
                            "selected"
                        )
                );

            button.classList.add(
                "selected"
            );

            me.color =
                button.dataset.color;

            me.skin =
                skin;
        };
    }
);


/* WEBSOCKET */

let socket=null;

let connected=false;

function connect(){

    const protocol =
        location.protocol ===
        "https:"
        ? "wss:"
        : "ws:";

    socket =
        new WebSocket(
            protocol +
            "//" +
            location.host
        );

    socket.onopen =
    () => {

        connected=true;

        setConnection(
            "🟢 Server ühendatud"
        );
    };

    socket.onclose =
    () => {

        connected=false;

        setConnection(
            "🔴 Ühendus katkes"
        );
    };

    socket.onerror =
    () => {

        setConnection(
            "🔴 Serveri viga"
        );
    };

    socket.onmessage =
    e => {

        try{

            serverMessage(
                JSON.parse(
                    e.data
                )
            );

        }catch{}
    };
}

function send(data){

    if(
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ){
        return;
    }

    socket.send(
        JSON.stringify(
            data
        )
    );
}


/* SERVER */

function serverMessage(data){

    if(
        data.type ===
        "roomCreated"
    ){

        me.id =
            data.id;

        showRoom(
            data.code
        );

        return;
    }

    if(
        data.type ===
        "roomJoined"
    ){

        me.id =
            data.id;

        showRoom(
            data.code
        );

        return;
    }

    if(
        data.type ===
        "lobby"
    ){

        updateLobby(
            data.players || []
        );

        return;
    }

    if(
        data.type ===
        "gameStart"
    ){

        me.id =
            data.id;

        startGame();

        return;
    }

    if(
        data.type ===
        "players"
    ){

        others =
            data.players || {};

        updatePlayerCount();

        return;
    }

    if(
        data.type ===
        "kill"
    ){

        coins +=
            Number(
                data.coins || 10
            );

        saveCoins();

        showKill();

        return;
    }

    if(
        data.type ===
        "playerKilled"
    ){

        return;
    }

    if(
        data.type ===
        "gameOver"
    ){

        die(
            data.reason ||
            "Sind elimineeriti!"
        );

        return;
    }

    if(
        data.type ===
        "error"
    ){

        showError(
            data.message
        );
    }
}


/* UI */

function playerName(){

    return (
        document
            .getElementById(
                "name"
            )
            .value
            .trim() ||
        "Player"
    ).substring(
        0,
        16
    );
}

function showRoom(code){

    document
        .getElementById(
            "roomBox"
        )
        .style.display =
            "block";

    document
        .getElementById(
            "roomCode"
        )
        .textContent =
            code;
}

function updateLobby(players){

    const box =
        document
            .getElementById(
                "players"
            );

    box.innerHTML="";

    players.forEach(
        p => {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "playerRow";

            row.style.color =
                p.color ||
                "white";

            row.textContent =
                (
                    p.host
                    ? "👑 "
                    : "🐍 "
                ) +
                (
                    p.name ||
                    "Player"
                );

            box.appendChild(
                row
            );
        }
    );

    if(players.length){

        document
            .getElementById(
                "startBtn"
            )
            .style.display =
                "block";
    }
}

function showError(text){

    document
        .getElementById(
            "error"
        )
        .textContent =
            text || "";
}

function setConnection(text){

    document
        .getElementById(
            "connection"
        )
        .textContent =
            text;
}

function updatePlayerCount(){

    document
        .getElementById(
            "playerCount"
        )
        .textContent =
            Object.keys(
                others
            ).length;
}


/* CREATE */

document
    .getElementById(
        "createBtn"
    )
    .onclick =
    () => {

        if(!connected){

            showError(
                "Serveriga ühendamine..."
            );

            return;
        }

        showError("");

        send({

            type:
                "createRoom",

            name:
                playerName(),

            color:
                me.color,

            skin:
                me.skin
        });
    };


/* JOIN */

document
    .getElementById(
        "joinBtn"
    )
    .onclick =
    () => {

        const code =
            document
                .getElementById(
                    "roomInput"
                )
                .value
                .trim()
                .toUpperCase();

        if(
            code.length !== 6
        ){

            showError(
                "Room code peab olema 6 märki."
            );

            return;
        }

        send({

            type:
                "joinRoom",

            code,

            name:
                playerName(),

            color:
                me.color,

            skin:
                me.skin
        });
    };


/* START */

document
    .getElementById(
        "startBtn"
    )
    .onclick =
    () => {

        send({
            type:
                "startGame"
        });
    };


/* KEYBOARD */

const keys={};

addEventListener(
    "keydown",
    e => {

        keys[
            e.key.toLowerCase()
        ] = true;

        if(
            e.key ===
            "Shift"
        ){

            boosting=true;
        }
    }
);

addEventListener(
    "keyup",
    e => {

        keys[
            e.key.toLowerCase()
        ] = false;

        if(
            e.key ===
            "Shift"
        ){

            boosting=false;
        }
    }
);

function keyboardDirection(){

    let dx=0;

    let dy=0;

    if(
        keys.w ||
        keys.arrowup
    ){
        dy=-1;
    }

    if(
        keys.s ||
        keys.arrowdown
    ){
        dy=1;
    }

    if(
        keys.a ||
        keys.arrowleft
    ){
        dx=-1;
    }

    if(
        keys.d ||
        keys.arrowright
    ){
        dx=1;
    }

    if(dx || dy){

        me.targetAngle =
            Math.atan2(
                dy,
                dx
            );
    }
}


/* MOUSE */

addEventListener(
    "mousemove",
    e => {

        if(!running) return;

        if(innerWidth <= 800)
            return;

        const dx =
            e.clientX -
            W / 2;

        const dy =
            e.clientY -
            H / 2;

        if(
            Math.hypot(
                dx,
                dy
            ) < 15
        ){
            return;
        }

        me.targetAngle =
            Math.atan2(
                dy,
                dx
            );
    }
);


/* JOYSTICK */

const joystick =
    document.getElementById(
        "joystick"
    );

const stick =
    document.getElementById(
        "stick"
    );

let joyId=null;

function moveJoystick(x,y){

    const r =
        joystick.getBoundingClientRect();

    const cx =
        r.left +
        r.width / 2;

    const cy =
        r.top +
        r.height / 2;

    let dx =
        x - cx;

    let dy =
        y - cy;

    const max=55;

    const d =
        Math.hypot(
            dx,
            dy
        );

    if(d > max){

        dx =
            dx / d *
            max;

        dy =
            dy / d *
            max;
    }

    stick.style.left =
        `calc(50% + ${dx}px)`;

    stick.style.top =
        `calc(50% + ${dy}px)`;

    if(d > 7){

        me.targetAngle =
            Math.atan2(
                dy,
                dx
            );
    }
}

function resetJoystick(){

    joyId=null;

    stick.style.left =
        "50%";

    stick.style.top =
        "50%";
}

joystick.onpointerdown =
    e => {

        joyId =
            e.pointerId;

        joystick.setPointerCapture(
            e.pointerId
        );

        moveJoystick(
            e.clientX,
            e.clientY
        );
    };

joystick.onpointermove =
    e => {

        if(
            e.pointerId !==
            joyId
        ){
            return;
        }

        moveJoystick(
            e.clientX,
            e.clientY
        );
    };

joystick.onpointerup =
    resetJoystick;

joystick.onpointercancel =
    resetJoystick;


/* BOOST */

const boost =
    document.getElementById(
        "boost"
    );

boost.onpointerdown =
    () => {
        boosting=true;
    };

boost.onpointerup =
    () => {
        boosting=false;
    };

boost.onpointercancel =
    () => {
        boosting=false;
    };


/* START GAME */

function startGame(){

    running=true;

    dead=false;

    score=0;

    document
        .getElementById(
            "menu"
        )
        .style.display =
            "none";

    document
        .getElementById(
            "hud"
        )
        .style.display =
            "flex";

    document
        .getElementById(
            "minimap"
        )
        .style.display =
            "block";

    me.x =
        3000 +
        Math.random() *
        14000;

    me.y =
        3000 +
        Math.random() *
        14000;

    me.angle =
        Math.random() *
        Math.PI *
        2;

    me.targetAngle =
        me.angle;

    body=[];

    for(
        let i=0;
        i<Math.floor(
            me.length
        );
        i++
    ){

        body.push({
            x:
                me.x -
                Math.cos(
                    me.angle
                ) *
                i *
                7,

            y:
                me.y -
                Math.sin(
                    me.angle
                ) *
                i *
                7
        });
    }
}


/* UPDATE */

let lastSend=0;

function update(){

    if(
        !running ||
        dead
    ){
        return;
    }

    keyboardDirection();

    let difference =
        me.targetAngle -
        me.angle;

    while(
        difference >
        Math.PI
    ){
        difference -=
            Math.PI * 2;
    }

    while(
        difference <
        -Math.PI
    ){
        difference +=
            Math.PI * 2;
    }

    me.angle +=
        difference *
        .16;

    let speed =
        boosting
        ? 9.5
        : 5.8;

    me.x +=
        Math.cos(
            me.angle
        ) *
        speed;

    me.y +=
        Math.sin(
            me.angle
        ) *
        speed;

    me.x =
        Math.max(
            25,
            Math.min(
                WORLD - 25,
                me.x
            )
        );

    me.y =
        Math.max(
            25,
            Math.min(
                WORLD - 25,
                me.y
            )
        );

    body.unshift({
        x:me.x,
        y:me.y
    });

    while(
        body.length >
        Math.floor(
            me.length
        )
    ){
        body.pop();
    }

    while(
        body.length <
        Math.floor(
            me.length
        )
    ){
        body.push({
            x:me.x,
            y:me.y
        });
    }

    eatFood();

    if(
        boosting &&
        me.length > 20
    ){

        me.length -=
            .035;

        if(
            Math.random() <
            .12
        ){

            foods.push({
                x:
                    me.x -
                    Math.cos(
                        me.angle
                    ) *
                    25,

                y:
                    me.y -
                    Math.sin(
                        me.angle
                    ) *
                    25,

                radius:4,

                color:me.color,

                value:1
            });
        }
    }

    const now =
        performance.now();

    if(
        now - lastSend >
        35
    ){

        lastSend=now;

        send({

            type:
                "state",

            x:
                me.x,

            y:
                me.y,

            angle:
                me.angle,

            length:
                me.length,

            color:
                me.color,

            skin:
                me.skin,

            name:
                playerName()
        });
    }

    document
        .getElementById(
            "score"
        )
        .textContent =
            Math.floor(
                score
            );

    document
        .getElementById(
            "length"
        )
        .textContent =
            Math.floor(
                me.length
            );
}


/* FOOD */

function eatFood(){

    for(
        let i =
            foods.length - 1;
        i >= 0;
        i--
    ){

        const f =
            foods[i];

        if(
            Math.hypot(
                f.x - me.x,
                f.y - me.y
            ) <
            24 + f.radius
        ){

            score +=
                f.value;

            me.length +=
                f.value *
                .55;

            foods[i] =
                makeFood();
        }
    }
}


/* CAMERA */

let cameraX=10000;

let cameraY=10000;

function updateCamera(){

    cameraX +=
        (
            me.x -
            cameraX
        ) * .12;

    cameraY +=
        (
            me.y -
            cameraY
        ) * .12;
}


/* DRAW */

function draw(){

    ctx.fillStyle =
        "#071008";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    if(!running)
        return;

    updateCamera();

    ctx.save();

    ctx.translate(
        W / 2 -
        cameraX,

        H / 2 -
        cameraY
    );

    drawGrid();

    drawBorder();

    drawFood();

    drawOthers();

    drawMe();

    ctx.restore();

    drawMinimap();
}


/* GRID */

function drawGrid(){

    const grid=250;

    const left =
        cameraX -
        W / 2 -
        500;

    const right =
        cameraX +
        W / 2 +
        500;

    const top =
        cameraY -
        H / 2 -
        500;

    const bottom =
        cameraY +
        H / 2 +
        500;

    ctx.strokeStyle =
        "rgba(99,255,120,.055)";

    ctx.lineWidth=1;

    for(
        let x =
            Math.floor(
                left / grid
            ) * grid;
        x < right;
        x += grid
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            top
        );

        ctx.lineTo(
            x,
            bottom
        );

        ctx.stroke();
    }

    for(
        let y =
            Math.floor(
                top / grid
            ) * grid;
        y < bottom;
        y += grid
    ){

        ctx.beginPath();

        ctx.moveTo(
            left,
            y
        );

        ctx.lineTo(
            right,
            y
        );

        ctx.stroke();
    }
}


/* BORDER */

function drawBorder(){

    ctx.strokeStyle =
        "#63ff78";

    ctx.lineWidth=18;

    ctx.shadowColor =
        "#63ff78";

    ctx.shadowBlur=20;

    ctx.strokeRect(
        0,
        0,
        WORLD,
        WORLD
    );

    ctx.shadowBlur=0;
}


/* FOOD */

function drawFood(){

    for(
        const f of foods
    ){

        if(
            Math.abs(
                f.x -
                cameraX
            ) >
            W
        ){
            continue;
        }

        if(
            Math.abs(
                f.y -
                cameraY
            ) >
            H
        ){
            continue;
        }

        ctx.fillStyle =
            f.color;

        ctx.shadowColor =
            f.color;

        ctx.shadowBlur=9;

        ctx.beginPath();

        ctx.arc(
            f.x,
            f.y,
            f.radius,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.shadowBlur=0;
}


/* HEAD */

function drawHead(
    x,
    y,
    angle,
    color,
    skin
){

    ctx.save();

    ctx.translate(
        x,
        y
    );

    ctx.rotate(
        angle
    );

    const r=22;

    ctx.fillStyle =
        color;

    ctx.shadowColor =
        color;

    ctx.shadowBlur=18;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        r,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.shadowBlur=0;

    if(
        skin ===
        "blue"
    ){

        ctx.strokeStyle =
            "#d8f5ff";

        ctx.lineWidth=4;

        ctx.stroke();
    }

    if(
        skin ===
        "red"
    ){

        ctx.strokeStyle =
            "#ffb0bd";

        ctx.lineWidth=4;

        ctx.beginPath();

        ctx.moveTo(
            -13,
            -13
        );

        ctx.lineTo(
            13,
            13
        );

        ctx.moveTo(
            13,
            -13
        );

        ctx.lineTo(
            -13,
            13
        );

        ctx.stroke();
    }

    if(
        skin ===
        "yellow"
    ){

        ctx.fillStyle =
            "#fff2a0";

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            8,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    if(
        skin ===
        "purple"
    ){

        ctx.fillStyle =
            "#f4d2ff";

        for(
            let i=0;
            i<6;
            i++
        ){

            const a =
                i *
                Math.PI /
                3;

            ctx.beginPath();

            ctx.arc(
                Math.cos(a)*14,
                Math.sin(a)*14,
                3,
                0,
                Math.PI*2
            );

            ctx.fill();
        }
    }

    if(
        skin ===
        "orange"
    ){

        ctx.strokeStyle =
            "#ffe1c0";

        ctx.lineWidth=3;

        for(
            let i=-1;
            i<=1;
            i++
        ){

            ctx.beginPath();

            ctx.moveTo(
                -16,
                i*8
            );

            ctx.lineTo(
                16,
                i*8
            );

            ctx.stroke();
        }
    }

    if(
        skin ===
        "white"
    ){

        ctx.strokeStyle =
            "#b9ffff";

        ctx.lineWidth=3;

        ctx.stroke();
    }

    if(
        skin ===
        "cyan"
    ){

        ctx.strokeStyle =
            "#d2fffa";

        ctx.lineWidth=4;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            14,
            0,
            Math.PI*2
        );

        ctx.stroke();
    }

    /* EYES */

    ctx.fillStyle =
        "white";

    ctx.beginPath();

    ctx.arc(
        11,
        -8,
        7,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        11,
        8,
        7,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle =
        "#111";

    ctx.beginPath();

    ctx.arc(
        14,
        -8,
        3.5,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        14,
        8,
        3.5,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* MOUTH */

    ctx.strokeStyle =
        "#111";

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(
        14,
        0
    );

    ctx.lineTo(
        20,
        0
    );

    ctx.stroke();

    ctx.restore();
}


/* NAME */

function drawName(
    name,
    x,
    y
){

    ctx.save();

    ctx.textAlign =
        "center";

    ctx.font =
        "bold 12px Arial";

    ctx.fillStyle =
        "white";

    ctx.strokeStyle =
        "black";

    ctx.lineWidth=3;

    ctx.strokeText(
        name,
        x,
        y
    );

    ctx.fillText(
        name,
        x,
        y
    );

    ctx.restore();
}


/* MY SNAKE */

function drawMe(){

    for(
        let i =
            body.length - 1;
        i >= 0;
        i--
    ){

        const p =
            body[i];

        const progress =
            i /
            body.length;

        const radius =
            8 +
            (1-progress) *
            10;

        ctx.globalAlpha =
            1 -
            progress *
            .35;

        ctx.fillStyle =
            me.color;

        ctx.shadowColor =
            me.color;

        ctx.shadowBlur =
            i < 10
            ? 12
            : 3;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            radius,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.globalAlpha=1;

    ctx.shadowBlur=0;

    drawHead(
        me.x,
        me.y,
        me.angle,
        me.color,
        me.skin
    );

    drawName(
        playerName(),
        me.x,
        me.y - 32
    );
}


/* OTHER SNAKES */

function drawOthers(){

    for(
        const id in others
    ){

        if(
            id === me.id
        ){
            continue;
        }

        const p =
            others[id];

        if(
            !p ||
            p.alive === false
        ){
            continue;
        }

        const length =
            Math.min(
                220,
                Math.max(
                    20,
                    Math.floor(
                        p.length ||
                        20
                    )
                )
            );

        /*
            IMPORTANT:
            Teeme teistele mängijatele
            korraliku ussikujulise keha.
        */

        for(
            let i =
                length - 1;
            i >= 0;
            i--
        ){

            const spacing =
                7.2;

            const x =
                p.x -
                Math.cos(
                    p.angle
                ) *
                i *
                spacing;

            const y =
                p.y -
                Math.sin(
                    p.angle
                ) *
                i *
                spacing;

            const progress =
                i / length;

            const radius =
                8 +
                (1-progress) *
                9;

            ctx.globalAlpha =
                1 -
                progress *
                .35;

            ctx.fillStyle =
                p.color ||
                "#4da6ff";

            ctx.shadowColor =
                p.color ||
                "#4da6ff";

            ctx.shadowBlur =
                i < 8
                ? 10
                : 2;

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                radius,
                0,
                Math.PI*2
            );

            ctx.fill();
        }

        ctx.globalAlpha=1;

        ctx.shadowBlur=0;

        drawHead(
            p.x,
            p.y,
            p.angle,
            p.color ||
                "#4da6ff",
            p.skin ||
                "blue"
        );

        drawName(
            p.name ||
                "Player",
            p.x,
            p.y - 32
        );
    }
}


/* MINIMAP */

function drawMinimap(){

    const size =
        minimap.width;

    mapCtx.clearRect(
        0,
        0,
        size,
        size
    );

    mapCtx.fillStyle =
        "#061007";

    mapCtx.fillRect(
        0,
        0,
        size,
        size
    );

    /* FOOD */

    for(
        const f of foods
    ){

        const x =
            f.x /
            WORLD *
            size;

        const y =
            f.y /
            WORLD *
            size;

        mapCtx.fillStyle =
            f.color;

        mapCtx.globalAlpha=.4;

        mapCtx.fillRect(
            x,
            y,
            2,
            2
        );
    }

    mapCtx.globalAlpha=1;

    /* OTHER */

    for(
        const id in others
    ){

        if(
            id === me.id
        ){
            continue;
        }

        const p =
            others[id];

        if(
            !p ||
            p.alive === false
        ){
            continue;
        }

        const x =
            p.x /
            WORLD *
            size;

        const y =
            p.y /
            WORLD *
            size;

        mapCtx.fillStyle =
            p.color ||
            "#ff5570";

        mapCtx.beginPath();

        mapCtx.arc(
            x,
            y,
            4,
            0,
            Math.PI*2
        );

        mapCtx.fill();
    }

    /* ME */

    const mx =
        me.x /
        WORLD *
        size;

    const my =
        me.y /
        WORLD *
        size;

    mapCtx.fillStyle =
        me.color;

    mapCtx.shadowColor =
        me.color;

    mapCtx.shadowBlur=8;

    mapCtx.beginPath();

    mapCtx.arc(
        mx,
        my,
        6,
        0,
        Math.PI*2
    );

    mapCtx.fill();

    mapCtx.shadowBlur=0;

    mapCtx.strokeStyle =
        "#63ff78";

    mapCtx.lineWidth=2;

    mapCtx.strokeRect(
        1,
        1,
        size-2,
        size-2
    );
}


/* KILL */

let killTimer=null;

function showKill(){

    const el =
        document.getElementById(
            "killText"
        );

    el.classList.add(
        "show"
    );

    clearTimeout(
        killTimer
    );

    killTimer =
        setTimeout(
            () => {

                el.classList.remove(
                    "show"
                );

            },
            900
        );
}


/* DEATH */

function die(reason){

    if(dead)
        return;

    dead=true;

    running=false;

    boosting=false;

    document
        .getElementById(
            "deathReason"
        )
        .textContent =
            reason;

    document
        .getElementById(
            "finalScore"
        )
        .textContent =
            Math.floor(
                score
            );

    document
        .getElementById(
            "finalCoins"
        )
        .textContent =
            coins;

    document
        .getElementById(
            "gameOver"
        )
        .style.display =
            "flex";
}


/* LOOP */

function loop(){

    update();

    draw();

    requestAnimationFrame(
        loop
    );
}

connect();

loop();

</script>
