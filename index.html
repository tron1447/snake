<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Snake Arena</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#071008;
    font-family:Arial,sans-serif;
    touch-action:none;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

#menu{
    position:fixed;
    inset:0;
    z-index:100;
    overflow-y:auto;
    padding:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:radial-gradient(circle,#174d20,#050805 75%);
}

.panel{
    width:min(94vw,520px);
    max-height:94vh;
    overflow-y:auto;
    padding:25px;
    border-radius:25px;
    background:#071008;
    border:1px solid #315d37;
    color:white;
    text-align:center;
}

.logo{
    font-size:60px;
}

h1{
    font-size:40px;
    color:#63ff78;
}

.sub{
    color:#819482;
    margin:5px 0 15px;
}

input{
    width:100%;
    height:48px;
    margin:5px 0;
    border-radius:10px;
    border:1px solid #315d37;
    background:#0c170e;
    color:white;
    padding:0 14px;
    text-align:center;
    outline:none;
}

.btn{
    width:100%;
    min-height:48px;
    margin-top:8px;
    border:0;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.green{
    background:#63ff78;
    color:#041006;
}

.dark{
    background:#122015;
    color:white;
    border:1px solid #315d37;
}

#coinsMenu{
    color:#ffd84d;
    background:#101c11;
    border-radius:10px;
    padding:10px;
    margin:10px 0;
    font-weight:bold;
}

#skins{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
    margin:10px;
}

.skin{
    width:44px;
    height:44px;
    border-radius:50%;
    border:3px solid transparent;
}

.skin.selected{
    border-color:white;
}

#roomBox{
    display:none;
    margin-top:14px;
    padding:12px;
    border-radius:14px;
    background:#0b170d;
    border:1px solid #315d37;
}

#roomCode{
    font-size:34px;
    color:#63ff78;
    font-weight:bold;
    letter-spacing:5px;
}

#error{
    min-height:22px;
    margin-top:8px;
    color:#ff6572;
}

#shop{
    display:none;
}

.shopGrid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    margin:12px 0;
}

.shopItem{
    padding:12px;
    border-radius:12px;
    background:#0d180f;
    border:1px solid #29472e;
}

.preview{
    width:50px;
    height:50px;
    border-radius:50%;
    margin:auto auto 7px;
}

.shopItem button{
    width:100%;
    padding:8px;
    margin-top:7px;
    border:0;
    border-radius:7px;
    font-weight:bold;
}

#hud{
    position:fixed;
    z-index:20;
    left:10px;
    top:10px;
    display:none;
    gap:6px;
    flex-wrap:wrap;
}

.stat{
    background:rgba(0,0,0,.8);
    border:1px solid #315d37;
    border-radius:9px;
    padding:7px 10px;
    color:white;
}

.stat small{
    display:block;
    color:#718172;
    font-size:9px;
}

#leaderboard{
    position:fixed;
    z-index:20;
    top:10px;
    right:10px;
    width:180px;
    display:none;
    background:rgba(0,0,0,.82);
    border:1px solid #315d37;
    border-radius:13px;
    padding:9px;
    color:white;
}

.lbTitle{
    color:#63ff78;
    font-weight:bold;
    margin-bottom:4px;
}

.lbRow{
    display:flex;
    justify-content:space-between;
    padding:4px;
    font-size:12px;
}

/* MINIMAP */

#minimap{
    position:fixed;
    z-index:25;
    right:12px;
    bottom:12px;
    width:190px;
    height:190px;
    background:#0d1b10;
    border:3px solid #63ff78;
    border-radius:16px;
    box-shadow:0 0 18px rgba(99,255,120,.25);
    display:none;
}

#miniCanvas{
    width:100%;
    height:100%;
    border-radius:13px;
}

#miniTitle{
    position:absolute;
    top:6px;
    left:7px;
    z-index:2;
    font-size:10px;
    color:white;
    background:rgba(0,0,0,.6);
    padding:3px 6px;
    border-radius:5px;
}

#joystick{
    position:fixed;
    z-index:30;
    left:20px;
    bottom:20px;
    width:140px;
    height:140px;
    border-radius:50%;
    border:2px solid rgba(99,255,120,.4);
    background:rgba(99,255,120,.08);
    display:none;
}

#stick{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:58px;
    height:58px;
    border-radius:50%;
    background:#63ff78;
    border:3px solid white;
}

#boost{
    position:fixed;
    z-index:30;
    right:220px;
    bottom:25px;
    width:85px;
    height:85px;
    border-radius:50%;
    border:3px solid #a7eaff;
    background:#087eaf;
    color:white;
    font-size:28px;
    display:none;
}

#killText{
    position:fixed;
    z-index:50;
    left:50%;
    top:25%;
    transform:translate(-50%,-50%);
    color:#63ff78;
    font-size:38px;
    font-weight:bold;
    opacity:0;
    pointer-events:none;
}

#killText.show{
    opacity:1;
}

#gameOver{
    position:fixed;
    inset:0;
    z-index:200;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.82);
}

.over{
    width:min(90vw,400px);
    padding:30px;
    border-radius:22px;
    background:#081008;
    color:white;
    text-align:center;
}

.over h2{
    color:#ff6070;
    font-size:38px;
}

@media(max-width:800px){

    #menu{
        align-items:flex-start;
    }

    #joystick,
    #boost{
        display:block;
    }

    #leaderboard{
        width:150px;
    }

    #minimap{
        width:145px;
        height:145px;
        right:8px;
        bottom:8px;
    }

    #boost{
        right:165px;
        width:72px;
        height:72px;
    }
}
</style>
</head>

<script>

const WORLD = 18000;

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

const miniCanvas =
    document.getElementById("miniCanvas");

const miniCtx =
    miniCanvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

function resize(){

    W = innerWidth;
    H = innerHeight;

    canvas.width = W;
    canvas.height = H;

    miniCanvas.width = 400;
    miniCanvas.height = 400;
}

addEventListener("resize", resize);

resize();

/* SERVER */

let socket = null;
let multiplayer = false;
let myServerId = null;
let roomCode = null;

const remotePlayers = new Map();

function connectServer(){

    const protocol =
        location.protocol === "https:"
            ? "wss:"
            : "ws:";

    socket = new WebSocket(
        protocol + "//" + location.host
    );

    socket.onopen = () => {

        document.getElementById(
            "connection"
        ).textContent =
            "🟢 Server ühendatud";

    };

    socket.onclose = () => {

        document.getElementById(
            "connection"
        ).textContent =
            "🔴 Server ühendus katkes";

    };

    socket.onerror = () => {

        document.getElementById(
            "connection"
        ).textContent =
            "🔴 Serveri viga";

    };

    socket.onmessage = e => {

        let data;

        try {
            data = JSON.parse(e.data);
        } catch {
            return;
        }

        if(data.type === "connected"){
            myServerId = data.id;
        }

        if(data.type === "roomCreated"){

            multiplayer = true;
            myServerId = data.id;
            roomCode = data.code;

            document.getElementById(
                "roomCode"
            ).textContent = roomCode;

            document.getElementById(
                "roomBox"
            ).style.display = "block";

        }

        if(data.type === "roomJoined"){

            multiplayer = true;
            myServerId = data.id;
            roomCode = data.code;

            document.getElementById(
                "roomCode"
            ).textContent = roomCode;

            document.getElementById(
                "roomBox"
            ).style.display = "block";

        }

        if(data.type === "state"){

            remotePlayers.clear();

            for(const p of data.players || []){

                if(p.id !== myServerId){

                    remotePlayers.set(
                        p.id,
                        p
                    );

                }

            }

            updateRoomPlayers(
                data.players || []
            );

        }

        if(data.type === "gameStarted"){

            startGame(false);

        }

        if(data.type === "kill"){

            if(
                data.killerId ===
                myServerId
            ){

                showKill();

            }

        }

        if(data.type === "error"){

            showError(
                data.message
            );

        }

    };
}

function sendServer(data){

    if(
        socket &&
        socket.readyState === WebSocket.OPEN
    ){

        socket.send(
            JSON.stringify(data)
        );

    }

}

/* PLAYER */

let coins =
    Number(
        localStorage.getItem(
            "snakeCoins"
        ) || 0
    );

let owned =
    JSON.parse(
        localStorage.getItem(
            "snakeOwned"
        ) ||
        '["green"]'
    );

let selectedSkin =
    localStorage.getItem(
        "snakeSkin"
    ) || "green";

const SKINS = [

    {
        id:"green",
        color:"#63ff78",
        price:0
    },

    {
        id:"blue",
        color:"#4da6ff",
        price:30
    },

    {
        id:"red",
        color:"#ff5268",
        price:50
    },

    {
        id:"yellow",
        color:"#ffd84d",
        price:80
    },

    {
        id:"purple",
        color:"#b86cff",
        price:100
    },

    {
        id:"orange",
        color:"#ff8a3d",
        price:120
    },

    {
        id:"cyan",
        color:"#00e5d4",
        price:150
    },

    {
        id:"white",
        color:"#ffffff",
        price:200
    }

];

let selected =
    SKINS.find(
        s => s.id === selectedSkin
    ) || SKINS[0];

const me = {

    name:"Player",

    x:9000,
    y:9000,

    angle:0,
    targetAngle:0,

    length:25,
    score:0,
    kills:0,

    color:selected.color,
    skin:selected.id

};

let body = [];

/* FOOD */

let foods = [];

function randomFood(){

    return {

        x:
            200 +
            Math.random() *
            (WORLD - 400),

        y:
            200 +
            Math.random() *
            (WORLD - 400),

        radius:
            4 +
            Math.random() * 4,

        value:
            1 +
            Math.floor(
                Math.random() * 4
            ),

        color:
            [
                "#63ff78",
                "#ffd84d",
                "#ff6070",
                "#4da6ff",
                "#b86cff",
                "#ff8a3d"
            ][
                Math.floor(
                    Math.random() * 6
                )
            ]

    };

}

for(let i=0;i<1400;i++){

    foods.push(
        randomFood()
    );

}

/* BOTS */

let bots = [];

const botNames = [
    "Viper",
    "Cobra",
    "Shadow",
    "Hunter",
    "Blaze",
    "Toxic",
    "Python",
    "Ghost",
    "Rex",
    "Ninja",
    "Venom",
    "Storm"
];

const botColors = [
    "#4da6ff",
    "#ff5268",
    "#ffd84d",
    "#b86cff",
    "#ff8a3d",
    "#00e5d4"
];

function makeBot(){

    const b = {

        id:
            "bot_" +
            Math.random()
                .toString(36)
                .substring(2),

        name:
            botNames[
                Math.floor(
                    Math.random() *
                    botNames.length
                )
            ],

        x:
            500 +
            Math.random() *
            (WORLD - 1000),

        y:
            500 +
            Math.random() *
            (WORLD - 1000),

        angle:
            Math.random() *
            Math.PI * 2,

        targetAngle:
            Math.random() *
            Math.PI * 2,

        length:
            25 +
            Math.random() * 100,

        score:0,

        color:
            botColors[
                Math.floor(
                    Math.random() *
                    botColors.length
                )
            ],

        body:[],

        timer:0

    };

    for(let i=0;i<b.length;i++){

        b.body.push({

            x:
                b.x -
                Math.cos(b.angle) *
                i * 8,

            y:
                b.y -
                Math.sin(b.angle) *
                i * 8

        });

    }

    return b;
}

function createBots(){

    bots = [];

    for(let i=0;i<18;i++){

        bots.push(
            makeBot()
        );

    }

}

/* START */

let running = false;
let dead = false;
let single = false;

function startGame(botMode){

    single = botMode;

    running = true;
    dead = false;

    me.name =
        document
            .getElementById("name")
            .value
            .trim()
            .replace(/[<>]/g,"")
            .substring(0,16)
        || "Player";

    document.getElementById(
        "menu"
    ).style.display = "none";

    document.getElementById(
        "hud"
    ).style.display = "flex";

    document.getElementById(
        "leaderboard"
    ).style.display = "block";

    document.getElementById(
        "minimap"
    ).style.display = "block";

    me.x =
        WORLD / 2;

    me.y =
        WORLD / 2;

    me.angle = 0;
    me.targetAngle = 0;

    me.length = 25;
    me.score = 0;
    me.kills = 0;

    body = [];

    for(let i=0;i<25;i++){

        body.push({

            x:
                me.x -
                i * 8,

            y:
                me.y

        });

    }

    if(single){

        createBots();

    } else {

        bots = [];

    }

    updateHUD();

}

document.getElementById(
    "singleBtn"
).onclick = () => {

    startGame(true);

};

document.getElementById(
    "createBtn"
).onclick = () => {

    sendServer({

        type:"createRoom",

        name:
            document.getElementById(
                "name"
            ).value,

        color:selected.color,

        skin:selected.id

    });

};

document.getElementById(
    "joinBtn"
).onclick = () => {

    const code =
        document.getElementById(
            "roomInput"
        ).value
        .trim()
        .toUpperCase();

    if(code.length !== 5){

        showError(
            "Room code peab olema 5 tähte."
        );

        return;
    }

    sendServer({

        type:"joinRoom",

        code,

        name:
            document.getElementById(
                "name"
            ).value,

        color:selected.color,

        skin:selected.id

    });

};

document.getElementById(
    "startRoomBtn"
).onclick = () => {

    sendServer({
        type:"startRoom"
    });

};

/* MOUSE */

let mouseX = W / 2;
let mouseY = H / 2;

addEventListener(
    "mousemove",
    e => {

        mouseX = e.clientX;
        mouseY = e.clientY;

    }
);

function mouseControl(){

    const dx =
        mouseX -
        W / 2;

    const dy =
        mouseY -
        H / 2;

    if(
        Math.hypot(dx,dy) > 5
    ){

        me.targetAngle =
            Math.atan2(
                dy,
                dx
            );

    }

}

/* JOYSTICK */

const joystick =
    document.getElementById(
        "joystick"
    );

const stick =
    document.getElementById(
        "stick"
    );

let joystickActive = false;

function joystickMove(x,y){

    const r =
        joystick.getBoundingClientRect();

    const cx =
        r.left +
        r.width / 2;

    const cy =
        r.top +
        r.height / 2;

    let dx = x - cx;
    let dy = y - cy;

    const max = 52;

    const d =
        Math.hypot(dx,dy);

    if(d > max){

        dx =
            dx / d * max;

        dy =
            dy / d * max;

    }

    stick.style.left =
        `calc(50% + ${dx}px)`;

    stick.style.top =
        `calc(50% + ${dy}px)`;

    if(d > 7){

        me.targetAngle =
            Math.atan2(
                dy,
                dx
            );

    }

}

joystick.addEventListener(
    "pointerdown",
    e => {

        joystickActive = true;

        joystick.setPointerCapture(
            e.pointerId
        );

        joystickMove(
            e.clientX,
            e.clientY
        );

    }
);

joystick.addEventListener(
    "pointermove",
    e => {

        if(joystickActive){

            joystickMove(
                e.clientX,
                e.clientY
            );

        }

    }
);

function resetJoystick(){

    joystickActive = false;

    stick.style.left = "50%";
    stick.style.top = "50%";

}

joystick.addEventListener(
    "pointerup",
    resetJoystick
);

joystick.addEventListener(
    "pointercancel",
    resetJoystick
);

/* BOOST */

let boosting = false;
let dropTimer = 0;

const boost =
    document.getElementById(
        "boost"
    );

boost.onpointerdown =
    () => boosting = true;

boost.onpointerup =
    () => boosting = false;

boost.onpointercancel =
    () => boosting = false;

addEventListener(
    "keydown",
    e => {

        if(e.key === "Shift")
            boosting = true;

    }
);

addEventListener(
    "keyup",
    e => {

        if(e.key === "Shift")
            boosting = false;

    }
);

/* UPDATE */

function update(){

    if(!running || dead)
        return;

    if(innerWidth > 800)
        mouseControl();

    let turn =
        me.targetAngle -
        me.angle;

    while(turn > Math.PI)
        turn -= Math.PI * 2;

    while(turn < -Math.PI)
        turn += Math.PI * 2;

    me.angle += turn * .16;

    const speed =
        boosting
            ? 11.5
            : 8.5;

    me.x +=
        Math.cos(me.angle) *
        speed;

    me.y +=
        Math.sin(me.angle) *
        speed;

    /*
       KAARDI PIIR
    */

    if(
        me.x < 35 ||
        me.x > WORLD - 35 ||
        me.y < 35 ||
        me.y > WORLD - 35
    ){

        die(
            "Sõitsid vastu kaardi piiri!"
        );

        return;

    }

    body.unshift({
        x:me.x,
        y:me.y
    });

    while(
        body.length <
        Math.floor(me.length)
    ){

        body.push({
            x:me.x,
            y:me.y
        });

    }

    while(
        body.length >
        Math.floor(me.length)
    ){

        body.pop();

    }

    eatFood();

    if(boosting)
        dropBoostPiece();

    if(single){

        updateBots();
        botCollision();

    }

    if(multiplayer){

        sendServer({

            type:"input",

            x:me.x,
            y:me.y,

            angle:me.angle,

            length:me.length,

            score:me.score,

            kills:me.kills,

            body:body.slice(
                0,
                300
            )

        });

        multiplayerCollision();

    }

    updateHUD();

}

/* FOOD */

function eatFood(){

    for(
        let i=foods.length-1;
        i>=0;
        i--
    ){

        const f = foods[i];

        if(
            Math.hypot(
                me.x-f.x,
                me.y-f.y
            ) <
            24 + f.radius
        ){

            me.score += f.value;

            me.length +=
                f.value * .55;

            foods.splice(i,1);

            foods.push(
                randomFood()
            );

        }

    }

}

/* BOOST DROP */

function dropBoostPiece(){

    dropTimer--;

    if(
        dropTimer > 0 ||
        me.length < 30
    )
        return;

    dropTimer = 8;

    const p =
        body[
            Math.min(
                10,
                body.length-1
            )
        ];

    foods.push({

        x:p.x,
        y:p.y,

        radius:6,

        value:3,

        color:me.color

    });

    me.length -= .1;

}

/* BOTS */

function updateBots(){

    for(const b of bots){

        b.timer--;

        if(b.timer <= 0){

            b.timer =
                40 +
                Math.random()*100;

            const f =
                foods[
                    Math.floor(
                        Math.random() *
                        foods.length
                    )
                ];

            if(f){

                b.targetAngle =
                    Math.atan2(
                        f.y-b.y,
                        f.x-b.x
                    );

            }

        }

        let turn =
            b.targetAngle -
            b.angle;

        while(turn > Math.PI)
            turn -= Math.PI*2;

        while(turn < -Math.PI)
            turn += Math.PI*2;

        b.angle += turn * .06;

        b.x +=
            Math.cos(b.angle) *
            5.7;

        b.y +=
            Math.sin(b.angle) *
            5.7;

        if(
            b.x < 100 ||
            b.x > WORLD-100
        ){

            b.angle =
                Math.PI-b.angle;

        }

        if(
            b.y < 100 ||
            b.y > WORLD-100
        ){

            b.angle =
                -b.angle;

        }

        b.body.unshift({
            x:b.x,
            y:b.y
        });

        while(
            b.body.length <
            Math.floor(b.length)
        ){

            b.body.push({
                x:b.x,
                y:b.y
            });

        }

        while(
            b.body.length >
            Math.floor(b.length)
        ){

            b.body.pop();

        }

        for(
            let i=foods.length-1;
            i>=0;
            i--
        ){

            const f=foods[i];

            if(
                Math.hypot(
                    b.x-f.x,
                    b.y-f.y
                ) < 23
            ){

                b.length +=
                    f.value*.5;

                b.score +=
                    f.value;

                foods.splice(i,1);

                foods.push(
                    randomFood()
                );

                break;

            }

        }

    }

}

/* BOT COLLISION */

function botCollision(){

    for(const b of [...bots]){

        /*
           BOT KEHA -> MINU PEA
        */

        for(
            let i=8;
            i<b.body.length;
            i++
        ){

            const p=b.body[i];

            if(
                Math.hypot(
                    me.x-p.x,
                    me.y-p.y
                ) < 21
            ){

                die(
                    b.name+
                    " keha tabas sinu pead!"
                );

                return;

            }

        }

        /*
           MINU KEHA -> BOTI PEA
        */

        for(
            let i=8;
            i<body.length;
            i++
        ){

            const p=body[i];

            if(
                Math.hypot(
                    b.x-p.x,
                    b.y-p.y
                ) < 23
            ){

                killBot(b);

                break;

            }

        }

        /*
           PEA VASTU PEA
        */

        if(
            Math.hypot(
                me.x-b.x,
                me.y-b.y
            ) < 35
        ){

            if(
                me.length >= b.length
            ){

                killBot(b);

            }else{

                die(
                    b.name+
                    " võitis pea-vastu-pea!"
                );

                return;

            }

        }

    }

}

/* MULTIPLAYER COLLISION */

function multiplayerCollision(){

    for(
        const p of remotePlayers.values()
    ){

        if(!p.body)
            continue;

        for(
            let i=8;
            i<p.body.length;
            i++
        ){

            const part =
                p.body[i];

            if(
                Math.hypot(
                    me.x-part.x,
                    me.y-part.y
                ) < 22
            ){

                die(
                    p.name+
                    " keha tabas sinu pead!"
                );

                return;

            }

        }

    }

}

/* KILL BOT */

function killBot(bot){

    const index =
        bots.indexOf(bot);

    if(index < 0)
        return;

    for(
        let i=0;
        i<bot.body.length;
        i+=3
    ){

        const p =
            bot.body[i];

        foods.push({

            x:p.x,
            y:p.y,

            radius:6,

            value:3,

            color:bot.color

        });

    }

    bots.splice(
        index,
        1
    );

    me.kills++;
    me.score += 10;
    me.length += 12;

    coins += 10;

    saveCoins();
    updateCoins();

    showKill();

    setTimeout(
        () => {

            if(
                running &&
                single &&
                !dead
            ){

                bots.push(
                    makeBot()
                );

            }

        },
        700
    );

}

/* DRAW */

function draw(){

    ctx.fillStyle =
        "#071008";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    if(!running)
        return;

    /*
       KRIITILINE:

       Kaart on 18 000 x 18 000,
       aga camera on sinu peal.
    */

    ctx.save();

    ctx.translate(
        W/2-me.x,
        H/2-me.y
    );

    drawWorld();

    for(const b of bots){

        drawSnake(
            b,
            b.body
        );

    }

    for(
        const p of remotePlayers.values()
    ){

        drawSnake(
            p,
            p.body
        );

    }

    drawSnake(
        me,
        body
    );

    ctx.restore();

    drawMinimap();

}

/* WORLD */

function drawWorld(){

    /*
       suur kaart
    */

    ctx.fillStyle =
        "#102414";

    ctx.fillRect(
        0,
        0,
        WORLD,
        WORLD
    );

    /*
       ruudud
    */

    ctx.fillStyle =
        "#132a17";

    for(
        let x=0;
        x<WORLD;
        x+=500
    ){

        for(
            let y=0;
            y<WORLD;
            y+=500
        ){

            ctx.fillRect(
                x+4,
                y+4,
                492,
                492
            );

        }

    }

    /*
       teed
    */

    ctx.fillStyle =
        "#243b28";

    for(
        let x=500;
        x<WORLD;
        x+=2500
    ){

        ctx.fillRect(
            x,
            0,
            180,
            WORLD
        );

    }

    for(
        let y=700;
        y<WORLD;
        y+=2500
    ){

        ctx.fillRect(
            0,
            y,
            WORLD,
            180
        );

    }

    /*
       grid
    */

    ctx.fillStyle =
        "rgba(99,255,120,.07)";

    for(
        let x=0;
        x<WORLD;
        x+=100
    ){

        ctx.fillRect(
            x,
            0,
            1,
            WORLD
        );

    }

    for(
        let y=0;
        y<WORLD;
        y+=100
    ){

        ctx.fillRect(
            0,
            y,
            WORLD,
            1
        );

    }

    drawFood();

    /*
       border
    */

    ctx.strokeStyle =
        "#63ff78";

    ctx.lineWidth = 20;

    ctx.shadowColor =
        "#63ff78";

    ctx.shadowBlur = 25;

    ctx.strokeRect(
        0,
        0,
        WORLD,
        WORLD
    );

    ctx.shadowBlur = 0;

}

/* FOOD DRAW */

function drawFood(){

    for(const f of foods){

        if(
            Math.abs(f.x-me.x) >
                W/2+150 ||
            Math.abs(f.y-me.y) >
                H/2+150
        )
            continue;

        ctx.fillStyle =
            f.color;

        ctx.shadowColor =
            f.color;

        ctx.shadowBlur = 10;

        ctx.beginPath();

        ctx.arc(
            f.x,
            f.y,
            f.radius,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.shadowBlur=0;

}

/* SNAKE */

function drawSnake(
    snake,
    parts
){

    if(
        !parts ||
        parts.length===0
    )
        return;

    /*
       keha
    */

    for(
        let i=parts.length-1;
        i>=0;
        i--
    ){

        const p=parts[i];

        const fade =
            i / parts.length;

        const radius =
            9 +
            (1-fade)*8;

        ctx.globalAlpha =
            .98 -
            fade*.15;

        ctx.fillStyle =
            snake.color;

        ctx.shadowColor =
            snake.color;

        ctx.shadowBlur =
            i<10 ? 10 : 3;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            radius,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.fillStyle =
            "rgba(255,255,255,.16)";

        ctx.beginPath();

        ctx.arc(
            p.x-radius*.3,
            p.y-radius*.3,
            radius*.2,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.globalAlpha=1;

    ctx.shadowBlur=0;

    /*
       pea
    */

    ctx.save();

    ctx.translate(
        snake.x,
        snake.y
    );

    ctx.rotate(
        snake.angle
    );

    ctx.fillStyle =
        snake.color;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        24,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
       silmad
    */

    ctx.fillStyle="white";

    ctx.beginPath();

    ctx.ellipse(
        10,
        -8,
        7,
        6,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.ellipse(
        10,
        8,
        7,
        6,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#111";

    ctx.beginPath();

    ctx.arc(
        12,
        -8,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        12,
        8,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
       keel
    */

    ctx.strokeStyle="#ff6070";

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(
        20,
        0
    );

    ctx.lineTo(
        36,
        0
    );

    ctx.stroke();

    ctx.restore();

    /*
       nimi
    */

    ctx.save();

    ctx.textAlign="center";

    ctx.font="bold 14px Arial";

    ctx.fillStyle="white";

    ctx.strokeStyle="rgba(0,0,0,.8)";

    ctx.lineWidth=4;

    ctx.strokeText(
        snake.name || "Player",
        snake.x,
        snake.y-38
    );

    ctx.fillText(
        snake.name || "Player",
        snake.x,
        snake.y-38
    );

    ctx.restore();

}

/* MINIMAP */

function drawMinimap(){

    const S=400;

    miniCtx.clearRect(
        0,
        0,
        S,
        S
    );

    /*
       kogu suur kaart
    */

    miniCtx.fillStyle =
        "#102414";

    miniCtx.fillRect(
        0,
        0,
        S,
        S
    );

    /*
       ruudustik
    */

    miniCtx.fillStyle =
        "#16331b";

    for(
        let x=0;
        x<S;
        x+=20
    ){

        for(
            let y=0;
            y<S;
            y+=20
        ){

            miniCtx.fillRect(
                x+1,
                y+1,
                18,
                18
            );

        }

    }

    /*
       teed
    */

    miniCtx.fillStyle =
        "#29432c";

    for(
        let x=500;
        x<WORLD;
        x+=2500
    ){

        miniCtx.fillRect(
            x/WORLD*S,
            0,
            180/WORLD*S,
            S
        );

    }

    for(
        let y=700;
        y<WORLD;
        y+=2500
    ){

        miniCtx.fillRect(
            0,
            y/WORLD*S,
            S,
            180/WORLD*S
        );

    }

    /*
       toit
    */

    miniCtx.fillStyle =
        "#ffd84d";

    for(
        let i=0;
        i<foods.length;
        i+=10
    ){

        const f=foods[i];

        miniCtx.beginPath();

        miniCtx.arc(
            f.x/WORLD*S,
            f.y/WORLD*S,
            1.8,
            0,
            Math.PI*2
        );

        miniCtx.fill();

    }

    /*
       BOTID
    */

    for(
        const b of bots
    ){

        drawMiniPoint(
            b.x,
            b.y,
            "#ff5268",
            6
        );

    }

    /*
       MULTIPLAYER
    */

    for(
        const p of remotePlayers.values()
    ){

        drawMiniPoint(
            p.x,
            p.y,
            "#4da6ff",
            7
        );

    }

    /*
       SINA
    */

    drawMiniPoint(
        me.x,
        me.y,
        "#63ff78",
        10
    );

    /*
       sinu suund
    */

    const mx =
        me.x/WORLD*S;

    const my =
        me.y/WORLD*S;

    miniCtx.strokeStyle =
        "#fff";

    miniCtx.lineWidth=2;

    miniCtx.beginPath();

    miniCtx.moveTo(
        mx,
        my
    );

    miniCtx.lineTo(
        mx+
        Math.cos(me.angle)*18,
        my+
        Math.sin(me.angle)*18
    );

    miniCtx.stroke();

    /*
       border
    */

    miniCtx.strokeStyle =
        "#63ff78";

    miniCtx.lineWidth=4;

    miniCtx.strokeRect(
        2,
        2,
        S-4,
        S-4
    );

}

/* MINIMAP POINT */

function drawMiniPoint(
    x,
    y,
    color,
    radius
){

    const px =
        x/WORLD*400;

    const py =
        y/WORLD*400;

    miniCtx.fillStyle =
        "rgba(0,0,0,.65)";

    miniCtx.beginPath();

    miniCtx.arc(
        px,
        py,
        radius+3,
        0,
        Math.PI*2
    );

    miniCtx.fill();

    miniCtx.fillStyle =
        color;

    miniCtx.beginPath();

    miniCtx.arc(
        px,
        py,
        radius,
        0,
        Math.PI*2
    );

    miniCtx.fill();

}

/* HUD */

function updateHUD(){

    document.getElementById(
        "score"
    ).textContent =
        Math.floor(me.score);

    document.getElementById(
        "kills"
    ).textContent =
        me.kills;

    document.getElementById(
        "length"
    ).textContent =
        Math.floor(me.length);

    document.getElementById(
        "coins"
    ).textContent =
        coins;

    updateLeaderboard();

}

function updateLeaderboard(){

    const all = [

        {
            name:me.name,
            score:me.score,
            color:me.color
        }

    ];

    for(const b of bots){

        all.push({

            name:b.name,
            score:b.score,
            color:b.color

        });

    }

    for(
        const p of remotePlayers.values()
    ){

        all.push({

            name:p.name,
            score:p.score || 0,
            color:p.color || "#4da6ff"

        });

    }

    all.sort(
        (a,b) =>
            b.score-a.score
    );

    const box =
        document.getElementById(
            "lbRows"
        );

    box.innerHTML="";

    all.slice(0,3).forEach(
        (p,i) => {

            const row =
                document.createElement(
                    "div"
                );

            row.className="lbRow";

            row.innerHTML = `
                <span style="color:${p.color}">
                    ${i+1}. ${escapeHTML(p.name)}
                </span>
                <b>${Math.floor(p.score)}</b>
            `;

            box.appendChild(row);

        }
    );

}

function escapeHTML(str){

    return String(str)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;");

}

/* DEATH */

function die(reason){

    if(dead)
        return;

    dead=true;
    running=false;

    document.getElementById(
        "deathReason"
    ).textContent =
        reason;

    document.getElementById(
        "finalScore"
    ).textContent =
        Math.floor(me.score);

    document.getElementById(
        "finalKills"
    ).textContent =
        me.kills;

    document.getElementById(
        "gameOver"
    ).style.display =
        "flex";

}

/* KILL TEXT */

function showKill(){

    const el =
        document.getElementById(
            "killText"
        );

    el.classList.add("show");

    setTimeout(
        () => {

            el.classList.remove(
                "show"
            );

        },
        700
    );

}

/* COINS */

function saveCoins(){

    localStorage.setItem(
        "snakeCoins",
        String(coins)
    );

}

function updateCoins(){

    document.getElementById(
        "coinValue"
    ).textContent =
        coins;

    document.getElementById(
        "coins"
    ).textContent =
        coins;

}

/* SKINS */

function saveSkins(){

    localStorage.setItem(
        "snakeOwned",
        JSON.stringify(owned)
    );

    localStorage.setItem(
        "snakeSkin",
        selectedSkin
    );

}

function renderSkins(){

    const box =
        document.getElementById(
            "skins"
        );

    box.innerHTML="";

    for(const skin of SKINS){

        if(
            !owned.includes(
                skin.id
            )
        )
            continue;

        const button =
            document.createElement(
                "button"
            );

        button.className =
            "skin " +
            (
                selectedSkin === skin.id
                    ? "selected"
                    : ""
            );

        button.style.background =
            skin.color;

        button.onclick = () => {

            selectedSkin =
                skin.id;

            selected = skin;

            me.color =
                skin.color;

            me.skin =
                skin.id;

            saveSkins();

            renderSkins();
            renderShop();

        };

        box.appendChild(
            button
        );

    }

}

/* SHOP */

function renderShop(){

    const grid =
        document.getElementById(
            "shopGrid"
        );

    grid.innerHTML="";

    for(const skin of SKINS){

        const have =
            owned.includes(
                skin.id
            );

        const item =
            document.createElement(
                "div"
            );

        item.className =
            "shopItem";

        item.innerHTML = `

            <div
                class="preview"
                style="
                    background:${skin.color};
                    box-shadow:
                    0 0 18px ${skin.color};
                "
            ></div>

            <b>${skin.id.toUpperCase()}</b>

            <div
                style="
                color:#ffd84d;
                margin-top:5px"
            >
                ${
                    skin.price === 0
                    ? "TASUTA"
                    : "🪙 " + skin.price
                }
            </div>

            <button>
                ${
                    have
                    ? "✓ KASUTA"
                    : "OSTA"
                }
            </button>
        `;

        item
            .querySelector("button")
            .onclick = () => {

                if(have){

                    selectedSkin =
                        skin.id;

                    selected =
                        skin;

                    me.color =
                        skin.color;

                    me.skin =
                        skin.id;

                    saveSkins();

                    renderSkins();
                    renderShop();

                    return;

                }

                if(
                    coins <
                    skin.price
                ){

                    alert(
                        "Sul pole piisavalt coine!"
                    );

                    return;

                }

                coins -=
                    skin.price;

                owned.push(
                    skin.id
                );

                selectedSkin =
                    skin.id;

                selected =
                    skin;

                me.color =
                    skin.color;

                me.skin =
                    skin.id;

                saveCoins();
                saveSkins();

                updateCoins();

                renderSkins();
                renderShop();

            };

        grid.appendChild(item);

    }

}

document.getElementById(
    "shopBtn"
).onclick = () => {

    document.getElementById(
        "main"
    ).style.display = "none";

    document.getElementById(
        "shop"
    ).style.display = "block";

    renderShop();

};

document.getElementById(
    "closeShop"
).onclick = () => {

    document.getElementById(
        "shop"
    ).style.display = "none";

    document.getElementById(
        "main"
    ).style.display = "block";

};

/* ROOM PLAYERS */

function updateRoomPlayers(players){

    const box =
        document.getElementById(
            "roomPlayers"
        );

    box.innerHTML="";

    for(const p of players){

        const div =
            document.createElement(
                "div"
            );

        div.style.padding="5px";
        div.style.background="#122015";
        div.style.margin="3px";
        div.style.borderRadius="7px";

        div.textContent =
            p.name +
            (
                p.id === myServerId
                    ? " ⭐"
                    : ""
            );

        box.appendChild(div);

    }

}

/* ERROR */

function showError(text){

    document.getElementById(
        "error"
    ).textContent =
        text || "Viga";

}

/* SAVE NAME */

const nameInput =
    document.getElementById(
        "name"
    );

nameInput.value =
    localStorage.getItem(
        "snakeName"
    ) || "";

nameInput.addEventListener(
    "input",
    () => {

        localStorage.setItem(
            "snakeName",
            nameInput.value
        );

    }
);

/* INIT */

renderSkins();
renderShop();
updateCoins();
connectServer();

/* LOOP */

function loop(){

    update();
    draw();

    requestAnimationFrame(
        loop
    );

}

loop();

</script>
