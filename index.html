<!DOCTYPE html>
<html lang="et">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Snake Online 🐍</title>

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
touch-action:none;
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#020604;
font-family:Arial,sans-serif;
color:white;
}

#game{
position:fixed;
inset:0;
width:100vw;
height:100vh;
background:#06120a;
}

#menu{
position:fixed;
inset:0;
z-index:20;

display:flex;
align-items:center;
justify-content:center;

background:
radial-gradient(
circle,
rgba(30,100,45,.5),
rgba(0,0,0,.97)
);
}

.card{
width:min(92vw,430px);

padding:25px;

border-radius:25px;

background:rgba(7,22,12,.97);

border:1px solid #32814b;

box-shadow:
0 20px 80px rgba(0,0,0,.7);

text-align:center;
}

.logo{
font-size:75px;

filter:
drop-shadow(
0 0 20px #40ff76
);
}

h1{
font-size:40px;

margin:0 0 18px;

color:#5cff8c;

text-shadow:
0 0 20px #35ff70;
}

input,select{

width:100%;

padding:15px;

margin:6px 0;

border-radius:13px;

border:1px solid #285c39;

background:#061009;

color:white;

font-size:18px;

text-align:center;

outline:none;

}

button{

border:0;

border-radius:14px;

padding:15px;

font-size:18px;

font-weight:bold;

cursor:pointer;

}

.create{

width:100%;

margin-top:8px;

background:#3be174;

color:#031008;

}

.join{

width:100%;

margin-top:8px;

background:#3e91ff;

color:white;

}

#connection{

margin-top:12px;

font-size:14px;

color:#aaa;

}

#hud{

position:fixed;

top:10px;

left:50%;

transform:translateX(-50%);

z-index:5;

display:flex;

gap:7px;

pointer-events:none;
}

.stat{

min-width:75px;

padding:7px 11px;

border-radius:13px;

background:rgba(4,14,7,.78);

border:1px solid rgba(70,255,120,.3);

backdrop-filter:blur(8px);

text-align:center;
}

.stat small{

display:block;

color:#8fa693;

font-size:10px;

}

.stat b{

font-size:18px;

}

#room{

position:fixed;

top:75px;

left:50%;

transform:translateX(-50%);

z-index:5;

display:none;

padding:7px 15px;

background:rgba(4,14,7,.82);

border:1px solid rgba(70,255,120,.3);

border-radius:13px;

text-align:center;

pointer-events:none;
}

#roomCode{

font-size:25px;

font-weight:bold;

letter-spacing:5px;

color:#60ff92;
}

#players{

font-size:12px;

color:#aaa;

margin-top:3px;
}

#message{

font-size:12px;

color:#8cffaa;

margin-top:3px;
}

#controls{

position:fixed;

left:18px;

bottom:20px;

width:175px;

height:175px;

z-index:10;

}

.ctrl{

position:absolute;

width:58px;

height:58px;

border-radius:18px;

background:rgba(16,50,27,.82);

border:1px solid rgba(100,255,140,.35);

display:flex;

align-items:center;

justify-content:center;

font-size:27px;

color:white;

user-select:none;

}

.ctrl:active{

background:#2c7b43;

transform:scale(.9);

}

.up{
left:58px;
top:0;
}

.left{
left:0;
top:58px;
}

.down{
left:58px;
top:116px;
}

.right{
left:116px;
top:58px;
}

#boost{

position:fixed;

right:20px;

bottom:35px;

z-index:10;

width:82px;

height:82px;

border-radius:50%;

background:
radial-gradient(
circle,
#3e9cff,
#1858a0
);

border:2px solid #83c8ff;

color:white;

font-size:28px;

box-shadow:
0 0 30px rgba(50,150,255,.45);
}

#boost:active{

transform:scale(.9);

}

#death{

display:none;

position:fixed;

inset:0;

z-index:30;

align-items:center;

justify-content:center;

background:rgba(0,0,0,.72);

text-align:center;
}

.deathCard{

background:#0b180f;

border:1px solid #39784a;

border-radius:22px;

padding:30px;

}

.deathCard h2{

font-size:40px;

margin:0;
}

@media(min-width:800px){

#controls,
#boost{

opacity:.7;

}

}

</style>

</head>


<body>


<canvas id="game"></canvas>


<div id="menu">

<div class="card">

<div class="logo">🐍</div>

<h1>SNAKE ONLINE</h1>

<input
id="name"
maxlength="12"
placeholder="Sinu nimi">

<select id="mode">

<option value="classic">
🍎 Classic
</option>

<option value="battle">
⚔️ Battle
</option>

<option value="power">
⚡ Power Rush
</option>

<option value="maze">
🧱 Maze
</option>

<option value="last">
💀 Last Snake
</option>

</select>

<button
class="create"
onclick="createRoom()">

🟢 LOO TUBA

</button>

<input
id="roomInput"
maxlength="6"
placeholder="ROOM CODE">

<button
class="join"
onclick="joinRoom()">

🔵 LIITU TUPA

</button>

<div id="connection">
🟡 Ühendan serveriga...
</div>

</div>

</div>


<div id="hud">

<div class="stat">

<small>SCORE</small>

<b id="score">0</b>

</div>

<div class="stat">

<small>🪙 COINS</small>

<b id="coins">0</b>

</div>

<div class="stat">

<small>👥</small>

<b id="count">0</b>

</div>

</div>


<div id="room">

<div>ROOM</div>

<div id="roomCode">
------
</div>

<div id="players">
</div>

<div id="message">
</div>

</div>


<div id="controls">

<div
class="ctrl up"
data-dir="up">
⬆️
</div>

<div
class="ctrl left"
data-dir="left">
⬅️
</div>

<div
class="ctrl down"
data-dir="down">
⬇️
</div>

<div
class="ctrl right"
data-dir="right">
➡️
</div>

</div>


<button id="boost">
⚡
</button>


<div id="death">

<div class="deathCard">

<h2>💀</h2>

<p>Su uss sai pihta!</p>

<p>Respawn...</p>

</div>

</div>


<script>


/* =========================
SERVER
========================= */

const SERVER_URL =
"wss://snake-riu3.onrender.com";


let socket=null;

let myId=null;

let roomCode=null;


let state={

width:150,

height:150,

players:{},

food:[],

powerups:[],

walls:[],

mode:"classic"

};


/* =========================
CANVAS
========================= */

const canvas =
document.getElementById(
"game"
);

const ctx =
canvas.getContext("2d");

let W=innerWidth;

let H=innerHeight;


function resize(){

W=innerWidth;

H=innerHeight;

const dpr=
Math.min(
devicePixelRatio||1,
2
);

canvas.width=
Math.floor(W*dpr);

canvas.height=
Math.floor(H*dpr);

canvas.style.width=
W+"px";

canvas.style.height=
H+"px";

ctx.setTransform(
dpr,
0,
0,
dpr,
0,
0
);

}


addEventListener(
"resize",
resize
);

resize();


/* =========================
CONNECT
========================= */

function connect(){

socket =
new WebSocket(
SERVER_URL
);


socket.onopen=()=>{

document.getElementById(
"connection"
).textContent=
"🟢 Serveriga ühendatud!";

};


socket.onmessage=e=>{

let data;

try{

data=
JSON.parse(e.data);

}catch{

return;

}


if(data.type==="connected"){

myId=data.id;

}


if(
data.type==="roomCreated" ||
data.type==="roomJoined"
){

roomCode=data.room;

document.getElementById(
"menu"
).style.display=
"none";

document.getElementById(
"room"
).style.display=
"block";

document.getElementById(
"roomCode"
).textContent=
roomCode;

}


if(data.type==="state"){

state=data.state;

updateUI();

}


if(data.type==="start"){

document.getElementById(
"message"
).textContent=
"🔥 MÄNG ALGAS!";

}


if(data.type==="winner"){

alert(
"🏆 Võitja: "+
data.winner.name+
"\nScore: "+
data.winner.score
);

}


if(data.type==="error"){

alert(
data.message
);

}

};


socket.onerror=()=>{

document.getElementById(
"connection"
).textContent=
"🔴 Serveri viga";

};


socket.onclose=()=>{

document.getElementById(
"connection"
).textContent=
"🔴 Ühendus katkes";

};

}


/* =========================
SEND
========================= */

function send(data){

if(
socket &&
socket.readyState===
WebSocket.OPEN
){

socket.send(
JSON.stringify(data)
);

}

}


/* =========================
ROOM
========================= */

function createRoom(){

const name =
document.getElementById(
"name"
).value.trim();

const mode =
document.getElementById(
"mode"
).value;


if(!name){

alert(
"Kirjuta nimi!"
);

return;

}


send({

type:"createRoom",

name:name,

mode:mode

});

}


function joinRoom(){

const name =
document.getElementById(
"name"
).value.trim();

const room =
document.getElementById(
"roomInput"
).value
.trim()
.toUpperCase();


if(!name){

alert(
"Kirjuta nimi!"
);

return;

}


if(room.length!==6){

alert(
"Room Code peab olema 6 märki!"
);

return;

}


send({

type:"joinRoom",

name:name,

room:room

});

}


/* =========================
CONTROLS
========================= */

function direction(
dir
){

send({

type:"direction",

direction:dir

});

}


document
.querySelectorAll(".ctrl")
.forEach(
button=>{

let last=0;

function press(e){

if(e){

e.preventDefault();

e.stopPropagation();

}

const now=
Date.now();

if(
now-last<80
)
return;

last=now;

direction(
button.dataset.dir
);

}

button.addEventListener(
"touchstart",
press,
{
passive:false
}
);

button.addEventListener(
"mousedown",
press
);

}
);


/* =========================
BOOST
========================= */

document
.getElementById("boost")
.addEventListener(
"touchstart",
e=>{

e.preventDefault();

send({
type:"boost"
});

},
{
passive:false
}
);


document
.getElementById("boost")
.addEventListener(
"click",
()=>{

send({
type:"boost"
});

}
);


/* =========================
KEYBOARD
========================= */

document.addEventListener(
"keydown",
e=>{

const map={

ArrowUp:"up",

w:"up",

W:"up",

ArrowDown:"down",

s:"down",

S:"down",

ArrowLeft:"left",

a:"left",

A:"left",

ArrowRight:"right",

d:"right",

D:"right"

};


if(
map[e.key]
){

e.preventDefault();

direction(
map[e.key]
);

}


if(
e.code==="Space"
){

e.preventDefault();

send({
type:"boost"
});

}

}
);


/* =========================
UI
========================= */

function updateUI(){

const me =
state.players?.[
myId
];


if(me){

document.getElementById(
"score"
).textContent=
me.score;

document.getElementById(
"coins"
).textContent=
me.coins;


document.getElementById(
"death"
).style.display=
me.alive
?"none"
:"flex";

}


document.getElementById(
"count"
).textContent=
Object.keys(
state.players||{}
).length;


document.getElementById(
"players"
).textContent=
Object.values(
state.players||{}
)
.map(
p=>
"🐍 "+
p.name+
" "+p.score
)
.join(" • ");

}


/* =========================
CAMERA
========================= */

let camera={
x:0,
y:0
};


function getCamera(){

const me =
state.players?.[
myId
];


if(
!me ||
!me.snake ||
!me.snake.length
){

return camera;

}


const head =
me.snake[0];


/*
    maailma pikslites
*/

const WORLD_CELL=20;

const worldW=
state.width*
WORLD_CELL;

const worldH=
state.height*
WORLD_CELL;


/*
    KAAMERA ON ROHKEM ZOOM OUT
*/

let zoom=0.68;


/*
    pikema ussi puhul
    veel rohkem välja
*/

if(
me.snake.length>20
)
zoom=.60;

if(
me.snake.length>40
)
zoom=.53;

if(
me.snake.length>70
)
zoom=.47;


const viewW=
W/zoom;

const viewH=
H/zoom;


let targetX=
head.x*
WORLD_CELL+
WORLD_CELL/2-
viewW/2;


let targetY=
head.y*
WORLD_CELL+
WORLD_CELL/2-
viewH/2;


targetX=
Math.max(
0,
Math.min(
targetX,
worldW-viewW
)
);


targetY=
Math.max(
0,
Math.min(
targetY,
worldH-viewH
)
);


camera.x +=
(
targetX-camera.x
)*
.14;


camera.y +=
(
targetY-camera.y
)*
.14;


return {

x:camera.x,

y:camera.y,

zoom:zoom

};

}


/* =========================
DRAW
========================= */

function draw(){

requestAnimationFrame(
draw
);


ctx.clearRect(
0,
0,
W,
H
);


const cam=
getCamera();

const CELL=20;


ctx.save();


/*
    zoom around screen center
*/

ctx.translate(
W/2,
H/2
);

ctx.scale(
cam.zoom,
cam.zoom
);

ctx.translate(
-W/2,
-H/2
);


ctx.translate(
-cam.x,
-cam.y
);


/*
    maailma
*/

const worldW=
state.width*
CELL;

const worldH=
state.height*
CELL;


ctx.fillStyle=
"#07150c";

ctx.fillRect(
0,
0,
worldW,
worldH
);


/*
    grid
*/

ctx.strokeStyle=
"rgba(100,255,130,.045)";

ctx.lineWidth=1;


const startX=
Math.floor(
cam.x/CELL
)*CELL;

const startY=
Math.floor(
cam.y/CELL
)*CELL;


for(
let x=startX;
x<cam.x+W/cam.zoom+CELL;
x+=CELL
){

ctx.beginPath();

ctx.moveTo(
x,
cam.y
);

ctx.lineTo(
x,
cam.y+H/cam.zoom
);

ctx.stroke();

}


for(
let y=startY;
y<cam.y+H/cam.zoom+CELL;
y+=CELL
){

ctx.beginPath();

ctx.moveTo(
cam.x,
y
);

ctx.lineTo(
cam.x+W/cam.zoom,
y
);

ctx.stroke();

}


/*
    BORDER
*/

ctx.strokeStyle=
"#3ee878";

ctx.lineWidth=7;

ctx.strokeRect(
0,
0,
worldW,
worldH
);


/*
    WALLS
*/

(state.walls||[])
.forEach(
wall=>{

ctx.fillStyle=
"#3a493f";

ctx.fillRect(
wall.x*CELL,
wall.y*CELL,
CELL,
CELL
);

}
);


/*
    FOOD
*/

(state.food||[])
.forEach(
food=>{

const x=
food.x*CELL+
CELL/2;

const y=
food.y*CELL+
CELL/2;


ctx.shadowColor=
"#ff3155";

ctx.shadowBlur=18;

ctx.fillStyle=
"#ff3155";


ctx.beginPath();

ctx.arc(
x,
y,
CELL*.3,
0,
Math.PI*2
);

ctx.fill();

ctx.shadowBlur=0;

}
);


/*
    POWERUPS
*/

const colors={

speed:"#42a5ff",

shield:"#b65cff",

coin:"#ffd43b"

};


const icons={

speed:"⚡",

shield:"🛡️",

coin:"🪙"

};


(state.powerups||[])
.forEach(
power=>{

const x=
power.x*CELL+
CELL/2;

const y=
power.y*CELL+
CELL/2;


ctx.fillStyle=
colors[
power.type
];


ctx.shadowColor=
ctx.fillStyle;

ctx.shadowBlur=15;


ctx.beginPath();

ctx.arc(
x,
y,
CELL*.38,
0,
Math.PI*2
);

ctx.fill();

ctx.shadowBlur=0;


ctx.font=
"14px Arial";

ctx.textAlign=
"center";

ctx.textBaseline=
"middle";

ctx.fillStyle="#06120a";

ctx.fillText(
icons[
power.type
],
x,
y
);

}
);


/*
    SNAKES
*/

Object.values(
state.players||{}
)
.forEach(
player=>{

if(!player.snake)
return;


player.snake.forEach(
(part,index)=>{

let color=
player.color;


if(
player.id===myId
){

color=
"#55ff83";

if(
player.boost>0
){

color=
"#5aaeff";

}

}


ctx.fillStyle=
color;

ctx.shadowColor=
color;

ctx.shadowBlur=
index===0
?18
:5;


ctx.beginPath();

ctx.roundRect(
part.x*CELL+2,
part.y*CELL+2,
CELL-4,
CELL-4,
6
);

ctx.fill();

ctx.shadowBlur=0;


/*
    silmad
*/

if(index===0){

ctx.fillStyle=
"#06120a";


ctx.beginPath();

ctx.arc(
part.x*CELL+6,
part.y*CELL+6,
2.5,
0,
Math.PI*2
);

ctx.fill();


ctx.beginPath();

ctx.arc(
part.x*CELL+14,
part.y*CELL+6,
2.5,
0,
Math.PI*2
);

ctx.fill();


/*
    shield ring
*/

if(player.shield){

ctx.strokeStyle=
"#b65cff";

ctx.lineWidth=3;

ctx.beginPath();

ctx.arc(
part.x*CELL+10,
part.y*CELL+10,
13,
0,
Math.PI*2
);

ctx.stroke();

}

}

}
);

});


ctx.restore();

}


/* =========================
START
========================= */

connect();

draw();

</script>

</body>
</html>
