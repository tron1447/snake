<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Worm Arena</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#071008;
  font-family:Arial,sans-serif;
  touch-action:none;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}

#menu{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle,#245d2c,#071008 70%);
}

.panel{
  width:min(420px,94vw);
  padding:26px;
  border-radius:25px;
  background:rgba(5,12,6,.97);
  border:1px solid #376e3e;
  color:white;
  text-align:center;
  box-shadow:0 20px 80px #000;
}

.logo{
  font-size:65px;
}

h1{
  color:#61ff73;
  font-size:38px;
}

.sub{
  color:#879b8a;
  margin:7px 0 20px;
}

input{
  width:100%;
  height:48px;
  margin:5px 0;
  border-radius:12px;
  border:1px solid #355e3a;
  background:#111a12;
  color:white;
  text-align:center;
  font-size:16px;
}

button{
  width:100%;
  height:48px;
  margin-top:8px;
  border:0;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
}

.green{
  background:#61ff73;
  color:#061008;
}

.dark{
  background:#172319;
  color:white;
  border:1px solid #385e3d;
}

#roomBox{
  display:none;
  margin-top:12px;
  padding:13px;
  background:#101a11;
  border-radius:13px;
}

#roomCode{
  color:#61ff73;
  font-size:32px;
  font-weight:bold;
  letter-spacing:6px;
}

#players{
  margin-top:10px;
  line-height:22px;
}

#error{
  min-height:22px;
  margin-top:8px;
  color:#ff6470;
}

#hud{
  display:none;
  position:fixed;
  z-index:20;
  top:10px;
  left:10px;
  gap:7px;
}

.stat{
  background:rgba(0,0,0,.72);
  border:1px solid #345e39;
  border-radius:10px;
  padding:7px 11px;
  color:white;
}

.stat small{
  display:block;
  color:#829583;
  font-size:9px;
}

#leaderboard{
  display:none;
  position:fixed;
  z-index:20;
  top:10px;
  right:10px;
  width:190px;
  padding:10px;
  border-radius:13px;
  background:rgba(0,0,0,.75);
  border:1px solid #345e39;
  color:white;
}

.lbtitle{
  color:#61ff73;
  font-weight:bold;
  margin-bottom:4px;
}

.row{
  display:flex;
  justify-content:space-between;
  padding:4px;
  font-size:12px;
}

#minimap{
  display:none;
  position:fixed;
  z-index:20;
  right:10px;
  bottom:10px;
  width:160px;
  height:160px;
  border:2px solid #61ff73;
  border-radius:14px;
  background:#0c1b0e;
}

#mini{
  width:100%;
  height:100%;
}

#stickArea{
  display:none;
  position:fixed;
  z-index:30;
  left:20px;
  bottom:20px;
  width:130px;
  height:130px;
  border-radius:50%;
  background:rgba(97,255,115,.08);
  border:2px solid rgba(97,255,115,.35);
}

#stick{
  position:absolute;
  left:50%;
  top:50%;
  width:55px;
  height:55px;
  border-radius:50%;
  background:#61ff73;
  border:3px solid white;
  transform:translate(-50%,-50%);
}

#boost{
  display:none;
  position:fixed;
  z-index:30;
  right:25px;
  bottom:28px;
  width:82px;
  height:82px;
  border-radius:50%;
  background:#087db5;
  color:white;
  border:3px solid #bceeff;
  font-size:28px;
}

#dead{
  display:none;
  position:fixed;
  inset:0;
  z-index:200;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.8);
}

.deadBox{
  width:min(380px,90vw);
  padding:30px;
  border-radius:20px;
  background:#0b160c;
  border:1px solid #396740;
  color:white;
  text-align:center;
}

.deadBox h2{
  color:#ff5a6c;
  font-size:40px;
}

@media(max-width:800px){
  #stickArea,#boost{
    display:block;
  }

  #leaderboard{
    width:150px;
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="menu">
  <div class="panel">

    <div class="logo">🪱</div>

    <h1>WORM ARENA</h1>

    <div class="sub">
      Grow • Eat • Boost • Survive
    </div>

    <input id="name" maxlength="16" placeholder="Sinu nimi">

    <button class="green" id="single">
      🤖 SINGLEPLAYER
    </button>

    <button class="dark" id="create">
      🏠 LOO ROOM
    </button>

    <input id="room" maxlength="5" placeholder="ROOM CODE">

    <button class="dark" id="join">
      🚪 LIITU ROOMI
    </button>

    <div id="roomBox">
      <div>ROOM</div>

      <div id="roomCode">-----</div>

      <div id="players"></div>

      <button class="green" id="start">
        ▶ ALUSTA
      </button>
    </div>

    <div id="error"></div>

  </div>
</div>

<div id="hud">

  <div class="stat">
    <small>SCORE</small>
    <b id="score">0</b>
  </div>

  <div class="stat">
    <small>KILLS</small>
    <b id="kills">0</b>
  </div>

  <div class="stat">
    <small>LENGTH</small>
    <b id="length">55</b>
  </div>

</div>

<div id="leaderboard">
  <div class="lbtitle">🏆 TOP 3</div>
  <div id="lb"></div>
</div>

<div id="minimap">
  <canvas id="mini"></canvas>
</div>

<div id="stickArea">
  <div id="stick"></div>
</div>

<button id="boost">⚡</button>

<div id="dead">

  <div class="deadBox">

    <h2>GAME OVER</h2>

    <p id="deadReason">
      Sinu uss sai otsa!
    </p>

    <br>

    <p>
      Score:
      <b id="finalScore">0</b>
    </p>

    <p>
      Kills:
      <b id="finalKills">0</b>
    </p>

    <button class="green" onclick="location.reload()">
      🔄 UUESTI
    </button>

  </div>

</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const mini=document.getElementById("mini");
const mctx=mini.getContext("2d");

let W=innerWidth;
let H=innerHeight;

canvas.width=W;
canvas.height=H;

mini.width=400;
mini.height=400;

addEventListener("resize",()=>{
  W=innerWidth;
  H=innerHeight;

  canvas.width=W;
  canvas.height=H;
});

const WORLD=10000;

let running=false;
let single=false;
let dead=false;

const player={
  id:null,
  name:localStorage.getItem("wormName")||"Player",

  x:WORLD/2,
  y:WORLD/2,

  angle:0,
  targetAngle:0,

  length:55,
  score:0,
  kills:0,

  color:"#61ff73",

  body:[]
};

document.getElementById("name").value=player.name;

document.getElementById("name").oninput=e=>{
  player.name=e.target.value
    .replace(/[<>]/g,"")
    .slice(0,16);

  localStorage.setItem(
    "wormName",
    player.name
  );
};

const colors=[
  "#61ff73",
  "#4da3ff",
  "#ff5269",
  "#ffd84d",
  "#b86cff",
  "#ff914d",
  "#00dfc4",
  "#ff63c8"
];

function randomColor(){
  return colors[
    Math.floor(Math.random()*colors.length)
  ];
}

function resetPlayer(){

  player.x=
    1200+
    Math.random()*7600;

  player.y=
    1200+
    Math.random()*7600;

  player.angle=
    Math.random()*Math.PI*2;

  player.targetAngle=
    player.angle;

  player.length=55;
  player.score=0;
  player.kills=0;

  player.body=[];

  for(let i=0;i<55;i++){

    player.body.push({
      x:
        player.x-
        Math.cos(player.angle)*i*8,

      y:
        player.y-
        Math.sin(player.angle)*i*8
    });

  }
}

/* FOOD */

const food=[];

function makeFood(){

  return {
    x:100+Math.random()*9800,
    y:100+Math.random()*9800,
    r:4+Math.random()*4,
    value:1+Math.floor(Math.random()*4),
    color:randomColor()
  };
}

for(let i=0;i<700;i++){
  food.push(makeFood());
}

/* BOTS */

const bots=[];

const botNames=[
  "Shadow",
  "Viper",
  "Blaze",
  "Ghost",
  "Python",
  "Storm",
  "Ninja",
  "Cobra",
  "Turbo",
  "Venom",
  "Rocket",
  "Pixel"
];

function createBot(){

  const b={

    id:
      Math.random()
      .toString(36)
      .slice(2),

    name:
      botNames[
        Math.floor(
          Math.random()*botNames.length
        )
      ],

    x:
      700+
      Math.random()*8600,

    y:
      700+
      Math.random()*8600,

    angle:
      Math.random()*Math.PI*2,

    target:0,

    length:
      40+
      Math.random()*100,

    score:0,

    color:randomColor(),

    body:[],

    timer:0

  };

  b.target=b.angle;

  for(
    let i=0;
    i<b.length;
    i++
  ){

    b.body.push({
      x:
        b.x-
        Math.cos(b.angle)*i*8,

      y:
        b.y-
        Math.sin(b.angle)*i*8
    });

  }

  return b;
}

function createBots(){

  bots.length=0;

  for(let i=0;i<14;i++){
    bots.push(createBot());
  }
}

/* INPUT */

let mouseX=W/2;
let mouseY=H/2;
let boosting=false;

addEventListener("mousemove",e=>{
  mouseX=e.clientX;
  mouseY=e.clientY;
});

addEventListener("keydown",e=>{

  if(e.code==="Space"){
    boosting=true;
  }

  if(e.key.toLowerCase()==="w" || e.key==="ArrowUp"){
    player.targetAngle=-Math.PI/2;
  }

  if(e.key.toLowerCase()==="s" || e.key==="ArrowDown"){
    player.targetAngle=Math.PI/2;
  }

  if(e.key.toLowerCase()==="a" || e.key==="ArrowLeft"){
    player.targetAngle=Math.PI;
  }

  if(e.key.toLowerCase()==="d" || e.key==="ArrowRight"){
    player.targetAngle=0;
  }
});

addEventListener("keyup",e=>{
  if(e.code==="Space"){
    boosting=false;
  }
});

/* MOBILE */

const stickArea=
document.getElementById("stickArea");

const stick=
document.getElementById("stick");

let joystick=false;

function joystickMove(x,y){

  const r=
    stickArea.getBoundingClientRect();

  const cx=r.left+r.width/2;
  const cy=r.top+r.height/2;

  let dx=x-cx;
  let dy=y-cy;

  const max=50;

  const d=Math.hypot(dx,dy);

  if(d>max){
    dx=dx/d*max;
    dy=dy/d*max;
  }

  stick.style.left=
    `calc(50% + ${dx}px)`;

  stick.style.top=
    `calc(50% + ${dy}px)`;

  if(d>7){
    player.targetAngle=
      Math.atan2(dy,dx);
  }
}

stickArea.addEventListener(
  "pointerdown",
  e=>{
    joystick=true;

    stickArea.setPointerCapture(
      e.pointerId
    );

    joystickMove(
      e.clientX,
      e.clientY
    );
  }
);

stickArea.addEventListener(
  "pointermove",
  e=>{
    if(joystick){
      joystickMove(
        e.clientX,
        e.clientY
      );
    }
  }
);

function stopJoystick(){

  joystick=false;

  stick.style.left="50%";
  stick.style.top="50%";
}

stickArea.addEventListener(
  "pointerup",
  stopJoystick
);

stickArea.addEventListener(
  "pointercancel",
  stopJoystick
);

const boostButton=
document.getElementById("boost");

boostButton.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();
    boosting=true;
  }
);

boostButton.addEventListener(
  "pointerup",
  ()=>{
    boosting=false;
  }
);

boostButton.addEventListener(
  "pointercancel",
  ()=>{
    boosting=false;
  }
);

/* PLAYER */

function updatePlayer(){

  let d=
    player.targetAngle-
    player.angle;

  while(d>Math.PI)
    d-=Math.PI*2;

  while(d<-Math.PI)
    d+=Math.PI*2;

  player.angle+=d*.17;

  let speed=7;

  if(
    boosting &&
    player.length>45
  ){

    speed=11;
    player.length-=.08;

  }

  player.x+=
    Math.cos(player.angle)*speed;

  player.y+=
    Math.sin(player.angle)*speed;

  if(
    player.x<50 ||
    player.x>WORLD-50 ||
    player.y<50 ||
    player.y>WORLD-50
  ){

    die(
      "Läksid vastu seina!"
    );

    return;

  }

  player.body.unshift({
    x:player.x,
    y:player.y
  });

  while(
    player.body.length<
    Math.floor(player.length)
  ){

    const last=
      player.body[
        player.body.length-1
      ];

    player.body.push({
      x:last.x,
      y:last.y
    });

  }

  while(
    player.body.length>
    Math.floor(player.length)
  ){

    player.body.pop();

  }

  eatFood(player);
}

/* FOOD */

function eatFood(snake){

  for(
    let i=food.length-1;
    i>=0;
    i--
  ){

    const f=food[i];

    if(
      Math.hypot(
        snake.x-f.x,
        snake.y-f.y
      )<27
    ){

      snake.score+=f.value;
      snake.length+=
        f.value*.65;

      food.splice(i,1);
      food.push(makeFood());

    }
  }
}

/* BOT UPDATE */

function updateBots(){

  for(const b of bots){

    b.timer--;

    if(b.timer<=0){

      b.timer=
        20+
        Math.random()*70;

      let closest=null;
      let best=Infinity;

      for(
        let i=0;
        i<food.length;
        i+=5
      ){

        const f=food[i];

        const d=
          Math.hypot(
            b.x-f.x,
            b.y-f.y
          );

        if(d<best){
          best=d;
          closest=f;
        }

      }

      if(closest){

        b.target=
          Math.atan2(
            closest.y-b.y,
            closest.x-b.x
          );

      }

    }

    let d=
      b.target-b.angle;

    while(d>Math.PI)
      d-=Math.PI*2;

    while(d<-Math.PI)
      d+=Math.PI*2;

    b.angle+=d*.06;

    b.x+=
      Math.cos(b.angle)*5.5;

    b.y+=
      Math.sin(b.angle)*5.5;

    if(b.x<100 || b.x>WORLD-100){
      b.target=Math.PI-b.target;
    }

    if(b.y<100 || b.y>WORLD-100){
      b.target=-b.target;
    }

    b.body.unshift({
      x:b.x,
      y:b.y
    });

    while(
      b.body.length<
      Math.floor(b.length)
    ){

      const last=
        b.body[
          b.body.length-1
        ];

      b.body.push({
        x:last.x,
        y:last.y
      });

    }

    while(
      b.body.length>
      Math.floor(b.length)
    ){

      b.body.pop();

    }

    eatFood(b);
  }
}

/* COLLISIONS */

function collision(){

  /* player head -> bot body */

  for(
    let bi=bots.length-1;
    bi>=0;
    bi--
  ){

    const b=bots[bi];

    for(
      let i=8;
      i<b.body.length;
      i+=2
    ){

      if(
        Math.hypot(
          player.x-b.body[i].x,
          player.y-b.body[i].y
        )<29
      ){

        killBot(bi);
        break;

      }
    }
  }

  /* bot head -> player body */

  for(
    let bi=bots.length-1;
    bi>=0;
    bi--
  ){

    const b=bots[bi];

    for(
      let i=8;
      i<player.body.length;
      i+=2
    ){

      if(
        Math.hypot(
          b.x-player.body[i].x,
          b.y-player.body[i].y
        )<29
      ){

        dropFood(b);

        bots.splice(bi,1);

        player.kills++;
        player.score+=100;
        player.length+=15;

        setTimeout(()=>{
          if(running){
            bots.push(createBot());
          }
        },500);

        break;
      }
    }
  }
}

function killBot(index){

  const b=bots[index];

  if(!b) return;

  dropFood(b);

  bots.splice(index,1);

  player.kills++;
  player.score+=100;
  player.length+=15;

  setTimeout(()=>{
    if(running){
      bots.push(createBot());
    }
  },500);
}

function dropFood(snake){

  for(
    let i=0;
    i<snake.body.length;
    i+=3
  ){

    food.push({
      x:snake.body[i].x,
      y:snake.body[i].y,
      r:7,
      value:4,
      color:snake.color
    });

  }
}

/* WORM DRAWING */

function drawWorm(snake){

  if(
    !snake.body ||
    snake.body.length===0
  ){
    return;
  }

  /*
    BIG CONTINUOUS BODY
  */

  ctx.save();

  ctx.lineCap="round";
  ctx.lineJoin="round";

  /*
    outer body
  */

  ctx.beginPath();

  for(
    let i=snake.body.length-1;
    i>=0;
    i--
  ){

    const p=snake.body[i];

    if(i===snake.body.length-1){
      ctx.moveTo(p.x,p.y);
    }else{
      ctx.lineTo(p.x,p.y);
    }
  }

  ctx.strokeStyle="rgba(0,0,0,.35)";
  ctx.lineWidth=31;
  ctx.stroke();

  /*
    actual body
  */

  ctx.beginPath();

  for(
    let i=snake.body.length-1;
    i>=0;
    i--
  ){

    const p=snake.body[i];

    if(i===snake.body.length-1){
      ctx.moveTo(p.x,p.y);
    }else{
      ctx.lineTo(p.x,p.y);
    }
  }

  ctx.strokeStyle=snake.color;
  ctx.lineWidth=25;
  ctx.stroke();

  /*
    body highlight
  */

  ctx.beginPath();

  for(
    let i=snake.body.length-1;
    i>=0;
    i--
  ){

    const p=snake.body[i];

    if(i===snake.body.length-1){
      ctx.moveTo(p.x,p.y);
    }else{
      ctx.lineTo(p.x,p.y);
    }
  }

  ctx.strokeStyle="rgba(255,255,255,.16)";
  ctx.lineWidth=7;
  ctx.stroke();

  /*
    head
  */

  ctx.translate(
    snake.x,
    snake.y
  );

  ctx.rotate(
    snake.angle
  );

  ctx.fillStyle=snake.color;

  ctx.beginPath();

  ctx.ellipse(
    0,
    0,
    30,
    27,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  /*
    face
  */

  ctx.fillStyle="white";

  ctx.beginPath();

  ctx.arc(
    13,
    -10,
    8,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.arc(
    13,
    10,
    8,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle="#111";

  ctx.beginPath();

  ctx.arc(
    16,
    -10,
    4,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.arc(
    16,
    10,
    4,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();

  /*
    NAME
  */

  ctx.textAlign="center";

  ctx.font="bold 15px Arial";

  ctx.lineWidth=5;

  ctx.strokeStyle="rgba(0,0,0,.8)";

  ctx.strokeText(
    snake.name||"Player",
    snake.x,
    snake.y-40
  );

  ctx.fillStyle="white";

  ctx.fillText(
    snake.name||"Player",
    snake.x,
    snake.y-40
  );
}

/* DRAW */

function draw(){

  ctx.fillStyle="#071008";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

  if(!running) return;

  ctx.save();

  ctx.translate(
    W/2-player.x,
    H/2-player.y
  );

  /* WORLD */

  ctx.fillStyle="#102416";

  ctx.fillRect(
    0,
    0,
    WORLD,
    WORLD
  );

  /* GRID */

  ctx.strokeStyle=
    "rgba(255,255,255,.035)";

  const grid=120;

  const minX=
    Math.floor(
      (player.x-W/2)/grid
    )*grid;

  const maxX=
    Math.ceil(
      (player.x+W/2)/grid
    )*grid;

  for(
    let x=minX;
    x<=maxX;
    x+=grid
  ){

    ctx.beginPath();

    ctx.moveTo(
      x,
      player.y-H
    );

    ctx.lineTo(
      x,
      player.y+H
    );

    ctx.stroke();

  }

  const minY=
    Math.floor(
      (player.y-H/2)/grid
    )*grid;

  const maxY=
    Math.ceil(
      (player.y+H/2)/grid
    )*grid;

  for(
    let y=minY;
    y<=maxY;
    y+=grid
  ){

    ctx.beginPath();

    ctx.moveTo(
      player.x-W,
      y
    );

    ctx.lineTo(
      player.x+W,
      y
    );

    ctx.stroke();

  }

  /* FOOD */

  for(const f of food){

    if(
      Math.abs(f.x-player.x)>W/2+100 ||
      Math.abs(f.y-player.y)>H/2+100
    ){
      continue;
    }

    ctx.shadowBlur=12;
    ctx.shadowColor=f.color;

    ctx.fillStyle=f.color;

    ctx.beginPath();

    ctx.arc(
      f.x,
      f.y,
      f.r,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;
  }

  /* BOTS */

  for(const b of bots){
    drawWorm(b);
  }

  /* PLAYER */

  drawWorm(player);

  ctx.restore();

  drawMinimap();
}

/* MINIMAP */

function drawMinimap(){

  mctx.fillStyle="#0b1a0d";

  mctx.fillRect(
    0,
    0,
    400,
    400
  );

  for(const b of bots){

    mctx.fillStyle=b.color;

    mctx.beginPath();

    mctx.arc(
      b.x/WORLD*400,
      b.y/WORLD*400,
      5,
      0,
      Math.PI*2
    );

    mctx.fill();
  }

  mctx.fillStyle=player.color;

  mctx.beginPath();

  mctx.arc(
    player.x/WORLD*400,
    player.y/WORLD*400,
    8,
    0,
    Math.PI*2
  );

  mctx.fill();
}

/* TOP 3 */

function updateLeaderboard(){

  const list=[
    {
      name:player.name,
      score:player.score,
      color:player.color
    }
  ];

  for(const b of bots){

    list.push({
      name:b.name,
      score:b.score,
      color:b.color
    });

  }

  list.sort(
    (a,b)=>
      b.score-a.score
  );

  const lb=
    document.getElementById("lb");

  lb.innerHTML="";

  list.slice(0,3).forEach(
    (x,i)=>{

      const row=
        document.createElement("div");

      row.className="row";

      row.innerHTML=`
        <span style="color:${x.color}">
          ${i+1}. ${x.name}
        </span>
        <b>${Math.floor(x.score)}</b>
      `;

      lb.appendChild(row);
    }
  );
}

/* HUD */

function updateHUD(){

  document.getElementById(
    "score"
  ).textContent=
    Math.floor(player.score);

  document.getElementById(
    "kills"
  ).textContent=
    player.kills;

  document.getElementById(
    "length"
  ).textContent=
    Math.floor(player.length);

  updateLeaderboard();
}

/* DEATH */

function die(reason){

  if(dead) return;

  dead=true;
  running=false;

  document.getElementById(
    "deadReason"
  ).textContent=reason;

  document.getElementById(
    "finalScore"
  ).textContent=
    Math.floor(player.score);

  document.getElementById(
    "finalKills"
  ).textContent=
    player.kills;

  document.getElementById(
    "dead"
  ).style.display="flex";
}

/* START */

function startGame(){

  resetPlayer();

  dead=false;
  running=true;

  document.getElementById(
    "menu"
  ).style.display="none";

  document.getElementById(
    "hud"
  ).style.display="flex";

  document.getElementById(
    "leaderboard"
  ).style.display="block";

  document.getElementById(
    "minimap"
  ).style.display="block";
}

document.getElementById(
  "single"
).onclick=()=>{

  single=true;

  createBots();

  startGame();
};

/* MULTIPLAYER */

let ws=null;
let myId=null;

function connect(){

  const protocol=
    location.protocol==="https:"
      ? "wss:"
      : "ws:";

  ws=new WebSocket(
    protocol+
    "//"+
    location.host
  );

  ws.onopen=()=>{
    console.log("Connected");
  };

  ws.onmessage=e=>{

    let data;

    try{
      data=JSON.parse(e.data);
    }catch{
      return;
    }

    if(data.type==="connected"){

      myId=data.id;
      player.id=myId;

    }

    if(
      data.type==="roomCreated" ||
      data.type==="roomJoined"
    ){

      myId=data.id;
      player.id=myId;

      document.getElementById(
        "roomBox"
      ).style.display="block";

      document.getElementById(
        "roomCode"
      ).textContent=
        data.code;
    }

    if(data.type==="gameStart"){

      single=false;

      startGame();
    }

    if(data.type==="state"){

      for(const p of data.players){

        if(p.id===myId){

          if(!single){

            player.x=p.x;
            player.y=p.y;
            player.angle=p.angle;
            player.length=p.length;
            player.score=p.score;
            player.kills=p.kills;
            player.body=p.body;
            player.alive=p.alive;

            if(!p.alive){
              die("Vastane sai sind kätte!");
            }
          }

        }
      }

      updateRoomPlayers(
        data.players
      );
    }

    if(data.type==="error"){

      document.getElementById(
        "error"
      ).textContent=
        data.message;
    }
  };

  ws.onerror=()=>{

    document.getElementById(
      "error"
    ).textContent=
      "Serveriga ei saanud ühendust.";
  };
}

function updateRoomPlayers(players){

  const box=
    document.getElementById("players");

  box.innerHTML="";

  for(const p of players){

    const div=
      document.createElement("div");

    div.textContent=p.name;

    div.style.color=p.color;

    box.appendChild(div);
  }
}

document.getElementById(
  "create"
).onclick=()=>{

  if(
    !ws ||
    ws.readyState!==WebSocket.OPEN
  ){

    document.getElementById(
      "error"
    ).textContent=
      "Server pole ühendatud.";

    return;
  }

  ws.send(
    JSON.stringify({
      type:"createRoom",
      name:player.name,
      color:player.color
    })
  );
};

document.getElementById(
  "join"
).onclick=()=>{

  const code=
    document.getElementById(
      "room"
    ).value
    .trim()
    .toUpperCase();

  if(!code){

    document.getElementById(
      "error"
    ).textContent=
      "Sisesta roomi kood.";

    return;
  }

  ws.send(
    JSON.stringify({
      type:"joinRoom",
      code,
      name:player.name,
      color:player.color
    })
  );
};

document.getElementById(
  "start"
).onclick=()=>{

  if(
    ws &&
    ws.readyState===WebSocket.OPEN
  ){

    ws.send(
      JSON.stringify({
        type:"start"
      })
    );
  }
};

/* SEND MULTIPLAYER INPUT */

setInterval(()=>{

  if(
    ws &&
    ws.readyState===WebSocket.OPEN &&
    running &&
    !single
  ){

    ws.send(
      JSON.stringify({
        type:"input",
        angle:player.targetAngle,
        boost:boosting
      })
    );
  }

},50);

/* MAIN LOOP */

function loop(){

  if(running){

    if(single){

      if(innerWidth>800){

        const dx=
          mouseX-W/2;

        const dy=
          mouseY-H/2;

        if(
          Math.hypot(dx,dy)>10
        ){

          player.targetAngle=
            Math.atan2(dy,dx);
        }
      }

      updatePlayer();
      updateBots();
      collision();

    }else{

      /*
        Multiplayer client-side movement
        makes movement feel smooth.
      */

      let d=
        player.targetAngle-
        player.angle;

      while(d>Math.PI)
        d-=Math.PI*2;

      while(d<-Math.PI)
        d+=Math.PI*2;

      player.angle+=d*.17;

      const speed=
        boosting &&
        player.length>45
          ? 11
          : 7;

      if(
        boosting &&
        player.length>45
      ){

        player.length-=.08;
      }

      player.x+=
        Math.cos(player.angle)*speed;

      player.y+=
        Math.sin(player.angle)*speed;

      player.body.unshift({
        x:player.x,
        y:player.y
      });

      while(
        player.body.length<
        Math.floor(player.length)
      ){

        const last=
          player.body[
            player.body.length-1
          ];

        player.body.push({
          x:last.x,
          y:last.y
        });
      }

      while(
        player.body.length>
        Math.floor(player.length)
      ){

        player.body.pop();
      }
    }

    updateHUD();
  }

  draw();

  requestAnimationFrame(loop);
}

resetPlayer();
connect();
requestAnimationFrame(loop);
</script>
