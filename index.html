<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Snake Arena</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020604;
  font-family:Arial,sans-serif;
  color:white;
  touch-action:none;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:block;
  touch-action:none;
}

/* ================= MENU ================= */

#menu{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:auto;

  background:
    radial-gradient(
      circle at 50% 35%,
      rgba(60,255,100,.16),
      transparent 35%
    ),
    #020604;
}

.menuCard{
  width:min(92vw,470px);
  max-height:94vh;
  overflow:auto;

  padding:28px;

  border-radius:28px;

  background:
    linear-gradient(
      145deg,
      rgba(9,30,14,.97),
      rgba(2,10,5,.98)
    );

  border:1px solid rgba(100,255,130,.35);

  box-shadow:
    0 0 80px rgba(50,255,100,.12);

  text-align:center;
}

.logo{
  font-size:70px;
  animation:float 2s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}

.title{
  font-size:40px;
  font-weight:900;
  color:#61ff82;
  text-shadow:0 0 25px rgba(70,255,100,.5);
}

.subtitle{
  color:#86a28c;
  margin:5px 0 20px;
}

.input{
  width:100%;
  padding:15px;
  margin:5px 0;

  border-radius:13px;
  border:1px solid #244e2d;

  background:#061009;
  color:white;

  outline:none;
  text-align:center;
  font-size:16px;
}

.input:focus{
  border-color:#61ff82;
}

.btn{
  width:100%;
  padding:15px;
  margin-top:9px;

  border:0;
  border-radius:13px;

  font-size:17px;
  font-weight:bold;

  cursor:pointer;
}

.btn:active{
  transform:scale(.97);
}

.play{
  background:#5dff7e;
  color:#021006;
}

.create{
  background:#388cff;
  color:white;
}

.join{
  background:#9a43ff;
  color:white;
}

.sectionTitle{
  margin-top:15px;
  margin-bottom:7px;

  color:#7f9985;
  font-size:11px;
  letter-spacing:2px;
}

.modes{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.mode{
  padding:11px 4px;

  border-radius:11px;

  background:#071109;
  border:1px solid #1d3b24;

  cursor:pointer;
  font-size:12px;
}

.mode.active{
  border-color:#61ff82;
  background:rgba(80,255,110,.12);
}

.skins{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
}

.skin{
  width:37px;
  height:37px;
  border-radius:50%;

  border:3px solid transparent;
  cursor:pointer;
}

.skin.active{
  border-color:white;
  transform:scale(1.15);
  box-shadow:0 0 18px currentColor;
}

.bottom{
  display:flex;
  justify-content:space-between;

  margin-top:15px;

  color:#7c917f;
  font-size:12px;
}

#bestScore{
  color:#61ff82;
  font-weight:bold;
}

/* ================= LOBBY ================= */

#lobby{
  position:fixed;
  inset:0;
  z-index:150;

  display:none;

  align-items:center;
  justify-content:center;

  background:#020604;
}

.lobbyCard{
  width:min(92vw,450px);

  padding:28px;

  background:#071109;

  border:1px solid #315d39;
  border-radius:25px;

  text-align:center;
}

.lobbyTitle{
  font-size:32px;
  color:#61ff82;
}

.roomCode{
  margin:15px;

  font-size:45px;
  letter-spacing:7px;

  color:#61ff82;
}

.player{
  display:flex;
  align-items:center;

  padding:10px;
  margin:5px 0;

  background:#0b170e;
  border-radius:10px;

  text-align:left;
}

.dot{
  width:14px;
  height:14px;
  border-radius:50%;
  margin-right:10px;
}

.crown{
  margin-left:auto;
}

/* ================= HUD ================= */

#hud{
  position:fixed;
  z-index:20;

  top:calc(env(safe-area-inset-top) + 10px);
  left:50%;
  transform:translateX(-50%);

  display:none;
  gap:6px;
}

.stat{
  min-width:72px;

  padding:7px;

  border-radius:10px;

  background:rgba(2,10,5,.88);
  border:1px solid rgba(100,255,130,.25);

  text-align:center;
}

.stat small{
  display:block;
  color:#829585;
  font-size:9px;
}

.stat b{
  font-size:16px;
}

/* ================= LEADERBOARD ================= */

#leaderboard{
  position:fixed;
  z-index:20;

  top:calc(env(safe-area-inset-top) + 10px);
  right:10px;

  display:none;

  width:175px;

  padding:10px;

  border-radius:13px;

  background:rgba(2,10,5,.88);
  border:1px solid rgba(100,255,130,.25);
}

#leaderboard h3{
  color:#61ff82;
  font-size:14px;
  margin-bottom:5px;
}

.rank{
  display:flex;
  justify-content:space-between;

  font-size:11px;
  padding:3px;
}

/* ================= MOBILE ================= */

#touchHint{
  display:none;

  position:fixed;
  z-index:25;

  left:50%;
  bottom:25px;

  transform:translateX(-50%);

  padding:9px 16px;

  border-radius:20px;

  background:rgba(0,0,0,.55);

  color:#b6c7ba;

  font-size:11px;

  pointer-events:none;
}

#boost{
  display:none;

  position:fixed;
  z-index:40;

  right:22px;
  bottom:22px;

  width:92px;
  height:92px;

  border-radius:50%;

  border:3px solid #b9e8ff;

  background:
    radial-gradient(
      circle,
      #5fc5ff,
      #07559e
    );

  color:white;

  font-size:27px;

  box-shadow:
    0 0 25px rgba(70,170,255,.55);

  touch-action:none;
}

#boost span{
  display:block;
  font-size:9px;
  margin-top:2px;
}

@media(max-width:700px){

  #boost{
    display:block;
  }

  #touchHint{
    display:block;
  }

  #leaderboard{
    width:130px;
    transform:scale(.8);
    transform-origin:top right;
  }

  #hud{
    left:10px;
    transform:none;
  }

  .menuCard{
    padding:21px;
  }

  .title{
    font-size:32px;
  }

  .logo{
    font-size:58px;
  }
}

/* ================= DEATH ================= */

#dead{
  position:fixed;
  inset:0;
  z-index:200;

  display:none;

  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.65);
}

.deadCard{
  width:min(90vw,380px);

  padding:30px;

  background:#071109;

  border:1px solid #61ff82;
  border-radius:25px;

  text-align:center;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- MENU -->

<div id="menu">

  <div class="menuCard">

    <div class="logo">🐍</div>

    <div class="title">
      SNAKE ARENA
    </div>

    <div class="subtitle">
      Kasvata oma madu hiiglaslikuks!
    </div>

    <input
      id="name"
      class="input"
      maxlength="16"
      placeholder="✏️ Sinu nimi"
    >

    <div class="sectionTitle">
      MÄNGUREŽIIM
    </div>

    <div class="modes">

      <div class="mode active" data-mode="classic">
        🍎<br>CLASSIC
      </div>

      <div class="mode" data-mode="battle">
        ⚔️<br>BATTLE
      </div>

      <div class="mode" data-mode="power">
        ⚡<br>POWER
      </div>

    </div>

    <div class="sectionTitle">
      VALI SKIN
    </div>

    <div id="skins" class="skins"></div>

    <button
      class="btn play"
      id="playBtn"
    >
      ▶ MÄNGI
    </button>

    <button
      class="btn create"
      id="createBtn"
    >
      👥 LOO ROOM
    </button>

    <input
      id="room"
      class="input"
      maxlength="6"
      placeholder="🔑 ROOM CODE"
    >

    <button
      class="btn join"
      id="joinBtn"
    >
      🔗 LIITU ROOMI
    </button>

    <div class="bottom">

      <span>
        🏆 BEST:
        <span id="bestScore">0</span>
      </span>

      <span
        id="sound"
        style="cursor:pointer"
      >
        🔊 Heli
      </span>

    </div>

    <div
      id="connection"
      style="
        margin-top:12px;
        font-size:11px;
        color:#6f8675;
      "
    >
      🔄 Kontrollin serverit...
    </div>

  </div>
</div>


<!-- LOBBY -->

<div id="lobby">

  <div class="lobbyCard">

    <div class="lobbyTitle">
      👥 ROOM
    </div>

    <div style="color:#839786">
      Jaga seda koodi sõpradega
    </div>

    <div
      id="roomCode"
      class="roomCode"
    >
      ------
    </div>

    <button
      class="btn create"
      id="copyBtn"
    >
      📋 KOPI CODE
    </button>

    <div class="sectionTitle">
      MÄNGIJAD
    </div>

    <div id="players"></div>

    <div
      id="waiting"
      style="
        color:#849789;
        margin:12px;
      "
    >
      ⏳ Ootame...
    </div>

    <button
      class="btn play"
      id="startBtn"
      style="display:none"
    >
      🚀 ALUSTA
    </button>

    <button
      class="btn"
      id="backBtn"
      style="
        background:#172119;
        color:white;
      "
    >
      ← TAGASI
    </button>

  </div>

</div>


<!-- HUD -->

<div id="hud">

  <div class="stat">
    <small>SCORE</small>
    <b id="score">0</b>
  </div>

  <div class="stat">
    <small>LENGTH</small>
    <b id="length">40</b>
  </div>

  <div class="stat">
    <small>RANK</small>
    <b id="rank">1</b>
  </div>

</div>


<!-- LEADERBOARD -->

<div id="leaderboard">

  <h3>🏆 TOP</h3>

  <div id="board"></div>

</div>


<!-- MOBILE -->

<div id="touchHint">
  ☝️ Lohista sõrmega, et madu pööraks
</div>

<button id="boost">
  ⚡
  <span>BOOST</span>
</button>


<!-- DEATH -->

<div id="dead">

  <div class="deadCard">

    <div style="font-size:60px">
      💥
    </div>

    <h2>
      SAID PIHTA!
    </h2>

    <p
      id="deathScore"
      style="
        color:#879b8b;
        margin:10px;
      "
    >
      Score: 0
    </p>

    <button
      class="btn play"
      id="againBtn"
    >
      🔄 PROOVI UUESTI
    </button>

    <button
      class="btn"
      id="menuBtn"
      style="
        background:#172119;
        color:white;
      "
    >
      MENU
    </button>

  </div>

</div>


<div
  id="toast"
  style="
    position:fixed;
    z-index:500;
    left:50%;
    top:18%;
    transform:translate(-50%,-50%);
    opacity:0;
    padding:12px 22px;
    border-radius:25px;
    background:#071309;
    border:1px solid #61ff82;
    transition:.2s;
    pointer-events:none;
  "
></div>


<script>

/* =====================================================
   SETTINGS
===================================================== */

const SERVER =
  "wss://snake-riu3.onrender.com";

const WORLD = 14000;

const COLORS = [
  "#55ff72",
  "#42a5ff",
  "#ff45d4",
  "#ffe033",
  "#ff713d",
  "#a855ff",
  "#00eaff",
  "#ff4268",
  "#ffffff",
  "#9dff32",
  "#ff9f1c",
  "#00ffc8"
];

let skin =
  Number(
    localStorage.getItem("skin") || 0
  );

let mode="classic";

let best =
  Number(
    localStorage.getItem("best") || 0
  );

document.getElementById(
  "bestScore"
).textContent=best;


/* =====================================================
   CANVAS
===================================================== */

const canvas =
  document.getElementById("game");

const ctx =
  canvas.getContext("2d");

function resize(){

  const dpr =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  canvas.width =
    innerWidth*dpr;

  canvas.height =
    innerHeight*dpr;

  canvas.style.width =
    innerWidth+"px";

  canvas.style.height =
    innerHeight+"px";

  ctx.setTransform(
    dpr,
    0,
    0,
    dpr,
    0,
    0
  );

}

window.addEventListener(
  "resize",
  resize
);

resize();


/* =====================================================
   SKINS
===================================================== */

function drawSkins(){

  const box =
    document.getElementById("skins");

  box.innerHTML="";

  COLORS.forEach(
    (c,i)=>{

      const s =
        document.createElement("div");

      s.className="skin";

      s.style.background=c;
      s.style.color=c;

      if(i===skin)
        s.classList.add("active");

      s.onclick=()=>{

        skin=i;

        localStorage.setItem(
          "skin",
          skin
        );

        drawSkins();

      };

      box.appendChild(s);

    }
  );

}

drawSkins();


/* =====================================================
   MODE
===================================================== */

document
.querySelectorAll(".mode")
.forEach(
  el=>{

    el.onclick=()=>{

      document
      .querySelectorAll(".mode")
      .forEach(
        x=>x.classList.remove("active")
      );

      el.classList.add("active");

      mode=el.dataset.mode;

    };

  }
);


/* =====================================================
   AUDIO
===================================================== */

let audioContext=null;

let soundOn=true;

function beep(freq=600){

  if(!soundOn)return;

  try{

    if(!audioContext){

      audioContext =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    if(
      audioContext.state==="suspended"
    ){

      audioContext.resume();

    }

    const osc =
      audioContext.createOscillator();

    const gain =
      audioContext.createGain();

    osc.connect(gain);

    gain.connect(
      audioContext.destination
    );

    osc.frequency.value=freq;

    gain.gain.value=.035;

    osc.start();

    osc.stop(
      audioContext.currentTime+.08
    );

  }catch(e){}

}

document.getElementById(
  "sound"
).onclick=()=>{

  soundOn=!soundOn;

  document.getElementById(
    "sound"
  ).textContent=
    soundOn
    ? "🔊 Heli"
    : "🔇 Heli";

};


/* =====================================================
   PLAYER
===================================================== */

let player={
  x:WORLD/2,
  y:WORLD/2,
  angle:0,
  target:0,
  length:40,
  score:0,
  snake:[],
  alive:false,
  boost:false
};

let camera={
  x:WORLD/2,
  y:WORLD/2
};

let gameRunning=false;


/* =====================================================
   FOOD
===================================================== */

let foods=[];

function createFood(){

  foods=[];

  for(
    let i=0;
    i<1400;
    i++
  ){

    foods.push({

      x:
        Math.random()*WORLD,

      y:
        Math.random()*WORLD,

      size:
        Math.random()<.06
        ? 9
        : 5,

      value:
        Math.random()<.06
        ? 10
        : 1,

      gold:
        Math.random()<.06,

      phase:
        Math.random()*10

    });

  }

}

createFood();


/* =====================================================
   POWERUPS
===================================================== */

let powerups=[];

function createPowerups(){

  powerups=[];

  const types=[
    "speed",
    "shield",
    "magnet",
    "double"
  ];

  for(
    let i=0;
    i<25;
    i++
  ){

    powerups.push({

      x:
        Math.random()*WORLD,

      y:
        Math.random()*WORLD,

      type:
        types[
          Math.floor(
            Math.random()*types.length
          )
        ]

    });

  }

}

createPowerups();

let speedPower=0;
let shieldPower=0;
let magnetPower=0;
let doublePower=0;


/* =====================================================
   MOBILE TOUCH CONTROL
===================================================== */

/*
   OLULINE:

   Telefonil EI kasutata enam hiirt.

   Kasutaja puudutab/lohistab ekraanil.
   Uss pöörab sõrme suunas.

   Kui sõrm on ekraani keskpunktist paremal,
   liigub paremale jne.
*/

let touchX=
  innerWidth/2;

let touchY=
  innerHeight/2;

let touching=false;

canvas.addEventListener(
  "touchstart",
  e=>{

    e.preventDefault();

    touching=true;

    const t=e.touches[0];

    touchX=t.clientX;
    touchY=t.clientY;

    updateTouchDirection();

  },
  {
    passive:false
  }
);

canvas.addEventListener(
  "touchmove",
  e=>{

    e.preventDefault();

    if(!touching)return;

    const t=e.touches[0];

    touchX=t.clientX;
    touchY=t.clientY;

    updateTouchDirection();

  },
  {
    passive:false
  }
);

canvas.addEventListener(
  "touchend",
  e=>{

    e.preventDefault();

    touching=false;

  },
  {
    passive:false
  }
);

canvas.addEventListener(
  "touchcancel",
  e=>{

    touching=false;

  },
  {
    passive:false
  }
);


function updateTouchDirection(){

  const centerX=
    innerWidth/2;

  const centerY=
    innerHeight/2;

  const dx=
    touchX-centerX;

  const dy=
    touchY-centerY;

  if(
    Math.hypot(dx,dy)>12
  ){

    player.target=
      Math.atan2(
        dy,
        dx
      );

  }

}


/* =====================================================
   DESKTOP CONTROL
===================================================== */

let mouseX=
  innerWidth/2;

let mouseY=
  innerHeight/2;

window.addEventListener(
  "mousemove",
  e=>{

    mouseX=e.clientX;
    mouseY=e.clientY;

    if(!isMobile()){

      const dx=
        mouseX-innerWidth/2;

      const dy=
        mouseY-innerHeight/2;

      if(
        Math.hypot(dx,dy)>10
      ){

        player.target=
          Math.atan2(dy,dx);

      }

    }

  }
);


function isMobile(){

  return (
    "ontouchstart" in window ||
    navigator.maxTouchPoints>0
  );

}


/* =====================================================
   KEYBOARD
===================================================== */

window.addEventListener(
  "keydown",
  e=>{

    if(
      e.code==="ShiftLeft" ||
      e.code==="ShiftRight" ||
      e.code==="Space"
    ){

      e.preventDefault();

      player.boost=true;

    }

  }
);

window.addEventListener(
  "keyup",
  e=>{

    if(
      e.code==="ShiftLeft" ||
      e.code==="ShiftRight" ||
      e.code==="Space"
    ){

      player.boost=false;

    }

  }
);


/* =====================================================
   MOBILE BOOST
===================================================== */

const boostButton =
  document.getElementById("boost");

boostButton.addEventListener(
  "touchstart",
  e=>{

    e.preventDefault();
    e.stopPropagation();

    player.boost=true;

  },
  {
    passive:false
  }
);

boostButton.addEventListener(
  "touchend",
  e=>{

    e.preventDefault();
    e.stopPropagation();

    player.boost=false;

  },
  {
    passive:false
  }
);

boostButton.addEventListener(
  "touchcancel",
  e=>{

    player.boost=false;

  }
);


/* =====================================================
   START
===================================================== */

function startGame(){

  gameRunning=true;

  document.getElementById(
    "menu"
  ).style.display="none";

  document.getElementById(
    "lobby"
  ).style.display="none";

  document.getElementById(
    "dead"
  ).style.display="none";

  document.getElementById(
    "hud"
  ).style.display="flex";

  document.getElementById(
    "leaderboard"
  ).style.display="block";

  resetPlayer();

  beep(700);

}


function resetPlayer(){

  player.x =
    WORLD/2 +
    (Math.random()-.5)*2000;

  player.y =
    WORLD/2 +
    (Math.random()-.5)*2000;

  player.angle=
    Math.random()*Math.PI*2;

  player.target=
    player.angle;

  player.length=40;
  player.score=0;
  player.alive=true;
  player.boost=false;

  player.snake=[];

  for(
    let i=0;
    i<player.length;
    i++
  ){

    player.snake.push({

      x:
        player.x-
        Math.cos(player.angle)*
        i*8,

      y:
        player.y-
        Math.sin(player.angle)*
        i*8

    });

  }

  camera.x=player.x;
  camera.y=player.y;

  speedPower=0;
  shieldPower=0;
  magnetPower=0;
  doublePower=0;

}


/* =====================================================
   PLAY BUTTON
===================================================== */

document.getElementById(
  "playBtn"
).onclick=()=>{

  const name=
    document.getElementById(
      "name"
    ).value.trim();

  if(!name){

    showToast(
      "✏️ Sisesta kõigepealt nimi!"
    );

    return;

  }

  startGame();

};


/* =====================================================
   MOVEMENT
===================================================== */

function angleDifference(a,b){

  let d=b-a;

  while(d>Math.PI)
    d-=Math.PI*2;

  while(d<-Math.PI)
    d+=Math.PI*2;

  return d;

}


function update(){

  if(
    !gameRunning ||
    !player.alive
  ){

    return;

  }

  const diff=
    angleDifference(
      player.angle,
      player.target
    );

  player.angle +=
    Math.max(
      -.13,
      Math.min(
        .13,
        diff
      )
    );

  let speed=5.4;

  if(speedPower>0){

    speed=7.7;
    speedPower--;

  }

  if(player.boost){

    speed=9;

    player.length-=.04;

    if(player.length<25)
      player.length=25;

  }

  if(shieldPower>0)
    shieldPower--;

  if(magnetPower>0)
    magnetPower--;

  if(doublePower>0)
    doublePower--;

  player.x +=
    Math.cos(player.angle)*
    speed;

  player.y +=
    Math.sin(player.angle)*
    speed;


  /*
     KAARDI SERVAD

     Selle asemel, et madu kinni jääks,
     läheme teisele poole kaarti.
  */

  if(player.x<0)
    player.x=WORLD;

  if(player.x>WORLD)
    player.x=0;

  if(player.y<0)
    player.y=WORLD;

  if(player.y>WORLD)
    player.y=0;


  player.snake.unshift({

    x:player.x,
    y:player.y

  });

  while(
    player.snake.length >
    Math.floor(player.length)
  ){

    player.snake.pop();

  }

  collectFood();
  collectPowerups();


  /*
     Kaamera jälgib mängijat.
     See liigub pehmelt, mitte järsult.
  */

  camera.x +=
    (player.x-camera.x)*.12;

  camera.y +=
    (player.y-camera.y)*.12;

}


/* =====================================================
   FOOD
===================================================== */

function collectFood(){

  for(
    let i=foods.length-1;
    i>=0;
    i--
  ){

    const f=foods[i];

    let d=
      Math.hypot(
        player.x-f.x,
        player.y-f.y
      );


    if(
      magnetPower>0 &&
      d<350
    ){

      f.x +=
        (player.x-f.x)*.04;

      f.y +=
        (player.y-f.y)*.04;

    }


    if(d<30){

      let value=f.value;

      if(doublePower>0)
        value*=2;

      player.score+=value;

      player.length+=
        value*2;

      beep(
        f.gold
        ?900
        :620
      );

      foods.splice(i,1);

      foods.push({

        x:
          Math.random()*WORLD,

        y:
          Math.random()*WORLD,

        size:
          Math.random()<.06
          ?9
          :5,

        value:
          Math.random()<.06
          ?10
          :1,

        gold:
          Math.random()<.06,

        phase:
          Math.random()*10

      });

    }

  }

}


/* =====================================================
   POWERUPS
===================================================== */

function collectPowerups(){

  for(
    let i=powerups.length-1;
    i>=0;
    i--
  ){

    const p=powerups[i];

    if(
      Math.hypot(
        player.x-p.x,
        player.y-p.y
      )<45
    ){

      if(p.type==="speed")
        speedPower=700;

      if(p.type==="shield")
        shieldPower=900;

      if(p.type==="magnet")
        magnetPower=900;

      if(p.type==="double")
        doublePower=900;

      const text={
        speed:"⚡ SPEED!",
        shield:"🛡️ SHIELD!",
        magnet:"🧲 MAGNET!",
        double:"×2 SCORE!"
      };

      showToast(
        text[p.type]
      );

      beep(1000);

      powerups.splice(i,1);

      setTimeout(
        ()=>{

          powerups.push({

            x:
              Math.random()*WORLD,

            y:
              Math.random()*WORLD,

            type:[
              "speed",
              "shield",
              "magnet",
              "double"
            ][
              Math.floor(
                Math.random()*4
              )
            ]

          });

        },
        5000
      );

    }

  }

}


/* =====================================================
   DRAW
===================================================== */

function draw(){

  requestAnimationFrame(draw);

  ctx.clearRect(
    0,
    0,
    innerWidth,
    innerHeight
  );


  if(!gameRunning){

    ctx.fillStyle="#020604";

    ctx.fillRect(
      0,
      0,
      innerWidth,
      innerHeight
    );

    return;

  }


  /*
     ZOOM

     Suurem number = rohkem zoomitud.
  */

  const zoom =
    window.innerWidth<700
    ? 1.65
    : 1.55;


  ctx.save();

  ctx.translate(
    innerWidth/2,
    innerHeight/2
  );

  ctx.scale(
    zoom,
    zoom
  );

  ctx.translate(
    -camera.x,
    -camera.y
  );


  /* BACKGROUND */

  ctx.fillStyle="#041008";

  ctx.fillRect(
    0,
    0,
    WORLD,
    WORLD
  );


  /* GRID */

  const grid=160;

  const viewW=
    innerWidth/zoom;

  const viewH=
    innerHeight/zoom;

  const left=
    camera.x-viewW/2-300;

  const right=
    camera.x+viewW/2+300;

  const top=
    camera.y-viewH/2-300;

  const bottom=
    camera.y+viewH/2+300;

  ctx.strokeStyle=
    "rgba(100,255,130,.045)";

  ctx.lineWidth=1;

  for(
    let x=
      Math.floor(left/grid)*grid;
    x<right;
    x+=grid
  ){

    ctx.beginPath();

    ctx.moveTo(x,top);
    ctx.lineTo(x,bottom);

    ctx.stroke();

  }

  for(
    let y=
      Math.floor(top/grid)*grid;
    y<bottom;
    y+=grid
  ){

    ctx.beginPath();

    ctx.moveTo(left,y);
    ctx.lineTo(right,y);

    ctx.stroke();

  }


  /* BORDER */

  ctx.strokeStyle="#55ff72";
  ctx.lineWidth=25;

  ctx.strokeRect(
    0,
    0,
    WORLD,
    WORLD
  );


  /* FOOD */

  for(
    const f of foods
  ){

    if(
      f.x<left-40 ||
      f.x>right+40 ||
      f.y<top-40 ||
      f.y>bottom+40
    )continue;

    const pulse=
      Math.sin(
        performance.now()/180+
        f.phase
      )*1.5;

    const color=
      f.gold
      ? "#ffe33c"
      : "#ff5274";

    ctx.fillStyle=color;

    ctx.shadowColor=color;

    ctx.shadowBlur=
      f.gold
      ?20
      :10;

    ctx.beginPath();

    ctx.arc(
      f.x,
      f.y,
      f.size+pulse,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

  ctx.shadowBlur=0;


  /* POWERUPS */

  for(
    const p of powerups
  ){

    let color="#fff";
    let icon="?";

    if(p.type==="speed"){
      color="#3db7ff";
      icon="⚡";
    }

    if(p.type==="shield"){
      color="#6d8dff";
      icon="🛡";
    }

    if(p.type==="magnet"){
      color="#ff48df";
      icon="🧲";
    }

    if(p.type==="double"){
      color="#ffd83e";
      icon="×2";
    }

    ctx.fillStyle=color;

    ctx.shadowColor=color;
    ctx.shadowBlur=20;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      22,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;

    ctx.font="18px Arial";

    ctx.textAlign="center";
    ctx.textBaseline="middle";

    ctx.fillStyle="white";

    ctx.fillText(
      icon,
      p.x,
      p.y
    );

  }


  /* PLAYER */

  drawSnake(
    player.snake,
    COLORS[skin],
    player.angle,
    shieldPower>0
  );


  ctx.restore();

}


/* =====================================================
   DRAW SNAKE
===================================================== */

function drawSnake(
  snake,
  color,
  angle,
  shield
){

  if(!snake.length)return;


  for(
    let i=snake.length-1;
    i>=0;
    i--
  ){

    const p=snake[i];

    const t=
      i/snake.length;

    const radius=
      Math.max(
        6,
        15-t*8
      );

    ctx.fillStyle=color;

    ctx.shadowColor=color;
    ctx.shadowBlur=10;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      radius,
      0,
      Math.PI*2
    );

    ctx.fill();

  }


  ctx.shadowBlur=0;


  const head=snake[0];

  if(!head)return;


  ctx.fillStyle=color;

  ctx.beginPath();

  ctx.arc(
    head.x,
    head.y,
    18,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* EYES */

  const dx=
    Math.cos(angle);

  const dy=
    Math.sin(angle);

  const sx=
    -Math.sin(angle);

  const sy=
    Math.cos(angle);

  ctx.fillStyle="#031007";


  ctx.beginPath();

  ctx.arc(
    head.x+dx*9+sx*5,
    head.y+dy*9+sy*5,
    4,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.beginPath();

  ctx.arc(
    head.x+dx*9-sx*5,
    head.y+dy*9-sy*5,
    4,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* SHIELD */

  if(shield){

    ctx.strokeStyle="#66aaff";
    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.arc(
      head.x,
      head.y,
      30+
      Math.sin(
        performance.now()/100
      )*2,
      0,
      Math.PI*2
    );

    ctx.stroke();

  }


  /* NAME */

  ctx.font=
    "bold 13px Arial";

  ctx.textAlign="center";

  ctx.fillStyle="white";

  const name=
    document.getElementById(
      "name"
    ).value ||
    "Sina";

  ctx.fillText(
    name,
    head.x,
    head.y-34
  );

}


/* =====================================================
   HUD
===================================================== */

function updateHUD(){

  document.getElementById(
    "score"
  ).textContent=
    Math.floor(player.score);

  document.getElementById(
    "length"
  ).textContent=
    Math.floor(player.length);


  if(
    player.score>best
  ){

    best=
      Math.floor(player.score);

    localStorage.setItem(
      "best",
      best
    );

    document.getElementById(
      "bestScore"
    ).textContent=best;

  }


  document.getElementById(
    "rank"
  ).textContent=1;


  const board=
    document.getElementById(
      "board"
    );

  board.innerHTML=`

    <div class="rank">
      <span>1. ${
        escapeHTML(
          document.getElementById(
            "name"
          ).value ||
          "Sina"
        )
      }</span>

      <b>${Math.floor(
        player.score
      )}</b>
    </div>

    <div class="rank">
      <span>2. Bot</span>
      <b>${Math.max(
        0,
        Math.floor(player.score*.75)
      )}</b>
    </div>

    <div class="rank">
      <span>3. Bot</span>
      <b>${Math.max(
        0,
        Math.floor(player.score*.5)
      )}</b>
    </div>

  `;

}


/* =====================================================
   ROOM SYSTEM
===================================================== */

let socket=null;

let myId=null;
let currentRoom=null;
let host=false;


function connectServer(){

  try{

    socket=
      new WebSocket(SERVER);

    socket.onopen=()=>{

      document.getElementById(
        "connection"
      ).textContent=
        "🟢 Multiplayer server ühendatud";

    };

    socket.onclose=()=>{

      document.getElementById(
        "connection"
      ).textContent=
        "🟡 Server offline — Solo töötab";

    };

    socket.onerror=()=>{

      document.getElementById(
        "connection"
      ).textContent=
        "🟡 Solo režiim töötab";

    };

    socket.onmessage=e=>{

      let data;

      try{
        data=JSON.parse(e.data);
      }catch{
        return;
      }

      if(data.type==="connected"){

        myId=data.id;

      }

      if(data.type==="roomCreated"){

        currentRoom=data.room;

        host=true;

        openLobby();

      }

      if(data.type==="roomJoined"){

        currentRoom=data.room;

        host=false;

        openLobby();

      }

      if(data.type==="lobby"){

        currentRoom=data.room;

        host=data.host===myId;

        updateLobby(data);

      }

      if(data.type==="gameStarted"){

        startGame();

      }

    };

  }catch(e){

    console.log(e);

  }

}

connectServer();


function send(data){

  if(
    socket &&
    socket.readyState===
    WebSocket.OPEN
  ){

    socket.send(
      JSON.stringify(data)
    );

  }

}


/* CREATE */

document.getElementById(
  "createBtn"
).onclick=()=>{

  const name=
    document.getElementById(
      "name"
    ).value.trim();

  if(!name){

    showToast(
      "✏️ Sisesta nimi!"
    );

    return;

  }

  if(
    !socket ||
    socket.readyState!==
    WebSocket.OPEN
  ){

    showToast(
      "⚠️ Multiplayer server ei vasta"
    );

    return;

  }

  send({

    type:"createRoom",

    name:name,

    skin:COLORS[skin],

    mode:mode

  });

};


/* JOIN */

document.getElementById(
  "joinBtn"
).onclick=()=>{

  const name=
    document.getElementById(
      "name"
    ).value.trim();

  const code=
    document.getElementById(
      "room"
    ).value
    .trim()
    .toUpperCase();

  if(!name){

    showToast(
      "✏️ Sisesta nimi!"
    );

    return;

  }

  if(code.length!==6){

    showToast(
      "🔑 Room code peab olema 6 märki!"
    );

    return;

  }

  if(
    !socket ||
    socket.readyState!==
    WebSocket.OPEN
  ){

    showToast(
      "⚠️ Multiplayer server ei vasta"
    );

    return;

  }

  send({

    type:"joinRoom",

    name:name,

    room:code,

    skin:COLORS[skin]

  });

};


/* LOBBY */

function openLobby(){

  document.getElementById(
    "menu"
  ).style.display="none";

  document.getElementById(
    "lobby"
  ).style.display="flex";

  document.getElementById(
    "roomCode"
  ).textContent=
    currentRoom ||
    "------";

}


function updateLobby(data){

  const box=
    document.getElementById(
      "players"
    );

  box.innerHTML="";

  (data.players||[])
  .forEach(p=>{

    const row=
      document.createElement(
        "div"
      );

    row.className="player";

    row.innerHTML=`

      <span
        class="dot"
        style="
          background:
          ${p.skin||"#55ff72"}
        "
      ></span>

      <span>
        ${escapeHTML(
          p.name||"Player"
        )}
      </span>

      ${
        p.id===data.host
        ? '<span class="crown">👑</span>'
        : ""
      }

    `;

    box.appendChild(row);

  });


  document.getElementById(
    "startBtn"
  ).style.display=
    host
    ? "block"
    : "none";

  document.getElementById(
    "waiting"
  ).textContent=
    host
    ? "👑 Sina oled host"
    : "⏳ Ootame hosti...";

}


/* START ROOM */

document.getElementById(
  "startBtn"
).onclick=()=>{

  if(host){

    send({
      type:"startGame"
    });

  }

};


/* COPY */

document.getElementById(
  "copyBtn"
).onclick=()=>{

  if(!currentRoom)return;

  if(
    navigator.clipboard
  ){

    navigator.clipboard
    .writeText(currentRoom)
    .then(
      ()=>{
        showToast(
          "📋 Code kopeeritud!"
        );
      }
    );

  }else{

    showToast(
      currentRoom
    );

  }

};


/* BACK */

document.getElementById(
  "backBtn"
).onclick=()=>{

  document.getElementById(
    "lobby"
  ).style.display="none";

  document.getElementById(
    "menu"
  ).style.display="flex";

};


/* =====================================================
   DEATH
===================================================== */

function die(){

  if(!player.alive)return;

  player.alive=false;

  document.getElementById(
    "deathScore"
  ).textContent=
    "Score: "+
    Math.floor(player.score);

  document.getElementById(
    "dead"
  ).style.display="flex";

}


document.getElementById(
  "againBtn"
).onclick=()=>{

  document.getElementById(
    "dead"
  ).style.display="none";

  resetPlayer();

};


document.getElementById(
  "menuBtn"
).onclick=()=>{

  gameRunning=false;

  document.getElementById(
    "dead"
  ).style.display="none";

  document.getElementById(
    "hud"
  ).style.display="none";

  document.getElementById(
    "leaderboard"
  ).style.display="none";

  document.getElementById(
    "menu"
  ).style.display="flex";

};


/* =====================================================
   TOAST
===================================================== */

let toastTimer=null;

function showToast(text){

  const t=
    document.getElementById(
      "toast"
    );

  t.textContent=text;

  t.style.opacity="1";

  clearTimeout(toastTimer);

  toastTimer=
    setTimeout(
      ()=>{
        t.style.opacity="0";
      },
      1500
    );

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHTML(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");

}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(){

  update();

  updateHUD();

  requestAnimationFrame(
    gameLoop
  );

}

gameLoop();

draw();
