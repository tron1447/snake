<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Snake Arena</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
    -webkit-touch-callout:none;
    touch-action:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050805;
    font-family:Arial,sans-serif;
}

body{
    position:fixed;
}

canvas#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}

/* ================= MENU ================= */

#menu{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;

    background:
        radial-gradient(circle at 50% 25%,
        #1b4d22 0%,
        #0b1e0e 35%,
        #030703 80%);
}

.panel{
    width:min(94vw,430px);
    max-height:94vh;
    overflow:auto;

    padding:28px 24px;

    border-radius:28px;

    background:rgba(4,12,5,.96);

    border:1px solid rgba(99,255,120,.35);

    box-shadow:
        0 0 70px rgba(70,255,100,.13),
        inset 0 0 30px rgba(100,255,120,.03);

    text-align:center;
    color:white;
}

.logo{
    font-size:68px;
    filter:drop-shadow(0 0 15px #63ff78);
}

h1{
    color:#63ff78;
    font-size:42px;
    margin-top:4px;
    letter-spacing:2px;
}

.subtitle{
    color:#819384;
    margin:6px 0 22px;
}

input{
    width:100%;
    height:48px;

    margin:5px 0;

    border-radius:13px;
    border:1px solid #315b36;

    background:#081008;
    color:white;

    text-align:center;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#63ff78;
    box-shadow:0 0 15px rgba(99,255,120,.15);
}

button{
    border:0;
    cursor:pointer;
    font-weight:bold;
    font-size:15px;
}

.mainBtn{
    width:100%;
    height:50px;
    margin-top:8px;
    border-radius:13px;
}

.green{
    background:#63ff78;
    color:#031006;
}

.green:active{
    transform:scale(.97);
}

.dark{
    background:#102014;
    color:white;
    border:1px solid #315a36;
}

#roomBox{
    display:none;
    margin-top:18px;
}

.roomTitle{
    color:#829987;
    font-size:12px;
}

#roomCode{
    color:#63ff78;
    font-size:34px;
    font-weight:bold;
    letter-spacing:7px;
    margin:5px 0 12px;
}

#players{
    max-height:145px;
    overflow:auto;
    text-align:left;
    margin-top:10px;
}

.playerRow{
    padding:8px 10px;
    margin:4px 0;
    border-radius:9px;
    background:#0b170d;
    color:#c9d8cb;
}

.host{
    color:#63ff78;
}

#startBtn{
    display:none;
    width:100%;
    height:50px;
    margin-top:12px;
    border-radius:13px;
}

#error{
    min-height:20px;
    margin-top:12px;
    color:#ff6374;
    font-size:13px;
}

#connection{
    margin-top:10px;
    color:#768979;
    font-size:11px;
}

/* ================= HUD ================= */

#hud{
    position:fixed;
    z-index:10;
    left:12px;
    top:12px;

    display:none;
    gap:7px;
}

.stat{
    min-width:78px;
    padding:8px 11px;

    border-radius:11px;

    background:rgba(0,0,0,.65);

    border:1px solid rgba(99,255,120,.25);

    color:white;
}

.stat small{
    display:block;
    color:#769079;
    font-size:9px;
}

.stat b{
    font-size:17px;
}

/* ================= MINIMAP ================= */

#minimap{
    position:fixed;
    z-index:11;

    right:12px;
    top:12px;

    width:155px;
    height:155px;

    display:none;

    border-radius:15px;

    background:#071008;

    border:2px solid rgba(99,255,120,.7);

    box-shadow:0 0 20px rgba(99,255,120,.12);
}

/* ================= MOBILE ================= */

#joystick{
    position:fixed;
    z-index:20;

    left:25px;
    bottom:25px;

    width:145px;
    height:145px;

    display:none;

    border-radius:50%;

    background:rgba(99,255,120,.08);

    border:2px solid rgba(99,255,120,.35);
}

#stick{
    position:absolute;

    left:50%;
    top:50%;

    width:62px;
    height:62px;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:#63ff78;

    border:3px solid white;

    box-shadow:0 0 20px rgba(99,255,120,.4);
}

#boost{
    position:fixed;
    z-index:20;

    right:25px;
    bottom:32px;

    width:92px;
    height:92px;

    display:none;

    border-radius:50%;

    background:#0877ad;

    color:white;

    border:3px solid #9ddfff;

    font-size:28px;

    box-shadow:0 0 20px rgba(0,150,255,.3);
}

#boost:active{
    transform:scale(.92);
}

/* ================= GAME OVER ================= */

#gameOver{
    position:fixed;
    inset:0;
    z-index:60;

    display:none;

    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.75);
}

.overPanel{
    width:min(90vw,390px);
    padding:30px;

    border-radius:24px;

    background:#081008;

    border:1px solid #315b36;

    color:white;

    text-align:center;
}

.overPanel h2{
    color:#ff586a;
    font-size:38px;
    margin-bottom:12px;
}

@media(max-width:800px){
    #joystick,
    #boost{
        display:block;
    }

    #minimap{
        width:125px;
        height:125px;
    }

    .panel{
        padding:24px 20px;
    }

    h1{
        font-size:34px;
    }
}

@media(min-width:801px){
    #minimap{
        width:170px;
        height:170px;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- MENU -->

<div id="menu">

    <div class="panel">

        <div class="logo">🐍</div>

        <h1>SNAKE ARENA</h1>

        <div class="subtitle">
            Multiplayer Snake
        </div>

        <input
            id="name"
            maxlength="16"
            autocomplete="off"
            placeholder="Sinu nimi"
        >

        <button
            id="createBtn"
            class="mainBtn green"
        >
            🏠 CREATE ROOM
        </button>

        <input
            id="roomInput"
            maxlength="6"
            autocomplete="off"
            placeholder="ROOM CODE"
            style="text-transform:uppercase"
        >

        <button
            id="joinBtn"
            class="mainBtn dark"
        >
            🚪 JOIN ROOM
        </button>

        <div id="roomBox">

            <div class="roomTitle">
                SINU ROOM CODE
            </div>

            <div id="roomCode">
                ------
            </div>

            <div id="players"></div>

            <button
                id="startBtn"
                class="green"
            >
                ▶ START GAME
            </button>

        </div>

        <div id="error"></div>

        <div id="connection">
            Ühendamine serveriga...
        </div>

    </div>

</div>

<!-- HUD -->

<div id="hud">

    <div class="stat">
        <small>SCORE</small>
        <b id="score">0</b>
    </div>

    <div class="stat">
        <small>LENGTH</small>
        <b id="length">20</b>
    </div>

    <div class="stat">
        <small>PLAYERS</small>
        <b id="playerCount">1</b>
    </div>

</div>

<!-- MINIMAP -->

<canvas
    id="minimap"
    width="170"
    height="170"
></canvas>

<!-- PHONE CONTROLS -->

<div id="joystick">
    <div id="stick"></div>
</div>

<button id="boost">
    ⚡
</button>

<!-- GAME OVER -->

<div id="gameOver">

    <div class="overPanel">

        <h2>GAME OVER</h2>

        <p>
            Skoor:
            <b id="finalScore">0</b>
        </p>

        <br>

        <button
            class="mainBtn green"
            onclick="location.reload()"
        >
            🔄 UUesti
        </button>

    </div>

</div>

<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

const minimap =
    document.getElementById("minimap");

const mapCtx =
    minimap.getContext("2d");

let W = 0;
let H = 0;

function resize(){

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W;
    canvas.height = H;
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =====================================================
   WORLD
===================================================== */

const WORLD = 20000;


/* =====================================================
   PLAYER
===================================================== */

const me = {

    id:null,

    x:10000,
    y:10000,

    angle:0,
    targetAngle:0,

    length:20,

    color:"#63ff78"
};

let body = [];

let others = {};

let score = 0;

let running = false;

let boosting = false;


/* =====================================================
   WEBSOCKET
===================================================== */

let socket = null;

let connected = false;

let reconnectTimer = null;


/*
    Render is HTTPS, so use WSS.
    On local HTTP use WS.

    This is the normal WebSocket setup
    for a browser game.
*/

function websocketURL(){

    const protocol =
        location.protocol === "https:"
            ? "wss:"
            : "ws:";

    return protocol +
           "//" +
           location.host;
}


function connect(){

    if(
        socket &&
        (
            socket.readyState === WebSocket.OPEN ||
            socket.readyState === WebSocket.CONNECTING
        )
    ){
        return;
    }

    setConnection(
        "🟡 Ühendamine..."
    );

    try{

        socket =
            new WebSocket(
                websocketURL()
            );

    }catch(error){

        setConnection(
            "🔴 Serveriga ei saanud ühendust"
        );

        return;
    }


    socket.addEventListener(
        "open",
        () => {

            connected = true;

            setConnection(
                "🟢 Server ühendatud"
            );

            clearTimeout(
                reconnectTimer
            );
        }
    );


    socket.addEventListener(
        "message",
        event => {

            let data;

            try{

                data =
                    JSON.parse(
                        event.data
                    );

            }catch{

                return;
            }

            serverMessage(data);
        }
    );


    socket.addEventListener(
        "error",
        () => {

            connected = false;

            setConnection(
                "🔴 Serveri viga"
            );
        }
    );


    socket.addEventListener(
        "close",
        () => {

            connected = false;

            setConnection(
                "🔴 Ühendus katkes"
            );

            if(
                !running &&
                !reconnectTimer
            ){

                reconnectTimer =
                    setTimeout(
                        () => {

                            reconnectTimer =
                                null;

                            connect();

                        },
                        2500
                    );
            }
        }
    );
}


function send(data){

    if(
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ){
        return false;
    }

    socket.send(
        JSON.stringify(data)
    );

    return true;
}


/* =====================================================
   SERVER MESSAGES
===================================================== */

function serverMessage(data){

    if(data.type === "roomCreated"){

        me.id =
            data.id;

        showRoom(
            data.code
        );

        return;
    }


    if(data.type === "roomJoined"){

        me.id =
            data.id;

        showRoom(
            data.code
        );

        return;
    }


    if(data.type === "lobby"){

        updateLobby(
            data.players
        );

        return;
    }


    if(data.type === "gameStart"){

        me.id =
            data.id ||
            me.id;

        startGame();

        return;
    }


    if(data.type === "players"){

        others =
            data.players || {};

        updatePlayerCount();

        return;
    }


    if(data.type === "error"){

        showError(
            data.message ||
            "Tundmatu viga"
        );

        return;
    }
}


/* =====================================================
   UI
===================================================== */

function playerName(){

    const input =
        document.getElementById(
            "name"
        );

    const value =
        input.value.trim();

    return (
        value ||
        "Player"
    ).substring(0,16);
}


function showError(text){

    document.getElementById(
        "error"
    ).textContent =
        text || "";
}


function setConnection(text){

    document.getElementById(
        "connection"
    ).textContent =
        text;
}


function showRoom(code){

    document.getElementById(
        "roomBox"
    ).style.display =
        "block";

    document.getElementById(
        "roomCode"
    ).textContent =
        code;
}


function updateLobby(players){

    const container =
        document.getElementById(
            "players"
        );

    container.innerHTML = "";

    for(
        const p of players
    ){

        const row =
            document.createElement(
                "div"
            );

        row.className =
            "playerRow";

        row.innerHTML =
            (p.host
                ? "👑 "
                : "🐍 ") +
            escapeHTML(
                p.name
            );

        if(p.host){

            row.classList.add(
                "host"
            );
        }

        container.appendChild(
            row
        );
    }


    /*
        Server gives us host=true.
        Find whether OUR player is host.
    */

    const mine =
        players.find(
            p =>
                p.id === me.id
        );

    if(
        mine &&
        mine.host
    ){

        document.getElementById(
            "startBtn"
        ).style.display =
            "block";
    }else{

        document.getElementById(
            "startBtn"
        ).style.display =
            "none";
    }
}


function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function updatePlayerCount(){

    let count =
        Object.keys(
            others
        ).length;

    if(count < 1)
        count = 1;

    document.getElementById(
        "playerCount"
    ).textContent =
        count;
}


/* =====================================================
   CREATE ROOM
===================================================== */

document.getElementById(
    "createBtn"
).addEventListener(
    "click",
    () => {

        showError("");

        if(!connected){

            showError(
                "Ootan serveriga ühendust..."
            );

            connect();

            return;
        }

        send({

            type:"createRoom",

            name:
                playerName(),

            color:
                me.color
        });
    }
);


/* =====================================================
   JOIN ROOM
===================================================== */

document.getElementById(
    "joinBtn"
).addEventListener(
    "click",
    () => {

        showError("");

        const code =
            document.getElementById(
                "roomInput"
            )
            .value
            .trim()
            .toUpperCase();

        if(code.length !== 6){

            showError(
                "Room code peab olema 6 märki."
            );

            return;
        }

        if(!connected){

            showError(
                "Serveriga ei ole ühendust."
            );

            connect();

            return;
        }

        send({

            type:"joinRoom",

            code:code,

            name:
                playerName(),

            color:
                me.color
        });
    }
);


/* =====================================================
   START GAME
===================================================== */

document.getElementById(
    "startBtn"
).addEventListener(
    "click",
    () => {

        send({
            type:"startGame"
        });
    }
);


/* =====================================================
   KEYBOARD
===================================================== */

const keys = {};

window.addEventListener(
    "keydown",
    event => {

        const key =
            event.key.toLowerCase();

        keys[key] = true;

        if(
            event.key === "Shift"
        ){

            boosting = true;
        }

        if(
            [
                "arrowup",
                "arrowdown",
                "arrowleft",
                "arrowright",
                " "
            ].includes(key)
        ){

            event.preventDefault();
        }
    }
);


window.addEventListener(
    "keyup",
    event => {

        const key =
            event.key.toLowerCase();

        keys[key] = false;

        if(
            event.key === "Shift"
        ){

            boosting = false;
        }
    }
);


function keyboardDirection(){

    let dx = 0;
    let dy = 0;

    if(
        keys["w"] ||
        keys["arrowup"]
    ){
        dy -= 1;
    }

    if(
        keys["s"] ||
        keys["arrowdown"]
    ){
        dy += 1;
    }

    if(
        keys["a"] ||
        keys["arrowleft"]
    ){
        dx -= 1;
    }

    if(
        keys["d"] ||
        keys["arrowright"]
    ){
        dx += 1;
    }

    if(
        dx !== 0 ||
        dy !== 0
    ){

        me.targetAngle =
            Math.atan2(
                dy,
                dx
            );
    }
}


/* =====================================================
   MOUSE
===================================================== */

window.addEventListener(
    "mousemove",
    event => {

        if(!running)
            return;

        if(window.innerWidth <= 800)
            return;

        const dx =
            event.clientX -
            W / 2;

        const dy =
            event.clientY -
            H / 2;

        if(
            Math.abs(dx) +
            Math.abs(dy) <
            20
        ){
            return;
        }

        me.targetAngle =
            Math.atan2(
                dy,
                dx
            );
    }
);


/* =====================================================
   MOBILE JOYSTICK
===================================================== */

const joystick =
    document.getElementById(
        "joystick"
    );

const stick =
    document.getElementById(
        "stick"
    );

let joystickPointer = null;


function joystickMove(
    x,
    y
){

    const rect =
        joystick.getBoundingClientRect();

    const centerX =
        rect.left +
        rect.width / 2;

    const centerY =
        rect.top +
        rect.height / 2;

    let dx =
        x - centerX;

    let dy =
        y - centerY;

    const max = 55;

    const distance =
        Math.hypot(
            dx,
            dy
        );

    if(
        distance > max
    ){

        dx =
            dx / distance *
            max;

        dy =
            dy / distance *
            max;
    }

    stick.style.left =
        `calc(50% + ${dx}px)`;

    stick.style.top =
        `calc(50% + ${dy}px)`;

    if(
        distance > 7
    ){

        me.targetAngle =
            Math.atan2(
                dy,
                dx
            );
    }
}


function joystickReset(){

    joystickPointer =
        null;

    stick.style.left =
        "50%";

    stick.style.top =
        "50%";
}


joystick.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        joystickPointer =
            event.pointerId;

        joystick.setPointerCapture(
            event.pointerId
        );

        joystickMove(
            event.clientX,
            event.clientY
        );
    }
);


joystick.addEventListener(
    "pointermove",
    event => {

        if(
            event.pointerId !==
            joystickPointer
        ){
            return;
        }

        event.preventDefault();

        joystickMove(
            event.clientX,
            event.clientY
        );
    }
);


joystick.addEventListener(
    "pointerup",
    event => {

        if(
            event.pointerId !==
            joystickPointer
        ){
            return;
        }

        joystickReset();
    }
);


joystick.addEventListener(
    "pointercancel",
    joystickReset
);


/* =====================================================
   MOBILE BOOST
===================================================== */

const boostButton =
    document.getElementById(
        "boost"
    );


boostButton.addEventListener(
    "pointerdown",
    event => {

        event.preventDefault();

        boosting = true;
    }
);


boostButton.addEventListener(
    "pointerup",
    event => {

        event.preventDefault();

        boosting = false;
    }
);


boostButton.addEventListener(
    "pointercancel",
    () => {

        boosting = false;
    }
);


/* =====================================================
   START GAME
===================================================== */

function startGame(){

    running = true;

    document.getElementById(
        "menu"
    ).style.display =
        "none";

    document.getElementById(
        "hud"
    ).style.display =
        "flex";

    document.getElementById(
        "minimap"
    ).style.display =
        "block";


    /*
        Start a fresh snake.
    */

    body = [];

    for(
        let i = 0;
        i < me.length;
        i++
    ){

        body.push({

            x:
                me.x -
                Math.cos(me.angle) *
                i *
                8,

            y:
                me.y -
                Math.sin(me.angle) *
                i *
                8
        });
    }
}


/* =====================================================
   ANGLE
===================================================== */

function rotateTowards(
    current,
    target,
    amount
){

    let difference =
        target -
        current;

    while(
        difference > Math.PI
    ){

        difference -=
            Math.PI * 2;
    }

    while(
        difference < -Math.PI
    ){

        difference +=
            Math.PI * 2;
    }

    return (
        current +
        difference *
        amount
    );
}


/* =====================================================
   MOVEMENT
===================================================== */

let lastSend = 0;


function update(){

    if(!running)
        return;


    keyboardDirection();


    me.angle =
        rotateTowards(
            me.angle,
            me.targetAngle,
            0.13
        );


    const speed =
        boosting
            ? 7.5
            : 4.5;


    me.x +=
        Math.cos(me.angle) *
        speed;

    me.y +=
        Math.sin(me.angle) *
        speed;


    /*
        Keep player inside world.
    */

    me.x =
        Math.max(
            40,
            Math.min(
                WORLD - 40,
                me.x
            )
        );

    me.y =
        Math.max(
            40,
            Math.min(
                WORLD - 40,
                me.y
            )
        );


    /*
        Body.
    */

    body.unshift({

        x:me.x,
        y:me.y
    });


    while(
        body.length >
        Math.floor(me.length)
    ){

        body.pop();
    }


    while(
        body.length <
        Math.floor(me.length)
    ){

        body.push({

            x:me.x,
            y:me.y
        });
    }


    /*
        Score slowly increases.
    */

    score +=
        boosting
            ? 0.015
            : 0.006;


    /*
        Send network state
        around 20 times/sec.
    */

    const now =
        performance.now();

    if(
        now - lastSend >
        50
    ){

        lastSend = now;

        send({

            type:"state",

            x:me.x,

            y:me.y,

            angle:me.angle,

            length:me.length,

            color:me.color,

            name:playerName()
        });
    }


    document.getElementById(
        "score"
    ).textContent =
        Math.floor(score);

    document.getElementById(
        "length"
    ).textContent =
        Math.floor(me.length);
}


/* =====================================================
   CAMERA
===================================================== */

let cameraX = me.x;
let cameraY = me.y;


function updateCamera(){

    cameraX +=
        (
            me.x -
            cameraX
        ) * 0.08;

    cameraY +=
        (
            me.y -
            cameraY
        ) * 0.08;
}


/* =====================================================
   DRAW WORLD
===================================================== */

function draw(){

    ctx.fillStyle =
        "#071008";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    if(!running)
        return;


    updateCamera();


    ctx.save();


    ctx.translate(
        W / 2,
        H / 2
    );

    ctx.translate(
        -cameraX,
        -cameraY
    );


    drawGrid();

    drawWorldBorder();

    drawFood();

    drawOtherSnakes();

    drawMySnake();


    ctx.restore();


    drawMinimap();
}


/* =====================================================
   GRID
===================================================== */

function drawGrid(){

    const grid = 250;

    const left =
        cameraX -
        W / 2 -
        500;

    const right =
        cameraX +
        W / 2 +
        500;

    const top =
        cameraY -
        H / 2 -
        500;

    const bottom =
        cameraY +
        H / 2 +
        500;


    ctx.strokeStyle =
        "rgba(99,255,120,.045)";

    ctx.lineWidth = 1;


    for(
        let x =
            Math.floor(
                left / grid
            ) * grid;

        x < right;

        x += grid
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            top
        );

        ctx.lineTo(
            x,
            bottom
        );

        ctx.stroke();
    }


    for(
        let y =
            Math.floor(
                top / grid
            ) * grid;

        y < bottom;

        y += grid
    ){

        ctx.beginPath();

        ctx.moveTo(
            left,
            y
        );

        ctx.lineTo(
            right,
            y
        );

        ctx.stroke();
    }
}


/* =====================================================
   BORDER
===================================================== */

function drawWorldBorder(){

    ctx.strokeStyle =
        "#63ff78";

    ctx.lineWidth = 24;

    ctx.shadowColor =
        "#63ff78";

    ctx.shadowBlur = 18;

    ctx.strokeRect(
        0,
        0,
        WORLD,
        WORLD
    );

    ctx.shadowBlur = 0;
}


/* =====================================================
   FOOD
===================================================== */

function drawFood(){

    /*
        Decorative food positions.
        Deterministic so every player sees
        the same map.
    */

    for(
        let i = 0;
        i < 90;
        i++
    ){

        const x =
            (
                i * 1739 +
                500
            ) %
            (WORLD - 1000) +
            500;

        const y =
            (
                i * 2933 +
                800
            ) %
            (WORLD - 1000) +
            500;

        const pulse =
            Math.sin(
                performance.now() / 300 +
                i
            ) * 2;

        ctx.fillStyle =
            i % 3 === 0
                ? "#ffd84d"
                : i % 3 === 1
                    ? "#ff6680"
                    : "#63ff78";

        ctx.shadowColor =
            ctx.fillStyle;

        ctx.shadowBlur = 7;

        ctx.beginPath();

        ctx.arc(
            x,
            y,
            4 + pulse,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }

    ctx.shadowBlur = 0;
}


/* =====================================================
   MY SNAKE
===================================================== */

function drawMySnake(){

    if(body.length === 0)
        return;


    for(
        let i =
            body.length - 1;

        i >= 0;

        i--
    ){

        const p =
            body[i];

        const progress =
            i / body.length;

        const radius =
            8 +
            (1 - progress) *
            10;


        ctx.fillStyle =
            me.color;

        ctx.shadowColor =
            me.color;

        ctx.shadowBlur =
            i < 10
                ? 12
                : 4;


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            radius,
            0,
            Math.PI * 2
        );

        ctx.fill();
    }


    ctx.shadowBlur = 0;


    /*
        Head.
    */

    ctx.fillStyle =
        me.color;

    ctx.beginPath();

    ctx.arc(
        me.x,
        me.y,
        20,
        0,
        Math.PI * 2
    );

    ctx.fill();


    /*
        Eyes.
    */

    drawEyes(
        me.x,
        me.y,
        me.angle
    );


    /*
        Name.
    */

    drawName(
        playerName(),
        me.x,
        me.y - 29
    );
}


/* =====================================================
   OTHER SNAKES
===================================================== */

function drawOtherSnakes(){

    for(
        const id in others
    ){

        if(
            id === me.id
        ){
            continue;
        }

        const p =
            others[id];

        if(!p)
            continue;


        const count =
            Math.min(
                150,
                Math.max(
                    20,
                    Math.floor(
                        p.length || 20
                    )
                )
            );


        for(
            let i = count - 1;
            i >= 0;
            i--
        ){

            const x =
                p.x -
                Math.cos(
                    p.angle
                ) *
                i *
                8;

            const y =
                p.y -
                Math.sin(
                    p.angle
                ) *
                i *
                8;


            const progress =
                i / count;

            const radius =
                8 +
                (1-progress) *
                7;


            ctx.fillStyle =
                p.color ||
                "#4da6ff";

            ctx.globalAlpha =
                1 -
                progress * .35;

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                radius,
                0,
                Math.PI * 2
            );

            ctx.fill();
        }


        ctx.globalAlpha = 1;


        ctx.fillStyle =
            p.color ||
            "#4da6ff";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            18,
            0,
            Math.PI * 2
        );

        ctx.fill();


        drawEyes(
            p.x,
            p.y,
            p.angle
        );


        drawName(
            p.name || "Player",
            p.x,
            p.y - 28
        );
    }
}


/* =====================================================
   EYES
===================================================== */

function drawEyes(
    x,
    y,
    angle
){

    const fx =
        Math.cos(angle);

    const fy =
        Math.sin(angle);

    const sx =
        -fy;

    const sy =
        fx;


    ctx.fillStyle =
        "#061006";


    ctx.beginPath();

    ctx.arc(
        x +
        fx * 10 +
        sx * 5,

        y +
        fy * 10 +
        sy * 5,

        4,

        0,
        Math.PI * 2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        x +
        fx * 10 -
        sx * 5,

        y +
        fy * 10 -
        sy * 5,

        4,

        0,
        Math.PI * 2
    );

    ctx.fill();
}


/* =====================================================
   NAMES
===================================================== */

function drawName(
    name,
    x,
    y
){

    ctx.save();

    ctx.textAlign =
        "center";

    ctx.font =
        "bold 12px Arial";

    ctx.fillStyle =
        "white";

    ctx.shadowColor =
        "black";

    ctx.shadowBlur = 4;

    ctx.fillText(
        name,
        x,
        y
    );

    ctx.restore();
}


/* =====================================================
   MINIMAP
===================================================== */

function drawMinimap(){

    const size =
        minimap.width;


    mapCtx.clearRect(
        0,
        0,
        size,
        size
    );


    mapCtx.fillStyle =
        "#061007";

    mapCtx.fillRect(
        0,
        0,
        size,
        size
    );


    /*
        Grid.
    */

    mapCtx.strokeStyle =
        "rgba(99,255,120,.08)";

    mapCtx.lineWidth = 1;


    for(
        let i = 0;
        i <= 10;
        i++
    ){

        const p =
            i / 10 * size;

        mapCtx.beginPath();

        mapCtx.moveTo(
            p,
            0
        );

        mapCtx.lineTo(
            p,
            size
        );

        mapCtx.stroke();


        mapCtx.beginPath();

        mapCtx.moveTo(
            0,
            p
        );

        mapCtx.lineTo(
            size,
            p
        );

        mapCtx.stroke();
    }


    /*
        Other players.
    */

    for(
        const id in others
    ){

        if(
            id === me.id
        )
            continue;

        const p =
            others[id];

        const x =
            p.x /
            WORLD *
            size;

        const y =
            p.y /
            WORLD *
            size;


        mapCtx.fillStyle =
            p.color ||
            "#ff4d62";

        mapCtx.beginPath();

        mapCtx.arc(
            x,
            y,
            4,
            0,
            Math.PI * 2
        );

        mapCtx.fill();
    }


    /*
        Me.
    */

    const mx =
        me.x /
        WORLD *
        size;

    const my =
        me.y /
        WORLD *
        size;


    mapCtx.fillStyle =
        me.color;

    mapCtx.shadowColor =
        me.color;

    mapCtx.shadowBlur = 10;

    mapCtx.beginPath();

    mapCtx.arc(
        mx,
        my,
        6,
        0,
        Math.PI * 2
    );

    mapCtx.fill();

    mapCtx.shadowBlur = 0;


    /*
        Border.
    */

    mapCtx.strokeStyle =
        "#63ff78";

    mapCtx.lineWidth = 2;

    mapCtx.strokeRect(
        1,
        1,
        size - 2,
        size - 2
    );
}


/* =====================================================
   MAIN LOOP
===================================================== */

function loop(){

    update();

    draw();

    requestAnimationFrame(
        loop
    );
}


/* =====================================================
   START CONNECTION
===================================================== */

connect();

loop();

</script>
