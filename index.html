<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>Snake Arena</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#07110a;
  font-family:Arial,sans-serif;
  touch-action:none;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}

#menu{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:
    radial-gradient(
      circle at 50% 0%,
      #245b2c,
      #07110a 70%
    );
  overflow:auto;
}

.panel{
  width:min(430px,94vw);
  padding:25px;
  border-radius:25px;
  background:rgba(7,15,8,.96);
  border:1px solid #376940;
  box-shadow:0 20px 80px #000;
  color:white;
  text-align:center;
}

.logo{
  font-size:65px;
}

h1{
  color:#64ff79;
  font-size:38px;
}

.subtitle{
  color:#829583;
  margin:5px 0 20px;
}

input{
  width:100%;
  height:48px;
  border-radius:12px;
  border:1px solid #345a39;
  background:#111c12;
  color:white;
  padding:0 14px;
  text-align:center;
  margin:5px 0;
  outline:none;
}

button{
  width:100%;
  min-height:48px;
  margin-top:8px;
  border:0;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
}

.green{
  background:#64ff79;
  color:#07110a;
}

.dark{
  background:#152219;
  color:white;
  border:1px solid #345a39;
}

.shop{
  margin-top:15px;
  padding-top:15px;
  border-top:1px solid #293b2b;
}

#shop{
  display:none;
}

.shopGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-top:10px;
}

.item{
  padding:10px;
  background:#111c12;
  border:1px solid #29462d;
  border-radius:12px;
}

.preview{
  width:45px;
  height:45px;
  border-radius:50%;
  margin:auto;
  border:3px solid white;
}

.item button{
  min-height:34px;
  font-size:12px;
}

#room{
  display:none;
  margin-top:12px;
  padding:12px;
  background:#101b11;
  border-radius:12px;
}

#roomCode{
  font-size:34px;
  color:#64ff79;
  font-weight:bold;
  letter-spacing:5px;
}

#error{
  color:#ff596b;
  min-height:22px;
  margin-top:8px;
}

#hud{
  display:none;
  position:fixed;
  z-index:20;
  top:10px;
  left:10px;
  gap:7px;
}

.stat{
  padding:7px 10px;
  border-radius:10px;
  background:rgba(0,0,0,.75);
  color:white;
  border:1px solid #345a39;
}

.stat small{
  display:block;
  color:#849785;
  font-size:9px;
}

#leaderboard{
  display:none;
  position:fixed;
  z-index:20;
  top:10px;
  right:10px;
  width:190px;
  padding:10px;
  border-radius:12px;
  background:rgba(0,0,0,.78);
  color:white;
  border:1px solid #345a39;
}

.lbtitle{
  color:#64ff79;
  font-weight:bold;
  margin-bottom:5px;
}

.lbrow{
  display:flex;
  justify-content:space-between;
  padding:4px 0;
  font-size:12px;
}

#minimap{
  display:none;
  position:fixed;
  z-index:20;
  right:10px;
  bottom:10px;
  width:160px;
  height:160px;
  border-radius:15px;
  border:2px solid #64ff79;
  overflow:hidden;
  background:#102015;
}

#mini{
  width:100%;
  height:100%;
}

#joystick{
  display:none;
  position:fixed;
  z-index:30;
  left:20px;
  bottom:20px;
  width:135px;
  height:135px;
  border-radius:50%;
  border:2px solid rgba(100,255,121,.4);
  background:rgba(100,255,121,.08);
}

#stick{
  position:absolute;
  left:50%;
  top:50%;
  width:55px;
  height:55px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:#64ff79;
  border:3px solid white;
}

#boost{
  display:none;
  position:fixed;
  z-index:30;
  right:25px;
  bottom:30px;
  width:82px;
  height:82px;
  border-radius:50%;
  background:#0784ba;
  color:white;
  border:3px solid #b9ecff;
  font-size:28px;
}

#gameover{
  display:none;
  position:fixed;
  inset:0;
  z-index:200;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.82);
}

.over{
  width:min(390px,90vw);
  padding:30px;
  border-radius:20px;
  background:#09130a;
  color:white;
  text-align:center;
  border:1px solid #345a39;
}

.over h2{
  color:#ff596b;
  font-size:38px;
}

@media(max-width:800px){

  #menu{
    align-items:flex-start;
  }

  #joystick,
  #boost{
    display:block;
  }

  #leaderboard{
    width:145px;
  }

}

</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="menu">

<div class="panel">

<div class="logo">🐍</div>

<h1>SNAKE ARENA</h1>

<div class="subtitle">
Grow • Boost • Survive
</div>

<input
  id="name"
  maxlength="16"
  placeholder="Sinu nimi"
>

<div style="margin:10px">
🪙 <b id="menuCoins">0</b> coins
</div>

<button
  class="dark"
  id="shopButton"
>
🛒 POOD
</button>

<div
  id="shop"
  class="shop"
>

<h3>SKINID</h3>

<div
  id="shopGrid"
  class="shopGrid"
></div>

</div>

<div class="shop">

<h3>🎮 SINGLEPLAYER</h3>

<button
  class="green"
  id="single"
>
🤖 MÄNGI BOTIDE VASTU
</button>

</div>

<div class="shop">

<h3>👥 MULTIPLAYER</h3>

<button
  class="dark"
  id="create"
>
🏠 LOO ROOM
</button>

<input
  id="roomInput"
  maxlength="5"
  placeholder="ROOM CODE"
>

<button
  class="dark"
  id="join"
>
🚪 LIITU ROOMI
</button>

<div id="room">

<div>ROOM CODE</div>

<div id="roomCode">
-----
</div>

<div id="roomPlayers"></div>

<button
  class="green"
  id="startRoom"
>
▶ ALUSTA
</button>

</div>

</div>

<div id="error"></div>

</div>

</div>

<div id="hud">

<div class="stat">
<small>SCORE</small>
<b id="score">0</b>
</div>

<div class="stat">
<small>KILLS</small>
<b id="kills">0</b>
</div>

<div class="stat">
<small>LENGTH</small>
<b id="length">30</b>
</div>

<div class="stat">
<small>COINS</small>
<b id="coins">0</b>
</div>

</div>

<div id="leaderboard">

<div class="lbtitle">
🏆 TOP 3
</div>

<div id="lb"></div>

</div>

<div id="minimap">

<canvas id="mini"></canvas>

</div>

<div id="joystick">

<div id="stick"></div>

</div>

<button id="boost">
⚡
</button>

<div id="gameover">

<div class="over">

<h2>GAME OVER</h2>

<p id="reason"></p>

<br>

<p>
Score:
<b id="finalScore">0</b>
</p>

<p>
Kills:
<b id="finalKills">0</b>
</p>

<button
  class="green"
  onclick="location.reload()"
>
🔄 UUESTI
</button>

</div>

</div>

<script>

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

const mini =
document.getElementById("mini");

const mctx =
mini.getContext("2d");

const WORLD = 12000;

let W = innerWidth;
let H = innerHeight;

function resize(){

  W = innerWidth;
  H = innerHeight;

  canvas.width = W;
  canvas.height = H;

  mini.width = 400;
  mini.height = 400;
}

resize();

addEventListener(
  "resize",
  resize
);

/* ======================
SAVE
====================== */

let coins =
Number(
  localStorage.getItem("coins") || 0
);

let owned =
JSON.parse(
  localStorage.getItem("owned")
  || '["green"]'
);

let equipped =
localStorage.getItem("skin")
|| "green";

const skins = [

  ["green","#64ff79",0],
  ["blue","#4ca6ff",30],
  ["red","#ff526b",50],
  ["yellow","#ffd84d",80],
  ["purple","#b96cff",100],
  ["orange","#ff8a3d",130],
  ["cyan","#00e5d4",160],
  ["pink","#ff65c7",200]

];

function save(){

  localStorage.setItem(
    "coins",
    coins
  );

  localStorage.setItem(
    "owned",
    JSON.stringify(owned)
  );

  localStorage.setItem(
    "skin",
    equipped
  );
}

function updateCoins(){

  document.getElementById(
    "coins"
  ).textContent = coins;

  document.getElementById(
    "menuCoins"
  ).textContent = coins;

}

/* ======================
SHOP
====================== */

function renderShop(){

  const grid =
    document.getElementById(
      "shopGrid"
    );

  grid.innerHTML = "";

  for(
    const s of skins
  ){

    const ownedSkin =
      owned.includes(s[0]);

    const div =
      document.createElement("div");

    div.className="item";

    div.innerHTML = `

      <div
        class="preview"
        style="background:${s[1]}"
      ></div>

      <div style="margin:5px">
        ${s[0]}
      </div>

      <small>
        ${ownedSkin
          ? "OSTETUD"
          : "🪙 "+s[2]}
      </small>

      <button>
        ${
          ownedSkin
            ? equipped===s[0]
              ? "✓ VALITUD"
              : "KASUTA"
            : "OSTA"
        }
      </button>

    `;

    div
      .querySelector("button")
      .onclick = () => {

        if(ownedSkin){

          equipped=s[0];

          save();

          applyColor();

          renderShop();

        }else{

          if(coins<s[2]){

            alert(
              "Sul pole piisavalt coine!"
            );

            return;

          }

          coins-=s[2];

          owned.push(s[0]);

          equipped=s[0];

          save();

          updateCoins();

          applyColor();

          renderShop();

        }

      };

    grid.appendChild(div);

  }

}

document.getElementById(
  "shopButton"
).onclick=()=>{

  const shop =
    document.getElementById(
      "shop"
    );

  shop.style.display =
    shop.style.display==="block"
      ? "none"
      : "block";

};

/* ======================
PLAYER
====================== */

const player={

  id:null,

  name:
    localStorage.getItem(
      "playerName"
    ) || "Player",

  x:WORLD/2,
  y:WORLD/2,

  angle:0,
  targetAngle:0,

  length:30,

  score:0,
  kills:0,

  color:"#64ff79",

  body:[]

};

document.getElementById(
  "name"
).value=player.name;

document.getElementById(
  "name"
).oninput=e=>{

  player.name=
    e.target.value
      .replace(/[<>]/g,"")
      .slice(0,16);

  localStorage.setItem(
    "playerName",
    player.name
  );

};

function applyColor(){

  const s =
    skins.find(
      x=>x[0]===equipped
    );

  if(s){
    player.color=s[1];
  }

}

applyColor();

function resetPlayer(){

  player.x =
    WORLD/2;

  player.y =
    WORLD/2;

  player.angle =
    Math.random()*Math.PI*2;

  player.targetAngle =
    player.angle;

  player.length=30;
  player.score=0;
  player.kills=0;

  player.body=[];

  for(
    let i=0;
    i<30;
    i++
  ){

    player.body.push({

      x:
        player.x -
        Math.cos(player.angle)*
        i*8,

      y:
        player.y -
        Math.sin(player.angle)*
        i*8

    });

  }

}

/* ======================
FOOD
====================== */

const food=[];

function makeFood(){

  return {

    x:Math.random()*(
      WORLD-200
    )+100,

    y:Math.random()*(
      WORLD-200
    )+100,

    r:4+Math.random()*4,

    value:1+Math.floor(
      Math.random()*3
    ),

    color:[
      "#64ff79",
      "#ffd84d",
      "#ff526b",
      "#4ca6ff",
      "#b96cff"
    ][
      Math.floor(
        Math.random()*5
      )
    ]

  };

}

for(
  let i=0;
  i<1000;
  i++
){

  food.push(
    makeFood()
  );

}

/* ======================
BOTS
====================== */

const bots=[];

const botNames=[
  "Viper",
  "Cobra",
  "Ghost",
  "Blaze",
  "Storm",
  "Ninja",
  "Hunter",
  "Python",
  "Venom",
  "Shadow"
];

const botColors=[
  "#4ca6ff",
  "#ff526b",
  "#ffd84d",
  "#b96cff",
  "#ff8a3d",
  "#00e5d4"
];

function makeBot(){

  const b={

    id:
      Math.random()
      .toString(36)
      .slice(2),

    name:
      botNames[
        Math.floor(
          Math.random()*
          botNames.length
        )
      ],

    x:
      500+
      Math.random()*
      (WORLD-1000),

    y:
      500+
      Math.random()*
      (WORLD-1000),

    angle:
      Math.random()*
      Math.PI*2,

    target:0,

    length:
      30+
      Math.random()*70,

    score:0,

    color:
      botColors[
        Math.floor(
          Math.random()*
          botColors.length
        )
      ],

    body:[],

    timer:0

  };

  b.target=b.angle;

  for(
    let i=0;
    i<b.length;
    i++
  ){

    b.body.push({

      x:
        b.x-
        Math.cos(b.angle)*
        i*8,

      y:
        b.y-
        Math.sin(b.angle)*
        i*8

    });

  }

  return b;
}

function createBots(){

  bots.length=0;

  for(
    let i=0;
    i<16;
    i++
  ){

    bots.push(
      makeBot()
    );

  }

}

/* ======================
CONTROL
====================== */

let mouseX=W/2;
let mouseY=H/2;

addEventListener(
  "mousemove",
  e=>{

    mouseX=e.clientX;
    mouseY=e.clientY;

  }
);

function mouseControl(){

  if(innerWidth<=800)
    return;

  const dx =
    mouseX-W/2;

  const dy =
    mouseY-H/2;

  if(
    Math.hypot(dx,dy)>5
  ){

    player.targetAngle =
      Math.atan2(
        dy,
        dx
      );

  }

}

/* KEYBOARD */

const keys={};

addEventListener(
  "keydown",
  e=>{

    keys[e.key.toLowerCase()]=true;

    if(
      e.code==="Space"
    ){

      boosting=true;

    }

    if(
      e.key==="ArrowUp" ||
      e.key.toLowerCase()==="w"
    ){

      player.targetAngle=
        -Math.PI/2;

    }

    if(
      e.key==="ArrowDown" ||
      e.key.toLowerCase()==="s"
    ){

      player.targetAngle=
        Math.PI/2;

    }

    if(
      e.key==="ArrowLeft" ||
      e.key.toLowerCase()==="a"
    ){

      player.targetAngle=
        Math.PI;

    }

    if(
      e.key==="ArrowRight" ||
      e.key.toLowerCase()==="d"
    ){

      player.targetAngle=0;

    }

  }
);

addEventListener(
  "keyup",
  e=>{

    keys[e.key.toLowerCase()]=false;

    if(
      e.code==="Space"
    ){

      boosting=false;

    }

  }
);

/* ======================
JOYSTICK
====================== */

const joystick =
document.getElementById(
  "joystick"
);

const stick =
document.getElementById(
  "stick"
);

let joy=false;

function joyMove(x,y){

  const r =
    joystick.getBoundingClientRect();

  const cx =
    r.left+r.width/2;

  const cy =
    r.top+r.height/2;

  let dx=x-cx;
  let dy=y-cy;

  const max=52;

  const d=Math.hypot(dx,dy);

  if(d>max){

    dx=dx/d*max;
    dy=dy/d*max;

  }

  stick.style.left =
    `calc(50% + ${dx}px)`;

  stick.style.top =
    `calc(50% + ${dy}px)`;

  if(d>7){

    player.targetAngle =
      Math.atan2(dy,dx);

  }

}

joystick.addEventListener(
  "pointerdown",
  e=>{

    joy=true;

    joystick.setPointerCapture(
      e.pointerId
    );

    joyMove(
      e.clientX,
      e.clientY
    );

  }
);

joystick.addEventListener(
  "pointermove",
  e=>{

    if(joy){

      joyMove(
        e.clientX,
        e.clientY
      );

    }

  }
);

function joyStop(){

  joy=false;

  stick.style.left="50%";
  stick.style.top="50%";

}

joystick.addEventListener(
  "pointerup",
  joyStop
);

joystick.addEventListener(
  "pointercancel",
  joyStop
);

/* ======================
BOOST
====================== */

let boosting=false;

const boost=
document.getElementById(
  "boost"
);

boost.addEventListener(
  "pointerdown",
  e=>{

    e.preventDefault();

    boosting=true;

  }
);

boost.addEventListener(
  "pointerup",
  ()=>{
    boosting=false;
  }
);

boost.addEventListener(
  "pointercancel",
  ()=>{
    boosting=false;
  }
);

canvas.addEventListener(
  "pointerdown",
  ()=>{
    if(innerWidth>800){
      boosting=true;
    }
  }
);

canvas.addEventListener(
  "pointerup",
  ()=>{
    boosting=false;
  }
);

/* ======================
SMOOTH ANGLE
====================== */

function smoothTurn(){

  let d =
    player.targetAngle-
    player.angle;

  while(d>Math.PI)
    d-=Math.PI*2;

  while(d<-Math.PI)
    d+=Math.PI*2;

  player.angle += d*.16;

}

/* ======================
LOCAL PLAYER
====================== */

function updatePlayer(){

  mouseControl();

  smoothTurn();

  const speed =
    boosting
      ? 11
      : 7.2;

  player.x +=
    Math.cos(player.angle)*
    speed;

  player.y +=
    Math.sin(player.angle)*
    speed;

  if(
    player.x<30 ||
    player.x>WORLD-30 ||
    player.y<30 ||
    player.y>WORLD-30
  ){

    die(
      "Läksid vastu arena serva!"
    );

    return;

  }

  player.body.unshift({

    x:player.x,
    y:player.y

  });

  if(
    boosting &&
    player.length>32
  ){

    player.length-=.035;

  }

  while(
    player.body.length<
    Math.floor(player.length)
  ){

    const last =
      player.body[
        player.body.length-1
      ];

    player.body.push({

      x:last.x,
      y:last.y

    });

  }

  while(
    player.body.length>
    Math.floor(player.length)
  ){

    player.body.pop();

  }

  eatFood();

}

/* ======================
EAT FOOD
====================== */

function eatFood(){

  for(
    let i=food.length-1;
    i>=0;
    i--
  ){

    const f=food[i];

    if(
      Math.hypot(
        player.x-f.x,
        player.y-f.y
      )<27
    ){

      player.score+=f.value;

      player.length+=
        f.value*.8;

      food.splice(i,1);

      food.push(
        makeFood()
      );

    }

  }

}

/* ======================
BOT AI
====================== */

function updateBots(){

  for(
    const b of bots
  ){

    b.timer--;

    if(
      b.timer<=0
    ){

      b.timer=
        30+
        Math.random()*80;

      let nearest=null;
      let best=Infinity;

      for(
        let i=0;
        i<food.length;
        i+=5
      ){

        const f=food[i];

        const d=
          Math.hypot(
            b.x-f.x,
            b.y-f.y
          );

        if(d<best){

          best=d;
          nearest=f;

        }

      }

      if(nearest){

        b.target=
          Math.atan2(
            nearest.y-b.y,
            nearest.x-b.x
          );

      }

    }

    let d=
      b.target-b.angle;

    while(d>Math.PI)
      d-=Math.PI*2;

    while(d<-Math.PI)
      d+=Math.PI*2;

    b.angle+=d*.045;

    b.x+=
      Math.cos(b.angle)*5.4;

    b.y+=
      Math.sin(b.angle)*5.4;

    if(
      b.x<100 ||
      b.x>WORLD-100
    ){

      b.target=
        Math.PI-b.target;

    }

    if(
      b.y<100 ||
      b.y>WORLD-100
    ){

      b.target=
        -b.target;

    }

    b.body.unshift({
      x:b.x,
      y:b.y
    });

    while(
      b.body.length<
      Math.floor(b.length)
    ){

      const last=
        b.body[
          b.body.length-1
        ];

      b.body.push({
        x:last.x,
        y:last.y
      });

    }

    while(
      b.body.length>
      Math.floor(b.length)
    ){

      b.body.pop();

    }

    eatBotFood(b);

  }

  botCollisions();

}

function eatBotFood(b){

  for(
    let i=food.length-1;
    i>=0;
    i--
  ){

    const f=food[i];

    if(
      Math.hypot(
        b.x-f.x,
        b.y-f.y
      )<25
    ){

      b.score+=f.value;
      b.length+=f.value*.7;

      food.splice(i,1);
      food.push(makeFood());

      break;

    }

  }

}

/* ======================
COMBAT
====================== */

function botCollisions(){

  for(
    let bi=bots.length-1;
    bi>=0;
    bi--
  ){

    const b=bots[bi];

    /* bot head into player */

    for(
      let i=7;
      i<player.body.length;
      i+=2
    ){

      const part=
        player.body[i];

      if(
        Math.hypot(
          b.x-part.x,
          b.y-part.y
        )<23
      ){

        killBot(bi);

        break;

      }

    }

    if(
      !bots.includes(b)
    )
      continue;

    /* player head into bot */

    for(
      let i=7;
      i<b.body.length;
      i+=2
    ){

      const part=
        b.body[i];

      if(
        Math.hypot(
          player.x-part.x,
          player.y-part.y
        )<23
      ){

        die(
          b.name+
          " tabas sinu keha!"
        );

        return;

      }

    }

  }

}

function killBot(index){

  const b=bots[index];

  if(!b)
    return;

  for(
    let i=0;
    i<b.body.length;
    i+=4
  ){

    food.push({

      x:b.body[i].x,
      y:b.body[i].y,

      r:6,

      value:2,

      color:b.color

    });

  }

  bots.splice(
    index,
    1
  );

  player.kills++;
  player.score+=10;
  player.length+=10;

  coins+=10;

  save();
  updateCoins();

  setTimeout(
    ()=>{
      if(running){
        bots.push(makeBot());
      }
    },
    600
  );

}

/* ======================
DRAW SNAKE
====================== */

function drawSnake(s){

  if(
    !s.body ||
    !s.body.length
  )
    return;

  /*
    Draw tail first.
  */

  for(
    let i=s.body.length-1;
    i>=0;
    i--
  ){

    const p=s.body[i];

    const radius=
      i===0
        ? 23
        : Math.max(
            9,
            15-
            i/
            s.body.length*
            5
          );

    ctx.fillStyle=s.color;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      radius,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

  /*
    HEAD
  */

  ctx.save();

  ctx.translate(
    s.x,
    s.y
  );

  ctx.rotate(
    s.angle
  );

  ctx.fillStyle=s.color;

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    23,
    0,
    Math.PI*2
  );

  ctx.fill();

  /*
    eyes
  */

  ctx.fillStyle="white";

  ctx.beginPath();

  ctx.arc(
    10,
    -8,
    7,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.arc(
    10,
    8,
    7,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle="#111";

  ctx.beginPath();

  ctx.arc(
    13,
    -8,
    3,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.arc(
    13,
    8,
    3,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();

  /*
    NAME
  */

  ctx.textAlign="center";

  ctx.font=
    "bold 14px Arial";

  ctx.strokeStyle=
    "rgba(0,0,0,.8)";

  ctx.lineWidth=4;

  ctx.strokeText(
    s.name || "Player",
    s.x,
    s.y-36
  );

  ctx.fillStyle="white";

  ctx.fillText(
    s.name || "Player",
    s.x,
    s.y-36
  );

}

/* ======================
DRAW WORLD
====================== */

function draw(){

  ctx.fillStyle="#07110a";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

  if(!running)
    return;

  ctx.save();

  ctx.translate(
    W/2-player.x,
    H/2-player.y
  );

  /*
    ARENA
  */

  ctx.fillStyle="#102316";

  ctx.fillRect(
    0,
    0,
    WORLD,
    WORLD
  );

  /*
    GRID
  */

  ctx.strokeStyle=
    "rgba(255,255,255,.035)";

  const grid=120;

  const sx=
    Math.floor(
      (player.x-W/2)/grid
    )*grid;

  const ex=
    Math.ceil(
      (player.x+W/2)/grid
    )*grid;

  for(
    let x=sx;
    x<=ex;
    x+=grid
  ){

    ctx.beginPath();

    ctx.moveTo(
      x,
      player.y-H/2
    );

    ctx.lineTo(
      x,
      player.y+H/2
    );

    ctx.stroke();

  }

  const sy=
    Math.floor(
      (player.y-H/2)/grid
    )*grid;

  const ey=
    Math.ceil(
      (player.y+H/2)/grid
    )*grid;

  for(
    let y=sy;
    y<=ey;
    y+=grid
  ){

    ctx.beginPath();

    ctx.moveTo(
      player.x-W/2,
      y
    );

    ctx.lineTo(
      player.x+W/2,
      y
    );

    ctx.stroke();

  }

  /*
    FOOD
  */

  for(
    const f of food
  ){

    if(
      Math.abs(
        f.x-player.x
      )>W/2+100 ||
      Math.abs(
        f.y-player.y
      )>H/2+100
    )
      continue;

    ctx.fillStyle=f.color;

    ctx.beginPath();

    ctx.arc(
      f.x,
      f.y,
      f.r,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

  /*
    BOTS
  */

  for(
    const b of bots
  ){

    drawSnake(b);

  }

  /*
    REMOTE
  */

  for(
    const p of remote.values()
  ){

    if(p.alive!==false){

      drawSnake(p);

    }

  }

  /*
    PLAYER
  */

  drawSnake(player);

  ctx.restore();

  drawMini();

}

/* ======================
MINIMAP
====================== */

function miniPoint(
  x,
  y,
  color,
  size
){

  mctx.fillStyle=color;

  mctx.beginPath();

  mctx.arc(
    x/WORLD*400,
    y/WORLD*400,
    size,
    0,
    Math.PI*2
  );

  mctx.fill();

}

function drawMini(){

  mctx.fillStyle="#102015";

  mctx.fillRect(
    0,
    0,
    400,
    400
  );

  for(
    const b of bots
  ){

    miniPoint(
      b.x,
      b.y,
      b.color,
      5
    );

  }

  for(
    const p of remote.values()
  ){

    if(p.alive!==false){

      miniPoint(
        p.x,
        p.y,
        p.color,
        5
      );

    }

  }

  miniPoint(
    player.x,
    player.y,
    player.color,
    8
  );

}

/* ======================
LEADERBOARD
====================== */

function updateLeaderboard(){

  const all=[{

    name:player.name,
    score:player.score,
    color:player.color

  }];

  for(
    const b of bots
  ){

    all.push({

      name:b.name,
      score:b.score,
      color:b.color

    });

  }

  for(
    const p of remote.values()
  ){

    all.push({

      name:p.name,
      score:p.score,
      color:p.color

    });

  }

  all.sort(
    (a,b)=>
      b.score-a.score
  );

  const box=
    document.getElementById(
      "lb"
    );

  box.innerHTML="";

  all.slice(0,3)
    .forEach(
      (p,i)=>{

        const row=
          document.createElement(
            "div"
          );

        row.className="lbrow";

        row.innerHTML=`

          <span style="color:${p.color}">
            ${i+1}. ${p.name}
          </span>

          <b>
            ${Math.floor(p.score)}
          </b>

        `;

        box.appendChild(row);

      }
    );

}

/* ======================
HUD
====================== */

function updateHUD(){

  document.getElementById(
    "score"
  ).textContent=
    Math.floor(player.score);

  document.getElementById(
    "kills"
  ).textContent=
    player.kills;

  document.getElementById(
    "length"
  ).textContent=
    Math.floor(player.length);

  updateCoins();
  updateLeaderboard();

}

/* ======================
DEATH
====================== */

let running=false;
let dead=false;

function die(reason){

  if(dead)
    return;

  dead=true;
  running=false;

  document.getElementById(
    "reason"
  ).textContent=
    reason;

  document.getElementById(
    "finalScore"
  ).textContent=
    Math.floor(player.score);

  document.getElementById(
    "finalKills"
  ).textContent=
    player.kills;

  document.getElementById(
    "gameover"
  ).style.display=
    "flex";

}

/* ======================
START
====================== */

function startGame(){

  resetPlayer();

  dead=false;
  running=true;

  document.getElementById(
    "menu"
  ).style.display="none";

  document.getElementById(
    "hud"
  ).style.display="flex";

  document.getElementById(
    "leaderboard"
  ).style.display="block";

  document.getElementById(
    "minimap"
  ).style.display="block";

}

document.getElementById(
  "single"
).onclick=()=>{

  multiplayer=false;

  createBots();

  startGame();

};

/* ======================
MULTIPLAYER
====================== */

let socket=null;
let multiplayer=false;
let myId=null;

const remote=new Map();

function connect(){

  const protocol=
    location.protocol==="https:"
      ? "wss:"
      : "ws:";

  socket=
    new WebSocket(
      protocol+
      "//"+
      location.host
    );

  socket.onmessage=e=>{

    let data;

    try{
      data=JSON.parse(e.data);
    }catch{
      return;
    }

    if(
      data.type==="connected"
    ){

      myId=data.id;
      player.id=myId;

    }

    if(
      data.type==="roomCreated" ||
      data.type==="roomJoined"
    ){

      multiplayer=true;

      myId=data.id;

      player.id=myId;

      document.getElementById(
        "room"
      ).style.display="block";

      document.getElementById(
        "roomCode"
      ).textContent=
        data.code;

    }

    if(
      data.type==="gameStart"
    ){

      startGame();

    }

    if(
      data.type==="state"
    ){

      const me=
        data.players.find(
          p=>p.id===myId
        );

      if(me){

        /*
          Multiplayeri puhul server
          kinnitab positsiooni.
        */

        player.x=
          lerp(
            player.x,
            me.x,
            .35
          );

        player.y=
          lerp(
            player.y,
            me.y,
            .35
          );

        player.angle=
          lerpAngle(
            player.angle,
            me.angle,
            .35
          );

        player.length=
          me.length;

        player.score=
          me.score;

        player.kills=
          me.kills;

        player.body=
          me.body || [];

      }

      remote.clear();

      for(
        const p of data.players
      ){

        if(
          p.id!==myId
        ){

          remote.set(
            p.id,
            p
          );

        }

      }

      updateRoomPlayers(
        data.players
      );

    }

    if(
      data.type==="error"
    ){

      document.getElementById(
        "error"
      ).textContent=
        data.message;

    }

  };

}

function lerp(a,b,t){

  return a+(b-a)*t;

}

function lerpAngle(a,b,t){

  let d=b-a;

  while(d>Math.PI)
    d-=Math.PI*2;

  while(d<-Math.PI)
    d+=Math.PI*2;

  return a+d*t;

}

function sendInput(){

  if(
    !multiplayer ||
    !socket ||
    socket.readyState!==WebSocket.OPEN ||
    !running
  )
    return;

  socket.send(
    JSON.stringify({

      type:"input",

      angle:
        player.targetAngle,

      boosting

    })
  );

}

/* ======================
ROOMS
====================== */

document.getElementById(
  "create"
).onclick=()=>{

  if(
    !socket ||
    socket.readyState!==WebSocket.OPEN
  ){

    document.getElementById(
      "error"
    ).textContent=
      "Serveriga pole ühendust.";

    return;

  }

  socket.send(
    JSON.stringify({

      type:"createRoom",

      name:player.name,

      color:player.color

    })
  );

};

document.getElementById(
  "join"
).onclick=()=>{

  const code=
    document.getElementById(
      "roomInput"
    ).value
    .trim()
    .toUpperCase();

  if(!code){

    document.getElementById(
      "error"
    ).textContent=
      "Sisesta roomi kood.";

    return;

  }

  socket.send(
    JSON.stringify({

      type:"joinRoom",

      code,

      name:player.name,

      color:player.color

    })
  );

};

document.getElementById(
  "startRoom"
).onclick=()=>{

  if(socket){

    socket.send(
      JSON.stringify({

        type:"startRoom"

      })
    );

  }

};

function updateRoomPlayers(players){

  const box=
    document.getElementById(
      "roomPlayers"
    );

  box.innerHTML="";

  for(
    const p of players
  ){

    const div=
      document.createElement(
        "div"
      );

    div.textContent=
      p.name;

    div.style.color=
      p.color;

    box.appendChild(div);

  }

}

/* ======================
GAME LOOP
====================== */

function loop(){

  if(running){

    if(multiplayer){

      /*
        Client-side movement makes
        controls feel instant.
      */

      mouseControl();
      smoothTurn();

      const speed=
        boosting
          ? 11
          : 7.2;

      player.x+=
        Math.cos(player.angle)*
        speed;

      player.y+=
        Math.sin(player.angle)*
        speed;

      player.body.unshift({

        x:player.x,
        y:player.y

      });

      if(
        boosting &&
        player.length>32
      ){

        player.length-=.035;

      }

      while(
        player.body.length<
        Math.floor(player.length)
      ){

        const last=
          player.body[
            player.body.length-1
          ];

        player.body.push({

          x:last.x,
          y:last.y

        });

      }

      while(
        player.body.length>
        Math.floor(player.length)
      ){

        player.body.pop();

      }

      sendInput();

    }else{

      updatePlayer();
      updateBots();

    }

    updateHUD();

  }

  draw();

  requestAnimationFrame(loop);

}

/* ======================
START
====================== */

updateCoins();
renderShop();
connect();

requestAnimationFrame(
  loop
);

</script>
