<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Snake Arena</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050805;
    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

#menu{
    position:fixed;
    inset:0;
    z-index:50;
    overflow-y:auto;
    padding:25px 12px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    radial-gradient(circle at 50% 10%,#235f2d,#0a1b0d 45%,#020402 90%);
}

.panel{
    width:min(94vw,470px);
    padding:25px;
    background:rgba(4,12,5,.97);
    border:1px solid rgba(99,255,120,.4);
    border-radius:25px;
    box-shadow:0 0 60px rgba(99,255,120,.15);
    color:white;
    text-align:center;
}

.logo{
    font-size:60px;
}

h1{
    color:#63ff78;
    font-size:38px;
    margin:4px 0;
}

.subtitle{
    color:#819482;
    margin-bottom:18px;
}

input{
    width:100%;
    height:48px;
    margin:5px 0;
    border-radius:12px;
    border:1px solid #315c37;
    background:#071007;
    color:white;
    text-align:center;
    font-size:16px;
    outline:none;
}

button{
    font-weight:bold;
    cursor:pointer;
}

.mainBtn{
    width:100%;
    min-height:50px;
    margin-top:8px;
    border-radius:12px;
    border:0;
    font-size:16px;
}

.green{
    background:#63ff78;
    color:#031006;
}

.dark{
    background:#102014;
    color:white;
    border:1px solid #315b36;
}

#skins{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:9px;
    margin:12px 0 16px;
}

.skin{
    width:52px;
    height:52px;
    border-radius:50%;
    border:3px solid transparent;
    font-size:23px;
}

.skin.selected{
    border-color:white;
    box-shadow:0 0 18px currentColor;
    transform:scale(1.08);
}

#shop{
    display:none;
    margin-top:15px;
    padding:15px;
    border-radius:15px;
    background:#09130a;
    border:1px solid #315b36;
}

.shopItem{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin:7px 0;
    padding:9px;
    background:#101d11;
    border-radius:10px;
}

.shopColor{
    width:30px;
    height:30px;
    border-radius:50%;
}

.buy{
    padding:8px 11px;
    border:0;
    border-radius:8px;
    background:#63ff78;
}

.buy.owned{
    background:#263a29;
    color:#9cffaa;
}

#coins{
    color:#ffd84d;
    font-weight:bold;
    margin:8px;
}

#leaderboard{
    position:fixed;
    right:12px;
    top:12px;
    z-index:15;
    width:190px;
    padding:10px;
    border-radius:14px;
    background:rgba(0,0,0,.72);
    border:1px solid rgba(99,255,120,.3);
    color:white;
    display:none;
}

#leaderboard h3{
    color:#63ff78;
    text-align:center;
    font-size:14px;
    margin-bottom:6px;
}

.lb{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    padding:4px;
}

#hud{
    position:fixed;
    z-index:15;
    left:10px;
    top:10px;
    display:none;
    gap:6px;
}

.stat{
    padding:7px 10px;
    background:rgba(0,0,0,.65);
    border:1px solid rgba(99,255,120,.25);
    border-radius:10px;
    color:white;
}

.stat small{
    display:block;
    color:#78907c;
    font-size:9px;
}

.stat b{
    font-size:16px;
}

#killText{
    position:fixed;
    z-index:30;
    left:50%;
    top:24%;
    transform:translate(-50%,-50%) scale(.6);
    opacity:0;
    color:#63ff78;
    font-size:36px;
    font-weight:900;
    text-shadow:0 0 20px #63ff78;
    transition:.2s;
    pointer-events:none;
}

#killText.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
}

#joystick{
    position:fixed;
    z-index:20;
    left:22px;
    bottom:22px;
    width:140px;
    height:140px;
    display:none;
    border-radius:50%;
    background:rgba(99,255,120,.08);
    border:2px solid rgba(99,255,120,.35);
}

#stick{
    position:absolute;
    left:50%;
    top:50%;
    width:62px;
    height:62px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:#63ff78;
    border:3px solid white;
}

#boost{
    position:fixed;
    right:25px;
    bottom:28px;
    z-index:20;
    width:90px;
    height:90px;
    display:none;
    border-radius:50%;
    border:3px solid #b5eaff;
    background:#087bb0;
    color:white;
    font-size:28px;
}

#gameOver{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.82);
}

.overPanel{
    width:min(90vw,400px);
    padding:30px;
    border-radius:25px;
    background:#081008;
    border:1px solid #315b36;
    color:white;
    text-align:center;
}

.overPanel h2{
    color:#ff596c;
    font-size:38px;
    margin-bottom:12px;
}

@media(max-width:800px){
    #joystick,#boost{
        display:block;
    }

    #leaderboard{
        width:150px;
        top:145px;
        right:8px;
    }

    #hud{
        transform:scale(.9);
        transform-origin:top left;
    }

    #menu{
        align-items:flex-start;
    }

    .panel{
        margin:auto 0;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="menu">
<div class="panel">

<div class="logo">🐍</div>
<h1>SNAKE ARENA</h1>
<div class="subtitle">Eat • Grow • Fight</div>

<input id="name" maxlength="16" placeholder="Sinu nimi">

<h3>🎨 Sinu skin</h3>

<div id="skins">

<button class="skin selected"
data-color="#63ff78"
data-skin="green"
style="background:#63ff78">🐍</button>

<button class="skin"
data-color="#4da6ff"
data-skin="blue"
style="background:#4da6ff">😎</button>

<button class="skin"
data-color="#ff5570"
data-skin="red"
style="background:#ff5570">😈</button>

<button class="skin"
data-color="#ffd84d"
data-skin="yellow"
style="background:#ffd84d">😄</button>

<button class="skin"
data-color="#b86cff"
data-skin="purple"
style="background:#b86cff">👾</button>

<button class="skin"
data-color="#ff8a3d"
data-skin="orange"
style="background:#ff8a3d">🔥</button>

<button class="skin"
data-color="#ffffff"
data-skin="white"
style="background:white;color:black">👻</button>

<button class="skin"
data-color="#00e5d4"
data-skin="cyan"
style="background:#00e5d4">🤖</button>

</div>

<div id="coins">🪙 Coins: 0</div>

<button class="mainBtn green" id="botBtn">
🤖 MÄNGI BOTIDE VASTU
</button>

<button class="mainBtn dark" id="shopBtn">
🛒 POOD
</button>

<button class="mainBtn dark" id="roomBtn">
🌐 MULTIPLAYER ROOM
</button>

<div id="shop">
<h2>🛒 POOD</h2>
<div id="shopItems"></div>
</div>

<div id="roomArea" style="display:none">

<input id="roomCode" maxlength="6" placeholder="ROOM CODE">

<button class="mainBtn green" id="createRoom">
🏠 CREATE ROOM
</button>

<button class="mainBtn dark" id="joinRoom">
🚪 JOIN ROOM
</button>

</div>

<div id="error"></div>

</div>
</div>


<div id="hud">

<div class="stat">
<small>SCORE</small>
<b id="score">0</b>
</div>

<div class="stat">
<small>LENGTH</small>
<b id="length">20</b>
</div>

<div class="stat">
<small>KILLS</small>
<b id="kills">0</b>
</div>

</div>


<div id="leaderboard">
<h3>🏆 TOP 3</h3>
<div id="lb1"></div>
<div id="lb2"></div>
<div id="lb3"></div>
</div>


<div id="killText">💥 ELIMINATED!</div>


<div id="joystick">
<div id="stick"></div>
</div>

<button id="boost">⚡</button>


<div id="gameOver">

<div class="overPanel">

<h2>GAME OVER</h2>

<p id="deathReason">Sind surnud!</p>

<p style="margin:12px">
Skoor: <b id="finalScore">0</b>
</p>

<p>
Tapmised: <b id="finalKills">0</b>
</p>

<button
class="mainBtn green"
onclick="location.reload()">
🔄 TAGASI MENÜÜS
</button>

</div>
</div>


<script>

/* =========================
   CANVAS
========================= */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){
    W=innerWidth;
    H=innerHeight;
    canvas.width=W;
    canvas.height=H;
}

addEventListener("resize",resize);
resize();


/* =========================
   WORLD
========================= */

const WORLD=10000;


/* =========================
   PLAYER
========================= */

const player={
    x:WORLD/2,
    y:WORLD/2,
    angle:0,
    targetAngle:0,
    length:20,
    color:"#63ff78",
    skin:"green",
    name:"Player",
    speed:5.4
};

let body=[];

let running=false;
let dead=false;
let boosting=false;

let score=0;
let kills=0;

let cameraX=player.x;
let cameraY=player.y;


/* =========================
   BOTS
========================= */

let bots=[];

const botNames=[
    "Shadow",
    "Speedy",
    "Ninja",
    "Rex",
    "Cobra",
    "Ghost",
    "Pixel",
    "Tiger",
    "Venom",
    "Storm"
];

const botColors=[
    "#ff5570",
    "#4da6ff",
    "#ffd84d",
    "#b86cff",
    "#ff8a3d",
    "#00e5d4",
    "#ffffff",
    "#ff66cc"
];

function randomBot(){

    const a=Math.random()*Math.PI*2;

    const distance=700+Math.random()*3000;

    return {
        id:Math.random().toString(36).slice(2),
        x:WORLD/2+Math.cos(a)*distance,
        y:WORLD/2+Math.sin(a)*distance,
        angle:Math.random()*Math.PI*2,
        targetAngle:Math.random()*Math.PI*2,
        length:20+Math.random()*45,
        color:botColors[Math.floor(Math.random()*botColors.length)],
        name:botNames[Math.floor(Math.random()*botNames.length)],
        speed:3.2+Math.random()*1.5,
        think:0,
        alive:true
    };
}

function createBots(){

    bots=[];

    for(let i=0;i<12;i++){
        bots.push(randomBot());
    }
}


/* =========================
   FOOD
========================= */

let foods=[];

function makeFood(x,y){

    return {
        x:x===undefined?Math.random()*WORLD:x,
        y:y===undefined?Math.random()*WORLD:y,
        r:3+Math.random()*4,
        color:botColors[Math.floor(Math.random()*botColors.length)],
        value:1+Math.floor(Math.random()*3)
    };
}

function createFood(){

    foods=[];

    for(let i=0;i<1400;i++){
        foods.push(makeFood());
    }
}


/* =========================
   COINS / SHOP
========================= */

let coins=Number(localStorage.getItem("snakeCoins")||0);

let owned=JSON.parse(
    localStorage.getItem("snakeOwned")||
    '["green"]'
);

function saveShop(){

    localStorage.setItem(
        "snakeCoins",
        coins
    );

    localStorage.setItem(
        "snakeOwned",
        JSON.stringify(owned)
    );

    updateCoins();
}

function updateCoins(){

    document.getElementById("coins").textContent=
        "🪙 Coins: "+coins;
}

const shopSkins=[
    {id:"green",color:"#63ff78",price:0},
    {id:"blue",color:"#4da6ff",price:20},
    {id:"red",color:"#ff5570",price:30},
    {id:"yellow",color:"#ffd84d",price:40},
    {id:"purple",color:"#b86cff",price:50},
    {id:"orange",color:"#ff8a3d",price:60},
    {id:"white",color:"#ffffff",price:75},
    {id:"cyan",color:"#00e5d4",price:100}
];

function renderShop(){

    const box=document.getElementById("shopItems");

    box.innerHTML="";

    shopSkins.forEach(s=>{

        const row=document.createElement("div");
        row.className="shopItem";

        const circle=document.createElement("div");
        circle.className="shopColor";
        circle.style.background=s.color;

        const title=document.createElement("span");
        title.textContent=s.id.toUpperCase();

        const button=document.createElement("button");
        button.className="buy";

        if(owned.includes(s.id)){
            button.textContent="KASUTAN";
            button.classList.add("owned");
        }else{
            button.textContent="🪙 "+s.price;
        }

        button.onclick=()=>{

            if(owned.includes(s.id)){

                player.color=s.color;
                player.skin=s.id;

                document
                .querySelectorAll(".skin")
                .forEach(b=>{
                    if(b.dataset.skin===s.id){
                        b.classList.add("selected");
                    }else{
                        b.classList.remove("selected");
                    }
                });

                return;
            }

            if(coins<s.price){
                alert("Sul pole piisavalt coine!");
                return;
            }

            coins-=s.price;
            owned.push(s.id);

            player.color=s.color;
            player.skin=s.id;

            saveShop();
            renderShop();
        };

        row.appendChild(circle);
        row.appendChild(title);
        row.appendChild(button);

        box.appendChild(row);
    });
}

updateCoins();
renderShop();


/* =========================
   SKIN BUTTONS
========================= */

document.querySelectorAll(".skin").forEach(button=>{

    button.onclick=()=>{

        const id=button.dataset.skin;

        if(!owned.includes(id)){
            alert("Osta see skin poest!");
            return;
        }

        document
        .querySelectorAll(".skin")
        .forEach(b=>b.classList.remove("selected"));

        button.classList.add("selected");

        player.color=button.dataset.color;
        player.skin=id;
    };
});


/* =========================
   MENU
========================= */

document.getElementById("shopBtn").onclick=()=>{

    const shop=document.getElementById("shop");

    shop.style.display=
        shop.style.display==="block"
        ?"none"
        :"block";

    renderShop();
};

document.getElementById("roomBtn").onclick=()=>{

    const area=document.getElementById("roomArea");

    area.style.display=
        area.style.display==="block"
        ?"none"
        :"block";
};


/* =========================
   START BOT MODE
========================= */

document.getElementById("botBtn").onclick=()=>{

    startBotGame();

};


/* =========================
   START GAME
========================= */

function startBotGame(){

    player.name=
        document.getElementById("name").value.trim()
        ||"Player";

    player.x=WORLD/2;
    player.y=WORLD/2;

    player.angle=Math.random()*Math.PI*2;
    player.targetAngle=player.angle;

    player.length=20;

    score=0;
    kills=0;

    dead=false;
    running=true;
    boosting=false;

    body=[];

    for(let i=0;i<20;i++){

        body.push({
            x:player.x-
                Math.cos(player.angle)*i*9,
            y:player.y-
                Math.sin(player.angle)*i*9
        });

    }

    createFood();
    createBots();

    document.getElementById("menu").style.display="none";
    document.getElementById("hud").style.display="flex";
    document.getElementById("leaderboard").style.display="block";

    updateHUD();
}


/* =========================
   KEYBOARD
========================= */

const keys={};

addEventListener("keydown",e=>{

    keys[e.key.toLowerCase()]=true;

    if(e.key==="Shift"){
        boosting=true;
    }

});

addEventListener("keyup",e=>{

    keys[e.key.toLowerCase()]=false;

    if(e.key==="Shift"){
        boosting=false;
    }

});

function keyboardControl(){

    let dx=0;
    let dy=0;

    if(keys.w||keys.arrowup)dy=-1;
    if(keys.s||keys.arrowdown)dy=1;
    if(keys.a||keys.arrowleft)dx=-1;
    if(keys.d||keys.arrowright)dx=1;

    if(dx||dy){

        player.targetAngle=Math.atan2(dy,dx);

    }
}


/* =========================
   MOUSE
========================= */

addEventListener("mousemove",e=>{

    if(!running)return;

    if(innerWidth<=800)return;

    const dx=e.clientX-W/2;
    const dy=e.clientY-H/2;

    if(Math.hypot(dx,dy)>15){

        player.targetAngle=Math.atan2(dy,dx);

    }

});


/* =========================
   JOYSTICK
========================= */

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joyId=null;

function moveJoy(x,y){

    const r=joystick.getBoundingClientRect();

    const cx=r.left+r.width/2;
    const cy=r.top+r.height/2;

    let dx=x-cx;
    let dy=y-cy;

    const max=53;

    const d=Math.hypot(dx,dy);

    if(d>max){

        dx=dx/d*max;
        dy=dy/d*max;

    }

    stick.style.left=
        `calc(50% + ${dx}px)`;

    stick.style.top=
        `calc(50% + ${dy}px)`;

    if(d>7){

        player.targetAngle=
            Math.atan2(dy,dx);

    }
}

function resetJoy(){

    joyId=null;

    stick.style.left="50%";
    stick.style.top="50%";
}

joystick.onpointerdown=e=>{

    joyId=e.pointerId;

    joystick.setPointerCapture(e.pointerId);

    moveJoy(e.clientX,e.clientY);

};

joystick.onpointermove=e=>{

    if(e.pointerId===joyId){
        moveJoy(e.clientX,e.clientY);
    }

};

joystick.onpointerup=resetJoy;
joystick.onpointercancel=resetJoy;


/* =========================
   BOOST
========================= */

const boostButton=document.getElementById("boost");

boostButton.onpointerdown=()=>{
    boosting=true;
};

boostButton.onpointerup=()=>{
    boosting=false;
};

boostButton.onpointercancel=()=>{
    boosting=false;
};


/* =========================
   ANGLE HELPER
========================= */

function turnTowards(current,target,amount){

    let d=target-current;

    while(d>Math.PI)d-=Math.PI*2;
    while(d<-Math.PI)d+=Math.PI*2;

    return current+d*amount;
}


/* =========================
   PLAYER UPDATE
========================= */

function updatePlayer(){

    keyboardControl();

    player.angle=
        turnTowards(
            player.angle,
            player.targetAngle,
            .16
        );

    let speed=player.speed;

    if(boosting && player.length>21){

        speed=8.3;

        player.length-=.035;

        /*
           BOOST DROP
        */

        if(Math.random()<.25){

            foods.push({
                x:player.x-
                   Math.cos(player.angle)*20,
                y:player.y-
                   Math.sin(player.angle)*20,
                r:5,
                color:player.color,
                value:2
            });

        }

    }

    player.x+=Math.cos(player.angle)*speed;
    player.y+=Math.sin(player.angle)*speed;

    /*
       WORLD BORDER
    */

    if(player.x<25)player.x=25;
    if(player.y<25)player.y=25;
    if(player.x>WORLD-25)player.x=WORLD-25;
    if(player.y>WORLD-25)player.y=WORLD-25;

    body.unshift({
        x:player.x,
        y:player.y
    });

    while(body.length<Math.floor(player.length)){
        body.push({
            x:player.x,
            y:player.y
        });
    }

    while(body.length>Math.floor(player.length)){
        body.pop();
    }

    eatFoodPlayer();

    checkPlayerAgainstBots();

}


/* =========================
   PLAYER FOOD
========================= */

function eatFoodPlayer(){

    for(let i=foods.length-1;i>=0;i--){

        const f=foods[i];

        if(
            Math.hypot(
                f.x-player.x,
                f.y-player.y
            )<25
        ){

            score+=f.value;
            player.length+=f.value*.55;

            foods.splice(i,1);

            foods.push(makeFood());

        }

    }

}


/* =========================
   BOT AI
========================= */

function updateBots(){

    for(const bot of bots){

        if(!bot.alive)continue;

        bot.think--;

        /*
           AI otsib lähedal olevat toitu
        */

        if(bot.think<=0){

            bot.think=20+Math.random()*50;

            let nearest=null;
            let nearestD=Infinity;

            for(const f of foods){

                const d=
                    Math.hypot(
                        f.x-bot.x,
                        f.y-bot.y
                    );

                if(d<nearestD && d<700){

                    nearest=f;
                    nearestD=d;

                }

            }

            /*
               Vahel jälitab mängijat
            */

            if(
                Math.random()<.22 &&
                Math.hypot(
                    player.x-bot.x,
                    player.y-bot.y
                )<900
            ){

                bot.targetAngle=
                    Math.atan2(
                        player.y-bot.y,
                        player.x-bot.x
                    );

            }else if(nearest){

                bot.targetAngle=
                    Math.atan2(
                        nearest.y-bot.y,
                        nearest.x-bot.x
                    );

            }else{

                bot.targetAngle+=
                    (Math.random()-.5)*1.5;

            }

        }

        /*
           Ära lase robotil seinast välja minna
        */

        const margin=300;

        if(bot.x<margin){
            bot.targetAngle=0;
        }

        if(bot.x>WORLD-margin){
            bot.targetAngle=Math.PI;
        }

        if(bot.y<margin){
            bot.targetAngle=Math.PI/2;
        }

        if(bot.y>WORLD-margin){
            bot.targetAngle=-Math.PI/2;
        }

        bot.angle=
            turnTowards(
                bot.angle,
                bot.targetAngle,
                .08
            );

        const speed=bot.speed;

        bot.x+=Math.cos(bot.angle)*speed;
        bot.y+=Math.sin(bot.angle)*speed;

        bot.x=Math.max(25,Math.min(WORLD-25,bot.x));
        bot.y=Math.max(25,Math.min(WORLD-25,bot.y));

        eatBotFood(bot);

    }

}


/* =========================
   BOT FOOD
========================= */

function eatBotFood(bot){

    for(let i=foods.length-1;i>=0;i--){

        const f=foods[i];

        if(
            Math.hypot(
                f.x-bot.x,
                f.y-bot.y
            )<23
        ){

            bot.length+=f.value*.45;

            foods.splice(i,1);

            foods.push(makeFood());

        }

    }

}


/* =========================
   COLLISION SYSTEM
========================= */

function checkPlayerAgainstBots(){

    /*
       1. BOT HEAD -> PLAYER BODY
       Kui roboti pea läheb sinu keha vastu,
       robot sureb.
    */

    for(const bot of bots){

        if(!bot.alive)continue;

        /*
           BOT HEAD vs PLAYER BODY
        */

        for(let i=8;i<body.length;i++){

            const p=body[i];

            const d=
                Math.hypot(
                    bot.x-p.x,
                    bot.y-p.y
                );

            if(d<18){

                killBot(bot);

                break;

            }

        }

        if(!bot.alive)continue;

        /*
           PLAYER HEAD vs BOT BODY
           See on oluline:
           kui sinu pea puudutab roboti keha,
           SINA sured kohe.
        */

        const botLength=
            Math.floor(bot.length);

        for(let i=5;i<botLength;i++){

            const bx=
                bot.x-
                Math.cos(bot.angle)*i*9;

            const by=
                bot.y-
                Math.sin(bot.angle)*i*9;

            const d=
                Math.hypot(
                    player.x-bx,
                    player.y-by
                );

            if(d<20){

                die(
                    "🐍 Sinu pea läks roboti vastu!"
                );

                return;

            }

        }

    }

    /*
       BOT HEAD vs BOT BODY
    */

    checkBotVsBot();

}


/* =========================
   BOT VS BOT
========================= */

function checkBotVsBot(){

    for(const a of bots){

        if(!a.alive)continue;

        for(const b of bots){

            if(a===b || !b.alive)continue;

            const length=
                Math.floor(b.length);

            for(let i=6;i<length;i++){

                const bx=
                    b.x-
                    Math.cos(b.angle)*i*9;

                const by=
                    b.y-
                    Math.sin(b.angle)*i*9;

                if(
                    Math.hypot(
                        a.x-bx,
                        a.y-by
                    )<17
                ){

                    killBot(b);
                    break;

                }

            }

            if(!a.alive)break;

        }

    }

}


/* =========================
   KILL BOT
========================= */

function killBot(bot){

    if(!bot.alive)return;

    bot.alive=false;

    kills++;

    score+=50;

    /*
       KILL = 10 COINS
    */

    coins+=10;

    saveShop();

    showKill();

    /*
       BOT BODY DROPS FOOD
    */

    const count=
        Math.min(
            45,
            Math.floor(bot.length)
        );

    for(let i=0;i<count;i++){

        foods.push({
            x:
                bot.x-
                Math.cos(bot.angle)*i*9,
            y:
                bot.y-
                Math.sin(bot.angle)*i*9,
            r:4+Math.random()*3,
            color:bot.color,
            value:2
        });

    }

    /*
       Respawn after a little delay
    */

    setTimeout(()=>{

        const index=bots.indexOf(bot);

        if(index!==-1){

            bots[index]=randomBot();

        }

    },1200);

}


/* =========================
   DEATH
========================= */

function die(reason){

    if(dead)return;

    dead=true;
    running=false;
    boosting=false;

    document.getElementById("deathReason")
    .textContent=reason;

    document.getElementById("finalScore")
    .textContent=Math.floor(score);

    document.getElementById("finalKills")
    .textContent=kills;

    document.getElementById("gameOver")
    .style.display="flex";

}


/* =========================
   CAMERA
========================= */

function updateCamera(){

    cameraX+=(player.x-cameraX)*.12;
    cameraY+=(player.y-cameraY)*.12;

}


/* =========================
   DRAW FOOD
========================= */

function drawFood(){

    for(const f of foods){

        if(
            Math.abs(f.x-cameraX)>W+100 ||
            Math.abs(f.y-cameraY)>H+100
        )continue;

        ctx.fillStyle=f.color;

        ctx.shadowColor=f.color;
        ctx.shadowBlur=9;

        ctx.beginPath();

        ctx.arc(
            f.x,
            f.y,
            f.r,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.shadowBlur=0;

}


/* =========================
   DRAW SNAKE BODY
========================= */

function drawSnakeBody(
    points,
    color
){

    for(
        let i=points.length-1;
        i>=0;
        i--
    ){

        const p=points[i];

        const progress=i/points.length;

        const radius=
            8+
            (1-progress)*9;

        ctx.globalAlpha=
            .75+
            (1-progress)*.25;

        ctx.fillStyle=color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            radius,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.globalAlpha=1;

}


/* =========================
   DRAW BOT
========================= */

function drawBot(bot){

    if(!bot.alive)return;

    const length=
        Math.floor(bot.length);

    const points=[];

    for(let i=0;i<length;i++){

        points.push({
            x:
                bot.x-
                Math.cos(bot.angle)*i*9,
            y:
                bot.y-
                Math.sin(bot.angle)*i*9
        });

    }

    drawSnakeBody(
        points,
        bot.color
    );

    drawHead(
        bot.x,
        bot.y,
        bot.angle,
        bot.color,
        false
    );

    drawName(
        bot.name,
        bot.x,
        bot.y-32
    );

}


/* =========================
   DRAW PLAYER
========================= */

function drawPlayer(){

    drawSnakeBody(
        body,
        player.color
    );

    drawHead(
        player.x,
        player.y,
        player.angle,
        player.color,
        true
    );

    drawName(
        player.name,
        player.x,
        player.y-35
    );

}


/* =========================
   HEAD
========================= */

function drawHead(
    x,
    y,
    angle,
    color,
    mine
){

    ctx.save();

    ctx.translate(x,y);
    ctx.rotate(angle);

    ctx.fillStyle=color;

    ctx.shadowColor=color;
    ctx.shadowBlur=18;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        21,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;

    /*
       SILMAD
    */

    ctx.fillStyle="white";

    ctx.beginPath();

    ctx.arc(
        9,
        -7,
        6,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        9,
        7,
        6,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
       PUPILLID
    */

    ctx.fillStyle="#111";

    ctx.beginPath();

    ctx.arc(
        12,
        -7,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        12,
        7,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
       NAERATUS
    */

    ctx.strokeStyle="#111";
    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.arc(
        13,
        0,
        6,
        -.7,
        .7
    );

    ctx.stroke();

    /*
       PLAYERI BOOST EFFECT
    */

    if(mine && boosting){

        ctx.strokeStyle="#a5e3ff";
        ctx.lineWidth=3;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            26,
            0,
            Math.PI*2
        );

        ctx.stroke();

    }

    ctx.restore();

}


/* =========================
   NAME
========================= */

function drawName(name,x,y){

    ctx.save();

    ctx.textAlign="center";

    ctx.font="bold 12px Arial";

    ctx.fillStyle="white";

    ctx.shadowColor="black";
    ctx.shadowBlur=5;

    ctx.fillText(
        name,
        x,
        y
    );

    ctx.restore();

}


/* =========================
   GRID
========================= */

function drawGrid(){

    const grid=250;

    const left=cameraX-W/2-500;
    const right=cameraX+W/2+500;

    const top=cameraY-H/2-500;
    const bottom=cameraY+H/2+500;

    ctx.strokeStyle="rgba(99,255,120,.05)";
    ctx.lineWidth=1;

    for(
        let x=Math.floor(left/grid)*grid;
        x<right;
        x+=grid
    ){

        ctx.beginPath();
        ctx.moveTo(x,top);
        ctx.lineTo(x,bottom);
        ctx.stroke();

    }

    for(
        let y=Math.floor(top/grid)*grid;
        y<bottom;
        y+=grid
    ){

        ctx.beginPath();
        ctx.moveTo(left,y);
        ctx.lineTo(right,y);
        ctx.stroke();

    }

}


/* =========================
   WORLD BORDER
========================= */

function drawBorder(){

    ctx.strokeStyle="#63ff78";
    ctx.lineWidth=15;

    ctx.shadowColor="#63ff78";
    ctx.shadowBlur=18;

    ctx.strokeRect(
        0,
        0,
        WORLD,
        WORLD
    );

    ctx.shadowBlur=0;

}


/* =========================
   LEADERBOARD
========================= */

function updateLeaderboard(){

    const list=[
        {
            name:player.name,
            length:player.length,
            kills:kills,
            color:player.color
        }
    ];

    for(const b of bots){

        if(b.alive){

            list.push({
                name:b.name,
                length:b.length,
                kills:0,
                color:b.color
            });

        }

    }

    list.sort(
        (a,b)=>b.length-a.length
    );

    for(let i=0;i<3;i++){

        const el=
            document.getElementById(
                "lb"+(i+1)
            );

        if(list[i]){

            el.innerHTML=
                `${i+1}. <span style="color:${list[i].color}">${escapeHtml(list[i].name)}</span> — ${Math.floor(list[i].length)}`;

        }else{

            el.textContent="";

        }

    }

}


/* =========================
   HUD
========================= */

function updateHUD(){

    document.getElementById("score")
    .textContent=Math.floor(score);

    document.getElementById("length")
    .textContent=Math.floor(player.length);

    document.getElementById("kills")
    .textContent=kills;

    updateLeaderboard();

}


/* =========================
   KILL TEXT
========================= */

let killTimer;

function showKill(){

    const el=
        document.getElementById("killText");

    el.classList.add("show");

    clearTimeout(killTimer);

    killTimer=setTimeout(()=>{

        el.classList.remove("show");

    },700);

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(text){

    return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");

}


/* =========================
   DRAW
========================= */

function draw(){

    ctx.fillStyle="#061007";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    if(!running)return;

    updateCamera();

    ctx.save();

    ctx.translate(
        W/2-cameraX,
        H/2-cameraY
    );

    drawGrid();
    drawBorder();
    drawFood();

    /*
       BOTS
       Need on top of food
    */

    for(const bot of bots){
        drawBot(bot);
    }

    /*
       PLAYER ALWAYS LAST
       so it is visible
    */

    drawPlayer();

    ctx.restore();

}


/* =========================
   GAME UPDATE
========================= */

function update(){

    if(!running || dead)return;

    updatePlayer();

    if(dead)return;

    updateBots();

    updateHUD();

}


/* =========================
   GAME LOOP
========================= */

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);

}

loop();
