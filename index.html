<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no">

<title>Snake Arena</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050b07;
  font-family:Arial,sans-serif;
  touch-action:none;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}

#menu{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle at 50% 35%,
      #204b27 0,
      #0a180d 40%,
      #030704 100%);
}

.panel{
  width:min(430px,94vw);
  padding:30px;
  border-radius:28px;

  background:
    linear-gradient(
      145deg,
      rgba(24,43,27,.97),
      rgba(5,12,7,.98)
    );

  border:1px solid rgba(120,255,135,.3);

  box-shadow:
    0 30px 100px rgba(0,0,0,.8),
    inset 0 1px rgba(255,255,255,.08);

  color:white;
  text-align:center;
}

.logo{
  font-size:70px;
  filter:
    drop-shadow(0 0 18px #53ff69);
}

h1{
  margin-top:4px;
  font-size:42px;
  letter-spacing:2px;

  background:
    linear-gradient(
      90deg,
      #54ff6a,
      #c5ffc9
    );

  -webkit-background-clip:text;
  color:transparent;
}

.sub{
  color:#78907d;
  margin:7px 0 22px;
}

input{
  width:100%;
  height:50px;
  margin:5px 0;

  border-radius:14px;
  border:1px solid #294a2e;

  background:#09120b;
  color:white;

  text-align:center;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#53ff69;
}

button{
  width:100%;
  height:50px;
  margin-top:9px;

  border-radius:14px;
  border:0;

  font-weight:bold;
  font-size:15px;

  cursor:pointer;

  transition:
    transform .12s,
    filter .12s;
}

button:active{
  transform:scale(.97);
}

.green{
  background:
    linear-gradient(
      135deg,
      #55ff6c,
      #26c940
    );

  color:#031006;

  box-shadow:
    0 8px 25px rgba(50,255,80,.18);
}

.dark{
  color:white;
  background:#111d13;
  border:1px solid #315b37;
}

#roomBox{
  display:none;
  margin-top:14px;
  padding:14px;

  background:#09130b;
  border-radius:15px;

  border:1px solid #294a2e;
}

#roomCode{
  font-size:34px;
  font-weight:bold;
  letter-spacing:7px;
  color:#55ff6c;
  margin:5px 0;
}

#players{
  color:#a5b9a8;
  font-size:13px;
  line-height:21px;
}

#error{
  min-height:20px;
  color:#ff6475;
  margin-top:8px;
  font-size:13px;
}

#hud{
  display:none;

  position:fixed;
  top:12px;
  left:12px;

  z-index:20;

  gap:8px;
}

.stat{
  min-width:75px;
  padding:8px 11px;

  border-radius:12px;

  background:
    rgba(2,8,3,.78);

  border:
    1px solid rgba(125,255,140,.2);

  color:white;

  backdrop-filter:blur(8px);
}

.stat small{
  display:block;
  color:#718274;
  font-size:9px;
  margin-bottom:2px;
}

.stat b{
  font-size:15px;
}

#leaderboard{
  display:none;

  position:fixed;
  z-index:20;

  top:12px;
  right:12px;

  width:190px;

  padding:11px;

  border-radius:14px;

  background:
    rgba(2,8,3,.8);

  border:
    1px solid rgba(125,255,140,.2);

  color:white;

  backdrop-filter:blur(8px);
}

.lbtitle{
  color:#55ff6c;
  font-weight:bold;
  margin-bottom:5px;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:5px;

  font-size:12px;
}

#minimap{
  display:none;

  position:fixed;

  right:12px;
  bottom:12px;

  width:170px;
  height:170px;

  z-index:20;

  padding:3px;

  border-radius:17px;

  background:#071009;

  border:
    2px solid rgba(85,255,108,.65);

  box-shadow:
    0 0 30px rgba(70,255,90,.15);
}

#mini{
  width:100%;
  height:100%;
  border-radius:13px;
}

#boost{
  display:none;

  position:fixed;
  z-index:30;

  right:25px;
  bottom:28px;

  width:85px;
  height:85px;

  border-radius:50%;

  color:white;

  background:
    radial-gradient(
      circle at 35% 30%,
      #65d8ff,
      #096ca4
    );

  border:
    3px solid rgba(220,250,255,.9);

  box-shadow:
    0 0 30px rgba(50,180,255,.45);

  font-size:30px;
}

#stickArea{
  display:none;

  position:fixed;
  z-index:30;

  left:20px;
  bottom:20px;

  width:135px;
  height:135px;

  border-radius:50%;

  background:
    rgba(100,255,120,.06);

  border:
    2px solid rgba(100,255,120,.25);
}

#stick{
  position:absolute;

  left:50%;
  top:50%;

  width:58px;
  height:58px;

  transform:
    translate(-50%,-50%);

  border-radius:50%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #b5ffbc,
      #35e94e
    );

  border:3px solid white;

  box-shadow:
    0 0 25px rgba(80,255,100,.3);
}

#dead{
  display:none;

  position:fixed;
  inset:0;

  z-index:200;

  justify-content:center;
  align-items:center;

  background:
    rgba(0,0,0,.82);
}

.deadBox{
  width:min(390px,90vw);

  padding:30px;

  border-radius:23px;

  background:
    linear-gradient(
      145deg,
      #152016,
      #060b07
    );

  border:1px solid #355f3b;

  color:white;
  text-align:center;

  box-shadow:
    0 30px 80px #000;
}

.deadBox h2{
  color:#ff566a;
  font-size:43px;
  margin-bottom:10px;
}

@media(max-width:800px){

  #stickArea,
  #boost{
    display:block;
  }

  #leaderboard{
    width:155px;
  }

  .stat{
    min-width:62px;
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="menu">

  <div class="panel">

    <div class="logo">🐍</div>

    <h1>SNAKE ARENA</h1>

    <div class="sub">
      Grow • Eat • Boost • Survive
    </div>

    <input
      id="name"
      maxlength="16"
      placeholder="Sinu nimi">

    <button
      class="green"
      id="single">
      🤖 SINGLEPLAYER
    </button>

    <button
      class="dark"
      id="create">
      🏠 LOO ROOM
    </button>

    <input
      id="room"
      maxlength="5"
      placeholder="ROOM CODE">

    <button
      class="dark"
      id="join">
      🚪 LIITU ROOMI
    </button>

    <div id="roomBox">

      <div>ROOM</div>

      <div id="roomCode">
        -----
      </div>

      <div id="players"></div>

      <button
        class="green"
        id="start">
        ▶ ALUSTA MÄNGU
      </button>

    </div>

    <div id="error"></div>

  </div>
</div>

<div id="hud">

  <div class="stat">
    <small>SCORE</small>
    <b id="score">0</b>
  </div>

  <div class="stat">
    <small>KILLS</small>
    <b id="kills">0</b>
  </div>

  <div class="stat">
    <small>LENGTH</small>
    <b id="length">70</b>
  </div>

</div>

<div id="leaderboard">

  <div class="lbtitle">
    🏆 TOP 3
  </div>

  <div id="lb"></div>

</div>

<div id="minimap">
  <canvas id="mini"></canvas>
</div>

<div id="stickArea">
  <div id="stick"></div>
</div>

<button id="boost">
  ⚡
</button>

<div id="dead">

  <div class="deadBox">

    <h2>GAME OVER</h2>

    <p id="deadReason">
      Sinu snake sai otsa!
    </p>

    <br>

    <p>
      Score:
      <b id="finalScore">0</b>
    </p>

    <p>
      Kills:
      <b id="finalKills">0</b>
    </p>

    <button
      class="green"
      onclick="location.reload()">
      🔄 UUESTI
    </button>

  </div>
</div>

<script>
const canvas =
  document.getElementById("game");

const ctx =
  canvas.getContext("2d");

const mini =
  document.getElementById("mini");

const mctx =
  mini.getContext("2d");

let W = innerWidth;
let H = innerHeight;

canvas.width = W;
canvas.height = H;

mini.width = 400;
mini.height = 400;

addEventListener("resize", () => {

  W = innerWidth;
  H = innerHeight;

  canvas.width = W;
  canvas.height = H;
});

const WORLD = 12000;

let running = false;
let single = false;
let dead = false;

const player = {

  id:null,

  name:
    localStorage.getItem("snakeName")
    || "Player",

  x:WORLD/2,
  y:WORLD/2,

  renderX:WORLD/2,
  renderY:WORLD/2,

  angle:0,
  targetAngle:0,

  length:70,
  score:0,
  kills:0,

  color:"#53ff69",

  body:[]
};

document.getElementById("name").value =
  player.name;

document.getElementById("name").oninput =
  e => {

    player.name =
      e.target.value
      .replace(/[<>]/g,"")
      .substring(0,16);

    localStorage.setItem(
      "snakeName",
      player.name
    );
  };

const COLORS = [
  "#53ff69",
  "#39a9ff",
  "#ff4f70",
  "#ffd447",
  "#b96cff",
  "#ff8b42",
  "#27e0c0",
  "#ff5bc8"
];

function randomColor(){

  return COLORS[
    Math.floor(
      Math.random()*COLORS.length
    )
  ];
}

/* FOOD */

const food = [];

function newFood(){

  return {

    x:
      100+
      Math.random()*
      (WORLD-200),

    y:
      100+
      Math.random()*
      (WORLD-200),

    r:
      5+
      Math.random()*4,

    value:
      1+
      Math.floor(
        Math.random()*4
      ),

    color:
      randomColor(),

    phase:
      Math.random()*
      Math.PI*2
  };
}

for(let i=0;i<900;i++){
  food.push(newFood());
}

/* BOTS */

const bots = [];

const BOT_NAMES = [
  "Shadow",
  "Viper",
  "Blaze",
  "Ghost",
  "Python",
  "Storm",
  "Ninja",
  "Cobra",
  "Turbo",
  "Venom",
  "Rocket",
  "Pixel"
];

function createBot(){

  const b = {

    id:
      Math.random()
      .toString(36)
      .substring(2),

    name:
      BOT_NAMES[
        Math.floor(
          Math.random()*
          BOT_NAMES.length
        )
      ],

    x:
      500+
      Math.random()*
      (WORLD-1000),

    y:
      500+
      Math.random()*
      (WORLD-1000),

    angle:
      Math.random()*
      Math.PI*2,

    target:0,

    length:
      55+
      Math.random()*130,

    score:
      Math.floor(
        Math.random()*200
      ),

    color:
      randomColor(),

    body:[],

    timer:0
  };

  b.target = b.angle;

  for(
    let i=0;
    i<b.length;
    i++
  ){

    b.body.push({

      x:
        b.x-
        Math.cos(b.angle)*
        i*7,

      y:
        b.y-
        Math.sin(b.angle)*
        i*7
    });
  }

  return b;
}

function createBots(){

  bots.length = 0;

  for(let i=0;i<16;i++){
    bots.push(createBot());
  }
}

/* RESET */

function resetPlayer(){

  player.x =
    1200+
    Math.random()*
    (WORLD-2400);

  player.y =
    1200+
    Math.random()*
    (WORLD-2400);

  player.renderX =
    player.x;

  player.renderY =
    player.y;

  player.angle =
    Math.random()*
    Math.PI*2;

  player.targetAngle =
    player.angle;

  player.length = 70;
  player.score = 0;
  player.kills = 0;

  player.body = [];

  for(
    let i=0;
    i<player.length;
    i++
  ){

    player.body.push({

      x:
        player.x-
        Math.cos(player.angle)*
        i*7,

      y:
        player.y-
        Math.sin(player.angle)*
        i*7
    });
  }
}

/* INPUT */

let mouseX = W/2;
let mouseY = H/2;

let boosting = false;

addEventListener(
  "mousemove",
  e => {

    mouseX = e.clientX;
    mouseY = e.clientY;
  }
);

addEventListener(
  "keydown",
  e => {

    if(e.code==="Space"){
      boosting=true;
    }
  }
);

addEventListener(
  "keyup",
  e => {

    if(e.code==="Space"){
      boosting=false;
    }
  }
);

/* MOBILE JOYSTICK */

const stickArea =
  document.getElementById(
    "stickArea"
  );

const stick =
  document.getElementById(
    "stick"
  );

let joystick = false;

function moveStick(x,y){

  const r =
    stickArea.getBoundingClientRect();

  const cx =
    r.left+r.width/2;

  const cy =
    r.top+r.height/2;

  let dx=x-cx;
  let dy=y-cy;

  const max=50;

  const d=Math.hypot(dx,dy);

  if(d>max){

    dx=dx/d*max;
    dy=dy/d*max;
  }

  stick.style.left =
    `calc(50% + ${dx}px)`;

  stick.style.top =
    `calc(50% + ${dy}px)`;

  if(d>7){

    player.targetAngle =
      Math.atan2(dy,dx);
  }
}

stickArea.addEventListener(
  "pointerdown",
  e => {

    joystick=true;

    stickArea.setPointerCapture(
      e.pointerId
    );

    moveStick(
      e.clientX,
      e.clientY
    );
  }
);

stickArea.addEventListener(
  "pointermove",
  e => {

    if(joystick){

      moveStick(
        e.clientX,
        e.clientY
      );
    }
  }
);

function stopStick(){

  joystick=false;

  stick.style.left="50%";
  stick.style.top="50%";
}

stickArea.addEventListener(
  "pointerup",
  stopStick
);

stickArea.addEventListener(
  "pointercancel",
  stopStick
);

const boostButton =
  document.getElementById(
    "boost"
  );

boostButton.addEventListener(
  "pointerdown",
  e => {

    e.preventDefault();
    boosting=true;
  }
);

boostButton.addEventListener(
  "pointerup",
  () => {
    boosting=false;
  }
);

boostButton.addEventListener(
  "pointercancel",
  () => {
    boosting=false;
  }
);

/* PLAYER UPDATE */

function updatePlayer(){

  let diff =
    player.targetAngle-
    player.angle;

  while(diff>Math.PI)
    diff-=Math.PI*2;

  while(diff<-Math.PI)
    diff+=Math.PI*2;

  player.angle += diff*.18;

  let speed = 7.2;

  if(
    boosting &&
    player.length>50
  ){

    speed=11.5;
    player.length-=.11;
  }

  player.x +=
    Math.cos(player.angle)*
    speed;

  player.y +=
    Math.sin(player.angle)*
    speed;

  if(
    player.x<40 ||
    player.x>WORLD-40 ||
    player.y<40 ||
    player.y>WORLD-40
  ){

    die("Läksid vastu seina!");
    return;
  }

  player.body.unshift({
    x:player.x,
    y:player.y
  });

  const wanted =
    Math.max(
      50,
      Math.floor(player.length)
    );

  while(
    player.body.length<wanted
  ){

    const last =
      player.body[
        player.body.length-1
      ];

    player.body.push({
      x:last.x,
      y:last.y
    });
  }

  while(
    player.body.length>wanted
  ){

    player.body.pop();
  }

  eatFood(player);
}

/* EAT */

function eatFood(snake){

  for(
    let i=food.length-1;
    i>=0;
    i--
  ){

    const f=food[i];

    if(
      Math.hypot(
        snake.x-f.x,
        snake.y-f.y
      )<34
    ){

      snake.score +=
        f.value;

      snake.length +=
        f.value*.75;

      food.splice(i,1);
      food.push(newFood());
    }
  }
}

/* BOT UPDATE */

function updateBots(){

  for(const b of bots){

    b.timer--;

    if(b.timer<=0){

      b.timer =
        20+
        Math.random()*80;

      let closest=null;
      let best=Infinity;

      for(
        let i=0;
        i<food.length;
        i+=7
      ){

        const f=food[i];

        const d =
          Math.hypot(
            b.x-f.x,
            b.y-f.y
          );

        if(d<best){

          best=d;
          closest=f;
        }
      }

      if(closest){

        b.target =
          Math.atan2(
            closest.y-b.y,
            closest.x-b.x
          );
      }
    }

    let diff =
      b.target-b.angle;

    while(diff>Math.PI)
      diff-=Math.PI*2;

    while(diff<-Math.PI)
      diff+=Math.PI*2;

    b.angle += diff*.055;

    b.x +=
      Math.cos(b.angle)*5.3;

    b.y +=
      Math.sin(b.angle)*5.3;

    if(
      b.x<100 ||
      b.x>WORLD-100
    ){

      b.target =
        Math.PI-b.angle;
    }

    if(
      b.y<100 ||
      b.y>WORLD-100
    ){

      b.target =
        -b.angle;
    }

    b.body.unshift({
      x:b.x,
      y:b.y
    });

    while(
      b.body.length<
      Math.floor(b.length)
    ){

      const last =
        b.body[
          b.body.length-1
        ];

      b.body.push({
        x:last.x,
        y:last.y
      });
    }

    while(
      b.body.length>
      Math.floor(b.length)
    ){

      b.body.pop();
    }

    eatFood(b);
  }
}

/* COLLISION */

function collisions(){

  for(
    let bi=bots.length-1;
    bi>=0;
    bi--
  ){

    const b=bots[bi];

    /* PLAYER HEAD -> BOT */

    for(
      let i=10;
      i<b.body.length;
      i+=2
    ){

      const p=b.body[i];

      if(
        Math.hypot(
          player.x-p.x,
          player.y-p.y
        )<30
      ){

        killBot(bi);
        break;
      }
    }
  }

  /* BOT HEAD -> PLAYER */

  for(
    let bi=bots.length-1;
    bi>=0;
    bi--
  ){

    const b=bots[bi];

    for(
      let i=10;
      i<player.body.length;
      i+=2
    ){

      const p=player.body[i];

      if(
        Math.hypot(
          b.x-p.x,
          b.y-p.y
        )<30
      ){

        bots.splice(bi,1);

        player.kills++;
        player.score+=100;
        player.length+=18;

        setTimeout(()=>{
          if(running){
            bots.push(createBot());
          }
        },700);

        break;
      }
    }
  }
}

function killBot(index){

  const b=bots[index];

  if(!b) return;

  for(
    let i=0;
    i<b.body.length;
    i+=4
  ){

    food.push({

      x:b.body[i].x,
      y:b.body[i].y,

      r:7,
      value:5,

      color:b.color,

      phase:
        Math.random()*
        Math.PI*2
    });
  }

  bots.splice(index,1);

  player.kills++;
  player.score+=100;
  player.length+=18;

  setTimeout(()=>{
    if(running){
      bots.push(createBot());
    }
  },700);
}

/* DRAW WORM */

function drawWorm(snake){

  if(
    !snake.body ||
    snake.body.length<2
  ){
    return;
  }

  ctx.save();

  /*
    SHADOW
  */

  ctx.beginPath();

  for(
    let i=snake.body.length-1;
    i>=0;
    i--
  ){

    const p=snake.body[i];

    if(i===snake.body.length-1)
      ctx.moveTo(p.x+5,p.y+7);
    else
      ctx.lineTo(p.x+5,p.y+7);
  }

  ctx.lineCap="round";
  ctx.lineJoin="round";

  ctx.strokeStyle=
    "rgba(0,0,0,.4)";

  ctx.lineWidth=35;

  ctx.stroke();

  /*
    BODY GRADIENT
  */

  const grad =
    ctx.createLinearGradient(
      snake.x-30,
      snake.y-30,
      snake.x+30,
      snake.y+30
    );

  grad.addColorStop(
    0,
    "#ffffff"
  );

  grad.addColorStop(
    .12,
    snake.color
  );

  grad.addColorStop(
    1,
    snake.color
  );

  ctx.beginPath();

  for(
    let i=snake.body.length-1;
    i>=0;
    i--
  ){

    const p=snake.body[i];

    if(i===snake.body.length-1)
      ctx.moveTo(p.x,p.y);
    else
      ctx.lineTo(p.x,p.y);
  }

  ctx.lineCap="round";
  ctx.lineJoin="round";

  ctx.strokeStyle=grad;
  ctx.lineWidth=29;

  ctx.stroke();

  /*
    BODY SHINE
  */

  ctx.beginPath();

  for(
    let i=snake.body.length-1;
    i>=0;
    i--
  ){

    const p=snake.body[i];

    if(i===snake.body.length-1)
      ctx.moveTo(p.x,p.y-3);
    else
      ctx.lineTo(p.x,p.y-3);
  }

  ctx.strokeStyle=
    "rgba(255,255,255,.18)";

  ctx.lineWidth=7;

  ctx.stroke();

  /*
    HEAD
  */

  ctx.translate(
    snake.x,
    snake.y
  );

  ctx.rotate(
    snake.angle
  );

  const headGrad =
    ctx.createRadialGradient(
      -7,
      -9,
      2,
      0,
      0,
      34
    );

  headGrad.addColorStop(
    0,
    "#ffffff"
  );

  headGrad.addColorStop(
    .18,
    snake.color
  );

  headGrad.addColorStop(
    1,
    snake.color
  );

  ctx.fillStyle=headGrad;

  ctx.shadowColor=
    snake.color;

  ctx.shadowBlur=15;

  ctx.beginPath();

  ctx.ellipse(
    0,
    0,
    34,
    30,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.shadowBlur=0;

  /*
    EYES
  */

  ctx.fillStyle="white";

  ctx.beginPath();

  ctx.arc(
    13,
    -11,
    9,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.arc(
    13,
    11,
    9,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle="#101510";

  ctx.beginPath();

  ctx.arc(
    17,
    -11,
    4.5,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.arc(
    17,
    11,
    4.5,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();

  /*
    NAME
  */

  ctx.textAlign="center";

  ctx.font=
    "bold 14px Arial";

  ctx.lineWidth=5;

  ctx.strokeStyle=
    "rgba(0,0,0,.8)";

  ctx.strokeText(
    snake.name || "Player",
    snake.x,
    snake.y-48
  );

  ctx.fillStyle="white";

  ctx.fillText(
    snake.name || "Player",
    snake.x,
    snake.y-48
  );
}

/* DRAW WORLD */

function draw(){

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  ctx.fillStyle="#071009";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

  if(!running) return;

  /*
    SMOOTH CAMERA
  */

  player.renderX +=
    (player.x-player.renderX)*.18;

  player.renderY +=
    (player.y-player.renderY)*.18;

  ctx.save();

  ctx.translate(
    W/2-player.renderX,
    H/2-player.renderY
  );

  /*
    WORLD
  */

  ctx.fillStyle="#102716";

  ctx.fillRect(
    0,
    0,
    WORLD,
    WORLD
  );

  /*
    GRID
  */

  const grid=120;

  const startX =
    Math.floor(
      (player.renderX-W/2)/grid
    )*grid;

  const endX =
    Math.ceil(
      (player.renderX+W/2)/grid
    )*grid;

  ctx.strokeStyle=
    "rgba(160,255,170,.035)";

  ctx.lineWidth=1;

  for(
    let x=startX;
    x<=endX;
    x+=grid
  ){

    ctx.beginPath();

    ctx.moveTo(
      x,
      player.renderY-H
    );

    ctx.lineTo(
      x,
      player.renderY+H
    );

    ctx.stroke();
  }

  const startY =
    Math.floor(
      (player.renderY-H/2)/grid
    )*grid;

  const endY =
    Math.ceil(
      (player.renderY+H/2)/grid
    )*grid;

  for(
    let y=startY;
    y<=endY;
    y+=grid
  ){

    ctx.beginPath();

    ctx.moveTo(
      player.renderX-W,
      y
    );

    ctx.lineTo(
      player.renderX+W,
      y
    );

    ctx.stroke();
  }

  /*
    FOOD
  */

  const time =
    performance.now()/400;

  for(const f of food){

    if(
      Math.abs(
        f.x-player.renderX
      )>W/2+100 ||

      Math.abs(
        f.y-player.renderY
      )>H/2+100
    ){
      continue;
    }

    const pulse =
      1+
      Math.sin(
        time+f.phase
      )*.18;

    ctx.shadowColor=f.color;
    ctx.shadowBlur=14;

    ctx.fillStyle=f.color;

    ctx.beginPath();

    ctx.arc(
      f.x,
      f.y,
      f.r*pulse,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;

    ctx.fillStyle=
      "rgba(255,255,255,.65)";

    ctx.beginPath();

    ctx.arc(
      f.x-f.r*.25,
      f.y-f.r*.3,
      f.r*.25,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  /*
    BOTS
  */

  for(const b of bots){
    drawWorm(b);
  }

  /*
    PLAYER
  */

  drawWorm(player);

  /*
    WORLD BORDER
  */

  ctx.strokeStyle=
    "rgba(80,255,100,.65)";

  ctx.lineWidth=20;

  ctx.strokeRect(
    0,
    0,
    WORLD,
    WORLD
  );

  ctx.restore();

  drawMinimap();
}

/* MINIMAP */

function drawMinimap(){

  mctx.fillStyle="#071009";

  mctx.fillRect(
    0,
    0,
    400,
    400
  );

  /*
    BORDER
  */

  mctx.strokeStyle=
    "rgba(90,255,110,.25)";

  mctx.strokeRect(
    2,
    2,
    396,
    396
  );

  for(const b of bots){

    mctx.fillStyle=b.color;

    mctx.beginPath();

    mctx.arc(
      b.x/WORLD*400,
      b.y/WORLD*400,
      4.5,
      0,
      Math.PI*2
    );

    mctx.fill();
  }

  mctx.fillStyle=player.color;

  mctx.shadowColor=
    player.color;

  mctx.shadowBlur=12;

  mctx.beginPath();

  mctx.arc(
    player.x/WORLD*400,
    player.y/WORLD*400,
    7,
    0,
    Math.PI*2
  );

  mctx.fill();

  mctx.shadowBlur=0;
}

/* TOP 3 */

function updateLeaderboard(){

  const list=[
    {
      name:player.name,
      score:player.score,
      color:player.color
    }
  ];

  for(const b of bots){

    list.push({
      name:b.name,
      score:b.score,
      color:b.color
    });
  }

  list.sort(
    (a,b)=>
      b.score-a.score
  );

  const box =
    document.getElementById("lb");

  box.innerHTML="";

  list
    .slice(0,3)
    .forEach((x,i)=>{

      const row =
        document.createElement(
          "div"
        );

      row.className="row";

      row.innerHTML =
        `<span style="color:${x.color}">
          ${i+1}. ${x.name}
        </span>
        <b>${Math.floor(x.score)}</b>`;

      box.appendChild(row);
    });
}

/* HUD */

function updateHUD(){

  document.getElementById(
    "score"
  ).textContent=
    Math.floor(player.score);

  document.getElementById(
    "kills"
  ).textContent=
    player.kills;

  document.getElementById(
    "length"
  ).textContent=
    Math.floor(player.length);

  updateLeaderboard();
}

/* DEATH */

function die(reason){

  if(dead) return;

  dead=true;
  running=false;

  document.getElementById(
    "deadReason"
  ).textContent=reason;

  document.getElementById(
    "finalScore"
  ).textContent=
    Math.floor(player.score);

  document.getElementById(
    "finalKills"
  ).textContent=
    player.kills;

  document.getElementById(
    "dead"
  ).style.display="flex";
}

/* START */

function startGame(){

  resetPlayer();

  dead=false;
  running=true;

  document.getElementById(
    "menu"
  ).style.display="none";

  document.getElementById(
    "hud"
  ).style.display="flex";

  document.getElementById(
    "leaderboard"
  ).style.display="block";

  document.getElementById(
    "minimap"
  ).style.display="block";
}

document.getElementById(
  "single"
).onclick=()=>{

  single=true;

  createBots();

  startGame();
};

/* MULTIPLAYER */

let ws=null;
let myId=null;

function connect(){

  const protocol =
    location.protocol==="https:"
      ? "wss:"
      : "ws:";

  ws =
    new WebSocket(
      protocol+
      "//"+
      location.host
    );

  ws.onmessage=e=>{

    let data;

    try{
      data=JSON.parse(e.data);
    }catch{
      return;
    }

    if(data.type==="connected"){

      myId=data.id;
      player.id=myId;
    }

    if(
      data.type==="roomCreated" ||
      data.type==="roomJoined"
    ){

      myId=data.id;
      player.id=myId;

      document.getElementById(
        "roomBox"
      ).style.display="block";

      document.getElementById(
        "roomCode"
      ).textContent=
        data.code;
    }

    if(data.type==="gameStart"){

      single=false;

      startGame();
    }

    if(data.type==="state"){

      for(
        const p of data.players
      ){

        if(p.id===myId){

          player.x=p.x;
          player.y=p.y;

          player.angle=p.angle;

          player.length=
            p.length;

          player.score=
            p.score;

          player.kills=
            p.kills;

          player.body=
            p.body;

          player.alive=
            p.alive;

          if(!p.alive){

            die(
              "Vastane tabas sind!"
            );
          }
        }
      }

      updateRoomPlayers(
        data.players
      );
    }

    if(data.type==="error"){

      document.getElementById(
        "error"
      ).textContent=
        data.message;
    }
  };

  ws.onerror=()=>{

    document.getElementById(
      "error"
    ).textContent=
      "Serveriga ei saanud ühendust.";
  };
}

function updateRoomPlayers(players){

  const box =
    document.getElementById(
      "players"
    );

  box.innerHTML="";

  players.forEach(p=>{

    const div =
      document.createElement(
        "div"
      );

    div.textContent=p.name;

    div.style.color=p.color;

    box.appendChild(div);
  });
}

document.getElementById(
  "create"
).onclick=()=>{

  if(
    !ws ||
    ws.readyState!==WebSocket.OPEN
  ){

    document.getElementById(
      "error"
    ).textContent=
      "Server pole valmis.";

    return;
  }

  ws.send(
    JSON.stringify({
      type:"createRoom",
      name:player.name,
      color:player.color
    })
  );
};

document.getElementById(
  "join"
).onclick=()=>{

  const code =
    document.getElementById(
      "room"
    ).value
    .trim()
    .toUpperCase();

  if(!code){

    document.getElementById(
      "error"
    ).textContent=
      "Sisesta roomi kood.";

    return;
  }

  ws.send(
    JSON.stringify({
      type:"joinRoom",
      code,
      name:player.name,
      color:player.color
    })
  );
};

document.getElementById(
  "start"
).onclick=()=>{

  if(
    ws &&
    ws.readyState===
    WebSocket.OPEN
  ){

    ws.send(
      JSON.stringify({
        type:"start"
      })
    );
  }
};

/* MULTIPLAYER INPUT */

setInterval(()=>{

  if(
    ws &&
    ws.readyState===
    WebSocket.OPEN &&
    running &&
    !single
  ){

    ws.send(
      JSON.stringify({
        type:"input",
        angle:player.targetAngle,
        boost:boosting
      })
    );
  }

},50);

/* GAME LOOP */

function loop(){

  if(running){

    if(single){

      if(innerWidth>800){

        const dx =
          mouseX-W/2;

        const dy =
          mouseY-H/2;

        if(
          Math.hypot(dx,dy)>10
        ){

          player.targetAngle =
            Math.atan2(
              dy,
              dx
            );
        }
      }

      updatePlayer();
      updateBots();
      collisions();

    }else{

      /*
        Smooth local movement
      */

      let diff =
        player.targetAngle-
        player.angle;

      while(diff>Math.PI)
        diff-=Math.PI*2;

      while(diff<-Math.PI)
        diff+=Math.PI*2;

      player.angle += diff*.18;

      const speed =
        boosting &&
        player.length>50
          ? 11.5
          : 7.2;

      player.x +=
        Math.cos(player.angle)*
        speed;

      player.y +=
        Math.sin(player.angle)*
        speed;

      player.body.unshift({
        x:player.x,
        y:player.y
      });

      while(
        player.body.length<
        Math.floor(player.length)
      ){

        const last =
          player.body[
            player.body.length-1
          ];

        player.body.push({
          x:last.x,
          y:last.y
        });
      }

      while(
        player.body.length>
        Math.floor(player.length)
      ){

        player.body.pop();
      }
    }

    updateHUD();
  }

  draw();

  requestAnimationFrame(loop);
}

resetPlayer();

connect();

requestAnimationFrame(loop);
</script>
