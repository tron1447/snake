<!DOCTYPE html>
<html lang="et">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,user-scalable=no"
>

<title>Snake Arena</title>

<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#020604;
font-family:Arial,sans-serif;
color:white;
touch-action:none;
}

canvas{
position:fixed;
inset:0;
width:100%;
height:100%;
}

.screen{
position:fixed;
inset:0;
z-index:50;

display:flex;
align-items:center;
justify-content:center;

background:
radial-gradient(
circle at center,
#123c1d,
#020604 70%
);
}

.card{
width:min(92vw,470px);

padding:30px;

border-radius:28px;

background:
rgba(4,15,8,.96);

border:
1px solid #3cff72;

box-shadow:
0 0 80px rgba(50,255,100,.12);

text-align:center;
}

.logo{
font-size:75px;
filter:
drop-shadow(0 0 25px #48ff7c);
}

h1{
margin:5px 0 20px;

font-size:40px;

color:#5cff8b;
}

input,select{

width:100%;

padding:15px;

margin:6px 0;

border-radius:13px;

border:
1px solid #2b6239;

background:#061008;

color:white;

font-size:18px;

text-align:center;
}

button{

width:100%;

padding:15px;

margin-top:8px;

border:0;

border-radius:14px;

font-size:18px;

font-weight:bold;

cursor:pointer;
}

.green{
background:#45ef78;
color:#031008;
}

.blue{
background:#438fff;
color:white;
}

.purple{
background:#a44dff;
color:white;
}

.red{
background:#40171b;
color:#ff8e95;
}

#status{
margin-top:10px;
color:#8ca596;
}

#skinPreview{

height:75px;

display:flex;

align-items:center;
justify-content:center;

gap:10px;

margin:10px;
}

.skin{

width:42px;
height:42px;

border-radius:50%;

border:3px solid transparent;

cursor:pointer;

transition:.2s;
}

.skin.selected{
border-color:white;
transform:scale(1.18);
box-shadow:
0 0 20px currentColor;
}

#lobby{
display:none;
}

.roomCode{

font-size:52px;

letter-spacing:8px;

color:#66ff98;

margin:15px;
}

.playerRow{

display:flex;

align-items:center;

padding:10px;

margin:5px 0;

border-radius:12px;

background:#0b1d10;
}

.playerDot{

width:15px;
height:15px;

border-radius:50%;

margin-right:10px;
}

.host{
margin-left:auto;
color:#ffd95b;
}

#hud{

position:fixed;

top:12px;
left:50%;

transform:translateX(-50%);

z-index:20;

display:flex;

gap:7px;

pointer-events:none;
}

.stat{

background:
rgba(3,15,7,.85);

border:
1px solid rgba(100,255,140,.3);

border-radius:12px;

padding:7px 13px;

text-align:center;
}

.stat small{
display:block;
font-size:9px;
color:#91a497;
}

.stat b{
font-size:18px;
}

#leaderboard{

position:fixed;

right:12px;
top:12px;

z-index:20;

width:200px;

padding:12px;

border-radius:16px;

background:
rgba(3,15,7,.86);

border:
1px solid rgba(100,255,140,.3);
}

#leaderboard h3{
margin:0 0 8px;
color:#66ff98;
}

.rank{
display:flex;
justify-content:space-between;
font-size:12px;
padding:4px;
}

#boost{

position:fixed;

right:25px;
bottom:28px;

z-index:30;

width:95px;
height:95px;

border-radius:50%;

background:
radial-gradient(
circle,
#54b4ff,
#0e4d94
);

border:
2px solid #9bd8ff;

color:white;

font-size:28px;

box-shadow:
0 0 35px rgba(50,150,255,.55);
}

#boost span{
display:block;
font-size:9px;
}

#joystick{

position:fixed;

left:25px;
bottom:25px;

z-index:30;

width:155px;
height:155px;

border-radius:50%;

background:
rgba(60,255,110,.08);

border:
2px solid rgba(100,255,140,.25);
}

#stick{

position:absolute;

width:65px;
height:65px;

left:45px;
top:45px;

border-radius:50%;

background:
rgba(80,255,130,.5);

border:
2px solid #8bffa8;
}

#powers{

position:fixed;

left:50%;
bottom:15px;

transform:translateX(-50%);

z-index:25;

display:flex;

gap:7px;
}

.power{

width:55px;
height:55px;

padding:0;

border-radius:50%;

font-size:22px;

background:#122319;

color:white;

border:1px solid #4d8159;
}

#dead{

display:none;

position:fixed;

inset:0;

z-index:100;

align-items:center;
justify-content:center;

background:
rgba(0,0,0,.65);

text-align:center;
}

.deadCard{

background:#09150c;

border:1px solid #48ff78;

border-radius:25px;

padding:30px;
}

@media(max-width:700px){

#leaderboard{
width:145px;
}

#powers{
bottom:10px;
}

}

@media(min-width:700px){

#joystick{
display:none;
}

}

</style>
</head>

<body>

<canvas id="game"></canvas>


<!-- MENU -->

<div id="menu" class="screen">

<div class="card">

<div class="logo">🐍</div>

<h1>SNAKE ARENA</h1>

<input
id="name"
placeholder="Sinu nimi"
maxlength="16"
>

<select id="mode">

<option value="classic">
🍎 Classic Arena
</option>

<option value="battle">
⚔️ Battle
</option>

<option value="power">
⚡ Power Arena
</option>

</select>

<h3>🎨 Vali skin</h3>

<div id="skinPreview"></div>

<button
class="green"
onclick="createRoom()"
>
🟢 LOO ROOM
</button>

<input
id="room"
placeholder="ROOM CODE"
maxlength="6"
>

<button
class="blue"
onclick="joinRoom()"
>
🔵 LIITU ROOMI
</button>

<div id="status">
Ühendan serveriga...
</div>

</div>

</div>


<!-- LOBBY -->

<div id="lobby" class="screen">

<div class="card">

<h1>🐍 ROOM</h1>

<p>Jaga sõpradega koodi:</p>

<div
id="roomCodeBig"
class="roomCode"
>
------
</div>

<button
class="purple"
onclick="copyRoom()"
>
📋 KOPI KOOD
</button>

<div id="players"></div>

<p id="waiting">
Ootame mängijaid...
</p>

<button
id="start"
class="green"
onclick="startGame()"
>
🚀 START GAME
</button>

<button
class="red"
onclick="location.reload()"
>
← LAHKU
</button>

</div>

</div>


<!-- HUD -->

<div id="hud">

<div class="stat">

<small>SCORE</small>

<b id="score">0</b>

</div>

<div class="stat">

<small>LENGTH</small>

<b id="length">40</b>

</div>

<div class="stat">

<small>RANK</small>

<b id="rank">-</b>

</div>

</div>


<!-- LEADERBOARD -->

<div id="leaderboard">

<h3>🏆 TOP 8</h3>

<div id="board"></div>

</div>


<!-- POWERS -->

<div id="powers">

<button
class="power"
onclick="usePower('shield')"
title="Shield"
>
🛡️
</button>

<button
class="power"
onclick="usePower('magnet')"
title="Magnet"
>
🧲
</button>

<button
class="power"
onclick="usePower('speed')"
title="Speed"
>
⚡
</button>

</div>


<!-- BOOST -->

<button id="boost">

⚡

<span>
BOOST
</span>

</button>


<!-- JOYSTICK -->

<div id="joystick">

<div id="stick"></div>

</div>


<!-- DEAD -->

<div id="dead">

<div class="deadCard">

<h1>💥</h1>

<h2>SAID PIHTA!</h2>

<p>Respawn...</p>

</div>

</div>


<script>

const SERVER =
"wss://snake-riu3.onrender.com";

const SKINS = [

"#4dff75",
"#42a5ff",
"#ff4fd8",
"#ffd43b",
"#ff7043",
"#b45cff",
"#00e5ff",
"#ff3d71",
"#ffffff",
"#8cff00",
"#ff9f1c",
"#00ffc8"

];

let selectedSkin =
Number(
localStorage.getItem(
"snakeSkin"
) || 0
);

let coins =
Number(
localStorage.getItem(
"snakeCoins"
) || 0
);

let ws;
let myId=null;
let roomCode=null;
let host=false;
let started=false;

let state={
world:8000,
players:{},
food:[]
};

let W=innerWidth;
let H=innerHeight;

let camera={
x:4000,
y:4000
};

let mouse={
x:innerWidth/2,
y:innerHeight/2
};

let boost=false;


/* SKINS */

function renderSkins(){

const box=
document.getElementById(
"skinPreview"
);

box.innerHTML="";

SKINS.forEach(
(color,i)=>{

const el=
document.createElement(
"div"
);

el.className=
"skin";

el.style.background=
color;

if(i===selectedSkin){
el.classList.add(
"selected"
);
}

el.onclick=()=>{

selectedSkin=i;

localStorage.setItem(
"snakeSkin",
i
);

renderSkins();

};

box.appendChild(el);

});

}

renderSkins();


/* CONNECT */

function connect(){

ws=
new WebSocket(
SERVER
);

ws.onopen=()=>{

document.getElementById(
"status"
).textContent=
"🟢 Online";

};

ws.onmessage=e=>{

let data;

try{
data=
JSON.parse(e.data);
}
catch{
return;
}

if(
data.type==="connected"
){

myId=data.id;

}

if(
data.type==="roomCreated" ||
data.type==="roomJoined"
){

roomCode=
data.room;

host=
data.host;

showLobby();

}

if(
data.type==="lobby"
){

roomCode=
data.room;

host=
data.hostId===myId;

updateLobby(data);

}

if(
data.type==="gameStarted"
){

started=true;

document.getElementById(
"lobby"
).style.display=
"none";

}

if(
data.type==="state"
){

state=
data.state;

started=
data.state.started;

updateUI();

}

if(
data.type==="error"
){

alert(data.message);

}

};

ws.onclose=()=>{

document.getElementById(
"status"
).textContent=
"🔴 Server offline";

};

}

connect();


/* SEND */

function send(data){

if(
ws &&
ws.readyState===
WebSocket.OPEN
){

ws.send(
JSON.stringify(data)
);

}

}


/* CREATE */

function createRoom(){

const name=
document
.getElementById("name")
.value.trim();

if(!name){

alert(
"Kirjuta nimi!"
);

return;
}

send({

type:"createRoom",

name,

mode:
document
.getElementById("mode")
.value,

skin:
selectedSkin

});

}


/* JOIN */

function joinRoom(){

const name=
document
.getElementById("name")
.value.trim();

const room=
document
.getElementById("room")
.value
.trim()
.toUpperCase();

if(!name){

alert(
"Kirjuta nimi!"
);

return;
}

send({

type:"joinRoom",

name,

room,

skin:
selectedSkin

});

}


/* LOBBY */

function showLobby(){

document.getElementById(
"menu"
).style.display=
"none";

document.getElementById(
"lobby"
).style.display=
"flex";

document.getElementById(
"roomCodeBig"
).textContent=
roomCode;

}

function updateLobby(data){

const box=
document.getElementById(
"players"
);

box.innerHTML="";

data.players.forEach(
p=>{

const row=
document.createElement(
"div"
);

row.className=
"playerRow";

const dot=
document.createElement(
"span"
);

dot.className=
"playerDot";

dot.style.background=
p.skin;

const name=
document.createElement(
"span"
);

name.textContent=
p.name;

row.appendChild(dot);
row.appendChild(name);

if(
p.id===data.hostId
){

const h=
document.createElement(
"span"
);

h.className="host";

h.textContent=
"👑 HOST";

row.appendChild(h);

}

box.appendChild(row);

});

host=
data.hostId===myId;

document.getElementById(
"start"
).style.display=
host
?"block"
:"none";

document.getElementById(
"waiting"
).textContent=
host
?
"👑 Sina oled host."
:
"⏳ Ootame hosti...";

}


/* COPY */

function copyRoom(){

navigator.clipboard
.writeText(roomCode)
.then(()=>{

alert(
"Room code kopeeritud!"
);

});

}


/* START */

function startGame(){

send({
type:"startGame"
});

}


/* AIM */

function aim(angle){

send({

type:"aim",

angle

});

}

setInterval(()=>{

if(!started)return;

const angle=
Math.atan2(
mouse.y-H/2,
mouse.x-W/2
);

aim(angle);

},40);


addEventListener(
"mousemove",
e=>{

mouse.x=e.clientX;
mouse.y=e.clientY;

});


/* BOOST */

function setBoost(value){

boost=value;

send({

type:"boost",

active:value

});

}

addEventListener(
"keydown",
e=>{

if(
e.code==="ShiftLeft" ||
e.code==="ShiftRight" ||
e.code==="Space"
){

e.preventDefault();

setBoost(true);

}

});

addEventListener(
"keyup",
e=>{

if(
e.code==="ShiftLeft" ||
e.code==="ShiftRight" ||
e.code==="Space"
){

e.preventDefault();

setBoost(false);

}

});


/* MOUSE BOOST */

addEventListener(
"mousedown",
e=>{

if(e.button===0){

setBoost(true);

}

});

addEventListener(
"mouseup",
e=>{

if(e.button===0){

setBoost(false);

}

});


/* MOBILE BOOST */

const boostButton=
document.getElementById(
"boost"
);

boostButton.addEventListener(
"touchstart",
e=>{

e.preventDefault();

setBoost(true);

},
{passive:false}
);

boostButton.addEventListener(
"touchend",
e=>{

e.preventDefault();

setBoost(false);

},
{passive:false}
);


/* JOYSTICK */

const joystick=
document.getElementById(
"joystick"
);

const stick=
document.getElementById(
"stick"
);

let joystickActive=false;

function moveJoystick(
x,
y
){

const r=
joystick.getBoundingClientRect();

const cx=
r.left+r.width/2;

const cy=
r.top+r.height/2;

let dx=x-cx;
let dy=y-cy;

const max=55;

const len=
Math.hypot(dx,dy);

if(len>max){

dx=
dx/len*max;

dy=
dy/len*max;

}

stick.style.left=
45+dx+"px";

stick.style.top=
45+dy+"px";

aim(
Math.atan2(dy,dx)
);

}

joystick.addEventListener(
"touchstart",
e=>{

joystickActive=true;

const t=e.touches[0];

moveJoystick(
t.clientX,
t.clientY
);

},
{passive:false}
);

joystick.addEventListener(
"touchmove",
e=>{

if(!joystickActive)return;

e.preventDefault();

const t=e.touches[0];

moveJoystick(
t.clientX,
t.clientY
);

},
{passive:false}
);

joystick.addEventListener(
"touchend",
()=>{

joystickActive=false;

stick.style.left="45px";
stick.style.top="45px";

},
{passive:false}
);


/* POWER */

function usePower(power){

send({

type:"powerup",

power

});

}


/* UI */

function updateUI(){

const me=
state.players[myId];

if(!me)return;

document.getElementById(
"score"
).textContent=
me.score;

document.getElementById(
"length"
).textContent=
Math.floor(me.length);

document.getElementById(
"dead"
).style.display=
me.alive
?"none"
:"flex";

const players=
Object.values(
state.players
);

players.sort(
(a,b)=>
b.score-a.score
);

const myRank=
players.findIndex(
p=>p.id===myId
)+1;

document.getElementById(
"rank"
).textContent=
myRank;

const board=
document.getElementById(
"board"
);

board.innerHTML="";

players
.slice(0,8)
.forEach(
(p,i)=>{

const row=
document.createElement(
"div"
);

row.className="rank";

row.innerHTML=
`
<span>
${i+1}. ${escapeHTML(p.name)}
</span>
<b>
${p.score}
</b>
`;

board.appendChild(row);

});

}


/* CAMERA */

function updateCamera(){

const me=
state.players[myId];

if(!me)return;

camera.x +=
(me.x-camera.x)*.12;

camera.y +=
(me.y-camera.y)*.12;

}


/* DRAW */

const canvas=
document.getElementById(
"game"
);

const ctx=
canvas.getContext("2d");

function resize(){

W=innerWidth;
H=innerHeight;

canvas.width=
W*devicePixelRatio;

canvas.height=
H*devicePixelRatio;

ctx.setTransform(
devicePixelRatio,
0,
0,
devicePixelRatio,
0,
0
);

}

addEventListener(
"resize",
resize
);

resize();


function draw(){

requestAnimationFrame(
draw
);

ctx.clearRect(
0,0,W,H
);

if(!started){

ctx.fillStyle=
"#020604";

ctx.fillRect(
0,0,W,H
);

return;

}

updateCamera();

const me=
state.players[myId];

const zoom=
1.15;

ctx.save();

ctx.translate(
W/2,
H/2
);

ctx.scale(
zoom,
zoom
);

ctx.translate(
-camera.x,
-camera.y
);


/* WORLD */

ctx.fillStyle=
"#06170a";

ctx.fillRect(
0,
0,
state.world,
state.world
);


/* GRID */

ctx.strokeStyle=
"rgba(100,255,130,.035)";

ctx.lineWidth=2;

const grid=120;

const left=
camera.x-W/2/zoom;

const right=
camera.x+W/2/zoom;

const top=
camera.y-H/2/zoom;

const bottom=
camera.y+H/2/zoom;

for(
let x=Math.floor(left/grid)*grid;
x<right;
x+=grid
){

ctx.beginPath();

ctx.moveTo(
x,
top
);

ctx.lineTo(
x,
bottom
);

ctx.stroke();

}

for(
let y=Math.floor(top/grid)*grid;
y<bottom;
y+=grid
){

ctx.beginPath();

ctx.moveTo(
left,
y
);

ctx.lineTo(
right,
y
);

ctx.stroke();

}


/* BORDER */

ctx.strokeStyle=
"#45ff72";

ctx.lineWidth=22;

ctx.strokeRect(
0,
0,
state.world,
state.world
);


/* FOOD */

for(
const f of state.food
){

if(
f.x<left-30 ||
f.x>right+30 ||
f.y<top-30 ||
f.y>bottom+30
)continue;

let color;

if(f.type==="gold")
color="#fff34f";
else if(f.type==="rare")
color="#c45cff";
else if(f.type==="death")
color="#ff743d";
else if(f.type==="boost")
color="#52b6ff";
else
color="#ff4f75";

ctx.fillStyle=color;

ctx.shadowColor=color;

ctx.shadowBlur=
f.type==="gold"
?25
:12;

ctx.beginPath();

ctx.arc(
f.x,
f.y,
f.size,
0,
Math.PI*2
);

ctx.fill();

}

ctx.shadowBlur=0;


/* SNAKES */

const players=
Object.values(
state.players
);

for(
const p of players
){

if(
!p.snake ||
!p.snake.length
)continue;

const color=p.skin;

for(
let i=p.snake.length-1;
i>=0;
i--
){

const part=p.snake[i];

const progress=
i/p.snake.length;

const radius=
Math.max(
5.5,
13-progress*5
);

ctx.fillStyle=color;

ctx.shadowColor=color;

ctx.shadowBlur=
p.id===myId
?18
:8;

ctx.beginPath();

ctx.arc(
part.x,
part.y,
radius,
0,
Math.PI*2
);

ctx.fill();

}

ctx.shadowBlur=0;


/* SHIELD */

if(p.shield>0){

ctx.strokeStyle=
"rgba(80,180,255,.8)";

ctx.lineWidth=4;

ctx.beginPath();

ctx.arc(
p.x,
p.y,
24,
0,
Math.PI*2
);

ctx.stroke();

}


/* HEAD */

if(p.alive){

ctx.fillStyle=color;

ctx.beginPath();

ctx.arc(
p.x,
p.y,
16,
0,
Math.PI*2
);

ctx.fill();


const ex=
Math.cos(p.angle);

const ey=
Math.sin(p.angle);

const sx=
-Math.sin(p.angle);

const sy=
Math.cos(p.angle);

ctx.fillStyle="#061008";

ctx.beginPath();

ctx.arc(
p.x+ex*8+sx*5,
p.y+ey*8+sy*5,
3.5,
0,
Math.PI*2
);

ctx.fill();

ctx.beginPath();

ctx.arc(
p.x+ex*8-sx*5,
p.y+ey*8-sy*5,
3.5,
0,
Math.PI*2
);

ctx.fill();

}


/* NAME */

ctx.font=
"bold 14px Arial";

ctx.textAlign="center";

ctx.fillStyle=
"rgba(255,255,255,.8)";

ctx.fillText(
p.name,
p.x,
p.y-28
);

}


/* MINIMAP */

ctx.restore();

drawMinimap();

}

function drawMinimap(){

if(!started)return;

const size=130;

const x=
W-size-15;

const y=
H-size-15;

ctx.save();

ctx.fillStyle=
"rgba(0,0,0,.6)";

ctx.fillRect(
x,
y,
size,
size
);

ctx.strokeStyle=
"rgba(90,255,130,.5)";

ctx.strokeRect(
x,
y,
size,
size
);

state.players[myId];

if(me){

ctx.fillStyle=
me.skin;

ctx.arc(
x+
me.x/state.world*size,

me.y/state.world*size,

);

}
