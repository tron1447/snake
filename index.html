<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Snake Arena</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#050805;font-family:Arial,sans-serif}
body{touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%}

button,input{font:inherit}

#menu{
 position:fixed;inset:0;z-index:50;
 display:flex;align-items:center;justify-content:center;
 overflow:auto;padding:20px;
 background:radial-gradient(circle at 50% 20%,#245f2d,#0a1b0d 40%,#020402 90%);
}

.panel{
 width:min(95vw,470px);
 max-height:calc(100vh - 40px);
 overflow:auto;
 padding:25px;
 background:rgba(4,12,5,.98);
 border:1px solid rgba(99,255,120,.35);
 border-radius:25px;
 color:white;
 text-align:center;
 box-shadow:0 0 70px rgba(99,255,120,.15);
}

.logo{font-size:60px}
h1{font-size:38px;color:#63ff78}
.subtitle{color:#8b9b8e;margin:5px 0 18px}

input{
 width:100%;height:48px;margin:5px 0;
 background:#071007;color:white;
 border:1px solid #315c37;border-radius:12px;
 padding:0 15px;text-align:center;outline:none;
}

button{cursor:pointer}

.mainBtn{
 width:100%;height:48px;margin-top:7px;
 border:0;border-radius:12px;font-weight:bold;
}

.green{background:#63ff78;color:#031006}
.dark{background:#102014;color:white;border:1px solid #315b36}

.section{
 margin-top:14px;
 padding:12px;
 background:#091309;
 border-radius:14px;
 border:1px solid #18331d;
}

.modeButtons,.skinGrid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:7px;
 margin-top:8px;
}

.mode,.skin{
 height:55px;
 border-radius:12px;
 border:2px solid transparent;
 background:#101c12;
 color:white;
 font-size:23px;
}

.mode span,.skin span{
 display:block;
 font-size:9px;
 margin-top:2px;
}

.mode.selected,.skin.selected{
 border-color:#63ff78;
 box-shadow:0 0 15px rgba(99,255,120,.3);
}

#roomBox{display:none;margin-top:15px}

#roomCode{
 font-size:32px;
 color:#63ff78;
 font-weight:bold;
 letter-spacing:7px;
 margin:5px;
}

#players{
 max-height:130px;
 overflow:auto;
 text-align:left;
}

.playerRow{
 padding:7px 9px;
 margin:4px 0;
 border-radius:8px;
 background:#0b170d;
}

#error{color:#ff6475;min-height:20px;margin-top:8px}
#connection{font-size:11px;color:#809082;margin-top:8px}

#hud{
 position:fixed;z-index:10;left:10px;top:10px;
 display:none;gap:6px;
}

.stat{
 padding:7px 11px;
 background:rgba(0,0,0,.65);
 border:1px solid rgba(99,255,120,.25);
 border-radius:10px;color:white;
}

.stat small{display:block;color:#78907c;font-size:9px}
.stat b{font-size:16px}

#minimap{
 position:fixed;right:10px;top:10px;z-index:12;
 width:160px;height:160px;
 display:none;border-radius:15px;
 border:2px solid rgba(99,255,120,.7);
 background:#061007;
}

#abilityBar{
 position:fixed;z-index:15;
 left:50%;bottom:15px;
 transform:translateX(-50%);
 display:none;
 gap:7px;
}

.ability{
 min-width:70px;height:45px;
 background:rgba(0,0,0,.75);
 color:white;border:1px solid #315b36;
 border-radius:10px;
 font-size:11px;
}

.ability.ready{
 border-color:#63ff78;
 box-shadow:0 0 12px rgba(99,255,120,.4);
}

#boost{
 position:fixed;right:25px;bottom:30px;
 z-index:20;width:88px;height:88px;
 display:none;border-radius:50%;
 background:#087bb0;color:white;
 border:3px solid #a5e3ff;
 font-size:27px;
}

#joystick{
 position:fixed;left:24px;bottom:24px;
 z-index:20;width:145px;height:145px;
 display:none;border-radius:50%;
 background:rgba(99,255,120,.08);
 border:2px solid rgba(99,255,120,.35);
}

#stick{
 position:absolute;left:50%;top:50%;
 width:62px;height:62px;
 transform:translate(-50%,-50%);
 border-radius:50%;
 background:#63ff78;border:3px solid white;
}

#killText{
 position:fixed;z-index:30;left:50%;top:25%;
 transform:translateX(-50%) scale(.7);
 opacity:0;pointer-events:none;
 color:#63ff78;font-size:38px;font-weight:900;
 text-shadow:0 0 20px #63ff78;
 transition:.2s;
}

#killText.show{
 opacity:1;
 transform:translateX(-50%) scale(1);
}

#levelUp{
 position:fixed;z-index:31;left:50%;top:38%;
 transform:translate(-50%,-50%) scale(.6);
 opacity:0;pointer-events:none;
 color:#ffd84d;font-size:34px;font-weight:900;
 text-shadow:0 0 20px #ffd84d;
 transition:.25s;
}

#levelUp.show{
 opacity:1;
 transform:translate(-50%,-50%) scale(1);
}

#gameOver{
 position:fixed;inset:0;z-index:60;
 display:none;align-items:center;justify-content:center;
 background:rgba(0,0,0,.8);
}

.overPanel{
 width:min(90vw,400px);
 padding:30px;background:#081008;
 border:1px solid #315b36;border-radius:25px;
 text-align:center;color:white;
}

.overPanel h2{font-size:38px;color:#ff596c}

@media(max-width:800px){
 #joystick,#boost{display:block}
 #minimap{width:125px;height:125px}
 #abilityBar{bottom:175px}
 #hud{transform:scale(.9);transform-origin:top left}
}

@media(max-height:650px){
 .panel{padding:15px}
 .logo{font-size:40px}
 h1{font-size:30px}
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="menu">
<div class="panel">

<div class="logo">🐍</div>
<h1>SNAKE ARENA</h1>
<div class="subtitle">Eat • Grow • Fight • Survive</div>

<input id="name" maxlength="16" placeholder="Sinu nimi">

<div class="section">
<b>🎮 MÄNGUREŽIIM</b>

<div class="modeButtons">

<button class="mode selected" data-mode="online">
🌐
<span>ONLINE</span>
</button>

<button class="mode" data-mode="bots">
🤖
<span>BOT BATTLE</span>
</button>

</div>
</div>

<div class="section">
<b>🎨 SKIN</b>

<div class="skinGrid">

<button class="skin selected" data-color="#63ff78" data-skin="dragon">🐉<span>DRAGON</span></button>
<button class="skin" data-color="#4da6ff" data-skin="ice">❄️<span>ICE</span></button>
<button class="skin" data-color="#ff5570" data-skin="lava">🌋<span>LAVA</span></button>
<button class="skin" data-color="#ffd84d" data-skin="lightning">⚡<span>LIGHT</span></button>

<button class="skin" data-color="#b86cff" data-skin="alien">👾<span>ALIEN</span></button>
<button class="skin" data-color="#ff8a3d" data-skin="fire">🔥<span>FIRE</span></button>
<button class="skin" data-color="#ffffff" data-skin="ghost">👻<span>GHOST</span></button>
<button class="skin" data-color="#00e5d4" data-skin="robot">🤖<span>ROBOT</span></button>

</div>
</div>

<button id="createBtn" class="mainBtn green">🏠 CREATE ROOM</button>

<input id="roomInput" maxlength="6" placeholder="ROOM CODE">

<button id="joinBtn" class="mainBtn dark">🚪 JOIN ROOM</button>

<div id="roomBox">

<div style="font-size:11px;color:#819482">ROOM CODE</div>
<div id="roomCode">------</div>

<div id="players"></div>

<button id="startBtn" class="mainBtn green">
▶ START GAME
</button>

</div>

<div id="error"></div>
<div id="connection">🟡 Ühendamine...</div>

</div>
</div>

<div id="hud">

<div class="stat">
<small>SCORE</small>
<b id="score">0</b>
</div>

<div class="stat">
<small>LENGTH</small>
<b id="length">20</b>
</div>

<div class="stat">
<small>LEVEL</small>
<b id="level">1</b>
</div>

<div class="stat">
<small>PLAYERS</small>
<b id="playerCount">1</b>
</div>

</div>

<canvas id="minimap" width="160" height="160"></canvas>

<div id="abilityBar">
<button class="ability" id="magnetBtn">🧲 MAGNET</button>
<button class="ability" id="shieldBtn">🛡️ SHIELD</button>
<button class="ability" id="ghostBtn">👻 GHOST</button>
</div>

<div id="killText">💥 ELIMINATED!</div>
<div id="levelUp">⭐ LEVEL UP!</div>

<div id="joystick">
<div id="stick"></div>
</div>

<button id="boost">⚡</button>

<div id="gameOver">
<div class="overPanel">

<h2>GAME OVER</h2>

<p id="deathReason">Sind tapeti!</p>

<p style="margin-top:10px">
Skoor: <b id="finalScore">0</b>
</p>

<p>
Level: <b id="finalLevel">1</b>
</p>

<button class="mainBtn green" style="margin-top:20px" onclick="location.reload()">
🔄 TAGASI MENÜÜS
</button>

</div>
</div>

<script>
/* ==============================
   BASIC
============================== */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const minimap=document.getElementById("minimap");
const mapCtx=minimap.getContext("2d");

let W=innerWidth,H=innerHeight;

function resize(){
 W=innerWidth;
 H=innerHeight;
 canvas.width=W;
 canvas.height=H;
}
addEventListener("resize",resize);
resize();

const WORLD=20000;

/* ==============================
   FOOD
============================== */

const foods=[];
const FOOD_COUNT=1100;

const foodColors=[
 "#63ff78","#ffd84d","#ff6075",
 "#55c9ff","#c76cff","#ff963d"
];

function makeFood(x,y,value){
 return {
  x:x===undefined?Math.random()*WORLD:x,
  y:y===undefined?Math.random()*WORLD:y,
  radius:3+Math.random()*4,
  color:foodColors[Math.floor(Math.random()*foodColors.length)],
  value:value||1+Math.floor(Math.random()*5)
 };
}

for(let i=0;i<FOOD_COUNT;i++)foods.push(makeFood());

/* ==============================
   PLAYER
============================== */

const me={
 id:null,
 x:10000,
 y:10000,
 angle:0,
 targetAngle:0,
 length:20,
 color:"#63ff78",
 skin:"dragon",
 name:"Player",
 level:1,
 xp:0
};

let body=[];
let others={};
let bots={};

let score=0;
let level=1;
let xp=0;

let running=false;
let dead=false;
let boosting=false;
let selectedMode="online";

let cameraX=10000;
let cameraY=10000;

/* ==============================
   SKINS
============================== */

document.querySelectorAll(".skin").forEach(btn=>{
 btn.onclick=()=>{
  document.querySelectorAll(".skin").forEach(x=>x.classList.remove("selected"));
  btn.classList.add("selected");

  me.color=btn.dataset.color;
  me.skin=btn.dataset.skin;
 };
});

document.querySelectorAll(".mode").forEach(btn=>{
 btn.onclick=()=>{
  document.querySelectorAll(".mode").forEach(x=>x.classList.remove("selected"));
  btn.classList.add("selected");
  selectedMode=btn.dataset.mode;

  document.getElementById("createBtn").style.display=
   selectedMode==="online"?"block":"none";

  document.getElementById("roomInput").style.display=
   selectedMode==="online"?"block":"none";

  document.getElementById("joinBtn").style.display=
   selectedMode==="online"?"block":"none";

  document.getElementById("roomBox").style.display="none";
 };
});

/* ==============================
   WEBSOCKET
============================== */

let socket=null;
let connected=false;

function connect(){

 const protocol=location.protocol==="https:"?"wss:":"ws:";

 socket=new WebSocket(protocol+"//"+location.host);

 setConnection("🟡 Ühendamine...");

 socket.onopen=()=>{
  connected=true;
  setConnection("🟢 Server ühendatud");
 };

 socket.onclose=()=>{
  connected=false;
  setConnection("🔴 Ühendus katkes");
 };

 socket.onerror=()=>{
  setConnection("🔴 Serveri viga");
 };

 socket.onmessage=e=>{
  try{
   serverMessage(JSON.parse(e.data));
  }catch{}
 };
}

function send(data){
 if(!socket||socket.readyState!==WebSocket.OPEN)return false;
 socket.send(JSON.stringify(data));
 return true;
}

/* ==============================
   SERVER
============================== */

function serverMessage(data){

 if(data.type==="roomCreated"){
  me.id=data.id||me.id;
  showRoom(data.code);
 }

 else if(data.type==="roomJoined"){
  me.id=data.id||me.id;
  showRoom(data.code);
 }

 else if(data.type==="lobby"){
  updateLobby(data.players||[]);
 }

 else if(data.type==="gameStart"){
  me.id=data.id||me.id;
  startGame();
 }

 else if(data.type==="players"){
  others=data.players||{};
  updatePlayerCount();
 }

 else if(data.type==="gameOver"){
  die(data.reason||"Sind tapeti!");
 }

 else if(data.type==="playerKilled"){
  if(data.id!==me.id)showKill();
 }

 else if(data.type==="playerDrop"){
  if(Array.isArray(data.food)){
   data.food.forEach(f=>{
    foods.push(makeFood(f.x,f.y,f.value||3));
   });
  }
 }

 else if(data.type==="error"){
  showError(data.message||"Viga");
 }
}

/* ==============================
   UI
============================== */

function playerName(){
 return(
  document.getElementById("name").value.trim()||"Player"
 ).substring(0,16);
}

function showRoom(code){
 document.getElementById("roomBox").style.display="block";
 document.getElementById("roomCode").textContent=code;
}

function updateLobby(players){

 const box=document.getElementById("players");
 box.innerHTML="";

 players.forEach(p=>{
  const row=document.createElement("div");
  row.className="playerRow";

  row.textContent=(p.host?"👑 ":"🐍 ")+(p.name||"Player");

  if(p.color)row.style.color=p.color;

  box.appendChild(row);
 });

 if(players.length){
  document.getElementById("startBtn").style.display="block";
 }
}

function updatePlayerCount(){

 document.getElementById("playerCount").textContent=
  Math.max(
   1,
   Object.keys(others).length+
   Object.keys(bots).length
  );
}

function showError(t){
 document.getElementById("error").textContent=t||"";
}

function setConnection(t){
 document.getElementById("connection").textContent=t;
}

/* ==============================
   ROOM
============================== */

document.getElementById("createBtn").onclick=()=>{

 showError("");

 if(!connected){
  showError("Serveriga ühendamine...");
  return;
 }

 send({
  type:"createRoom",
  name:playerName(),
  color:me.color,
  skin:me.skin
 });
};

document.getElementById("joinBtn").onclick=()=>{

 showError("");

 const code=document.getElementById("roomInput")
  .value.trim().toUpperCase();

 if(code.length!==6){
  showError("Room code peab olema 6 märki.");
  return;
 }

 send({
  type:"joinRoom",
  code,
  name:playerName(),
  color:me.color,
  skin:me.skin
 });
};

document.getElementById("startBtn").onclick=()=>{
 send({type:"startGame"});
};

/* ==============================
   BOT MODE
============================== */

function startBotBattle(){

 bots={};

 const botNames=[
  "Speedy","Cobra","Pixel","Ninja",
  "Venom","Rocket","Shadow","Tiger",
  "Ghost","Hunter","Crusher","Blue",
  "RedSnake","Zippy","Dragon"
 ];

 const colors=[
  "#ff5570","#4da6ff","#ffd84d",
  "#b86cff","#ff8a3d","#00e5d4"
 ];

 for(let i=0;i<15;i++){

  const angle=Math.random()*Math.PI*2;

  bots["bot"+i]={
   id:"bot"+i,
   name:botNames[i%botNames.length],
   x:1500+Math.random()*17000,
   y:1500+Math.random()*17000,
   angle:angle,
   targetAngle:angle,
   length:20+Math.random()*70,
   color:colors[i%colors.length],
   skin:["lava","ice","alien","robot","fire"][i%5],
   alive:true,
   think:0
  };
 }
}

/* ==============================
   START GAME
============================== */

function startGame(){

 running=true;
 dead=false;
 score=0;
 level=1;
 xp=0;

 document.getElementById("menu").style.display="none";
 document.getElementById("hud").style.display="flex";
 document.getElementById("minimap").style.display="block";
 document.getElementById("abilityBar").style.display="flex";

 me.x=3000+Math.random()*14000;
 me.y=3000+Math.random()*14000;

 me.angle=Math.random()*Math.PI*2;
 me.targetAngle=me.angle;
 me.length=20;

 body=[];

 for(let i=0;i<20;i++){
  body.push({
   x:me.x-Math.cos(me.angle)*i*8,
   y:me.y-Math.sin(me.angle)*i*8
  });
 }

 if(selectedMode==="bots"){
  startBotBattle();
 }
}

/* ==============================
   LEVEL
============================== */

function addXP(amount){

 xp+=amount;

 const needed=100+(level-1)*70;

 if(xp>=needed){

  xp-=needed;
  level++;

  me.length+=5;

  showLevelUp();
 }
}

function showLevelUp(){

 const el=document.getElementById("levelUp");

 el.classList.add("show");

 setTimeout(()=>{
  el.classList.remove("show");
 },900);
}

/* ==============================
   KEYBOARD
============================== */

const keys={};

addEventListener("keydown",e=>{

 keys[e.key.toLowerCase()]=true;

 if(e.key==="Shift")boosting=true;

 if(e.key==="1")useAbility("magnet");
 if(e.key==="2")useAbility("shield");
 if(e.key==="3")useAbility("ghost");
});

addEventListener("keyup",e=>{

 keys[e.key.toLowerCase()]=false;

 if(e.key==="Shift")boosting=false;
});

function keyboardDirection(){

 let dx=0,dy=0;

 if(keys.w||keys.arrowup)dy=-1;
 if(keys.s||keys.arrowdown)dy=1;
 if(keys.a||keys.arrowleft)dx=-1;
 if(keys.d||keys.arrowright)dx=1;

 if(dx||dy){
  me.targetAngle=Math.atan2(dy,dx);
 }
}

/* ==============================
   MOUSE
============================== */

addEventListener("mousemove",e=>{

 if(!running||innerWidth<=800)return;

 const dx=e.clientX-W/2;
 const dy=e.clientY-H/2;

 if(Math.hypot(dx,dy)>15){
  me.targetAngle=Math.atan2(dy,dx);
 }
});

/* ==============================
   JOYSTICK
============================== */

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joyId=null;

function moveJoystick(x,y){

 const r=joystick.getBoundingClientRect();

 const cx=r.left+r.width/2;
 const cy=r.top+r.height/2;

 let dx=x-cx;
 let dy=y-cy;

 const max=55;
 const d=Math.hypot(dx,dy);

 if(d>max){
  dx=dx/d*max;
  dy=dy/d*max;
 }

 stick.style.left=`calc(50% + ${dx}px)`;
 stick.style.top=`calc(50% + ${dy}px)`;

 if(d>7){
  me.targetAngle=Math.atan2(dy,dx);
 }
}

function resetJoystick(){
 joyId=null;
 stick.style.left="50%";
 stick.style.top="50%";
}

joystick.onpointerdown=e=>{
 joyId=e.pointerId;
 joystick.setPointerCapture(e.pointerId);
 moveJoystick(e.clientX,e.clientY);
};

joystick.onpointermove=e=>{
 if(e.pointerId===joyId)
  moveJoystick(e.clientX,e.clientY);
};

joystick.onpointerup=resetJoystick;
joystick.onpointercancel=resetJoystick;

/* ==============================
   BOOST
============================== */

const boost=document.getElementById("boost");

boost.onpointerdown=()=>boosting=true;
boost.onpointerup=()=>boosting=false;
boost.onpointercancel=()=>boosting=false;

/* ==============================
   ABILITIES
============================== */

let magnetTime=0;
let shieldTime=0;
let ghostTime=0;

document.getElementById("magnetBtn").onclick=()=>{
 useAbility("magnet");
};

document.getElementById("shieldBtn").onclick=()=>{
 useAbility("shield");
};

document.getElementById("ghostBtn").onclick=()=>{
 useAbility("ghost");
};

function useAbility(type){

 if(!running)return;

 const now=performance.now();

 if(type==="magnet"&&now>=magnetTime){
  magnetTime=now+12000;
 }

 if(type==="shield"&&now>=shieldTime){
  shieldTime=now+15000;
 }

 if(type==="ghost"&&now>=ghostTime){
  ghostTime=now+18000;
 }
}

function updateAbilities(){

 const now=performance.now();

 const m=document.getElementById("magnetBtn");
 const s=document.getElementById("shieldBtn");
 const g=document.getElementById("ghostBtn");

 m.classList.toggle("ready",now>=magnetTime);
 s.classList.toggle("ready",now>=shieldTime);
 g.classList.toggle("ready",now>=ghostTime);

 m.textContent=
  now<magnetTime?
  "🧲 "+Math.ceil((magnetTime-now)/1000):
  "🧲 MAGNET";

 s.textContent=
  now<shieldTime?
  "🛡️ "+Math.ceil((shieldTime-now)/1000):
  "🛡️ SHIELD";

 g.textContent=
  now<ghostTime?
  "👻 "+Math.ceil((ghostTime-now)/1000):
  "👻 GHOST";
}

/* ==============================
   UPDATE
============================== */

let lastSend=0;
let lastTime=performance.now();

function update(){

 if(!running||dead)return;

 const now=performance.now();
 const dt=Math.min(2,(now-lastTime)/16.67);
 lastTime=now;

 keyboardDirection();

 let difference=me.targetAngle-me.angle;

 while(difference>Math.PI)difference-=Math.PI*2;
 while(difference<-Math.PI)difference+=Math.PI*2;

 me.angle+=difference*.14*dt;

 let speed=5.5;

 if(boosting){
  speed=9.5;

  if(me.length>22){
   me.length-=.025*dt;

   /* BOOST DROPS */
   if(Math.random()<.16){
    foods.push(makeFood(
     me.x-Math.cos(me.angle)*18,
     me.y-Math.sin(me.angle)*18,
     2
    ));
   }
  }
 }

 me.x+=Math.cos(me.angle)*speed*dt;
 me.y+=Math.sin(me.angle)*speed*dt;

 me.x=Math.max(30,Math.min(WORLD-30,me.x));
 me.y=Math.max(30,Math.min(WORLD-30,me.y));

 body.unshift({x:me.x,y:me.y});

 while(body.length>Math.floor(me.length))
  body.pop();

 while(body.length<Math.floor(me.length))
  body.push({x:me.x,y:me.y});

 eatFood();

 updateBots(dt);
 checkBotCollisions();
 checkOnlineCollisions();

 if(now-lastSend>45){

  lastSend=now;

  send({
   type:"state",
   x:me.x,
   y:me.y,
   angle:me.angle,
   length:me.length,
   color:me.color,
   skin:me.skin,
   name:playerName()
  });
 }

 document.getElementById("score").textContent=Math.floor(score);
 document.getElementById("length").textContent=Math.floor(me.length);
 document.getElementById("level").textContent=level;

 updateAbilities();
}

/* ==============================
   FOOD
============================== */

function eatFood(){

 const magnet=performance.now()<magnetTime;

 for(let i=foods.length-1;i>=0;i--){

  const food=foods[i];

  let dx=food.x-me.x;
  let dy=food.y-me.y;

  const dist=Math.hypot(dx,dy);

  if(magnet&&dist<350){

   food.x+=(me.x-food.x)*.08;
   food.y+=(me.y-food.y)*.08;
  }

  if(dist<25+food.radius){

   score+=food.value;
   me.length+=food.value*.42;

   addXP(food.value*3);

   foods.splice(i,1);

   foods.push(makeFood());
  }
 }
}

/* ==============================
   BOTS
============================== */

function updateBots(dt){

 for(const id in bots){

  const b=bots[id];

  if(!b.alive)continue;

  b.think-=dt;

  if(b.think<=0){

   b.think=25+Math.random()*50;

   /* otsi lähedal olevat toitu */
   let nearest=null;
   let best=700;

   for(let i=0;i<foods.length;i+=8){

    const f=foods[i];

    const d=Math.hypot(f.x-b.x,f.y-b.y);

    if(d<best){
     best=d;
     nearest=f;
    }
   }

   if(nearest){
    b.targetAngle=Math.atan2(
     nearest.y-b.y,
     nearest.x-b.x
    );
   }

   /* mõnikord jälitab mängijat */
   const playerDist=Math.hypot(
    me.x-b.x,
    me.y-b.y
   );

   if(playerDist<600&&Math.random()<.35){
    b.targetAngle=Math.atan2(
     me.y-b.y,
     me.x-b.x
    );
   }
  }

  let diff=b.targetAngle-b.angle;

  while(diff>Math.PI)diff-=Math.PI*2;
  while(diff<-Math.PI)diff+=Math.PI*2;

  b.angle+=diff*.04*dt;

  const speed=3.5+Math.min(2,b.length/80);

  b.x+=Math.cos(b.angle)*speed*dt;
  b.y+=Math.sin(b.angle)*speed*dt;

  if(b.x<300||b.x>WORLD-300)b.targetAngle=Math.PI-b.angle;
  if(b.y<300||b.y>WORLD-300)b.targetAngle=-b.angle;

  /* bot sööb */
  for(let i=foods.length-1;i>=0;i--){

   const f=foods[i];

   if(Math.hypot(f.x-b.x,f.y-b.y)<22){

    b.length+=f.value*.35;
    foods.splice(i,1);
    foods.push(makeFood());
    break;
   }
  }
 }
}

/* ==============================
   COLLISIONS
============================== */

function checkBotCollisions(){

 if(selectedMode!=="bots")return;

 for(const id in bots){

  const b=bots[id];

  if(!b.alive)continue;

  /* bot vastu minu keha */
  if(
   performance.now()>ghostTime &&
   distanceToBody(b.x,b.y,body)>18
  ){

   killBot(b);
  }

  /* mina vastu b keha */
  if(
   performance.now()>ghostTime &&
   distanceToBotBody(me.x,me.y,b)>18
  ){

   die("💥 Sa põrkasid vastu "+b.name+"!");
   return;
  }
 }
}

function distanceToBody(x,y,b){

 let min=99999;

 for(let i=4;i<b.length;i+=4){

  const p=b[i];

  const d=Math.hypot(x-p.x,y-p.y);

  if(d<min)min=d;

  if(d<22)return d;
 }

 return min;
}

function distanceToBotBody(x,y,b){

 const count=Math.min(100,Math.floor(b.length));

 let min=99999;

 for(let i=5;i<count;i+=3){

  const px=b.x-Math.cos(b.angle)*i*8;
  const py=b.y-Math.sin(b.angle)*i*8;

  const d=Math.hypot(x-px,y-py);

  if(d<min)min=d;
 }

 return min;
}

function killBot(bot){

 bot.alive=false;

 showKill();

 score+=100;
 me.length+=Math.max(3,bot.length*.15);
 addXP(40);

 /* bot muutub toiduks */
 for(let i=0;i<Math.min(30,bot.length/2);i++){

  const a=Math.random()*Math.PI*2;
  const r=Math.random()*bot.length*5;

  foods.push(
   makeFood(
    bot.x+Math.cos(a)*r,
    bot.y+Math.sin(a)*r,
    3+Math.floor(Math.random()*5)
   )
  );
 }
}

function checkOnlineCollisions(){

 if(selectedMode!=="online")return;

 const now=performance.now();

 if(now<ghostTime)return;

 for(const id in others){

  if(id===me.id)continue;

  const p=others[id];

  if(!p)continue;

  const d=Math.hypot(
   me.x-p.x,
   me.y-p.y
  );

  if(d<30){

   /* suurem snake võidab */
   if(me.length>=Number(p.length||20)){

    showKill();

    score+=100;
    me.length+=Math.max(
     3,
     Number(p.length||20)*.15
    );

    addXP(50);

    send({
     type:"attack",
     target:id
    });

   }else{

    die("💥 "+(p.name||"Mängija")+" tappis su!");

    return;
   }
  }
 }
}

/* ==============================
   CAMERA
============================== */

function updateCamera(){

 cameraX+=(me.x-cameraX)*.1;
 cameraY+=(me.y-cameraY)*.1;
}

/* ==============================
   DRAW
============================== */

function draw(){

 ctx.fillStyle="#071008";
 ctx.fillRect(0,0,W,H);

 if(!running)return;

 updateCamera();

 ctx.save();

 ctx.translate(
  W/2-cameraX,
  H/2-cameraY
 );

 drawGrid();
 drawBorder();
 drawFood();
 drawBots();
 drawOthers();
 drawMe();

 ctx.restore();

 drawMinimap();
}

/* ==============================
   GRID
============================== */

function drawGrid(){

 const grid=250;

 const left=cameraX-W/2-500;
 const right=cameraX+W/2+500;
 const top=cameraY-H/2-500;
 const bottom=cameraY+H/2+500;

 ctx.strokeStyle="rgba(99,255,120,.045)";
 ctx.lineWidth=1;

 for(
  let x=Math.floor(left/grid)*grid;
  x<right;
  x+=grid
 ){

  ctx.beginPath();
  ctx.moveTo(x,top);
  ctx.lineTo(x,bottom);
  ctx.stroke();
 }

 for(
  let y=Math.floor(top/grid)*grid;
  y<bottom;
  y+=grid
 ){

  ctx.beginPath();
  ctx.moveTo(left,y);
  ctx.lineTo(right,y);
  ctx.stroke();
 }
}

function drawBorder(){

 ctx.strokeStyle="#63ff78";
 ctx.lineWidth=18;
 ctx.shadowColor="#63ff78";
 ctx.shadowBlur=20;

 ctx.strokeRect(0,0,WORLD,WORLD);

 ctx.shadowBlur=0;
}

/* ==============================
   FOOD DRAW
============================== */

function drawFood(){

 for(const food of foods){

  if(
   Math.abs(food.x-cameraX)>W+100||
   Math.abs(food.y-cameraY)>H+100
  )continue;

  ctx.fillStyle=food.color;
  ctx.shadowColor=food.color;
  ctx.shadowBlur=9;

  ctx.beginPath();
  ctx.arc(
   food.x,
   food.y,
   food.radius,
   0,
   Math.PI*2
  );
  ctx.fill();
 }

 ctx.shadowBlur=0;
}

/* ==============================
   SKIN
============================== */

function drawSkinHead(x,y,r,color,skin,angle){

 ctx.save();

 ctx.translate(x,y);
 ctx.rotate(angle||0);

 ctx.fillStyle=color;
 ctx.shadowColor=color;
 ctx.shadowBlur=20;

 ctx.beginPath();
 ctx.arc(0,0,r,0,Math.PI*2);
 ctx.fill();

 ctx.shadowBlur=0;

 if(skin==="ice"){
  ctx.strokeStyle="#d9f8ff";
  ctx.lineWidth=4;
  ctx.stroke();
 }

 if(skin==="lava"){
  ctx.strokeStyle="#ffbd8a";
  ctx.lineWidth=4;

  for(let i=-1;i<=1;i++){
   ctx.beginPath();
   ctx.moveTo(-r*.65,i*r*.45);
   ctx.lineTo(r*.65,i*r*.45);
   ctx.stroke();
  }
 }

 if(skin==="lightning"){
  ctx.strokeStyle="#fff3a1";
  ctx.lineWidth=3;

  ctx.beginPath();
  ctx.moveTo(-5,-15);
  ctx.lineTo(4,-3);
  ctx.lineTo(-2,-3);
  ctx.lineTo(8,15);
  ctx.stroke();
 }

 if(skin==="alien"){
  ctx.fillStyle="#efffb0";

  ctx.beginPath();
  ctx.ellipse(10,-7,7,10,0,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.ellipse(10,7,7,10,0,0,Math.PI*2);
  ctx.fill();
 }

 if(skin==="fire"){
  ctx.strokeStyle="#ffe1a9";
  ctx.lineWidth=3;

  ctx.beginPath();
  ctx.arc(0,0,r*.65,0,Math.PI*2);
  ctx.stroke();
 }

 if(skin==="ghost"){
  ctx.globalAlpha=.55;
  ctx.fillStyle="white";

  ctx.beginPath();
  ctx.arc(0,0,r*.7,0,Math.PI*2);
  ctx.fill();

  ctx.globalAlpha=1;
 }

 if(skin==="robot"){
  ctx.strokeStyle="#d0fffa";
  ctx.lineWidth=3;

  ctx.strokeRect(-r*.55,-r*.55,r*1.1,r*1.1);
 }

 if(skin==="dragon"){
  ctx.fillStyle="#ffdb4d";

  ctx.beginPath();
  ctx.moveTo(-r*.6,-r*.8);
  ctx.lineTo(-r*.2,-r*1.2);
  ctx.lineTo(0,-r*.65);
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(-r*.6,r*.8);
  ctx.lineTo(-r*.2,r*1.2);
  ctx.lineTo(0,r*.65);
  ctx.fill();
 }

 ctx.restore();
}

/* ==============================
   FACE
============================== */

function drawFace(x,y,angle){

 ctx.save();

 ctx.translate(x,y);
 ctx.rotate(angle);

 ctx.fillStyle="white";

 ctx.beginPath();
 ctx.arc(9,-7,6,0,Math.PI*2);
 ctx.fill();

 ctx.beginPath();
 ctx.arc(9,7,6,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="#111";

 ctx.beginPath();
 ctx.arc(11,-7,3,0,Math.PI*2);
 ctx.fill();

 ctx.beginPath();
 ctx.arc(11,7,3,0,Math.PI*2);
 ctx.fill();

 ctx.strokeStyle="#111";
 ctx.lineWidth=2;

 ctx.beginPath();
 ctx.arc(14,0,5,-.7,.7);
 ctx.stroke();

 ctx.restore();
}

/* ==============================
   MY SNAKE
============================== */

function drawMe(){

 for(let i=body.length-1;i>=0;i--){

  const p=body[i];

  const progress=i/body.length;
  const radius=8+(1-progress)*9;

  ctx.globalAlpha=1-progress*.3;

  ctx.fillStyle=me.color;
  ctx.shadowColor=me.color;
  ctx.shadowBlur=i<8?14:4;

  ctx.beginPath();
  ctx.arc(p.x,p.y,radius,0,Math.PI*2);
  ctx.fill();
 }

 ctx.globalAlpha=1;
 ctx.shadowBlur=0;

 drawSkinHead(
  me.x,
  me.y,
  22,
  me.color,
  me.skin,
  me.angle
 );

 drawFace(me.x,me.y,me.angle);

 drawName(
  playerName(),
  me.x,
  me.y-34
 );
}

/* ==============================
   OTHER PLAYERS
============================== */

function drawOthers(){

 for(const id in others){

  if(id===me.id)continue;

  const p=others[id];

  if(!p)continue;

  drawRemoteSnake(
   p,
   p.x,
   p.y
  );
 }
}

function drawRemoteSnake(p,x,y){

 const targetLength=Math.min(
  180,
  Math.max(20,Math.floor(p.length||20))
 );

 for(let i=targetLength-1;i>=0;i--){

  const px=x-Math.cos(p.angle)*i*8;
  const py=y-Math.sin(p.angle)*i*8;

  const progress=i/targetLength;

  ctx.globalAlpha=1-progress*.3;
  ctx.fillStyle=p.color||"#4da6ff";

  ctx.beginPath();
  ctx.arc(
   px,
   py,
   8+(1-progress)*8,
   0,
   Math.PI*2
  );
  ctx.fill();
 }

 ctx.globalAlpha=1;

 drawSkinHead(
  x,
  y,
  22,
  p.color||"#4da6ff",
  p.skin||"dragon",
  p.angle||0
 );

 drawFace(x,y,p.angle||0);

 drawName(
  p.name||"Player",
  x,
  y-34
 );
}

/* ==============================
   BOTS DRAW
============================== */

function drawBots(){

 if(selectedMode!=="bots")return;

 for(const id in bots){

  const b=bots[id];

  if(!b.alive)continue;

  const count=Math.min(
   160,
   Math.floor(b.length)
  );

  for(let i=count-1;i>=0;i--){

   const x=
    b.x-
    Math.cos(b.angle)*i*8;

   const y=
    b.y-
    Math.sin(b.angle)*i*8;

   const progress=i/count;

   ctx.globalAlpha=1-progress*.3;

   ctx.fillStyle=b.color;

   ctx.beginPath();

   ctx.arc(
    x,
    y,
    8+(1-progress)*8,
    0,
    Math.PI*2
   );

   ctx.fill();
  }

  ctx.globalAlpha=1;

  drawSkinHead(
   b.x,
   b.y,
   22,
   b.color,
   b.skin,
   b.angle
  );

  drawFace(
   b.x,
   b.y,
   b.angle
  );

  drawName(
   b.name,
   b.x,
   b.y-34
  );
 }
}

/* ==============================
   NAME
============================== */

function drawName(name,x,y){

 ctx.save();

 ctx.textAlign="center";
 ctx.font="bold 12px Arial";
 ctx.fillStyle="white";
 ctx.shadowColor="black";
 ctx.shadowBlur=5;

 ctx.fillText(name,x,y);

 ctx.restore();
}

/* ==============================
   MINIMAP
============================== */

function drawMinimap(){

 const size=minimap.width;

 mapCtx.clearRect(0,0,size,size);

 mapCtx.fillStyle="#061007";
 mapCtx.fillRect(0,0,size,size);

 /* muud mängijad */

 for(const id in others){

  if(id===me.id)continue;

  const p=others[id];

  mapCtx.fillStyle=p.color||"#ff5268";

  mapCtx.beginPath();

  mapCtx.arc(
   p.x/WORLD*size,
   p.y/WORLD*size,
   4,
   0,
   Math.PI*2
  );

  mapCtx.fill();
 }

 /* botid */

 if(selectedMode==="bots"){

  for(const id in bots){

   const b=bots[id];

   if(!b.alive)continue;

   mapCtx.fillStyle=b.color;

   mapCtx.beginPath();

   mapCtx.arc(
    b.x/WORLD*size,
    b.y/WORLD*size,
    3,
    0,
    Math.PI*2
   );

   mapCtx.fill();
  }
 }

 /* mina */

 mapCtx.fillStyle=me.color;
 mapCtx.shadowColor=me.color;
 mapCtx.shadowBlur=10;

 mapCtx.beginPath();

 mapCtx.arc(
  me.x/WORLD*size,
  me.y/WORLD*size,
  6,
  0,
  Math.PI*2
 );

 mapCtx.fill();

 mapCtx.shadowBlur=0;

 mapCtx.strokeStyle="#63ff78";
 mapCtx.lineWidth=2;

 mapCtx.strokeRect(
  1,
  1,
  size-2,
  size-2
 );
}

/* ==============================
   KILL
============================== */

let killTimer=null;

function showKill(){

 const el=document.getElementById("killText");

 el.classList.add("show");

 clearTimeout(killTimer);

 killTimer=setTimeout(()=>{
  el.classList.remove("show");
 },800);
}

/* ==============================
   DEATH
============================== */

function die(reason){

 if(dead)return;

 dead=true;
 running=false;
 boosting=false;

 document.getElementById("deathReason").textContent=reason;
 document.getElementById("finalScore").textContent=Math.floor(score);
 document.getElementById("finalLevel").textContent=level;

 document.getElementById("gameOver").style.display="flex";
}

/* ==============================
   LOOP
============================== */

function loop(){

 update();
 draw();

 requestAnimationFrame(loop);
}

connect();

document.getElementById("createBtn").style.display="block";

loop();
</script>
