<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Snake Arena</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050905;
    font-family:Arial,sans-serif;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

#menu{
    position:fixed;
    inset:0;
    z-index:100;
    overflow:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
    background:
        radial-gradient(circle at 50% 10%,#234e2a,#081208 45%,#020402);
}

.panel{
    width:min(95vw,460px);
    max-height:94vh;
    overflow:auto;
    padding:25px;
    border-radius:25px;
    background:rgba(5,12,6,.97);
    border:1px solid #315b36;
    color:white;
    text-align:center;
    box-shadow:0 0 70px rgba(99,255,120,.15);
}

.logo{
    font-size:65px;
}

h1{
    color:#63ff78;
    font-size:38px;
}

.subtitle{
    color:#78907c;
    margin:5px 0 18px;
}

input{
    width:100%;
    height:47px;
    margin:5px 0;
    border-radius:11px;
    border:1px solid #315b36;
    background:#081108;
    color:white;
    text-align:center;
    font-size:16px;
    outline:none;
}

button{
    font-family:Arial,sans-serif;
    font-weight:bold;
}

.mainBtn{
    width:100%;
    min-height:48px;
    margin-top:7px;
    border-radius:11px;
    border:0;
    cursor:pointer;
    font-size:15px;
}

.green{
    background:#63ff78;
    color:#031006;
}

.dark{
    background:#102014;
    color:white;
    border:1px solid #315b36;
}

#skins{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    margin:12px 0;
}

.skin{
    width:52px;
    height:52px;
    border-radius:50%;
    border:3px solid transparent;
    cursor:pointer;
    font-size:23px;
}

.skin.selected{
    border-color:white;
    transform:scale(1.1);
}

#roomBox{
    display:none;
    margin-top:15px;
}

#roomCode{
    font-size:30px;
    color:#63ff78;
    font-weight:900;
    letter-spacing:5px;
    margin:5px;
}

#players{
    max-height:130px;
    overflow:auto;
}

.playerRow{
    padding:7px;
    margin:3px;
    border-radius:8px;
    background:#0c180e;
}

#error{
    min-height:20px;
    color:#ff6070;
    margin-top:8px;
}

#connection{
    margin-top:7px;
    font-size:11px;
    color:#718172;
}

#hud{
    position:fixed;
    left:10px;
    top:10px;
    z-index:20;
    display:none;
    gap:5px;
}

.stat{
    background:rgba(0,0,0,.72);
    border:1px solid rgba(99,255,120,.3);
    border-radius:10px;
    padding:7px 10px;
    color:white;
}

.stat small{
    display:block;
    color:#718172;
    font-size:9px;
}

.stat b{
    font-size:16px;
}

#leaderboard{
    position:fixed;
    right:10px;
    top:10px;
    z-index:20;
    width:175px;
    background:rgba(0,0,0,.75);
    border:1px solid rgba(99,255,120,.3);
    border-radius:14px;
    padding:10px;
    color:white;
}

.lbTitle{
    color:#63ff78;
    font-weight:bold;
    margin-bottom:5px;
}

.lbRow{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    padding:3px 0;
}

#minimap{
    position:fixed;
    z-index:20;
    right:195px;
    top:10px;
    width:150px;
    height:150px;
    display:none;
    background:#061007;
    border:2px solid #63ff78;
    border-radius:14px;
}

#joystick{
    position:fixed;
    z-index:30;
    left:20px;
    bottom:20px;
    width:145px;
    height:145px;
    display:none;
    border-radius:50%;
    border:2px solid rgba(99,255,120,.35);
    background:rgba(99,255,120,.08);
}

#stick{
    position:absolute;
    left:50%;
    top:50%;
    width:62px;
    height:62px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:#63ff78;
    border:3px solid white;
}

#boost{
    position:fixed;
    right:22px;
    bottom:25px;
    z-index:30;
    width:90px;
    height:90px;
    display:none;
    border-radius:50%;
    border:3px solid #a8e8ff;
    background:#087cad;
    color:white;
    font-size:25px;
}

#killText{
    position:fixed;
    z-index:50;
    top:24%;
    left:50%;
    transform:translate(-50%,-50%) scale(.7);
    opacity:0;
    pointer-events:none;
    color:#63ff78;
    font-size:38px;
    font-weight:900;
    text-shadow:0 0 25px #63ff78;
    transition:.2s;
}

#killText.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
}

#gameOver{
    position:fixed;
    inset:0;
    z-index:200;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.82);
}

.over{
    width:min(90vw,390px);
    padding:30px;
    border-radius:25px;
    background:#081008;
    border:1px solid #315b36;
    text-align:center;
    color:white;
}

.over h2{
    color:#ff6070;
    font-size:38px;
}

@media(max-width:800px){

    #joystick,
    #boost{
        display:block;
    }

    #leaderboard{
        width:145px;
        top:10px;
        right:10px;
    }

    #minimap{
        width:110px;
        height:110px;
        right:165px;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="menu">

<div class="panel">

<div class="logo">🐍</div>

<h1>SNAKE ARENA</h1>

<div class="subtitle">
Eat • Grow • Fight • Survive
</div>

<input id="name" maxlength="16" placeholder="Sinu nimi">

<h3>🎨 Skin</h3>

<div id="skins">

<button class="skin selected" data-color="#63ff78" data-skin="green" style="background:#63ff78">🐍</button>
<button class="skin" data-color="#4da6ff" data-skin="blue" style="background:#4da6ff">😎</button>
<button class="skin" data-color="#ff5570" data-skin="red" style="background:#ff5570">😈</button>
<button class="skin" data-color="#ffd84d" data-skin="yellow" style="background:#ffd84d">😄</button>
<button class="skin" data-color="#b86cff" data-skin="purple" style="background:#b86cff">👾</button>
<button class="skin" data-color="#ff8a3d" data-skin="orange" style="background:#ff8a3d">🔥</button>
<button class="skin" data-color="#fff" data-skin="white" style="background:white">👻</button>
<button class="skin" data-color="#00e5d4" data-skin="cyan" style="background:#00e5d4">🤖</button>

</div>

<button id="singleBtn" class="mainBtn green">
🤖 SINGLEPLAYER — BOTID
</button>

<button id="createBtn" class="mainBtn dark">
🏠 CREATE ROOM
</button>

<input id="roomInput" maxlength="6" placeholder="ROOM CODE">

<button id="joinBtn" class="mainBtn dark">
🚪 JOIN ROOM
</button>

<div id="roomBox">

<div style="font-size:11px;color:#718172">
ROOM CODE
</div>

<div id="roomCode">------</div>

<div id="players"></div>

<button id="startBtn" class="mainBtn green">
▶ START GAME
</button>

</div>

<div id="error"></div>
<div id="connection">Ühendamine...</div>

</div>
</div>

<div id="hud">

<div class="stat">
<small>SCORE</small>
<b id="score">0</b>
</div>

<div class="stat">
<small>KILLS</small>
<b id="kills">0</b>
</div>

<div class="stat">
<small>LENGTH</small>
<b id="length">25</b>
</div>

<div class="stat">
<small>COINS</small>
<b id="coins">0</b>
</div>

</div>

<div id="leaderboard">

<div class="lbTitle">
🏆 TOP 3
</div>

<div id="lbRows"></div>

</div>

<canvas id="minimap" width="150" height="150"></canvas>

<div id="killText">
💥 +10 KILL!
</div>

<div id="joystick">
<div id="stick"></div>
</div>

<button id="boost">
⚡
</button>

<div id="gameOver">

<div class="over">

<h2>GAME OVER</h2>

<p id="deathReason">
Sind tapeti!
</p>

<p style="margin-top:10px">
Skoor:
<b id="finalScore">0</b>
</p>

<button
class="mainBtn green"
style="margin-top:20px"
onclick="location.reload()">
🔄 TAGASI MENÜÜSSE
</button>

</div>

</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){
    W=innerWidth;
    H=innerHeight;
    canvas.width=W;
    canvas.height=H;
}

addEventListener("resize",resize);
resize();

const WORLD=20000;

const foods=[];

const foodColors=[
    "#63ff78",
    "#ffd84d",
    "#ff6070",
    "#4da6ff",
    "#b86cff",
    "#ff8a3d"
];

for(let i=0;i<1300;i++){

    foods.push({
        x:Math.random()*WORLD,
        y:Math.random()*WORLD,
        radius:3+Math.random()*5,
        color:foodColors[
            Math.floor(Math.random()*foodColors.length)
        ],
        value:1+Math.floor(Math.random()*4)
    });
}

const me={
    id:null,
    x:10000,
    y:10000,
    angle:0,
    targetAngle:0,
    length:25,
    score:0,
    kills:0,
    coins:Number(localStorage.getItem("snakeCoins")||0),
    color:"#63ff78",
    skin:"green"
};

let body=[];
let bots=[];
let others={};

let running=false;
let dead=false;
let single=false;
let boosting=false;

let socket=null;
let connected=false;

const keys={};

function playerName(){

    return (
        document.getElementById("name").value.trim() ||
        "Player"
    ).substring(0,16);
}

function escapeHtml(t){

    return String(t)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;");
}

document.querySelectorAll(".skin").forEach(btn=>{

    btn.onclick=()=>{

        document
            .querySelectorAll(".skin")
            .forEach(x=>x.classList.remove("selected"));

        btn.classList.add("selected");

        me.color=btn.dataset.color;
        me.skin=btn.dataset.skin;
    };
});

function connect(){

    if(location.protocol==="file:"){

        connected=false;

        document.getElementById("connection").textContent=
            "🟢 Singleplayer valmis";

        return;
    }

    const protocol=
        location.protocol==="https:" ? "wss:" : "ws:";

    socket=new WebSocket(
        protocol+"//"+location.host
    );

    socket.onopen=()=>{

        connected=true;

        document.getElementById("connection").textContent=
            "🟢 Server ühendatud";

        send({
            type:"hello",
            name:playerName(),
            color:me.color,
            skin:me.skin
        });
    };

    socket.onclose=()=>{

        connected=false;

        document.getElementById("connection").textContent=
            "🔴 Serveriga ühendus katkes";
    };

    socket.onerror=()=>{

        connected=false;
    };

    socket.onmessage=e=>{

        try{
            handleServer(JSON.parse(e.data));
        }catch(err){
            console.log(err);
        }
    };
}

function send(data){

    if(
        !socket ||
        socket.readyState!==WebSocket.OPEN
    ){
        return false;
    }

    socket.send(JSON.stringify(data));

    return true;
}

function handleServer(data){

    if(data.type==="roomCreated"){

        me.id=data.id;

        document.getElementById("roomBox").style.display="block";
        document.getElementById("roomCode").textContent=data.code;

        return;
    }

    if(data.type==="roomJoined"){

        me.id=data.id;

        document.getElementById("roomBox").style.display="block";
        document.getElementById("roomCode").textContent=data.code;

        return;
    }

    if(data.type==="lobby"){

        const box=document.getElementById("players");

        box.innerHTML="";

        for(const p of data.players){

            const div=document.createElement("div");

            div.className="playerRow";

            div.style.color=p.color||"white";

            div.textContent=
                (p.host?"👑 ":"🐍 ")+
                p.name;

            box.appendChild(div);
        }

        return;
    }

    if(data.type==="gameStart"){

        me.id=data.id;

        startGame(false);

        return;
    }

    if(data.type==="players"){

        others=data.players||{};

        return;
    }

    if(data.type==="kill"){

        me.kills=data.kills||me.kills;

        me.score=data.score||me.score;

        me.coins+=10;

        localStorage.setItem(
            "snakeCoins",
            me.coins
        );

        showKill();

        return;
    }

    if(data.type==="playerKilled"){

        return;
    }

    if(data.type==="gameOver"){

        die(data.reason||"Sind tapeti!");

        return;
    }

    if(data.type==="error"){

        document.getElementById("error").textContent=
            data.message;

        return;
    }
}

document.getElementById("createBtn").onclick=()=>{

    document.getElementById("error").textContent="";

    if(!connected){

        document.getElementById("error").textContent=
            "Serveriga pole ühendust.";

        return;
    }

    send({
        type:"createRoom",
        name:playerName(),
        color:me.color,
        skin:me.skin
    });
};

document.getElementById("joinBtn").onclick=()=>{

    const code=
        document.getElementById("roomInput")
        .value
        .trim()
        .toUpperCase();

    if(code.length!==6){

        document.getElementById("error").textContent=
            "Sisesta 6-märgiline room code.";

        return;
    }

    if(!connected){

        document.getElementById("error").textContent=
            "Serveriga pole ühendust.";

        return;
    }

    send({
        type:"joinRoom",
        code,
        name:playerName(),
        color:me.color,
        skin:me.skin
    });
};

document.getElementById("startBtn").onclick=()=>{

    if(!send({
        type:"startGame"
    })){

        startGame(false);
    }
};

document.getElementById("singleBtn").onclick=()=>{

    startGame(true);
};

addEventListener("keydown",e=>{

    keys[e.key.toLowerCase()]=true;

    if(e.key==="Shift"){
        boosting=true;
    }
});

addEventListener("keyup",e=>{

    keys[e.key.toLowerCase()]=false;

    if(e.key==="Shift"){
        boosting=false;
    }
});

function keyboard(){

    let dx=0;
    let dy=0;

    if(keys.w||keys.arrowup)dy--;
    if(keys.s||keys.arrowdown)dy++;
    if(keys.a||keys.arrowleft)dx--;
    if(keys.d||keys.arrowright)dx++;

    if(dx||dy){

        me.targetAngle=
            Math.atan2(dy,dx);
    }
}

addEventListener("mousemove",e=>{

    if(!running)return;
    if(innerWidth<=800)return;

    const dx=e.clientX-W/2;
    const dy=e.clientY-H/2;

    if(Math.hypot(dx,dy)>15){

        me.targetAngle=
            Math.atan2(dy,dx);
    }
});

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joystickPointer=null;

joystick.onpointerdown=e=>{

    joystickPointer=e.pointerId;

    joystick.setPointerCapture(
        e.pointerId
    );

    moveJoy(
        e.clientX,
        e.clientY
    );
};

joystick.onpointermove=e=>{

    if(e.pointerId===joystickPointer){

        moveJoy(
            e.clientX,
            e.clientY
        );
    }
};

joystick.onpointerup=resetJoy;
joystick.onpointercancel=resetJoy;

function moveJoy(x,y){

    const r=joystick.getBoundingClientRect();

    const cx=r.left+r.width/2;
    const cy=r.top+r.height/2;

    let dx=x-cx;
    let dy=y-cy;

    const max=55;

    const d=Math.hypot(dx,dy);

    if(d>max){

        dx=dx/d*max;
        dy=dy/d*max;
    }

    stick.style.left=
        `calc(50% + ${dx}px)`;

    stick.style.top=
        `calc(50% + ${dy}px)`;

    if(d>8){

        me.targetAngle=
            Math.atan2(dy,dx);
    }
}

function resetJoy(){

    joystickPointer=null;

    stick.style.left="50%";
    stick.style.top="50%";
}

const boost=document.getElementById("boost");

boost.onpointerdown=()=>{
    boosting=true;
};

boost.onpointerup=()=>{
    boosting=false;
};

boost.onpointercancel=()=>{
    boosting=false;
};

function startGame(botMode){

    single=botMode;
    running=true;
    dead=false;

    document.getElementById("menu").style.display="none";
    document.getElementById("hud").style.display="flex";
    document.getElementById("minimap").style.display="block";

    me.x=4000+Math.random()*12000;
    me.y=4000+Math.random()*12000;

    me.angle=Math.random()*Math.PI*2;
    me.targetAngle=me.angle;

    me.length=25;
    me.score=0;
    me.kills=0;

    body=[];

    for(let i=0;i<me.length;i++){

        body.push({
            x:me.x-Math.cos(me.angle)*i*8,
            y:me.y-Math.sin(me.angle)*i*8
        });
    }

    if(single){

        createBots(10);
    }

    updateHUD();
}

function createBots(count){

    bots=[];

    const colors=[
        "#4da6ff",
        "#ff5570",
        "#ffd84d",
        "#b86cff",
        "#ff8a3d",
        "#00e5d4",
        "#ffffff",
        "#ff66cc",
        "#79a8ff",
        "#62ff9a"
    ];

    const names=[
        "Viper",
        "Cobra",
        "Shadow",
        "Hunter",
        "Blaze",
        "Toxic",
        "Python",
        "Ghost",
        "Speedy",
        "Rex"
    ];

    for(let i=0;i<count;i++){

        bots.push({

            id:"bot"+i,

            x:1000+Math.random()*18000,
            y:1000+Math.random()*18000,

            angle:Math.random()*Math.PI*2,

            targetAngle:Math.random()*Math.PI*2,

            length:25+Math.random()*70,

            color:colors[i%colors.length],

            skin:[
                "blue",
                "red",
                "yellow",
                "purple",
                "orange",
                "cyan",
                "white"
            ][i%7],

            name:names[i],

            body:[],

            timer:0
        });
    }
}

function update(){

    if(!running||dead)return;

    keyboard();

    let diff=
        me.targetAngle-me.angle;

    while(diff>Math.PI)diff-=Math.PI*2;
    while(diff<-Math.PI)diff+=Math.PI*2;

    me.angle+=diff*.18;

    /*
        KIIRUS ON NÜÜD SUUREM
        tavaline: 7.2
        boost: 10.8
    */

    const speed=
        boosting ? 10.8 : 7.2;

    me.x+=Math.cos(me.angle)*speed;
    me.y+=Math.sin(me.angle)*speed;

    me.x=Math.max(
        25,
        Math.min(WORLD-25,me.x)
    );

    me.y=Math.max(
        25,
        Math.min(WORLD-25,me.y)
    );

    body.unshift({
        x:me.x,
        y:me.y
    });

    while(
        body.length<
        Math.floor(me.length)
    ){
        body.push({
            x:body.length?
                body[body.length-1].x:
                me.x,
            y:body.length?
                body[body.length-1].y:
                me.y
        });
    }

    while(
        body.length>
        Math.floor(me.length)
    ){
        body.pop();
    }

    eatFood();

    if(boosting&&me.length>27){

        me.length-=.035;

        /*
            Boost jätab väikseid tükke maha.
        */

        if(Math.random()<.22){

            foods.push({
                x:me.x-Math.cos(me.angle)*35,
                y:me.y-Math.sin(me.angle)*35,
                radius:4,
                color:me.color,
                value:2
            });
        }
    }

    if(single){

        updateBots();
        checkBotCollisions();

    }else{

        sendState();
    }

    updateHUD();
}

function eatFood(){

    for(let i=foods.length-1;i>=0;i--){

        const f=foods[i];

        if(
            Math.hypot(
                me.x-f.x,
                me.y-f.y
            )<
            24+f.radius
        ){

            me.score+=f.value;
            me.length+=f.value*.45;

            foods.splice(i,1);

            foods.push({
                x:Math.random()*WORLD,
                y:Math.random()*WORLD,
                radius:3+Math.random()*5,
                color:foodColors[
                    Math.floor(
                        Math.random()*foodColors.length
                    )
                ],
                value:1+Math.floor(Math.random()*4)
            });
        }
    }
}

function updateBots(){

    for(const bot of bots){

        if(!bot.body.length){

            for(let i=0;i<bot.length;i++){

                bot.body.push({
                    x:bot.x-Math.cos(bot.angle)*i*8,
                    y:bot.y-Math.sin(bot.angle)*i*8
                });
            }
        }

        bot.timer--;

        if(bot.timer<=0){

            bot.timer=35+Math.random()*100;

            const d=Math.hypot(
                me.x-bot.x,
                me.y-bot.y
            );

            if(d<500){

                /*
                    BOT PÜÜAB SINU KEHA VÄLTIDA
                    JA SINU PEA EEST PÕGENEDA.
                */

                bot.targetAngle=
                    Math.atan2(
                        bot.y-me.y,
                        bot.x-me.x
                    );

            }else{

                const food=
                    foods[
                        Math.floor(
                            Math.random()*foods.length
                        )
                    ];

                if(food){

                    bot.targetAngle=
                        Math.atan2(
                            food.y-bot.y,
                            food.x-bot.x
                        );
                }
            }
        }

        let diff=
            bot.targetAngle-bot.angle;

        while(diff>Math.PI)diff-=Math.PI*2;
        while(diff<-Math.PI)diff+=Math.PI*2;

        bot.angle+=diff*.055;

        bot.x+=Math.cos(bot.angle)*5.3;
        bot.y+=Math.sin(bot.angle)*5.3;

        if(bot.x<30||bot.x>WORLD-30){
            bot.angle=Math.PI-bot.angle;
            bot.targetAngle=bot.angle;
        }

        if(bot.y<30||bot.y>WORLD-30){
            bot.angle=-bot.angle;
            bot.targetAngle=bot.angle;
        }

        bot.x=Math.max(30,Math.min(WORLD-30,bot.x));
        bot.y=Math.max(30,Math.min(WORLD-30,bot.y));

        bot.body.unshift({
            x:bot.x,
            y:bot.y
        });

        while(
            bot.body.length>
            Math.floor(bot.length)
        ){
            bot.body.pop();
        }

        for(let i=foods.length-1;i>=0;i--){

            const f=foods[i];

            if(
                Math.hypot(
                    bot.x-f.x,
                    bot.y-f.y
                )<25
            ){

                bot.length+=f.value*.35;

                foods.splice(i,1);
            }
        }
    }
}

function checkBotCollisions(){

    /*
        KÕIGE TÄHTSAM OSA:

        BOTI PEA -> SINU KEHA
        = BOT SUREB
        = SINA SAAD KILL'I

        SINU PEA -> BOTI KEHA
        = SINA SURED
    */

    for(const bot of [...bots]){

        /* BOTI PEA MINU KEHA VASTU */

        for(let i=7;i<body.length;i++){

            const p=body[i];

            if(
                Math.hypot(
                    bot.x-p.x,
                    bot.y-p.y
                )<25
            ){

                killBot(bot);
                break;
            }
        }

        if(!bots.includes(bot))continue;

        /* MINU PEA BOTI KEHA VASTU */

        for(let i=7;i<bot.body.length;i++){

            const p=bot.body[i];

            if(
                Math.hypot(
                    me.x-p.x,
                    me.y-p.y
                )<25
            ){

                die(
                    bot.name+
                    " tabas sinu keha!"
                );

                return;
            }
        }
    }
}

function killBot(bot){

    const index=bots.indexOf(bot);

    if(index===-1)return;

    /*
        BOTI KEHA MUUTUB TOIDUKS.
    */

    for(
        let i=0;
        i<bot.body.length;
        i+=3
    ){

        const p=bot.body[i];

        foods.push({
            x:p.x,
            y:p.y,
            radius:4+Math.random()*3,
            color:bot.color,
            value:2
        });
    }

    bots.splice(index,1);

    /*
        KILL = 10 COINS
    */

    me.kills++;
    me.score+=10;
    me.coins+=10;
    me.length+=12;

    localStorage.setItem(
        "snakeCoins",
        me.coins
    );

    showKill();

    setTimeout(()=>{

        if(running&&!dead){

            spawnBot();
        }

    },1000);
}

function spawnBot(){

    const names=[
        "Viper",
        "Cobra",
        "Shadow",
        "Hunter",
        "Blaze",
        "Toxic",
        "Python",
        "Ghost"
    ];

    const colors=[
        "#4da6ff",
        "#ff5570",
        "#ffd84d",
        "#b86cff",
        "#ff8a3d",
        "#00e5d4"
    ];

    bots.push({

        id:"bot"+Date.now(),

        x:1000+Math.random()*18000,
        y:1000+Math.random()*18000,

        angle:Math.random()*Math.PI*2,

        targetAngle:Math.random()*Math.PI*2,

        length:25+Math.random()*60,

        color:colors[
            Math.floor(Math.random()*colors.length)
        ],

        skin:"blue",

        name:names[
            Math.floor(Math.random()*names.length)
        ],

        body:[],

        timer:0
    });
}

function sendState(){

    if(!connected)return;

    send({

        type:"state",

        x:me.x,
        y:me.y,

        angle:me.angle,

        length:me.length,

        score:me.score,

        kills:me.kills,

        name:playerName(),

        color:me.color,

        skin:me.skin
    });
}

function draw(){

    ctx.fillStyle="#071008";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    if(!running)return;

    const cameraX=me.x;
    const cameraY=me.y;

    ctx.save();

    ctx.translate(
        W/2-cameraX,
        H/2-cameraY
    );

    drawGrid();
    drawBorder();
    drawFood();

    for(const bot of bots){

        drawSnake(
            bot,
            bot.body
        );
    }

    drawRemotePlayers();

    drawSnake(
        {
            x:me.x,
            y:me.y,
            angle:me.angle,
            color:me.color,
            skin:me.skin,
            name:playerName()
        },
        body
    );

    ctx.restore();

    drawMinimap();
}

function drawGrid(){

    const grid=250;

    ctx.strokeStyle="rgba(99,255,120,.045)";
    ctx.lineWidth=1;

    const left=me.x-W-500;
    const right=me.x+W+500;
    const top=me.y-H-500;
    const bottom=me.y+H+500;

    for(
        let x=Math.floor(left/grid)*grid;
        x<right;
        x+=grid
    ){

        ctx.beginPath();
        ctx.moveTo(x,top);
        ctx.lineTo(x,bottom);
        ctx.stroke();
    }

    for(
        let y=Math.floor(top/grid)*grid;
        y<bottom;
        y+=grid
    ){

        ctx.beginPath();
        ctx.moveTo(left,y);
        ctx.lineTo(right,y);
        ctx.stroke();
    }
}

function drawBorder(){

    ctx.strokeStyle="#63ff78";
    ctx.lineWidth=15;

    ctx.shadowColor="#63ff78";
    ctx.shadowBlur=20;

    ctx.strokeRect(
        0,
        0,
        WORLD,
        WORLD
    );

    ctx.shadowBlur=0;
}

function drawFood(){

    for(const f of foods){

        if(
            Math.abs(f.x-me.x)>W+200 ||
            Math.abs(f.y-me.y)>H+200
        )continue;

        ctx.fillStyle=f.color;

        ctx.shadowColor=f.color;
        ctx.shadowBlur=8;

        ctx.beginPath();

        ctx.arc(
            f.x,
            f.y,
            f.radius,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.shadowBlur=0;
}

function drawSnake(snake,snakeBody){

    if(!snakeBody||!snakeBody.length)return;

    for(
        let i=snakeBody.length-1;
        i>=0;
        i--
    ){

        const p=snakeBody[i];

        const t=i/snakeBody.length;

        const radius=
            8+(1-t)*8;

        ctx.globalAlpha=
            .92-t*.2;

        ctx.fillStyle=snake.color;

        ctx.shadowColor=snake.color;

        ctx.shadowBlur=i<10?10:2;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            radius,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.globalAlpha=1;
    ctx.shadowBlur=0;

    drawHead(
        snake.x,
        snake.y,
        snake.color,
        snake.skin,
        snake.angle
    );

    drawName(
        snake.name||"Player",
        snake.x,
        snake.y-34
    );
}

function drawHead(x,y,color,skin,angle){

    ctx.save();

    ctx.translate(x,y);
    ctx.rotate(angle);

    ctx.fillStyle=color;

    ctx.shadowColor=color;
    ctx.shadowBlur=18;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        23,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;

    /*
        SKIN DETAIL
    */

    if(skin==="blue"){

        ctx.strokeStyle="#e4fbff";
        ctx.lineWidth=4;

        ctx.stroke();
    }

    if(skin==="red"){

        ctx.strokeStyle="#ffd4d9";
        ctx.lineWidth=3;

        ctx.beginPath();

        ctx.moveTo(-14,-12);
        ctx.lineTo(14,12);

        ctx.moveTo(14,-12);
        ctx.lineTo(-14,12);

        ctx.stroke();
    }

    if(skin==="purple"){

        ctx.fillStyle="#efc9ff";

        for(let i=0;i<6;i++){

            const a=i*Math.PI/3;

            ctx.beginPath();

            ctx.arc(
                Math.cos(a)*13,
                Math.sin(a)*13,
                3,
                0,
                Math.PI*2
            );

            ctx.fill();
        }
    }

    if(skin==="cyan"){

        ctx.strokeStyle="#d6fffb";
        ctx.lineWidth=4;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            14,
            0,
            Math.PI*2
        );

        ctx.stroke();
    }

    /*
        SILMAD
    */

    ctx.fillStyle="white";

    ctx.beginPath();

    ctx.ellipse(
        10,
        -7,
        7,
        6,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.ellipse(
        10,
        7,
        7,
        6,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#111";

    ctx.beginPath();

    ctx.arc(
        12,
        -7,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        12,
        7,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
        SUU
    */

    ctx.strokeStyle="#111";
    ctx.lineWidth=2.5;

    ctx.beginPath();

    ctx.arc(
        14,
        0,
        7,
        -.65,
        .65
    );

    ctx.stroke();

    /*
        KEEL
    */

    ctx.strokeStyle="#ff6070";
    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(20,0);
    ctx.lineTo(29,0);
    ctx.lineTo(33,-4);

    ctx.moveTo(29,0);
    ctx.lineTo(33,4);

    ctx.stroke();

    ctx.restore();
}

function drawName(name,x,y){

    ctx.save();

    ctx.textAlign="center";

    ctx.font="bold 12px Arial";

    ctx.fillStyle="white";

    ctx.shadowColor="black";
    ctx.shadowBlur=6;

    ctx.fillText(
        name,
        x,
        y
    );

    ctx.restore();
}

function drawRemotePlayers(){

    for(const id in others){

        if(id===me.id)continue;

        const p=others[id];

        if(!p||!p.alive)continue;

        /*
            KLIENT EHITAB KA TEISTE MÄNGIJATE
            ÜMBER TERVE SNAKE'I KEHA,
            MITTE ÜHTE PULKA.
        */

        const remoteBody=[];

        const length=Math.floor(
            Math.max(
                15,
                Math.min(
                    500,
                    p.length||25
                )
            )
        );

        for(let i=0;i<length;i++){

            remoteBody.push({

                x:
                    p.x-
                    Math.cos(p.angle||0)*
                    i*8,

                y:
                    p.y-
                    Math.sin(p.angle||0)*
                    i*8
            });
        }

        drawSnake(
            {
                x:p.x,
                y:p.y,
                angle:p.angle||0,
                color:p.color||"#4da6ff",
                skin:p.skin||"blue",
                name:p.name||"Player"
            },
            remoteBody
        );
    }
}

function drawMinimap(){

    const mini=document.getElementById("minimap");
    const m=mini.getContext("2d");
    const size=150;

    m.clearRect(
        0,
        0,
        size,
        size
    );

    m.fillStyle="#061007";

    m.fillRect(
        0,
        0,
        size,
        size
    );

    for(const bot of bots){

        m.fillStyle=bot.color;

        m.beginPath();

        m.arc(
            bot.x/WORLD*size,
            bot.y/WORLD*size,
            4,
            0,
            Math.PI*2
        );

        m.fill();
    }

    for(const id in others){

        const p=others[id];

        if(!p)continue;

        m.fillStyle=p.color||"#4da6ff";

        m.beginPath();

        m.arc(
            p.x/WORLD*size,
            p.y/WORLD*size,
            4,
            0,
            Math.PI*2
        );

        m.fill();
    }

    m.fillStyle=me.color;

    m.beginPath();

    m.arc(
        me.x/WORLD*size,
        me.y/WORLD*size,
        6,
        0,
        Math.PI*2
    );

    m.fill();

    m.strokeStyle="#63ff78";
    m.lineWidth=2;

    m.strokeRect(
        1,
        1,
        size-2,
        size-2
    );
}

function updateHUD(){

    document.getElementById("score").textContent=
        Math.floor(me.score);

    document.getElementById("kills").textContent=
        me.kills;

    document.getElementById("length").textContent=
        Math.floor(me.length);

    document.getElementById("coins").textContent=
        me.coins;

    updateLeaderboard();
}

function updateLeaderboard(){

    const list=[{

        name:playerName(),
        score:me.score,
        color:me.color
    }];

    for(const id in others){

        const p=others[id];

        if(!p)continue;

        list.push({

            name:p.name||"Player",
            score:p.score||0,
            color:p.color||"#fff"
        });
    }

    for(const bot of bots){

        list.push({

            name:bot.name,
            score:Math.floor(bot.length),
            color:bot.color
        });
    }

    list.sort(
        (a,b)=>b.score-a.score
    );

    const top=list.slice(0,3);

    document.getElementById("lbRows").innerHTML=
        top.map((p,i)=>`

        <div class="lbRow">

            <span style="color:${p.color}">
                ${i+1}. ${escapeHtml(p.name)}
            </span>

            <b>
                ${Math.floor(p.score)}
            </b>

        </div>

        `).join("");
}

let killTimeout;

function showKill(){

    const el=document.getElementById("killText");

    el.classList.add("show");

    clearTimeout(killTimeout);

    killTimeout=setTimeout(()=>{

        el.classList.remove("show");

    },900);
}

function die(reason){

    if(dead)return;

    dead=true;
    running=false;
    boosting=false;

    document.getElementById("deathReason").textContent=
        reason;

    document.getElementById("finalScore").textContent=
        Math.floor(me.score);

    document.getElementById("gameOver").style.display=
        "flex";
}

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);
}

connect();
loop();

</script>
