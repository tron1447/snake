<!DOCTYPE html>
<html lang="et">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>Worm Arena</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#07120a;
  font-family:Arial,sans-serif;
  touch-action:none;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}

#menu{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(
      circle at center,
      #1b5525,
      #07120a 70%
    );
}

.panel{
  width:min(430px,94vw);
  max-height:95vh;
  overflow:auto;
  padding:25px;
  border-radius:24px;
  background:rgba(7,14,8,.96);
  border:1px solid #396d40;
  color:white;
  text-align:center;
  box-shadow:0 25px 100px #000;
}

.logo{
  font-size:65px;
}

h1{
  color:#67ff7a;
  font-size:38px;
}

.sub{
  color:#829583;
  margin-bottom:20px;
}

input{
  width:100%;
  height:48px;
  margin:5px 0;
  border-radius:12px;
  border:1px solid #315c36;
  background:#111b12;
  color:white;
  text-align:center;
  font-size:16px;
}

button{
  width:100%;
  height:48px;
  margin-top:8px;
  border:0;
  border-radius:12px;
  font-weight:bold;
  cursor:pointer;
}

.green{
  background:#67ff7a;
  color:#061008;
}

.dark{
  background:#152217;
  color:white;
  border:1px solid #345e39;
}

#roomBox{
  display:none;
  margin-top:12px;
  padding:12px;
  background:#111c12;
  border-radius:12px;
}

#roomCode{
  font-size:32px;
  color:#67ff7a;
  font-weight:bold;
  letter-spacing:6px;
}

#error{
  min-height:24px;
  color:#ff6676;
  margin-top:8px;
}

#hud{
  display:none;
  position:fixed;
  z-index:20;
  top:10px;
  left:10px;
  gap:7px;
}

.stat{
  background:rgba(0,0,0,.72);
  color:white;
  border:1px solid #345e39;
  border-radius:10px;
  padding:7px 11px;
}

.stat small{
  display:block;
  color:#829583;
  font-size:9px;
}

#leaderboard{
  display:none;
  position:fixed;
  z-index:20;
  right:10px;
  top:10px;
  width:190px;
  background:rgba(0,0,0,.75);
  border:1px solid #345e39;
  border-radius:12px;
  color:white;
  padding:10px;
}

.lbtitle{
  color:#67ff7a;
  font-weight:bold;
  margin-bottom:5px;
}

.row{
  display:flex;
  justify-content:space-between;
  padding:4px;
  font-size:12px;
}

#minimap{
  display:none;
  position:fixed;
  z-index:20;
  right:10px;
  bottom:10px;
  width:160px;
  height:160px;
  background:#0d1c10;
  border:2px solid #67ff7a;
  border-radius:14px;
}

#mini{
  width:100%;
  height:100%;
}

#stickArea{
  display:none;
  position:fixed;
  z-index:30;
  left:20px;
  bottom:20px;
  width:130px;
  height:130px;
  border-radius:50%;
  background:rgba(103,255,122,.08);
  border:2px solid rgba(103,255,122,.35);
}

#stick{
  position:absolute;
  left:50%;
  top:50%;
  width:55px;
  height:55px;
  border-radius:50%;
  background:#67ff7a;
  transform:translate(-50%,-50%);
  border:3px solid white;
}

#boost{
  display:none;
  position:fixed;
  z-index:30;
  right:25px;
  bottom:28px;
  width:82px;
  height:82px;
  border-radius:50%;
  background:#0984bd;
  color:white;
  border:3px solid #c2f1ff;
  font-size:28px;
}

#dead{
  display:none;
  position:fixed;
  inset:0;
  z-index:200;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.8);
}

.deadBox{
  width:min(380px,90vw);
  background:#0b160c;
  color:white;
  border:1px solid #3a6940;
  border-radius:20px;
  padding:30px;
  text-align:center;
}

.deadBox h2{
  color:#ff596b;
  font-size:40px;
}

@media(max-width:800px){

  #stickArea,
  #boost{
    display:block;
  }

  #leaderboard{
    width:145px;
    font-size:11px;
  }

  #hud{
    flex-wrap:wrap;
    width:190px;
  }

}

</style>

</head>

<body>

<canvas id="game"></canvas>

<div id="menu">

<div class="panel">

<div class="logo">🪱</div>

<h1>WORM ARENA</h1>

<div class="sub">
Grow • Boost • Survive
</div>

<input
  id="name"
  maxlength="16"
  placeholder="Sinu nimi"
>

<button
  class="green"
  id="single"
>
🤖 SINGLEPLAYER
</button>

<button
  class="dark"
  id="create"
>
🏠 LOO ROOM
</button>

<input
  id="room"
  maxlength="5"
  placeholder="ROOM CODE"
>

<button
  class="dark"
  id="join"
>
🚪 LIITU ROOMI
</button>

<div id="roomBox">

<div>ROOM</div>

<div id="roomCode">
-----
</div>

<div id="players"></div>

<button
  class="green"
  id="start"
>
▶ ALUSTA MÄNGU
</button>

</div>

<div id="error"></div>

</div>

</div>

<div id="hud">

<div class="stat">
<small>SCORE</small>
<b id="score">0</b>
</div>

<div class="stat">
<small>KILLS</small>
<b id="kills">0</b>
</div>

<div class="stat">
<small>LENGTH</small>
<b id="length">35</b>
</div>

</div>

<div id="leaderboard">

<div class="lbtitle">
🏆 TOP 3
</div>

<div id="lb"></div>

</div>

<div id="minimap">

<canvas id="mini"></canvas>

</div>

<div id="stickArea">

<div id="stick"></div>

</div>

<button id="boost">
⚡
</button>

<div id="dead">

<div class="deadBox">

<h2>GAME OVER</h2>

<p id="deadReason">
Sinu uss sai otsa!
</p>

<br>

<p>
Score:
<b id="finalScore">
0
</b>
</p>

<p>
Kills:
<b id="finalKills">
0
</b>
</p>

<button
  class="green"
  onclick="location.reload()"
>
🔄 UUESTI
</button>

</div>

</div>

<script>

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

const mini =
document.getElementById("mini");

const mctx =
mini.getContext("2d");

let W = innerWidth;
let H = innerHeight;

canvas.width=W;
canvas.height=H;

mini.width=400;
mini.height=400;

addEventListener(
  "resize",
  ()=>{
    W=innerWidth;
    H=innerHeight;

    canvas.width=W;
    canvas.height=H;
  }
);

const WORLD=10000;

let running=false;
let dead=false;
let single=false;

const player={

  id:null,

  name:
    localStorage.getItem("name")
    || "Player",

  x:WORLD/2,
  y:WORLD/2,

  angle:0,
  targetAngle:0,

  length:35,
  score:0,
  kills:0,

  color:"#67ff7a",

  body:[]

};

document.getElementById(
  "name"
).value=player.name;

document.getElementById(
  "name"
).oninput=e=>{

  player.name=
    e.target.value
      .replace(/[<>]/g,"")
      .slice(0,16);

  localStorage.setItem(
    "name",
    player.name
  );

};

/* COLORS */

const colors=[
  "#67ff7a",
  "#4da3ff",
  "#ff5369",
  "#ffd84d",
  "#b66cff",
  "#ff8c42",
  "#00dfca",
  "#ff63c8"
];

function randomColor(){

  return colors[
    Math.floor(
      Math.random()*
      colors.length
    )
  ];

}

/* RESET */

function resetPlayer(){

  player.x=
    WORLD/2;

  player.y=
    WORLD/2;

  player.angle=
    Math.random()*
    Math.PI*2;

  player.targetAngle=
    player.angle;

  player.length=35;
  player.score=0;
  player.kills=0;

  player.body=[];

  for(
    let i=0;
    i<35;
    i++
  ){

    player.body.push({

      x:
        player.x-
        Math.cos(player.angle)*
        i*9,

      y:
        player.y-
        Math.sin(player.angle)*
        i*9

    });

  }

}

/* FOOD */

const food=[];

function newFood(){

  return {

    x:
      150+
      Math.random()*
      (WORLD-300),

    y:
      150+
      Math.random()*
      (WORLD-300),

    r:
      4+
      Math.random()*4,

    value:
      1+
      Math.floor(
        Math.random()*4
      ),

    color:
      colors[
        Math.floor(
          Math.random()*
          colors.length
        )
      ]

  };

}

for(
  let i=0;
  i<700;
  i++
){

  food.push(
    newFood()
  );

}

/* BOTS */

const bots=[];

const names=[
  "Shadow",
  "Viper",
  "Blaze",
  "Ghost",
  "Python",
  "Storm",
  "Ninja",
  "Cobra",
  "Turbo",
  "Venom",
  "Pixel",
  "Rocket"
];

function createBot(){

  const b={

    id:
      Math.random()
      .toString(36)
      .slice(2),

    name:
      names[
        Math.floor(
          Math.random()*
          names.length
        )
      ],

    x:
      500+
      Math.random()*
      (WORLD-1000),

    y:
      500+
      Math.random()*
      (WORLD-1000),

    angle:
      Math.random()*
      Math.PI*2,

    target:0,

    length:
      25+
      Math.random()*70,

    score:0,

    color:
      randomColor(),

    body:[],

    think:0

  };

  b.target=b.angle;

  for(
    let i=0;
    i<b.length;
    i++
  ){

    b.body.push({

      x:
        b.x-
        Math.cos(b.angle)*
        i*9,

      y:
        b.y-
        Math.sin(b.angle)*
        i*9

    });

  }

  return b;

}

function createBots(){

  bots.length=0;

  for(
    let i=0;
    i<15;
    i++
  ){

    bots.push(
      createBot()
    );

  }

}

/* CONTROL */

let mouseX=W/2;
let mouseY=H/2;

addEventListener(
  "mousemove",
  e=>{

    mouseX=e.clientX;
    mouseY=e.clientY;

  }
);

let boost=false;

addEventListener(
  "keydown",
  e=>{

    if(e.code==="Space"){
      boost=true;
    }

    if(
      e.key.toLowerCase()==="w" ||
      e.key==="ArrowUp"
    ){
      player.targetAngle=-Math.PI/2;
    }

    if(
      e.key.toLowerCase()==="s" ||
      e.key==="ArrowDown"
    ){
      player.targetAngle=Math.PI/2;
    }

    if(
      e.key.toLowerCase()==="a" ||
      e.key==="ArrowLeft"
    ){
      player.targetAngle=Math.PI;
    }

    if(
      e.key.toLowerCase()==="d" ||
      e.key==="ArrowRight"
    ){
      player.targetAngle=0;
    }

  }
);

addEventListener(
  "keyup",
  e=>{

    if(e.code==="Space"){
      boost=false;
    }

  }
);

canvas.addEventListener(
  "pointerdown",
  ()=>{
    if(innerWidth>800){
      boost=true;
    }
  }
);

canvas.addEventListener(
  "pointerup",
  ()=>{
    boost=false;
  }
);

/* MOBILE JOYSTICK */

const stickArea=
document.getElementById(
  "stickArea"
);

const stick=
document.getElementById(
  "stick"
);

let joystick=false;

function moveStick(x,y){

  const r=
    stickArea.getBoundingClientRect();

  const cx=
    r.left+r.width/2;

  const cy=
    r.top+r.height/2;

  let dx=x-cx;
  let dy=y-cy;

  const max=50;

  const d=
    Math.hypot(dx,dy);

  if(d>max){

    dx=dx/d*max;
    dy=dy/d*max;

  }

  stick.style.left=
    `calc(50% + ${dx}px)`;

  stick.style.top=
    `calc(50% + ${dy}px)`;

  if(d>7){

    player.targetAngle=
      Math.atan2(dy,dx);

  }

}

stickArea.addEventListener(
  "pointerdown",
  e=>{

    joystick=true;

    stickArea.setPointerCapture(
      e.pointerId
    );

    moveStick(
      e.clientX,
      e.clientY
    );

  }
);

stickArea.addEventListener(
  "pointermove",
  e=>{

    if(joystick){

      moveStick(
        e.clientX,
        e.clientY
      );

    }

  }
);

function stopJoystick(){

  joystick=false;

  stick.style.left="50%";
  stick.style.top="50%";

}

stickArea.addEventListener(
  "pointerup",
  stopJoystick
);

stickArea.addEventListener(
  "pointercancel",
  stopJoystick
);

const boostButton=
document.getElementById(
  "boost"
);

boostButton.addEventListener(
  "pointerdown",
  e=>{
    e.preventDefault();
    boost=true;
  }
);

boostButton.addEventListener(
  "pointerup",
  ()=>{
    boost=false;
  }
);

boostButton.addEventListener(
  "pointercancel",
  ()=>{
    boost=false;
  }
);

/* PLAYER UPDATE */

function updatePlayer(){

  let d=
    player.targetAngle-
    player.angle;

  while(d>Math.PI)
    d-=Math.PI*2;

  while(d<-Math.PI)
    d+=Math.PI*2;

  player.angle+=d*.16;

  const speed=
    boost && player.length>38
      ? 10
      : 6.5;

  if(
    boost &&
    player.length>38
  ){

    player.length-=.045;

  }

  player.x+=
    Math.cos(player.angle)*
    speed;

  player.y+=
    Math.sin(player.angle)*
    speed;

  if(
    player.x<80 ||
    player.x>WORLD-80 ||
    player.y<80 ||
    player.y>WORLD-80
  ){

    die(
      "Läksid vastu arena piiri!"
    );

    return;

  }

  player.body.unshift({
    x:player.x,
    y:player.y
  });

  while(
    player.body.length<
    Math.floor(player.length)
  ){

    const last=
      player.body[
        player.body.length-1
      ];

    player.body.push({
      x:last.x,
      y:last.y
    });

  }

  while(
    player.body.length>
    Math.floor(player.length)
  ){

    player.body.pop();

  }

  eatFood(player);

}

/* FOOD */

function eatFood(snake){

  for(
    let i=food.length-1;
    i>=0;
    i--
  ){

    const f=food[i];

    if(
      Math.hypot(
        snake.x-f.x,
        snake.y-f.y
      )<27
    ){

      snake.score+=f.value;
      snake.length+=f.value*.7;

      food.splice(i,1);
      food.push(newFood());

    }

  }

}

/* BOTS */

function updateBots(){

  for(
    const b of bots
  ){

    b.think--;

    if(b.think<=0){

      b.think=
        25+
        Math.random()*70;

      let nearest=null;
      let best=Infinity;

      for(
        let i=0;
        i<food.length;
        i+=5
      ){

        const f=food[i];

        const d=
          Math.hypot(
            b.x-f.x,
            b.y-f.y
          );

        if(d<best){

          best=d;
          nearest=f;

        }

      }

      if(nearest){

        b.target=
          Math.atan2(
            nearest.y-b.y,
            nearest.x-b.x
          );

      }

      if(
        Math.random()<.15
      ){

        b.target+=
          (Math.random()-.5)*2;

      }

    }

    let d=
      b.target-b.angle;

    while(d>Math.PI)
      d-=Math.PI*2;

    while(d<-Math.PI)
      d+=Math.PI*2;

    b.angle+=d*.045;

    b.x+=
      Math.cos(b.angle)*5.2;

    b.y+=
      Math.sin(b.angle)*5.2;

    if(
      b.x<100 ||
      b.x>WORLD-100
    ){

      b.target=
        Math.PI-b.target;

    }

    if(
      b.y<100 ||
      b.y>WORLD-100
    ){

      b.target=
        -b.target;

    }

    b.body.unshift({
      x:b.x,
      y:b.y
    });

    while(
      b.body.length<
      Math.floor(b.length)
    ){

      const last=
        b.body[
          b.body.length-1
        ];

      b.body.push({
        x:last.x,
        y:last.y
      });

    }

    while(
      b.body.length>
      Math.floor(b.length)
    ){

      b.body.pop();

    }

    eatFood(b);

  }

}

/* COMBAT */

function collisions(){

  // player head against bot body

  for(
    let bi=bots.length-1;
    bi>=0;
    bi--
  ){

    const b=bots[bi];

    for(
      let i=5;
      i<b.body.length;
      i+=2
    ){

      if(
        Math.hypot(
          player.x-b.body[i].x,
          player.y-b.body[i].y
        )<25
      ){

        killBot(bi);
        break;

      }

    }

  }

  // bot heads against player body

  for(
    let bi=bots.length-1;
    bi>=0;
    bi--
  ){

    const b=bots[bi];

    for(
      let i=6;
      i<player.body.length;
      i+=2
    ){

      if(
        Math.hypot(
          b.x-player.body[i].x,
          b.y-player.body[i].y
        )<25
      ){

        dropSnake(b);

        bots.splice(bi,1);

        player.kills++;
        player.score+=100;
        player.length+=12;

        break;

      }

    }

  }

}

function killBot(index){

  const b=bots[index];

  if(!b) return;

  dropSnake(b);

  bots.splice(index,1);

  player.kills++;
  player.score+=100;
  player.length+=12;

  setTimeout(
    ()=>{
      if(running){
        bots.push(createBot());
      }
    },
    500
  );

}

function dropSnake(snake){

  for(
    let i=0;
    i<snake.body.length;
    i+=3
  ){

    food.push({

      x:snake.body[i].x,
      y:snake.body[i].y,

      r:7,

      value:3,

      color:snake.color

    });

  }

}

/* DRAW WORM */

function drawWorm(snake){

  if(
    !snake.body ||
    snake.body.length===0
  ){
    return;
  }

  /*
    BODY
  */

  for(
    let i=snake.body.length-1;
    i>=0;
    i--
  ){

    const p=snake.body[i];

    const t=
      i/snake.body.length;

    const radius=
      15-
      t*5;

    ctx.fillStyle=
      snake.color;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      Math.max(8,radius),
      0,
      Math.PI*2
    );

    ctx.fill();

  }

  /*
    HEAD
  */

  ctx.save();

  ctx.translate(
    snake.x,
    snake.y
  );

  ctx.rotate(
    snake.angle
  );

  ctx.fillStyle=
    snake.color;

  ctx.beginPath();

  ctx.ellipse(
    0,
    0,
    24,
    22,
    0,
    0,
    Math.PI*2
  );

  ctx.fill();

  /*
    eyes
  */

  ctx.fillStyle="white";

  ctx.beginPath();

  ctx.arc(
    10,
    -8,
    7,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.arc(
    10,
    8,
    7,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle="#111";

  ctx.beginPath();

  ctx.arc(
    13,
    -8,
    3,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.arc(
    13,
    8,
    3,
    0,
    Math.PI*2
  );

  ctx.fill();

  /*
    smile
  */

  ctx.strokeStyle=
    "rgba(0,0,0,.45)";

  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.arc(
    7,
    0,
    8,
    .2,
    1.1
  );

  ctx.stroke();

  ctx.restore();

  /*
    NAME
  */

  ctx.textAlign="center";

  ctx.font=
    "bold 14px Arial";

  ctx.strokeStyle=
    "rgba(0,0,0,.8)";

  ctx.lineWidth=4;

  ctx.strokeText(
    snake.name || "Player",
    snake.x,
    snake.y-34
  );

  ctx.fillStyle="white";

  ctx.fillText(
    snake.name || "Player",
    snake.x,
    snake.y-34
  );

}

/* CAMERA */

function draw(){

  ctx.fillStyle="#07120a";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

  if(!running) return;

  ctx.save();

  ctx.translate(
    W/2-player.x,
    H/2-player.y
  );

  /*
    WORLD
  */

  ctx.fillStyle="#102316";

  ctx.fillRect(
    0,
    0,
    WORLD,
    WORLD
  );

  /*
    GRID
  */

  ctx.strokeStyle=
    "rgba(255,255,255,.035)";

  const grid=120;

  const startX=
    Math.floor(
      (player.x-W/2)/grid
    )*grid;

  const endX=
    Math.ceil(
      (player.x+W/2)/grid
    )*grid;

  for(
    let x=startX;
    x<=endX;
    x+=grid
  ){

    ctx.beginPath();

    ctx.moveTo(
      x,
      player.y-H
    );

    ctx.lineTo(
      x,
      player.y+H
    );

    ctx.stroke();

  }

  const startY=
    Math.floor(
      (player.y-H/2)/grid
    )*grid;

  const endY=
    Math.ceil(
      (player.y+H/2)/grid
    )*grid;

  for(
    let y=startY;
    y<=endY;
    y+=grid
  ){

    ctx.beginPath();

    ctx.moveTo(
      player.x-W,
      y
    );

    ctx.lineTo(
      player.x+W,
      y
    );

    ctx.stroke();

  }

  /*
    FOOD
  */

  for(
    const f of food
  ){

    if(
      Math.abs(f.x-player.x)>W/2+100 ||
      Math.abs(f.y-player.y)>H/2+100
    ){
      continue;
    }

    ctx.shadowBlur=10;
    ctx.shadowColor=f.color;

    ctx.fillStyle=f.color;

    ctx.beginPath();

    ctx.arc(
      f.x,
      f.y,
      f.r,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;

  }

  /*
    BOTS
  */

  for(
    const b of bots
  ){

    drawWorm(b);

  }

  /*
    PLAYER
  */

  drawWorm(player);

  ctx.restore();

  drawMinimap();

}

/* MINIMAP */

function miniDot(x,y,color,r){

  mctx.fillStyle=color;

  mctx.beginPath();

  mctx.arc(
    x/WORLD*400,
    y/WORLD*400,
    r,
    0,
    Math.PI*2
  );

  mctx.fill();

}

function drawMinimap(){

  mctx.fillStyle="#0c1c10";

  mctx.fillRect(
    0,
    0,
    400,
    400
  );

  for(
    const b of bots
  ){

    miniDot(
      b.x,
      b.y,
      b.color,
      5
    );

  }

  miniDot(
    player.x,
    player.y,
    player.color,
    8
  );

}

/* LEADERBOARD */

function updateLeaderboard(){

  const list=[

    {
      name:player.name,
      score:player.score,
      color:player.color
    }

  ];

  for(
    const b of bots
  ){

    list.push({
      name:b.name,
      score:b.score,
      color:b.color
    });

  }

  list.sort(
    (a,b)=>
      b.score-a.score
  );

  const lb=
    document.getElementById("lb");

  lb.innerHTML="";

  list
    .slice(0,3)
    .forEach(
      (x,i)=>{

        const div=
          document.createElement("div");

        div.className="row";

        div.innerHTML=`

          <span style="color:${x.color}">
            ${i+1}. ${x.name}
          </span>

          <b>
            ${Math.floor(x.score)}
          </b>

        `;

        lb.appendChild(div);

      }
    );

}

/* HUD */

function hud(){

  document.getElementById(
    "score"
  ).textContent=
    Math.floor(player.score);

  document.getElementById(
    "kills"
  ).textContent=
    player.kills;

  document.getElementById(
    "length"
  ).textContent=
    Math.floor(player.length);

  updateLeaderboard();

}

/* DEATH */

function die(reason){

  if(dead) return;

  dead=true;
  running=false;

  document.getElementById(
    "deadReason"
  ).textContent=reason;

  document.getElementById(
    "finalScore"
  ).textContent=
    Math.floor(player.score);

  document.getElementById(
    "finalKills"
  ).textContent=
    player.kills;

  document.getElementById(
    "dead"
  ).style.display="flex";

}

/* START */

function startGame(){

  resetPlayer();

  dead=false;
  running=true;

  document.getElementById(
    "menu"
  ).style.display="none";

  document.getElementById(
    "hud"
  ).style.display="flex";

  document.getElementById(
    "leaderboard"
  ).style.display="block";

  document.getElementById(
    "minimap"
  ).style.display="block";

}

document.getElementById(
  "single"
).onclick=()=>{

  single=true;

  createBots();

  startGame();

};

/* MULTIPLAYER */

let ws=null;
let remote=new Map();
let myId=null;

function connect(){

  const protocol=
    location.protocol==="https:"
      ? "wss:"
      : "ws:";

  ws=
    new WebSocket(
      protocol+
      "//"+
      location.host
    );

  ws.onopen=()=>{

    console.log(
      "Connected"
    );

  };

  ws.onmessage=e=>{

    let data;

    try{
      data=JSON.parse(e.data);
    }catch{
      return;
    }

    if(
      data.type==="connected"
    ){

      myId=data.id;
      player.id=myId;

    }

    if(
      data.type==="roomCreated" ||
      data.type==="roomJoined"
    ){

      myId=data.id;

      player.id=myId;

      document.getElementById(
        "roomBox"
      ).style.display="block";

      document.getElementById(
        "roomCode"
      ).textContent=
        data.code;

    }

    if(
      data.type==="gameStart"
    ){

      single=false;

      startGame();

    }

    if(
      data.type==="state"
    ){

      remote.clear();

      for(
        const p of data.players
      ){

        if(
          p.id===myId
        ){

          if(!single){

            player.x=
              lerp(
                player.x,
                p.x,
                .35
              );

            player.y=
              lerp(
                player.y,
                p.y,
                .35
              );

            player.angle=
              lerpAngle(
                player.angle,
                p.angle,
                .35
              );

            player.score=
              p.score;

            player.kills=
              p.kills;

            player.length=
              p.length;

          }

        }else{

          remote.set(
            p.id,
            p
          );

        }

      }

      updateRoomPlayers(
        data.players
      );

    }

    if(
      data.type==="error"
    ){

      document.getElementById(
        "error"
      ).textContent=
        data.message;

    }

  };

  ws.onerror=()=>{

    document.getElementById(
      "error"
    ).textContent=
      "Serveriga ei saanud ühendust.";

  };

}

function lerp(a,b,t){

  return a+(b-a)*t;

}

function lerpAngle(a,b,t){

  let d=b-a;

  while(d>Math.PI)
    d-=Math.PI*2;

  while(d<-Math.PI)
    d+=Math.PI*2;

  return a+d*t;

}

/* ROOM */

document.getElementById(
  "create"
).onclick=()=>{

  if(
    !ws ||
    ws.readyState!==WebSocket.OPEN
  ){

    document.getElementById(
      "error"
    ).textContent=
      "Server pole ühendatud.";

    return;

  }

  ws.send(
    JSON.stringify({

      type:"createRoom",

      name:player.name,

      color:player.color

    })
  );

};

document.getElementById(
  "join"
).onclick=()=>{

  const code=
    document.getElementById(
      "room"
    ).value
    .trim()
    .toUpperCase();

  if(!code){

    document.getElementById(
      "error"
    ).textContent=
      "Sisesta roomi kood.";

    return;

  }

  ws.send(
    JSON.stringify({

      type:"joinRoom",

      code,

      name:player.name,

      color:player.color

    })
  );

};

document.getElementById(
  "start"
).onclick=()=>{

  if(ws){

    ws.send(
      JSON.stringify({
        type:"startRoom"
      })
    );

  }

};

function updateRoomPlayers(players){

  const box=
    document.getElementById(
      "players"
    );

  box.innerHTML="";

  for(
    const p of players
  ){

    const div=
      document.createElement(
        "div"
      );

    div.textContent=
      p.name;

    div.style.color=
      p.color;

    box.appendChild(div);

  }

}

/* MULTIPLAYER INPUT */

setInterval(
  ()=>{

    if(
      ws &&
      ws.readyState===WebSocket.OPEN &&
      running &&
      !single
    ){

      ws.send(
        JSON.stringify({

          type:"input",

          angle:
            player.targetAngle,

          boost

        })
      );

    }

  },
  50
);

/* GAME LOOP */

function loop(){

  if(running){

    if(single){

      const dx=
        mouseX-W/2;

      const dy=
        mouseY-H/2;

      if(
        Math.hypot(dx,dy)>10 &&
        innerWidth>800
      ){

        player.targetAngle=
          Math.atan2(dy,dx);

      }

      updatePlayer();
      updateBots();
      collisions();

    }else{

      /*
        Multiplayer movement prediction
      */

      let d=
        player.targetAngle-
        player.angle;

      while(d>Math.PI)
        d-=Math.PI*2;

      while(d<-Math.PI)
        d+=Math.PI*2;

      player.angle+=d*.16;

      const speed=
        boost &&
        player.length>38
          ? 10
          : 6.5;

      if(
        boost &&
        player.length>38
      ){

        player.length-=.045;

      }

      player.x+=
        Math.cos(player.angle)*
        speed;

      player.y+=
        Math.sin(player.angle)*
        speed;

      player.body.unshift({
        x:player.x,
        y:player.y
      });

      while(
        player.body.length<
        Math.floor(player.length)
      ){

        const last=
          player.body[
            player.body.length-1
          ];

        player.body.push({
          x:last.x,
          y:last.y
        });

      }

      while(
        player.body.length>
        Math.floor(player.length)
      ){

        player.body.pop();

      }

      /*
        Remote worms
      */

      for(
        const p of remote.values()
      ){

        if(
          !p.body ||
          p.body.length===0
        ){
          continue;
        }

      }

    }

    hud();

  }

  draw();

  requestAnimationFrame(loop);

}

resetPlayer();
connect();
requestAnimationFrame(loop);

</script>
