<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Snake Online 🐍</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020603;
    color:white;
    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    inset:0;
    width:100vw;
    height:100vh;
    display:block;
    background:#06120a;
}

#ui{
    position:fixed;
    inset:0;
    pointer-events:none;
}

.top{
    position:absolute;
    top:12px;
    left:50%;
    transform:translateX(-50%);
    display:flex;
    gap:8px;
    z-index:5;
}

.box{
    background:rgba(5,15,8,.82);
    border:1px solid rgba(80,255,130,.35);
    backdrop-filter:blur(8px);
    border-radius:14px;
    padding:8px 13px;
    min-width:85px;
    text-align:center;
    box-shadow:0 5px 20px rgba(0,0,0,.35);
}

.box small{
    display:block;
    color:#8ca893;
    font-size:11px;
}

.box b{
    font-size:18px;
}

#menu{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(
            circle at center,
            rgba(28,100,48,.35),
            rgba(0,0,0,.96)
        );
    z-index:20;
}

.menuCard{
    width:min(92vw,430px);
    background:rgba(8,22,12,.97);
    border:1px solid #2d7344;
    border-radius:24px;
    padding:25px;
    text-align:center;
    box-shadow:0 20px 80px rgba(0,0,0,.65);
}

h1{
    font-size:clamp(42px,11vw,68px);
    margin:0 0 18px;
    color:#63ff92;
    text-shadow:
        0 0 15px #38ff70,
        0 0 40px rgba(56,255,112,.5);
}

input,select{
    width:100%;
    padding:15px;
    margin:6px 0;
    border-radius:13px;
    border:1px solid #285c39;
    outline:none;
    background:#061009;
    color:white;
    font-size:18px;
    text-align:center;
}

button{
    width:100%;
    border:0;
    border-radius:13px;
    padding:15px;
    margin-top:8px;
    font-size:18px;
    font-weight:bold;
}

.create{
    background:#39df70;
    color:#031008;
}

.join{
    background:#398fff;
    color:white;
}

#connection{
    margin-top:12px;
    color:#aaa;
    font-size:14px;
}

#room{
    display:none;
}

.roomCode{
    color:#65ff98;
    font-size:32px;
    font-weight:bold;
    letter-spacing:6px;
}

#players{
    margin-top:8px;
    color:#aaa;
}

#message{
    margin-top:8px;
    color:#b8c8bb;
}

.controls{
    position:absolute;
    left:20px;
    bottom:25px;
    width:170px;
    height:170px;
    pointer-events:auto;
}

.control{
    position:absolute;
    width:58px;
    height:58px;
    border-radius:18px;
    border:1px solid rgba(120,255,160,.25);
    background:rgba(16,48,26,.78);
    color:white;
    font-size:27px;
    display:flex;
    align-items:center;
    justify-content:center;
    user-select:none;
    box-shadow:0 5px 20px rgba(0,0,0,.3);
}

.control:active{
    background:rgba(45,120,65,.9);
    transform:scale(.92);
}

.up{
    top:0;
    left:56px;
}

.left{
    top:56px;
    left:0;
}

.down{
    top:112px;
    left:56px;
}

.right{
    top:56px;
    left:112px;
}

#boost{
    position:absolute;
    right:20px;
    bottom:35px;
    width:85px;
    height:85px;
    border-radius:50%;
    pointer-events:auto;
    background:rgba(40,120,255,.75);
    border:2px solid #68b1ff;
    color:white;
    font-size:28px;
    box-shadow:0 0 25px rgba(50,140,255,.45);
}

#boost:active{
    transform:scale(.9);
}

#death{
    display:none;
    position:fixed;
    inset:0;
    z-index:30;
    background:rgba(0,0,0,.7);
    align-items:center;
    justify-content:center;
    text-align:center;
}

.deathCard{
    background:#101811;
    border:1px solid #3c7149;
    padding:30px;
    border-radius:22px;
}

.deathCard h2{
    font-size:38px;
    margin:0 0 10px;
}

#loading{
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:50;
    background:#020603;
    font-size:25px;
}

@media(min-width:800px){

    .controls{
        opacity:.65;
    }

    #boost{
        opacity:.65;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="loading">
    🐍 Ühendan serveriga...
</div>


<div id="menu">

<div class="menuCard">

<h1>🐍</h1>

<h2> SNAKE ONLINE</h2>

<input
    id="name"
    maxlength="12"
    placeholder="Sinu nimi">

<select id="mode">

<option value="classic">
🍎 Classic
</option>

<option value="battle">
⚔️ Battle
</option>

<option value="power">
⚡ Power Rush
</option>

<option value="maze">
🧱 Maze
</option>

<option value="last">
💀 Last Snake
</option>

</select>

<button
    class="create"
    onclick="createRoom()">
    🟢 LOO TUBA
</button>

<input
    id="roomInput"
    maxlength="6"
    placeholder="ROOM CODE">

<button
    class="join"
    onclick="joinRoom()">
    🔵 LIITU TUPA
</button>

<div id="connection">
🟡 Ühendan...
</div>

</div>

</div>


<div id="ui">

<div class="top">

<div class="box">
<small>SCORE</small>
<b id="score">0</b>
</div>

<div class="box">
<small>🪙</small>
<b id="coins">0</b>
</div>

<div class="box">
<small>🏆</small>
<b id="playersCount">0</b>
</div>

</div>


<div
    id="room"
    class="box"
    style="
        position:absolute;
        top:75px;
        left:50%;
        transform:translateX(-50%);
        text-align:center;
    ">

<div style="font-size:10px;color:#8ca893">
ROOM
</div>

<div
    id="roomCode"
    class="roomCode">
------
</div>

<div id="players">
</div>

<div id="message">
</div>

</div>


<div class="controls">

<div
    class="control up"
    ontouchstart="control('up')"
    onclick="control('up')">
⬆️
</div>

<div
    class="control left"
    ontouchstart="control('left')"
    onclick="control('left')">
⬅️
</div>

<div
    class="control down"
    ontouchstart="control('down')"
    onclick="control('down')">
⬇️
</div>

<div
    class="control right"
    ontouchstart="control('right')"
    onclick="control('right')">
➡️
</div>

</div>


<button
    id="boost"
    ontouchstart="boost()"
    onclick="boost()">
⚡
</button>

</div>


<div id="death">

<div class="deathCard">

<h2>💀 OOPS!</h2>

<p>Su uss sai pihta.</p>

<p id="respawnText">
Respawn...
</p>

</div>

</div>


<script>

const SERVER_URL =
"wss://snake-riu3.onrender.com";


/* ================================
   CANVAS
================================ */

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){

W=innerWidth;
H=innerHeight;

const dpr=
Math.min(devicePixelRatio||1,2);

canvas.width=
Math.floor(W*dpr);

canvas.height=
Math.floor(H*dpr);

canvas.style.width=W+"px";
canvas.style.height=H+"px";

ctx.setTransform(
dpr,0,0,dpr,0,0
);

}

addEventListener(
"resize",
resize
);

resize();


/* ================================
   MÄNG
================================ */

let socket=null;
let myId=null;
let roomCode=null;

let state={
players:{},
food:[],
powerups:[],
walls:[],
width:100,
height:100
};

let boostLocal=false;


/* ================================
   SERVER
================================ */

function connect(){

socket=
new WebSocket(
SERVER_URL
);

socket.onopen=()=>{

document.getElementById(
"loading"
).style.display="none";

document.getElementById(
"connection"
).textContent=
"🟢 Serveriga ühendatud!";

};

socket.onmessage=e=>{

let data;

try{
data=JSON.parse(e.data);
}catch{
return;
}

if(data.type==="connected"){

myId=data.id;

}

if(data.type==="roomCreated"){

roomCode=data.room;

showRoom();

}

if(data.type==="roomJoined"){

roomCode=data.room;

showRoom();

}

if(data.type==="state"){

state=data.state;

updateUI();

draw();

}

if(data.type==="start"){

document.getElementById(
"message"
).textContent=
"🔥 MÄNG ALGAS!";

}

if(data.type==="winner"){

alert(
"🏆 Võitja: "+
(data.winner?.name||"???")
);

}

if(data.type==="error"){

alert(data.message);

}

};

socket.onerror=()=>{

document.getElementById(
"connection"
).textContent=
"🔴 Serveriga ühendus ebaõnnestus";

};

socket.onclose=()=>{

document.getElementById(
"connection"
).textContent=
"🔴 Ühendus katkes";

};

}


/* ================================
   SAADA
================================ */

function send(data){

if(
socket &&
socket.readyState===WebSocket.OPEN
){

socket.send(
JSON.stringify(data)
);

}

}


/* ================================
   CREATE
================================ */

function createRoom(){

const name=
document.getElementById(
"name"
).value.trim();

const mode=
document.getElementById(
"mode"
).value;

if(!name){

alert("Kirjuta nimi!");

return;

}

send({
type:"createRoom",
name,
mode
});

}


/* ================================
   JOIN
================================ */

function joinRoom(){

const name=
document.getElementById(
"name"
).value.trim();

const room=
document.getElementById(
"roomInput"
).value
.trim()
.toUpperCase();

if(!name){

alert("Kirjuta nimi!");

return;

}

if(room.length!==6){

alert(
"Room Code peab olema 6 märki!"
);

return;

}

send({
type:"joinRoom",
name,
room
});

}


/* ================================
   ROOM
================================ */

function showRoom(){

document.getElementById(
"menu"
).style.display="none";

document.getElementById(
"room"
).style.display="block";

document.getElementById(
"roomCode"
).textContent=
roomCode;

}


/* ================================
   CONTROLS
================================ */

function control(direction){

send({
type:"direction",
direction
});

}


/* ================================
   BOOST
================================ */

function boost(){

boostLocal=true;

setTimeout(()=>{
boostLocal=false;
},500);

send({
type:"boost"
});

}


/* ================================
   KEYBOARD
================================ */

addEventListener(
"keydown",
e=>{

const map={

ArrowUp:"up",
w:"up",
W:"up",

ArrowDown:"down",
s:"down",
S:"down",

ArrowLeft:"left",
a:"left",
A:"left",

ArrowRight:"right",
d:"right",
D:"right"

};

if(map[e.key]){

e.preventDefault();

control(
map[e.key]
);

}

if(e.code==="Space"){

boost();

}

}
);


/* ================================
   UI
================================ */

function updateUI(){

const me=
state.players?.[myId];

if(me){

document.getElementById(
"score"
).textContent=
me.score;

document.getElementById(
"coins"
).textContent=
me.coins;

}

const players=
Object.values(
state.players||{}
);

document.getElementById(
"playersCount"
).textContent=
players.length;

document.getElementById(
"players"
).textContent=
players
.map(p=>
"🐍 "+
p.name+
" "+p.score
)
.join(" • ");

if(
me &&
!me.alive
){

document.getElementById(
"death"
).style.display=
"flex";

document.getElementById(
"respawnText"
).textContent=
me.respawnTimer>0
? "Respawn..."
: "Väljas";

}else{

document.getElementById(
"death"
).style.display=
"none";

}

}


/* ================================
   KAAMERA
================================ */

function getCamera(){

const me=
state.players?.[myId];

if(
!me ||
!me.snake ||
!me.snake.length
){

return {
x:0,
y:0,
zoom:1
};

}

const head=
me.snake[0];

const worldW=
state.width*20;

const worldH=
state.height*20;


/*
    Kaamera sihtpunkt
    on sinu pea.
*/

let cameraX=
head.x*20 -
W/2;

let cameraY=
head.y*20 -
H/2;


/*
    Kaamera ei lähe maailmast välja.
*/

cameraX=
Math.max(
0,
Math.min(
cameraX,
worldW-W
)
);

cameraY=
Math.max(
0,
Math.min(
cameraY,
worldH-H
)
);


/*
    Kui mängija liigub,
    kaamera liigub sujuvalt.
*/

if(
!window.cam
){

window.cam={
x:cameraX,
y:cameraY
};

}

window.cam.x +=
(cameraX-window.cam.x)*0.12;

window.cam.y +=
(cameraY-window.cam.y)*0.12;


/*
    Suurem uss =
    natuke rohkem välja zoom.
*/

const length=
me.snake.length;

let zoom=1;

if(length>15)
zoom=.92;

if(length>30)
zoom=.84;

if(length>50)
zoom=.76;

return {
x:window.cam.x,
y:window.cam.y,
zoom
};

}


/* ================================
   DRAW
================================ */

function draw(){

ctx.clearRect(
0,
0,
W,
H
);

const camera=
getCamera();

ctx.save();

ctx.translate(
-W*(camera.zoom-1)/2,
-H*(camera.zoom-1)/2
);

ctx.scale(
camera.zoom,
camera.zoom
);

ctx.translate(
-camera.x,
-camera.y
);


/*
    MAAILMA SUURUS
*/

const worldW=
state.width*20;

const worldH=
state.height*20;


/*
    TAUST
*/

ctx.fillStyle=
"#07150c";

ctx.fillRect(
0,
0,
worldW,
worldH
);


/*
    GRIDI
*/

ctx.strokeStyle=
"rgba(80,220,120,.07)";

ctx.lineWidth=1;

for(
let x=0;
x<=state.width;
x++
){

ctx.beginPath();

ctx.moveTo(
x*20,
0
);

ctx.lineTo(
x*20,
worldH
);

ctx.stroke();

}

for(
let y=0;
y<=state.height;
y++
){

ctx.beginPath();

ctx.moveTo(
0,
y*20
);

ctx.lineTo(
worldW,
y*20
);

ctx.stroke();

}


/*
    ÄÄR
*/

ctx.strokeStyle=
"#38df70";

ctx.lineWidth=8;

ctx.strokeRect(
0,
0,
worldW,
worldH
);


/*
    WALLS
*/

(state.walls||[]).forEach(
wall=>{

ctx.fillStyle=
"#39453d";

ctx.fillRect(
wall.x*20,
wall.y*20,
20,
20
);

}
);


/*
    FOOD
*/

(state.food||[]).forEach(
food=>{

ctx.shadowColor=
"#ff3155";

ctx.shadowBlur=18;

ctx.fillStyle=
"#ff3155";

ctx.beginPath();

ctx.arc(
food.x*20+10,
food.y*20+10,
6,
0,
Math.PI*2
);

ctx.fill();

ctx.shadowBlur=0;

}
);


/*
    POWERUPS
*/

const powerColors={
speed:"#4ba8ff",
shield:"#b25cff",
coin:"#ffd43b"
};

const powerIcons={
speed:"⚡",
shield:"🛡️",
coin:"🪙"
};

(state.powerups||[]).forEach(
power=>{

ctx.fillStyle=
powerColors[power.type]||
"white";

ctx.shadowColor=
ctx.fillStyle;

ctx.shadowBlur=12;

ctx.beginPath();

ctx.arc(
power.x*20+10,
power.y*20+10,
8,
0,
Math.PI*2
);

ctx.fill();

ctx.shadowBlur=0;

ctx.font="13px Arial";

ctx.textAlign="center";

ctx.textBaseline="middle";

ctx.fillStyle="#000";

ctx.fillText(
powerIcons[power.type],
power.x*20+10,
power.y*20+10
);

}
);


/*
    SNAKES
*/

Object.values(
state.players||{}
).forEach(
player=>{

if(!player.snake)
return;

player.snake.forEach(
(part,index)=>{

let color=
player.color;

if(player.id===myId){

color="#55ff83";

if(boostLocal){
color="#63aaff";
}

}

ctx.fillStyle=color;

ctx.shadowColor=color;

ctx.shadowBlur=
index===0
?16
:4;

ctx.beginPath();

ctx.roundRect(
part.x*20+2,
part.y*20+2,
16,
16,
5
);

ctx.fill();

ctx.shadowBlur=0;


/*
    silmad
*/

if(index===0){

ctx.fillStyle="#06120a";

ctx.beginPath();

ctx.arc(
part.x*20+7,
part.y*20+7,
2,
0,
Math.PI*2
);

ctx.fill();

ctx.beginPath();

ctx.arc(
part.x*20+13,
part.y*20+7,
2,
0,
Math.PI*2
);

ctx.fill();

}

}
);

});


ctx.restore();


/*
    Kaamera liikumine
*/

requestAnimationFrame(
draw
);

}


/* ================================
   START
================================ */

connect();

</script>

</body>
</html>
