<script>

/* =====================================================
   BASIC
===================================================== */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const minimap=document.getElementById("minimap");
const mctx=minimap.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){
  W=innerWidth;
  H=innerHeight;

  canvas.width=W;
  canvas.height=H;
}

addEventListener("resize",resize);
resize();


/* =====================================================
   WORLD
===================================================== */

const WORLD=20000;


/* =====================================================
   PLAYER
===================================================== */

const me={
  id:null,
  x:10000,
  y:10000,
  angle:0,
  target:0,
  length:20,
  color:"#63ff78",
  skin:"green",
  name:"Player"
};

let body=[];
let others={};

let running=false;
let dead=false;
let score=0;
let boosting=false;

let cameraX=10000;
let cameraY=10000;


/* =====================================================
   FOOD
===================================================== */

const foods=[];

const foodColors=[
  "#63ff78",
  "#ffd84d",
  "#ff6075",
  "#55c9ff",
  "#c76cff",
  "#ff963d"
];

function newFood(){

  return{
    x:Math.random()*WORLD,
    y:Math.random()*WORLD,
    r:3+Math.random()*4,
    color:foodColors[
      Math.floor(Math.random()*foodColors.length)
    ],
    value:1+Math.floor(Math.random()*4)
  };
}

for(let i=0;i<700;i++){
  foods.push(newFood());
}


/* =====================================================
   SKINS
===================================================== */

document.querySelectorAll(".skin").forEach(btn=>{

  btn.addEventListener("click",()=>{

    document.querySelectorAll(".skin")
      .forEach(x=>x.classList.remove("selected"));

    btn.classList.add("selected");

    me.color=btn.dataset.color;
    me.skin=btn.dataset.skin;

  });

});


/* =====================================================
   WEBSOCKET
===================================================== */

let socket=null;
let connected=false;
let reconnectTimer=null;

function connect(){

  clearTimeout(reconnectTimer);

  const protocol=
    location.protocol==="https:"
      ?"wss:"
      :"ws:";

  try{

    socket=new WebSocket(
      protocol+"//"+location.host
    );

  }catch(e){

    setConnection("🔴 WebSocket viga");
    return;
  }

  setConnection("🟡 Ühendamine...");

  socket.onopen=()=>{

    connected=true;

    setConnection("🟢 Server ühendatud");

  };

  socket.onerror=()=>{

    connected=false;

    setConnection("🔴 Serveri ühenduse viga");

  };

  socket.onclose=()=>{

    connected=false;

    setConnection("🟠 Ühendus katkes");

    reconnectTimer=setTimeout(connect,2500);

  };

  socket.onmessage=e=>{

    let data;

    try{
      data=JSON.parse(e.data);
    }catch{
      return;
    }

    handleServer(data);

  };

}


function send(data){

  if(
    !socket ||
    socket.readyState!==WebSocket.OPEN
  ){
    return false;
  }

  try{

    socket.send(JSON.stringify(data));
    return true;

  }catch{

    return false;
  }

}


/* =====================================================
   SERVER
===================================================== */

function handleServer(data){

  if(data.type==="roomCreated"){

    showRoom(data.code);
    return;
  }

  if(data.type==="roomJoined"){

    showRoom(data.code);
    return;
  }

  if(data.type==="lobby"){

    renderLobby(data.players||[]);
    return;
  }

  if(data.type==="gameStart"){

    startGame();
    return;
  }

  if(data.type==="players"){

    others=data.players||{};

    document.getElementById("count")
      .textContent=Math.max(
        1,
        Object.keys(others).length
      );

    return;
  }

  if(data.type==="gameOver"){

    die(data.reason||"Sind tapeti!");
    return;
  }

  if(data.type==="playerKilled"){

    showKill();
    return;
  }

  if(data.type==="error"){

    showError(data.message||"Viga");
    return;
  }

}


/* =====================================================
   UI
===================================================== */

function getName(){

  const value=
    document.getElementById("name")
      .value
      .trim();

  return(value||"Player").substring(0,16);
}

function showRoom(code){

  document.getElementById("roomBox")
    .style.display="block";

  document.getElementById("roomCode")
    .textContent=code;

}

function renderLobby(players){

  const box=document.getElementById("players");

  box.innerHTML="";

  players.forEach((p,i)=>{

    const row=document.createElement("div");

    row.className="player";

    const dot=document.createElement("div");

    dot.className="dot";
    dot.style.background=
      p.color||"#63ff78";

    const text=document.createElement("span");

    text.textContent=
      (i===0?"👑 ":"🐍 ")+
      (p.name||"Player");

    row.appendChild(dot);
    row.appendChild(text);

    box.appendChild(row);

  });

  if(players.length){
    document.getElementById("start")
      .style.display="block";
  }

}

function showError(text){

  document.getElementById("error")
    .textContent=text||"";

}

function setConnection(text){

  document.getElementById("connection")
    .textContent=text;

}


/* =====================================================
   CREATE
===================================================== */

document.getElementById("create")
.onclick=()=>{

  showError("");

  if(!connected){

    showError(
      "Serveriga pole ühendust."
    );

    return;
  }

  me.name=getName();

  send({
    type:"createRoom",
    name:me.name,
    color:me.color
  });

};


/* =====================================================
   JOIN
===================================================== */

document.getElementById("join")
.onclick=()=>{

  showError("");

  const code=
    document.getElementById("roomInput")
      .value
      .trim()
      .toUpperCase();

  if(code.length!==6){

    showError(
      "Sisesta 6-kohaline room code."
    );

    return;
  }

  me.name=getName();

  send({
    type:"joinRoom",
    code:code,
    name:me.name,
    color:me.color
  });

};


/* =====================================================
   START
===================================================== */

document.getElementById("start")
.onclick=()=>{

  if(!connected)return;

  send({
    type:"startGame"
  });

};


/* =====================================================
   KEYBOARD
===================================================== */

const keys={};

addEventListener("keydown",e=>{

  const k=e.key.toLowerCase();

  keys[k]=true;

  if(k==="shift"){
    boosting=true;
  }

  if([
    "arrowup",
    "arrowdown",
    "arrowleft",
    "arrowright",
    " "
  ].includes(k)){
    e.preventDefault();
  }

});

addEventListener("keyup",e=>{

  const k=e.key.toLowerCase();

  keys[k]=false;

  if(k==="shift"){
    boosting=false;
  }

});


function keyboard(){

  let x=0;
  let y=0;

  if(keys.w||keys.arrowup)y--;
  if(keys.s||keys.arrowdown)y++;
  if(keys.a||keys.arrowleft)x--;
  if(keys.d||keys.arrowright)x++;

  if(x||y){

    me.target=Math.atan2(y,x);

  }

}


/* =====================================================
   MOUSE
===================================================== */

addEventListener("mousemove",e=>{

  if(!running)return;

  if(innerWidth<=800)return;

  const x=e.clientX-W/2;
  const y=e.clientY-H/2;

  if(Math.hypot(x,y)<10)return;

  me.target=Math.atan2(y,x);

});


/* =====================================================
   MOBILE JOYSTICK
===================================================== */

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let pointerId=null;

function joystickMove(x,y){

  const r=joystick.getBoundingClientRect();

  const cx=r.left+r.width/2;
  const cy=r.top+r.height/2;

  let dx=x-cx;
  let dy=y-cy;

  const max=54;
  const dist=Math.hypot(dx,dy);

  if(dist>max){

    dx=dx/dist*max;
    dy=dy/dist*max;

  }

  stick.style.left=
    "calc(50% + "+dx+"px)";

  stick.style.top=
    "calc(50% + "+dy+"px)";

  if(dist>7){

    me.target=Math.atan2(dy,dx);

  }

}

function joystickReset(){

  pointerId=null;

  stick.style.left="50%";
  stick.style.top="50%";

}

joystick.addEventListener("pointerdown",e=>{

  pointerId=e.pointerId;

  joystick.setPointerCapture(e.pointerId);

  joystickMove(e.clientX,e.clientY);

});

joystick.addEventListener("pointermove",e=>{

  if(e.pointerId!==pointerId)return;

  joystickMove(e.clientX,e.clientY);

});

joystick.addEventListener("pointerup",joystickReset);
joystick.addEventListener("pointercancel",joystickReset);


/* =====================================================
   BOOST
===================================================== */

const boost=document.getElementById("boost");

boost.addEventListener("pointerdown",e=>{

  e.preventDefault();

  boosting=true;

  boost.classList.add("active");

});

boost.addEventListener("pointerup",()=>{

  boosting=false;

  boost.classList.remove("active");

});

boost.addEventListener("pointercancel",()=>{

  boosting=false;

  boost.classList.remove("active");

});


/* =====================================================
   START GAME
===================================================== */

function startGame(){

  running=true;
  dead=false;
  score=0;

  document.getElementById("menu")
    .style.display="none";

  document.getElementById("hud")
    .style.display="flex";

  document.getElementById("minimap")
    .style.display="block";

  document.getElementById("gameOver")
    .style.display="none";

  me.x=3000+Math.random()*14000;
  me.y=3000+Math.random()*14000;

  me.angle=Math.random()*Math.PI*2;
  me.target=me.angle;

  cameraX=me.x;
  cameraY=me.y;

  body=[];

  for(let i=0;i<me.length;i++){

    body.push({
      x:me.x-Math.cos(me.angle)*i*7,
      y:me.y-Math.sin(me.angle)*i*7
    });

  }

}


/* =====================================================
   UPDATE
===================================================== */

let lastSend=0;

function update(){

  if(!running||dead)return;

  keyboard();

  let diff=
    me.target-me.angle;

  while(diff>Math.PI)
    diff-=Math.PI*2;

  while(diff<-Math.PI)
    diff+=Math.PI*2;

  me.angle+=diff*.14;

  let speed=boosting?8.5:5.2;

  me.x+=Math.cos(me.angle)*speed;
  me.y+=Math.sin(me.angle)*speed;

  me.x=Math.max(25,Math.min(WORLD-25,me.x));
  me.y=Math.max(25,Math.min(WORLD-25,me.y));

  body.unshift({
    x:me.x,
    y:me.y
  });

  while(body.length<Math.floor(me.length)){
    body.push({
      x:me.x,
      y:me.y
    });
  }

  while(body.length>Math.floor(me.length)){
    body.pop();
  }

  eat();

  if(boosting&&me.length>20){
    me.length-=.025;
  }

  checkEnemyCollision();

  const now=performance.now();

  if(now-lastSend>50){

    lastSend=now;

    send({
      type:"state",
      x:me.x,
      y:me.y,
      angle:me.angle,
      length:me.length,
      color:me.color,
      name:me.name
    });

  }

  document.getElementById("score")
    .textContent=Math.floor(score);

  document.getElementById("length")
    .textContent=Math.floor(me.length);

}


/* =====================================================
   FOOD
===================================================== */

function eat(){

  for(let i=foods.length-1;i>=0;i--){

    const f=foods[i];

    const dx=f.x-me.x;
    const dy=f.y-me.y;

    if(Math.hypot(dx,dy)<23){

      score+=f.value;
      me.length+=f.value*.5;

      foods[i]=newFood();

    }

  }

}


/* =====================================================
   COLLISION
===================================================== */

function checkEnemyCollision(){

  for(const id in others){

    if(id===me.id)continue;

    const p=others[id];

    if(!p)continue;

    const dist=Math.hypot(
      p.x-me.x,
      p.y-me.y
    );

    /*
      Teise mao pea vastu meie keha.
    */

    if(dist<25){

      die("🐍 Teise mao pea tabas sind!");
      return;

    }

    /*
      Kui meie pea jõuab teise mao
      eeldatava keha peale.
    */

    const len=Math.min(
      120,
      Math.floor(p.length||20)
    );

    for(let i=8;i<len;i+=4){

      const bx=
        p.x-Math.cos(p.angle)*i*7;

      const by=
        p.y-Math.sin(p.angle)*i*7;

      if(Math.hypot(bx-me.x,by-me.y)<18){

        showKill();

        score+=25;
        me.length+=3;

        break;

      }

    }

  }

}


/* =====================================================
   CAMERA
===================================================== */

function updateCamera(){

  cameraX+=(me.x-cameraX)*.12;
  cameraY+=(me.y-cameraY)*.12;

}


/* =====================================================
   DRAW
===================================================== */

function draw(){

  ctx.fillStyle="#071008";
  ctx.fillRect(0,0,W,H);

  if(!running)return;

  updateCamera();

  ctx.save();

  ctx.translate(
    W/2-cameraX,
    H/2-cameraY
  );

  drawGrid();
  drawBorder();
  drawFood();
  drawOthers();
  drawMe();

  ctx.restore();

  drawMinimap();

}


/* =====================================================
   GRID
===================================================== */

function drawGrid(){

  const grid=250;

  const left=cameraX-W/2-500;
  const right=cameraX+W/2+500;

  const top=cameraY-H/2-500;
  const bottom=cameraY+H/2+500;

  ctx.strokeStyle="rgba(99,255,120,.045)";
  ctx.lineWidth=1;

  for(
    let x=Math.floor(left/grid)*grid;
    x<right;
    x+=grid
  ){

    ctx.beginPath();
    ctx.moveTo(x,top);
    ctx.lineTo(x,bottom);
    ctx.stroke();

  }

  for(
    let y=Math.floor(top/grid)*grid;
    y<bottom;
    y+=grid
  ){

    ctx.beginPath();
    ctx.moveTo(left,y);
    ctx.lineTo(right,y);
    ctx.stroke();

  }

}


/* =====================================================
   BORDER
===================================================== */

function drawBorder(){

  ctx.strokeStyle="#63ff78";
  ctx.lineWidth=18;
  ctx.shadowColor="#63ff78";
  ctx.shadowBlur=20;

  ctx.strokeRect(
    0,
    0,
    WORLD,
    WORLD
  );

  ctx.shadowBlur=0;

}


/* =====================================================
   FOOD
===================================================== */

function drawFood(){

  for(const f of foods){

    if(
      Math.abs(f.x-cameraX)>W ||
      Math.abs(f.y-cameraY)>H
    )continue;

    ctx.fillStyle=f.color;
    ctx.shadowColor=f.color;
    ctx.shadowBlur=9;

    ctx.beginPath();

    ctx.arc(
      f.x,
      f.y,
      f.r,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

  ctx.shadowBlur=0;

}


/* =====================================================
   HEAD
===================================================== */

function drawHead(x,y,r,color,skin,angle){

  ctx.save();

  ctx.translate(x,y);
  ctx.rotate(angle);

  ctx.fillStyle=color;
  ctx.shadowColor=color;
  ctx.shadowBlur=18;

  ctx.beginPath();
  ctx.arc(0,0,r,0,Math.PI*2);
  ctx.fill();

  ctx.shadowBlur=0;

  /*
    Skin patterns
  */

  if(skin==="blue"){

    ctx.strokeStyle="#d7f5ff";
    ctx.lineWidth=4;

    ctx.beginPath();
    ctx.arc(0,0,r-4,0,Math.PI*2);
    ctx.stroke();

  }

  if(skin==="red"){

    ctx.strokeStyle="#ffc0c8";
    ctx.lineWidth=4;

    ctx.beginPath();
    ctx.moveTo(-r*.65,-r*.6);
    ctx.lineTo(r*.65,r*.6);
    ctx.moveTo(r*.65,-r*.6);
    ctx.lineTo(-r*.65,r*.6);
    ctx.stroke();

  }

  if(skin==="purple"){

    ctx.fillStyle="#f0c9ff";

    for(let i=0;i<6;i++){

      const a=i*Math.PI/3;

      ctx.beginPath();

      ctx.arc(
        Math.cos(a)*r*.55,
        Math.sin(a)*r*.55,
        4,
        0,
        Math.PI*2
      );

      ctx.fill();

    }

  }

  if(skin==="orange"){

    ctx.strokeStyle="#ffe1c4";
    ctx.lineWidth=4;

    for(let i=-1;i<=1;i++){

      ctx.beginPath();

      ctx.moveTo(-r*.7,i*r*.4);
      ctx.lineTo(r*.7,i*r*.4);

      ctx.stroke();

    }

  }

  if(skin==="cyan"){

    ctx.strokeStyle="#d1fffb";
    ctx.lineWidth=4;

    ctx.beginPath();
    ctx.arc(0,0,r*.65,0,Math.PI*2);
    ctx.stroke();

  }

  if(skin==="yellow"){

    ctx.fillStyle="#fff4a4";

    ctx.beginPath();
    ctx.arc(0,0,r*.35,0,Math.PI*2);
    ctx.fill();

  }

  drawFace(r);

  ctx.restore();

}


/* =====================================================
   FACE
===================================================== */

function drawFace(r){

  ctx.fillStyle="white";

  ctx.beginPath();
  ctx.arc(r*.4,-r*.34,r*.28,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(r*.4,r*.34,r*.28,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#111";

  ctx.beginPath();
  ctx.arc(r*.52,-r*.34,r*.13,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(r*.52,r*.34,r*.13,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle="#111";
  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.arc(
    r*.55,
    0,
    r*.25,
    -.7,
    .7
  );

  ctx.stroke();

}


/* =====================================================
   MY SNAKE
===================================================== */

function drawMe(){

  for(
    let i=body.length-1;
    i>=0;
    i--
  ){

    const p=body[i];

    const t=i/body.length;

    const r=8+(1-t)*9;

    ctx.globalAlpha=1-t*.3;
    ctx.fillStyle=me.color;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      r,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

  ctx.globalAlpha=1;

  drawHead(
    me.x,
    me.y,
    22,
    me.color,
    me.skin,
    me.angle
  );

  drawName(
    me.name,
    me.x,
    me.y-33
  );

}


/* =====================================================
   OTHER SNAKES
===================================================== */

const skinList=[
  "green",
  "blue",
  "red",
  "yellow",
  "purple",
  "orange",
  "white",
  "cyan"
];

function getSkin(name){

  let h=0;

  for(let i=0;i<name.length;i++){
    h=(h*31+name.charCodeAt(i))|0;
  }

  return skinList[
    Math.abs(h)%skinList.length
  ];

}

function drawOthers(){

  for(const id in others){

    if(id===me.id)continue;

    const p=others[id];

    if(!p)continue;

    const len=Math.min(
      180,
      Math.max(
        20,
        Math.floor(p.length||20)
      )
    );

    for(let i=len-1;i>=0;i--){

      const x=
        p.x-
        Math.cos(p.angle)*i*7;

      const y=
        p.y-
        Math.sin(p.angle)*i*7;

      const t=i/len;

      const r=8+(1-t)*8;

      ctx.globalAlpha=1-t*.3;
      ctx.fillStyle=p.color||"#4da6ff";

      ctx.beginPath();

      ctx.arc(
        x,
        y,
        r,
        0,
        Math.PI*2
      );

      ctx.fill();

    }

    ctx.globalAlpha=1;

    const name=p.name||"Player";

    drawHead(
      p.x,
      p.y,
      22,
      p.color||"#4da6ff",
      getSkin(name),
      p.angle||0
    );

    drawName(
      name,
      p.x,
      p.y-33
    );

  }

}


/* =====================================================
   NAME
===================================================== */

function drawName(name,x,y){

  ctx.save();

  ctx.textAlign="center";
  ctx.font="bold 12px Arial";
  ctx.fillStyle="white";
  ctx.shadowColor="black";
  ctx.shadowBlur=5;

  ctx.fillText(
    name,
    x,
    y
  );

  ctx.restore();

}


/* =====================================================
   MINIMAP
===================================================== */

function drawMinimap(){

  const size=minimap.width;

  mctx.clearRect(
    0,
    0,
    size,
    size
  );

  mctx.fillStyle="#061007";

  mctx.fillRect(
    0,
    0,
    size,
    size
  );

  /*
    FOOD
  */

  for(const f of foods){

    const x=f.x/WORLD*size;
    const y=f.y/WORLD*size;

    mctx.fillStyle=f.color;

    mctx.globalAlpha=.45;

    mctx.beginPath();

    mctx.arc(
      x,
      y,
      1.2,
      0,
      Math.PI*2
    );

    mctx.fill();

  }

  mctx.globalAlpha=1;

  /*
    OTHER PLAYERS
  */

  for(const id in others){

    if(id===me.id)continue;

    const p=others[id];

    const x=p.x/WORLD*size;
    const y=p.y/WORLD*size;

    mctx.fillStyle=
      p.color||"#ff5268";

    mctx.beginPath();

    mctx.arc(
      x,
      y,
      4,
      0,
      Math.PI*2
    );

    mctx.fill();

  }

  /*
    ME
  */

  const mx=me.x/WORLD*size;
  const my=me.y/WORLD*size;

  mctx.fillStyle=me.color;
  mctx.shadowColor=me.color;
  mctx.shadowBlur=10;

  mctx.beginPath();

  mctx.arc(
    mx,
    my,
    6,
    0,
    Math.PI*2
  );

  mctx.fill();

  mctx.shadowBlur=0;

  mctx.strokeStyle="#63ff78";
  mctx.lineWidth=2;

  mctx.strokeRect(
    1,
    1,
    size-2,
    size-2
  );

}


/* =====================================================
   KILL
===================================================== */

let killTimer;

function showKill(){

  const el=document.getElementById("kill");

  el.classList.add("show");

  clearTimeout(killTimer);

  killTimer=setTimeout(()=>{

    el.classList.remove("show");

  },900);

}


/* =====================================================
   DEATH
===================================================== */

function die(reason){

  if(dead)return;

  dead=true;
  running=false;
  boosting=false;

  document.getElementById("reason")
    .textContent=reason;

  document.getElementById("finalScore")
    .textContent=Math.floor(score);

  document.getElementById("gameOver")
    .style.display="flex";

}

document.getElementById("back")
.onclick=()=>{

  location.reload();

};


/* =====================================================
   GAME LOOP
===================================================== */

function loop(){

  update();
  draw();

  requestAnimationFrame(loop);

}


/* =====================================================
   START
===================================================== */

connect();
loop();

</script>

</html>
