<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Snake Arena</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050805;
  font-family:Arial,sans-serif;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}

#menu,
#gameOver{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  justify-content:center;
  align-items:center;
}

#menu{
  background:
    radial-gradient(circle at 50% 20%,
    #245f2d,
    #0a1b0d 40%,
    #020402 85%);
}

.panel{
  width:min(94vw,460px);
  max-height:96vh;
  overflow-y:auto;
  padding:26px;
  background:rgba(4,12,5,.97);
  border:1px solid #315c37;
  border-radius:25px;
  color:white;
  text-align:center;
}

.logo{
  font-size:65px;
}

h1{
  color:#63ff78;
  font-size:40px;
}

.sub{
  color:#849586;
  margin:5px 0 20px;
}

input{
  width:100%;
  height:48px;
  margin:5px 0;
  padding:10px;
  border-radius:12px;
  border:1px solid #315c37;
  background:#071007;
  color:white;
  text-align:center;
  font-size:17px;
  outline:none;
}

button{
  cursor:pointer;
}

.main{
  width:100%;
  height:48px;
  margin-top:7px;
  border-radius:12px;
  border:0;
  font-weight:bold;
  font-size:15px;
}

.green{
  background:#63ff78;
  color:#031006;
}

.dark{
  background:#102014;
  color:white;
  border:1px solid #315b36;
}

#skins{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
  margin:12px 0;
}

.skin{
  width:53px;
  height:53px;
  border-radius:50%;
  border:3px solid transparent;
  font-size:23px;
}

.skin.selected{
  border-color:white;
  transform:scale(1.1);
}

#roomBox{
  display:none;
  margin-top:15px;
}

#roomCode{
  font-size:32px;
  letter-spacing:6px;
  color:#63ff78;
  font-weight:bold;
  margin:5px;
}

#players{
  max-height:130px;
  overflow:auto;
  text-align:left;
}

.player{
  background:#0b170d;
  border-radius:8px;
  padding:8px;
  margin:4px;
}

#error{
  min-height:22px;
  color:#ff6575;
  margin-top:8px;
}

#connection{
  color:#829382;
  font-size:12px;
  margin-top:8px;
}

#hud{
  position:fixed;
  z-index:5;
  top:10px;
  left:10px;
  display:none;
  gap:6px;
}

.stat{
  background:rgba(0,0,0,.7);
  border:1px solid #315c37;
  border-radius:10px;
  padding:7px 11px;
  color:white;
}

.stat small{
  display:block;
  color:#78907c;
  font-size:9px;
}

.stat b{
  font-size:16px;
}

#minimap{
  position:fixed;
  z-index:6;
  top:10px;
  right:10px;
  width:160px;
  height:160px;
  display:none;
  background:#061007;
  border:2px solid #63ff78;
  border-radius:15px;
}

#joystick{
  position:fixed;
  z-index:10;
  bottom:25px;
  left:25px;
  width:145px;
  height:145px;
  display:none;
  border-radius:50%;
  background:rgba(99,255,120,.1);
  border:2px solid rgba(99,255,120,.4);
}

#stick{
  position:absolute;
  left:50%;
  top:50%;
  width:62px;
  height:62px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:#63ff78;
  border:3px solid white;
}

#boost{
  position:fixed;
  z-index:10;
  right:25px;
  bottom:35px;
  width:90px;
  height:90px;
  display:none;
  border-radius:50%;
  border:3px solid white;
  background:#087bb0;
  color:white;
  font-size:27px;
}

#gameOver{
  display:none;
  background:rgba(0,0,0,.8);
}

.over{
  width:min(90vw,390px);
  padding:30px;
  background:#081008;
  border:1px solid #315b36;
  border-radius:25px;
  color:white;
  text-align:center;
}

.over h2{
  color:#ff596c;
  font-size:38px;
}

@media(max-width:800px){
  #joystick,
  #boost{
    display:block;
  }

  #minimap{
    width:125px;
    height:125px;
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="menu">
<div class="panel">

<div class="logo">🐍</div>
<h1>SNAKE ARENA</h1>
<div class="sub">Eat • Grow • Fight</div>

<input id="name"
maxlength="16"
placeholder="Sinu nimi">

<h3>🎨 Vali skin</h3>

<div id="skins">

<button class="skin selected"
data-color="#63ff78"
data-skin="green"
style="background:#63ff78">🐍</button>

<button class="skin"
data-color="#4da6ff"
data-skin="blue"
style="background:#4da6ff">😎</button>

<button class="skin"
data-color="#ff5570"
data-skin="red"
style="background:#ff5570">😈</button>

<button class="skin"
data-color="#ffd84d"
data-skin="yellow"
style="background:#ffd84d">😄</button>

<button class="skin"
data-color="#b86cff"
data-skin="purple"
style="background:#b86cff">👾</button>

<button class="skin"
data-color="#ff8a3d"
data-skin="orange"
style="background:#ff8a3d">🔥</button>

<button class="skin"
data-color="#ffffff"
data-skin="white"
style="background:white;color:black">👻</button>

<button class="skin"
data-color="#00e5d4"
data-skin="cyan"
style="background:#00e5d4">🤖</button>

</div>

<button id="create"
class="main green">
🏠 CREATE ROOM
</button>

<input id="room"
maxlength="6"
placeholder="ROOM CODE">

<button id="join"
class="main dark">
🚪 JOIN ROOM
</button>

<div id="roomBox">

<div>ROOM CODE</div>

<div id="roomCode">------</div>

<div id="players"></div>

<button id="start"
class="main green">
▶ START GAME
</button>

</div>

<div id="error"></div>
<div id="connection">Ühendamine...</div>

</div>
</div>

<div id="hud">

<div class="stat">
<small>SCORE</small>
<b id="score">0</b>
</div>

<div class="stat">
<small>LENGTH</small>
<b id="length">20</b>
</div>

<div class="stat">
<small>PLAYERS</small>
<b id="count">1</b>
</div>

</div>

<canvas id="minimap"
width="160"
height="160"></canvas>

<div id="joystick">
<div id="stick"></div>
</div>

<button id="boost">⚡</button>

<div id="gameOver">
<div class="over">

<h2>GAME OVER</h2>

<p id="reason">Sind tapeti!</p>

<p style="margin-top:10px">
Skoor: <b id="final">0</b>
</p>

<button id="again"
class="main green">
🔄 PROOVI UUESTI
</button>

<button id="back"
class="main dark">
🏠 MENÜÜ
</button>

</div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const mini=document.getElementById("minimap");
const mctx=mini.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){
  W=innerWidth;
  H=innerHeight;
  canvas.width=W;
  canvas.height=H;
}

addEventListener("resize",resize);
resize();

const WORLD=20000;

let socket;
let connected=false;
let running=false;
let dead=false;
let score=0;
let boosting=false;
let others={};

const me={
  id:null,
  x:10000,
  y:10000,
  angle:0,
  targetAngle:0,
  length:20,
  color:"#63ff78",
  skin:"green",
  name:"Player"
};

let body=[];

/* FOOD */

const foods=[];

const colors=[
  "#63ff78",
  "#ffd84d",
  "#ff6075",
  "#55c9ff",
  "#c76cff",
  "#ff963d"
];

function newFood(){
  return {
    x:Math.random()*WORLD,
    y:Math.random()*WORLD,
    r:3+Math.random()*4,
    color:colors[
      Math.floor(Math.random()*colors.length)
    ],
    value:1+Math.floor(Math.random()*4)
  };
}

for(let i=0;i<700;i++){
  foods.push(newFood());
}

/* SKINS */

document.querySelectorAll(".skin").forEach(btn=>{
  btn.onclick=()=>{
    document.querySelectorAll(".skin")
      .forEach(x=>x.classList.remove("selected"));

    btn.classList.add("selected");

    me.color=btn.dataset.color;
    me.skin=btn.dataset.skin;
  };
});

/* NAME */

function playerName(){
  return (
    document.getElementById("name").value.trim()
    || "Player"
  ).substring(0,16);
}

/* SERVER */

function connect(){

  const protocol=
    location.protocol==="https:"
    ? "wss:"
    : "ws:";

  socket=new WebSocket(
    protocol+"//"+location.host
  );

  socket.onopen=()=>{
    connected=true;
    document.getElementById("connection")
      .textContent="🟢 Server ühendatud";
  };

  socket.onclose=()=>{
    connected=false;
    document.getElementById("connection")
      .textContent="🔴 Ühendus katkes";
  };

  socket.onerror=()=>{
    document.getElementById("connection")
      .textContent="🔴 Serveri viga";
  };

  socket.onmessage=e=>{
    try{
      message(JSON.parse(e.data));
    }catch{}
  };
}

function send(data){
  if(
    socket &&
    socket.readyState===WebSocket.OPEN
  ){
    socket.send(JSON.stringify(data));
  }
}

/* MESSAGES */

function message(d){

  if(d.type==="roomCreated"){
    me.id=d.id;
    showRoom(d.code);
  }

  if(d.type==="roomJoined"){
    me.id=d.id;
    showRoom(d.code);
  }

  if(d.type==="lobby"){
    showLobby(d.players);
  }

  if(d.type==="gameStart"){
    me.id=d.id||me.id;
    startGame(d);
  }

  if(d.type==="players"){
    others=d.players||{};
    document.getElementById("count")
      .textContent=
      Math.max(1,Object.keys(others).length);
  }

  if(d.type==="gameOver"){
    die(d.reason||"Sind tapeti!");
  }

  if(d.type==="error"){
    document.getElementById("error")
      .textContent=d.message;
  }

  if(d.type==="youAreHost"){
    document.getElementById("start")
      .style.display="block";
  }
}

/* ROOM UI */

function showRoom(code){
  document.getElementById("roomBox")
    .style.display="block";

  document.getElementById("roomCode")
    .textContent=code;
}

function showLobby(players){

  const box=document.getElementById("players");

  box.innerHTML="";

  players.forEach(p=>{
    const div=document.createElement("div");

    div.className="player";

    div.textContent=
      (p.host?"👑 ":"🐍 ")+
      p.name;

    div.style.color=p.color||"white";

    box.appendChild(div);
  });
}

/* CREATE */

document.getElementById("create").onclick=()=>{

  document.getElementById("error")
    .textContent="";

  if(!connected){
    document.getElementById("error")
      .textContent="Server ei ole ühendatud.";
    return;
  }

  send({
    type:"createRoom",
    name:playerName(),
    color:me.color,
    skin:me.skin
  });
};

/* JOIN */

document.getElementById("join").onclick=()=>{

  const code=
    document.getElementById("room")
      .value.trim().toUpperCase();

  if(code.length!==6){
    document.getElementById("error")
      .textContent=
      "Room code peab olema 6 märki.";
    return;
  }

  send({
    type:"joinRoom",
    code,
    name:playerName(),
    color:me.color,
    skin:me.skin
  });
};

/* START */

document.getElementById("start").onclick=()=>{
  send({
    type:"startGame"
  });
};

/* KEYBOARD */

const keys={};

addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;

  if(e.key==="Shift"){
    boosting=true;
  }
});

addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()]=false;

  if(e.key==="Shift"){
    boosting=false;
  }
});

function keyboard(){

  let x=0;
  let y=0;

  if(keys.w||keys.arrowup)y--;
  if(keys.s||keys.arrowdown)y++;
  if(keys.a||keys.arrowleft)x--;
  if(keys.d||keys.arrowright)x++;

  if(x||y){
    me.targetAngle=Math.atan2(y,x);
  }
}

/* MOUSE */

addEventListener("mousemove",e=>{

  if(!running||innerWidth<=800)return;

  const x=e.clientX-W/2;
  const y=e.clientY-H/2;

  if(Math.hypot(x,y)>15){
    me.targetAngle=Math.atan2(y,x);
  }
});

/* JOYSTICK */

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joy=null;

function joyMove(x,y){

  const r=joystick.getBoundingClientRect();

  const cx=r.left+r.width/2;
  const cy=r.top+r.height/2;

  let dx=x-cx;
  let dy=y-cy;

  const max=55;
  const dist=Math.hypot(dx,dy);

  if(dist>max){
    dx=dx/dist*max;
    dy=dy/dist*max;
  }

  stick.style.left=`calc(50% + ${dx}px)`;
  stick.style.top=`calc(50% + ${dy}px)`;

  if(dist>7){
    me.targetAngle=Math.atan2(dy,dx);
  }
}

joystick.onpointerdown=e=>{
  joy=e.pointerId;
  joystick.setPointerCapture(e.pointerId);
  joyMove(e.clientX,e.clientY);
};

joystick.onpointermove=e=>{
  if(e.pointerId===joy){
    joyMove(e.clientX,e.clientY);
  }
};

function joyReset(){
  joy=null;
  stick.style.left="50%";
  stick.style.top="50%";
}

joystick.onpointerup=joyReset;
joystick.onpointercancel=joyReset;

/* BOOST */

const boost=document.getElementById("boost");

boost.onpointerdown=()=>{
  boosting=true;
};

boost.onpointerup=()=>{
  boosting=false;
};

boost.onpointercancel=()=>{
  boosting=false;
};

/* START GAME */

function startGame(d){

  running=true;
  dead=false;
  score=0;

  document.getElementById("menu")
    .style.display="none";

  document.getElementById("hud")
    .style.display="flex";

  document.getElementById("minimap")
    .style.display="block";

  me.x=d.x||
    3000+Math.random()*14000;

  me.y=d.y||
    3000+Math.random()*14000;

  me.angle=
    d.angle||
    Math.random()*Math.PI*2;

  me.targetAngle=me.angle;

  body=[];

  for(let i=0;i<20;i++){
    body.push({
      x:me.x-Math.cos(me.angle)*i*8,
      y:me.y-Math.sin(me.angle)*i*8
    });
  }
}

/* UPDATE */

let lastSend=0;

function update(){

  if(!running||dead)return;

  keyboard();

  let diff=
    me.targetAngle-me.angle;

  while(diff>Math.PI)diff-=Math.PI*2;
  while(diff<-Math.PI)diff+=Math.PI*2;

  me.angle+=diff*.14;

  let speed=boosting?8:4.8;

  me.x+=Math.cos(me.angle)*speed;
  me.y+=Math.sin(me.angle)*speed;

  me.x=Math.max(25,Math.min(WORLD-25,me.x));
  me.y=Math.max(25,Math.min(WORLD-25,me.y));

  body.unshift({
    x:me.x,
    y:me.y
  });

  while(body.length<Math.floor(me.length)){
    body.push({
      x:me.x,
      y:me.y
    });
  }

  while(body.length>Math.floor(me.length)){
    body.pop();
  }

  eat();

  if(boosting&&me.length>20){
    me.length-=.025;
  }

  if(performance.now()-lastSend>40){

    lastSend=performance.now();

    send({
      type:"state",
      x:me.x,
      y:me.y,
      angle:me.angle,
      length:me.length,
      color:me.color,
      skin:me.skin,
      name:playerName()
    });
  }

  document.getElementById("score")
    .textContent=Math.floor(score);

  document.getElementById("length")
    .textContent=Math.floor(me.length);
}

/* FOOD */

function eat(){

  for(let i=foods.length-1;i>=0;i--){

    const f=foods[i];

    if(
      Math.hypot(
        f.x-me.x,
        f.y-me.y
      )<24+f.r
    ){

      score+=f.value;
      me.length+=f.value*.5;

      foods[i]=newFood();
    }
  }
}

/* CAMERA */

let camX=me.x;
let camY=me.y;

function camera(){

  camX+=(me.x-camX)*.1;
  camY+=(me.y-camY)*.1;
}

/* DRAW */

function draw(){

  ctx.fillStyle="#071008";
  ctx.fillRect(0,0,W,H);

  if(!running)return;

  camera();

  ctx.save();

  ctx.translate(
    W/2-camX,
    H/2-camY
  );

  grid();
  border();
  drawFood();
  drawOthers();
  drawMe();

  ctx.restore();

  minimap();
}

/* GRID */

function grid(){

  const size=250;

  ctx.strokeStyle="rgba(99,255,120,.045)";
  ctx.lineWidth=1;

  const left=camX-W/2-500;
  const right=camX+W/2+500;
  const top=camY-H/2-500;
  const bottom=camY+H/2+500;

  for(
    let x=Math.floor(left/size)*size;
    x<right;
    x+=size
  ){

    ctx.beginPath();
    ctx.moveTo(x,top);
    ctx.lineTo(x,bottom);
    ctx.stroke();
  }

  for(
    let y=Math.floor(top/size)*size;
    y<bottom;
    y+=size
  ){

    ctx.beginPath();
    ctx.moveTo(left,y);
    ctx.lineTo(right,y);
    ctx.stroke();
  }
}

/* BORDER */

function border(){

  ctx.strokeStyle="#63ff78";
  ctx.lineWidth=15;

  ctx.strokeRect(
    0,
    0,
    WORLD,
    WORLD
  );
}

/* FOOD DRAW */

function drawFood(){

  for(const f of foods){

    if(
      Math.abs(f.x-camX)>W ||
      Math.abs(f.y-camY)>H
    )continue;

    ctx.fillStyle=f.color;

    ctx.beginPath();

    ctx.arc(
      f.x,
      f.y,
      f.r,
      0,
      Math.PI*2
    );

    ctx.fill();
  }
}

/* SNAKE BODY */

function drawBody(points,color){

  for(
    let i=points.length-1;
    i>=0;
    i--
  ){

    const p=points[i];

    const progress=i/points.length;

    ctx.globalAlpha=
      1-progress*.35;

    ctx.fillStyle=color;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      8+(1-progress)*8,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.globalAlpha=1;
}

/* FACE */

function face(x,y,angle){

  ctx.save();

  ctx.translate(x,y);
  ctx.rotate(angle);

  ctx.fillStyle="white";

  ctx.beginPath();
  ctx.arc(9,-7,6,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(9,7,6,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#111";

  ctx.beginPath();
  ctx.arc(11,-7,3,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(11,7,3,0,Math.PI*2);
  ctx.fill();

  ctx.restore();
}

/* NAME */

function nameText(name,x,y){

  ctx.save();

  ctx.textAlign="center";
  ctx.font="bold 12px Arial";
  ctx.fillStyle="white";
  ctx.shadowColor="black";
  ctx.shadowBlur=5;

  ctx.fillText(name,x,y);

  ctx.restore();
}

/* MY SNAKE */

function drawMe(){

  drawBody(body,me.color);

  ctx.fillStyle=me.color;

  ctx.beginPath();

  ctx.arc(
    me.x,
    me.y,
    21,
    0,
    Math.PI*2
  );

  ctx.fill();

  face(
    me.x,
    me.y,
    me.angle
  );

  nameText(
    playerName(),
    me.x,
    me.y-30
  );
}

/* OTHER SNAKES */

function drawOthers(){

  for(const id in others){

    if(id===me.id)continue;

    const p=others[id];

    if(!p||p.alive===false)continue;

    const len=Math.min(
      180,
      Math.max(20,Math.floor(p.length||20))
    );

    const points=[];

    for(let i=0;i<len;i++){

      points.push({
        x:p.x-Math.cos(p.angle)*i*8,
        y:p.y-Math.sin(p.angle)*i*8
      });
    }

    drawBody(
      points,
      p.color||"#4da6ff"
    );

    ctx.fillStyle=p.color||"#4da6ff";

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      21,
      0,
      Math.PI*2
    );

    ctx.fill();

    face(
      p.x,
      p.y,
      p.angle
    );

    nameText(
      p.name||"Player",
      p.x,
      p.y-30
    );
  }
}

/* MINIMAP */

function minimap(){

  const s=mini.width;

  mctx.clearRect(0,0,s,s);

  mctx.fillStyle="#061007";
  mctx.fillRect(0,0,s,s);

  for(const f of foods){

    mctx.fillStyle=f.color;

    mctx.globalAlpha=.45;

    mctx.fillRect(
      f.x/WORLD*s,
      f.y/WORLD*s,
      2,
      2
    );
  }

  mctx.globalAlpha=1;

  for(const id in others){

    if(id===me.id)continue;

    const p=others[id];

    if(!p||p.alive===false)continue;

    mctx.fillStyle=p.color||"#ff5268";

    mctx.beginPath();

    mctx.arc(
      p.x/WORLD*s,
      p.y/WORLD*s,
      4,
      0,
      Math.PI*2
    );

    mctx.fill();
  }

  mctx.fillStyle=me.color;

  mctx.beginPath();

  mctx.arc(
    me.x/WORLD*s,
    me.y/WORLD*s,
    6,
    0,
    Math.PI*2
  );

  mctx.fill();

  mctx.strokeStyle="#63ff78";
  mctx.lineWidth=2;

  mctx.strokeRect(1,1,s-2,s-2);
}

/* DEATH */

function die(reason){

  if(dead)return;

  dead=true;
  running=false;
  boosting=false;

  document.getElementById("reason")
    .textContent=reason;

  document.getElementById("final")
    .textContent=Math.floor(score);

  document.getElementById("gameOver")
    .style.display="flex";
}

document.getElementById("again").onclick=()=>{

  document.getElementById("gameOver")
    .style.display="none";

  send({
    type:"restart"
  });
};

document.getElementById("back").onclick=()=>{
  location.reload();
};

/* LOOP */

function loop(){

  update();
  draw();

  requestAnimationFrame(loop);
}

connect();
loop();
</script>
