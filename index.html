<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Snake Arena</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#030603;
  color:white;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

#game{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  display:none;
  background:#071008;
}

.screen{
  position:fixed;
  inset:0;
  z-index:50;
  overflow-y:auto;
  overflow-x:hidden;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  padding:25px 12px;
  background:
    radial-gradient(circle at 50% 10%,#286d35 0%,#0b230f 35%,#020402 85%);
}

.panel{
  width:min(96vw,520px);
  margin:auto;
  padding:28px;
  background:rgba(4,12,5,.97);
  border:1px solid rgba(99,255,120,.35);
  border-radius:28px;
  box-shadow:0 0 70px rgba(99,255,120,.18);
  text-align:center;
}

.logo{
  font-size:70px;
  filter:drop-shadow(0 0 18px #63ff78);
}

h1{
  color:#63ff78;
  font-size:42px;
}

.subtitle{
  color:#8ba08e;
  margin:5px 0 20px;
}

input{
  width:100%;
  height:48px;
  margin:6px 0;
  border:1px solid #315b36;
  border-radius:12px;
  background:#071007;
  color:white;
  text-align:center;
  outline:none;
}

.btn{
  width:100%;
  min-height:48px;
  margin-top:8px;
  border-radius:13px;
  border:1px solid #315b36;
  font-weight:800;
}

.green{
  background:#63ff78;
  color:#031006;
}

.dark{
  background:#102014;
  color:white;
}

.red{
  background:#ff5268;
  color:white;
}

.gold{
  background:#ffd84d;
  color:#111;
}

.hidden{
  display:none!important;
}

#skins{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  justify-content:center;
  margin:15px 0;
}

.skinBtn{
  width:58px;
  height:58px;
  border-radius:50%;
  border:3px solid transparent;
  font-size:26px;
}

.skinBtn.selected{
  border-color:white;
  transform:scale(1.1);
}

#coins{
  margin:12px 0;
  color:#ffd84d;
  font-weight:bold;
}

.shopGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:15px;
}

.shopItem{
  background:#0b170d;
  border:1px solid #294b2e;
  border-radius:16px;
  padding:14px;
}

.shopPreview{
  width:70px;
  height:70px;
  border-radius:50%;
  margin:auto auto 8px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
}

.price{
  color:#ffd84d;
  margin:6px;
}

#roomBox{
  margin-top:15px;
  padding-top:10px;
  border-top:1px solid #294b2e;
}

#roomCode{
  color:#63ff78;
  font-size:34px;
  letter-spacing:7px;
  font-weight:bold;
  margin:8px;
}

.playerRow{
  background:#0b170d;
  margin:4px;
  padding:8px;
  border-radius:8px;
}

#error{
  min-height:22px;
  color:#ff6676;
  margin-top:8px;
}

#connection{
  color:#7d917f;
  font-size:12px;
  margin-top:8px;
}

#hud{
  position:fixed;
  z-index:20;
  top:10px;
  left:10px;
  display:none;
  gap:7px;
}

.stat{
  background:rgba(0,0,0,.7);
  padding:7px 11px;
  border-radius:10px;
  border:1px solid rgba(99,255,120,.25);
}

.stat small{
  display:block;
  color:#78907c;
  font-size:9px;
}

.stat b{
  font-size:16px;
}

#leaderboard{
  position:fixed;
  z-index:20;
  right:10px;
  top:10px;
  width:190px;
  background:rgba(0,0,0,.72);
  border:1px solid rgba(99,255,120,.25);
  border-radius:14px;
  padding:10px;
}

#leaderboard h3{
  color:#63ff78;
  text-align:center;
  margin-bottom:6px;
}

.rank{
  display:flex;
  justify-content:space-between;
  padding:4px;
  font-size:12px;
}

#minimap{
  position:fixed;
  z-index:20;
  right:10px;
  bottom:10px;
  width:150px;
  height:150px;
  background:#061007;
  border:2px solid #63ff78;
  border-radius:14px;
}

#joystick{
  position:fixed;
  z-index:30;
  left:22px;
  bottom:22px;
  width:145px;
  height:145px;
  border-radius:50%;
  background:rgba(99,255,120,.1);
  border:2px solid rgba(99,255,120,.35);
  display:none;
}

#stick{
  position:absolute;
  left:50%;
  top:50%;
  width:62px;
  height:62px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:#63ff78;
  border:3px solid white;
}

#boost{
  position:fixed;
  z-index:30;
  right:25px;
  bottom:30px;
  width:88px;
  height:88px;
  display:none;
  border-radius:50%;
  background:#087bb0;
  color:white;
  border:3px solid #a5e3ff;
  font-size:28px;
}

#killText{
  position:fixed;
  z-index:40;
  left:50%;
  top:25%;
  transform:translateX(-50%) scale(.7);
  opacity:0;
  color:#63ff78;
  font-size:38px;
  font-weight:900;
  text-shadow:0 0 20px #63ff78;
  pointer-events:none;
  transition:.2s;
}

#killText.show{
  opacity:1;
  transform:translateX(-50%) scale(1);
}

#gameOver{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.8);
}

.overPanel{
  width:min(92vw,400px);
  padding:30px;
  background:#081008;
  border:1px solid #315b36;
  border-radius:25px;
  text-align:center;
}

.overPanel h2{
  color:#ff5268;
  font-size:38px;
}

@media(max-width:800px){
  #joystick,#boost{
    display:block;
  }

  #leaderboard{
    width:145px;
    font-size:11px;
  }

  #hud{
    transform:scale(.9);
    transform-origin:top left;
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- MAIN MENU -->

<div id="mainMenu" class="screen">
  <div class="panel">

    <div class="logo">🐍</div>

    <h1>SNAKE ARENA</h1>

    <div class="subtitle">
      Eat • Grow • Fight • Survive
    </div>

    <div id="coins">
      💰 0 COINS
    </div>

    <input
      id="name"
      maxlength="16"
      placeholder="Sinu nimi"
      autocomplete="off"
    >

    <h3 style="margin-top:12px">
      🎨 Skin
    </h3>

    <div id="skins"></div>

    <button id="singleBtn" class="btn green">
      🐍 SINGLEPLAYER
    </button>

    <button id="robotBtn" class="btn dark">
      🤖 ROBOTID
    </button>

    <button id="multiBtn" class="btn dark">
      🌐 MULTIPLAYER
    </button>

    <button id="shopBtn" class="btn gold">
      🛒 POOD
    </button>

    <button id="leaderBtn" class="btn dark">
      🏆 EDETABEL
    </button>

    <div id="connection">
      Ühendamine...
    </div>

    <div id="error"></div>

  </div>
</div>

<!-- MULTIPLAYER -->

<div id="multiMenu" class="screen hidden">
  <div class="panel">

    <h1>🌐 MULTIPLAYER</h1>

    <input
      id="roomInput"
      maxlength="6"
      placeholder="ROOM CODE"
    >

    <button id="joinBtn" class="btn green">
      🚪 JOIN ROOM
    </button>

    <button id="createBtn" class="btn dark">
      🏠 CREATE ROOM
    </button>

    <div id="roomBox" class="hidden">

      <div style="color:#819482">
        ROOM CODE
      </div>

      <div id="roomCode">
        ------
      </div>

      <div id="players"></div>

      <button id="startBtn" class="btn green">
        ▶ START GAME
      </button>

    </div>

    <button id="multiBack" class="btn dark">
      ← TAGASI
    </button>

    <div id="multiError" class="error"></div>

  </div>
</div>

<!-- SHOP -->

<div id="shopMenu" class="screen hidden">
  <div class="panel">

    <h1>🛒 POOD</h1>

    <div id="shopCoins">
      💰 0
    </div>

    <p style="color:#819482;margin-top:8px">
      Osta skinid enne mängu alustamist.
    </p>

    <div id="shopGrid" class="shopGrid"></div>

    <button id="shopBack" class="btn dark">
      ← TAGASI
    </button>

  </div>
</div>

<!-- LEADERBOARD -->

<div id="leaderMenu" class="screen hidden">
  <div class="panel">

    <h1>🏆 EDETABEL</h1>

    <div id="leaderList"></div>

    <button id="leaderBack" class="btn dark">
      ← TAGASI
    </button>

  </div>
</div>

<!-- HUD -->

<div id="hud">

  <div class="stat">
    <small>SCORE</small>
    <b id="score">0</b>
  </div>

  <div class="stat">
    <small>LENGTH</small>
    <b id="length">25</b>
  </div>

  <div class="stat">
    <small>COINS</small>
    <b id="gameCoins">0</b>
  </div>

</div>

<div id="leaderboard">
  <h3>🏆 TOP</h3>
  <div id="gameRanks"></div>
</div>

<canvas id="minimap" width="150" height="150"></canvas>

<div id="killText">
  💥 +10 COINS
</div>

<div id="joystick">
  <div id="stick"></div>
</div>

<button id="boost">
  ⚡
</button>

<div id="gameOver">

  <div class="overPanel">

    <h2>GAME OVER</h2>

    <p id="deathReason">
      Sind tapeti!
    </p>

    <p style="margin-top:10px">
      Skoor:
      <b id="finalScore">0</b>
    </p>

    <p style="margin-top:8px;color:#ffd84d">
      💰 +<span id="deathCoins">0</span> coins
    </p>

    <button id="againBtn" class="btn green">
      🔄 UUESTI
    </button>

    <button id="menuBtn" class="btn dark">
      🏠 MENÜÜ
    </button>

  </div>

</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const minimap = document.getElementById("minimap");
const mapCtx = minimap.getContext("2d");

let W = innerWidth;
let H = innerHeight;

function resize(){
  W = innerWidth;
  H = innerHeight;

  canvas.width = W;
  canvas.height = H;
}

addEventListener("resize",resize);
resize();

const WORLD = 20000;

const foodColors = [
  "#63ff78",
  "#ffd84d",
  "#ff6075",
  "#55c9ff",
  "#c76cff",
  "#ff963d"
];

const skins = [
  {
    id:"green",
    name:"Classic",
    color:"#63ff78",
    price:0,
    icon:"🐍"
  },
  {
    id:"blue",
    name:"Ice",
    color:"#4da6ff",
    price:50,
    icon:"😎"
  },
  {
    id:"red",
    name:"Demon",
    color:"#ff5570",
    price:100,
    icon:"😈"
  },
  {
    id:"yellow",
    name:"Gold",
    color:"#ffd84d",
    price:150,
    icon:"😄"
  },
  {
    id:"purple",
    name:"Alien",
    color:"#b86cff",
    price:200,
    icon:"👾"
  },
  {
    id:"orange",
    name:"Fire",
    color:"#ff8a3d",
    price:250,
    icon:"🔥"
  },
  {
    id:"white",
    name:"Ghost",
    color:"#ffffff",
    price:300,
    icon:"👻"
  },
  {
    id:"cyan",
    name:"Robot",
    color:"#00e5d4",
    price:400,
    icon:"🤖"
  },
  {
    id:"rainbow",
    name:"Rainbow",
    color:"#ff4df0",
    price:600,
    icon:"🌈"
  }
];

let coins = Number(localStorage.getItem("snakeCoins") || 0);

let owned = JSON.parse(
  localStorage.getItem("snakeOwned") ||
  '["green"]'
);

let selectedSkin =
  localStorage.getItem("snakeSkin") ||
  "green";

function save(){
  localStorage.setItem(
    "snakeCoins",
    coins
  );

  localStorage.setItem(
    "snakeOwned",
    JSON.stringify(owned)
  );

  localStorage.setItem(
    "snakeSkin",
    selectedSkin
  );
}

function currentSkin(){
  return skins.find(s=>s.id===selectedSkin) || skins[0];
}

function renderCoins(){
  document.getElementById("coins").textContent =
    "💰 " + coins + " COINS";

  document.getElementById("shopCoins").textContent =
    "💰 " + coins;

  document.getElementById("gameCoins").textContent =
    coins;
}

function renderSkins(){
  const box = document.getElementById("skins");

  box.innerHTML = "";

  for(const skin of skins){
    const b = document.createElement("button");

    b.className =
      "skinBtn " +
      (selectedSkin === skin.id ? "selected" : "");

    b.style.background = skin.color;
    b.textContent = skin.icon;

    b.onclick = () => {
      if(!owned.includes(skin.id)){
        showError("See skin tuleb poest osta.");
        return;
      }

      selectedSkin = skin.id;
      save();
      renderSkins();
    };

    box.appendChild(b);
  }
}

function renderShop(){
  const box =
    document.getElementById("shopGrid");

  box.innerHTML = "";

  for(const skin of skins){

    const item =
      document.createElement("div");

    item.className = "shopItem";

    const bought =
      owned.includes(skin.id);

    item.innerHTML = `
      <div
        class="shopPreview"
        style="background:${skin.color}">
        ${skin.icon}
      </div>

      <b>${skin.name}</b>

      ${
        bought
        ? `<div style="color:#63ff78;margin:6px">✓ OMANIK</div>`
        : `<div class="price">💰 ${skin.price}</div>`
      }

      <button class="btn ${
        bought ? "green" : "dark"
      }">
        ${
          bought
          ? "VALI"
          : "OSTA"
        }
      </button>
    `;

    item.querySelector("button").onclick = () => {

      if(bought){

        selectedSkin = skin.id;

        save();

        renderSkins();
        renderShop();

        return;
      }

      if(coins < skin.price){

        alert(
          "Sul pole piisavalt coine!"
        );

        return;
      }

      coins -= skin.price;

      owned.push(skin.id);

      selectedSkin = skin.id;

      save();

      renderCoins();
      renderSkins();
      renderShop();
    };

    box.appendChild(item);
  }
}

function getLeaderboard(){
  return JSON.parse(
    localStorage.getItem("snakeLeaderboard") || "[]"
  );
}

function addLeaderboard(name,score){
  const list = getLeaderboard();

  list.push({
    name:name || "Player",
    score:Math.floor(score)
  });

  list.sort(
    (a,b)=>b.score-a.score
  );

  list.splice(10);

  localStorage.setItem(
    "snakeLeaderboard",
    JSON.stringify(list)
  );
}

function renderLeaderboard(){
  const list = getLeaderboard();

  const box =
    document.getElementById("leaderList");

  box.innerHTML = "";

  if(!list.length){
    box.innerHTML =
      "<p style='color:#819482'>Veel pole tulemusi.</p>";
    return;
  }

  list.forEach((p,i)=>{
    const row =
      document.createElement("div");

    row.className="playerRow";

    row.innerHTML =
      `<b>${i+1}. ${escapeHtml(p.name)}</b>
       <span style="float:right;color:#63ff78">
       ${p.score}
       </span>`;

    box.appendChild(row);
  });
}

function escapeHtml(text){
  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

renderCoins();
renderSkins();
renderShop();
renderLeaderboard();

const foods = [];

function makeFood(x,y){
  return {
    x: x ?? Math.random()*WORLD,
    y: y ?? Math.random()*WORLD,
    radius: 3+Math.random()*4,
    color:
      foodColors[
        Math.floor(
          Math.random()*foodColors.length
        )
      ],
    value:1+Math.floor(Math.random()*4)
  };
}

for(let i=0;i<1800;i++){
  foods.push(makeFood());
}

const me = {
  id:null,
  x:10000,
  y:10000,
  angle:0,
  targetAngle:0,
  length:25,
  color:"#63ff78",
  skin:"green",
  name:"Player"
};

let body = [];
let others = {};
let robots = [];

let running = false;
let dead = false;
let mode = "";

let score = 0;
let boosting = false;

let socket = null;
let connected = false;

function connect(){

  const protocol =
    location.protocol === "https:"
    ? "wss:"
    : "ws:";

  socket = new WebSocket(
    protocol + "//" + location.host
  );

  socket.onopen = () => {
    connected = true;
    document.getElementById("connection").textContent =
      "🟢 Server ühendatud";
  };

  socket.onclose = () => {
    connected = false;
    document.getElementById("connection").textContent =
      "🔴 Serveri ühendus katkes";
  };

  socket.onerror = () => {
    document.getElementById("connection").textContent =
      "🔴 Serveri viga";
  };

  socket.onmessage = e => {
    try{
      serverMessage(JSON.parse(e.data));
    }catch{}
  };
}

function send(data){
  if(
    socket &&
    socket.readyState === WebSocket.OPEN
  ){
    socket.send(JSON.stringify(data));
  }
}

function serverMessage(data){

  if(data.type === "connected"){
    me.id = data.id;
  }

  if(data.type === "roomCreated"){
    me.id = data.id;

    showScreen("multiMenu");

    document
      .getElementById("roomBox")
      .classList.remove("hidden");

    document
      .getElementById("roomCode")
      .textContent = data.code;
  }

  if(data.type === "roomJoined"){
    me.id = data.id;

    document
      .getElementById("roomBox")
      .classList.remove("hidden");

    document
      .getElementById("roomCode")
      .textContent = data.code;
  }

  if(data.type === "lobby"){
    renderLobby(data.players || []);
  }

  if(data.type === "gameStart"){
    startGame("multi");

    me.x = data.x;
    me.y = data.y;
  }

  if(data.type === "players"){
    others = data.players || {};
  }

  if(data.type === "playerKilled"){
    if(data.killerId === me.id){
      coins += 10;
      save();
      renderCoins();
      showKill();
    }
  }

  if(data.type === "gameOver"){
    die(data.reason || "Sind tapeti!");
  }

  if(data.type === "error"){
    document.getElementById("multiError").textContent =
      data.message || "Viga";
  }
}

function renderLobby(players){

  const box =
    document.getElementById("players");

  box.innerHTML = "";

  players.forEach(p => {

    const row =
      document.createElement("div");

    row.className="playerRow";

    row.style.color =
      p.color || "white";

    row.textContent =
      (p.host ? "👑 " : "🐍 ") +
      p.name;

    box.appendChild(row);
  });
}

function playerName(){
  return (
    document
      .getElementById("name")
      .value
      .trim() ||
    "Player"
  ).substring(0,16);
}

function showScreen(id){

  [
    "mainMenu",
    "multiMenu",
    "shopMenu",
    "leaderMenu"
  ].forEach(x=>{
    document
      .getElementById(x)
      .classList.add("hidden");
  });

  document
    .getElementById(id)
    .classList.remove("hidden");
}

function showError(text){
  document.getElementById("error").textContent =
    text || "";
}

document.getElementById("singleBtn").onclick = () => {
  startGame("single");
};

document.getElementById("robotBtn").onclick = () => {
  startGame("robots");
};

document.getElementById("multiBtn").onclick = () => {
  showScreen("multiMenu");
};

document.getElementById("shopBtn").onclick = () => {
  renderShop();
  showScreen("shopMenu");
};

document.getElementById("leaderBtn").onclick = () => {
  renderLeaderboard();
  showScreen("leaderMenu");
};

document.getElementById("shopBack").onclick = () => {
  showScreen("mainMenu");
};

document.getElementById("leaderBack").onclick = () => {
  showScreen("mainMenu");
};

document.getElementById("multiBack").onclick = () => {
  showScreen("mainMenu");
};

document.getElementById("createBtn").onclick = () => {

  if(!connected){
    document.getElementById("multiError").textContent =
      "Server ühendub...";
    return;
  }

  const skin = currentSkin();

  send({
    type:"createRoom",
    name:playerName(),
    color:skin.color,
    skin:skin.id
  });
};

document.getElementById("joinBtn").onclick = () => {

  if(!connected){
    document.getElementById("multiError").textContent =
      "Server ühendub...";
    return;
  }

  const code =
    document
      .getElementById("roomInput")
      .value
      .trim()
      .toUpperCase();

  if(code.length !== 6){
    document.getElementById("multiError").textContent =
      "Room code peab olema 6 märki.";
    return;
  }

  const skin = currentSkin();

  send({
    type:"joinRoom",
    code,
    name:playerName(),
    color:skin.color,
    skin:skin.id
  });
};

document.getElementById("startBtn").onclick = () => {
  send({
    type:"startGame"
  });
};

const keys = {};

addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()] = true;

  if(e.key === "Shift"){
    boosting = true;
  }
});

addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()] = false;

  if(e.key === "Shift"){
    boosting = false;
  }
});

function keyboardDirection(){

  let dx=0;
  let dy=0;

  if(keys.w || keys.arrowup) dy--;
  if(keys.s || keys.arrowdown) dy++;
  if(keys.a || keys.arrowleft) dx--;
  if(keys.d || keys.arrowright) dx++;

  if(dx || dy){
    me.targetAngle = Math.atan2(dy,dx);
  }
}

addEventListener("mousemove",e=>{
  if(!running) return;
  if(innerWidth <= 800) return;

  const dx=e.clientX-W/2;
  const dy=e.clientY-H/2;

  if(Math.hypot(dx,dy)>15){
    me.targetAngle=Math.atan2(dy,dx);
  }
});

const joystick =
  document.getElementById("joystick");

const stick =
  document.getElementById("stick");

let joyId=null;

function moveJoystick(x,y){

  const r =
    joystick.getBoundingClientRect();

  const cx=r.left+r.width/2;
  const cy=r.top+r.height/2;

  let dx=x-cx;
  let dy=y-cy;

  const max=55;
  const d=Math.hypot(dx,dy);

  if(d>max){
    dx=dx/d*max;
    dy=dy/d*max;
  }

  stick.style.left =
    `calc(50% + ${dx}px)`;

  stick.style.top =
    `calc(50% + ${dy}px)`;

  if(d>7){
    me.targetAngle=Math.atan2(dy,dx);
  }
}

function resetJoy(){
  joyId=null;
  stick.style.left="50%";
  stick.style.top="50%";
}

joystick.onpointerdown=e=>{
  joyId=e.pointerId;
  joystick.setPointerCapture(e.pointerId);
  moveJoystick(e.clientX,e.clientY);
};

joystick.onpointermove=e=>{
  if(e.pointerId===joyId){
    moveJoystick(e.clientX,e.clientY);
  }
};

joystick.onpointerup=resetJoy;
joystick.onpointercancel=resetJoy;

const boost =
  document.getElementById("boost");

boost.onpointerdown=()=>{
  boosting=true;
};

boost.onpointerup=()=>{
  boosting=false;
};

boost.onpointercancel=()=>{
  boosting=false;
};

function createRobots(){

  robots=[];

  for(let i=0;i<18;i++){

    robots.push({
      id:"bot"+i,
      name:"BOT "+(i+1),
      x:1000+Math.random()*18000,
      y:1000+Math.random()*18000,
      angle:Math.random()*Math.PI*2,
      length:20+Math.random()*100,
      color:skins[
        i % skins.length
      ].color,
      skin:skins[
        i % skins.length
      ].id,
      targetAngle:Math.random()*Math.PI*2,
      alive:true,
      score:0
    });
  }
}

function startGame(gameMode){

  mode=gameMode;
  running=true;
  dead=false;

  score=0;

  document.getElementById("mainMenu")
    .classList.add("hidden");

  document.getElementById("multiMenu")
    .classList.add("hidden");

  document.getElementById("game")
    .style.display="block";

  document.getElementById("hud")
    .style.display="flex";

  document.getElementById("leaderboard")
    .style.display="block";

  document.getElementById("minimap")
    .style.display="block";

  const skin=currentSkin();

  me.color=skin.color;
  me.skin=skin.id;
  me.name=playerName();

  me.x=3000+Math.random()*14000;
  me.y=3000+Math.random()*14000;
  me.angle=Math.random()*Math.PI*2;
  me.targetAngle=me.angle;
  me.length=25;

  body=[];

  for(let i=0;i<25;i++){
    body.push({
      x:me.x-Math.cos(me.angle)*i*8,
      y:me.y-Math.sin(me.angle)*i*8
    });
  }

  if(mode==="robots"){
    createRobots();
  }else{
    robots=[];
  }
}

let lastSend=0;

function update(){

  if(!running || dead) return;

  keyboardDirection();

  let diff =
    me.targetAngle-me.angle;

  while(diff>Math.PI) diff-=Math.PI*2;
  while(diff<-Math.PI) diff+=Math.PI*2;

  me.angle += diff*.14;

  const speed =
    boosting ? 9 : 5.3;

  me.x += Math.cos(me.angle)*speed;
  me.y += Math.sin(me.angle)*speed;

  me.x=Math.max(30,Math.min(WORLD-30,me.x));
  me.y=Math.max(30,Math.min(WORLD-30,me.y));

  body.unshift({
    x:me.x,
    y:me.y
  });

  while(
    body.length <
    Math.floor(me.length)
  ){
    body.push({
      x:me.x,
      y:me.y
    });
  }

  while(
    body.length >
    Math.floor(me.length)
  ){
    body.pop();
  }

  eatFood();

  if(boosting && me.length>25){

    me.length-=.06;

    if(Math.random()<.16){

      foods.push(
        makeFood(
          body[
            Math.min(
              body.length-1,
              15
            )
          ].x,
          body[
            Math.min(
              body.length-1,
              15
            )
          ].y
        )
      );
    }
  }

  if(mode==="robots"){
    updateRobots();
    checkRobotCombat();
  }

  if(mode==="multi"){
    const now=performance.now();

    if(now-lastSend>35){

      lastSend=now;

      send({
        type:"state",
        x:me.x,
        y:me.y,
        angle:me.angle,
        length:me.length,
        color:me.color,
        skin:me.skin,
        name:me.name
      });
    }

    checkPlayersCombat();
  }

  document.getElementById("score").textContent =
    Math.floor(score);

  document.getElementById("length").textContent =
    Math.floor(me.length);

  renderGameLeaderboard();
}

function eatFood(){

  for(let i=foods.length-1;i>=0;i--){

    const f=foods[i];

    if(
      Math.hypot(
        f.x-me.x,
        f.y-me.y
      ) <
      22+f.radius
    ){

      score+=f.value;
      me.length+=f.value*.7;

      foods[i]=makeFood();
    }
  }
}

function updateRobots(){

  for(const bot of robots){

    if(!bot.alive) continue;

    const dx=me.x-bot.x;
    const dy=me.y-bot.y;

    const d=Math.hypot(dx,dy);

    if(d<900){

      bot.targetAngle=Math.atan2(dy,dx);

    }else if(Math.random()<.015){

      bot.targetAngle+=
        (Math.random()-.5)*1.5;
    }

    let diff=
      bot.targetAngle-bot.angle;

    while(diff>Math.PI) diff-=Math.PI*2;
    while(diff<-Math.PI) diff+=Math.PI*2;

    bot.angle+=diff*.045;

    const speed =
      bot.length>me.length
      ? 4.8
      : 3.5;

    bot.x+=Math.cos(bot.angle)*speed;
    bot.y+=Math.sin(bot.angle)*speed;

    if(bot.x<50 || bot.x>WORLD-50){
      bot.angle=Math.PI-bot.angle;
    }

    if(bot.y<50 || bot.y>WORLD-50){
      bot.angle=-bot.angle;
    }

    bot.x=Math.max(50,Math.min(WORLD-50,bot.x));
    bot.y=Math.max(50,Math.min(WORLD-50,bot.y));

    if(Math.random()<.008){
      bot.length+=1;
    }
  }
}

function checkRobotCombat(){

  for(const bot of robots){

    if(!bot.alive) continue;

    const d=Math.hypot(
      me.x-bot.x,
      me.y-bot.y
    );

    if(d<34){

      if(me.length>=bot.length){

        bot.alive=false;

        me.length+=Math.max(
          8,
          bot.length*.35
        );

        score+=50;

        coins+=10;

        save();
        renderCoins();

        showKill();

        for(let i=0;i<8;i++){
          foods.push(
            makeFood(
              bot.x+
              (Math.random()-.5)*100,
              bot.y+
              (Math.random()-.5)*100
            )
          );
        }

      }else{

        die("🤖 Robot tappis sind!");
      }
    }
  }
}

function checkPlayersCombat(){

  for(const id in others){

    if(id===me.id) continue;

    const p=others[id];

    if(!p || p.alive===false) continue;

    const d=Math.hypot(
      me.x-p.x,
      me.y-p.y
    );

    if(d<38){

      if(me.length>p.length){

        send({
          type:"kill",
          victimId:id
        });

      }else{

        die("🐍 Teine mängija tappis sind!");
      }
    }
  }
}

function draw(){

  ctx.fillStyle="#071008";
  ctx.fillRect(0,0,W,H);

  if(!running) return;

  const cameraX=me.x;
  const cameraY=me.y;

  ctx.save();

  ctx.translate(
    W/2-cameraX,
    H/2-cameraY
  );

  drawGrid();
  drawBorder();
  drawFood();

  if(mode==="robots"){
    drawRobots();
  }

  if(mode==="multi"){
    drawOthers();
  }

  drawSnake(
    body,
    me.x,
    me.y,
    me.angle,
    me.color,
    me.skin,
    me.name
  );

  ctx.restore();

  drawMinimap();
}

function drawGrid(){

  const grid=250;

  const left=me.x-W/2-500;
  const right=me.x+W/2+500;
  const top=me.y-H/2-500;
  const bottom=me.y+H/2+500;

  ctx.strokeStyle=
    "rgba(99,255,120,.045)";

  for(
    let x=Math.floor(left/grid)*grid;
    x<right;
    x+=grid
  ){

    ctx.beginPath();
    ctx.moveTo(x,top);
    ctx.lineTo(x,bottom);
    ctx.stroke();
  }

  for(
    let y=Math.floor(top/grid)*grid;
    y<bottom;
    y+=grid
  ){

    ctx.beginPath();
    ctx.moveTo(left,y);
    ctx.lineTo(right,y);
    ctx.stroke();
  }
}

function drawBorder(){

  ctx.strokeStyle="#63ff78";
  ctx.lineWidth=18;
  ctx.shadowColor="#63ff78";
  ctx.shadowBlur=20;

  ctx.strokeRect(
    0,
    0,
    WORLD,
    WORLD
  );

  ctx.shadowBlur=0;
}

function drawFood(){

  for(const f of foods){

    if(
      Math.abs(f.x-me.x)>W ||
      Math.abs(f.y-me.y)>H
    ) continue;

    ctx.fillStyle=f.color;
    ctx.shadowColor=f.color;
    ctx.shadowBlur=8;

    ctx.beginPath();

    ctx.arc(
      f.x,
      f.y,
      f.radius,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.shadowBlur=0;
}

function drawSnake(
  segments,
  x,
  y,
  angle,
  color,
  skin,
  name
){

  for(
    let i=segments.length-1;
    i>=0;
    i--
  ){

    const p=segments[i];

    const progress=
      i/Math.max(1,segments.length);

    const radius=
      8+(1-progress)*9;

    ctx.globalAlpha=
      1-progress*.25;

    ctx.fillStyle=color;

    ctx.shadowColor=color;
    ctx.shadowBlur=i<8?12:3;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      radius,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.globalAlpha=1;
  ctx.shadowBlur=0;

  drawHead(
    x,
    y,
    23,
    color,
    skin,
    angle
  );

  drawName(
    name,
    x,
    y-32
  );
}

function drawHead(
  x,
  y,
  r,
  color,
  skin,
  angle
){

  ctx.save();

  ctx.translate(x,y);

  ctx.rotate(angle);

  if(skin==="rainbow"){

    const g=
      ctx.createLinearGradient(
        -r,-r,r,r
      );

    g.addColorStop(0,"#ff3b3b");
    g.addColorStop(.2,"#ffd43b");
    g.addColorStop(.4,"#55ff65");
    g.addColorStop(.6,"#42cfff");
    g.addColorStop(.8,"#7d55ff");
    g.addColorStop(1,"#ff4df0");

    ctx.fillStyle=g;

  }else{

    ctx.fillStyle=color;
  }

  ctx.shadowColor=color;
  ctx.shadowBlur=18;

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    r,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.shadowBlur=0;

  drawFace(r);

  ctx.restore();
}

function drawFace(r){

  ctx.fillStyle="white";

  ctx.beginPath();
  ctx.arc(9,-7,6,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(9,7,6,0,Math.PI*2);
  ctx.fill();

  ctx.fillStyle="#111";

  ctx.beginPath();
  ctx.arc(11,-7,3,0,Math.PI*2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(11,7,3,0,Math.PI*2);
  ctx.fill();

  ctx.strokeStyle="#111";
  ctx.lineWidth=2;

  ctx.beginPath();

  ctx.arc(
    14,
    0,
    5,
    -.7,
    .7
  );

  ctx.stroke();
}

function drawOthers(){

  for(const id in others){

    if(id===me.id) continue;

    const p=others[id];

    if(!p || p.alive===false) continue;

    const segments=[];

    const len=
      Math.min(
        180,
        Math.floor(p.length || 25)
      );

    for(let i=0;i<len;i++){

      segments.push({
        x:
          p.x-
          Math.cos(p.angle)*i*8,

        y:
          p.y-
          Math.sin(p.angle)*i*8
      });
    }

    drawSnake(
      segments,
      p.x,
      p.y,
      p.angle,
      p.color || "#4da6ff",
      p.skin || "blue",
      p.name || "Player"
    );
  }
}

function drawRobots(){

  for(const bot of robots){

    if(!bot.alive) continue;

    const segments=[];

    const len=
      Math.min(
        150,
        Math.floor(bot.length)
      );

    for(let i=0;i<len;i++){

      segments.push({
        x:
          bot.x-
          Math.cos(bot.angle)*i*8,

        y:
          bot.y-
          Math.sin(bot.angle)*i*8
      });
    }

    drawSnake(
      segments,
      bot.x,
      bot.y,
      bot.angle,
      bot.color,
      bot.skin,
      bot.name
    );
  }
}

function drawName(name,x,y){

  ctx.save();

  ctx.textAlign="center";
  ctx.font="bold 12px Arial";
  ctx.fillStyle="white";
  ctx.shadowColor="black";
  ctx.shadowBlur=5;

  ctx.fillText(
    name,
    x,
    y
  );

  ctx.restore();
}

function drawMinimap(){

  const s=150;

  mapCtx.clearRect(0,0,s,s);

  mapCtx.fillStyle="#061007";
  mapCtx.fillRect(0,0,s,s);

  for(const f of foods){

    mapCtx.fillStyle=f.color;

    mapCtx.globalAlpha=.35;

    mapCtx.fillRect(
      f.x/WORLD*s,
      f.y/WORLD*s,
      2,
      2
    );
  }

  mapCtx.globalAlpha=1;

  if(mode==="robots"){

    for(const bot of robots){

      if(!bot.alive) continue;

      mapCtx.fillStyle=bot.color;

      mapCtx.beginPath();

      mapCtx.arc(
        bot.x/WORLD*s,
        bot.y/WORLD*s,
        3,
        0,
        Math.PI*2
      );

      mapCtx.fill();
    }
  }

  if(mode==="multi"){

    for(const id in others){

      const p=others[id];

      if(!p || p.alive===false) continue;

      mapCtx.fillStyle=p.color || "#ff5268";

      mapCtx.beginPath();

      mapCtx.arc(
        p.x/WORLD*s,
        p.y/WORLD*s,
        4,
        0,
        Math.PI*2
      );

      mapCtx.fill();
    }
  }

  mapCtx.fillStyle=me.color;

  mapCtx.beginPath();

  mapCtx.arc(
    me.x/WORLD*s,
    me.y/WORLD*s,
    5,
    0,
    Math.PI*2
  );

  mapCtx.fill();

  mapCtx.strokeStyle="#63ff78";
  mapCtx.lineWidth=2;

  mapCtx.strokeRect(
    1,
    1,
    s-2,
    s-2
  );
}

function renderGameLeaderboard(){

  const entries=[];

  entries.push({
    name:me.name,
    score:Math.floor(score),
    color:me.color
  });

  if(mode==="robots"){

    for(const bot of robots){

      entries.push({
        name:bot.name,
        score:Math.floor(bot.score || bot.length),
        color:bot.color
      });
    }
  }

  if(mode==="multi"){

    for(const id in others){

      const p=others[id];

      if(!p) continue;

      entries.push({
        name:p.name || "Player",
        score:Math.floor(p.length || 0),
        color:p.color
      });
    }
  }

  entries.sort(
    (a,b)=>b.score-a.score
  );

  const box =
    document.getElementById("gameRanks");

  box.innerHTML="";

  entries.slice(0,6).forEach((p,i)=>{

    const row=
      document.createElement("div");

    row.className="rank";

    row.innerHTML=
      `<span style="color:${p.color}">
      ${i+1}. ${escapeHtml(p.name)}
      </span>
      <b>${p.score}</b>`;

    box.appendChild(row);
  });
}

function showKill(){

  const el =
    document.getElementById("killText");

  el.classList.add("show");

  setTimeout(()=>{
    el.classList.remove("show");
  },900);
}

function die(reason){

  if(dead) return;

  dead=true;
  running=false;

  const earned =
    Math.floor(score/100);

  if(earned>0){
    coins+=earned;
  }

  save();
  renderCoins();

  addLeaderboard(
    me.name,
    score
  );

  document.getElementById("deathReason")
    .textContent=reason;

  document.getElementById("finalScore")
    .textContent=Math.floor(score);

  document.getElementById("deathCoins")
    .textContent=earned;

  document.getElementById("gameOver")
    .style.display="flex";
}

document.getElementById("againBtn").onclick=()=>{
  document.getElementById("gameOver")
    .style.display="none";

  startGame(mode);
};

document.getElementById("menuBtn").onclick=()=>{

  document.getElementById("gameOver")
    .style.display="none";

  document.getElementById("game")
    .style.display="none";

  document.getElementById("hud")
    .style.display="none";

  document.getElementById("leaderboard")
    .style.display="none";

  document.getElementById("minimap")
    .style.display="none";

  showScreen("mainMenu");
};

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

connect();
loop();
</script>

</body>
</html>
