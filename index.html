<script>

/* =====================================================
   SERVER
===================================================== */

let socket=null;
let multiplayer=false;
let myServerId=null;
let roomCode=null;

let remotePlayers=new Map();

function connectServer(){

    const protocol=
        location.protocol==="https:"
        ?"wss:"
        :"ws:";

    socket=new WebSocket(
        protocol+"//"+location.host
    );

    socket.onopen=()=>{

        document.getElementById(
            "connection"
        ).textContent=
            "🟢 Server ühendatud";

    };

    socket.onclose=()=>{

        document.getElementById(
            "connection"
        ).textContent=
            "🔴 Server ühendus katkes";

    };

    socket.onerror=()=>{

        document.getElementById(
            "connection"
        ).textContent=
            "🔴 Serveriga ei saa ühendust";

    };

    socket.onmessage=e=>{

        let data;

        try{
            data=JSON.parse(e.data);
        }
        catch{
            return;
        }

        if(data.type==="roomCreated"){

            multiplayer=true;

            myServerId=data.id;
            roomCode=data.code;

            document.getElementById(
                "roomCode"
            ).textContent=roomCode;

            document.getElementById(
                "roomBox"
            ).style.display="block";

            clearError();
        }

        if(data.type==="roomJoined"){

            multiplayer=true;

            myServerId=data.id;
            roomCode=data.code;

            document.getElementById(
                "roomCode"
            ).textContent=roomCode;

            document.getElementById(
                "roomBox"
            ).style.display="block";

            clearError();
        }

        if(data.type==="state"){

            remotePlayers.clear();

            for(const p of data.players||[]){

                if(p.id!==myServerId){

                    remotePlayers.set(
                        p.id,
                        p
                    );

                }

            }

            renderRoomPlayers(
                data.players||[]
            );
        }

        if(data.type==="gameStarted"){

            startGame(false);

        }

        if(data.type==="kill"){

            if(data.killerId===myServerId){

                showKill();

            }

        }

        if(data.type==="error"){

            showError(
                data.message||"Viga"
            );

        }

    };

}

function sendServer(data){

    if(
        socket &&
        socket.readyState===WebSocket.OPEN
    ){

        socket.send(
            JSON.stringify(data)
        );

    }

}

function renderRoomPlayers(players){

    const cx=
        r.left+
        r.width/2;

    const cy=
        r.top+
        r.height/2;

    let dx=x-cx;
    let dy=y-cy;

    const max=52;

    const d=
        Math.hypot(dx,dy);

    if(d>max){

        dx=
            dx/d*
            max;

        dy=
            dy/d*
            max;

    }

    stick.style.left=
        "calc(50% + "+
        dx+
        "px)";

    stick.style.top=
        "calc(50% + "+
        dy+
        "px)";

    if(d>7){

        me.targetAngle=
            Math.atan2(
                dy,
                dx
            );

    }

}

let boosting=false;
let dropTimer=0;

const boost=
    document.getElementById(
        "boost"

};

    boosting=false;
};

};

            boosting=true;

        }

/* =====================================================
   UPDATE
===================================================== */

function update(){

    if(!running||dead)
        return;

    if(innerWidth>800)
        mouseControl();

    let turn=
        me.targetAngle-
        me.angle;

    while(turn>Math.PI)
        turn-=Math.PI*2;

    while(turn<-Math.PI)
        turn+=Math.PI*2;

    me.angle+=turn*.18;

    const speed=
        boosting
        ?11
        :8.5;

    me.x+=
        Math.cos(me.angle)*
        speed;

    me.y+=
        Math.sin(me.angle)*
        speed;

    if(
        me.x<40||
        me.x>WORLD-40||
        me.y<40||
        me.y>WORLD-40
    ){

        die(
            "Läksid vastu kaardi piiri!"
        );

        return;

    }

    body.unshift({

        x:me.x,
        y:me.y

    });

    while(
        body.length<
        Math.floor(me.length)
    ){

        body.push({
            x:me.x,
            y:me.y
        });

    }

    while(
        body.length>
        Math.floor(me.length)
    ){

        body.pop();

    }

    eatFood();

    if(boosting)
        dropBoostPiece();

    if(single){

        updateBots();
        checkBotCollisions();

    }

    if(multiplayer){

        sendServer({

            type:"input",

            x:me.x,
            y:me.y,

            angle:me.angle,

            length:me.length,

            score:me.score,

            kills:me.kills,

            body:
                body.slice(
                    0,
                    300
                )

        });

    }

    updateHUD();

}

/* =====================================================
   FOOD
===================================================== */

function eatFood(){

    for(
        let i=foods.length-1;
        i>=0;
        i--
    ){

        const f=foods[i];

        if(
            Math.hypot(
                me.x-f.x,
                me.y-f.y
            )<
            25+f.radius
        ){

            me.score+=f.value;

            me.length+=
                f.value*.6;

            foods.splice(i,1);

            foods.push(
                newFood()
            );

        }

    }

}

/* =====================================================
   BOOST DROP
===================================================== */

function dropBoostPiece(){

    dropTimer--;

    if(
        dropTimer>0||
        me.length<30
    )
        return;

    dropTimer=8;

    const p=
        body[
            Math.min(
                12,
                body.length-1
            )
        ];

    foods.push({

        x:p.x,
        y:p.y,

        radius:6,

        value:4,

        color:me.color

    });

    me.length-=.12;

}

/* =====================================================
   BOTS
===================================================== */

function updateBots(){

    for(const bot of bots){

        bot.timer--;

        if(bot.timer<=0){

            bot.timer=
                30+
                Math.random()*100;

            const target=
                foods[
                    Math.floor(
                        Math.random()*
                        foods.length
                    )
                ];

            if(target){

                bot.targetAngle=
                    Math.atan2(
                        target.y-bot.y,
                        target.x-bot.x
                    );

            }

        }

        let turn=
            bot.targetAngle-
            bot.angle;

        while(turn>Math.PI)
            turn-=Math.PI*2;

        while(turn<-Math.PI)
            turn+=Math.PI*2;

        bot.angle+=
            turn*.07;

        bot.x+=
            Math.cos(bot.angle)*
            5.5;

        bot.y+=
            Math.sin(bot.angle)*
            5.5;

        if(
            bot.x<100||
            bot.x>WORLD-100
        ){

            bot.angle=
                Math.PI-
                bot.angle;

        }

        if(
            bot.y<100||
            bot.y>WORLD-100
        ){

            bot.angle=
                -bot.angle;

        }

        bot.body.unshift({

            x:bot.x,
            y:bot.y

        });

        while(
            bot.body.length<
            Math.floor(bot.length)
        ){

            bot.body.push({
                x:bot.x,
                y:bot.y
            });

        }

        while(
            bot.body.length>
            Math.floor(bot.length)
        ){

            bot.body.pop();

        }

        for(
            let i=foods.length-1;
            i>=0;
            i--
        ){

            const f=foods[i];

            if(
                Math.hypot(
                    bot.x-f.x,
                    bot.y-f.y
                )<24
            ){

                bot.length+=
                    f.value*.5;

                foods.splice(i,1);

                foods.push(
                    newFood()
                );

                break;

            }

        }

    }

}

/* =====================================================
   COLLISIONS
===================================================== */

function checkBotCollisions(){

    for(
        const bot of [...bots]
    ){

        /*
           BOTI KEHA
           TABAB SINU PEAD
        */

        for(
            let i=8;
            i<bot.body.length;
            i++
        ){

            const p=
                bot.body[i];

            if(
                Math.hypot(
                    me.x-p.x,
                    me.y-p.y
                )<22
            ){

                die(
                    bot.name+
                    " keha tabas sinu pead!"
                );

                return;

            }

        }

        /*
           SINU KEHA TABAB BOTI PEAD
        */

        for(
            let i=8;
            i<body.length;
            i++
        ){

            const p=body[i];

            if(
                Math.hypot(
                    bot.x-p.x,
                    bot.y-p.y
                )<23
            ){

                killBot(bot);

                break;

            }

        }

        /*
           PEA vs PEA
        */

        if(
            Math.hypot(
                me.x-bot.x,
                me.y-bot.y
            )<35
        ){

            if(
                me.length>=bot.length
            ){

                killBot(bot);

            }
            else{

                die(
                    bot.name+
                    " võitis!"
                );

                return;

            }

        }

    }

}

/* =====================================================
   MULTIPLAYER COLLISIONS
===================================================== */

function checkMultiplayerCollisions(){

    if(
        !multiplayer||
        !running||
        dead
    )
        return;

    for(
        const p of remotePlayers.values()
    ){

        if(
            !p.body||
            !p.body.length
        )
            continue;

        /*
           VASTASE KEHA
        */

        for(
            let i=8;
            i<p.body.length;
            i++
        ){

            const part=
                p.body[i];

            if(
                Math.hypot(
                    me.x-part.x,
                    me.y-part.y
                )<22
            ){

                die(
                    p.name+
                    " keha tabas sinu pead!"
                );

                return;

            }

        }

    }

}

    ctx.save();

        );

    );

/* =====================================================
   OBJECTS
===================================================== */

function drawMapObjects(){

    for(
        const o of mapObjects
    ){

        if(
            Math.abs(o.x-me.x)>
                W+300||
            Math.abs(o.y-me.y)>
                H+300
        )
            continue;

        if(o.type==="tree"){

            ctx.fillStyle=
                "rgba(0,0,0,.3)";

            ctx.beginPath();

            ctx.ellipse(
                o.x,
                o.y+
                    o.size*.65,
                o.size,
                o.size*.35,
                0,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.fillStyle="#70482d";

            ctx.fillRect(
                o.x-7,
                o.y,
                14,
                o.size*.8
            );

            ctx.fillStyle="#1c6828";

            ctx.beginPath();

            ctx.arc(
                o.x,
                o.y,
                o.size,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.fillStyle="#2d8739";

            ctx.beginPath();

            ctx.arc(
                o.x-o.size*.35,
                o.y-o.size*.2,
                o.size*.55,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.fillStyle="#49a34b";

            ctx.beginPath();

            ctx.arc(
                o.x+o.size*.3,
                o.y-o.size*.3,
                o.size*.4,
                0,
                Math.PI*2
            );

            ctx.fill();

        }

        else if(o.type==="rock"){

            ctx.fillStyle=
                "rgba(0,0,0,.25)";

            ctx.beginPath();

            ctx.ellipse(
                o.x,
                o.y+o.size*.5,
                o.size,
                o.size*.35,
                0,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.fillStyle="#65716a";

            ctx.beginPath();

            ctx.moveTo(
                o.x-o.size,
                o.y+o.size*.4
            );

            ctx.lineTo(
                o.x-o.size*.5,
                o.y-o.size*.7
            );

            ctx.lineTo(
                o.x+o.size*.35,
                o.y-o.size
            );

            ctx.lineTo(
                o.x+o.size,
                o.y
            );

            ctx.lineTo(
                o.x+o.size*.55,
                o.y+o.size*.65
            );

            ctx.closePath();

            ctx.fill();

        }

        else{

            ctx.fillStyle="#245d2c";

            ctx.beginPath();

            ctx.arc(
                o.x,
                o.y,
                o.size,
                0,
                Math.PI*2
            );

            ctx.fill();

            ctx.fillStyle="#36823d";

            ctx.beginPath();

            ctx.arc(
                o.x-o.size*.3,
                o.y-o.size*.2,
                o.size*.55,
                0,
                Math.PI*2
            );

            ctx.fill();

        }

    }

}

/* =====================================================
   SNAKE DRAW
===================================================== */

function drawSnake(
    snake,
    snakeBody
){

    if(
        !snakeBody||
        !snakeBody.length
    )
        return;

    for(
        let i=
            snakeBody.length-1;
        i>=0;
        i--
    ){

        const p=
            snakeBody[i];

        const progress=
            i/
            snakeBody.length;

        const radius=
            8+
            (1-progress)*8;

        ctx.globalAlpha=
            .96-
            progress*.12;

        ctx.fillStyle=
            snake.color;

        ctx.shadowColor=
            snake.color;

        ctx.shadowBlur=
            i<15?8:2;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            radius,
            0,
            Math.PI*2
        );

        ctx.fill();

        /*
           särav detail
        */

        ctx.fillStyle=
            "rgba(255,255,255,.16)";

        ctx.beginPath();

        ctx.arc(
            p.x-radius*.25,
            p.y-radius*.25,
            radius*.22,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.globalAlpha=1;

    ctx.shadowBlur=0;

    drawHead(
        snake.x,
        snake.y,
        snake.color,
        snake.skin,
        snake.angle
    );

    drawName(
        snake.name,
        snake.x,
        snake.y-43
    );

}

    );

    ctx.fill();

/* =====================================================

function drawName(
    name,
    x,
    y
){

    if(!name)
        return;

    ctx.save();

    ctx.textAlign="center";

    ctx.textBaseline="middle";

    ctx.font=
        "bold 14px Arial";

    const text=
        String(name)
        .slice(0,16);

    const width=
        ctx.measureText(
            text
        ).width;

    ctx.fillStyle=
        "rgba(0,0,0,.72)";

    roundRect(
        x-width/2-7,
        y-10,
        width+14,
        20,
        7
    );

    ctx.fill();

    ctx.fillStyle="white";

    ctx.shadowColor="black";

    ctx.shadowBlur=4;

    ctx.fillText(
        text,
        x,
        y
    );

    ctx.restore();

}

/* =====================================================
   ROUND RECT
===================================================== */

function roundRect(
    x,
    y,
    w,
    h,
    r
){

    ctx.beginPath();

    ctx.moveTo(
        x+r,
        y
    );

    ctx.lineTo(
        x+w-r,
        y
    );

    ctx.quadraticCurveTo(
        x+w,
        y,
        x+w,
        y+r
    );

    ctx.lineTo(
        x+w,
        y+h-r
    );

    ctx.quadraticCurveTo(
        x+w,
        y+h,
        x+w-r,
        y+h
    );

    ctx.lineTo(
        x+r,
        y+h
    );

    ctx.quadraticCurveTo(
        x,
        y+h,
        x,
        y+h-r
    );

    ctx.lineTo(
        x,
        y+r
    );

    ctx.quadraticCurveTo(
        x,
        y,
        x+r,
        y
    );

    ctx.closePath();

}

        drawMiniPlayer(
            bot.x,
            bot.y,
            "#ff5268",
            7,
            bot.name
        );

    }

    /*
       MULTIPLAYER
    */

    for(
        const p of remotePlayers.values()
    ){

        drawMiniPlayer(
            p.x,
            p.y,
            "#4da6ff",
            7,
            p.name
        );

    }

    /*
       SINA
    */

    drawMiniPlayer(
        me.x,
        me.y,
        "#63ff78",
        10,
        me.name
    );

    /*
       SUUNA NÄITAV KIIR
    */

    const mx=
        me.x/WORLD*
        size;

    const my=
        me.y/WORLD*
        size;

    miniCtx.strokeStyle="#63ff78";

    miniCtx.lineWidth=3;

    miniCtx.beginPath();

    miniCtx.moveTo(
        mx,
        my
    );

    miniCtx.lineTo(
        mx+
        Math.cos(me.angle)*20,
        my+
        Math.sin(me.angle)*20
    );

    miniCtx.stroke();

}

/* =====================================================
   MINIMAP PLAYER
===================================================== */

function drawMiniPlayer(
    x,
    y,
    color,
    radius,
    name
){

    const mx=
        x/WORLD*
        400;

    const my=
        y/WORLD*
        400;

    miniCtx.fillStyle=
        "rgba(0,0,0,.65)";

    miniCtx.beginPath();

    miniCtx.arc(
        mx,
        my,
        radius+3,
        0,
        Math.PI*2
    );

    miniCtx.fill();

    miniCtx.fillStyle=color;

    miniCtx.beginPath();

    miniCtx.arc(
        mx,
        my,
        radius,
        0,
        Math.PI*2
    );

    miniCtx.fill();

}

/* =====================================================

function updateLeaderboard(){

    const list=[

        {
            name:me.name,
            score:me.score,
            color:me.color
        }

    ];

    for(
        const bot of bots
    ){

        list.push({

            name:bot.name,

            score:bot.length,

            color:bot.color

        });

    }

    for(
        const p of remotePlayers.values()
    ){

        list.push({

            name:p.name,

            score:p.score||0,

            color:p.color||"#4da6ff"

        });

    }

    list.sort(
        (a,b)=>
            b.score-a.score
    );

    const box=
        document.getElementById(
            "lbRows"
        );

    box.innerHTML="";

    list
    .slice(0,3)
    .forEach(
        (p,i)=>{

            const row=
                document.createElement(
                    "div"
                );

            row.className=
                "lbRow";

            const left=
                document.createElement(
                    "span"
                );

            left.style.color=
                p.color;

            left.textContent=
                (i+1)+
                ". "+
                p.name;

            const right=
                document.createElement(
                    "b"
                );

            right.textContent=
                Math.floor(
                    p.score
                );

            row.appendChild(
                left
            );

            row.appendChild(
                right
            );

            box.appendChild(
                row
            );

        }
    );

}

function killBot(bot){

    const index=
        bots.indexOf(
            bot
        );

    if(index===-1)
        return;

    for(
        let i=0;
        i<bot.body.length;
        i+=3
    ){

        const p=
            bot.body[i];

        foods.push({

            x:p.x,
            y:p.y,

            radius:6,

            value:3,

            color:bot.color

        });

    }

    bots.splice(
        index,
        1
    );

    me.kills++;

    me.score+=10;

    me.length+=12;

    coins+=10;

    saveCoins();

    updateCoins();

    showKill();

    setTimeout(
        ()=>{

            if(
                running&&
                single&&
                !dead
            ){

                bots.push(
                    makeBot()
                );

            }

        },
        800
    );

}

function saveSkins(){

        "snakeOwned",
        JSON.stringify(

        )
    );

        "snakeSkin",
        selectedSkin

function renderSkins(){

    const box=
        document.getElementById(
            "skins"
        );

    box.innerHTML="";

    SKINS.forEach(
        skin=>{

            if(
                !owned.includes(
                    skin.id
                )
            )
                return;

            const b=
                document.createElement(
                    "button"
                );

            b.className=
                "skin "+
                (
                    selectedSkin===
                    skin.id
                    ?"selected"
                    :""
                );

            b.style.background=
                skin.color;

            b.onclick=()=>{

                selectedSkin=
                    skin.id;

                selected=
                    skin;

                me.color=
                    skin.color;

                me.skin=
                    skin.id;

                saveSkins();

                renderSkins();

                renderShop();

            };

            box.appendChild(
                b
            );

        }
    );

}

function renderShop(){

    const grid=
        document.getElementById(
            "shopGrid"
        );

    grid.innerHTML="";

    SKINS.forEach(
        skin=>{

            const item=
                document.createElement(
                    "div"
                );

            item.className=
                "shopItem";

            const have=
                owned.includes(
                    skin.id
                );

            item.innerHTML=`

                <div
                    class="preview"
                    style="
                    background:${skin.color};
                    box-shadow:
                    0 0 18px ${skin.color};
                    ">
                </div>

                <b>
                    ${skin.name}
                </b>

                <div
                    style="
                    color:#ffd84d;
                    margin-top:5px
                    "
                >
                    ${
                        skin.price===0
                        ?"TASUTA"
                        :"🪙 "+skin.price
                    }
                </div>

                <button
                    class="${have?"use":"buy"}"
                >
                    ${
                        have
                        ?"✓ KASUTA"
                        :"OSTA"
                    }
                </button>
            `;

            item
            .querySelector(
                "button"
            )
            .onclick=()=>{

                if(have){

                    selectedSkin=
                        skin.id;

                    selected=
                        skin;

                    me.color=
                        skin.color;

                    me.skin=
                        skin.id;

                    saveSkins();

                    renderSkins();

                    renderShop();

                    return;

                }

                if(
                    coins<
                    skin.price
                ){

                    alert(
                        "Sul on vaja veel "+
                        (
                            skin.price-
                            coins
                        )+
                        " coini."
                    );

                    return;

                }

                coins-=
                    skin.price;

                owned.push(
                    skin.id
                );

                selectedSkin=
                    skin.id;

                selected=
                    skin;

                me.color=
                    skin.color;

                me.skin=
                    skin.id;

                saveCoins();

                saveSkins();

                updateCoins();

                renderSkins();

                renderShop();

            };

            grid.appendChild(
                item
            );

        }
    );

}
