<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Snake Arena</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#030603;
    font-family:Arial,sans-serif;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

#menu{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(
            circle at 50% 20%,
            #174f20,
            #061006 45%,
            #010201 90%
        );
}

.panel{
    width:min(92vw,430px);
    padding:25px;
    border-radius:25px;
    background:rgba(4,12,5,.97);
    border:1px solid #315c37;
    box-shadow:0 0 70px rgba(99,255,120,.15);
    text-align:center;
    color:white;
}

.logo{
    font-size:60px;
}

h1{
    color:#63ff78;
    font-size:38px;
}

.subtitle{
    color:#829384;
    margin:5px 0 20px;
}

input{
    width:100%;
    height:48px;
    margin:5px 0;
    padding:0 15px;
    border-radius:12px;
    border:1px solid #315c37;
    background:#071007;
    color:white;
    text-align:center;
    font-size:16px;
    outline:none;
}

button{
    border:0;
    cursor:pointer;
    font-weight:bold;
}

.mainBtn{
    width:100%;
    height:48px;
    margin-top:7px;
    border-radius:12px;
    font-size:15px;
}

.green{
    background:#63ff78;
    color:#031006;
}

.dark{
    background:#102014;
    color:white;
    border:1px solid #315b36;
}

#skins{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
    margin:12px 0;
}

.skin{
    width:50px;
    height:50px;
    border-radius:50%;
    border:3px solid transparent;
    font-size:23px;
}

.skin.selected{
    border-color:white;
    transform:scale(1.1);
}

#roomBox{
    display:none;
    margin-top:15px;
}

.roomTitle{
    color:#829384;
    font-size:11px;
}

#roomCode{
    color:#63ff78;
    font-size:32px;
    font-weight:bold;
    letter-spacing:6px;
    margin:5px;
}

#players{
    max-height:140px;
    overflow:auto;
    margin-top:8px;
}

.playerRow{
    padding:8px;
    margin:4px 0;
    background:#0b170d;
    border-radius:8px;
}

#startBtn{
    display:none;
    width:100%;
    height:48px;
    margin-top:10px;
    border-radius:12px;
}

#error{
    color:#ff6676;
    min-height:20px;
    margin-top:8px;
}

#connection{
    color:#718172;
    font-size:11px;
    margin-top:7px;
}

#hud{
    position:fixed;
    z-index:10;
    top:10px;
    left:10px;
    display:none;
    gap:6px;
}

.stat{
    padding:7px 10px;
    background:rgba(0,0,0,.65);
    border:1px solid rgba(99,255,120,.25);
    border-radius:10px;
    color:white;
}

.stat small{
    display:block;
    color:#78907c;
    font-size:9px;
}

.stat b{
    font-size:16px;
}

#minimap{
    position:fixed;
    z-index:10;
    top:10px;
    right:10px;
    width:150px;
    height:150px;
    display:none;
    border:2px solid #63ff78;
    border-radius:15px;
    background:#061007;
}

#joystick{
    position:fixed;
    z-index:15;
    left:22px;
    bottom:22px;
    width:145px;
    height:145px;
    display:none;
    border-radius:50%;
    background:rgba(99,255,120,.08);
    border:2px solid rgba(99,255,120,.35);
}

#stick{
    position:absolute;
    left:50%;
    top:50%;
    width:60px;
    height:60px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:#63ff78;
    border:3px solid white;
}

#boost{
    position:fixed;
    z-index:15;
    right:25px;
    bottom:30px;
    width:90px;
    height:90px;
    display:none;
    border-radius:50%;
    background:#087bb0;
    color:white;
    border:3px solid #a5e3ff;
    font-size:27px;
}

#killText{
    position:fixed;
    z-index:30;
    top:25%;
    left:50%;
    transform:translateX(-50%) scale(.7);
    opacity:0;
    color:#63ff78;
    font-size:38px;
    font-weight:bold;
    transition:.2s;
}

#killText.show{
    opacity:1;
    transform:translateX(-50%) scale(1);
}

#gameOver{
    position:fixed;
    inset:0;
    z-index:40;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.8);
}

.overPanel{
    width:min(90vw,390px);
    padding:30px;
    background:#081008;
    border:1px solid #315b36;
    border-radius:25px;
    color:white;
    text-align:center;
}

.overPanel h2{
    color:#ff596c;
    font-size:38px;
}

@media(max-width:800px){

    #joystick,
    #boost{
        display:block;
    }

    #minimap{
        width:125px;
        height:125px;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="menu">

<div class="panel">

<div class="logo">🐍</div>

<h1>SNAKE ARENA</h1>

<div class="subtitle">
Eat • Grow • Fight
</div>

<input
id="name"
maxlength="16"
placeholder="Sinu nimi"
autocomplete="off">

<h3>🎨 Skin</h3>

<div id="skins">

<button class="skin selected"
data-color="#63ff78"
data-skin="green"
style="background:#63ff78">🐍</button>

<button class="skin"
data-color="#4da6ff"
data-skin="blue"
style="background:#4da6ff">😎</button>

<button class="skin"
data-color="#ff5570"
data-skin="red"
style="background:#ff5570">😈</button>

<button class="skin"
data-color="#ffd84d"
data-skin="yellow"
style="background:#ffd84d">😄</button>

<button class="skin"
data-color="#b86cff"
data-skin="purple"
style="background:#b86cff">👾</button>

<button class="skin"
data-color="#ff8a3d"
data-skin="orange"
style="background:#ff8a3d">🔥</button>

<button class="skin"
data-color="#ffffff"
data-skin="white"
style="background:white;color:black">👻</button>

<button class="skin"
data-color="#00e5d4"
data-skin="cyan"
style="background:#00e5d4">🤖</button>

</div>

<button id="createBtn"
class="mainBtn green">
🏠 CREATE ROOM
</button>

<input
id="roomInput"
maxlength="6"
placeholder="ROOM CODE">

<button id="joinBtn"
class="mainBtn dark">
🚪 JOIN ROOM
</button>

<div id="roomBox">

<div class="roomTitle">
ROOM CODE
</div>

<div id="roomCode">
------
</div>

<div id="players"></div>

<button id="startBtn"
class="green">
▶ START GAME
</button>

</div>

<div id="error"></div>

<div id="connection">
Ühendamine...
</div>

</div>
</div>

<div id="hud">

<div class="stat">
<small>SCORE</small>
<b id="score">0</b>
</div>

<div class="stat">
<small>LENGTH</small>
<b id="length">20</b>
</div>

<div class="stat">
<small>KILLS</small>
<b id="kills">0</b>
</div>

<div class="stat">
<small>PLAYERS</small>
<b id="playerCount">1</b>
</div>

</div>

<canvas
id="minimap"
width="150"
height="150">
</canvas>

<div id="killText">
💥 ELIMINATED!
</div>

<div id="joystick">
<div id="stick"></div>
</div>

<button id="boost">
⚡
</button>

<div id="gameOver">

<div class="overPanel">

<h2>GAME OVER</h2>

<p id="deathReason">
Sind tapetud!
</p>

<p style="margin-top:10px">
Skoor:
<b id="finalScore">0</b>
</p>

<button
class="mainBtn green"
style="margin-top:20px"
onclick="location.reload()">
🔄 TAGASI MENÜÜS
</button>

</div>
</div>

<script>
const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

const minimap =
document.getElementById("minimap");

const mapCtx =
minimap.getContext("2d");

let W = innerWidth;
let H = innerHeight;

function resize(){
    W = innerWidth;
    H = innerHeight;

    canvas.width = W;
    canvas.height = H;
}

addEventListener("resize",resize);
resize();

const WORLD = 20000;

const me = {
    id:null,
    x:10000,
    y:10000,
    angle:0,
    targetAngle:0,
    length:20,
    color:"#63ff78",
    skin:"green",
    name:"Player",
    score:0,
    kills:0
};

let body = [];
let others = {};

let foods = [];

let running = false;
let dead = false;
let boosting = false;

for(let i=0;i<600;i++){

    foods.push({
        x:Math.random()*WORLD,
        y:Math.random()*WORLD,
        r:3+Math.random()*4,
        color:[
            "#63ff78",
            "#ffd84d",
            "#ff6075",
            "#55c9ff",
            "#c76cff",
            "#ff963d"
        ][Math.floor(Math.random()*6)]
    });
}

let socket = null;
let connected = false;

function connect(){

    const protocol =
        location.protocol === "https:"
        ? "wss:"
        : "ws:";

    socket = new WebSocket(
        protocol+"//"+location.host
    );

    socket.onopen = () => {

        connected = true;

        setConnection(
            "🟢 Server ühendatud"
        );
    };

    socket.onclose = () => {

        connected = false;

        setConnection(
            "🔴 Ühendus katkes"
        );
    };

    socket.onerror = () => {

        setConnection(
            "🔴 Serveri viga"
        );
    };

    socket.onmessage = e => {

        let data;

        try {
            data = JSON.parse(e.data);
        } catch {
            return;
        }

        handleServer(data);
    };
}

function send(data){

    if(
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ){
        return;
    }

    socket.send(
        JSON.stringify(data)
    );
}

function handleServer(data){

    if(data.type === "connected"){

        me.id = data.id;

        return;
    }

    if(data.type === "roomCreated"){

        me.id = data.id;

        showRoom(data.code);

        return;
    }

    if(data.type === "roomJoined"){

        me.id = data.id;

        showRoom(data.code);

        return;
    }

    if(data.type === "lobby"){

        updateLobby(
            data.players || []
        );

        return;
    }

    if(data.type === "gameStart"){

        me.id = data.id;

        startGame();

        return;
    }

    if(data.type === "players"){

        others = data.players || {};

        updatePlayerCount();

        return;
    }

    if(data.type === "kill"){

        me.kills++;

        me.score = data.score || me.score;

        document.getElementById("kills")
            .textContent = me.kills;

        showKill();

        return;
    }

    if(data.type === "gameOver"){

        die(
            data.reason || "Sind tapetud!"
        );

        return;
    }

    if(data.type === "error"){

        showError(data.message);

        return;
    }
}

function playerName(){

    return (
        document
        .getElementById("name")
        .value
        .trim() || "Player"
    ).substring(0,16);
}

function showRoom(code){

    document.getElementById(
        "roomBox"
    ).style.display = "block";

    document.getElementById(
        "roomCode"
    ).textContent = code;
}

function updateLobby(players){

    const box =
        document.getElementById(
            "players"
        );

    box.innerHTML = "";

    players.forEach(p => {

        const row =
            document.createElement("div");

        row.className = "playerRow";

        row.textContent =
            (p.host ? "👑 " : "🐍 ") +
            p.name;

        row.style.color =
            p.color || "white";

        box.appendChild(row);
    });

    const mePlayer =
        players.find(
            p => p.id === me.id
        );

    if(mePlayer && mePlayer.host){

        document.getElementById(
            "startBtn"
        ).style.display = "block";
    }
}

function setConnection(text){

    document.getElementById(
        "connection"
    ).textContent = text;
}

function showError(text){

    document.getElementById(
        "error"
    ).textContent = text || "";
}

function updatePlayerCount(){

    document.getElementById(
        "playerCount"
    ).textContent =
        Math.max(
            1,
            Object.values(others)
                .filter(p => p.alive !== false)
                .length
        );
}

document.querySelectorAll(".skin")
.forEach(button => {

    button.onclick = () => {

        document.querySelectorAll(".skin")
        .forEach(b =>
            b.classList.remove("selected")
        );

        button.classList.add("selected");

        me.color =
            button.dataset.color;

        me.skin =
            button.dataset.skin;
    };
});

document.getElementById("createBtn")
.onclick = () => {

    showError("");

    if(!connected){

        showError(
            "Serveriga pole ühendust."
        );

        return;
    }

    send({
        type:"createRoom",
        name:playerName(),
        color:me.color,
        skin:me.skin
    });
};

document.getElementById("joinBtn")
.onclick = () => {

    showError("");

    const code =
        document.getElementById(
            "roomInput"
        ).value
        .trim()
        .toUpperCase();

    if(code.length !== 6){

        showError(
            "Room code peab olema 6 märki."
        );

        return;
    }

    send({
        type:"joinRoom",
        code,
        name:playerName(),
        color:me.color,
        skin:me.skin
    });
};

document.getElementById("startBtn")
.onclick = () => {

    send({
        type:"startGame"
    });
};

const keys = {};

addEventListener("keydown",e => {

    keys[e.key.toLowerCase()] = true;

    if(e.key === "Shift"){
        boosting = true;
    }
});

addEventListener("keyup",e => {

    keys[e.key.toLowerCase()] = false;

    if(e.key === "Shift"){
        boosting = false;
    }
});

function keyboardDirection(){

    let dx = 0;
    let dy = 0;

    if(keys.w || keys.arrowup) dy--;
    if(keys.s || keys.arrowdown) dy++;
    if(keys.a || keys.arrowleft) dx--;
    if(keys.d || keys.arrowright) dx++;

    if(dx || dy){

        me.targetAngle =
            Math.atan2(dy,dx);
    }
}

addEventListener("mousemove",e => {

    if(!running) return;

    if(innerWidth <= 800) return;

    const dx =
        e.clientX - W/2;

    const dy =
        e.clientY - H/2;

    if(Math.hypot(dx,dy) < 15){
        return;
    }

    me.targetAngle =
        Math.atan2(dy,dx);
});

const joystick =
    document.getElementById("joystick");

const stick =
    document.getElementById("stick");

let joyId = null;

function moveJoystick(x,y){

    const r =
        joystick.getBoundingClientRect();

    const cx =
        r.left + r.width/2;

    const cy =
        r.top + r.height/2;

    let dx = x-cx;
    let dy = y-cy;

    const max = 55;

    const d =
        Math.hypot(dx,dy);

    if(d > max){

        dx = dx/d*max;
        dy = dy/d*max;
    }

    stick.style.left =
        `calc(50% + ${dx}px)`;

    stick.style.top =
        `calc(50% + ${dy}px)`;

    if(d > 7){

        me.targetAngle =
            Math.atan2(dy,dx);
    }
}

function resetJoystick(){

    joyId = null;

    stick.style.left = "50%";
    stick.style.top = "50%";
}

joystick.onpointerdown = e => {

    joyId = e.pointerId;

    joystick.setPointerCapture(
        e.pointerId
    );

    moveJoystick(
        e.clientX,
        e.clientY
    );
};

joystick.onpointermove = e => {

    if(e.pointerId !== joyId) return;

    moveJoystick(
        e.clientX,
        e.clientY
    );
};

joystick.onpointerup = resetJoystick;
joystick.onpointercancel = resetJoystick;

const boost =
    document.getElementById("boost");

boost.onpointerdown = () => {
    boosting = true;
};

boost.onpointerup = () => {
    boosting = false;
};

boost.onpointercancel = () => {
    boosting = false;
};

function startGame(){

    running = true;
    dead = false;

    me.score = 0;
    me.kills = 0;
    me.length = 20;

    document.getElementById(
        "menu"
    ).style.display = "none";

    document.getElementById(
        "hud"
    ).style.display = "flex";

    document.getElementById(
        "minimap"
    ).style.display = "block";

    me.x =
        7000 +
        Math.random()*6000;

    me.y =
        7000 +
        Math.random()*6000;

    me.angle =
        Math.random()*Math.PI*2;

    me.targetAngle =
        me.angle;

    body = [];

    for(let i=0;i<20;i++){

        body.push({
            x:me.x-
                Math.cos(me.angle)*i*8,

            y:me.y-
                Math.sin(me.angle)*i*8
        });
    }
}

function update(){

    if(!running || dead) return;

    keyboardDirection();

    let diff =
        me.targetAngle-me.angle;

    while(diff > Math.PI)
        diff -= Math.PI*2;

    while(diff < -Math.PI)
        diff += Math.PI*2;

    me.angle += diff*.14;

    const speed =
        boosting ? 7.5 : 4.5;

    me.x +=
        Math.cos(me.angle)*speed;

    me.y +=
        Math.sin(me.angle)*speed;

    me.x =
        Math.max(
            25,
            Math.min(
                WORLD-25,
                me.x
            )
        );

    me.y =
        Math.max(
            25,
            Math.min(
                WORLD-25,
                me.y
            )
        );

    body.unshift({
        x:me.x,
        y:me.y
    });

    while(
        body.length <
        Math.floor(me.length)
    ){
        body.push({
            x:me.x,
            y:me.y
        });
    }

    while(
        body.length >
        Math.floor(me.length)
    ){
        body.pop();
    }

    eatFood();

    if(
        boosting &&
        me.length > 20
    ){
        me.length -= .02;
    }

    document.getElementById(
        "score"
    ).textContent =
        Math.floor(me.score);

    document.getElementById(
        "length"
    ).textContent =
        Math.floor(me.length);

    document.getElementById(
        "kills"
    ).textContent =
        me.kills;

    send({
        type:"state",
        x:me.x,
        y:me.y,
        angle:me.angle,
        length:me.length,
        color:me.color,
        skin:me.skin,
        name:playerName()
    });
}

function eatFood(){

    for(let i=foods.length-1;i>=0;i--){

        const f = foods[i];

        if(
            Math.hypot(
                f.x-me.x,
                f.y-me.y
            ) < 25
        ){

            me.score += 10;
            me.length += .5;

            foods[i] = {
                x:Math.random()*WORLD,
                y:Math.random()*WORLD,
                r:3+Math.random()*4,
                color:[
                    "#63ff78",
                    "#ffd84d",
                    "#ff6075",
                    "#55c9ff",
                    "#c76cff",
                    "#ff963d"
                ][Math.floor(Math.random()*6)]
            };
        }
    }
}

let cameraX = me.x;
let cameraY = me.y;

function draw(){

    ctx.fillStyle = "#071008";

    ctx.fillRect(
        0,0,W,H
    );

    if(!running) return;

    cameraX +=
        (me.x-cameraX)*.1;

    cameraY +=
        (me.y-cameraY)*.1;

    ctx.save();

    ctx.translate(
        W/2-cameraX,
        H/2-cameraY
    );

    drawGrid();
    drawBorder();
    drawFood();
    drawOthers();
    drawMe();

    ctx.restore();

    drawMinimap();
}

function drawGrid(){

    const grid = 250;

    const left =
        cameraX-W/2-500;

    const right =
        cameraX+W/2+500;

    const top =
        cameraY-H/2-500;

    const bottom =
        cameraY+H/2+500;

    ctx.strokeStyle =
        "rgba(99,255,120,.045)";

    ctx.lineWidth = 1;

    for(
        let x=Math.floor(left/grid)*grid;
        x<right;
        x+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(x,top);
        ctx.lineTo(x,bottom);

        ctx.stroke();
    }

    for(
        let y=Math.floor(top/grid)*grid;
        y<bottom;
        y+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(left,y);
        ctx.lineTo(right,y);

        ctx.stroke();
    }
}

function drawBorder(){

    ctx.strokeStyle = "#63ff78";
    ctx.lineWidth = 18;

    ctx.strokeRect(
        0,0,WORLD,WORLD
    );
}

function drawFood(){

    for(const f of foods){

        if(
            Math.abs(f.x-cameraX)>W ||
            Math.abs(f.y-cameraY)>H
        ) continue;

        ctx.fillStyle = f.color;

        ctx.shadowColor = f.color;
        ctx.shadowBlur = 10;

        ctx.beginPath();

        ctx.arc(
            f.x,
            f.y,
            f.r,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.shadowBlur = 0;
}

function drawSnakeBody(
    p,
    isMe
){

    const length =
        Math.min(
            300,
            Math.floor(p.length || 20)
        );

    for(
        let i=length-1;
        i>=0;
        i--
    ){

        let x,y;

        if(isMe && body[i]){

            x = body[i].x;
            y = body[i].y;

        }else{

            x =
                p.x-
                Math.cos(p.angle)*i*8;

            y =
                p.y-
                Math.sin(p.angle)*i*8;
        }

        const progress = i/length;

        const radius =
            8+(1-progress)*8;

        ctx.globalAlpha =
            1-progress*.25;

        ctx.fillStyle =
            p.color || "#63ff78";

        ctx.beginPath();

        ctx.arc(
            x,y,radius,
            0,Math.PI*2
        );

        ctx.fill();
    }

    ctx.globalAlpha = 1;
}

function drawHead(p){

    ctx.save();

    ctx.translate(
        p.x,
        p.y
    );

    ctx.rotate(
        p.angle
    );

    ctx.fillStyle =
        p.color || "#63ff78";

    ctx.shadowColor =
        p.color || "#63ff78";

    ctx.shadowBlur = 18;

    ctx.beginPath();

    ctx.arc(
        0,0,22,
        0,Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur = 0;

    /*
    Skin katab kogu pea.
    */

    if(p.skin === "red"){

        ctx.strokeStyle = "#ffd0d7";
        ctx.lineWidth = 4;

        ctx.beginPath();

        ctx.arc(
            0,0,17,
            0,Math.PI*2
        );

        ctx.stroke();
    }

    if(p.skin === "blue"){

        ctx.strokeStyle = "#d5f3ff";
        ctx.lineWidth = 4;

        ctx.beginPath();

        ctx.arc(
            0,0,17,
            0,Math.PI*2
        );

        ctx.stroke();
    }

    if(p.skin === "purple"){

        ctx.fillStyle = "#f0c9ff";

        for(let i=0;i<6;i++){

            const a =
                i*Math.PI/3;

            ctx.beginPath();

            ctx.arc(
                Math.cos(a)*13,
                Math.sin(a)*13,
                3,
                0,
                Math.PI*2
            );

            ctx.fill();
        }
    }

    if(p.skin === "orange"){

        ctx.strokeStyle = "#ffe2c5";
        ctx.lineWidth = 3;

        for(let i=-1;i<=1;i++){

            ctx.beginPath();

            ctx.moveTo(
                -16,
                i*7
            );

            ctx.lineTo(
                16,
                i*7
            );

            ctx.stroke();
        }
    }

    /*
    Nägu
    */

    ctx.fillStyle = "white";

    ctx.beginPath();

    ctx.arc(
        9,-7,6,
        0,Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        9,7,6,
        0,Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle = "#111";

    ctx.beginPath();

    ctx.arc(
        11,-7,3,
        0,Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        11,7,3,
        0,Math.PI*2
    );

    ctx.fill();

    ctx.restore();
}

function drawMe(){

    drawSnakeBody(
        me,
        true
    );

    drawHead(me);

    drawName(
        playerName(),
        me.x,
        me.y-32
    );
}

function drawOthers(){

    for(const id in others){

        if(id === me.id) continue;

        const p = others[id];

        if(!p || p.alive === false)
            continue;

        drawSnakeBody(
            p,
            false
        );

        drawHead(p);

        drawName(
            p.name || "Player",
            p.x,
            p.y-32
        );
    }
}

function drawName(
    name,
    x,
    y
){

    ctx.save();

    ctx.textAlign = "center";
    ctx.font = "bold 12px Arial";

    ctx.fillStyle = "white";

    ctx.shadowColor = "black";
    ctx.shadowBlur = 5;

    ctx.fillText(
        name,
        x,
        y
    );

    ctx.restore();
}

function drawMinimap(){

    const s = minimap.width;

    mapCtx.clearRect(
        0,0,s,s
    );

    mapCtx.fillStyle = "#061007";

    mapCtx.fillRect(
        0,0,s,s
    );

    /*
    Teised mängijad
    */

    for(const id in others){

        if(id === me.id) continue;

        const p = others[id];

        if(!p || p.alive === false)
            continue;

        const x =
            p.x/WORLD*s;

        const y =
            p.y/WORLD*s;

        mapCtx.fillStyle =
            p.color || "#ff5268";

        mapCtx.beginPath();

        mapCtx.arc(
            x,y,4,
            0,Math.PI*2
        );

        mapCtx.fill();
    }

    /*
    Mina
    */

    const mx =
        me.x/WORLD*s;

    const my =
        me.y/WORLD*s;

    mapCtx.fillStyle =
        me.color;

    mapCtx.beginPath();

    mapCtx.arc(
        mx,my,6,
        0,Math.PI*2
    );

    mapCtx.fill();

    mapCtx.strokeStyle =
        "#63ff78";

    mapCtx.lineWidth = 2;

    mapCtx.strokeRect(
        1,1,s-2,s-2
    );
}

function showKill(){

    const el =
        document.getElementById(
            "killText"
        );

    el.classList.add("show");

    clearTimeout(
        showKill.timer
    );

    showKill.timer =
        setTimeout(
            () =>
                el.classList.remove("show"),
            900
        );
}

function die(reason){

    if(dead) return;

    dead = true;
    running = false;
    boosting = false;

    document.getElementById(
        "deathReason"
    ).textContent = reason;

    document.getElementById(
        "finalScore"
    ).textContent =
        Math.floor(me.score);

    document.getElementById(
        "gameOver"
    ).style.display = "flex";
}

function loop(){

    update();

    draw();

    requestAnimationFrame(loop);
}

connect();

loop();
</script>
