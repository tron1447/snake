<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Snake Arena</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
user-select:none;
-webkit-user-select:none;
touch-action:none;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#061006;
font-family:Arial,sans-serif;
}

canvas{
position:fixed;
inset:0;
width:100%;
height:100%;
}

button,input{
font:inherit;
}

button{
cursor:pointer;
}

#menu{
position:fixed;
inset:0;
z-index:100;
display:flex;
align-items:center;
justify-content:center;
overflow:auto;
padding:20px;
background:
radial-gradient(circle at 50% 10%,#286b34,#0a1b0d 45%,#020402);
}

.panel{
width:min(95vw,480px);
max-height:94vh;
overflow-y:auto;
padding:28px;
border-radius:28px;
background:rgba(4,12,5,.97);
border:1px solid rgba(99,255,120,.35);
box-shadow:0 0 70px rgba(99,255,120,.18);
color:white;
text-align:center;
}

.logo{
font-size:60px;
}

h1{
font-size:40px;
color:#63ff78;
margin-bottom:5px;
}

.sub{
color:#849887;
margin-bottom:20px;
}

input{
width:100%;
height:48px;
margin:5px 0;
padding:0 15px;
border-radius:12px;
border:1px solid #315c37;
background:#071007;
color:white;
text-align:center;
outline:none;
}

.btn{
width:100%;
height:48px;
border:0;
border-radius:12px;
margin-top:8px;
font-weight:bold;
}

.green{
background:#63ff78;
color:#031006;
}

.dark{
background:#102014;
color:white;
border:1px solid #315b36;
}

#skins{
display:flex;
flex-wrap:wrap;
justify-content:center;
gap:10px;
margin:12px 0 18px;
}

.skin{
width:58px;
height:58px;
border-radius:50%;
border:3px solid transparent;
font-size:25px;
}

.skin.selected{
border-color:white;
transform:scale(1.1);
box-shadow:0 0 20px currentColor;
}

#shop{
display:none;
}

.shopGrid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
margin-top:15px;
}

.shopItem{
padding:15px;
border-radius:15px;
background:#0b170d;
border:1px solid #294c2e;
}

.shopPreview{
font-size:38px;
}

.price{
color:#ffd84d;
margin:5px;
}

#roomBox{
display:none;
margin-top:15px;
}

#roomCode{
font-size:32px;
letter-spacing:7px;
color:#63ff78;
font-weight:bold;
margin:7px;
}

#players{
max-height:130px;
overflow:auto;
}

.playerRow{
padding:8px;
margin:4px;
background:#0b170d;
border-radius:8px;
}

#error{
min-height:20px;
color:#ff6075;
margin-top:8px;
}

#hud{
display:none;
position:fixed;
z-index:20;
left:10px;
top:10px;
gap:7px;
}

.stat{
background:rgba(0,0,0,.7);
border:1px solid rgba(99,255,120,.3);
border-radius:10px;
padding:7px 10px;
color:white;
}

.stat small{
display:block;
color:#829684;
font-size:9px;
}

.stat b{
font-size:16px;
}

#leaderboard{
position:fixed;
right:10px;
top:10px;
z-index:25;
width:190px;
padding:12px;
border-radius:15px;
background:rgba(0,0,0,.72);
border:1px solid rgba(99,255,120,.35);
color:white;
}

#leaderboard h3{
color:#ffd84d;
font-size:14px;
margin-bottom:7px;
}

.lb{
display:flex;
justify-content:space-between;
padding:4px 0;
font-size:12px;
}

#minimap{
position:fixed;
right:10px;
bottom:10px;
z-index:25;
width:150px;
height:150px;
border-radius:15px;
border:2px solid rgba(99,255,120,.7);
background:#061007;
}

#joystick{
position:fixed;
left:22px;
bottom:22px;
z-index:30;
width:140px;
height:140px;
border-radius:50%;
background:rgba(99,255,120,.08);
border:2px solid rgba(99,255,120,.35);
display:none;
}

#stick{
position:absolute;
left:50%;
top:50%;
width:60px;
height:60px;
transform:translate(-50%,-50%);
border-radius:50%;
background:#63ff78;
border:3px solid white;
}

#boost{
position:fixed;
right:25px;
bottom:30px;
z-index:30;
width:90px;
height:90px;
border-radius:50%;
border:3px solid #a5e3ff;
background:#087bb0;
color:white;
font-size:27px;
display:none;
}

#killText{
position:fixed;
left:50%;
top:23%;
z-index:40;
transform:translateX(-50%) scale(.6);
opacity:0;
pointer-events:none;
font-size:38px;
font-weight:900;
color:#63ff78;
text-shadow:0 0 20px #63ff78;
transition:.2s;
}

#killText.show{
opacity:1;
transform:translateX(-50%) scale(1);
}

#gameOver{
position:fixed;
inset:0;
z-index:200;
display:none;
align-items:center;
justify-content:center;
background:rgba(0,0,0,.8);
}

.over{
width:min(90vw,390px);
padding:30px;
border-radius:25px;
background:#081008;
border:1px solid #315b36;
text-align:center;
color:white;
}

.over h2{
font-size:38px;
color:#ff596c;
margin-bottom:10px;
}

@media(max-width:800px){
#joystick,#boost{
display:block;
}

#leaderboard{
width:155px;
font-size:11px;
}

#minimap{
width:120px;
height:120px;
}

#menu{
align-items:flex-start;
padding-top:15px;
}
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="menu">

<div class="panel">

<div class="logo">🐍</div>

<h1>SNAKE ARENA</h1>

<div class="sub">
Eat • Grow • Fight • Survive
</div>

<input id="name" maxlength="16" placeholder="Sinu nimi">

<h3>🎨 Vali skin</h3>

<div id="skins">

<button class="skin selected" data-color="#63ff78" data-skin="green" style="background:#63ff78">🐍</button>
<button class="skin" data-color="#4da6ff" data-skin="blue" style="background:#4da6ff">😎</button>
<button class="skin" data-color="#ff5570" data-skin="red" style="background:#ff5570">😈</button>
<button class="skin" data-color="#ffd84d" data-skin="yellow" style="background:#ffd84d">😄</button>
<button class="skin" data-color="#b86cff" data-skin="purple" style="background:#b86cff">👾</button>
<button class="skin" data-color="#ff8a3d" data-skin="orange" style="background:#ff8a3d">🔥</button>
<button class="skin" data-color="#ffffff" data-skin="white" style="background:white;color:black">👻</button>
<button class="skin" data-color="#00e5d4" data-skin="cyan" style="background:#00e5d4">🤖</button>

</div>

<button class="btn green" id="singleBtn">
🤖 SINGLEPLAYER — BOTS
</button>

<button class="btn dark" id="shopBtn">
🛍️ SKIN SHOP
</button>

<button class="btn green" id="createBtn">
🏠 CREATE ROOM
</button>

<input id="roomInput" maxlength="6" placeholder="ROOM CODE">

<button class="btn dark" id="joinBtn">
🚪 JOIN ROOM
</button>

<div id="roomBox">

<div style="color:#829684;font-size:11px">
ROOM CODE
</div>

<div id="roomCode">
------
</div>

<div id="players"></div>

<button class="btn green" id="startBtn">
▶ START GAME
</button>

</div>

<div id="shop">

<h2>🛍️ SKIN SHOP</h2>
<div style="margin:8px;color:#ffd84d">
🪙 Coins: <b id="coins">0</b>
</div>

<div class="shopGrid" id="shopGrid"></div>

<button class="btn dark" id="closeShop">
← TAGASI
</button>

</div>

<div id="error"></div>

<div id="connection">
🟡 Ühendamine...
</div>

</div>
</div>

<div id="hud">

<div class="stat">
<small>SCORE</small>
<b id="score">0</b>
</div>

<div class="stat">
<small>LENGTH</small>
<b id="length">25</b>
</div>

<div class="stat">
<small>🪙 COINS</small>
<b id="coinsHud">0</b>
</div>

</div>

<div id="leaderboard">
<h3>🏆 TOP 3</h3>
<div id="lbList"></div>
</div>

<canvas id="minimap" width="150" height="150"></canvas>

<div id="killText">
💥 ELIMINATED! +10 🪙
</div>

<div id="joystick">
<div id="stick"></div>
</div>

<button id="boost">⚡</button>

<div id="gameOver">

<div class="over">

<h2>GAME OVER</h2>

<p id="deathReason">
Sind tapetud!
</p>

<p style="margin-top:10px">
Skoor: <b id="finalScore">0</b>
</p>

<p>
Killid: <b id="finalKills">0</b>
</p>

<button class="btn green" onclick="location.reload()">
🔄 TAGASI MENÜÜS
</button>

</div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const minimap=document.getElementById("minimap");
const mctx=minimap.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){
W=innerWidth;
H=innerHeight;
canvas.width=W;
canvas.height=H;
}

addEventListener("resize",resize);
resize();

const WORLD=20000;

const food=[];
const FOOD_COUNT=1800;

const colors=[
"#63ff78",
"#ffd84d",
"#ff6075",
"#55c9ff",
"#c76cff",
"#ff963d"
];

function newFood(x,y,value){
return{
x:x??Math.random()*WORLD,
y:y??Math.random()*WORLD,
r:3+Math.random()*4,
color:colors[Math.floor(Math.random()*colors.length)],
value:value??(1+Math.floor(Math.random()*5))
};
}

for(let i=0;i<FOOD_COUNT;i++){
food.push(newFood());
}

const me={
id:null,
x:10000,
y:10000,
angle:0,
target:0,
length:25,
color:"#63ff78",
skin:"green",
name:"Player",
score:0,
kills:0,
coins:Number(localStorage.getItem("coins")||0)
};

let body=[];
let others={};
let bots=[];
let running=false;
let dead=false;
let singleplayer=false;
let boosting=false;
let cameraX=10000;
let cameraY=10000;
let socket=null;
let connected=false;

const skins=[
{
id:"green",
color:"#63ff78",
emoji:"🐍",
price:0
},
{
id:"blue",
color:"#4da6ff",
emoji:"😎",
price:20
},
{
id:"red",
color:"#ff5570",
emoji:"😈",
price:40
},
{
id:"yellow",
color:"#ffd84d",
emoji:"😄",
price:60
},
{
id:"purple",
color:"#b86cff",
emoji:"👾",
price:80
},
{
id:"orange",
color:"#ff8a3d",
emoji:"🔥",
price:100
},
{
id:"white",
color:"#ffffff",
emoji:"👻",
price:150
},
{
id:"cyan",
color:"#00e5d4",
emoji:"🤖",
price:200
}
];

let owned=JSON.parse(
localStorage.getItem("ownedSkins")||'["green"]'
);

function saveCoins(){
localStorage.setItem("coins",String(me.coins));
}

function setSkin(id){
const s=skins.find(x=>x.id===id);
if(!s)return;

me.skin=s.id;
me.color=s.color;
}

document.querySelectorAll(".skin").forEach(btn=>{
btn.onclick=()=>{
setSkin(btn.dataset.skin);

document.querySelectorAll(".skin")
.forEach(b=>b.classList.remove("selected"));

btn.classList.add("selected");
};
});

function renderShop(){
const grid=document.getElementById("shopGrid");
grid.innerHTML="";

document.getElementById("coins").textContent=me.coins;

skins.forEach(s=>{
const div=document.createElement("div");
div.className="shopItem";

const have=owned.includes(s.id);

div.innerHTML=`
<div class="shopPreview">${s.emoji}</div>
<div>${s.id.toUpperCase()}</div>
<div class="price">${s.price===0?"FREE":"🪙 "+s.price}</div>
<button class="btn ${have?"green":"dark"}">
${have?"USE":"BUY"}
</button>
`;

div.querySelector("button").onclick=()=>{
if(have){
setSkin(s.id);
renderShop();
return;
}

if(me.coins>=s.price){
me.coins-=s.price;
owned.push(s.id);
localStorage.setItem(
"ownedSkins",
JSON.stringify(owned)
);
saveCoins();
renderShop();
}else{
showError("Sul pole piisavalt coine!");
}
};

grid.appendChild(div);
});
}

document.getElementById("shopBtn").onclick=()=>{
document.querySelector("#skins").parentElement
.querySelector("h3").style.display="none";

document.getElementById("skins").style.display="none";

document.getElementById("shop").style.display="block";

renderShop();
};

document.getElementById("closeShop").onclick=()=>{
document.getElementById("shop").style.display="none";
document.querySelector("#skins").style.display="flex";
document.querySelector("#skins").parentElement
.querySelector("h3").style.display="block";
};

function showError(t){
document.getElementById("error").textContent=t||"";
}

function setConnection(t){
document.getElementById("connection").textContent=t;
}

function nameValue(){
return(
document.getElementById("name").value.trim()||
"Player"
).substring(0,16);
}

function connect(){
const protocol=
location.protocol==="https:"?"wss:":"ws:";

socket=new WebSocket(
protocol+"//"+location.host
);

socket.onopen=()=>{
connected=true;
setConnection("🟢 Server ühendatud");
};

socket.onclose=()=>{
connected=false;
setConnection("🔴 Ühendus katkes");
};

socket.onerror=()=>{
setConnection("🔴 Serveri viga");
};

socket.onmessage=e=>{
try{
handleServer(JSON.parse(e.data));
}catch(err){}
};
}

function send(data){
if(socket&&socket.readyState===WebSocket.OPEN){
socket.send(JSON.stringify(data));
}
}

function handleServer(data){

if(data.type==="connected"){
me.id=data.id;
return;
}

if(data.type==="roomCreated"||
data.type==="roomJoined"){

me.id=data.id||me.id;

document.getElementById("roomBox").style.display="block";
document.getElementById("roomCode").textContent=data.code;

return;
}

if(data.type==="lobby"){
renderLobby(data.players||[]);
return;
}

if(data.type==="gameStart"){
startMultiplayer();
return;
}

if(data.type==="players"){
others=data.players||{};
return;
}

if(data.type==="leaderboard"){
renderLeaderboard(data.players||[]);
return;
}

if(data.type==="kill"){
me.coins=data.coins;
me.kills=data.kills;
me.score=data.score;
saveCoins();
showKill();
return;
}

if(data.type==="gameOver"){
die(data.reason||"Sind tapetud!");
return;
}

if(data.type==="error"){
showError(data.message);
}
}

function renderLobby(players){
const box=document.getElementById("players");
box.innerHTML="";

players.forEach(p=>{
const row=document.createElement("div");
row.className="playerRow";
row.style.color=p.color||"white";

row.textContent=
(p.host?"👑 ":"🐍 ")+
p.name;

box.appendChild(row);
});

document.getElementById("startBtn").style.display=
players.length?"block":"none";
}

function renderLeaderboard(list){
const box=document.getElementById("lbList");
box.innerHTML="";

list.slice(0,3).forEach(p=>{
const row=document.createElement("div");
row.className="lb";

row.innerHTML=
`<span>${p.place}. ${escapeHtml(p.name)}</span>
<span>${p.score}</span>`;

box.appendChild(row);
});
}

function escapeHtml(s){
return String(s)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;");
}

document.getElementById("createBtn").onclick=()=>{
if(!connected){
showError("Serveriga ühendamine...");
return;
}

send({
type:"createRoom",
name:nameValue(),
color:me.color,
skin:me.skin
});
};

document.getElementById("joinBtn").onclick=()=>{
const code=
document.getElementById("roomInput")
.value.trim().toUpperCase();

if(code.length!==6){
showError("Room code peab olema 6 märki.");
return;
}

send({
type:"joinRoom",
code,
name:nameValue(),
color:me.color,
skin:me.skin
});
};

document.getElementById("startBtn").onclick=()=>{
send({type:"startGame"});
};

function setupPlayer(){
me.x=3000+Math.random()*14000;
me.y=3000+Math.random()*14000;
me.angle=Math.random()*Math.PI*2;
me.target=me.angle;
me.length=25;
me.score=0;
me.kills=0;
body=[];

for(let i=0;i<me.length;i++){
body.push({
x:me.x-Math.cos(me.angle)*i*10,
y:me.y-Math.sin(me.angle)*i*10
});
}

cameraX=me.x;
cameraY=me.y;
}

function startMultiplayer(){
singleplayer=false;
startGame();
}

document.getElementById("singleBtn").onclick=()=>{
singleplayer=true;
startGame();
};

function startGame(){
running=true;
dead=false;

setupPlayer();

document.getElementById("menu").style.display="none";
document.getElementById("hud").style.display="flex";

if(singleplayer){
createBots();
}
}

function createBots(){
bots=[];

const names=[
"Bot Alex",
"Bot Max",
"Bot Leo",
"Bot Mia",
"Bot Rex",
"Bot Zed",
"Bot Fox",
"Bot Luna",
"Bot King",
"Bot Pro"
];

for(let i=0;i<10;i++){

const angle=Math.random()*Math.PI*2;

bots.push({
id:"bot"+i,
x:2000+Math.random()*16000,
y:2000+Math.random()*16000,
angle:angle,
target:angle,
length:20+Math.random()*70,
color:colors[i%colors.length],
skin:skins[i%skins.length].id,
name:names[i],
score:Math.floor(Math.random()*100)
});
}
}

const keys={};

addEventListener("keydown",e=>{
keys[e.key.toLowerCase()]=true;

if(e.key==="Shift"){
boosting=true;
}
});

addEventListener("keyup",e=>{
keys[e.key.toLowerCase()]=false;

if(e.key==="Shift"){
boosting=false;
}
});

function keyboard(){
let dx=0;
let dy=0;

if(keys.w||keys.arrowup)dy--;
if(keys.s||keys.arrowdown)dy++;
if(keys.a||keys.arrowleft)dx--;
if(keys.d||keys.arrowright)dx++;

if(dx||dy){
me.target=Math.atan2(dy,dx);
}
}

addEventListener("mousemove",e=>{
if(!running||innerWidth<=800)return;

const dx=e.clientX-W/2;
const dy=e.clientY-H/2;

if(Math.hypot(dx,dy)>12){
me.target=Math.atan2(dy,dx);
}
});

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joyPointer=null;

function joystickMove(x,y){
const r=joystick.getBoundingClientRect();

const cx=r.left+r.width/2;
const cy=r.top+r.height/2;

let dx=x-cx;
let dy=y-cy;

const max=53;
const d=Math.hypot(dx,dy);

if(d>max){
dx=dx/d*max;
dy=dy/d*max;
}

stick.style.left=`calc(50% + ${dx}px)`;
stick.style.top=`calc(50% + ${dy}px)`;

if(d>8){
me.target=Math.atan2(dy,dx);
}
}

joystick.onpointerdown=e=>{
joyPointer=e.pointerId;
joystick.setPointerCapture(e.pointerId);
joystickMove(e.clientX,e.clientY);
};

joystick.onpointermove=e=>{
if(e.pointerId===joyPointer){
joystickMove(e.clientX,e.clientY);
}
};

function joyReset(){
joyPointer=null;
stick.style.left="50%";
stick.style.top="50%";
}

joystick.onpointerup=joyReset;
joystick.onpointercancel=joyReset;

const boostButton=document.getElementById("boost");

boostButton.onpointerdown=()=>{
boosting=true;
};

boostButton.onpointerup=()=>{
boosting=false;
};

boostButton.onpointercancel=()=>{
boosting=false;
};

function updatePlayer(){

keyboard();

let diff=me.target-me.angle;

while(diff>Math.PI)diff-=Math.PI*2;
while(diff<-Math.PI)diff+=Math.PI*2;

me.angle+=diff*.16;

let speed=boosting?8.5:5.2;

me.x+=Math.cos(me.angle)*speed;
me.y+=Math.sin(me.angle)*speed;

me.x=Math.max(30,Math.min(WORLD-30,me.x));
me.y=Math.max(30,Math.min(WORLD-30,me.y));

body.unshift({x:me.x,y:me.y});

while(body.length<Math.floor(me.length)){
const last=body[body.length-1]||{x:me.x,y:me.y};
body.push({...last});
}

while(body.length>Math.floor(me.length)){
body.pop();
}

eatFood();

if(boosting&&me.length>20){

me.length-=.035;

if(Math.random()<.13&&body.length>10){

const tail=body[body.length-1];

food.push(
newFood(
tail.x,
tail.y,
1
)
);
}
}

if(singleplayer){
updateBots();
checkBotCollisions();
}else{
sendState();
}

me.score=Math.floor(me.score);

document.getElementById("score").textContent=me.score;
document.getElementById("length").textContent=Math.floor(me.length);
document.getElementById("coinsHud").textContent=me.coins;
}

function eatFood(){

for(let i=food.length-1;i>=0;i--){

const f=food[i];

if(Math.hypot(
f.x-me.x,
f.y-me.y
)<24){

me.score+=f.value;
me.length+=f.value*.42;

food[i]=newFood();
}
}
}

function updateBots(){

for(const b of bots){

let dx=me.x-b.x;
let dy=me.y-b.y;

if(Math.random()<.015){
b.target+=
(Math.random()-.5)*1.7;
}

const dist=Math.hypot(dx,dy);

if(dist<700){
b.target=Math.atan2(dy,dx);
}

let d=b.target-b.angle;

while(d>Math.PI)d-=Math.PI*2;
while(d<-Math.PI)d+=Math.PI*2;

b.angle+=d*.06;

const speed=
b.boosting?7:4.1;

b.x+=Math.cos(b.angle)*speed;
b.y+=Math.sin(b.angle)*speed;

if(b.x<100||b.x>WORLD-100){
b.target=Math.PI-b.angle;
}

if(b.y<100||b.y>WORLD-100){
b.target=-b.angle;
}

b.x=Math.max(40,Math.min(WORLD-40,b.x));
b.y=Math.max(40,Math.min(WORLD-40,b.y));

for(let i=food.length-1;i>=0;i--){

const f=food[i];

if(Math.hypot(
f.x-b.x,
f.y-b.y
)<22){

b.length+=f.value*.3;
b.score+=f.value;
food[i]=newFood();
}
}
}
}

function checkBotCollisions(){

for(let i=bots.length-1;i>=0;i--){

const b=bots[i];

if(Math.hypot(
me.x-b.x,
me.y-b.y
)<40){

if(me.length>=b.length){
killBot(i);
}else{
die("Bot võitis sinu vastu!");
return;
}
}

const max=Math.min(
Math.floor(b.length),
100
);

for(let j=7;j<max;j++){

const bx=b.x-Math.cos(b.angle)*j*10;
const by=b.y-Math.sin(b.angle)*j*10;

if(Math.hypot(
me.x-bx,
me.y-by
)<24){

if(me.length>=b.length){
killBot(i);
}else{
die("Sõitsid Boti kehasse!");
return;
}

break;
}
}
}
}

function killBot(index){

const b=bots[index];

me.kills++;
me.coins+=10;
me.score+=100;
me.length+=Math.min(30,b.length*.25);

saveCoins();

showKill();

for(let i=0;i<20;i++){
food.push(
newFood(
b.x+(Math.random()-.5)*150,
b.y+(Math.random()-.5)*150,
3
)
);
}

bots.splice(index,1);

setTimeout(()=>{
if(singleplayer&&!dead){
bots.push({
id:"bot"+Date.now(),
x:1000+Math.random()*18000,
y:1000+Math.random()*18000,
angle:Math.random()*Math.PI*2,
target:Math.random()*Math.PI*2,
length:20+Math.random()*60,
color:colors[Math.floor(Math.random()*colors.length)],
skin:skins[Math.floor(Math.random()*skins.length)].id,
name:"Bot "+Math.floor(Math.random()*999)
});
}
},1000);
}

let lastSend=0;

function sendState(){

const now=performance.now();

if(now-lastSend<50)return;

lastSend=now;

send({
type:"state",
x:me.x,
y:me.y,
angle:me.angle,
length:me.length,
color:me.color,
skin:me.skin,
name:nameValue(),
boosting
});
}

function draw(){

ctx.fillStyle="#071008";
ctx.fillRect(0,0,W,H);

if(!running)return;

cameraX+=(me.x-cameraX)*.12;
cameraY+=(me.y-cameraY)*.12;

ctx.save();

ctx.translate(
W/2-cameraX,
H/2-cameraY
);

drawGrid();
drawBorder();
drawFood();

if(singleplayer){
for(const b of bots){
drawSnake(b,false);
}
}else{
for(const id in others){
if(id!==me.id){
drawSnake(others[id],false);
}
}
}

drawSnake(me,true);

ctx.restore();

drawMinimap();
}

function drawGrid(){

const grid=250;

const left=cameraX-W/2-500;
const right=cameraX+W/2+500;
const top=cameraY-H/2-500;
const bottom=cameraY+H/2+500;

ctx.strokeStyle="rgba(99,255,120,.05)";
ctx.lineWidth=1;

for(let x=Math.floor(left/grid)*grid;x<right;x+=grid){
ctx.beginPath();
ctx.moveTo(x,top);
ctx.lineTo(x,bottom);
ctx.stroke();
}

for(let y=Math.floor(top/grid)*grid;y<bottom;y+=grid){
ctx.beginPath();
ctx.moveTo(left,y);
ctx.lineTo(right,y);
ctx.stroke();
}
}

function drawBorder(){

ctx.strokeStyle="#63ff78";
ctx.lineWidth=18;
ctx.shadowColor="#63ff78";
ctx.shadowBlur=20;

ctx.strokeRect(0,0,WORLD,WORLD);

ctx.shadowBlur=0;
}

function drawFood(){

for(const f of food){

if(Math.abs(f.x-cameraX)>W||
Math.abs(f.y-cameraY)>H)continue;

ctx.fillStyle=f.color;
ctx.shadowColor=f.color;
ctx.shadowBlur=10;

ctx.beginPath();
ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
ctx.fill();
}

ctx.shadowBlur=0;
}

function drawSnake(p,isMe){

if(!p)return;

const length=Math.min(
Math.floor(p.length||25),
220
);

const color=p.color||"#63ff78";

ctx.save();

for(let i=length-1;i>=0;i--){

const x=
p.x-
Math.cos(p.angle)*i*10;

const y=
p.y-
Math.sin(p.angle)*i*10;

const progress=i/length;

const r=9+(1-progress)*10;

ctx.globalAlpha=1-progress*.3;

ctx.fillStyle=color;

ctx.shadowColor=color;
ctx.shadowBlur=i<7?12:4;

ctx.beginPath();
ctx.arc(x,y,r,0,Math.PI*2);
ctx.fill();

ctx.shadowBlur=0;
}

ctx.globalAlpha=1;

drawHead(
p.x,
p.y,
22,
color,
p.skin||"green",
p.angle
);

drawName(
p.name||"Player",
p.x,
p.y-34
);

ctx.restore();
}

function drawHead(x,y,r,color,skin,angle){

ctx.save();

ctx.translate(x,y);
ctx.rotate(angle);

ctx.fillStyle=color;
ctx.shadowColor=color;
ctx.shadowBlur=18;

ctx.beginPath();
ctx.arc(0,0,r,0,Math.PI*2);
ctx.fill();

ctx.shadowBlur=0;

if(skin==="blue"){
ctx.strokeStyle="#d5f3ff";
ctx.lineWidth=4;
ctx.stroke();
}

if(skin==="red"){
ctx.strokeStyle="#ffb5c0";
ctx.lineWidth=4;

ctx.beginPath();
ctx.moveTo(-13,-13);
ctx.lineTo(13,13);
ctx.moveTo(13,-13);
ctx.lineTo(-13,13);
ctx.stroke();
}

if(skin==="yellow"){
ctx.fillStyle="#fff2a0";

ctx.beginPath();
ctx.arc(0,0,8,0,Math.PI*2);
ctx.fill();
}

if(skin==="purple"){
ctx.fillStyle="#f0c9ff";

for(let i=0;i<6;i++){
const a=i*Math.PI/3;

ctx.beginPath();
ctx.arc(
Math.cos(a)*13,
Math.sin(a)*13,
4,
0,
Math.PI*2
);
ctx.fill();
}
}

if(skin==="orange"){
ctx.strokeStyle="#ffe2c5";
ctx.lineWidth=4;

for(let i=-1;i<=1;i++){
ctx.beginPath();
ctx.moveTo(-15,i*8);
ctx.lineTo(15,i*8);
ctx.stroke();
}
}

if(skin==="white"){
ctx.strokeStyle="#b8c5c8";
ctx.lineWidth=3;
ctx.stroke();
}

if(skin==="cyan"){
ctx.strokeStyle="#d0fffa";
ctx.lineWidth=4;

ctx.beginPath();
ctx.arc(0,0,14,0,Math.PI*2);
ctx.stroke();
}

drawFace(angle);

ctx.restore();
}

function drawFace(){

ctx.fillStyle="white";

ctx.beginPath();
ctx.arc(10,-7,6,0,Math.PI*2);
ctx.fill();

ctx.beginPath();
ctx.arc(10,7,6,0,Math.PI*2);
ctx.fill();

ctx.fillStyle="#111";

ctx.beginPath();
ctx.arc(12,-7,3,0,Math.PI*2);
ctx.fill();

ctx.beginPath();
ctx.arc(12,7,3,0,Math.PI*2);
ctx.fill();

ctx.strokeStyle="#111";
ctx.lineWidth=2;

ctx.beginPath();
ctx.arc(14,0,5,-.7,.7);
ctx.stroke();
}

function drawName(name,x,y){

ctx.save();

ctx.textAlign="center";
ctx.font="bold 12px Arial";
ctx.fillStyle="white";
ctx.shadowColor="black";
ctx.shadowBlur=5;

ctx.fillText(name,x,y);

ctx.restore();
}

function drawMinimap(){

const s=minimap.width;

mctx.clearRect(0,0,s,s);

mctx.fillStyle="#061007";
mctx.fillRect(0,0,s,s);

for(const f of food){

if(Math.random()>.15)continue;

mctx.fillStyle=f.color;

mctx.fillRect(
f.x/WORLD*s,
f.y/WORLD*s,
2,
2
);
}

function mini(p,r=4){
if(!p)return;

mctx.fillStyle=p.color||"#fff";

mctx.beginPath();
mctx.arc(
p.x/WORLD*s,
p.y/WORLD*s,
r,
0,
Math.PI*2
);
mctx.fill();
}

if(singleplayer){
bots.forEach(b=>mini(b,3));
}else{
Object.values(others).forEach(p=>{
if(p.id!==me.id)mini(p,3);
});
}

mini(me,6);

mctx.strokeStyle="#63ff78";
mctx.lineWidth=2;
mctx.strokeRect(1,1,s-2,s-2);
}

function showKill(){

const el=document.getElementById("killText");

el.classList.add("show");

clearTimeout(showKill.timer);

showKill.timer=setTimeout(()=>{
el.classList.remove("show");
},900);
}

function die(reason){

if(dead)return;

dead=true;
running=false;
boosting=false;

document.getElementById("deathReason").textContent=reason;
document.getElementById("finalScore").textContent=Math.floor(me.score);
document.getElementById("finalKills").textContent=me.kills;

document.getElementById("gameOver").style.display="flex";
}

function update(){

if(running&&!dead){
updatePlayer();
}

}

function loop(){

update();
draw();

requestAnimationFrame(loop);
}

connect();
loop();
</script>

</body>
</html>
