<!DOCTYPE html>
<html lang="et">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>Snake.io Arena</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#071008;
    font-family:Arial,sans-serif;
    touch-action:none;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

#menu{
    position:fixed;
    inset:0;
    z-index:100;
    overflow-y:auto;
    padding:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(
            circle,
            #164a1d,
            #050805 75%
        );
}

.panel{
    width:min(460px,94vw);
    max-height:95vh;
    overflow-y:auto;
    padding:25px;
    border-radius:24px;
    background:#09120a;
    border:1px solid #315d37;
    color:white;
    text-align:center;
}

.logo{
    font-size:65px;
}

h1{
    color:#63ff78;
    font-size:40px;
}

.subtitle{
    color:#829282;
    margin:7px 0 15px;
}

input{
    width:100%;
    height:48px;
    margin:5px 0;
    border:1px solid #315d37;
    border-radius:10px;
    background:#101b11;
    color:white;
    padding:0 15px;
    text-align:center;
    font-size:16px;
}

button{
    cursor:pointer;
}

.btn{
    width:100%;
    min-height:48px;
    margin-top:8px;
    border:0;
    border-radius:10px;
    font-size:15px;
    font-weight:bold;
}

.green{
    background:#63ff78;
    color:#061008;
}

.dark{
    background:#122015;
    color:white;
    border:1px solid #315d37;
}

#coinsMenu{
    margin:10px 0;
    padding:10px;
    background:#111b12;
    border-radius:10px;
    color:#ffd84d;
}

#skins{
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
    margin:10px;
}

.skin{
    width:40px;
    height:40px;
    border-radius:50%;
    border:3px solid transparent;
}

.skin.selected{
    border-color:white;
}

#room{
    display:none;
    margin-top:12px;
    padding:12px;
    border-radius:12px;
    background:#101b11;
}

#roomCode{
    font-size:32px;
    color:#63ff78;
    font-weight:bold;
    letter-spacing:5px;
    margin:5px;
}

#error{
    color:#ff6572;
    min-height:22px;
    margin-top:7px;
}

#status{
    margin-top:5px;
    color:#829282;
    font-size:12px;
}

#shop{
    display:none;
}

.shopGrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin:15px 0;
}

.shopItem{
    background:#101b11;
    border:1px solid #29472e;
    border-radius:12px;
    padding:12px;
}

.preview{
    width:48px;
    height:48px;
    border-radius:50%;
    margin:auto auto 8px;
}

.shopItem button{
    width:100%;
    min-height:35px;
    margin-top:7px;
    border:0;
    border-radius:7px;
}

#hud{
    display:none;
    position:fixed;
    z-index:20;
    top:10px;
    left:10px;
    gap:5px;
}

.stat{
    background:rgba(0,0,0,.82);
    border:1px solid #315d37;
    border-radius:8px;
    color:white;
    padding:7px 9px;
}

.stat small{
    display:block;
    color:#819482;
    font-size:9px;
}

#leaderboard{
    display:none;
    position:fixed;
    z-index:20;
    right:10px;
    top:10px;
    width:180px;
    padding:9px;
    background:rgba(0,0,0,.85);
    border:1px solid #315d37;
    border-radius:12px;
    color:white;
}

.lbtitle{
    color:#63ff78;
    font-weight:bold;
    margin-bottom:5px;
}

.lbrow{
    display:flex;
    justify-content:space-between;
    padding:4px;
    font-size:12px;
}

#minimap{
    display:none;
    position:fixed;
    z-index:20;
    right:10px;
    bottom:10px;
    width:170px;
    height:170px;
    border-radius:15px;
    overflow:hidden;
    border:3px solid #63ff78;
    background:#102414;
}

#minimap canvas{
    position:absolute;
    width:100%;
    height:100%;
}

#miniTitle{
    position:absolute;
    z-index:2;
    left:6px;
    top:5px;
    padding:3px 5px;
    border-radius:4px;
    background:rgba(0,0,0,.7);
    color:white;
    font-size:9px;
}

#joystick{
    display:none;
    position:fixed;
    z-index:30;
    left:18px;
    bottom:18px;
    width:135px;
    height:135px;
    border:2px solid rgba(99,255,120,.35);
    border-radius:50%;
    background:rgba(99,255,120,.08);
}

#stick{
    position:absolute;
    left:50%;
    top:50%;
    width:55px;
    height:55px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:#63ff78;
    border:3px solid white;
}

#boost{
    display:none;
    position:fixed;
    z-index:30;
    right:170px;
    bottom:25px;
    width:75px;
    height:75px;
    border:3px solid #a9eaff;
    border-radius:50%;
    background:#087eaf;
    color:white;
    font-size:28px;
}

#kill{
    position:fixed;
    z-index:50;
    left:50%;
    top:25%;
    transform:translate(-50%,-50%);
    color:#63ff78;
    font-size:35px;
    font-weight:bold;
    opacity:0;
    pointer-events:none;
}

#gameover{
    display:none;
    position:fixed;
    z-index:200;
    inset:0;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.82);
}

.gameoverbox{
    width:min(390px,90vw);
    padding:30px;
    border-radius:20px;
    background:#09120a;
    border:1px solid #315d37;
    color:white;
    text-align:center;
}

.gameoverbox h2{
    color:#ff5268;
    font-size:38px;
}

@media(max-width:800px){

    #menu{
        align-items:flex-start;
    }

    #joystick,
    #boost{
        display:block;
    }

    #leaderboard{
        width:145px;
    }

    #minimap{
        width:140px;
        height:140px;
    }

}

</style>

</head>

Iga kill annab 10 🪙

<div

<div id="hud">

<b id="length">25</b>

🔄 UUESTI

<script>

const WORLD=18000;

const canvas=
document.getElementById("game");

const ctx=
canvas.getContext("2d");

const mini=
document.getElementById("mini");

const mctx=
mini.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){

    W=innerWidth;
    H=innerHeight;

    canvas.width=W;
    canvas.height=H;

    mini.width=400;
    mini.height=400;
}

resize();

addEventListener(
    "resize",
    resize
);

/* =====================
   SAVE
===================== */

let coins=
Number(
    localStorage.getItem(
        "coins"
    ) || 0
);

let owned=
JSON.parse(
    localStorage.getItem(
        "owned"
    ) || '["green"]'
);

let currentSkin=
localStorage.getItem(
    "skin"
) || "green";

const SKINS=[
    ["green","#63ff78",0],
    ["blue","#4da6ff",30],
    ["red","#ff5268",50],
    ["yellow","#ffd84d",80],
    ["purple","#b86cff",100],
    ["orange","#ff8a3d",120],
    ["cyan","#00e5d4",150],
    ["white","#ffffff",200]
];

function save(){

    localStorage.setItem(
        "coins",
        coins
    );

    localStorage.setItem(
        "owned",
        JSON.stringify(owned)
    );

    localStorage.setItem(
        "skin",
        currentSkin
    );
}

/* =====================
   PLAYER
===================== */

const player={

    name:"Player",

    x:WORLD/2,
    y:WORLD/2,

    angle:0,
    target:0,

    length:25,

    score:0,
    kills:0,

    color:"#63ff78"

};

let body=[];

let running=false;
let dead=false;

let bots=[];
let remote=new Map();

let multiplayer=false;
let socket=null;
let myId=null;

function reset(){

    const a=
    Math.random()*
    Math.PI*2;

    player.x=
        WORLD/2;

    player.y=
        WORLD/2;

    player.angle=a;
    player.target=a;

    player.length=25;

    player.score=0;
    player.kills=0;

    player.color=
        SKINS.find(
            x=>x[0]===currentSkin
        )[1];

    body=[];

    for(
        let i=0;
        i<25;
        i++
    ){

        body.push({

            x:
                player.x-
                Math.cos(a)*i*8,

            y:
                player.y-
                Math.sin(a)*i*8

        });

    }

}

/* =====================
   FOOD
===================== */

const food=[];

function newFood(){

    return {

        x:
            100+
            Math.random()*
            (WORLD-200),

        y:
            100+
            Math.random()*
            (WORLD-200),

        r:
            4+
            Math.random()*4,

        value:
            1+
            Math.floor(
                Math.random()*3
            ),

        color:
            [
                "#63ff78",
                "#ffd84d",
                "#ff5268",
                "#4da6ff",
                "#b86cff",
                "#ff8a3d"
            ][
                Math.floor(
                    Math.random()*6
                )
            ]

    };

}

for(
    let i=0;
    i<1100;
    i++
){

    food.push(
        newFood()
    );

}

/* =====================
   BOTS
===================== */

const botNames=[
    "Viper",
    "Cobra",
    "Shadow",
    "Blaze",
    "Hunter",
    "Ghost",
    "Python",
    "Storm",
    "Ninja",
    "Venom"
];

const botColors=[
    "#4da6ff",
    "#ff5268",
    "#ffd84d",
    "#b86cff",
    "#ff8a3d",
    "#00e5d4"
];

function makeBot(){

    const angle=
        Math.random()*
        Math.PI*2;

    const b={

        id:
            Math.random()
            .toString(36)
            .substring(2),

        name:
            botNames[
                Math.floor(
                    Math.random()*
                    botNames.length
                )
            ],

        x:
            500+
            Math.random()*
            (WORLD-1000),

        y:
            500+
            Math.random()*
            (WORLD-1000),

        angle,

        target:angle,

        length:
            25+
            Math.random()*100,

        score:0,

        color:
            botColors[
                Math.floor(
                    Math.random()*
                    botColors.length
                )
            ],

        body:[],

        think:0

    };

    for(
        let i=0;
        i<b.length;
        i++
    ){

        b.body.push({

            x:
                b.x-
                Math.cos(angle)*i*8,

            y:
                b.y-
                Math.sin(angle)*i*8

        });

    }

    return b;
}

function makeBots(){

    bots=[];

    for(
        let i=0;
        i<18;
        i++
    ){

        bots.push(
            makeBot()
        );

    }

}

/* =====================
   CONTROLS
===================== */

let mouseX=W/2;
let mouseY=H/2;

addEventListener(
    "mousemove",
    e=>{

        mouseX=e.clientX;
        mouseY=e.clientY;

    }
);

function control(){

    if(innerWidth<=800)
        return;

    const dx=
        mouseX-W/2;

    const dy=
        mouseY-H/2;

    if(
        Math.hypot(dx,dy)>8
    ){

        player.target=
            Math.atan2(
                dy,
                dx
            );

    }

}

/* =====================
   JOYSTICK
===================== */

const joystick=
document.getElementById(
    "joystick"
);

const stick=
document.getElementById(
    "stick"
);

let joy=false;

function joyMove(x,y){

    const r=
        joystick.getBoundingClientRect();

    const cx=
        r.left+
        r.width/2;

    const cy=
        r.top+
        r.height/2;

    let dx=x-cx;
    let dy=y-cy;

    const max=52;

    const d=
        Math.hypot(dx,dy);

    if(d>max){

        dx=dx/d*max;
        dy=dy/d*max;

    }

    stick.style.left=
        `calc(50% + ${dx}px)`;

    stick.style.top=
        `calc(50% + ${dy}px)`;

    if(d>7){

        player.target=
            Math.atan2(
                dy,
                dx
            );

    }

}

joystick.addEventListener(
    "pointerdown",
    e=>{

        joy=true;

        joystick.setPointerCapture(
            e.pointerId
        );

        joyMove(
            e.clientX,
            e.clientY
        );

    }
);

joystick.addEventListener(
    "pointermove",
    e=>{

        if(joy){

            joyMove(
                e.clientX,
                e.clientY
            );

        }

    }
);

function joyStop(){

    joy=false;

    stick.style.left="50%";
    stick.style.top="50%";

}

joystick.addEventListener(
    "pointerup",
    joyStop
);

joystick.addEventListener(
    "pointercancel",
    joyStop
);

/* =====================
   BOOST
===================== */

let boosting=false;

const boost=
document.getElementById(
    "boost"
);

boost.addEventListener(
    "pointerdown",
    ()=>{
        boosting=true;
    }
);

boost.addEventListener(
    "pointerup",
    ()=>{
        boosting=false;
    }
);

addEventListener(
    "keydown",
    e=>{
        if(e.key==="Shift")
            boosting=true;
    }
);

addEventListener(
    "keyup",
    e=>{
        if(e.key==="Shift")
            boosting=false;
    }
);

/* =====================
   PLAYER UPDATE
===================== */

function updatePlayer(){

    control();

    let d=
        player.target-
        player.angle;

    while(d>Math.PI)
        d-=Math.PI*2;

    while(d<-Math.PI)
        d+=Math.PI*2;

    player.angle+=
        d*.16;

    const speed=
        boosting
        ? 11
        : 7.5;

    player.x+=
        Math.cos(
            player.angle
        )*speed;

    player.y+=
        Math.sin(
            player.angle
        )*speed;

    if(
        player.x<30 ||
        player.x>WORLD-30 ||
        player.y<30 ||
        player.y>WORLD-30
    ){

        die(
            "Läksid vastu kaardi äärt!"
        );

        return;

    }

    if(boosting){

        if(
            Math.random()<.22 &&
            player.length>30
        ){

            player.length-=.12;

            food.push({

                x:
                    player.x-
                    Math.cos(
                        player.angle
                    )*35,

                y:
                    player.y-
                    Math.sin(
                        player.angle
                    )*35,

                r:5,

                value:2,

                color:"#a9eaff"

            });

        }

    }

    body.unshift({

        x:player.x,
        y:player.y

    });

    while(
        body.length<
        Math.floor(
            player.length
        )
    ){

        body.push({
            x:player.x,
            y:player.y
        });

    }

    while(
        body.length>
        Math.floor(
            player.length
        )
    ){

        body.pop();

    }

    eat();

}

/* =====================
   EAT
===================== */

function eat(){

    for(
        let i=food.length-1;
        i>=0;
        i--
    ){

        const f=food[i];

        if(
            Math.hypot(
                player.x-f.x,
                player.y-f.y
            )<27
        ){

            player.score+=
                f.value;

            player.length+=
                f.value*.65;

            food.splice(i,1);

            food.push(
                newFood()
            );

        }

    }

}

/* =====================
   BOT UPDATE
===================== */

function updateBots(){

    for(
        const b of bots
    ){

        b.think--;

        if(
            b.think<=0
        ){

            b.think=
                40+
                Math.random()*100;

            let nearest=null;
            let best=Infinity;

            for(
                let i=0;
                i<food.length;
                i+=7
            ){

                const f=food[i];

                const d=
                    Math.hypot(
                        f.x-b.x,
                        f.y-b.y
                    );

                if(d<best){

                    best=d;
                    nearest=f;

                }

            }

            if(nearest){

                b.target=
                    Math.atan2(
                        nearest.y-b.y,
                        nearest.x-b.x
                    );

            }

        }

        let d=
            b.target-
            b.angle;

        while(d>Math.PI)
            d-=Math.PI*2;

        while(d<-Math.PI)
            d+=Math.PI*2;

        b.angle+=d*.06;

        b.x+=
            Math.cos(b.angle)*5;

        b.y+=
            Math.sin(b.angle)*5;

        if(
            b.x<100 ||
            b.x>WORLD-100
        ){

            b.angle=
                Math.PI-
                b.angle;

            b.target=
                b.angle;

        }

        if(
            b.y<100 ||
            b.y>WORLD-100
        ){

            b.angle=
                -b.angle;

            b.target=
                b.angle;

        }

        b.body.unshift({

            x:b.x,
            y:b.y

        });

        while(
            b.body.length<
            Math.floor(
                b.length
            )
        ){

            b.body.push({

                x:b.x,
                y:b.y

            });

        }

        while(
            b.body.length>
            Math.floor(
                b.length
            )
        ){

            b.body.pop();

        }

        for(
            let i=food.length-1;
            i>=0;
            i--
        ){

            const f=food[i];

            if(
                Math.hypot(
                    b.x-f.x,
                    b.y-f.y
                )<24
            ){

                b.score+=
                    f.value;

                b.length+=
                    f.value*.5;

                food.splice(i,1);

                food.push(
                    newFood()
                );

                break;

            }

        }

    }

    botCombat();

}

/* =====================
   COMBAT
===================== */

function botCombat(){

    for(
        const b of bots
    ){

        /*
        BOT HEAD
        PLAYER BODY
        */

        for(
            let i=8;
            i<body.length;
            i++
        ){

            const p=body[i];

            if(
                Math.hypot(
                    b.x-p.x,
                    b.y-p.y
                )<22
            ){

                killBot(b);
                break;

            }

        }

        if(!bots.includes(b))
            continue;

        /*
        PLAYER HEAD
        BOT BODY
        */

        for(
            let i=8;
            i<b.body.length;
            i++
        ){

            const p=b.body[i];

            if(
                Math.hypot(
                    player.x-p.x,
                    player.y-p.y
                )<23
            ){

                die(
                    b.name+
                    " keha tabas sinu pea!"
                );

                return;

            }

        }

        /*
        HEAD TO HEAD
        */

        if(
            Math.hypot(
                player.x-b.x,
                player.y-b.y
            )<36
        ){

            if(
                player.length>=
                b.length
            ){

                killBot(b);

            }else{

                die(
                    b.name+
                    " võitis!"
                );

                return;

            }

        }

    }

}

/* =====================
   BOT DEATH
===================== */

function killBot(b){

    const index=
        bots.indexOf(b);

    if(index<0)
        return;

    for(
        let i=0;
        i<b.body.length;
        i+=4
    ){

        const p=b.body[i];

        food.push({

            x:p.x,
            y:p.y,

            r:6,
            value:2,

            color:b.color

        });

    }

    bots.splice(
        index,
        1
    );

    player.kills++;
    player.score+=10;
    player.length+=12;

    coins+=10;

    save();

    updateCoins();

    showKill();

    setTimeout(
        ()=>{

            if(
                running &&
                !dead
            ){

                bots.push(
                    makeBot()
                );

            }

        },
        800
    );

}

/* =====================
   DRAW SNAKE
===================== */

function drawSnake(
    s,
    parts
){

    if(
        !parts ||
        parts.length===0
    )
        return;

    /*
    BODY
    */

    for(
        let i=parts.length-1;
        i>=0;
        i--
    ){

        const p=parts[i];

        const r=
            i===0
            ? 23
            : 10;

        ctx.fillStyle=
            s.color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            r,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    /*
    HEAD
    */

    ctx.save();

    ctx.translate(
        s.x,
        s.y
    );

    ctx.rotate(
        s.angle
    );

    ctx.fillStyle=
        s.color;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        24,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
    eyes
    */

    ctx.fillStyle="white";

    ctx.beginPath();

    ctx.arc(
        11,
        -9,
        7,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        11,
        9,
        7,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#111";

    ctx.beginPath();

    ctx.arc(
        13,
        -9,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        13,
        9,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();

    /*
    NAME
    */

    ctx.textAlign="center";

    ctx.font=
        "bold 14px Arial";

    ctx.lineWidth=4;

    ctx.strokeStyle=
        "rgba(0,0,0,.85)";

    ctx.strokeText(
        s.name || "Player",
        s.x,
        s.y-35
    );

    ctx.fillStyle="white";

    ctx.fillText(
        s.name || "Player",
        s.x,
        s.y-35
    );

}

/* =====================
   DRAW
===================== */

function draw(){

    ctx.fillStyle=
        "#071008";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    if(!running)
        return;

    ctx.save();

    ctx.translate(
        W/2-player.x,
        H/2-player.y
    );

    /*
    MAP
    */

    ctx.fillStyle=
        "#102414";

    ctx.fillRect(
        0,
        0,
        WORLD,
        WORLD
    );

    /*
    GRID
    */

    ctx.strokeStyle=
        "rgba(255,255,255,.035)";

    ctx.lineWidth=1;

    const grid=100;

    const left=
        Math.floor(
            (player.x-W/2)/
            grid
        )*grid;

    const right=
        Math.ceil(
            (player.x+W/2)/
            grid
        )*grid;

    for(
        let x=left;
        x<=right;
        x+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            player.y-H/2
        );

        ctx.lineTo(
            x,
            player.y+H/2
        );

        ctx.stroke();

    }

    const top=
        Math.floor(
            (player.y-H/2)/
            grid
        )*grid;

    const bottom=
        Math.ceil(
            (player.y+H/2)/
            grid
        )*grid;

    for(
        let y=top;
        y<=bottom;
        y+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(
            player.x-W/2,
            y
        );

        ctx.lineTo(
            player.x+W/2,
            y
        );

        ctx.stroke();

    }

    /*
    FOOD
    */

    for(
        const f of food
    ){

        if(
            Math.abs(
                f.x-player.x
            )>W/2+50 ||
            Math.abs(
                f.y-player.y
            )>H/2+50
        )
            continue;

        ctx.fillStyle=f.color;

        ctx.beginPath();

        ctx.arc(
            f.x,
            f.y,
            f.r,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    /*
    BOTS
    */

    for(
        const b of bots
    ){

        drawSnake(
            b,
            b.body
        );

    }

    /*
    MULTIPLAYER
    */

    for(
        const p of remote.values()
    ){

        drawSnake(
            p,
            p.body
        );

    }

    /*
    PLAYER
    */

    drawSnake(
        player,
        body
    );

    ctx.restore();

    drawMinimap();

}

/* =====================
   MINIMAP
===================== */

function point(
    x,
    y,
    color,
    size
){

    mctx.fillStyle=color;

    mctx.beginPath();

    mctx.arc(
        x/WORLD*400,
        y/WORLD*400,
        size,
        0,
        Math.PI*2
    );

    mctx.fill();

}

function drawMinimap(){

    mctx.clearRect(
        0,
        0,
        400,
        400
    );

    mctx.fillStyle=
        "#102414";

    mctx.fillRect(
        0,
        0,
        400,
        400
    );

    for(
        const b of bots
    ){

        point(
            b.x,
            b.y,
            "#ff5268",
            5
        );

    }

    for(
        const p of remote.values()
    ){

        point(
            p.x,
            p.y,
            p.color || "#4da6ff",
            5
        );

    }

    point(
        player.x,
        player.y,
        "#63ff78",
        8
    );

    mctx.strokeStyle=
        "#63ff78";

    mctx.lineWidth=4;

    mctx.strokeRect(
        2,
        2,
        396,
        396
    );

}

/* =====================
   HUD
===================== */

function updateHud(){

    document.getElementById(
        "score"
    ).textContent=
        Math.floor(
            player.score
        );

    document.getElementById(
        "kills"
    ).textContent=
        player.kills;

    document.getElementById(
        "length"
    ).textContent=
        Math.floor(
            player.length
        );

    document.getElementById(
        "coins"
    ).textContent=
        coins;

    leaderboard();

}

function leaderboard(){

    const list=[{

        name:player.name,
        score:player.score,
        color:player.color

    }];

    for(
        const b of bots
    ){

        list.push({
            name:b.name,
            score:b.score,
            color:b.color
        });

    }

    for(
        const p of remote.values()
    ){

        list.push({
            name:p.name,
            score:p.score,
            color:p.color
        });

    }

    list.sort(
        (a,b)=>
            b.score-a.score
    );

    const box=
        document.getElementById(
            "lb"
        );

    box.innerHTML="";

    list
        .slice(0,3)
        .forEach(
            (p,i)=>{

                const row=
                    document.createElement(
                        "div"
                    );

                row.className="lbrow";

                row.innerHTML=
                    `<span style="color:${p.color}">
                    ${i+1}. ${safe(p.name)}
                    </span>
                    <b>${Math.floor(p.score)}</b>`;

                box.appendChild(row);

            }
        );

}

function safe(x){

    return String(x)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");

}

/* =====================
   GAME OVER
===================== */

function die(reason){

    if(dead)
        return;

    dead=true;
    running=false;

    document.getElementById(
        "reason"
    ).textContent=
        reason;

    document.getElementById(
        "finalScore"
    ).textContent=

    document.getElementById(

    document.getElementById(

}

/* =====================
   KILL MESSAGE
===================== */

function showKill(){

        document.getElementById(
            "kill"

    el.style.opacity=1;

    setTimeout(

            el.style.opacity=0;

/* =====================
   SHOP
===================== */

function renderSkins(){

    const box=
        document.getElementById(
            "skins"
        );

    box.innerHTML="";

    for(
        const s of SKINS
    ){

        if(
            !owned.includes(
                s[0]
            )
        )
            continue;

        const b=
            document.createElement(
                "button"
            );

        b.className="skin";

        if(
            currentSkin===s[0]
        ){

            b.classList.add(
                "selected"
            );

        }

        b.style.background=
            s[1];

        b.onclick=()=>{

            currentSkin=s[0];

            save();

            renderSkins();

        };

        box.appendChild(b);

    }

}

function renderShop(){

    const grid=
        document.getElementById(
            "shopGrid"
        );

    grid.innerHTML="";

    for(
        const s of SKINS
    ){

        const id=s[0];
        const color=s[1];
        const price=s[2];

        const have=
            owned.includes(id);

        const item=
            document.createElement(
                "div"
            );

        item.className=
            "shopItem";

        item.innerHTML=`

            <div
                class="preview"
                style="
                    background:${color};
                    box-shadow:0 0 15px ${color};
                "
            ></div>

            <b>${id.toUpperCase()}</b>

            <div style="color:#ffd84d">
                ${
                    price===0
                    ? "TASUTA"
                    : "🪙 "+price
                }
            </div>

            <button>
                ${
                    have
                    ? "✓ KASUTA"
                    : "OSTA"
                }
            </button>
        `;

        item
            .querySelector("button")
            .onclick=()=>{

                if(have){

                    currentSkin=id;

                    save();

                    renderSkins();
                    renderShop();

                    return;

                }

                if(
                    coins<price
                ){

                    alert(
                        "Sul pole piisavalt coine!"
                    );

                    return;

                }

                coins-=price;

                owned.push(id);

                currentSkin=id;

                save();

                updateCoins();

                renderSkins();
                renderShop();

            };

        grid.appendChild(item);

    }

}

function updateCoins(){

    document.getElementById(
        "menuCoins"
    ).textContent=
        coins;

    document.getElementById(
        "coins"
    ).textContent=
        coins;

}

/* =====================
   MENU
===================== */

document.getElementById(

/* =====================
   START
===================== */

function startGame(){

            "name"
        ).value

        .replace(/[<>]/g,"")
        .substring(0,16)
        ||
        "Player";

    ).style.display="none";

    ).style.display="flex";

}

document.getElementById(
    "single"
).onclick=()=>{

    multiplayer=false;

    makeBots();

};

/* =====================
   WEBSOCKET
===================== */

function connect(){

    const protocol=
        location.protocol==="https:"
        ? "wss:"
        : "ws:";

    socket=
        new WebSocket(
            protocol+
            "//"+
            location.host
        );

    socket.onopen=()=>{

        document.getElementById(
            "status"
        ).textContent=
            "🟢 Server ühendatud";

    };

    socket.onclose=()=>{

        document.getElementById(
            "status"
        ).textContent=
            "🔴 Server katkes";

    };

    socket.onerror=()=>{

        document.getElementById(
            "status"
        ).textContent=
            "🔴 Serveri viga";

    };

    socket.onmessage=e=>{

        let data;

        try{
            data=JSON.parse(e.data);
        }catch{
            return;
        }

        if(
            data.type==="connected"
        ){

            myId=data.id;

        }

        if(
            data.type==="created" ||
            data.type==="joined"
        ){

            multiplayer=true;

            myId=data.id;

            document.getElementById(
                "room"
            ).style.display=
                "block";

            document.getElementById(
                "roomCode"
            ).textContent=
                data.code;

        }

        if(
            data.type==="startGame"
        ){

            startGame();

        }

        if(
            data.type==="state"
        ){

            remote.clear();

            for(
                const p of data.players
            ){

                if(
                    p.id!==myId
                ){

                    remote.set(
                        p.id,
                        p
                    );

                }

            }

            updateRoomPlayers(
                data.players
            );

        }

        if(
            data.type==="kill"
        ){

            if(
                data.killer===myId
            ){

                player.kills++;
                player.score+=10;

                coins+=10;

                save();

                showKill();

                updateCoins();

            }

        }

        if(
            data.type==="error"
        ){

            document.getElementById(
                "error"
            ).textContent=
                data.message;

        }

    };

}

function send(data){

    if(
        socket &&
        socket.readyState===
        WebSocket.OPEN
    ){

        socket.send(
            JSON.stringify(data)
        );

    }

}

document.getElementById(
    "create"
).onclick=()=>{

    send({

        type:"create",

        name:
            document.getElementById(
                "name"
            ).value,

        color:
            SKINS.find(
                s=>s[0]===currentSkin
            )[1]

    });

};

document.getElementById(
    "join"
).onclick=()=>{

    send({

        type:"join",

        code:
            document.getElementById(
                "roomInput"
            ).value,

        name:
            document.getElementById(
                "name"
            ).value,

        color:
            SKINS.find(
                s=>s[0]===currentSkin
            )[1]

    });

};

document.getElementById(
    "start"
).onclick=()=>{

    send({
        type:"start"
    });

};

function updateRoomPlayers(players){

    const box=
        document.getElementById(
            "roomPlayers"
        );

    box.innerHTML="";

    for(
        const p of players
    ){

        const div=
            document.createElement(
                "div"
            );

        div.textContent=
            p.name;

        box.appendChild(div);

    }

}

/* =====================
   SEND PLAYER
===================== */

let lastSend=0;

function sendPlayer(){

    if(
        !multiplayer ||
        !running
    )
        return;

    send({

        type:"update",

        x:player.x,
        y:player.y,

        angle:player.angle,

        length:player.length,

        score:player.score,

        kills:player.kills,

        body:
            body.slice(
                0,
                220
            )

    });

}

/* =====================
   LOOP
===================== */

function loop(){

    if(running){

        if(
            !multiplayer
        ){

            updateBots();

        }

        updatePlayer();

        const now=
            performance.now();

        if(
            now-lastSend>70
        ){

            sendPlayer();

            lastSend=now;

        }

        updateHud();

    }

    draw();

    requestAnimationFrame(
        loop
    );

}

/* =====================
   INIT
===================== */

const savedName=
localStorage.getItem(
    "snakeName"
);

if(savedName){

    document.getElementById(
        "name"
    ).value=
        savedName;

}

document.getElementById(
    "name"
).addEventListener(
    "input",
    e=>{

        localStorage.setItem(
            "snakeName",
            e.target.value
        );

    }
);

renderSkins();
renderShop();
updateCoins();
connect();

requestAnimationFrame(
    loop
);

</script>
