<!DOCTYPE html>
<html lang="et">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,user-scalable=no"
>

<title>Snake Arena 🐍</title>

<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#020604;
font-family:Arial,sans-serif;
color:white;
touch-action:none;
}

canvas{
position:fixed;
inset:0;
width:100%;
height:100%;
}

#menu,
#lobby{

position:fixed;
inset:0;
z-index:20;

display:flex;
align-items:center;
justify-content:center;

background:
radial-gradient(
circle,
rgba(20,90,40,.65),
rgba(0,0,0,.98)
);

}

.card{

width:min(92vw,450px);

padding:30px;

border-radius:28px;

background:
rgba(4,17,9,.97);

border:
1px solid #39824d;

box-shadow:
0 30px 100px #000;

text-align:center;

}

.logo{
font-size:80px;
filter:drop-shadow(0 0 25px #45ff72);
}

h1{
font-size:40px;
color:#5cff8b;
margin:5px 0 20px;
}

input,select{

width:100%;

padding:15px;

margin:6px 0;

border-radius:13px;

border:1px solid #315f3d;

background:#061008;

color:white;

font-size:18px;

text-align:center;

}

button{

width:100%;

padding:15px;

margin-top:8px;

border:0;

border-radius:14px;

font-size:18px;

font-weight:bold;

cursor:pointer;

}

.create{
background:#43eb77;
color:#031008;
}

.join{
background:#438eff;
color:white;
}

#status{
margin-top:12px;
color:#91a99a;
}

/* LOBBY */

#lobby{
display:none;
}

.lobbyCard{

width:min(94vw,500px);

padding:30px;

background:#06130a;

border:
1px solid #3c8150;

border-radius:28px;

text-align:center;

}

.roomTitle{
font-size:32px;
color:#62ff91;
font-weight:bold;
}

#roomCodeBig{

font-size:48px;

letter-spacing:9px;

color:#66ff98;

margin:15px 0;

}

.copy{

background:#183420;

color:#a8ffbb;

}

#lobbyPlayers{
margin:15px 0;
text-align:left;
}

.lobbyPlayer{

padding:10px;

margin:5px 0;

background:#0b1e10;

border-radius:12px;

display:flex;
gap:10px;
align-items:center;

}

.dot{

width:14px;
height:14px;
border-radius:50%;

}

.host{
margin-left:auto;
color:#ffd85b;
font-size:12px;
}

#start{

background:#45ee7b;
color:#031008;

font-size:20px;

}

#leave{

background:#321519;
color:#ff8990;

}

/* HUD */

#hud{

position:fixed;

top:12px;
left:50%;

transform:translateX(-50%);

z-index:10;

display:flex;

gap:7px;

pointer-events:none;

}

.stat{

padding:7px 14px;

background:
rgba(3,14,7,.82);

border:
1px solid rgba(90,255,130,.3);

border-radius:12px;

text-align:center;

}

.stat small{

display:block;

font-size:10px;

color:#91a695;

}

.stat b{
font-size:18px;
}

#leaderboard{

position:fixed;

top:12px;
right:12px;

z-index:10;

width:190px;

padding:12px;

background:
rgba(3,14,7,.82);

border:
1px solid rgba(90,255,130,.3);

border-radius:15px;

}

#leaderboard h3{

margin:0 0 8px;

color:#68ff98;

font-size:16px;

}

.rank{

display:flex;

justify-content:space-between;

font-size:12px;

padding:4px 0;

}

/* BOOST */

#boost{

position:fixed;

right:25px;
bottom:30px;

z-index:12;

width:90px;
height:90px;

border-radius:50%;

background:
radial-gradient(
circle,
#4aa8ff,
#12549d
);

border:
2px solid #8dceff;

color:white;

font-size:30px;

box-shadow:
0 0 35px rgba(50,150,255,.5);

}

#boost span{

display:block;

font-size:9px;

}

/* JOYSTICK */

#joystick{

position:fixed;

left:25px;
bottom:25px;

width:155px;
height:155px;

z-index:12;

border-radius:50%;

background:
rgba(50,255,100,.08);

border:
2px solid rgba(90,255,130,.2);

}

#stick{

position:absolute;

width:65px;
height:65px;

left:45px;
top:45px;

border-radius:50%;

background:
rgba(70,255,120,.5);

border:
2px solid #7dff9e;

}

@media(min-width:700px){

#joystick{
display:none;
}

}

@media(max-width:700px){

#leaderboard{

width:150px;

font-size:11px;

}

.stat{
padding:6px 9px;
}

}

/* DEATH */

#dead{

display:none;

position:fixed;

inset:0;

z-index:30;

align-items:center;

justify-content:center;

background:rgba(0,0,0,.65);

text-align:center;

}

.deadCard{

padding:30px;

border-radius:25px;

background:#09150c;

border:1px solid #39814d;

}

</style>

</head>

<body>

<canvas id="game"></canvas>


<!-- MENU -->

<div id="menu">

<div class="card">

<div class="logo">🐍</div>

<h1>SNAKE ARENA</h1>

<input
id="name"
maxlength="14"
placeholder="Sinu nimi"
>

<select id="mode">

<option value="classic">
🍎 Classic Arena
</option>

<option value="battle">
⚔️ Battle
</option>

<option value="power">
⚡ Power Arena
</option>

</select>

<button
class="create"
onclick="createRoom()"
>
🟢 LOO TUBA
</button>

<input
id="room"
maxlength="6"
placeholder="ROOM CODE"
>

<button
class="join"
onclick="joinRoom()"
>
🔵 LIITU TUPA
</button>

<div id="status">
🟡 Ühendan...
</div>

</div>

</div>


<!-- LOBBY -->

<div id="lobby">

<div class="lobbyCard">

<div class="roomTitle">
🐍 SNAKE ROOM
</div>

<p>
Jaga seda koodi sõpradega:
</p>

<div id="roomCodeBig">
------
</div>

<button
class="copy"
onclick="copyCode()"
>
📋 KOPI KOOD
</button>

<div id="lobbyPlayers"></div>

<p id="waiting">
⏳ Ootame mängijaid...
</p>

<button
id="start"
onclick="startGame()"
>
🚀 START GAME
</button>

<button
id="leave"
onclick="location.reload()"
>
← LAHKU
</button>

</div>

</div>


<!-- HUD -->

<div id="hud">

<div class="stat">

<small>SCORE</small>

<b id="score">
0
</b>

</div>

<div class="stat">

<small>LENGTH</small>

<b id="length">
35
</b>

</div>

<div class="stat">

<small>RANK</small>

<b id="rank">
-
</b>

</div>

</div>


<!-- LEADERBOARD -->

<div id="leaderboard">

<h3>🏆 LEADERBOARD</h3>

<div id="board"></div>

</div>


<!-- JOYSTICK -->

<div id="joystick">

<div id="stick"></div>

</div>


<!-- BOOST -->

<button id="boost">

⚡

<span>
BOOST
</span>

</button>


<!-- DEAD -->

<div id="dead">

<div class="deadCard">

<h1>💥</h1>

<h2>SAID PIHTA!</h2>

<p>
Respawn...
</p>

</div>

</div>


<script>

const SERVER =
"wss://snake-riu3.onrender.com";

let ws;

let myId=null;

let roomCode=null;

let host=false;

let gameStarted=false;

let state={
world:5000,
players:{},
food:[]
};

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

let camera={
x:2500,
y:2500
};

let mouse={
x:innerWidth/2,
y:innerHeight/2
};

let boosting=false;


/* RESIZE */

function resize(){

W=innerWidth;
H=innerHeight;

canvas.width=W*devicePixelRatio;
canvas.height=H*devicePixelRatio;

canvas.style.width=W+"px";
canvas.style.height=H+"px";

ctx.setTransform(
devicePixelRatio,
0,
0,
devicePixelRatio,
0,
0
);

}

addEventListener(
"resize",
resize
);

resize();


/* CONNECT */

function connect(){

ws=new WebSocket(SERVER);

ws.onopen=()=>{

document.getElementById(
"status"
).textContent=
"🟢 Serveriga ühendatud";

};

ws.onmessage=e=>{

let data;

try{
data=JSON.parse(e.data);
}catch{
return;
}

if(data.type==="connected"){

myId=data.id;

}

if(
data.type==="roomCreated" ||
data.type==="roomJoined"
){

roomCode=data.room;

host=data.host;

showLobby();

}

if(data.type==="lobby"){

roomCode=data.room;

host=
data.hostId===myId;

updateLobby(data);

}

if(data.type==="gameStarted"){

gameStarted=true;

document.getElementById(
"lobby"
).style.display="none";

}

if(data.type==="state"){

state=data.state;

gameStarted=
data.state.started;

updateGameUI();

}

if(data.type==="error"){

alert(data.message);

}

};

ws.onclose=()=>{

document.getElementById(
"status"
).textContent=
"🔴 Serveriga ühendus katkes";

};

}


/* SEND */

function send(data){

if(
ws &&
ws.readyState===
WebSocket.OPEN
){

ws.send(
JSON.stringify(data)
);

}

}


/* CREATE */

function createRoom(){

const name=
document
.getElementById("name")
.value
.trim();

const mode=
document
.getElementById("mode")
.value;

if(!name){

alert(
"Kirjuta nimi!"
);

return;

}

send({

type:"createRoom",

name,

mode

});

}


/* JOIN */

function joinRoom(){

const name=
document
.getElementById("name")
.value
.trim();

const room=
document
.getElementById("room")
.value
.trim()
.toUpperCase();

if(!name){

alert(
"Kirjuta nimi!"
);

return;

}

if(room.length!==6){

alert(
"Room Code peab olema 6 märki!"
);

return;

}

send({

type:"joinRoom",

name,

room

});

}


/* LOBBY */

function showLobby(){

document.getElementById(
"menu"
).style.display="none";

document.getElementById(
"lobby"
).style.display="flex";

document.getElementById(
"roomCodeBig"
).textContent=
roomCode;

document.getElementById(
"start"
).style.display=
host?"block":"none";

}


/* UPDATE LOBBY */

function updateLobby(data){

document.getElementById(
"roomCodeBig"
).textContent=
data.room;

const box=
document.getElementById(
"lobbyPlayers"
);

box.innerHTML="";

data.players.forEach(
p=>{

const row=
document.createElement("div");

row.className=
"lobbyPlayer";

const dot=
document.createElement("span");

dot.className="dot";

dot.style.background=
p.color;

const name=
document.createElement("span");

name.textContent=
p.name;

row.appendChild(dot);

row.appendChild(name);

if(p.id===data.hostId){

const h=
document.createElement("span");

h.className="host";

h.textContent=
"👑 HOST";

row.appendChild(h);

}

box.appendChild(row);

});

host=
data.hostId===myId;

document.getElementById(
"start"
).style.display=
host?"block":"none";

document.getElementById(
"waiting"
).textContent=
host
?
"👑 Sina oled host – vajuta START GAME kui sõbrad on kohal."
:
"⏳ Ootame hosti...";

}


/* COPY */

function copyCode(){

navigator.clipboard
.writeText(roomCode)
.then(()=>{

alert(
"Room Code kopeeritud: "+
roomCode
);

});

}


/* START */

function startGame(){

if(!host){

alert(
"Ainult host saab alustada!"
);

return;

}

send({
type:"startGame"
});

}


/* MOUSE */

addEventListener(
"mousemove",
e=>{

mouse.x=e.clientX;
mouse.y=e.clientY;

});

function sendAim(){

if(!gameStarted)
return;

const cx=W/2;
const cy=H/2;

const angle=
Math.atan2(
mouse.y-cy,
mouse.x-cx
);

send({

type:"aim",

angle

});

}

setInterval(
sendAim,
50
);


/* CLICK BOOST */

function setBoost(value){

boosting=value;

send({

type:"boost",

active:value

});

}

addEventListener(
"mousedown",
e=>{

if(e.button===0)
setBoost(true);

});

addEventListener(
"mouseup",
e=>{

if(e.button===0)
setBoost(false);

});


/* SPACE */

addEventListener(
"keydown",
e=>{

if(
e.code==="Space" ||
e.code==="ShiftLeft" ||
e.code==="ShiftRight"
){

e.preventDefault();

setBoost(true);

}

});

addEventListener(
"keyup",
e=>{

if(
e.code==="Space" ||
e.code==="ShiftLeft" ||
e.code==="ShiftRight"
){

e.preventDefault();

setBoost(false);

}

});


/* BOOST BUTTON */

const boostButton=
document.getElementById(
"boost"
);

boostButton.addEventListener(
"touchstart",
e=>{

e.preventDefault();

setBoost(true);

},
{passive:false}
);

boostButton.addEventListener(
"touchend",
e=>{

e.preventDefault();

setBoost(false);

},
{passive:false}
);


/* JOYSTICK */

const joystick=
document.getElementById(
"joystick"
);

const stick=
document.getElementById(
"stick"
);

let joyActive=false;

function joystickMove(
x,
y
){

const rect=
joystick.getBoundingClientRect();

const cx=
rect.left+
rect.width/2;

const cy=
rect.top+
rect.height/2;

let dx=x-cx;
let dy=y-cy;

const max=55;

const len=
Math.hypot(dx,dy);

if(len>max){

dx=
dx/len*max;

dy=
dy/len*max;

}

stick.style.left=
45+dx+"px";

stick.style.top=
45+dy+"px";

const angle=
Math.atan2(dy,dx);

send({

type:"aim",
angle

});

}

joystick.addEventListener(
"touchstart",
e=>{

joyActive=true;

const t=e.touches[0];

joystickMove(
t.clientX,
t.clientY
);

},
{passive:false}
);

joystick.addEventListener(
"touchmove",
e=>{

if(!joyActive)return;

e.preventDefault();

const t=e.touches[0];

joystickMove(
t.clientX,
t.clientY
);

},
{passive:false}
);

joystick.addEventListener(
"touchend",
()=>{

joyActive=false;

stick.style.left="45px";
stick.style.top="45px";

},
{passive:false}
);


/* GAME UI */

function updateGameUI(){

const me=
state.players[
myId
];

if(!me)
return;

document.getElementById(
"score"
).textContent=
me.score;

document.getElementById(
"length"
).textContent=
Math.floor(me.length);

if(!me.alive){

document.getElementById(
"dead"
).style.display=
"flex";

}else{

document.getElementById(
"dead"
).style.display=
"none";

}


/* RANK */

const players=
Object.values(
state.players
);

players.sort(
(a,b)=>
b.score-a.score
);

const rank=
players.findIndex(
p=>p.id===myId
)+1;

document.getElementById(
"rank"
).textContent=
rank;


/* BOARD */

const board=
document.getElementById(
"board"
);

board.innerHTML="";

players
.slice(0,8)
.forEach(
(p,i)=>{

const row=
document.createElement("div");

row.className="rank";

row.innerHTML=
`
<span>
${i+1}. ${escapeHTML(p.name)}
</span>

<b>
${p.score}
</b>
`;

board.appendChild(row);

});

}


/* ESCAPE */

function escapeHTML(str){

return String(str)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;");

}


/* CAMERA */

function updateCamera(){

const me=
state.players[
myId
];

if(!me)
return;

const targetX=
me.x;

const targetY=
me.y;

camera.x +=
(targetX-camera.x)
*.12;

camera.y +=
(targetY-camera.y)
*.12;

}


/* DRAW WORLD */

function draw(){

requestAnimationFrame(
draw
);

ctx.clearRect(
0,
0,
W,
H
);

updateCamera();

const zoom=
Math.min(
1.15,
Math.max(
0.72,
1.0-
Math.log(
(state.players[myId]?.length||35)
/
35
)*0.08
)
);

ctx.save();

ctx.translate(
W/2,
H/2
);

ctx.scale(
zoom,
zoom
);

ctx.translate(
-camera.x,
-camera.y
);


/* BACKGROUND */

ctx.fillStyle=
"#06150a";

ctx.fillRect(
0,
0,
state.world,
state.world
);


/* GRID */

const grid=100;

ctx.strokeStyle=
"rgba(80,255,120,.035)";

ctx.lineWidth=2;

const startX=
Math.floor(
(camera.x-W/2/zoom)/
grid
)*grid;

const endX=
camera.x+
W/2/zoom+
grid;

for(
let x=startX;
x<endX;
x+=grid
){

ctx.beginPath();

ctx.moveTo(
x,
camera.y-H/2/zoom
);

ctx.lineTo(
x,
camera.y+H/2/zoom
);

ctx.stroke();

}

const startY=
Math.floor(
(camera.y-H/2/zoom)/
grid
)*grid;

const endY=
camera.y+
H/2/zoom+
grid;

for(
let y=startY;
y<endY;
y+=grid
){

ctx.beginPath();

ctx.moveTo(
camera.x-W/2/zoom,
y
);

ctx.lineTo(
camera.x+W/2/zoom,
y
);

ctx.stroke();

}


/* BORDER */

ctx.strokeStyle=
"#45ff72";

ctx.lineWidth=18;

ctx.strokeRect(
0,
0,
state.world,
state.world
);


/* FOOD */

for(
const food of state.food
){

ctx.beginPath();

ctx.fillStyle=
food.value>=5
?
"#fff15a"
:
"#ff4f79";

ctx.shadowColor=
ctx.fillStyle;

ctx.shadowBlur=
food.value>=5
?
18
:
10;

ctx.arc(
food.x,
food.y,
food.size,
0,
Math.PI*2
);

ctx.fill();

}

ctx.shadowBlur=0;


/* SNAKES */

const players=
Object.values(
state.players
);

players.sort(
(a,b)=>
a.length-b.length
);

for(
const player of players
){

if(!player.snake)
continue;

const snake=
player.snake;

for(
let i=snake.length-1;
i>=0;
i--
){

const part=
snake[i];

const t=
i/snake.length;

const radius=
Math.max(
5,
11-t*3
);

ctx.beginPath();

ctx.fillStyle=
player.color;

ctx.shadowColor=
player.color;

ctx.shadowBlur=
player.id===myId
?
14
:
7;

ctx.arc(
part.x,
part.y,
radius,
0,
Math.PI*2
);

ctx.fill();

}

ctx.shadowBlur=0;


/* HEAD */

if(
snake.length &&
player.alive
){

const head=
snake[0];

ctx.fillStyle=
player.color;

ctx.beginPath();

ctx.arc(
head.x,
head.y,
14,
0,
Math.PI*2
);

ctx.fill();


/* EYES */

const angle=
player.angle;

const ex=
Math.cos(angle);

const ey=
Math.sin(angle);

const sx=
-Math.sin(angle);

const sy=
Math.cos(angle);

ctx.fillStyle=
"#061008";

ctx.beginPath();

ctx.arc(
head.x+
ex*7+
sx*5,
head.y+
ey*7+
sy*5,
3,
0,
Math.PI*2
);

ctx.fill();

ctx.beginPath();

ctx.arc(
head.x+
ex*7-
sx*5,
head.y+
ey*7-
sy*5,
3,
0,
Math.PI*2
);

ctx.fill();

}

}


/* NAME */

ctx.font=
"bold 14px Arial";

ctx.textAlign="center";

for(
const player of players
){

if(
!player.snake ||
!player.snake.length
)
continue;

ctx.fillStyle=
"rgba(255,255,255,.8)";

ctx.fillText(
player.name,
player.x,
player.y-24
);

}

ctx.restore();

}

connect();

draw();

</script>

</body>
</html>
