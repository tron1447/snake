<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Snake Arena</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#040804;
    font-family:Arial,sans-serif;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

#menu{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:auto;
    padding:20px;
    background:
        radial-gradient(circle at 50% 15%,#214d29 0,#0b1b0e 35%,#020402 80%);
}

.panel{
    width:min(95vw,470px);
    max-height:94vh;
    overflow-y:auto;
    padding:26px;
    border-radius:28px;
    background:rgba(5,13,6,.97);
    border:1px solid rgba(99,255,120,.35);
    box-shadow:0 0 80px rgba(99,255,120,.15);
    color:white;
    text-align:center;
}

.logo{
    font-size:65px;
    filter:drop-shadow(0 0 16px #63ff78);
}

h1{
    font-size:38px;
    color:#63ff78;
}

.subtitle{
    color:#819383;
    margin:5px 0 18px;
}

input{
    width:100%;
    height:48px;
    margin:5px 0;
    border-radius:12px;
    border:1px solid #315c37;
    background:#071007;
    color:white;
    text-align:center;
    font-size:16px;
    outline:none;
}

button{
    font-family:inherit;
    font-weight:bold;
    cursor:pointer;
}

.mainBtn{
    width:100%;
    min-height:48px;
    margin-top:7px;
    border-radius:12px;
    border:0;
    font-size:15px;
}

.green{
    background:#63ff78;
    color:#031006;
}

.dark{
    background:#102014;
    color:white;
    border:1px solid #315b36;
}

#skins{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
    margin:12px 0 16px;
}

.skin{
    width:54px;
    height:54px;
    border-radius:50%;
    border:3px solid transparent;
    font-size:24px;
    transition:.15s;
}

.skin.selected{
    border-color:white;
    transform:scale(1.12);
    box-shadow:0 0 18px currentColor;
}

#roomBox{
    display:none;
    margin-top:15px;
}

.roomTitle{
    color:#819482;
    font-size:11px;
}

#roomCode{
    color:#63ff78;
    font-size:32px;
    font-weight:900;
    letter-spacing:6px;
    margin:4px 0 10px;
}

#players{
    max-height:140px;
    overflow-y:auto;
}

.playerRow{
    padding:9px;
    margin:4px 0;
    border-radius:9px;
    background:#0b170d;
}

#error{
    color:#ff6474;
    min-height:20px;
    margin-top:9px;
}

#connection{
    color:#718172;
    font-size:11px;
    margin-top:7px;
}

#hud{
    position:fixed;
    z-index:20;
    left:10px;
    top:10px;
    display:none;
    gap:6px;
}

.stat{
    padding:7px 10px;
    border-radius:10px;
    background:rgba(0,0,0,.68);
    border:1px solid rgba(99,255,120,.25);
    color:white;
}

.stat small{
    display:block;
    color:#78907c;
    font-size:9px;
}

.stat b{
    font-size:16px;
}

#leaderboard{
    position:fixed;
    z-index:25;
    top:10px;
    right:180px;
    width:190px;
    padding:10px;
    border-radius:14px;
    background:rgba(0,0,0,.72);
    border:1px solid rgba(99,255,120,.3);
    color:white;
}

.lbTitle{
    color:#63ff78;
    font-size:13px;
    font-weight:bold;
    margin-bottom:5px;
}

.lbRow{
    display:flex;
    justify-content:space-between;
    gap:8px;
    font-size:12px;
    padding:3px 0;
}

#minimap{
    position:fixed;
    z-index:20;
    right:10px;
    top:10px;
    width:160px;
    height:160px;
    display:none;
    border-radius:15px;
    border:2px solid rgba(99,255,120,.7);
    background:#061007;
}

#joystick{
    position:fixed;
    z-index:30;
    left:22px;
    bottom:22px;
    width:145px;
    height:145px;
    display:none;
    border-radius:50%;
    background:rgba(99,255,120,.08);
    border:2px solid rgba(99,255,120,.35);
}

#stick{
    position:absolute;
    left:50%;
    top:50%;
    width:62px;
    height:62px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:#63ff78;
    border:3px solid white;
    box-shadow:0 0 20px rgba(99,255,120,.5);
}

#boost{
    position:fixed;
    z-index:30;
    right:25px;
    bottom:28px;
    width:90px;
    height:90px;
    display:none;
    border-radius:50%;
    border:3px solid #a5e3ff;
    background:#087bb0;
    color:white;
    font-size:27px;
    box-shadow:0 0 25px rgba(0,160,255,.3);
}

#killText{
    position:fixed;
    z-index:40;
    left:50%;
    top:25%;
    transform:translateX(-50%) scale(.7);
    opacity:0;
    color:#63ff78;
    font-size:38px;
    font-weight:900;
    text-shadow:0 0 20px #63ff78;
    pointer-events:none;
    transition:.25s;
}

#killText.show{
    opacity:1;
    transform:translateX(-50%) scale(1);
}

#gameOver{
    position:fixed;
    inset:0;
    z-index:200;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.8);
}

.overPanel{
    width:min(90vw,390px);
    padding:30px;
    border-radius:25px;
    background:#081008;
    border:1px solid #315b36;
    text-align:center;
    color:white;
}

.overPanel h2{
    color:#ff596c;
    font-size:38px;
}

@media(max-width:800px){
    #joystick,
    #boost{
        display:block;
    }

    #minimap{
        width:120px;
        height:120px;
    }

    #leaderboard{
        top:140px;
        right:10px;
        width:145px;
    }

    #hud{
        transform:scale(.9);
        transform-origin:top left;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="menu">
<div class="panel">

<div class="logo">🐍</div>
<h1>SNAKE ARENA</h1>
<div class="subtitle">Eat • Grow • Fight • Survive</div>

<input id="name" maxlength="16" placeholder="Sinu nimi">

<h3 style="margin-top:10px">🎨 Vali skin</h3>

<div id="skins">

<button class="skin selected"
data-color="#63ff78"
data-skin="green"
style="background:#63ff78">🐍</button>

<button class="skin"
data-color="#4da6ff"
data-skin="blue"
style="background:#4da6ff">😎</button>

<button class="skin"
data-color="#ff5570"
data-skin="red"
style="background:#ff5570">😈</button>

<button class="skin"
data-color="#ffd84d"
data-skin="yellow"
style="background:#ffd84d">😄</button>

<button class="skin"
data-color="#b86cff"
data-skin="purple"
style="background:#b86cff">👾</button>

<button class="skin"
data-color="#ff8a3d"
data-skin="orange"
style="background:#ff8a3d">🔥</button>

<button class="skin"
data-color="#ffffff"
data-skin="white"
style="background:white;color:black">👻</button>

<button class="skin"
data-color="#00e5d4"
data-skin="cyan"
style="background:#00e5d4">🤖</button>

</div>

<button id="singleBtn" class="mainBtn green">
🤖 SINGLEPLAYER — BOTS
</button>

<button id="createBtn" class="mainBtn dark">
🏠 CREATE ROOM
</button>

<input
id="roomInput"
maxlength="6"
placeholder="ROOM CODE">

<button id="joinBtn" class="mainBtn dark">
🚪 JOIN ROOM
</button>

<div id="roomBox">

<div class="roomTitle">ROOM CODE</div>

<div id="roomCode">------</div>

<div id="players"></div>

<button id="startBtn" class="mainBtn green">
▶ START GAME
</button>

</div>

<div id="error"></div>
<div id="connection">Ühendamine...</div>

</div>
</div>

<div id="hud">

<div class="stat">
<small>SCORE</small>
<b id="score">0</b>
</div>

<div class="stat">
<small>LENGTH</small>
<b id="length">20</b>
</div>

<div class="stat">
<small>PLAYERS</small>
<b id="playerCount">1</b>
</div>

</div>

<div id="leaderboard">
<div class="lbTitle">🏆 TOP 3</div>
<div id="lbRows"></div>
</div>

<canvas id="minimap" width="160" height="160"></canvas>

<div id="killText">💥 ELIMINATED!</div>

<div id="joystick">
<div id="stick"></div>
</div>

<button id="boost">⚡</button>

<div id="gameOver">

<div class="overPanel">

<h2>GAME OVER</h2>

<p id="deathReason">Sind tapeti!</p>

<p style="margin-top:10px">
Skoor:
<b id="finalScore">0</b>
</p>

<button
class="mainBtn green"
style="margin-top:20px"
onclick="location.reload()">
🔄 TAGASI MENÜÜS
</button>

</div>
</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const minimap=document.getElementById("minimap");
const mapCtx=minimap.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){
    W=innerWidth;
    H=innerHeight;
    canvas.width=W;
    canvas.height=H;
}

addEventListener("resize",resize);
resize();

const WORLD=20000;

const foods=[];

const FOOD_COUNT=1100;

const foodColors=[
    "#63ff78",
    "#ffd84d",
    "#ff6075",
    "#55c9ff",
    "#c76cff",
    "#ff963d"
];

function makeFood(x,y){

    return {
        x:x===undefined?Math.random()*WORLD:x,
        y:y===undefined?Math.random()*WORLD:y,
        radius:3+Math.random()*5,
        color:foodColors[
            Math.floor(Math.random()*foodColors.length)
        ],
        value:1+Math.floor(Math.random()*5)
    };
}

for(let i=0;i<FOOD_COUNT;i++){
    foods.push(makeFood());
}

const me={
    id:null,
    x:10000,
    y:10000,
    angle:0,
    targetAngle:0,
    length:20,
    color:"#63ff78",
    skin:"green",
    name:"Player"
};

let body=[];
let others={};
let bots=[];
let score=0;
let kills=0;
let running=false;
let dead=false;
let boosting=false;
let singlePlayer=false;

let socket=null;
let connected=false;

const keys={};

function playerName(){

    return(
        document.getElementById("name").value.trim() ||
        "Player"
    ).substring(0,16);
}

document.querySelectorAll(".skin").forEach(button=>{

    button.addEventListener("click",()=>{

        document.querySelectorAll(".skin")
        .forEach(b=>b.classList.remove("selected"));

        button.classList.add("selected");

        me.color=button.dataset.color;
        me.skin=button.dataset.skin;
    });
});

function connect(){

    const protocol=
        location.protocol==="https:" ? "wss:" : "ws:";

    if(location.protocol==="file:"){
        setConnection("🟢 Singleplayer valmis");
        return;
    }

    socket=new WebSocket(
        protocol+"//"+location.host
    );

    setConnection("🟡 Ühendamine...");

    socket.onopen=()=>{

        connected=true;
        setConnection("🟢 Server ühendatud");
    };

    socket.onclose=()=>{

        connected=false;
        setConnection("🔴 Ühendus katkes");
    };

    socket.onerror=()=>{

        connected=false;
        setConnection("🔴 Serveri viga");
    };

    socket.onmessage=e=>{

        try{
            serverMessage(JSON.parse(e.data));
        }catch(err){
            console.log(err);
        }
    };
}

function send(data){

    if(
        !socket ||
        socket.readyState!==WebSocket.OPEN
    ){
        return false;
    }

    socket.send(JSON.stringify(data));
    return true;
}

function serverMessage(data){

    if(data.type==="roomCreated"){

        me.id=data.id||me.id;
        showRoom(data.code);
        return;
    }

    if(data.type==="roomJoined"){

        me.id=data.id||me.id;
        showRoom(data.code);
        return;
    }

    if(data.type==="lobby"){

        updateLobby(data.players||[]);
        return;
    }

    if(data.type==="gameStart"){

        me.id=data.id||me.id;
        startGame(false);
        return;
    }

    if(data.type==="players"){

        others=data.players||{};
        updatePlayerCount();
        return;
    }

    if(data.type==="playerKilled"){

        if(data.id!==me.id){
            showKill();
        }

        return;
    }

    if(data.type==="gameOver"){

        die(data.reason||"Sind tapeti!");
        return;
    }

    if(data.type==="error"){

        showError(data.message||"Serveri viga");
    }
}

function showRoom(code){

    document.getElementById("roomBox").style.display="block";
    document.getElementById("roomCode").textContent=code;
}

function updateLobby(players){

    const box=document.getElementById("players");

    box.innerHTML="";

    players.forEach(p=>{

        const row=document.createElement("div");

        row.className="playerRow";

        row.innerHTML=
            (p.host?"👑 ":"🐍 ")+
            escapeHtml(p.name||"Player");

        row.style.color=p.color||"#fff";

        box.appendChild(row);
    });

    if(players.length){
        document.getElementById("startBtn").style.display="block";
    }
}

function escapeHtml(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;");
}

function showError(text){
    document.getElementById("error").textContent=text||"";
}

function setConnection(text){
    document.getElementById("connection").textContent=text;
}

function updatePlayerCount(){

    document.getElementById("playerCount").textContent=
        Math.max(
            1,
            Object.keys(others).length+
            bots.length
        );
}

document.getElementById("createBtn").onclick=()=>{

    showError("");

    if(!connected){

        showError(
            "Serveriga ei saanud ühendust. Proovi Singleplayerit."
        );

        return;
    }

    send({
        type:"createRoom",
        name:playerName(),
        color:me.color,
        skin:me.skin
    });
};

document.getElementById("joinBtn").onclick=()=>{

    showError("");

    const code=
        document.getElementById("roomInput")
        .value.trim().toUpperCase();

    if(code.length!==6){

        showError("Room code peab olema 6 märki.");
        return;
    }

    if(!connected){

        showError("Serveriga ei ole ühendust.");
        return;
    }

    send({
        type:"joinRoom",
        code,
        name:playerName(),
        color:me.color,
        skin:me.skin
    });
};

document.getElementById("startBtn").onclick=()=>{

    if(!send({type:"startGame"})){
        startGame(false);
    }
};

document.getElementById("singleBtn").onclick=()=>{

    startGame(true);
};

addEventListener("keydown",e=>{

    keys[e.key.toLowerCase()]=true;

    if(e.key==="Shift"){
        boosting=true;
    }
});

addEventListener("keyup",e=>{

    keys[e.key.toLowerCase()]=false;

    if(e.key==="Shift"){
        boosting=false;
    }
});

function keyboardDirection(){

    let dx=0;
    let dy=0;

    if(keys.w||keys.arrowup)dy=-1;
    if(keys.s||keys.arrowdown)dy=1;
    if(keys.a||keys.arrowleft)dx=-1;
    if(keys.d||keys.arrowright)dx=1;

    if(dx||dy){

        me.targetAngle=Math.atan2(dy,dx);
    }
}

addEventListener("mousemove",e=>{

    if(!running||innerWidth<=800)return;

    const dx=e.clientX-W/2;
    const dy=e.clientY-H/2;

    if(Math.hypot(dx,dy)<15)return;

    me.targetAngle=Math.atan2(dy,dx);
});

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joyId=null;

function moveJoystick(x,y){

    const r=joystick.getBoundingClientRect();

    const cx=r.left+r.width/2;
    const cy=r.top+r.height/2;

    let dx=x-cx;
    let dy=y-cy;

    const max=55;
    const d=Math.hypot(dx,dy);

    if(d>max){

        dx=dx/d*max;
        dy=dy/d*max;
    }

    stick.style.left=`calc(50% + ${dx}px)`;
    stick.style.top=`calc(50% + ${dy}px)`;

    if(d>7){
        me.targetAngle=Math.atan2(dy,dx);
    }
}

function resetJoystick(){

    joyId=null;
    stick.style.left="50%";
    stick.style.top="50%";
}

joystick.onpointerdown=e=>{

    joyId=e.pointerId;

    joystick.setPointerCapture(e.pointerId);

    moveJoystick(e.clientX,e.clientY);
};

joystick.onpointermove=e=>{

    if(e.pointerId===joyId){
        moveJoystick(e.clientX,e.clientY);
    }
};

joystick.onpointerup=resetJoystick;
joystick.onpointercancel=resetJoystick;

const boost=document.getElementById("boost");

boost.onpointerdown=()=>{
    boosting=true;
};

boost.onpointerup=()=>{
    boosting=false;
};

boost.onpointercancel=()=>{
    boosting=false;
};

function startGame(botMode){

    singlePlayer=botMode;

    running=true;
    dead=false;
    score=0;
    kills=0;

    document.getElementById("menu").style.display="none";
    document.getElementById("hud").style.display="flex";
    document.getElementById("minimap").style.display="block";

    me.x=5000+Math.random()*10000;
    me.y=5000+Math.random()*10000;

    me.angle=Math.random()*Math.PI*2;
    me.targetAngle=me.angle;

    body=[];

    for(let i=0;i<me.length;i++){

        body.push({
            x:me.x-Math.cos(me.angle)*i*8,
            y:me.y-Math.sin(me.angle)*i*8
        });
    }

    if(botMode){
        createBots(9);
    }else{
        bots=[];
    }

    updatePlayerCount();
}

function createBots(count){

    bots=[];

    const colors=[
        "#4da6ff",
        "#ff5570",
        "#ffd84d",
        "#b86cff",
        "#ff8a3d",
        "#00e5d4",
        "#ffffff",
        "#ef6fff",
        "#64a0ff"
    ];

    const skins=[
        "blue",
        "red",
        "yellow",
        "purple",
        "orange",
        "cyan",
        "white",
        "purple",
        "blue"
    ];

    for(let i=0;i<count;i++){

        bots.push({

            id:"bot"+i,

            x:1500+Math.random()*17000,
            y:1500+Math.random()*17000,

            angle:Math.random()*Math.PI*2,

            targetAngle:Math.random()*Math.PI*2,

            length:20+Math.random()*55,

            color:colors[i%colors.length],

            skin:skins[i%skins.length],

            name:[
                "Viper",
                "Cobra",
                "Shadow",
                "Speedy",
                "Hunter",
                "Toxic",
                "Python",
                "Blaze",
                "Ghost"
            ][i],

            body:[],

            change:0
        });
    }
}

function update(){

    if(!running||dead)return;

    keyboardDirection();

    let difference=
        me.targetAngle-me.angle;

    while(difference>Math.PI){
        difference-=Math.PI*2;
    }

    while(difference<-Math.PI){
        difference+=Math.PI*2;
    }

    me.angle+=difference*.16;

    const speed=boosting?8.8:5.8;

    me.x+=Math.cos(me.angle)*speed;
    me.y+=Math.sin(me.angle)*speed;

    me.x=Math.max(25,Math.min(WORLD-25,me.x));
    me.y=Math.max(25,Math.min(WORLD-25,me.y));

    body.unshift({
        x:me.x,
        y:me.y
    });

    while(body.length>Math.floor(me.length)){
        body.pop();
    }

    eatFood();

    if(boosting&&me.length>21){

        me.length-=.025;

        if(Math.random()<.18){

            foods.push(
                makeFood(
                    me.x-Math.cos(me.angle)*25,
                    me.y-Math.sin(me.angle)*25
                )
            );
        }
    }

    if(singlePlayer){
        updateBots();
        checkSnakeCombat();
    }else{
        sendState();
    }

    updateHUD();
}

let lastSend=0;

function sendState(){

    const now=performance.now();

    if(now-lastSend<40)return;

    lastSend=now;

    send({
        type:"state",
        x:me.x,
        y:me.y,
        angle:me.angle,
        length:me.length,
        color:me.color,
        skin:me.skin,
        name:playerName()
    });
}

function eatFood(){

    for(let i=foods.length-1;i>=0;i--){

        const food=foods[i];

        if(
            Math.hypot(
                food.x-me.x,
                food.y-me.y
            )<23+food.radius
        ){

            score+=food.value;
            me.length+=food.value*.5;

            foods.splice(i,1);
            foods.push(makeFood());
        }
    }
}

function updateBots(){

    for(const bot of bots){

        if(!bot.body.length){

            for(let i=0;i<bot.length;i++){

                bot.body.push({
                    x:bot.x-Math.cos(bot.angle)*i*8,
                    y:bot.y-Math.sin(bot.angle)*i*8
                });
            }
        }

        bot.change-=1;

        if(bot.change<=0){

            bot.change=30+Math.random()*100;

            const targetFood=
                foods[
                    Math.floor(
                        Math.random()*foods.length
                    )
                ];

            if(targetFood){

                bot.targetAngle=
                    Math.atan2(
                        targetFood.y-bot.y,
                        targetFood.x-bot.x
                    );
            }else{

                bot.targetAngle=
                    Math.random()*Math.PI*2;
            }

            /* BOTID PÕGENEB SINU EEST */

            const d=Math.hypot(
                me.x-bot.x,
                me.y-bot.y
            );

            if(d<450){

                bot.targetAngle=
                    Math.atan2(
                        bot.y-me.y,
                        bot.x-me.x
                    );
            }
        }

        let diff=
            bot.targetAngle-bot.angle;

        while(diff>Math.PI)diff-=Math.PI*2;
        while(diff<-Math.PI)diff+=Math.PI*2;

        bot.angle+=diff*.045;

        const speed=
            bot.length>75 ? 4.3 : 4.9;

        bot.x+=Math.cos(bot.angle)*speed;
        bot.y+=Math.sin(bot.angle)*speed;

        if(bot.x<30||bot.x>WORLD-30){
            bot.targetAngle=Math.PI-bot.angle;
        }

        if(bot.y<30||bot.y>WORLD-30){
            bot.targetAngle=-bot.angle;
        }

        bot.x=Math.max(30,Math.min(WORLD-30,bot.x));
        bot.y=Math.max(30,Math.min(WORLD-30,bot.y));

        bot.body.unshift({
            x:bot.x,
            y:bot.y
        });

        while(
            bot.body.length>
            Math.floor(bot.length)
        ){
            bot.body.pop();
        }

        eatBotFood(bot);
    }

    updatePlayerCount();
}

function eatBotFood(bot){

    for(let i=foods.length-1;i>=0;i--){

        const f=foods[i];

        if(
            Math.hypot(
                f.x-bot.x,
                f.y-bot.y
            )<22+f.radius
        ){

            bot.length+=f.value*.35;

            foods.splice(i,1);
            foods.push(makeFood());
        }
    }
}

function checkSnakeCombat(){

    /* SINU PEA VASTU BOTI KEHA */

    for(const bot of bots){

        for(let i=5;i<bot.body.length;i++){

            const p=bot.body[i];

            if(
                Math.hypot(
                    me.x-p.x,
                    me.y-p.y
                )<
                20+
                8
            ){

                killBot(bot);
                return;
            }
        }

        /* BOTI PEA VASTU SINU KEHA */

        for(let i=8;i<body.length;i++){

            const p=body[i];

            if(
                Math.hypot(
                    bot.x-p.x,
                    bot.y-p.y
                )<
                21+9
            ){

                die(
                    bot.name+
                    " põrkas sinu kehaga kokku!"
                );

                return;
            }
        }
    }

    /* BOT VS BOT */

    for(let a=0;a<bots.length;a++){

        for(let b=a+1;b<bots.length;b++){

            const one=bots[a];
            const two=bots[b];

            for(let i=6;i<two.body.length;i++){

                const p=two.body[i];

                if(
                    Math.hypot(
                        one.x-p.x,
                        one.y-p.y
                    )<27
                ){

                    killBot(two,one);
                    break;
                }
            }
        }
    }
}

function killBot(bot,killer){

    const index=bots.indexOf(bot);

    if(index===-1)return;

    for(let i=0;i<Math.min(bot.body.length,70);i+=3){

        const p=bot.body[i];

        foods.push(
            makeFood(
                p.x,
                p.y
            )
        );
    }

    bots.splice(index,1);

    if(killer===undefined){

        kills++;
        score+=10;
        me.length+=12;

        showKill();

        setTimeout(()=>{

            if(running&&!dead){

                spawnReplacementBot();
            }

        },1200);
    }
}

function spawnReplacementBot(){

    const colors=[
        "#4da6ff",
        "#ff5570",
        "#ffd84d",
        "#b86cff",
        "#ff8a3d",
        "#00e5d4"
    ];

    const skins=[
        "blue",
        "red",
        "yellow",
        "purple",
        "orange",
        "cyan"
    ];

    const n=bots.length;

    const bot={

        id:"bot"+Date.now(),

        x:1000+Math.random()*18000,
        y:1000+Math.random()*18000,

        angle:Math.random()*Math.PI*2,
        targetAngle:Math.random()*Math.PI*2,

        length:20+Math.random()*50,

        color:colors[n%colors.length],
        skin:skins[n%skins.length],

        name:"Bot "+(n+1),

        body:[],

        change:0
    };

    bots.push(bot);
}

function updateHUD(){

    document.getElementById("score").textContent=
        Math.floor(score);

    document.getElementById("length").textContent=
        Math.floor(me.length);

    updateLeaderboard();
}

function updateLeaderboard(){

    const list=[{

        name:playerName(),
        score:score,
        color:me.color
    }];

    for(const id in others){

        const p=others[id];

        list.push({

            name:p.name||"Player",
            score:p.score||Math.floor(p.length||20),
            color:p.color||"#fff"
        });
    }

    for(const bot of bots){

        list.push({

            name:bot.name,
            score:Math.floor(bot.length),
            color:bot.color
        });
    }

    list.sort((a,b)=>b.score-a.score);

    const top=list.slice(0,3);

    document.getElementById("lbRows").innerHTML=
        top.map((p,i)=>`

        <div class="lbRow">
            <span style="color:${p.color}">
                ${i+1}. ${escapeHtml(p.name)}
            </span>
            <b>${Math.floor(p.score)}</b>
        </div>

        `).join("");
}

let cameraX=10000;
let cameraY=10000;

function updateCamera(){

    cameraX+=(me.x-cameraX)*.12;
    cameraY+=(me.y-cameraY)*.12;
}

function draw(){

    ctx.fillStyle="#071008";

    ctx.fillRect(0,0,W,H);

    if(!running)return;

    updateCamera();

    ctx.save();

    ctx.translate(
        W/2-cameraX,
        H/2-cameraY
    );

    drawGrid();
    drawBorder();
    drawFood();

    if(singlePlayer){
        drawBots();
    }

    drawOthers();
    drawMe();

    ctx.restore();

    drawMinimap();
}

function drawGrid(){

    const grid=250;

    const left=cameraX-W/2-500;
    const right=cameraX+W/2+500;
    const top=cameraY-H/2-500;
    const bottom=cameraY+H/2+500;

    ctx.strokeStyle="rgba(99,255,120,.045)";
    ctx.lineWidth=1;

    for(
        let x=Math.floor(left/grid)*grid;
        x<right;
        x+=grid
    ){

        ctx.beginPath();
        ctx.moveTo(x,top);
        ctx.lineTo(x,bottom);
        ctx.stroke();
    }

    for(
        let y=Math.floor(top/grid)*grid;
        y<bottom;
        y+=grid
    ){

        ctx.beginPath();
        ctx.moveTo(left,y);
        ctx.lineTo(right,y);
        ctx.stroke();
    }
}

function drawBorder(){

    ctx.strokeStyle="#63ff78";
    ctx.lineWidth=18;
    ctx.shadowColor="#63ff78";
    ctx.shadowBlur=20;

    ctx.strokeRect(
        0,
        0,
        WORLD,
        WORLD
    );

    ctx.shadowBlur=0;
}

function drawFood(){

    for(const food of foods){

        if(
            Math.abs(food.x-cameraX)>W ||
            Math.abs(food.y-cameraY)>H
        )continue;

        ctx.fillStyle=food.color;
        ctx.shadowColor=food.color;
        ctx.shadowBlur=10;

        ctx.beginPath();

        ctx.arc(
            food.x,
            food.y,
            food.radius,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.shadowBlur=0;
}

function drawSnake(
    snake,
    snakeBody,
    isMe=false
){

    if(!snakeBody||!snakeBody.length)return;

    const len=snakeBody.length;

    /* KEHA TAGANT ETTE */

    for(let i=len-1;i>=0;i--){

        const p=snakeBody[i];

        const progress=i/len;

        const radius=
            9+
            (1-progress)*8;

        ctx.globalAlpha=
            .96-progress*.25;

        ctx.fillStyle=snake.color;

        ctx.shadowColor=snake.color;

        ctx.shadowBlur=
            i<12 ? 12 : 3;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            radius,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.globalAlpha=1;
    ctx.shadowBlur=0;

    /* HEAD */

    drawHead(
        snake.x,
        snake.y,
        23,
        snake.color,
        snake.skin,
        snake.angle
    );

    drawName(
        snake.name||"Player",
        snake.x,
        snake.y-34
    );
}

function drawMe(){

    drawSnake(
        {
            x:me.x,
            y:me.y,
            angle:me.angle,
            color:me.color,
            skin:me.skin,
            name:playerName()
        },
        body,
        true
    );
}

function drawBots(){

    for(const bot of bots){

        drawSnake(
            bot,
            bot.body,
            false
        );
    }
}

function drawOthers(){

    for(const id in others){

        if(id===me.id)continue;

        const p=others[id];

        if(!p)continue;

        const length=Math.max(
            20,
            Math.min(
                180,
                Math.floor(p.length||20)
            )
        );

        /*
        SERVERIST TULEB AINULT PEAPOSITSIOON.
        TEEME TERVE SUJUVA KEHA.
        */

        const fakeBody=[];

        for(let i=0;i<length;i++){

            fakeBody.push({

                x:
                    p.x-
                    Math.cos(p.angle||0)*
                    i*8,

                y:
                    p.y-
                    Math.sin(p.angle||0)*
                    i*8
            });
        }

        drawSnake(
            {
                x:p.x,
                y:p.y,
                angle:p.angle||0,
                color:p.color||"#4da6ff",
                skin:p.skin||getSkin(p.name),
                name:p.name||"Player"
            },
            fakeBody
        );
    }
}

function getSkin(name){

    const skins=[
        "green",
        "blue",
        "red",
        "yellow",
        "purple",
        "orange",
        "white",
        "cyan"
    ];

    let hash=0;

    for(let i=0;i<String(name).length;i++){
        hash+=String(name).charCodeAt(i);
    }

    return skins[
        Math.abs(hash)%skins.length
    ];
}

function drawHead(
    x,
    y,
    radius,
    color,
    skin,
    angle
){

    ctx.save();

    ctx.translate(x,y);
    ctx.rotate(angle);

    ctx.fillStyle=color;

    ctx.shadowColor=color;
    ctx.shadowBlur=20;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        radius,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;

    /* VÄLINE DETAIL */

    if(skin==="blue"){

        ctx.strokeStyle="#d9f7ff";
        ctx.lineWidth=4;

        ctx.beginPath();
        ctx.arc(
            0,
            0,
            radius-4,
            0,
            Math.PI*2
        );
        ctx.stroke();
    }

    if(skin==="red"){

        ctx.strokeStyle="#ffd1d8";
        ctx.lineWidth=3;

        ctx.beginPath();

        ctx.moveTo(
            -radius*.65,
            -radius*.55
        );

        ctx.lineTo(
            radius*.65,
            radius*.55
        );

        ctx.moveTo(
            radius*.65,
            -radius*.55
        );

        ctx.lineTo(
            -radius*.65,
            radius*.55
        );

        ctx.stroke();
    }

    if(skin==="yellow"){

        ctx.fillStyle="#fff3a0";

        ctx.beginPath();

        ctx.arc(
            -2,
            0,
            radius*.38,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    if(skin==="purple"){

        ctx.fillStyle="#f0c9ff";

        for(let i=0;i<6;i++){

            const a=i*Math.PI/3;

            ctx.beginPath();

            ctx.arc(
                Math.cos(a)*radius*.55,
                Math.sin(a)*radius*.55,
                4,
                0,
                Math.PI*2
            );

            ctx.fill();
        }
    }

    if(skin==="orange"){

        ctx.strokeStyle="#ffe2c5";
        ctx.lineWidth=3;

        for(let i=-1;i<=1;i++){

            ctx.beginPath();

            ctx.moveTo(
                -radius*.7,
                i*radius*.45
            );

            ctx.lineTo(
                radius*.7,
                i*radius*.45
            );

            ctx.stroke();
        }
    }

    if(skin==="cyan"){

        ctx.strokeStyle="#d0fffa";
        ctx.lineWidth=4;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            radius*.65,
            0,
            Math.PI*2
        );

        ctx.stroke();
    }

    if(skin==="white"){

        ctx.fillStyle="#9b9b9b";

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            radius*.65,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    /* EYES */

    ctx.fillStyle="white";

    ctx.beginPath();

    ctx.ellipse(
        10,
        -7,
        7,
        6,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.ellipse(
        10,
        7,
        7,
        6,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* PUPILS */

    ctx.fillStyle="#101010";

    ctx.beginPath();

    ctx.arc(
        12,
        -7,
        3.2,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        12,
        7,
        3.2,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* MOUTH */

    ctx.strokeStyle="#111";
    ctx.lineWidth=2.5;

    ctx.beginPath();

    ctx.arc(
        15,
        0,
        6,
        -.7,
        .7
    );

    ctx.stroke();

    /* TONGUE */

    ctx.strokeStyle="#ff6377";
    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(20,0);
    ctx.lineTo(27,0);
    ctx.lineTo(30,-4);

    ctx.moveTo(27,0);
    ctx.lineTo(30,4);

    ctx.stroke();

    ctx.restore();
}

function drawName(name,x,y){

    ctx.save();

    ctx.textAlign="center";

    ctx.font="bold 12px Arial";

    ctx.fillStyle="white";

    ctx.shadowColor="black";
    ctx.shadowBlur=6;

    ctx.fillText(
        name,
        x,
        y
    );

    ctx.restore();
}

function drawMinimap(){

    const size=minimap.width;

    mapCtx.clearRect(
        0,
        0,
        size,
        size
    );

    mapCtx.fillStyle="#061007";

    mapCtx.fillRect(
        0,
        0,
        size,
        size
    );

    /* FOOD */

    for(const food of foods){

        const x=food.x/WORLD*size;
        const y=food.y/WORLD*size;

        mapCtx.fillStyle=food.color;
        mapCtx.globalAlpha=.35;

        mapCtx.beginPath();

        mapCtx.arc(
            x,
            y,
            1.2,
            0,
            Math.PI*2
        );

        mapCtx.fill();
    }

    mapCtx.globalAlpha=1;

    /* BOTS */

    for(const bot of bots){

        const x=bot.x/WORLD*size;
        const y=bot.y/WORLD*size;

        mapCtx.fillStyle=bot.color;

        mapCtx.beginPath();

        mapCtx.arc(
            x,
            y,
            4,
            0,
            Math.PI*2
        );

        mapCtx.fill();
    }

    /* PLAYERS */

    for(const id in others){

        if(id===me.id)continue;

        const p=others[id];

        mapCtx.fillStyle=p.color||"#4da6ff";

        mapCtx.beginPath();

        mapCtx.arc(
            p.x/WORLD*size,
            p.y/WORLD*size,
            4,
            0,
            Math.PI*2
        );

        mapCtx.fill();
    }

    /* ME */

    mapCtx.fillStyle=me.color;

    mapCtx.shadowColor=me.color;
    mapCtx.shadowBlur=10;

    mapCtx.beginPath();

    mapCtx.arc(
        me.x/WORLD*size,
        me.y/WORLD*size,
        6,
        0,
        Math.PI*2
    );

    mapCtx.fill();

    mapCtx.shadowBlur=0;

    mapCtx.strokeStyle="#63ff78";
    mapCtx.lineWidth=2;

    mapCtx.strokeRect(
        1,
        1,
        size-2,
        size-2
    );
}

let killTimer=null;

function showKill(){

    const text=document.getElementById("killText");

    text.classList.add("show");

    clearTimeout(killTimer);

    killTimer=setTimeout(()=>{

        text.classList.remove("show");

    },800);
}

function die(reason){

    if(dead)return;

    dead=true;
    running=false;
    boosting=false;

    document.getElementById("deathReason").textContent=reason;

    document.getElementById("finalScore").textContent=
        Math.floor(score);

    document.getElementById("gameOver").style.display="flex";
}

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);
}

connect();
loop();

</script>
