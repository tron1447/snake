<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Snake Arena</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
    touch-action:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#061006;
    font-family:Arial,sans-serif;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
}

#menu{
    position:fixed;
    inset:0;
    z-index:20;
    overflow-y:auto;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:
        radial-gradient(circle at 50% 10%,#285e30,#0b190d 45%,#020402);
}

.panel{
    width:min(95vw,470px);
    max-height:calc(100vh - 40px);
    overflow-y:auto;
    padding:28px;
    border-radius:28px;
    background:rgba(5,14,6,.97);
    border:1px solid #315c37;
    box-shadow:0 0 60px rgba(99,255,120,.15);
    color:white;
    text-align:center;
}

.logo{
    font-size:64px;
    filter:drop-shadow(0 0 15px #63ff78);
}

h1{
    color:#63ff78;
    font-size:38px;
    margin:5px 0;
}

.subtitle{
    color:#819582;
    margin-bottom:18px;
}

input{
    width:100%;
    height:48px;
    margin:5px 0;
    border-radius:12px;
    border:1px solid #315c37;
    background:#071007;
    color:white;
    text-align:center;
    outline:none;
}

.btn{
    width:100%;
    min-height:48px;
    margin-top:8px;
    border-radius:12px;
    border:0;
    font-weight:bold;
}

.green{
    background:#63ff78;
    color:#031006;
}

.dark{
    background:#102014;
    color:white;
    border:1px solid #315c37;
}

#skins{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    margin:12px 0 18px;
}

.skin{
    width:58px;
    height:58px;
    border-radius:50%;
    border:3px solid transparent;
    font-size:25px;
}

.skin.selected{
    border-color:white;
    transform:scale(1.1);
    box-shadow:0 0 15px currentColor;
}

#singleInfo{
    color:#92a895;
    font-size:13px;
    margin-top:8px;
}

#hud{
    position:fixed;
    z-index:10;
    top:10px;
    left:10px;
    display:none;
    gap:7px;
}

.stat{
    background:rgba(0,0,0,.7);
    border:1px solid rgba(99,255,120,.3);
    padding:7px 10px;
    border-radius:10px;
    color:white;
}

.stat small{
    display:block;
    color:#829484;
    font-size:9px;
}

.stat b{
    font-size:16px;
}

#leaderboard{
    position:fixed;
    z-index:11;
    top:10px;
    right:10px;
    width:190px;
    padding:10px;
    border-radius:13px;
    background:rgba(0,0,0,.72);
    border:1px solid rgba(99,255,120,.25);
    color:white;
    display:none;
}

#leaderboard h3{
    color:#63ff78;
    font-size:14px;
    margin-bottom:6px;
}

.lbrow{
    display:flex;
    justify-content:space-between;
    gap:8px;
    padding:4px 0;
    font-size:12px;
}

#joystick{
    position:fixed;
    z-index:15;
    left:22px;
    bottom:22px;
    width:145px;
    height:145px;
    display:none;
    border-radius:50%;
    background:rgba(99,255,120,.08);
    border:2px solid rgba(99,255,120,.35);
}

#stick{
    position:absolute;
    left:50%;
    top:50%;
    width:62px;
    height:62px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:#63ff78;
    border:3px solid white;
    box-shadow:0 0 20px rgba(99,255,120,.5);
}

#boost{
    position:fixed;
    z-index:15;
    right:25px;
    bottom:30px;
    width:90px;
    height:90px;
    display:none;
    border-radius:50%;
    border:3px solid #b8ecff;
    background:#087bb0;
    color:white;
    font-size:28px;
}

#killText{
    position:fixed;
    z-index:18;
    top:23%;
    left:50%;
    transform:translateX(-50%) scale(.7);
    opacity:0;
    color:#63ff78;
    font-size:36px;
    font-weight:900;
    text-shadow:0 0 20px #63ff78;
    transition:.25s;
}

#killText.show{
    opacity:1;
    transform:translateX(-50%) scale(1);
}

#gameOver{
    position:fixed;
    inset:0;
    z-index:30;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.8);
}

.over{
    width:min(90vw,400px);
    background:#081008;
    border:1px solid #315c37;
    border-radius:25px;
    padding:30px;
    color:white;
    text-align:center;
}

.over h2{
    color:#ff596c;
    font-size:38px;
    margin-bottom:10px;
}

@media(max-width:800px){
    #joystick,
    #boost{
        display:block;
    }

    #leaderboard{
        width:145px;
        font-size:11px;
    }

    #hud{
        transform:scale(.9);
        transform-origin:top left;
    }

    .panel{
        padding:22px;
    }
}
</style>
</head>

<script>

/* =====================================================
   BASIC
===================================================== */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){
    W=innerWidth;
    H=innerHeight;
    canvas.width=W;
    canvas.height=H;
}

addEventListener("resize",resize);
resize();


/* =====================================================
   WORLD
===================================================== */

const WORLD=18000;


/* =====================================================
   FOOD
===================================================== */

const foods=[];

const FOOD_COUNT=1200;

const foodColors=[
    "#63ff78",
    "#ffd84d",
    "#ff6075",
    "#55c9ff",
    "#c76cff",
    "#ff963d"
];

function createFood(x,y,value){

    return {
        x:x ?? Math.random()*WORLD,
        y:y ?? Math.random()*WORLD,
        radius:3+Math.random()*4,
        value:value ?? (1+Math.floor(Math.random()*4)),
        color:foodColors[
            Math.floor(Math.random()*foodColors.length)
        ]
    };
}

for(let i=0;i<FOOD_COUNT;i++){
    foods.push(createFood());
}


/* =====================================================
   PLAYER
===================================================== */

const me={
    x:9000,
    y:9000,
    angle:0,
    targetAngle:0,
    length:25,
    color:"#63ff78",
    skin:"green",
    name:"Player",
    score:0,
    coins:0,
    alive:true
};

let body=[];

let bots=[];

let running=false;

let gameMode="single";

let boosting=false;

let cameraX=me.x;
let cameraY=me.y;


/* =====================================================
   SKINS
===================================================== */

document.querySelectorAll(".skin").forEach(btn=>{

    btn.onclick=()=>{

        document.querySelectorAll(".skin")
        .forEach(x=>x.classList.remove("selected"));

        btn.classList.add("selected");

        me.color=btn.dataset.color;
        me.skin=btn.dataset.skin;
    };
});


/* =====================================================
   MENU
===================================================== */

const nameInput=document.getElementById("name");

function getName(){
    return(
        nameInput.value.trim() || "Player"
    ).substring(0,16);
}

document.getElementById("singleBtn").onclick=()=>{

    gameMode="single";

    startSingleplayer();
};

document.getElementById("multiBtn").onclick=()=>{

    const box=document.getElementById("multiBox");

    box.style.display=
        box.style.display==="none"
        ? "block"
        : "none";
};


/* =====================================================
   SINGLEPLAYER
===================================================== */

function startSingleplayer(){

    gameMode="single";

    running=true;

    me.alive=true;

    me.name=getName();

    me.score=0;

    me.coins=0;

    me.length=25;

    me.x=
        WORLD/2+
        (Math.random()-.5)*3000;

    me.y=
        WORLD/2+
        (Math.random()-.5)*3000;

    me.angle=Math.random()*Math.PI*2;

    me.targetAngle=me.angle;

    body=[];

    createBody();

    bots=[];

    createBots(14);

    document.getElementById("menu").style.display="none";

    document.getElementById("hud").style.display="flex";

    document.getElementById("leaderboard").style.display="block";

    updateHUD();
}


/* =====================================================
   CREATE BOTS
===================================================== */

const botNames=[
    "Shadow",
    "Speedy",
    "Cobra",
    "Python",
    "Noodle",
    "Venom",
    "Hunter",
    "Turbo",
    "Ghost",
    "Fire",
    "Bluey",
    "Crusher",
    "King",
    "Danger",
    "Spike"
];

const botSkins=[
    ["#ff5570","red"],
    ["#4da6ff","blue"],
    ["#ffd84d","yellow"],
    ["#b86cff","purple"],
    ["#ff8a3d","orange"],
    ["#00e5d4","cyan"],
    ["#ffffff","white"]
];

function createBots(count){

    for(let i=0;i<count;i++){

        let x,y;

        do{
            x=1500+Math.random()*(WORLD-3000);
            y=1500+Math.random()*(WORLD-3000);
        }
        while(
            Math.hypot(x-me.x,y-me.y)<1000
        );

        const skin=
            botSkins[
                Math.floor(Math.random()*botSkins.length)
            ];

        const bot={
            id:"bot_"+i,

            name:
                botNames[
                    Math.floor(Math.random()*botNames.length)
                ]+" "+(i+1),

            x:x,
            y:y,

            angle:Math.random()*Math.PI*2,

            targetAngle:Math.random()*Math.PI*2,

            length:25+Math.random()*65,

            color:skin[0],

            skin:skin[1],

            score:Math.floor(
                Math.random()*80
            ),

            alive:true,

            think:0,

            boost:false,

            body:[]
        };

        createBotBody(bot);

        bots.push(bot);
    }
}

function createBody(){

    body=[];

    for(
        let i=0;
        i<Math.floor(me.length);
        i++
    ){

        body.push({
            x:
                me.x-
                Math.cos(me.angle)*i*9,

            y:
                me.y-
                Math.sin(me.angle)*i*9
        });
    }
}

function createBotBody(bot){

    bot.body=[];

    for(
        let i=0;
        i<Math.floor(bot.length);
        i++
    ){

        bot.body.push({
            x:
                bot.x-
                Math.cos(bot.angle)*i*9,

            y:
                bot.y-
                Math.sin(bot.angle)*i*9
        });
    }
}


/* =====================================================
   KEYBOARD
===================================================== */

const keys={};

addEventListener("keydown",e=>{

    keys[e.key.toLowerCase()]=true;

    if(e.key==="Shift"){
        boosting=true;
    }
});

addEventListener("keyup",e=>{

    keys[e.key.toLowerCase()]=false;

    if(e.key==="Shift"){
        boosting=false;
    }
});

function keyboardDirection(){

    let dx=0;
    let dy=0;

    if(keys.w || keys.arrowup)dy--;

    if(keys.s || keys.arrowdown)dy++;

    if(keys.a || keys.arrowleft)dx--;

    if(keys.d || keys.arrowright)dx++;

    if(dx||dy){

        me.targetAngle=Math.atan2(dy,dx);
    }
}


/* =====================================================
   MOUSE
===================================================== */

addEventListener("mousemove",e=>{

    if(!running)return;

    if(innerWidth<=800)return;

    const dx=e.clientX-W/2;
    const dy=e.clientY-H/2;

    if(Math.hypot(dx,dy)>15){

        me.targetAngle=Math.atan2(dy,dx);
    }
});


/* =====================================================
   JOYSTICK
===================================================== */

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joyId=null;

function moveJoystick(x,y){

    const r=joystick.getBoundingClientRect();

    const cx=r.left+r.width/2;
    const cy=r.top+r.height/2;

    let dx=x-cx;
    let dy=y-cy;

    const max=55;

    const d=Math.hypot(dx,dy);

    if(d>max){

        dx=dx/d*max;
        dy=dy/d*max;
    }

    stick.style.left=
        `calc(50% + ${dx}px)`;

    stick.style.top=
        `calc(50% + ${dy}px)`;

    if(d>7){

        me.targetAngle=Math.atan2(dy,dx);
    }
}

function resetJoystick(){

    joyId=null;

    stick.style.left="50%";
    stick.style.top="50%";
}

joystick.onpointerdown=e=>{

    joyId=e.pointerId;

    joystick.setPointerCapture(e.pointerId);

    moveJoystick(e.clientX,e.clientY);
};

joystick.onpointermove=e=>{

    if(e.pointerId===joyId){

        moveJoystick(
            e.clientX,
            e.clientY
        );
    }
};

joystick.onpointerup=resetJoystick;
joystick.onpointercancel=resetJoystick;


/* =====================================================
   BOOST
===================================================== */

const boostButton=document.getElementById("boost");

boostButton.onpointerdown=()=>{
    boosting=true;
};

boostButton.onpointerup=()=>{
    boosting=false;
};

boostButton.onpointercancel=()=>{
    boosting=false;
};


/* =====================================================
   ANGLE
===================================================== */

function turnSnake(snake){

    let diff=
        snake.targetAngle-
        snake.angle;

    while(diff>Math.PI){
        diff-=Math.PI*2;
    }

    while(diff<-Math.PI){
        diff+=Math.PI*2;
    }

    snake.angle+=diff*.12;
}


/* =====================================================
   PLAYER UPDATE
===================================================== */

function updatePlayer(){

    if(!me.alive)return;

    keyboardDirection();

    turnSnake(me);

    let speed=boosting ? 8.4 : 5.6;

    me.x+=Math.cos(me.angle)*speed;
    me.y+=Math.sin(me.angle)*speed;

    me.x=Math.max(30,Math.min(WORLD-30,me.x));
    me.y=Math.max(30,Math.min(WORLD-30,me.y));

    body.unshift({
        x:me.x,
        y:me.y
    });

    while(body.length<Math.floor(me.length)){
        body.push({
            x:me.x,
            y:me.y
        });
    }

    while(body.length>Math.floor(me.length)){
        body.pop();
    }

    eatFoodPlayer();

    if(boosting && me.length>25){

        me.length-=.035;

        if(Math.random()<.13){

            foods.push(
                createFood(
                    body[body.length-1].x,
                    body[body.length-1].y,
                    1
                )
            );
        }
    }

    checkPlayerBotCollisions();
}


/* =====================================================
   FOOD
===================================================== */

function eatFoodPlayer(){

    for(let i=foods.length-1;i>=0;i--){

        const f=foods[i];

        if(
            Math.hypot(
                f.x-me.x,
                f.y-me.y
            )<
            24+f.radius
        ){

            me.score+=f.value;

            me.coins+=1;

            me.length+=f.value*.55;

            foods[i]=createFood();
        }
    }
}


/* =====================================================
   BOT AI
===================================================== */

function updateBots(){

    for(const bot of bots){

        if(!bot.alive)continue;

        bot.think--;

        if(bot.think<=0){

            bot.think=15+Math.random()*35;

            let target=null;

            let best=Infinity;

            /* SEARCH FOOD */

            for(let i=0;i<foods.length;i++){

                const f=foods[i];

                const d=
                    Math.hypot(
                        f.x-bot.x,
                        f.y-bot.y
                    );

                if(d<700 && d<best){

                    best=d;
                    target=f;
                }
            }

            /* SOMETIMES CHASE PLAYER */

            const playerDistance=
                Math.hypot(
                    me.x-bot.x,
                    me.y-bot.y
                );

            if(
                me.alive &&
                playerDistance<650 &&
                me.length<bot.length*1.15
            ){

                target=me;
            }

            if(target){

                bot.targetAngle=
                    Math.atan2(
                        target.y-bot.y,
                        target.x-bot.x
                    );
            }
            else{

                bot.targetAngle+=
                    (Math.random()-.5)*1.5;
            }

            bot.boost=
                Math.random()<.08 &&
                bot.length>30;
        }

        turnSnake(bot);

        const speed=
            bot.boost ? 6.8 : 4.5;

        bot.x+=Math.cos(bot.angle)*speed;
        bot.y+=Math.sin(bot.angle)*speed;

        /* WALL */

        if(bot.x<100){

            bot.targetAngle=0;
        }

        if(bot.x>WORLD-100){

            bot.targetAngle=Math.PI;
        }

        if(bot.y<100){

            bot.targetAngle=Math.PI/2;
        }

        if(bot.y>WORLD-100){

            bot.targetAngle=-Math.PI/2;
        }

        bot.x=Math.max(30,Math.min(WORLD-30,bot.x));
        bot.y=Math.max(30,Math.min(WORLD-30,bot.y));

        bot.body.unshift({
            x:bot.x,
            y:bot.y
        });

        while(bot.body.length<Math.floor(bot.length)){
            bot.body.push({
                x:bot.x,
                y:bot.y
            });
        }

        while(bot.body.length>Math.floor(bot.length)){
            bot.body.pop();
        }

        botEatFood();

        if(bot.boost && bot.length>25){

            bot.length-=.025;

            if(Math.random()<.08){

                foods.push(
                    createFood(
                        bot.body[
                            bot.body.length-1
                        ].x,
                        bot.body[
                            bot.body.length-1
                        ].y,
                        1
                    )
                );
            }
        }
    }

    checkBotVsBot();
}


/* =====================================================
   BOT FOOD
===================================================== */

function botEatFood(){

    for(let i=foods.length-1;i>=0;i--){

        const f=foods[i];

        if(
            Math.hypot(
                f.x-this.x,
                f.y-this.y
            )<0
        ){
        }
    }

    /* find bot by body reference */
}

function botEatFoodReal(bot){

    for(let i=foods.length-1;i>=0;i--){

        const f=foods[i];

        if(
            Math.hypot(
                f.x-bot.x,
                f.y-bot.y
            )<
            23+f.radius
        ){

            bot.score+=f.value;

            bot.length+=f.value*.5;

            foods[i]=createFood();
        }
    }
}


/* Replace bot food update */

const originalUpdateBots=updateBots;


/* =====================================================
   BOT/BOT COLLISION
===================================================== */

function killBot(bot){

    if(!bot.alive)return;

    bot.alive=false;

    /* DROP FOOD */

    for(let i=0;i<Math.min(25,Math.floor(bot.length/2));i++){

        const p=
            bot.body[
                Math.floor(
                    Math.random()*bot.body.length
                )
            ];

        if(p){

            foods.push(
                createFood(
                    p.x,
                    p.y,
                    2+Math.floor(Math.random()*3)
                )
            );
        }
    }
}

function checkBotVsBot(){

    for(let a=0;a<bots.length;a++){

        const A=bots[a];

        if(!A.alive)continue;

        for(let b=0;b<bots.length;b++){

            if(a===b)continue;

            const B=bots[b];

            if(!B.alive)continue;

            for(
                let i=8;
                i<B.body.length;
                i+=3
            ){

                const p=B.body[i];

                if(
                    Math.hypot(
                        A.x-p.x,
                        A.y-p.y
                    )<18
                ){

                    if(A.length<=B.length){

                        killBot(A);

                    }else{

                        killBot(B);
                    }

                    break;
                }
            }
        }
    }
}


/* =====================================================
   PLAYER COMBAT
===================================================== */

function checkPlayerBotCollisions(){

    if(!me.alive)return;

    for(const bot of bots){

        if(!bot.alive)continue;

        /* BOT HEAD HITS PLAYER BODY */

        for(
            let i=8;
            i<body.length;
            i+=2
        ){

            const p=body[i];

            if(
                Math.hypot(
                    bot.x-p.x,
                    bot.y-p.y
                )<20
            ){

                if(me.length>=bot.length){

                    killBot(bot);

                    me.score+=25;

                    me.coins+=10;

                    showKill();

                }else{

                    playerDeath(
                        "🤖 "+bot.name+
                        " sõitis sinu sisse!"
                    );
                }

                return;
            }
        }

        /* PLAYER HEAD HITS BOT BODY */

        for(
            let i=8;
            i<bot.body.length;
            i+=2
        ){

            const p=bot.body[i];

            if(
                Math.hypot(
                    me.x-p.x,
                    me.y-p.y
                )<20
            ){

                if(
                    bot.length>me.length
                ){

                    playerDeath(
                        "💥 "+bot.name+
                        " võitis võitluse!"
                    );

                }else{

                    killBot(bot);

                    me.score+=25;

                    me.coins+=10;

                    showKill();
                }

                return;
            }
        }

        /* HEAD VS HEAD */

        const headDistance=
            Math.hypot(
                me.x-bot.x,
                me.y-bot.y
            );

        if(headDistance<30){

            if(me.length>=bot.length){

                killBot(bot);

                me.score+=25;

                me.coins+=10;

                showKill();

            }else{

                playerDeath(
                    "💥 "+bot.name+
                    " oli suurem!"
                );
            }
        }
    }
}


/* =====================================================
   DRAW GRID
===================================================== */

function drawGrid(){

    const grid=300;

    const left=cameraX-W/2-600;
    const right=cameraX+W/2+600;
    const top=cameraY-H/2-600;
    const bottom=cameraY+H/2+600;

    ctx.strokeStyle="rgba(99,255,120,.055)";
    ctx.lineWidth=1;

    for(
        let x=Math.floor(left/grid)*grid;
        x<right;
        x+=grid
    ){

        ctx.beginPath();
        ctx.moveTo(x,top);
        ctx.lineTo(x,bottom);
        ctx.stroke();
    }

    for(
        let y=Math.floor(top/grid)*grid;
        y<bottom;
        y+=grid
    ){

        ctx.beginPath();
        ctx.moveTo(left,y);
        ctx.lineTo(right,y);
        ctx.stroke();
    }
}


/* =====================================================
   FOOD DRAW
===================================================== */

function drawFood(){

    for(const f of foods){

        if(
            Math.abs(f.x-cameraX)>W+100 ||
            Math.abs(f.y-cameraY)>H+100
        )continue;

        ctx.fillStyle=f.color;
        ctx.shadowColor=f.color;
        ctx.shadowBlur=9;

        ctx.beginPath();

        ctx.arc(
            f.x,
            f.y,
            f.radius,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.shadowBlur=0;
}


/* =====================================================
   SKIN
===================================================== */

function drawSkinHead(x,y,r,color,skin,angle){

    ctx.save();

    ctx.translate(x,y);

    ctx.rotate(angle);

    /* FULL HEAD */

    ctx.fillStyle=color;
    ctx.shadowColor=color;
    ctx.shadowBlur=18;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        r,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;

    /* SKIN DETAILS */

    if(skin==="red"){

        ctx.strokeStyle="#ffd0d5";
        ctx.lineWidth=3;

        ctx.beginPath();

        ctx.moveTo(-13,-13);
        ctx.lineTo(13,13);

        ctx.moveTo(13,-13);
        ctx.lineTo(-13,13);

        ctx.stroke();
    }

    if(skin==="blue"){

        ctx.strokeStyle="#e0f8ff";
        ctx.lineWidth=3;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            r-4,
            0,
            Math.PI*2
        );

        ctx.stroke();
    }

    if(skin==="yellow"){

        ctx.fillStyle="#fff4a8";

        ctx.beginPath();

        ctx.arc(
            -2,
            0,
            7,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    if(skin==="purple"){

        ctx.fillStyle="#efc9ff";

        for(let i=0;i<6;i++){

            const a=i*Math.PI/3;

            ctx.beginPath();

            ctx.arc(
                Math.cos(a)*15,
                Math.sin(a)*15,
                3,
                0,
                Math.PI*2
            );

            ctx.fill();
        }
    }

    if(skin==="orange"){

        ctx.strokeStyle="#ffe1c2";
        ctx.lineWidth=3;

        for(let i=-1;i<=1;i++){

            ctx.beginPath();

            ctx.moveTo(-15,i*7);
            ctx.lineTo(15,i*7);

            ctx.stroke();
        }
    }

    if(skin==="cyan"){

        ctx.strokeStyle="#d5fffa";
        ctx.lineWidth=3;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            r*.65,
            0,
            Math.PI*2
        );

        ctx.stroke();
    }

    if(skin==="white"){

        ctx.strokeStyle="#bde8ff";
        ctx.lineWidth=2;

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            r-3,
            0,
            Math.PI*2
        );

        ctx.stroke();
    }

    /* EYES */

    ctx.fillStyle="white";

    ctx.beginPath();

    ctx.arc(
        9,
        -7,
        6,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        9,
        7,
        6,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* PUPILS */

    ctx.fillStyle="#111";

    ctx.beginPath();

    ctx.arc(
        11,
        -7,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        11,
        7,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();

    /* MOUTH */

    ctx.strokeStyle="#111";
    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.arc(
        14,
        0,
        5,
        -.7,
        .7
    );

    ctx.stroke();

    ctx.restore();
}


/* =====================================================
   NAME
===================================================== */

function drawName(name,x,y){

    ctx.save();

    ctx.textAlign="center";

    ctx.font="bold 12px Arial";

    ctx.fillStyle="white";

    ctx.shadowColor="black";
    ctx.shadowBlur=5;

    ctx.fillText(
        name,
        x,
        y
    );

    ctx.restore();
}


/* =====================================================
   DRAW PLAYER
===================================================== */

function drawSnakeBody(snakeBody,length,color){

    for(
        let i=snakeBody.length-1;
        i>=0;
        i--
    ){

        const p=snakeBody[i];

        const progress=i/snakeBody.length;

        const radius=
            8+
            (1-progress)*8;

        ctx.globalAlpha=
            1-progress*.3;

        ctx.fillStyle=color;

        ctx.shadowColor=color;

        ctx.shadowBlur=
            i<10 ? 10 : 3;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            radius,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.globalAlpha=1;
    ctx.shadowBlur=0;
}

function drawMe(){

    drawSnakeBody(
        body,
        me.length,
        me.color
    );

    drawSkinHead(
        me.x,
        me.y,
        22,
        me.color,
        me.skin,
        me.angle
    );

    drawName(
        me.name,
        me.x,
        me.y-32
    );
}


/* =====================================================
   DRAW BOTS
===================================================== */

function drawBots(){

    for(const bot of bots){

        if(!bot.alive)continue;

        drawSnakeBody(
            bot.body,
            bot.length,
            bot.color
        );

        drawSkinHead(
            bot.x,
            bot.y,
            22,
            bot.color,
            bot.skin,
            bot.angle
        );

        drawName(
            bot.name,
            bot.x,
            bot.y-32
        );
    }
}


/* =====================================================
   CAMERA
===================================================== */

function updateCamera(){

    cameraX+=(me.x-cameraX)*.09;
    cameraY+=(me.y-cameraY)*.09;
}


/* =====================================================
   BORDER
===================================================== */

function drawBorder(){

    ctx.strokeStyle="#63ff78";
    ctx.lineWidth=18;

    ctx.shadowColor="#63ff78";
    ctx.shadowBlur=20;

    ctx.strokeRect(
        0,
        0,
        WORLD,
        WORLD
    );

    ctx.shadowBlur=0;
}


/* =====================================================
   LEADERBOARD
===================================================== */

function updateLeaderboard(){

    const list=[];

    if(me.alive){

        list.push({
            name:me.name,
            score:Math.floor(me.score),
            me:true
        });
    }

    for(const bot of bots){

        if(bot.alive){

            list.push({
                name:bot.name,
                score:Math.floor(bot.score),
                me:false
            });
        }
    }

    list.sort((a,b)=>b.score-a.score);

    const lb=document.getElementById("lb");

    lb.innerHTML="";

    list.slice(0,7).forEach((p,i)=>{

        const row=document.createElement("div");

        row.className="lbrow";

        row.innerHTML=
            `<span>${i+1}. ${
                escapeHTML(p.name)
            }</span>
            <b>${p.score}</b>`;

        if(p.me){

            row.style.color="#63ff78";
        }

        lb.appendChild(row);
    });
}

function escapeHTML(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;");
}


/* =====================================================
   HUD
===================================================== */

function updateHUD(){

    document.getElementById("score")
        .textContent=Math.floor(me.score);

    document.getElementById("length")
        .textContent=Math.floor(me.length);

    document.getElementById("coins")
        .textContent=Math.floor(me.coins);

    updateLeaderboard();
}


/* =====================================================
   KILL
===================================================== */

let killTimer;

function showKill(){

    const el=document.getElementById("killText");

    el.classList.add("show");

    clearTimeout(killTimer);

    killTimer=setTimeout(()=>{

        el.classList.remove("show");

    },900);
}


/* =====================================================
   PLAYER DEATH
===================================================== */

function playerDeath(reason){

    if(!me.alive)return;

    me.alive=false;

    running=false;

    boosting=false;

    document.getElementById("deathReason")
        .textContent=reason;

    document.getElementById("finalScore")
        .textContent=Math.floor(me.score);

    document.getElementById("finalCoins")
        .textContent=Math.floor(me.coins);

    document.getElementById("gameOver")
        .style.display="flex";
}


/* =====================================================
   GAME OVER BUTTONS
===================================================== */

document.getElementById("againBtn").onclick=()=>{

    document.getElementById("gameOver")
        .style.display="none";

    startSingleplayer();
};

document.getElementById("menuBtn").onclick=()=>{

    location.reload();
};


/* =====================================================
   MULTIPLAYER
===================================================== */

let socket=null;

function connectServer(){

    const protocol=
        location.protocol==="https:"
        ? "wss:"
        : "ws:";

    try{

        socket=new WebSocket(
            protocol+"//"+location.host
        );

        socket.onopen=()=>{

            document.getElementById("connection")
                .textContent=
                "🟢 Server ühendatud";
        };

        socket.onclose=()=>{

            document.getElementById("connection")
                .textContent=
                "🔴 Serveriga ühendus puudub";
        };

    }catch{

        document.getElementById("connection")
            .textContent=
            "🔴 Multiplayer server puudub";
    }
}

function send(data){

    if(
        socket &&
        socket.readyState===WebSocket.OPEN
    ){

        socket.send(JSON.stringify(data));
    }
}

document.getElementById("createBtn").onclick=()=>{

    send({
        type:"createRoom",
        name:getName(),
        color:me.color
    });
};

document.getElementById("joinBtn").onclick=()=>{

    const code=
        document.getElementById("roomCode")
        .value
        .trim()
        .toUpperCase();

    if(code.length!==6){

        alert("Room code peab olema 6 märki.");

        return;
    }

    send({
        type:"joinRoom",
        code:code,
        name:getName(),
        color:me.color
    });
};


/* =====================================================
   DRAW
===================================================== */

function draw(){

    ctx.fillStyle="#061006";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    if(!running){

        return;
    }

    updateCamera();

    ctx.save();

    ctx.translate(
        W/2-cameraX,
        H/2-cameraY
    );

    drawGrid();

    drawBorder();

    drawFood();

    drawBots();

    drawMe();

    ctx.restore();
}


/* =====================================================
   FIX BOT FOOD
===================================================== */

function updateAllBots(){

    for(const bot of bots){

        if(!bot.alive)continue;

        bot.think--;

        if(bot.think<=0){

            bot.think=
                20+Math.random()*35;

            let nearest=null;

            let nearestDistance=700;

            for(const food of foods){

                const d=
                    Math.hypot(
                        food.x-bot.x,
                        food.y-bot.y
                    );

                if(d<nearestDistance){

                    nearestDistance=d;
                    nearest=food;
                }
            }

            const pd=
                Math.hypot(
                    me.x-bot.x,
                    me.y-bot.y
                );

            if(
                me.alive &&
                pd<650 &&
                me.length<bot.length
            ){

                bot.targetAngle=
                    Math.atan2(
                        me.y-bot.y,
                        me.x-bot.x
                    );
            }
            else if(nearest){

                bot.targetAngle=
                    Math.atan2(
                        nearest.y-bot.y,
                        nearest.x-bot.x
                    );
            }
            else{

                bot.targetAngle+=
                    (Math.random()-.5)*2;
            }
        }

        turnSnake(bot);

        const speed=bot.boost?6.7:4.6;

        bot.x+=Math.cos(bot.angle)*speed;
        bot.y+=Math.sin(bot.angle)*speed;

        if(bot.x<150)bot.targetAngle=0;
        if(bot.x>WORLD-150)bot.targetAngle=Math.PI;
        if(bot.y<150)bot.targetAngle=Math.PI/2;
        if(bot.y>WORLD-150)bot.targetAngle=-Math.PI/2;

        bot.x=Math.max(30,Math.min(WORLD-30,bot.x));
        bot.y=Math.max(30,Math.min(WORLD-30,bot.y));

        bot.body.unshift({
            x:bot.x,
            y:bot.y
        });

        while(bot.body.length<Math.floor(bot.length)){
            bot.body.push({
                x:bot.x,
                y:bot.y
            });
        }

        while(bot.body.length>Math.floor(bot.length)){
            bot.body.pop();
        }

        botEatFoodReal(bot);

        if(
            bot.boost &&
            bot.length>25
        ){

            bot.length-=.02;

            if(Math.random()<.07){

                const tail=
                    bot.body[
                        bot.body.length-1
                    ];

                if(tail){

                    foods.push(
                        createFood(
                            tail.x,
                            tail.y,
                            1
                        )
                    );
                }
            }
        }
    }

    checkBotVsBot();
}


/* =====================================================
   MAIN LOOP
===================================================== */

function update(){

    if(!running)return;

    updatePlayer();

    updateAllBots();

    updateHUD();
}

function loop(){

    update();

    draw();

    requestAnimationFrame(loop);
}

connectServer();

loop();

</script>
