<script>
/* ==================================================
   SNAKE ARENA
   Üks fail mängu jaoks
================================================== */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const minimap = document.getElementById("minimap");
const mapCtx = minimap.getContext("2d");

let W = innerWidth;
let H = innerHeight;

function resize(){
  W = innerWidth;
  H = innerHeight;
  canvas.width = W;
  canvas.height = H;
}

addEventListener("resize", resize);
resize();


/* ==================================================
   WORLD
================================================== */

const WORLD = 20000;


/* ==================================================
   FOOD
================================================== */

const foods = [];

const FOOD_COUNT = 700;

const foodColors = [
  "#63ff78",
  "#ffd84d",
  "#ff6075",
  "#55c9ff",
  "#c76cff",
  "#ff963d"
];

function createFood(){
  return {
    x: Math.random() * WORLD,
    y: Math.random() * WORLD,
    radius: 3 + Math.random() * 4,
    color: foodColors[
      Math.floor(Math.random() * foodColors.length)
    ],
    value: 1 + Math.floor(Math.random() * 5)
  };
}

for(let i = 0; i < FOOD_COUNT; i++){
  foods.push(createFood());
}


/* ==================================================
   PLAYER
================================================== */

const me = {
  id: null,
  x: WORLD / 2,
  y: WORLD / 2,
  angle: 0,
  targetAngle: 0,
  length: 20,
  color: "#63ff78",
  skin: "green",
  name: "Player"
};

let body = [];
let others = {};

let score = 0;
let running = false;
let dead = false;
let boosting = false;

let roomCode = null;


/* ==================================================
   SKINS
================================================== */

document.querySelectorAll(".skin").forEach(btn => {

  btn.addEventListener("click", () => {

    document.querySelectorAll(".skin")
      .forEach(x => x.classList.remove("selected"));

    btn.classList.add("selected");

    me.color = btn.dataset.color;
    me.skin = btn.dataset.skin;
  });

});


/* ==================================================
   WEBSOCKET
================================================== */

let socket = null;
let connected = false;

function connect(){

  const protocol =
    location.protocol === "https:"
      ? "wss:"
      : "ws:";

  socket = new WebSocket(
    protocol + "//" + location.host
  );

  setConnection("🟡 Ühendamine...");

  socket.onopen = () => {

    connected = true;

    setConnection("🟢 Server ühendatud");
  };

  socket.onclose = () => {

    connected = false;

    setConnection("🔴 Serveriga ühendus katkes");
  };

  socket.onerror = () => {

    setConnection("🔴 Serveri ühenduse viga");
  };

  socket.onmessage = event => {

    let data;

    try{
      data = JSON.parse(event.data);
    }catch{
      return;
    }

    handleServerMessage(data);
  };
}


function send(data){

  if(
    !socket ||
    socket.readyState !== WebSocket.OPEN
  ){
    return false;
  }

  socket.send(JSON.stringify(data));

  return true;
}


/* ==================================================
   SERVER
================================================== */

function handleServerMessage(data){

  if(data.type === "roomCreated"){

    me.id = data.id || me.id;

    roomCode = data.code;

    showRoom(data.code);

    return;
  }


  if(data.type === "roomJoined"){

    me.id = data.id || me.id;

    roomCode = data.code;

    showRoom(data.code);

    return;
  }


  if(data.type === "lobby"){

    updateLobby(data.players || []);

    return;
  }


  if(data.type === "gameStart"){

    me.id = data.id || me.id;

    startGame();

    return;
  }


  if(data.type === "players"){

    others = data.players || {};

    updatePlayerCount();

    return;
  }


  if(data.type === "gameOver"){

    die(data.reason || "Sind tapeti!");

    return;
  }


  if(data.type === "playerKilled"){

    showKill();

    return;
  }


  if(data.type === "error"){

    showError(data.message || "Midagi läks valesti.");

    return;
  }
}


/* ==================================================
   UI
================================================== */

function playerName(){

  const input = document.getElementById("name");

  return (
    input.value.trim() || "Player"
  ).substring(0,16);
}


function showRoom(code){

  document.getElementById("roomBox")
    .style.display = "block";

  document.getElementById("roomCode")
    .textContent = code;
}


function updateLobby(players){

  const box = document.getElementById("players");

  box.innerHTML = "";

  players.forEach((p, index) => {

    const row = document.createElement("div");

    row.className = "playerRow";

    row.textContent =
      (index === 0 ? "👑 " : "🐍 ") +
      (p.name || "Player");

    if(p.color){
      row.style.color = p.color;
    }

    box.appendChild(row);
  });

  if(players.length > 0){

    document.getElementById("startBtn")
      .style.display = "block";
  }
}


function updatePlayerCount(){

  const count =
    Object.keys(others).length;

  document.getElementById("playerCount")
    .textContent = Math.max(1,count);
}


function showError(text){

  document.getElementById("error")
    .textContent = text || "";
}


function setConnection(text){

  document.getElementById("connection")
    .textContent = text;
}


/* ==================================================
   CREATE ROOM
================================================== */

document.getElementById("createBtn")
  .addEventListener("click", () => {

    showError("");

    if(!connected){

      showError(
        "Serveriga pole veel ühendust."
      );

      return;
    }

    const ok = send({
      type: "createRoom",
      name: playerName(),
      color: me.color
    });

    if(!ok){
      showError("Roomi loomine ebaõnnestus.");
    }
  });


/* ==================================================
   JOIN ROOM
================================================== */

function joinRoom(){

  showError("");

  if(!connected){

    showError(
      "Serveriga pole veel ühendust."
    );

    return;
  }

  const code =
    document.getElementById("roomInput")
      .value.trim()
      .toUpperCase();

  if(code.length !== 6){

    showError(
      "Roomi kood peab olema 6 märki."
    );

    return;
  }

  send({
    type: "joinRoom",
    code: code,
    name: playerName(),
    color: me.color
  });
}

document.getElementById("joinBtn")
  .addEventListener("click", joinRoom);

document.getElementById("roomInput")
  .addEventListener("keydown", e => {

    if(e.key === "Enter"){
      joinRoom();
    }

  });


/* ==================================================
   START GAME
================================================== */

document.getElementById("startBtn")
  .addEventListener("click", () => {

    send({
      type: "startGame"
    });

  });


/* ==================================================
   KEYBOARD
================================================== */

const keys = {};

addEventListener("keydown", e => {

  keys[e.key.toLowerCase()] = true;

  if(e.key === "Shift"){
    boosting = true;
    document.getElementById("boost")
      .classList.add("active");
  }

});


addEventListener("keyup", e => {

  keys[e.key.toLowerCase()] = false;

  if(e.key === "Shift"){
    boosting = false;
    document.getElementById("boost")
      .classList.remove("active");
  }

});


function keyboardDirection(){

  let dx = 0;
  let dy = 0;

  if(keys.w || keys.arrowup) dy -= 1;
  if(keys.s || keys.arrowdown) dy += 1;
  if(keys.a || keys.arrowleft) dx -= 1;
  if(keys.d || keys.arrowright) dx += 1;

  if(dx || dy){

    me.targetAngle =
      Math.atan2(dy,dx);
  }
}


/* ==================================================
   MOUSE
================================================== */

addEventListener("mousemove", e => {

  if(!running) return;

  if(innerWidth <= 800) return;

  const dx = e.clientX - W / 2;
  const dy = e.clientY - H / 2;

  if(Math.hypot(dx,dy) < 10) return;

  me.targetAngle =
    Math.atan2(dy,dx);
});


/* ==================================================
   TOUCH JOYSTICK
================================================== */

const joystick =
  document.getElementById("joystick");

const stick =
  document.getElementById("stick");

let joyId = null;

function moveJoystick(x,y){

  const r =
    joystick.getBoundingClientRect();

  const cx =
    r.left + r.width / 2;

  const cy =
    r.top + r.height / 2;

  let dx = x - cx;
  let dy = y - cy;

  const max = 52;

  const distance =
    Math.hypot(dx,dy);

  if(distance > max){

    dx = dx / distance * max;
    dy = dy / distance * max;
  }

  stick.style.left =
    `calc(50% + ${dx}px)`;

  stick.style.top =
    `calc(50% + ${dy}px)`;

  if(distance > 7){

    me.targetAngle =
      Math.atan2(dy,dx);
  }
}


function resetJoystick(){

  joyId = null;

  stick.style.left = "50%";
  stick.style.top = "50%";
}


joystick.addEventListener("pointerdown", e => {

  joyId = e.pointerId;

  joystick.setPointerCapture(e.pointerId);

  moveJoystick(e.clientX,e.clientY);
});


joystick.addEventListener("pointermove", e => {

  if(e.pointerId !== joyId) return;

  moveJoystick(e.clientX,e.clientY);
});


joystick.addEventListener("pointerup", resetJoystick);
joystick.addEventListener("pointercancel", resetJoystick);


/* ==================================================
   BOOST
================================================== */

const boostBtn =
  document.getElementById("boost");

boostBtn.addEventListener("pointerdown", () => {

  boosting = true;

  boostBtn.classList.add("active");
});


boostBtn.addEventListener("pointerup", () => {

  boosting = false;

  boostBtn.classList.remove("active");
});


boostBtn.addEventListener("pointercancel", () => {

  boosting = false;

  boostBtn.classList.remove("active");
});


/* ==================================================
   START
================================================== */

function startGame(){

  running = true;
  dead = false;
  score = 0;

  document.getElementById("menu")
    .style.display = "none";

  document.getElementById("hud")
    .style.display = "flex";

  document.getElementById("minimap")
    .style.display = "block";

  me.x =
    2000 + Math.random() * 16000;

  me.y =
    2000 + Math.random() * 16000;

  me.angle =
    Math.random() * Math.PI * 2;

  me.targetAngle = me.angle;

  body = [];

  for(let i=0;i<Math.floor(me.length);i++){

    body.push({
      x: me.x - Math.cos(me.angle)*i*8,
      y: me.y - Math.sin(me.angle)*i*8
    });
  }
}


/* ==================================================
   UPDATE
================================================== */

let lastSend = 0;

function update(){

  if(!running || dead) return;

  keyboardDirection();

  let diff =
    me.targetAngle - me.angle;

  while(diff > Math.PI){
    diff -= Math.PI * 2;
  }

  while(diff < -Math.PI){
    diff += Math.PI * 2;
  }

  me.angle += diff * .14;

  const speed =
    boosting && me.length > 20
      ? 8
      : 4.7;

  me.x +=
    Math.cos(me.angle) * speed;

  me.y +=
    Math.sin(me.angle) * speed;

  me.x =
    Math.max(25,Math.min(WORLD-25,me.x));

  me.y =
    Math.max(25,Math.min(WORLD-25,me.y));


  body.unshift({
    x: me.x,
    y: me.y
  });


  while(body.length > Math.floor(me.length)){
    body.pop();
  }


  while(body.length < Math.floor(me.length)){

    body.push({
      x: me.x,
      y: me.y
    });
  }


  eatFood();


  if(boosting && me.length > 20){

    me.length -= .018;
  }


  const now = performance.now();

  if(now - lastSend > 40){

    lastSend = now;

    send({
      type:"state",
      x:me.x,
      y:me.y,
      angle:me.angle,
      length:me.length,
      color:me.color,
      name:playerName()
    });
  }


  document.getElementById("score")
    .textContent = Math.floor(score);

  document.getElementById("length")
    .textContent = Math.floor(me.length);
}


/* ==================================================
   FOOD
================================================== */

function eatFood(){

  for(let i=foods.length-1;i>=0;i--){

    const food = foods[i];

    const distance =
      Math.hypot(
        food.x-me.x,
        food.y-me.y
      );

    if(distance < 22 + food.radius){

      score += food.value;

      me.length += food.value * .45;

      foods[i] = createFood();
    }
  }
}


/* ==================================================
   CAMERA
================================================== */

let cameraX = me.x;
let cameraY = me.y;

function updateCamera(){

  cameraX +=
    (me.x-cameraX) * .1;

  cameraY +=
    (me.y-cameraY) * .1;
}


/* ==================================================
   DRAW
================================================== */

function draw(){

  ctx.fillStyle = "#071008";

  ctx.fillRect(0,0,W,H);

  if(!running) return;

  updateCamera();

  ctx.save();

  ctx.translate(
    W/2-cameraX,
    H/2-cameraY
  );

  drawGrid();
  drawBorder();
  drawFood();
  drawOthers();
  drawMe();

  ctx.restore();

  drawMinimap();
}


/* ==================================================
   GRID
================================================== */

function drawGrid(){

  const grid = 250;

  const left = cameraX-W/2-500;
  const right = cameraX+W/2+500;
  const top = cameraY-H/2-500;
  const bottom = cameraY+H/2+500;

  ctx.strokeStyle =
    "rgba(99,255,120,.045)";

  ctx.lineWidth = 1;

  for(
    let x=Math.floor(left/grid)*grid;
    x<right;
    x+=grid
  ){

    ctx.beginPath();
    ctx.moveTo(x,top);
    ctx.lineTo(x,bottom);
    ctx.stroke();
  }


  for(
    let y=Math.floor(top/grid)*grid;
    y<bottom;
    y+=grid
  ){

    ctx.beginPath();
    ctx.moveTo(left,y);
    ctx.lineTo(right,y);
    ctx.stroke();
  }
}


/* ==================================================
   BORDER
================================================== */

function drawBorder(){

  ctx.strokeStyle = "#63ff78";
  ctx.lineWidth = 18;
  ctx.shadowColor = "#63ff78";
  ctx.shadowBlur = 20;

  ctx.strokeRect(
    0,
    0,
    WORLD,
    WORLD
  );

  ctx.shadowBlur = 0;
}


/* ==================================================
   FOOD
================================================== */

function drawFood(){

  for(const food of foods){

    if(
      Math.abs(food.x-cameraX) > W ||
      Math.abs(food.y-cameraY) > H
    ){
      continue;
    }

    ctx.fillStyle = food.color;
    ctx.shadowColor = food.color;
    ctx.shadowBlur = 10;

    ctx.beginPath();

    ctx.arc(
      food.x,
      food.y,
      food.radius,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.shadowBlur = 0;
}


/* ==================================================
   SKIN HEAD
================================================== */

function drawSkinHead(
  x,
  y,
  radius,
  color,
  skin
){

  ctx.save();

  ctx.translate(x,y);

  ctx.fillStyle = color;

  ctx.shadowColor = color;
  ctx.shadowBlur = 18;

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    radius,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.shadowBlur = 0;


  if(skin === "blue"){

    ctx.strokeStyle = "#d5f3ff";
    ctx.lineWidth = 4;

    ctx.beginPath();

    ctx.arc(
      0,0,
      radius-4,
      0,
      Math.PI*2
    );

    ctx.stroke();
  }


  if(skin === "red"){

    ctx.strokeStyle = "#ffb5c0";
    ctx.lineWidth = 3;

    ctx.beginPath();

    ctx.moveTo(
      -radius*.65,
      -radius*.55
    );

    ctx.lineTo(
      radius*.65,
      radius*.55
    );

    ctx.moveTo(
      radius*.65,
      -radius*.55
    );

    ctx.lineTo(
      -radius*.65,
      radius*.55
    );

    ctx.stroke();
  }


  if(skin === "yellow"){

    ctx.fillStyle = "#fff2a0";

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      radius*.35,
      0,
      Math.PI*2
    );

    ctx.fill();
  }


  if(skin === "purple"){

    ctx.fillStyle = "#f0c9ff";

    for(let i=0;i<6;i++){

      const a=i*Math.PI/3;

      ctx.beginPath();

      ctx.arc(
        Math.cos(a)*radius*.55,
        Math.sin(a)*radius*.55,
        4,
        0,
        Math.PI*2
      );

      ctx.fill();
    }
  }


  if(skin === "orange"){

    ctx.strokeStyle = "#ffe2c5";
    ctx.lineWidth = 3;

    for(let i=-1;i<=1;i++){

      ctx.beginPath();

      ctx.moveTo(
        -radius*.7,
        i*radius*.45
      );

      ctx.lineTo(
        radius*.7,
        i*radius*.45
      );

      ctx.stroke();
    }
  }


  if(skin === "white"){

    ctx.strokeStyle = "#b9b9b9";
    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.arc(
      0,0,
      radius-2,
      0,
      Math.PI*2
    );

    ctx.stroke();
  }


  if(skin === "cyan"){

    ctx.strokeStyle = "#d0fffa";
    ctx.lineWidth = 4;

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      radius*.65,
      0,
      Math.PI*2
    );

    ctx.stroke();
  }


  ctx.restore();
}


/* ==================================================
   FACE
================================================== */

function drawFace(x,y,angle){

  ctx.save();

  ctx.translate(x,y);
  ctx.rotate(angle);

  /* silmad */

  ctx.fillStyle = "white";

  ctx.beginPath();

  ctx.arc(
    9,
    -7,
    6,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.beginPath();

  ctx.arc(
    9,
    7,
    6,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* pupillid */

  ctx.fillStyle = "#111";

  ctx.beginPath();

  ctx.arc(
    11,
    -7,
    3,
    0,
    Math.PI*2
  );

  ctx.fill();


  ctx.beginPath();

  ctx.arc(
    11,
    7,
    3,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* suu */

  ctx.strokeStyle = "#111";
  ctx.lineWidth = 2;

  ctx.beginPath();

  ctx.arc(
    14,
    0,
    5,
    -.7,
    .7
  );

  ctx.stroke();

  ctx.restore();
}


/* ==================================================
   MY SNAKE
================================================== */

function drawMe(){

  if(body.length === 0) return;

  for(
    let i=body.length-1;
    i>=0;
    i--
  ){

    const p = body[i];

    const progress =
      i/body.length;

    const radius =
      8 + (1-progress)*9;

    ctx.globalAlpha =
      1-progress*.3;

    ctx.fillStyle = me.color;

    ctx.shadowColor = me.color;

    ctx.shadowBlur =
      i<8 ? 14 : 4;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      radius,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;


  drawSkinHead(
    me.x,
    me.y,
    21,
    me.color,
    me.skin
  );


  drawFace(
    me.x,
    me.y,
    me.angle
  );


  drawName(
    playerName(),
    me.x,
    me.y-32
  );
}


/* ==================================================
   OTHER SNAKES
================================================== */

const skinList = [
  "green",
  "blue",
  "red",
  "yellow",
  "purple",
  "orange",
  "white",
  "cyan"
];


function getSkin(name){

  let hash = 0;

  for(let i=0;i<name.length;i++){

    hash =
      ((hash<<5)-hash)+
      name.charCodeAt(i);

    hash |= 0;
  }

  return skinList[
    Math.abs(hash)%skinList.length
  ];
}


function drawOthers(){

  for(const id in others){

    if(id === me.id) continue;

    const p = others[id];

    if(!p) continue;

    const length =
      Math.min(
        180,
        Math.max(
          20,
          Math.floor(p.length || 20)
        )
      );


    for(
      let i=length-1;
      i>=0;
      i--
    ){

      const x =
        p.x -
        Math.cos(p.angle || 0) *
        i*8;

      const y =
        p.y -
        Math.sin(p.angle || 0) *
        i*8;


      const progress =
        i/length;

      const radius =
        8+(1-progress)*8;


      ctx.globalAlpha =
        1-progress*.3;

      ctx.fillStyle =
        p.color || "#4da6ff";

      ctx.beginPath();

      ctx.arc(
        x,
        y,
        radius,
        0,
        Math.PI*2
      );

      ctx.fill();
    }


    ctx.globalAlpha = 1;


    const skin =
      getSkin(p.name || "Player");


    drawSkinHead(
      p.x,
      p.y,
      21,
      p.color || "#4da6ff",
      skin
    );


    drawFace(
      p.x,
      p.y,
      p.angle || 0
    );


    drawName(
      p.name || "Player",
      p.x,
      p.y-32
    );
  }
}


/* ==================================================
   NAME
================================================== */

function drawName(name,x,y){

  ctx.save();

  ctx.textAlign = "center";

  ctx.font =
    "bold 12px Arial";

  ctx.fillStyle = "white";

  ctx.shadowColor = "black";
  ctx.shadowBlur = 5;

  ctx.fillText(
    name,
    x,
    y
  );

  ctx.restore();
}


/* ==================================================
   MINIMAP
================================================== */

function drawMinimap(){

  const size =
    minimap.width;

  mapCtx.clearRect(
    0,0,size,size
  );

  mapCtx.fillStyle =
    "#061007";

  mapCtx.fillRect(
    0,0,size,size
  );


  /* mängijad */

  for(const id in others){

    if(id === me.id) continue;

    const p = others[id];

    if(!p) continue;

    const x =
      p.x/WORLD*size;

    const y =
      p.y/WORLD*size;

    mapCtx.fillStyle =
      p.color || "#ff5268";

    mapCtx.beginPath();

    mapCtx.arc(
      x,
      y,
      4,
      0,
      Math.PI*2
    );

    mapCtx.fill();
  }


  /* mina */

  const mx =
    me.x/WORLD*size;

  const my =
    me.y/WORLD*size;

  mapCtx.fillStyle = me.color;

  mapCtx.shadowColor = me.color;
  mapCtx.shadowBlur = 10;

  mapCtx.beginPath();

  mapCtx.arc(
    mx,
    my,
    6,
    0,
    Math.PI*2
  );

  mapCtx.fill();

  mapCtx.shadowBlur = 0;


  mapCtx.strokeStyle =
    "#63ff78";

  mapCtx.lineWidth = 2;

  mapCtx.strokeRect(
    1,
    1,
    size-2,
    size-2
  );
}

================================================== */

let killTimer = null;

function showKill(){

  const text =
    document.getElementById("killText");

  text.classList.add("show");

  clearTimeout(killTimer);

  killTimer =
    setTimeout(() => {

      text.classList.remove("show");

    },900);
}

   DEATH
================================================== */

function die(reason){

  if(dead) return;

  dead = true;
  running = false;
  boosting = false;

  document.getElementById("deathReason")
    .textContent = reason;

  document.getElementById("finalScore")
    .textContent = Math.floor(score);

  document.getElementById("gameOver")
    .style.display = "flex";
}


document.getElementById("backBtn")
  .addEventListener("click", () => {

    location.reload();

  });


/* ==================================================
   LOOP
================================================== */

function loop(){

  update();
  draw();

  requestAnimationFrame(loop);
}

   CONNECT
================================================== */

connect();
loop();
