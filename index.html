<script>

const canvas=document.getElementById("game");

const WORLD=14000;

let running=false;
let single=false;

let socket=null;

let isHost=false;

let multiplayerPlayers=[];

let coins=

let owned=
 JSON.parse(
  localStorage.getItem("snakeOwned")||
  '["green"]'
 );

let selected=
 localStorage.getItem("snakeSkin")||

const skins=[

 {

 },

 {

 },

 {

  price:250
 },

 {
  id:"cyan",

  price:300
 },

 {

 },

 {

 },

 {

 },

 {
  id:"violet",
  name:"Violet",
  color:"#7045ff",
  price:600
 },

 {
  id:"rainbow",
  name:"Rainbow",
  color:"rainbow",
  price:800
 }

];

function getColor(id){

 const s=skins.find(x=>x.id===id);

 return s?s.color:"#54ff6b";
}

function saveShop(){

 localStorage.setItem(
  "snakeCoins",
  coins
 );

 localStorage.setItem(
  "snakeOwned",
  JSON.stringify(owned)
 );

 localStorage.setItem(
  "snakeSkin",
  selected
 );

 updateCoins();
}

function updateCoins(){

 document.getElementById("menuCoins")
 .textContent=coins;

 document.getElementById("shopCoins")
 .textContent=coins;

 document.getElementById("coins")
 .textContent=coins;
}

function renderShop(){

 const grid=
  document.getElementById("skinGrid");

 grid.innerHTML="";

 for(const s of skins){

  const box=
   document.createElement("div");

  box.className="skin";

  const preview=
   document.createElement("div");

  preview.className="skinPreview";

  if(s.color==="rainbow"){

   preview.style.background=
    "linear-gradient(90deg,red,orange,yellow,lime,cyan,blue,violet,pink)";

  }else{

   preview.style.background=s.color;
  }

  const name=
   document.createElement("div");

  name.className="skinName";
  name.textContent=s.name;

  const price=
   document.createElement("div");

  price.className="skinPrice";

  if(owned.includes(s.id))
   price.textContent="✓ OLEMAS";
  else
   price.textContent="🪙 "+s.price;

  const button=
   document.createElement("button");

  if(owned.includes(s.id)){

   button.className="owned";

   button.textContent=
    selected===s.id
    ?"✓ KASUTUSES"
    :"KASUTA";

   button.onclick=()=>{

    selected=s.id;

    player.color=getColor(selected);

    saveShop();

    renderShop();
   };

  }else{

   button.textContent="OSTA";

   button.onclick=()=>{

    if(coins<s.price){

     alert(
      "Sul pole piisavalt coine!"
     );

     return;
    }

    coins-=s.price;

    owned.push(s.id);

    selected=s.id;

    player.color=getColor(selected);

    saveShop();

    renderShop();
   };
  }

  box.appendChild(preview);
  box.appendChild(name);
  box.appendChild(price);
  box.appendChild(button);

  grid.appendChild(box);
 }
}

updateCoins();
renderShop();

document.getElementById("openShop").onclick=()=>{

};

 x:WORLD/2,

/* FOOD */

const food=[];

function makeFood(){

 return{

  x:100+
   Math.random()*(WORLD-200),

  y:100+

  r:5+Math.random()*4,

  value:1+
   Math.floor(Math.random()*4),

  color:
   skins[
    Math.floor(
     Math.random()*skins.length
    )
   ].color
 };
}

for(let i=0;i<1800;i++)
 food.push(makeFood());

/* BOTS */

const bots=[];

const botNames=[
 "Shadow","Viper","Blaze","Ghost",
 "Python","Storm","Ninja","Cobra",
 "Turbo","Venom","Rex","Pixel"
];

function makeBot(){

 const angle=
  Math.random()*Math.PI*2;

 const b={

  id:Math.random().toString(36),

  name:
   botNames[
    Math.floor(
     Math.random()*botNames.length
    )
   ],

  x:1000+
   Math.random()*(WORLD-2000),

  y:1000+
   Math.random()*(WORLD-2000),

  angle:angle,
  target:angle,

  length:75+
   Math.random()*220,

  score:
   Math.floor(
    Math.random()*300
   ),

  color:
   getColor(
    skins[
     Math.floor(
      Math.random()*skins.length
     )
    ].id
   ),

  body:[],

  timer:0
 };

 for(let i=0;i<75;i++){

  b.body.push({
   x:b.x-
    Math.cos(angle)*i*7,

   y:b.y-
    Math.sin(angle)*i*7
  });
 }

 return b;
}

function createBots(){

 bots.length=0;

 for(let i=0;i<20;i++)
  bots.push(makeBot());
}

function resetPlayer(){

 player.x=
  1500+
  Math.random()*
  (WORLD-3000);

 player.y=
  1500+

  (WORLD-3000);

 player.angle=

 player.targetAngle=
  player.angle;

 player.length=75;
 player.score=0;
 player.kills=0;
 player.alive=true;
 player.body=[];

 for(let i=0;i<75;i++){

  player.body.push({

   x:player.x-
    Math.cos(player.angle)*i*7,

   y:player.y-
    Math.sin(player.angle)*i*7
  });
 }
}

/* MOUSE */

let mouseX=W/2;
let mouseY=H/2;

addEventListener("mousemove",e=>{

 mouseX=e.clientX;
 mouseY=e.clientY;
});

/* TOUCH MOVEMENT */

let touchActive=false;

canvas.addEventListener(
 "touchstart",
 e=>{

  if(e.touches.length){

   touchActive=true;

   const t=e.touches[0];

   mouseX=t.clientX;
   mouseY=t.clientY;
  }
 },
 {passive:false}
);

canvas.addEventListener(
 "touchmove",
 e=>{

  if(e.touches.length){

   const t=e.touches[0];

   mouseX=t.clientX;
   mouseY=t.clientY;
  }

  e.preventDefault();
 },
 {passive:false}
);

canvas.addEventListener(
 "touchend",
 ()=>{

  touchActive=false;
 },
 {passive:false}
);

/* BOOST */

let boosting=false;

addEventListener("keydown",e=>{

 if(
  e.code==="Space"||
  e.code==="ShiftLeft"
 )
  boosting=true;
});

addEventListener("keyup",e=>{

 if(
  e.code==="Space"||

  boosting=false;

const boost=

boost.addEventListener(

  e.preventDefault();

 }
);

  e.preventDefault();

);

boost.addEventListener(

 ()=>{
  boosting=false;

);

boost.addEventListener(

 ()=>{
  boosting=false;

);

/* JOYSTICK */

const joystick=
 document.getElementById("joystick");

const stick=
 document.getElementById("stick");

let joy=false;

function joystickMove(x,y){

 const r=
  joystick.getBoundingClientRect();

 const cx=
  r.left+r.width/2;

 const cy=
  r.top+r.height/2;

 let dx=x-cx;
 let dy=y-cy;

 const max=48;

 const distance=
  Math.hypot(dx,dy);

 if(distance>max){

  dx=dx/distance*max;
  dy=dy/distance*max;
 }

 stick.style.left=
  `calc(50% + ${dx}px)`;

 stick.style.top=
  `calc(50% + ${dy}px)`;

 if(distance>5){

  player.targetAngle=
   Math.atan2(dy,dx);
 }
}

joystick.addEventListener(
 "pointerdown",
 e=>{

  e.preventDefault();

  joy=true;

  joystick.setPointerCapture(
   e.pointerId
  );

  joystickMove(
   e.clientX,
   e.clientY
  );
 }
);

joystick.addEventListener(
 "pointermove",
 e=>{

  if(!joy)return;

  e.preventDefault();

  joystickMove(
   e.clientX,
   e.clientY
  );
 }
);

function stopJoystick(){

 joy=false;

 stick.style.left="50%";
 stick.style.top="50%";
}

joystick.addEventListener(
 "pointerup",
 stopJoystick
);

joystick.addEventListener(
 "pointercancel",
 stopJoystick
);

/* PLAYER UPDATE */

function updatePlayer(){

 if(!player.alive)return;

 if(innerWidth>800){

  const dx=
   mouseX-W/2;

  const dy=
   mouseY-H/2;

  if(Math.hypot(dx,dy)>10){

   player.targetAngle=
    Math.atan2(dy,dx);
  }
 }

 let diff=
  player.targetAngle-player.angle;

 while(diff>Math.PI)
  diff-=Math.PI*2;

 while(diff<-Math.PI)
  diff+=Math.PI*2;

 player.angle+=diff*.13;

 const speed=
  boosting&&player.length>70
  ?10
  :7.5;

 player.x+=
  Math.cos(player.angle)*speed;

 player.y+=
  Math.sin(player.angle)*speed;

 if(
  boosting&&
  player.length>70
 ){

  player.length-=.045;
 }

 if(
  player.x<35||
  player.y<35||
  player.x>WORLD-35||
  player.y>WORLD-35
 ){

  die("Läksid vastu kaardi äärt!");

  return;
 }

 player.body.unshift({
  x:player.x,
  y:player.y
 });

 const wanted=
  Math.max(60,Math.floor(player.length));

 while(player.body.length<wanted){

  const last=
   player.body[player.body.length-1];

  player.body.push({
   x:last.x,
   y:last.y
  });
 }

 while(player.body.length>wanted)
  player.body.pop();

 eatFood(player);
}

/* FOOD */

function eatFood(s){

 for(
  let i=food.length-1;
  i>=0;
  i--
 ){

  const f=food[i];

  if(
   Math.hypot(
    s.x-f.x,
    s.y-f.y
   )<34
  ){

   s.score+=f.value;
   s.length+=f.value*.85;

   food.splice(i,1);
   food.push(makeFood());
  }
 }
}

/* BOTS */

function updateBots(){

 for(const b of bots){

  b.timer--;

  if(b.timer<=0){

   b.timer=
    30+Math.random()*90;

   b.target=
    Math.random()*Math.PI*2;
  }

  let diff=
   b.target-b.angle;

  while(diff>Math.PI)
   diff-=Math.PI*2;

  while(diff<-Math.PI)
   diff+=Math.PI*2;

  b.angle+=diff*.055;

  b.x+=Math.cos(b.angle)*5.5;
  b.y+=Math.sin(b.angle)*5.5;

  if(b.x<100||b.x>WORLD-100)
   b.target=Math.PI-b.angle;

  if(b.y<100||b.y>WORLD-100)
   b.target=-b.angle;

  b.body.unshift({
   x:b.x,
   y:b.y
  });

  while(
   b.body.length<
   Math.floor(b.length)
  ){

   const last=
    b.body[b.body.length-1];

   b.body.push({
    x:last.x,
    y:last.y
   });
  }

  while(
   b.body.length>
   Math.floor(b.length)
  )
   b.body.pop();

  eatFood(b);
 }
}

/* COLLISIONS */

function botCollisions(){

 if(!player.alive)return;

 for(
  let bi=bots.length-1;
  bi>=0;
  bi--
 ){

  const b=bots[bi];

  /* PLAYER HEAD INTO BOT BODY */

  for(
   let i=12;
   i<b.body.length;
   i+=2
  ){

   const p=b.body[i];

   if(
    Math.hypot(
     player.x-p.x,
     player.y-p.y
    )<31
   ){

    die(
     "Sinu pea läks vastase keha vastu!"
    );

    return;
   }
  }

  /* BOT HEAD INTO PLAYER BODY */

  for(
   let i=12;
   i<player.body.length;
   i+=2
  ){

   const p=player.body[i];

   if(
    Math.hypot(
     b.x-p.x,
     b.y-p.y
    )<31
   ){

    player.kills++;
    player.score+=100;
    player.length+=25;

    coins+=10;

    saveShop();

    bots.splice(bi,1);

    setTimeout(()=>{

     if(running&&single)
      bots.push(makeBot());

    },800);

    break;
   }
  }
 }
}

/* DRAW WORM */

function drawWorm(s){

 if(!s.body||s.body.length<2)
  return;

 ctx.save();

 /*
 SHADOW
 */

 ctx.beginPath();

 for(
  let i=s.body.length-1;
  i>=0;
  i--
 ){

  const p=s.body[i];

  if(i===s.body.length-1)
   ctx.moveTo(p.x+7,p.y+7);
  else
   ctx.lineTo(p.x+7,p.y+7);
 }

 ctx.strokeStyle="rgba(0,0,0,.5)";
 ctx.lineWidth=50;
 ctx.lineCap="round";
 ctx.stroke();

 /*
 BODY
 */

 ctx.beginPath();

 for(
  let i=s.body.length-1;
  i>=0;
  i--
 ){

  const p=s.body[i];

  if(i===s.body.length-1)
   ctx.moveTo(p.x,p.y);
  else
   ctx.lineTo(p.x,p.y);
 }

 if(s.color==="rainbow"){

  const gradient=
   ctx.createLinearGradient(
    s.x-100,
    s.y,
    s.x+100,
    s.y
   );

  gradient.addColorStop(0,"red");
  gradient.addColorStop(.2,"orange");
  gradient.addColorStop(.4,"yellow");
  gradient.addColorStop(.6,"lime");
  gradient.addColorStop(.8,"cyan");
  gradient.addColorStop(1,"violet");

  ctx.strokeStyle=gradient;

 }else{

  ctx.strokeStyle=s.color;
 }

 ctx.lineWidth=38;
 ctx.lineCap="round";
 ctx.lineJoin="round";
 ctx.stroke();

 /*
 HEAD
 */

 ctx.translate(s.x,s.y);
 ctx.rotate(s.angle);

 ctx.fillStyle=
  s.color==="rainbow"
  ?"white"
  :s.color;

 ctx.beginPath();

 ctx.ellipse(
  0,0,
  42,36,
  0,0,Math.PI*2
 );

 ctx.fill();

 /*
 EYES
 */

 ctx.fillStyle="white";

 ctx.beginPath();

 ctx.arc(18,-14,11,0,Math.PI*2);
 ctx.fill();

 ctx.beginPath();

 ctx.arc(18,14,11,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="#111";

 ctx.beginPath();

 ctx.arc(22,-14,5,0,Math.PI*2);
 ctx.fill();

 ctx.beginPath();

 ctx.arc(22,14,5,0,Math.PI*2);
 ctx.fill();

 ctx.restore();

 /*
 NAME
 */

 ctx.textAlign="center";
 ctx.font="bold 14px Arial";
 ctx.lineWidth=5;
 ctx.strokeStyle="rgba(0,0,0,.9)";

 ctx.strokeText(
  s.name||"Player",
  s.x,
  s.y-56
 );

 ctx.fillStyle="white";

 ctx.fillText(
  s.name||"Player",
  s.x,
  s.y-56
 );
}

/* DRAW */

function draw(){

 ctx.clearRect(0,0,W,H);

 if(!running)return;

 ctx.save();

 ctx.translate(
  W/2-player.x,
  H/2-player.y
 );

 ctx.fillStyle="#102716";

 ctx.fillRect(
  0,0,WORLD,WORLD
 );

 const grid=120;

 ctx.strokeStyle=
  "rgba(180,255,190,.035)";

 const left=
  Math.floor((player.x-W)/grid)*grid;

 const right=
  Math.ceil((player.x+W)/grid)*grid;

 const top=
  Math.floor((player.y-H)/grid)*grid;

 const bottom=
  Math.ceil((player.y+H)/grid)*grid;

 for(
  let x=left;
  x<=right;
  x+=grid
 ){

  ctx.beginPath();
  ctx.moveTo(x,player.y-H);
  ctx.lineTo(x,player.y+H);
  ctx.stroke();
 }

 for(
  let y=top;
  y<=bottom;
  y+=grid
 ){

  ctx.beginPath();
  ctx.moveTo(player.x-W,y);
  ctx.lineTo(player.x+W,y);
  ctx.stroke();
 }

 /* FOOD */

 for(const f of food){

  if(
   Math.abs(f.x-player.x)>W/2+150||
   Math.abs(f.y-player.y)>H/2+150
  )
   continue;

  ctx.fillStyle=f.color;

  ctx.beginPath();

  ctx.arc(
   f.x,
   f.y,
   f.r,
   0,
   Math.PI*2
  );

  ctx.fill();
 }

 if(single){

  for(const b of bots)
   drawWorm(b);

 }else{

  for(const p of multiplayerPlayers)
   drawWorm(p);
 }

 drawWorm(player);

 ctx.strokeStyle="#52ff69";
 ctx.lineWidth=24;

 ctx.strokeRect(
  0,0,WORLD,WORLD
 );

 ctx.restore();

 drawMinimap();
}

/* MINIMAP */

function drawMinimap(){

 const c=
  document.getElementById("minimap");

 const m=c.getContext("2d");

 m.clearRect(0,0,180,180);

 m.fillStyle="#071208";
 m.fillRect(0,0,180,180);

 function dot(s,r){

  m.fillStyle=s.color==="rainbow"
   ?"white"
   :s.color;

  m.beginPath();

  m.arc(
   s.x/WORLD*180,
   s.y/WORLD*180,
   r,
   0,
   Math.PI*2
  );

  m.fill();
 }

 if(single){

  for(const b of bots)
   dot(b,3);

 }else{

  for(const p of multiplayerPlayers)
   dot(p,4);
 }

 dot(player,5);
}

/* SOCKET */

function connectServer(){

 const protocol=
  location.protocol==="https:"
  ?"wss:"
  :"ws:";

 socket=
  new WebSocket(
   protocol+"//"+location.host
  );

 socket.onopen=()=>{

  document.getElementById("error")
  .textContent="";
 };

 socket.onmessage=e=>{

  let data;

  try{
   data=JSON.parse(e.data);
  }catch{
   return;
  }

  if(data.type==="connected")
   player.id=data.id;

  if(data.type==="roomCreated"){

   roomCode=data.code;
   isHost=true;

   showLobby();
  }

  if(data.type==="roomJoined"){

   roomCode=data.code;
   isHost=false;

   showLobby();
  }

  if(data.type==="roomInfo"){

   roomCode=data.code;

   isHost=
    data.hostId===player.id;

   renderLobby(data.players);
  }

  if(data.type==="gameStart"){

   single=false;

   startGame();
  }

  if(data.type==="state"){

   multiplayerPlayers=
    (data.players||[])
    .filter(p=>p.id!==player.id)
    .map(p=>({

     id:p.id,
     name:p.name,
     color:p.color||"#ff465f",

     x:Number(p.x)||0,
     y:Number(p.y)||0,

     angle:Number(p.angle)||0,

     length:Number(p.length)||75,

     score:Number(p.score)||0,
     kills:Number(p.kills)||0,

     alive:p.alive,

     body:
      Array.isArray(p.body)
      ?p.body:[]
    }));
  }

  if(data.type==="error"){

   document.getElementById("error")
   .textContent=data.message;
  }
 };

 socket.onclose=()=>{

  if(running&&!single){

   console.log(
    "Multiplayer ühendus katkes."
   );
  }
 };
}

/* LOBBY */

function showLobby(){

 document.getElementById("roomLobby")
 .style.display="block";

 document.getElementById("roomCode")
 .textContent=roomCode;

 document.getElementById("error")

}

function renderLobby(list){

 container.innerHTML="";

 for(const p of list){

  const name=

  name.textContent=p.name;

  left.appendChild(dot);
  left.appendChild(name);

  const right=

  if(p.isHost){

   right.className="host";
   right.textContent="👑 HOST";
  }

  row.appendChild(left);

 }

 }else{

}
