<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
      initial-scale=1,
      maximum-scale=1,
      user-scalable=no">

<title>Snake Arena</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#071007;
    touch-action:none;
    font-family:Arial,sans-serif;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

/* MENU */

#menu{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(circle at center,
        #17351b 0%,
        #071007 55%,
        #020502 100%);
}

.menuBox{
    width:min(90vw,430px);
    padding:30px;
    border-radius:25px;
    text-align:center;
    color:white;
    background:rgba(5,15,7,.95);
    border:1px solid #3f9c4c;
    box-shadow:0 0 50px rgba(50,255,80,.15);
}

.logo{
    font-size:70px;
}

h1{
    color:#63ff78;
    font-size:42px;
    margin:5px 0 10px;
}

.subtitle{
    color:#8ca68e;
    margin-bottom:20px;
}

#name{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #315b37;
    background:#0a160c;
    color:white;
    text-align:center;
    font-size:17px;
    outline:none;
}

#play{
    width:100%;
    margin-top:15px;
    padding:15px;
    border:0;
    border-radius:12px;
    background:#63ff78;
    color:#061008;
    font-size:18px;
    font-weight:bold;
}

/* HUD */

#hud{
    position:fixed;
    top:10px;
    left:10px;
    z-index:10;
    display:none;
    gap:7px;
}

.stat{
    padding:8px 12px;
    border-radius:10px;
    background:rgba(0,0,0,.65);
    color:white;
    border:1px solid rgba(100,255,120,.3);
}

.stat small{
    display:block;
    color:#78917c;
    font-size:9px;
}

.stat b{
    font-size:17px;
}

/* MINIMAP */

#minimap{
    position:fixed;
    right:12px;
    top:12px;
    z-index:15;
    width:170px;
    height:170px;
    display:none;
    border-radius:15px;
    overflow:hidden;
    background:#061008;
    border:2px solid #62ff79;
    box-shadow:0 0 20px rgba(60,255,90,.2);
}

#mapCanvas{
    width:100%;
    height:100%;
}

.mapTitle{
    position:absolute;
    left:7px;
    top:5px;
    color:#8dff9d;
    font-size:9px;
    font-weight:bold;
}

/* JOYSTICK */

#joystick{
    position:fixed;
    left:25px;
    bottom:25px;
    width:145px;
    height:145px;
    z-index:20;
    display:none;
    border-radius:50%;
    background:rgba(100,180,110,.16);
    border:2px solid rgba(130,255,150,.4);
}

#stick{
    position:absolute;
    left:50%;
    top:50%;
    width:60px;
    height:60px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:#54e96d;
    border:3px solid white;
    box-shadow:0 0 20px rgba(60,255,90,.5);
}

/* BOOST */

#boost{
    position:fixed;
    right:25px;
    bottom:30px;
    z-index:20;
    display:none;
    width:100px;
    height:100px;
    border-radius:50%;
    border:3px solid #8bdcff;
    background:#086aa0;
    color:white;
    font-size:28px;
}

/* ROTATE */

#rotate{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    background:#020502;
    color:white;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.rotateInner{
    padding:30px;
}

.rotateIcon{
    font-size:70px;
}

#rotate h2{
    color:#63ff78;
    margin:15px;
}

/* MOBILE */

@media(max-width:800px){

    #joystick{
        display:block;
    }

    #boost{
        display:block;
    }

    #minimap{
        width:135px;
        height:135px;
    }
}

@media(max-width:800px) and (orientation:portrait){

    #menu{
        display:none;
    }

    #rotate{
        display:flex;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- ROTATE SCREEN -->

<div id="rotate">
    <div class="rotateInner">
        <div class="rotateIcon">📱</div>
        <h2>PÖÖRA TELEFON KÜLILI</h2>
        <p>Snake Arena töötab horisontaalselt.</p>
    </div>
</div>

<!-- MENU -->

<div id="menu">

    <div class="menuBox">

        <div class="logo">🐍</div>

        <h1>SNAKE ARENA</h1>

        <div class="subtitle">
            Kasvata oma madu ja võitle teistega!
        </div>

        <input
            id="name"
            maxlength="16"
            placeholder="Sinu nimi">

        <button id="play">
            MÄNGI
        </button>

    </div>

</div>

<!-- HUD -->

<div id="hud">

    <div class="stat">
        <small>SCORE</small>
        <b id="score">0</b>
    </div>

    <div class="stat">
        <small>LENGTH</small>
        <b id="length">20</b>
    </div>

</div>

<!-- MINIMAP -->

<div id="minimap">

    <canvas
        id="mapCanvas"
        width="170"
        height="170">
    </canvas>

    <div class="mapTitle">
        🗺️ MAP
    </div>

</div>

<!-- JOYSTICK -->

<div id="joystick">
    <div id="stick"></div>
</div>

<!-- BOOST -->

<button id="boost">
    ⚡
</button>

<script>

/* =====================================================
   SETTINGS
===================================================== */

/*
   ÄRA MUUDA WORLD väärtust, kui tahad
   sama maailma suurust säilitada.
*/

const WORLD = 20000;


/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

const mapCanvas =
    document.getElementById("mapCanvas");

const mapCtx =
    mapCanvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

function resize(){

    W = innerWidth;
    H = innerHeight;

    const dpr =
        Math.min(devicePixelRatio || 1,2);

    canvas.width = W*dpr;
    canvas.height = H*dpr;

    canvas.style.width = W+"px";
    canvas.style.height = H+"px";

    ctx.setTransform(
        dpr,0,0,dpr,0,0
    );
}

addEventListener("resize",resize);

resize();


/* =====================================================
   GAME VARIABLES
===================================================== */

let playing=false;

let score=0;

let snakeLength=20;

let snake=[];

let food=[];

let otherPlayers={};

let player={
    x:WORLD/2,
    y:WORLD/2,
    angle:0,
    target:0
};

let camera={
    x:WORLD/2,
    y:WORLD/2
};

let boosting=false;


/* =====================================================
   COLORS
===================================================== */

const COLORS=[
    "#63ff78",
    "#42a5ff",
    "#ff4dd8",
    "#ffd83d",
    "#ff7043",
    "#b05cff",
    "#00eaff",
    "#ffffff",
    "#ff4268"
];

let myColor =
    COLORS[
        Math.floor(
            Math.random()*COLORS.length
        )
    ];


/* =====================================================
   FOOD
===================================================== */

function createFood(){

    food=[];

    for(let i=0;i<900;i++){

        food.push({
            x:Math.random()*WORLD,
            y:Math.random()*WORLD,
            size:4+Math.random()*3
        });

    }

}


/* =====================================================
   WEBSOCKET
===================================================== */

let socket=null;


/*
   Kui mäng jookseb Renderis:
   kasutab automaatselt sama aadressi.

   Kui frontend on Netlifys,
   muuda allolev URL Renderi aadressiks.
*/

const SERVER_URL =
    location.protocol==="https:"
    ? "wss://"+location.host
    : "ws://"+location.host;


function connectServer(){

    try{

        socket =
            new WebSocket(SERVER_URL);

        socket.onopen=()=>{

            console.log(
                "Multiplayer ühendatud"
            );

            sendState();

        };

        socket.onmessage=(event)=>{

            try{

                const data =
                    JSON.parse(event.data);

                if(data.type==="players"){

                    otherPlayers =
                        data.players || {};

                }

            }catch(e){

                console.log(e);

            }

        };

        socket.onclose=()=>{

            console.log(
                "Serveriga ühendus katkes"
            );

            socket=null;

        };

    }catch(e){

        console.log(e);

    }

}


/* =====================================================
   SEND PLAYER
===================================================== */

let lastSend=0;

function sendState(){

    if(
        !socket ||
        socket.readyState!==1
    )
        return;

    const now=performance.now();

    if(now-lastSend<50)
        return;

    lastSend=now;

    socket.send(
        JSON.stringify({

            type:"state",

            x:player.x,

            y:player.y,

            angle:player.angle,

            length:snakeLength,

            color:myColor,

            name:
                document.getElementById(
                    "name"
                ).value || "Player"

        })
    );

}


/* =====================================================
   START
===================================================== */

function startGame(){

    playing=true;

    document.getElementById(
        "menu"
    ).style.display="none";

    document.getElementById(
        "hud"
    ).style.display="flex";

    document.getElementById(
        "minimap"
    ).style.display="block";


    score=0;

    snakeLength=20;


    player.x =
        WORLD/2;

    player.y =
        WORLD/2;

    player.angle =
        Math.random()*Math.PI*2;

    player.target =
        player.angle;


    camera.x=player.x;
    camera.y=player.y;


    snake=[];


    for(
        let i=0;
        i<snakeLength;
        i++
    ){

        snake.push({

            x:
                player.x-
                Math.cos(player.angle)*
                i*10,

            y:
                player.y-
                Math.sin(player.angle)*
                i*10

        });

    }


    createFood();

    connectServer();

}


/* =====================================================
   KEYBOARD
===================================================== */

const keys={};

addEventListener(
    "keydown",
    e=>{

        keys[
            e.key.toLowerCase()
        ]=true;

        if(e.key==="Shift")
            boosting=true;

    }
);

addEventListener(
    "keyup",
    e=>{

        keys[
            e.key.toLowerCase()
        ]=false;

        if(e.key==="Shift")
            boosting=false;

    }
);


function keyboard(){

    let dx=0;
    let dy=0;

    if(
        keys["w"] ||
        keys["arrowup"]
    )
        dy--;

    if(
        keys["s"] ||
        keys["arrowdown"]
    )
        dy++;

    if(
        keys["a"] ||
        keys["arrowleft"]
    )
        dx--;

    if(
        keys["d"] ||
        keys["arrowright"]
    )
        dx++;


    if(dx!==0 || dy!==0){

        player.target =
            Math.atan2(dy,dx);

    }

}


/* =====================================================
   MOUSE
===================================================== */

addEventListener(
    "mousemove",
    e=>{

        if(!playing)
            return;

        if(innerWidth<=800)
            return;

        player.target =
            Math.atan2(
                e.clientY-H/2,
                e.clientX-W/2
            );

    }
);


/* =====================================================
   TOUCH
===================================================== */

canvas.addEventListener(
    "touchmove",
    e=>{

        if(!playing)
            return;

        /*
           Kui joystickit kasutatakse,
           canvas ei muuda suunda.
        */

        if(
            e.touches.length===0
        )
            return;

        e.preventDefault();

    },
    {passive:false}
);


/* =====================================================
   JOYSTICK
===================================================== */

const joystick =
    document.getElementById(
        "joystick"
    );

const stick =
    document.getElementById(
        "stick"
    );

let joystickActive=false;


function joystickMove(
    clientX,
    clientY
){

    const rect =
        joystick.getBoundingClientRect();

    const cx =
        rect.left+
        rect.width/2;

    const cy =
        rect.top+
        rect.height/2;

    let dx =
        clientX-cx;

    let dy =
        clientY-cy;

    const max =
        rect.width/2-30;

    const dist =
        Math.hypot(dx,dy);


    if(dist>max){

        dx =
            dx/dist*max;

        dy =
            dy/dist*max;

    }


    stick.style.left =
        `calc(50% + ${dx}px)`;

    stick.style.top =
        `calc(50% + ${dy}px)`;


    if(dist>5){

        player.target =
            Math.atan2(
                dy,
                dx
            );

    }

}


function resetJoystick(){

    joystickActive=false;

    stick.style.left="50%";
    stick.style.top="50%";

}


joystick.addEventListener(
    "touchstart",
    e=>{

        e.preventDefault();

        joystickActive=true;

        const t =
            e.changedTouches[0];

        joystickMove(
            t.clientX,
            t.clientY
        );

    },
    {passive:false}
);


joystick.addEventListener(
    "touchmove",
    e=>{

        e.preventDefault();

        if(!joystickActive)
            return;

        const t =
            e.changedTouches[0];

        joystickMove(
            t.clientX,
            t.clientY
        );

    },
    {passive:false}
);


joystick.addEventListener(
    "touchend",
    e=>{

        e.preventDefault();

        resetJoystick();

    },
    {passive:false}
);


/* =====================================================
   BOOST
===================================================== */

const boostButton =
    document.getElementById(
        "boost"
    );


boostButton.addEventListener(
    "touchstart",
    e=>{

        e.preventDefault();

        boosting=true;

    },
    {passive:false}
);


boostButton.addEventListener(
    "touchend",
    e=>{

        e.preventDefault();

        boosting=false;

    },
    {passive:false}
);


/* =====================================================
   UPDATE
===================================================== */

function update(){

    if(!playing)
        return;


    keyboard();


    let diff =
        player.target-
        player.angle;


    while(diff>Math.PI)
        diff-=Math.PI*2;

    while(diff<-Math.PI)
        diff+=Math.PI*2;


    player.angle +=
        diff*.13;


    const speed =
        boosting
        ? 8
        : 5;


    player.x +=
        Math.cos(player.angle)*
        speed;

    player.y +=
        Math.sin(player.angle)*
        speed;


    /* WORLD BORDER */

    player.x =
        Math.max(
            20,
            Math.min(
                WORLD-20,
                player.x
            )
        );

    player.y =
        Math.max(
            20,
            Math.min(
                WORLD-20,
                player.y
            )
        );


    snake.unshift({

        x:player.x,
        y:player.y

    });


    while(
        snake.length<
        Math.floor(snakeLength)
    ){

        /*
           kasvatame saba ainult
           siis, kui pikkus suureneb
        */

        snake.push({

            x:
                snake[snake.length-1]?.x
                ||player.x,

            y:
                snake[snake.length-1]?.y
                ||player.y

        });

    }


    while(
        snake.length>
        Math.floor(snakeLength)
    ){

        snake.pop();

    }


    /* FOOD */

    for(
        let i=food.length-1;
        i>=0;
        i--
    ){

        const f=food[i];

        if(
            Math.hypot(
                player.x-f.x,
                player.y-f.y
            )<25
        ){

            score++;

            snakeLength+=1.5;

            food[i]={
                x:Math.random()*WORLD,
                y:Math.random()*WORLD,
                size:4+Math.random()*3
            };

        }

    }


    /* CAMERA */

    camera.x +=
        (player.x-camera.x)*.12;

    camera.y +=
        (player.y-camera.y)*.12;


    sendState();


    document.getElementById(
        "score"
    ).textContent=
        Math.floor(score);

    document.getElementById(
        "length"
    ).textContent=
        Math.floor(snakeLength);

}


/* =====================================================
   DRAW
===================================================== */

function draw(){

    requestAnimationFrame(draw);


    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    ctx.fillStyle="#071007";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    if(!playing)
        return;


    /*
       Maailm jääb suureks.
    */

    const zoom =
        W<800
        ? 1.05
        : 1.2;


    ctx.save();


    ctx.translate(
        W/2,
        H/2
    );

    ctx.scale(
        zoom,
        zoom
    );

    ctx.translate(
        -camera.x,
        -camera.y
    );


    /* WORLD */

    ctx.fillStyle="#0b1b0d";

    ctx.fillRect(
        0,
        0,
        WORLD,
        WORLD
    );


    /* GRID */

    const grid=200;

    const left=
        camera.x-W/zoom/2-500;

    const right=
        camera.x+W/zoom/2+500;

    const top=
        camera.y-H/zoom/2-500;

    const bottom=
        camera.y+H/zoom/2+500;


    ctx.strokeStyle=
        "rgba(100,255,120,.035)";

    ctx.lineWidth=1;


    for(
        let x=Math.floor(left/grid)*grid;
        x<right;
        x+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(x,top);

        ctx.lineTo(x,bottom);

        ctx.stroke();

    }


    for(
        let y=Math.floor(top/grid)*grid;
        y<bottom;
        y+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(left,y);

        ctx.lineTo(right,y);

        ctx.stroke();

    }


    /* FOOD */

    for(const f of food){

        if(
            f.x<left ||
            f.x>right ||
            f.y<top ||
            f.y>bottom
        )
            continue;


        ctx.fillStyle="#ff536f";

        ctx.shadowColor="#ff536f";

        ctx.shadowBlur=8;


        ctx.beginPath();

        ctx.arc(
            f.x,
            f.y,
            f.size,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.shadowBlur=0;


    /* OTHER PLAYERS */

    for(
        const id in otherPlayers
    ){

        const p=
            otherPlayers[id];

        if(!p)
            continue;


        if(
            Math.hypot(
                p.x-camera.x,
                p.y-camera.y
            )>
            Math.max(W,H)
        )
            continue;


        drawOtherSnake(p);

    }


    /* MY SNAKE */

    drawMySnake();


    /* WORLD BORDER */

    ctx.strokeStyle="#48ff68";

    ctx.lineWidth=25;

    ctx.strokeRect(
        0,
        0,
        WORLD,
        WORLD
    );


    ctx.restore();


    drawMinimap();

}


/* =====================================================
   MY SNAKE
===================================================== */

function drawMySnake(){

    for(
        let i=snake.length-1;
        i>=0;
        i--
    ){

        const p=snake[i];

        const size =
            Math.max(
                7,
                15-i/snake.length*6
            );


        ctx.fillStyle=myColor;

        ctx.shadowColor=myColor;

        ctx.shadowBlur=7;


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            size,
            0,
            Math.PI*2
        );

        ctx.fill();

    }


    ctx.shadowBlur=0;


    /* HEAD */

    ctx.fillStyle=myColor;

    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y,
        18,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* EYES */

    const dx=
        Math.cos(player.angle);

    const dy=
        Math.sin(player.angle);

    const sx=
        -Math.sin(player.angle);

    const sy=
        Math.cos(player.angle);


    ctx.fillStyle="#061008";


    ctx.beginPath();

    ctx.arc(
        player.x+dx*9+sx*5,
        player.y+dy*9+sy*5,
        4,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        player.x+dx*9-sx*5,
        player.y+dy*9-sy*5,
        4,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* =====================================================
   OTHER SNAKE
===================================================== */

function drawOtherSnake(p){

    const color=
        p.color || "#42a5ff";

    const length=
        Math.max(
            10,
            Math.min(
                60,
                Math.floor(p.length||20)
            )
        );


    /*
       Teiste madu keha on lihtsustatud,
       sest server saadab hetkel asukohta.
    */

    for(
        let i=length;
        i>0;
        i--
    ){

        const x=
            p.x-
            Math.cos(p.angle||0)*
            i*8;

        const y=
            p.y-
            Math.sin(p.angle||0)*
            i*8;


        ctx.fillStyle=color;

        ctx.globalAlpha=
            1-i/(length+10);


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            10,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.globalAlpha=1;


    /* HEAD */

    ctx.fillStyle=color;

    ctx.beginPath();

    ctx.arc(
        p.x,
        p.y,
        17,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* NAME */

    if(p.name){

        ctx.font="bold 12px Arial";

        ctx.textAlign="center";

        ctx.fillStyle="white";

        ctx.fillText(
            p.name,
            p.x,
            p.y-25
        );

    }

}


/* =====================================================
   MINIMAP
===================================================== */

function drawMinimap(){

    const size=170;


    mapCtx.clearRect(
        0,
        0,
        size,
        size
    );


    mapCtx.fillStyle="#071108";

    mapCtx.fillRect(
        0,
        0,
        size,
        size
    );


    /* grid */

    mapCtx.strokeStyle=
        "rgba(120,255,140,.12)";

    mapCtx.lineWidth=1;


    for(let i=0;i<=10;i++){

        const p=
            i*size/10;


        mapCtx.beginPath();

        mapCtx.moveTo(p,0);

        mapCtx.lineTo(p,size);

        mapCtx.stroke();


        mapCtx.beginPath();

        mapCtx.moveTo(0,p);

        mapCtx.lineTo(size,p);

        mapCtx.stroke();

    }


    /* OTHER PLAYERS */

    for(
        const id in otherPlayers
    ){

        const p=
            otherPlayers[id];

        if(!p)
            continue;


        const x=
            p.x/WORLD*size;

        const y=
            p.y/WORLD*size;


        /*
           🔴 teised mängijad
        */

        mapCtx.fillStyle="#ff3f55";

        mapCtx.shadowColor="#ff3f55";

        mapCtx.shadowBlur=7;


        mapCtx.beginPath();

        mapCtx.arc(
            x,
            y,
            4,
            0,
            Math.PI*2
        );

        mapCtx.fill();

    }


    /* ME */

    const meX=
        player.x/WORLD*size;

    const meY=
        player.y/WORLD*size;


    /*
       🟢 sina
    */

    mapCtx.fillStyle="#63ff78";

    mapCtx.shadowColor="#63ff78";

    mapCtx.shadowBlur=12;


    mapCtx.beginPath();

    mapCtx.arc(
        meX,
        meY,
        6,
        0,
        Math.PI*2
    );

    mapCtx.fill();


    mapCtx.shadowBlur=0;


    /* BORDER */

    mapCtx.strokeStyle="#63ff78";

    mapCtx.lineWidth=2;

    mapCtx.strokeRect(
        1,
        1,
        size-2,
        size-2
    );

}


/* =====================================================
   PLAY BUTTON
===================================================== */

document.getElementById(
    "play"
).onclick=()=>{

    startGame();

};


/* =====================================================
   START
===================================================== */

draw();

</script>
