<!DOCTYPE html>

<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Snake Arena</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#061008;font-family:Arial,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;background:#061008}
button,input{font-family:inherit}
#menu{position:fixed;inset:0;z-index:20;display:flex;justify-content:center;align-items:center;overflow:auto;padding:15px;background:radial-gradient(circle at 50% 20%,#205b29,#071008 55%,#020402)}
.panel{width:min(94vw,470px);max-height:95vh;overflow-y:auto;padding:25px;background:rgba(3,10,4,.97);border:1px solid #315f38;border-radius:25px;color:white;text-align:center}
.logo{font-size:58px}
h1{font-size:38px;color:#63ff78;margin:5px}
.sub{color:#91a394;margin-bottom:16px}
input{width:100%;height:46px;margin:5px 0;padding:0 15px;border-radius:12px;border:1px solid #315b36;background:#09140a;color:white;text-align:center;font-size:16px;outline:none}
.btn{width:100%;height:46px;margin-top:7px;border-radius:12px;border:0;font-weight:bold;font-size:15px}
.green{background:#63ff78;color:#031006}
.dark{background:#102014;color:white;border:1px solid #315b36}
.modeRow{display:flex;gap:8px;margin:12px 0}
.mode{flex:1;padding:12px 5px;border-radius:12px;background:#0c190e;border:1px solid #315b36;color:white;font-weight:bold}
.mode.selected{background:#63ff78;color:#031006}
#skins{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:10px 0 14px}
.skin{width:53px;height:53px;border-radius:50%;border:3px solid transparent;font-size:23px}
.skin.selected{border-color:white;transform:scale(1.08)}
#roomBox{display:none;margin-top:14px}
#roomCode{font-size:31px;letter-spacing:6px;color:#63ff78;font-weight:bold;margin:5px}
#players{max-height:150px;overflow-y:auto;text-align:left}
.player{background:#0b170d;padding:8px;border-radius:8px;margin:4px 0}
#error{color:#ff6676;min-height:20px;margin-top:8px}
#connection{font-size:11px;color:#7f9181;margin-top:7px}
#hud{position:fixed;z-index:5;top:10px;left:10px;display:none;gap:7px}
.stat{background:rgba(0,0,0,.65);border:1px solid #315b36;border-radius:10px;padding:7px 11px;color:white}
.stat small{display:block;color:#819383;font-size:9px}
.stat b{font-size:16px}
#leader{position:fixed;z-index:5;top:10px;left:50%;transform:translateX(-50%);display:none;width:180px;padding:8px;background:rgba(0,0,0,.55);border-radius:12px;color:white;font-size:12px}
#leader h3{text-align:center;color:#63ff78;margin-bottom:4px}
.rank{display:flex;justify-content:space-between;padding:2px 3px}
#minimap{position:fixed;z-index:5;right:10px;top:10px;width:150px;height:150px;display:none;border:2px solid #63ff78;border-radius:14px;background:#061007}
#joystick{position:fixed;z-index:10;left:22px;bottom:22px;width:145px;height:145px;display:none;border:2px solid rgba(99,255,120,.4);background:rgba(99,255,120,.08);border-radius:50%}
#stick{position:absolute;left:50%;top:50%;width:60px;height:60px;transform:translate(-50%,-50%);border-radius:50%;background:#63ff78;border:3px solid white}
#boost{position:fixed;z-index:10;right:25px;bottom:28px;width:90px;height:90px;display:none;border-radius:50%;border:3px solid #b8ecff;background:#087bb0;color:white;font-size:27px}
#kill{position:fixed;z-index:8;left:50%;top:25%;transform:translateX(-50%) scale(.7);opacity:0;color:#63ff78;font-size:34px;font-weight:900;text-shadow:0 0 20px #63ff78;transition:.2s}
#kill.show{opacity:1;transform:translateX(-50%) scale(1)}
#over{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.8)}
.overPanel{width:min(90vw,380px);background:#081008;border:1px solid #315b36;border-radius:22px;padding:28px;text-align:center;color:white}
.overPanel h2{color:#ff596c;font-size:36px;margin-bottom:10px}
@media(max-width:800px){
#joystick,#boost{display:block}
#minimap{width:125px;height:125px}
#leader{top:145px}
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="menu">
<div class="panel">
<div class="logo">🐍</div>
<h1>SNAKE ARENA</h1>
<div class="sub">Eat • Grow • Fight</div>

<input id="name" maxlength="16" placeholder="Sinu nimi">

<h3>🎨 Skin</h3>
<div id="skins">
<button class="skin selected" data-color="#63ff78" data-skin="green">🐍</button>
<button class="skin" data-color="#4da6ff" data-skin="blue">😎</button>
<button class="skin" data-color="#ff5570" data-skin="red">😈</button>
<button class="skin" data-color="#ffd84d" data-skin="yellow">😄</button>
<button class="skin" data-color="#b86cff" data-skin="purple">👾</button>
<button class="skin" data-color="#ff8a3d" data-skin="orange">🔥</button>
<button class="skin" data-color="#fff" data-skin="white">👻</button>
<button class="skin" data-color="#00e5d4" data-skin="cyan">🤖</button>
</div>

<h3>🎮 Režiim</h3>
<div class="modeRow">
<button class="mode selected" id="multiMode">🌐 MULTIPLAYER</button>
<button class="mode" id="botMode">🤖 ROBOTID</button>
</div>

<div id="multiControls">
<button id="create" class="btn green">🏠 CREATE ROOM</button>
<input id="roomInput" maxlength="6" placeholder="ROOM CODE">
<button id="join" class="btn dark">🚪 JOIN ROOM</button>

<div id="roomBox">
<div style="font-size:11px;color:#819482">ROOM CODE</div>
<div id="roomCode">------</div>
<div id="players"></div>
<button id="start" class="btn green">▶ START GAME</button>
</div>
</div>

<div id="botControls" style="display:none">
<button id="startBots" class="btn green">🤖 START ROBOT BATTLE</button>
</div>

<div id="error"></div>
<div id="connection">Ühendamine...</div>

</div>
</div>

<div id="hud">
<div class="stat"><small>SCORE</small><b id="score">0</b></div>
<div class="stat"><small>LENGTH</small><b id="len">20</b></div>
<div class="stat"><small>KILLS</small><b id="kills">0</b></div>
</div>

<div id="leader">
<h3>🏆 TOP</h3>
<div id="leaderList"></div>
</div>

<canvas id="minimap" width="150" height="150"></canvas>

<div id="kill">💥 ELIMINATED!</div>

<div id="joystick"><div id="stick"></div></div>
<button id="boost">⚡</button>

<div id="over">
<div class="overPanel">
<h2>GAME OVER</h2>
<p id="reason">Sind tapeti!</p>
<p style="margin-top:10px">Skoor: <b id="finalScore">0</b></p>
<button class="btn green" style="margin-top:20px" onclick="location.reload()">🔄 TAGASI</button>
</div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const mini=document.getElementById("minimap");
const mctx=mini.getContext("2d");

let W=innerWidth,H=innerHeight;
function resize(){W=innerWidth;H=innerHeight;canvas.width=W;canvas.height=H}
addEventListener("resize",resize);resize();

const WORLD=12000;
const foods=[];
const FOOD_COUNT=1100;

const colors=["#63ff78","#ffd84d","#ff6075","#55c9ff","#c76cff","#ff963d"];

function newFood(x,y,value){
return {
x:x===undefined?Math.random()*WORLD:x,
y:y===undefined?Math.random()*WORLD:y,
r:3+Math.random()*4,
color:colors[Math.floor(Math.random()*colors.length)],
value:value||1
};
}
for(let i=0;i<FOOD_COUNT;i++)foods.push(newFood());

const me={
id:"",
x:WORLD/2,
y:WORLD/2,
angle:0,
target:0,
length:20,
color:"#63ff78",
skin:"green",
name:"Player"
};

let body=[];
let players={};
let bots=[];
let score=0;
let kills=0;
let running=false;
let dead=false;
let boosting=false;
let mode="multi";
let socket=null;
let connected=false;
let cameraX=me.x,cameraY=me.y;

const skinButtons=document.querySelectorAll(".skin");
skinButtons.forEach(b=>{
b.onclick=()=>{
skinButtons.forEach(x=>x.classList.remove("selected"));
b.classList.add("selected");
me.color=b.dataset.color;
me.skin=b.dataset.skin;
};
});

const multiMode=document.getElementById("multiMode");
const botMode=document.getElementById("botMode");
multiMode.onclick=()=>{
mode="multi";
multiMode.classList.add("selected");
botMode.classList.remove("selected");
document.getElementById("multiControls").style.display="block";
document.getElementById("botControls").style.display="none";
};
botMode.onclick=()=>{
mode="bots";
botMode.classList.add("selected");
multiMode.classList.remove("selected");
document.getElementById("multiControls").style.display="none";
document.getElementById("botControls").style.display="block";
};

function name(){
return (document.getElementById("name").value.trim()||"Player").substring(0,16);
}
function error(t){document.getElementById("error").textContent=t||""}
function connection(t){document.getElementById("connection").textContent=t}

function connect(){
if(mode==="bots")return;
const protocol=location.protocol==="https:"?"wss:":"ws:";
socket=new WebSocket(protocol+"//"+location.host);

socket.onopen=()=>{
connected=true;
connection("🟢 Server ühendatud");
};
socket.onclose=()=>{
connected=false;
connection("🔴 Ühendus katkes");
};
socket.onerror=()=>connection("🔴 Serveri viga");
socket.onmessage=e=>{
let d;
try{d=JSON.parse(e.data)}catch{return}
handle(d);
};
}
function send(d){
if(socket&&socket.readyState===WebSocket.OPEN){
socket.send(JSON.stringify(d));
}
}

function handle(d){
if(d.type==="welcome"){
me.id=d.id;
return;
}
if(d.type==="roomCreated"){
me.id=d.id||me.id;
showRoom(d.code);
return;
}
if(d.type==="roomJoined"){
me.id=d.id||me.id;
showRoom(d.code);
return;
}
if(d.type==="lobby"){
const box=document.getElementById("players");
box.innerHTML="";
(d.players||[]).forEach(p=>{
const row=document.createElement("div");
row.className="player";
row.textContent=(p.host?"👑 ":"🐍 ")+p.name;
row.style.color=p.color||"white";
box.appendChild(row);
});
document.getElementById("start").style.display="block";
return;
}
if(d.type==="gameStart"){
me.id=d.id||me.id;
startGame(false);
return;
}
if(d.type==="players"){
players=d.players||{};
return;
}
if(d.type==="food"){
if(Array.isArray(d.food)){
foods.length=0;
d.food.forEach(f=>foods.push(f));
}
return;
}
if(d.type==="kill"){
if(d.killer===me.id){
kills++;
score+=250;
showKill();
}
return;
}
if(d.type==="gameOver"){
die(d.reason||"Sind tapeti!");
return;
}
if(d.type==="error"){
error(d.message);
}
}

function showRoom(code){
document.getElementById("roomBox").style.display="block";
document.getElementById("roomCode").textContent=code;
}

document.getElementById("create").onclick=()=>{
error("");
if(!connected){error("Server ei ole ühendatud.");return}
send({type:"createRoom",name:name(),color:me.color,skin:me.skin});
};

document.getElementById("join").onclick=()=>{
error("");
const code=document.getElementById("roomInput").value.trim().toUpperCase();
if(code.length!==6){error("Room code peab olema 6 märki.");return}
if(!connected){error("Server ei ole ühendatud.");return}
send({type:"joinRoom",code,name:name(),color:me.color,skin:me.skin});
};

document.getElementById("start").onclick=()=>{
send({type:"startGame"});
};

document.getElementById("startBots").onclick=()=>{
startBotGame();
};

function randomSpawn(){
return {
x:700+Math.random()*(WORLD-1400),
y:700+Math.random()*(WORLD-1400)
};
}

function createBody(x,y,a,len){
const arr=[];
for(let i=0;i<len;i++){
arr.push({x:x-Math.cos(a)*i*8,y:y-Math.sin(a)*i*8});
}
return arr;
}

function startGame(botGame){
running=true;
dead=false;
score=0;
kills=0;
me.length=20;
const p=randomSpawn();
me.x=p.x;me.y=p.y;
me.angle=Math.random()*Math.PI*2;
me.target=me.angle;
body=createBody(me.x,me.y,me.angle,20);

document.getElementById("menu").style.display="none";
document.getElementById("hud").style.display="flex";
document.getElementById("leader").style.display="block";
document.getElementById("minimap").style.display="block";

if(botGame){
bots=[];
for(let i=0;i<12;i++)createBot(i);
}
}

function startBotGame(){
mode="bots";
startGame(true);
}

function createBot(i){
const p=randomSpawn();
const skins=["green","blue","red","yellow","purple","orange","white","cyan"];
bots.push({
id:"bot"+i,
name:["Rex","Cobra","Byte","Turbo","Shadow","Ninja","Viper","Pixel","King","Ghost","Fire","Ace"][i],
x:p.x,y:p.y,
angle:Math.random()*Math.PI*2,
target:Math.random()*Math.PI*2,
length:25+Math.random()*70,
color:colors[i%colors.length],
skin:skins[i%skins.length],
turn:0,
alive:true
});
}

const keys={};
addEventListener("keydown",e=>{
keys[e.key.toLowerCase()]=true;
if(e.key==="Shift")boosting=true;
});
addEventListener("keyup",e=>{
keys[e.key.toLowerCase()]=false;
if(e.key==="Shift")boosting=false;
});

addEventListener("mousemove",e=>{
if(!running||innerWidth<=800)return;
const dx=e.clientX-W/2,dy=e.clientY-H/2;
if(Math.hypot(dx,dy)>15)me.target=Math.atan2(dy,dx);
});

function keyboard(){
let dx=0,dy=0;
if(keys.w||keys.arrowup)dy--;
if(keys.s||keys.arrowdown)dy++;
if(keys.a||keys.arrowleft)dx--;
if(keys.d||keys.arrowright)dx++;
if(dx||dy)me.target=Math.atan2(dy,dx);
}

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");
let joyId=null;

function joyMove(x,y){
const r=joystick.getBoundingClientRect();
let dx=x-(r.left+r.width/2),dy=y-(r.top+r.height/2);
const max=55,d=Math.hypot(dx,dy);
if(d>max){dx=dx/d*max;dy=dy/d*max}
stick.style.left="calc(50% + "+dx+"px)";
stick.style.top="calc(50% + "+dy+"px)";
if(d>7)me.target=Math.atan2(dy,dx);
}
function joyReset(){
joyId=null;
stick.style.left="50%";
stick.style.top="50%";
}
joystick.onpointerdown=e=>{
joyId=e.pointerId;
joystick.setPointerCapture(e.pointerId);
joyMove(e.clientX,e.clientY);
};
joystick.onpointermove=e=>{
if(e.pointerId===joyId)joyMove(e.clientX,e.clientY);
};
joystick.onpointerup=joyReset;
joystick.onpointercancel=joyReset;

const boost=document.getElementById("boost");
boost.onpointerdown=()=>boosting=true;
boost.onpointerup=()=>boosting=false;
boost.onpointercancel=()=>boosting=false;

function angleDiff(a,b){
let d=b-a;
while(d>Math.PI)d-=Math.PI*2;
while(d<-Math.PI)d+=Math.PI*2;
return d;
}

function updateMe(){
keyboard();

me.angle+=angleDiff(me.angle,me.target)*.15;

let speed=boosting?9.2:6.2;

me.x+=Math.cos(me.angle)*speed;
me.y+=Math.sin(me.angle)*speed;

me.x=Math.max(20,Math.min(WORLD-20,me.x));
me.y=Math.max(20,Math.min(WORLD-20,me.y));

body.unshift({x:me.x,y:me.y});

while(body.length>Math.floor(me.length))body.pop();
while(body.length<Math.floor(me.length))body.push({x:me.x,y:me.y});

eatFood();

if(boosting&&me.length>25){
me.length-=.045;
if(Math.random()<.13){
foods.push({
x:me.x-Math.cos(me.angle)*25,
y:me.y-Math.sin(me.angle)*25,
r:5,
color:me.color,
value:2
});
}
}

if(mode==="multi"){
send({
type:"state",
x:me.x,y:me.y,
angle:me.angle,
length:me.length,
color:me.color,
skin:me.skin,
name:name()
});
}
}

function eatFood(){
for(let i=foods.length-1;i>=0;i--){
const f=foods[i];
if(Math.hypot(f.x-me.x,f.y-me.y)<24+f.r){
score+=f.value;
me.length+=f.value*.5;
foods.splice(i,1);
foods.push(newFood());
}
}
}

function updateBots(){
for(const b of bots){
if(!b.alive)continue;

b.turn--;

let target=null;
let best=Infinity;

for(const f of foods){
const d=Math.hypot(f.x-b.x,f.y-b.y);
if(d<best&&d<600){best=d;target=f}
}

if(target){
b.target=Math.atan2(target.y-b.y,target.x-b.x);
}else if(b.turn<=0){
b.target+=(-.8+Math.random()*1.6);
b.turn=40+Math.random()*100;
}

for(const other of bots){
if(other===b||!other.alive)continue;
const d=Math.hypot(other.x-b.x,other.y-b.y);
if(d<150){
const a=Math.atan2(b.y-other.y,b.x-other.x);
b.target=a;
}
}

const dMe=Math.hypot(me.x-b.x,me.y-b.y);
if(dMe<500){
const a=Math.atan2(me.y-b.y,me.x-b.x);
if(me.length<b.length)b.target=a;
}

b.angle+=angleDiff(b.angle,b.target)*.055;

const speed=4.1;

b.x+=Math.cos(b.angle)*speed;
b.y+=Math.sin(b.angle)*speed;

if(b.x<100||b.x>WORLD-100||b.y<100||b.y>WORLD-100){
b.target=Math.atan2(WORLD/2-b.y,WORLD/2-b.x);
}

eatBotFood(b);
}
}

function eatBotFood(b){
for(let i=foods.length-1;i>=0;i--){
const f=foods[i];
if(Math.hypot(f.x-b.x,f.y-b.y)<20+f.r){
b.length+=f.value*.4;
foods.splice(i,1);
foods.push(newFood());
}
}
}

function botCollision(){
for(const b of bots){
if(!b.alive)continue;

const bbody=[];
for(let i=0;i<Math.floor(b.length);i++){
bbody.push({
x:b.x-Math.cos(b.angle)*i*8,
y:b.y-Math.sin(b.angle)*i*8
});
}

if(b.length>me.length){
for(let i=8;i<bbody.length;i++){
if(Math.hypot(me.x-bbody[i].x,me.y-bbody[i].y)<18){
die("🤖 Robot sõitis sinust läbi!");
return;
}
}
}else{
if(Math.hypot(b.x-me.x,b.y-me.y)<24){
killBot(b);
}
}
}
}

function killBot(b){
if(!b.alive)return;
b.alive=false;
kills++;
score+=250;
showKill();

for(let i=0;i<Math.floor(b.length/2);i++){
foods.push(newFood(
b.x-Math.cos(b.angle)*i*7,
b.y-Math.sin(b.angle)*i*7,
2+Math.floor(Math.random()*4)
));
}
setTimeout(()=>{
const p=randomSpawn();
b.x=p.x;b.y=p.y;
b.angle=Math.random()*Math.PI*2;
b.target=b.angle;
b.length=25+Math.random()*60;
b.alive=true;
},1500);
}

function checkWorld(){
if(me.x<=20||me.x>=WORLD-20||me.y<=20||me.y>=WORLD-20){
die("💥 Sõitsid vastu seina!");
}
}

function multiplayerCollision(){
for(const id in players){
if(id===me.id)continue;
const p=players[id];
if(!p)continue;

if(p.length>me.length){
for(let i=7;i<Math.min(120,Math.floor(p.length));i++){
const x=p.x-Math.cos(p.angle)*i*8;
const y=p.y-Math.sin(p.angle)*i*8;
if(Math.hypot(me.x-x,me.y-y)<18){
die("🐍 Vastane elimineeris sind!");
return;
}
}
}else{
if(Math.hypot(me.x-p.x,me.y-p.y)<24){
send({type:"attack",target:id});
}
}
}
}

function update(){
if(!running||dead)return;

updateMe();

if(mode==="bots"){
updateBots();
botCollision();
}else{
multiplayerCollision();
}

checkWorld();

document.getElementById("score").textContent=Math.floor(score);
document.getElementById("len").textContent=Math.floor(me.length);
document.getElementById("kills").textContent=kills;

updateLeaderboard();
}

function updateLeaderboard(){
const arr=[{
name:name(),
length:me.length,
color:me.color,
me:true
}];

if(mode==="bots"){
bots.filter(b=>b.alive).forEach(b=>arr.push({
name:b.name,
length:b.length,
color:b.color
}));
}else{
Object.values(players).forEach(p=>arr.push({
name:p.name||"Player",
length:p.length||20,
color:p.color
}));
}

arr.sort((a,b)=>b.length-a.length);

document.getElementById("leaderList").innerHTML=
arr.slice(0,7).map((p,i)=>
'<div class="rank"><span style="color:'+(p.color||"white")+'">'+
(i+1)+". "+escapeHtml(p.name)+'</span><b>'+
Math.floor(p.length)+'</b></div>'
).join("");
}

function escapeHtml(s){
return String(s).replace(/[&<>"']/g,c=>({
"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[c]));
}

function camera(){
cameraX+=(me.x-cameraX)*.1;
cameraY+=(me.y-cameraY)*.1;
}

function draw(){
ctx.fillStyle="#061008";
ctx.fillRect(0,0,W,H);

if(!running)return;

camera();

ctx.save();
ctx.translate(W/2-cameraX,H/2-cameraY);

drawGrid();
drawBorder();
drawFood();

if(mode==="bots")drawBots();
else drawOtherPlayers();

drawSnake(body,me.color,me.skin,me.x,me.y,me.angle,name(),true);

ctx.restore();

drawMini();
}

function drawGrid(){
const grid=200;
const left=cameraX-W/2-300;
const right=cameraX+W/2+300;
const top=cameraY-H/2-300;
const bottom=cameraY+H/2+300;

ctx.strokeStyle="rgba(99,255,120,.045)";
ctx.lineWidth=1;

for(let x=Math.floor(left/grid)*grid;x<right;x+=grid){
ctx.beginPath();ctx.moveTo(x,top);ctx.lineTo(x,bottom);ctx.stroke();
}
for(let y=Math.floor(top/grid)*grid;y<bottom;y+=grid){
ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(right,y);ctx.stroke();
}
}

function drawBorder(){
ctx.strokeStyle="#63ff78";
ctx.lineWidth=14;
ctx.shadowColor="#63ff78";
ctx.shadowBlur=18;
ctx.strokeRect(0,0,WORLD,WORLD);
ctx.shadowBlur=0;
}

function drawFood(){
for(const f of foods){
if(Math.abs(f.x-cameraX)>W||Math.abs(f.y-cameraY)>H)continue;
ctx.fillStyle=f.color;
ctx.shadowColor=f.color;
ctx.shadowBlur=9;
ctx.beginPath();
ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
ctx.fill();
}
ctx.shadowBlur=0;
}

function drawSnake(arr,color,skin,x,y,a,n,isMe){
for(let i=arr.length-1;i>=0;i--){
const p=arr[i];
const progress=i/Math.max(1,arr.length);
const r=8+(1-progress)*9;
ctx.globalAlpha=1-progress*.3;
ctx.fillStyle=color;
ctx.shadowColor=color;
ctx.shadowBlur=i<8?12:3;
ctx.beginPath();
ctx.arc(p.x,p.y,r,0,Math.PI*2);
ctx.fill();
}
ctx.globalAlpha=1;
ctx.shadowBlur=0;

drawHead(x,y,22,color,skin,a);
drawName(n,x,y-34);
}

function drawHead(x,y,r,color,skin,a){
ctx.save();
ctx.translate(x,y);
ctx.rotate(a);

ctx.fillStyle=color;
ctx.shadowColor=color;
ctx.shadowBlur=18;
ctx.beginPath();
ctx.arc(0,0,r,0,Math.PI*2);
ctx.fill();
ctx.shadowBlur=0;

if(skin==="blue"){
ctx.strokeStyle="white";ctx.lineWidth=3;
ctx.stroke();
}
if(skin==="red"){
ctx.strokeStyle="#ffb8c3";ctx.lineWidth=4;
ctx.beginPath();ctx.moveTo(-13,-13);ctx.lineTo(13,13);ctx.moveTo(13,-13);ctx.lineTo(-13,13);ctx.stroke();
}
if(skin==="yellow"){
ctx.fillStyle="#fff5a5";
ctx.beginPath();ctx.arc(0,0,7,0,Math.PI*2);ctx.fill();
}
if(skin==="purple"){
ctx.fillStyle="#f0c9ff";
for(let i=0;i<6;i++){
const q=i*Math.PI/3;
ctx.beginPath();ctx.arc(Math.cos(q)*14,Math.sin(q)*14,3,0,Math.PI*2);ctx.fill();
}
}
if(skin==="orange"){
ctx.strokeStyle="#ffe2c5";ctx.lineWidth=3;
for(let i=-1;i<=1;i++){
ctx.beginPath();ctx.moveTo(-15,i*7);ctx.lineTo(15,i*7);ctx.stroke();
}
}
if(skin==="white"){
ctx.strokeStyle="#a0a0a0";ctx.lineWidth=2;ctx.stroke();
}
if(skin==="cyan"){
ctx.strokeStyle="white";ctx.lineWidth=3;
ctx.strokeRect(-11,-11,22,22);
}

ctx.fillStyle="white";
ctx.beginPath();ctx.arc(8,-7,6,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.arc(8,7,6,0,Math.PI*2);ctx.fill();

ctx.fillStyle="#111";
ctx.beginPath();ctx.arc(10,-7,3,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.arc(10,7,3,0,Math.PI*2);ctx.fill();

ctx.strokeStyle="#111";ctx.lineWidth=2;
ctx.beginPath();ctx.arc(13,0,5,-.7,.7);ctx.stroke();

ctx.restore();
}

function drawName(n,x,y){
ctx.save();
ctx.textAlign="center";
ctx.font="bold 12px Arial";
ctx.fillStyle="white";
ctx.shadowColor="black";
ctx.shadowBlur=5;
ctx.fillText(n,x,y);
ctx.restore();
}

function drawOtherPlayers(){
for(const id in players){
if(id===me.id)continue;
const p=players[id];
if(!p)continue;

const len=Math.min(140,Math.max(20,Math.floor(p.length||20)));
const arr=[];

for(let i=0;i<len;i++){
arr.push({
x:p.x-Math.cos(p.angle)*i*8,
y:p.y-Math.sin(p.angle)*i*8
});
}

drawSnake(
arr,
p.color||"#4da6ff",
p.skin||"blue",
p.x,p.y,p.angle,
p.name||"Player",
false
);
}
}

function drawBots(){
for(const b of bots){
if(!b.alive)continue;
const len=Math.floor(b.length);
const arr=[];
for(let i=0;i<len;i++){
arr.push({
x:b.x-Math.cos(b.angle)*i*8,
y:b.y-Math.sin(b.angle)*i*8
});
}
drawSnake(arr,b.color,b.skin,b.x,b.y,b.angle,b.name,false);
}
}

function drawMini(){
const s=mini.width;
mctx.clearRect(0,0,s,s);
mctx.fillStyle="#061007";
mctx.fillRect(0,0,s,s);

for(const f of foods){
mctx.fillStyle=f.color;
mctx.globalAlpha=.4;
mctx.beginPath();
mctx.arc(f.x/WORLD*s,f.y/WORLD*s,1.2,0,Math.PI*2);
mctx.fill();
}
mctx.globalAlpha=1;

if(mode==="bots"){
for(const b of bots){
if(!b.alive)continue;
mctx.fillStyle=b.color;
mctx.beginPath();
mctx.arc(b.x/WORLD*s,b.y/WORLD*s,3,0,Math.PI*2);
mctx.fill();
}
}else{
for(const id in players){
if(id===me.id)continue;
const p=players[id];
mctx.fillStyle=p.color||"#ff5268";
mctx.beginPath();
mctx.arc(p.x/WORLD*s,p.y/WORLD*s,3,0,Math.PI*2);
mctx.fill();
}
}

mctx.fillStyle=me.color;
mctx.beginPath();
mctx.arc(me.x/WORLD*s,me.y/WORLD*s,5,0,Math.PI*2);
mctx.fill();

mctx.strokeStyle="#63ff78";
mctx.strokeRect(1,1,s-2,s-2);
}

function showKill(){
const el=document.getElementById("kill");
el.classList.add("show");
clearTimeout(showKill.t);
showKill.t=setTimeout(()=>el.classList.remove("show"),900);
}

function die(reason){
if(dead)return;
dead=true;
running=false;
boosting=false;
document.getElementById("reason").textContent=reason;
document.getElementById("finalScore").textContent=Math.floor(score);
document.getElementById("over").style.display="flex";
}

function loop(){
update();
draw();
requestAnimationFrame(loop);
}

connect();
loop();
</script>

</body>
</html>
