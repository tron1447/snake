<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Snake Arena</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020603;
  color:white;
  font-family:Arial,sans-serif;
  touch-action:none;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}

.screen{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle at center,#12471e 0%,#030803 72%);
}

.card{
  width:min(94vw,470px);
  padding:28px;
  border-radius:28px;
  background:rgba(3,12,5,.97);
  border:1px solid rgba(91,255,125,.65);
  box-shadow:0 0 80px rgba(50,255,100,.18);
  text-align:center;
}

.logo{
  font-size:72px;
  animation:float 2s ease-in-out infinite;
}

@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-9px)}
}

h1{
  margin:5px 0 18px;
  color:#64ff8a;
  font-size:36px;
}

input,select{
  width:100%;
  padding:14px;
  margin:5px 0;
  border-radius:12px;
  border:1px solid #285b34;
  background:#071008;
  color:white;
  font-size:17px;
  text-align:center;
  outline:none;
}

button{
  width:100%;
  padding:14px;
  margin-top:8px;
  border:0;
  border-radius:12px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.green{
  background:#55ff79;
  color:#031007;
}

.blue{
  background:#418eff;
  color:white;
}

.purple{
  background:#a64cff;
  color:white;
}

.red{
  background:#35151a;
  color:#ff9da6;
}

#skins{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:9px;
  margin:14px 0;
}

.skin{
  width:37px;
  height:37px;
  border-radius:50%;
  border:3px solid transparent;
  cursor:pointer;
}

.skin.selected{
  border-color:white;
  box-shadow:0 0 20px currentColor;
  transform:scale(1.15);
}

#lobby{
  display:none;
}

.roomCode{
  font-size:50px;
  letter-spacing:8px;
  color:#5cff87;
  text-shadow:0 0 20px #5cff87;
  margin:10px;
}

.player{
  display:flex;
  align-items:center;
  background:#09170c;
  padding:10px;
  margin:5px;
  border-radius:10px;
  text-align:left;
}

.playerDot{
  width:16px;
  height:16px;
  border-radius:50%;
  margin-right:10px;
}

.crown{
  margin-left:auto;
}

#hud{
  position:fixed;
  z-index:20;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:7px;
  pointer-events:none;
}

.stat{
  min-width:75px;
  padding:7px 10px;
  text-align:center;
  border-radius:11px;
  background:rgba(2,14,6,.9);
  border:1px solid rgba(100,255,140,.3);
}

.stat small{
  display:block;
  color:#98aa9d;
  font-size:9px;
}

.stat b{
  font-size:17px;
}

#leaderboard{
  position:fixed;
  z-index:20;
  right:12px;
  top:12px;
  width:185px;
  padding:11px;
  border-radius:15px;
  background:rgba(2,14,6,.9);
  border:1px solid rgba(100,255,140,.3);
}

#leaderboard h3{
  margin:0 0 7px;
  color:#65ff8a;
}

.rank{
  display:flex;
  justify-content:space-between;
  padding:3px;
  font-size:12px;
}

#boost{
  position:fixed;
  z-index:30;
  right:24px;
  bottom:25px;
  width:105px;
  height:105px;
  border-radius:50%;
  background:radial-gradient(circle,#65c8ff,#07509b);
  border:2px solid #a6e4ff;
  color:white;
  font-size:28px;
  box-shadow:0 0 35px rgba(50,160,255,.55);
}

#boost span{
  display:block;
  font-size:9px;
}

#joystick{
  position:fixed;
  z-index:30;
  left:24px;
  bottom:25px;
  width:150px;
  height:150px;
  border-radius:50%;
  background:rgba(80,255,130,.07);
  border:2px solid rgba(100,255,140,.3);
}

#stick{
  position:absolute;
  left:42px;
  top:42px;
  width:64px;
  height:64px;
  border-radius:50%;
  background:rgba(80,255,130,.5);
  border:2px solid #a1ffb3;
}

#toast{
  position:fixed;
  z-index:500;
  left:50%;
  top:18%;
  transform:translate(-50%,-50%) scale(.8);
  padding:13px 22px;
  border-radius:30px;
  background:rgba(4,18,8,.96);
  border:1px solid #60ff88;
  opacity:0;
  transition:.2s;
  pointer-events:none;
}

#toast.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
}

#dead{
  display:none;
  position:fixed;
  z-index:200;
  inset:0;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.55);
}

.deadCard{
  padding:30px;
  text-align:center;
  border-radius:25px;
  background:#08140b;
  border:1px solid #55ff79;
}

@media(max-width:700px){
  #leaderboard{
    width:145px;
  }
}

@media(min-width:701px){
  #joystick{
    display:none;
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="toast"></div>

<!-- MENU -->
<div id="menu" class="screen">

  <div class="card">

    <div class="logo">🐍</div>

    <h1>SNAKE ARENA</h1>

    <input id="name" maxlength="16" placeholder="Sinu nimi">

    <select id="mode">
      <option value="classic">🍎 Classic</option>
      <option value="battle">⚔️ Battle</option>
      <option value="power">⚡ Power Arena</option>
    </select>

    <h3>🎨 SKIN</h3>

    <div id="skins"></div>

    <button class="green" onclick="createRoom()">
      🟢 LOO ROOM
    </button>

    <input id="room" maxlength="6" placeholder="ROOM CODE">

    <button class="blue" onclick="joinRoom()">
      🔵 LIITU ROOMI
    </button>

    <p id="connection">
      🔄 Ühendan serveriga...
    </p>

  </div>

</div>

<!-- LOBBY -->
<div id="lobby" class="screen">

  <div class="card">

    <h1>🐍 LOBBY</h1>

    <p>Jaga sõpradega seda koodi:</p>

    <div id="roomCode" class="roomCode">
      ------
    </div>

    <button class="purple" onclick="copyRoom()">
      📋 KOPI CODE
    </button>

    <h3>👥 MÄNGIJAD</h3>

    <div id="players"></div>

    <p id="waiting">
      ⏳ Ootame hosti...
    </p>

    <button id="startButton" class="green" onclick="startGame()">
      🚀 ALUSTA MÄNGU
    </button>

    <button class="red" onclick="location.reload()">
      ← LAHKU
    </button>

  </div>

</div>

<!-- HUD -->
<div id="hud">

  <div class="stat">
    <small>SCORE</small>
    <b id="score">0</b>
  </div>

  <div class="stat">
    <small>LENGTH</small>
    <b id="length">50</b>
  </div>

  <div class="stat">
    <small>RANK</small>
    <b id="rank">-</b>
  </div>

</div>

<div id="leaderboard">

  <h3>🏆 TOP 8</h3>

  <div id="board"></div>

</div>

<button id="boost">
  ⚡
  <span>BOOST</span>
</button>

<div id="joystick">
  <div id="stick"></div>
</div>

<div id="dead">

  <div class="deadCard">
    <h1>💥</h1>
    <h2>SAID PIHTA!</h2>
    <p>🐍 Respawn...</p>
  </div>

</div>

<script>

/* =========================
   SEADISTUSED
========================= */

const SERVER =
  "wss://snake-riu3.onrender.com";

const WORLD = 12000;

const SKINS = [
  "#55ff72",
  "#42a5ff",
  "#ff45d4",
  "#ffe033",
  "#ff713d",
  "#a855ff",
  "#00eaff",
  "#ff4268",
  "#ffffff",
  "#9dff32",
  "#ff9f1c",
  "#00ffc8"
];

let selectedSkin =
  Number(localStorage.getItem("snakeSkin") || 0);

let ws = null;
let myId = null;
let roomCode = null;
let isHost = false;
let gameStarted = false;

let remotePlayers = {};

let camera = {
  x:WORLD/2,
  y:WORLD/2
};

let canvas =
  document.getElementById("game");

let ctx =
  canvas.getContext("2d");

let audio = null;


/* =========================
   MINU MÄNGIJA
========================= */

let me = {

  x:WORLD/2,
  y:WORLD/2,

  angle:0,
  targetAngle:0,

  speed:4.8,

  score:0,
  length:50,

  alive:true,

  boosting:false,

  shield:0,
  magnet:0,
  speedPower:0,
  double:0,

  snake:[]

};


/* =========================
   TOIT
========================= */

let food = [];

let powers = [];

let particles = [];


/* =========================
   SKINID
========================= */

function renderSkins(){

  const box =
    document.getElementById("skins");

  box.innerHTML = "";

  SKINS.forEach((color,index)=>{

    const s =
      document.createElement("div");

    s.className="skin";

    s.style.background=color;

    if(index===selectedSkin){
      s.classList.add("selected");
    }

    s.onclick=()=>{

      selectedSkin=index;

      localStorage.setItem(
        "snakeSkin",
        index
      );

      renderSkins();

      beep("power");

    };

    box.appendChild(s);

  });

}

renderSkins();


/* =========================
   AUDIO
========================= */

function beep(type){

  try{

    if(!audio){

      audio =
        new (
          window.AudioContext ||
          window.webkitAudioContext
        )();

    }

    const osc =
      audio.createOscillator();

    const gain =
      audio.createGain();

    osc.connect(gain);
    gain.connect(audio.destination);

    let freq=400;

    if(type==="eat") freq=650;
    if(type==="power") freq=900;
    if(type==="boost") freq=180;
    if(type==="death") freq=90;
    if(type==="start") freq=520;

    osc.frequency.value=freq;

    gain.gain.setValueAtTime(
      .0001,
      audio.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
      .045,
      audio.currentTime+.02
    );

    gain.gain.exponentialRampToValueAtTime(
      .0001,
      audio.currentTime+.12
    );

    osc.start();

    osc.stop(
      audio.currentTime+.13
    );

  }catch(e){}

}


/* =========================
   TOAST
========================= */

function toast(text){

  const t =
    document.getElementById("toast");

  t.textContent=text;

  t.classList.add("show");

  setTimeout(()=>{
    t.classList.remove("show");
  },1400);

}


/* =========================
   WEBSOCKET
========================= */

function connect(){

  ws =
    new WebSocket(SERVER);

  ws.onopen=()=>{

    document.getElementById(
      "connection"
    ).textContent=
      "🟢 SERVER ÜHENDATUD";

  };

  ws.onmessage=(event)=>{

    let data;

    try{
      data=JSON.parse(event.data);
    }catch{
      return;
    }

    if(data.type==="connected"){

      myId=data.id;

    }

    if(data.type==="roomCreated"){

      roomCode=data.room;

      isHost=true;

      showLobby();

      toast("🐍 Room loodud!");

    }

    if(data.type==="roomJoined"){

      roomCode=data.room;

      isHost=false;

      showLobby();

      toast("👥 Liitusid!");

    }

    if(data.type==="lobby"){

      roomCode=data.room;

      isHost=data.host===myId;

      updateLobby(data);

    }

    if(data.type==="gameStarted"){

      startLocalGame();

    }

    if(data.type==="state"){

      processServerState(data.state);

    }

    if(data.type==="error"){

      toast(data.message);

    }

  };

  ws.onclose=()=>{

    document.getElementById(
      "connection"
    ).textContent=
      "🔴 Serveriga pole ühendust";

  };

}

connect();


/* =========================
   ROOM
========================= */

function send(data){

  if(
    ws &&
    ws.readyState===WebSocket.OPEN
  ){

    ws.send(
      JSON.stringify(data)
    );

  }

}

function createRoom(){

  const name =
    document.getElementById(
      "name"
    ).value.trim();

  if(!name){

    toast("Kirjuta nimi!");

    return;
  }

  send({

    type:"createRoom",

    name:name,

    skin:selectedSkin,

    mode:
      document.getElementById(
        "mode"
      ).value

  });

}

function joinRoom(){

  const name =
    document.getElementById(
      "name"
    ).value.trim();

  const code =
    document.getElementById(
      "room"
    ).value
    .trim()
    .toUpperCase();

  if(!name){

    toast("Kirjuta nimi!");

    return;
  }

  if(code.length!==6){

    toast("Room code peab olema 6 märki!");

    return;
  }

  send({

    type:"joinRoom",

    name:name,

    room:code,

    skin:selectedSkin

  });

}

function showLobby(){

  document.getElementById(
    "menu"
  ).style.display="none";

  document.getElementById(
    "lobby"
  ).style.display="flex";

  document.getElementById(
    "roomCode"
  ).textContent=roomCode;

}

function updateLobby(data){

  const box =
    document.getElementById(
      "players"
    );

  box.innerHTML="";

  data.players.forEach(p=>{

    const row =
      document.createElement("div");

    row.className="player";

    row.innerHTML=`

      <span
        class="playerDot"
        style="background:${p.skin}">
      </span>

      <span>${safe(p.name)}</span>

      ${
        p.id===data.host
        ? '<span class="crown">👑</span>'
        : ''
      }

    `;

    box.appendChild(row);

  });

  document.getElementById(
    "startButton"
  ).style.display =
    isHost
    ? "block"
    : "none";

  document.getElementById(
    "waiting"
  ).textContent =
    isHost
    ? "👑 Sina oled host — vajuta START!"
    : "⏳ Ootame hosti...";

}

function startGame(){

  if(!isHost){

    toast(
      "❌ Ainult host saab alustada!"
    );

    return;
  }

  send({
    type:"startGame"
  });

}

function copyRoom(){

  navigator.clipboard
    .writeText(roomCode)
    .then(()=>{
      toast("📋 Code kopeeritud!");
    })
    .catch(()=>{
      toast(roomCode);
    });

}


/* =========================
   SERVER STATE
========================= */

function processServerState(serverState){

  if(!serverState)return;

  remotePlayers={};

  for(
    const [id,p]
    of Object.entries(
      serverState.players || {}
    )
  ){

    if(id===myId){

      /*
        ÄRA võta serverilt
        minu X/Y liikumist.

        See oli vana probleemi
        peamine põhjus.
      */

      if(p.score > me.score){
        beep("eat");
      }

      me.score=p.score;
      me.length=p.length;

      me.shield=p.shield||0;
      me.magnet=p.magnet||0;
      me.speedPower=p.speedPower||0;
      me.double=p.double||0;

      continue;
    }

    remotePlayers[id]=p;

  }

}


/* =========================
   MÄNGU START
========================= */

function startLocalGame(){

  if(gameStarted)return;

  gameStarted=true;

  document.getElementById(
    "lobby"
  ).style.display="none";

  resetPlayer();

  beep("start");

  toast("🚀 MÄNG ALGAS!");

}

function resetPlayer(){

  me.x =
    WORLD/2 +
    Math.random()*800-400;

  me.y =
    WORLD/2 +
    Math.random()*800-400;

  me.angle=
    Math.random()*Math.PI*2;

  me.targetAngle=me.angle;

  me.score=0;

  me.length=50;

  me.alive=true;

  me.boosting=false;

  me.snake=[];

  for(let i=0;i<me.length;i++){

    me.snake.push({

      x:
        me.x-
        Math.cos(me.angle)*i*7,

      y:
        me.y-
        Math.sin(me.angle)*i*7

    });

  }

}


/* =========================
   LOCAL FOOD
========================= */

function createFood(){

  food=[];

  for(let i=0;i<1000;i++){

    food.push({

      x:Math.random()*WORLD,

      y:Math.random()*WORLD,

      size:
        Math.random()<.04
        ? 10
        : 5,

      value:
        Math.random()<.04
        ? 10
        : 1,

      type:
        Math.random()<.04
        ? "gold"
        : "normal",

      pulse:
        Math.random()*10

    });

  }

}

createFood();


/* =========================
   POWERUPS
========================= */

function createPowers(){

  powers=[];

  const types=[
    "speed",
    "magnet",
    "shield",
    "double"
  ];

  for(let i=0;i<18;i++){

    powers.push({

      x:300+
        Math.random()*
        (WORLD-600),

      y:300+
        Math.random()*
        (WORLD-600),

      type:
        types[
          Math.floor(
            Math.random()*types.length
          )
        ]

    });

  }

}

createPowers();


/* =========================
   INPUT
========================= */

let mouseX=innerWidth/2;
let mouseY=innerHeight/2;

addEventListener(
  "mousemove",
  e=>{

    mouseX=e.clientX;
    mouseY=e.clientY;

  }
);

function updateAim(){

  if(!gameStarted)return;

  const dx =
    mouseX-
    innerWidth/2;

  const dy =
    mouseY-
    innerHeight/2;

  if(Math.hypot(dx,dy)>20){

    me.targetAngle =
      Math.atan2(dy,dx);

  }

}

let boosting=false;

function setBoost(value){

  if(!gameStarted)return;

  boosting=value;

  me.boosting=value;

  send({

    type:"boost",

    active:value

  });

  if(value){
    beep("boost");
  }

}

addEventListener(
  "keydown",
  e=>{

    if(
      e.code==="ShiftLeft"||
      e.code==="ShiftRight"||
      e.code==="Space"
    ){

      e.preventDefault();

      setBoost(true);

    }

  }
);

addEventListener(
  "keyup",
  e=>{

    if(
      e.code==="ShiftLeft"||
      e.code==="ShiftRight"||
      e.code==="Space"
    ){

      e.preventDefault();

      setBoost(false);

    }

  }
);


/* =========================
   BOOST BUTTON
========================= */

const boostButton =
  document.getElementById(
    "boost"
  );

boostButton.addEventListener(
  "touchstart",
  e=>{

    e.preventDefault();

    setBoost(true);

  },
  {passive:false}
);

boostButton.addEventListener(
  "touchend",
  e=>{

    e.preventDefault();

    setBoost(false);

  },
  {passive:false}
);


/* =========================
   JOYSTICK
========================= */

const joystick =
  document.getElementById(
    "joystick"
  );

const stick =
  document.getElementById(
    "stick"
  );

let joystickActive=false;

function moveJoystick(x,y){

  const rect =
    joystick.getBoundingClientRect();

  const cx =
    rect.left+
    rect.width/2;

  const cy =
    rect.top+
    rect.height/2;

  let dx=x-cx;
  let dy=y-cy;

  const max=50;

  const length=
    Math.hypot(dx,dy);

  if(length>max){

    dx=dx/length*max;
    dy=dy/length*max;

  }

  stick.style.left=
    42+dx+"px";

  stick.style.top=
    42+dy+"px";

  if(Math.hypot(dx,dy)>8){

    me.targetAngle=
      Math.atan2(dy,dx);

  }

}

joystick.addEventListener(
  "touchstart",
  e=>{

    e.preventDefault();

    joystickActive=true;

    const t=e.touches[0];

    moveJoystick(
      t.clientX,
      t.clientY
    );

  },
  {passive:false}
);

joystick.addEventListener(
  "touchmove",
  e=>{

    if(!joystickActive)return;

    e.preventDefault();

    const t=e.touches[0];

    moveJoystick(
      t.clientX,
      t.clientY
    );

  },
  {passive:false}
);

joystick.addEventListener(
  "touchend",
  ()=>{

    joystickActive=false;

    stick.style.left="42px";
    stick.style.top="42px";

  }
);


/* =========================
   ANGLE
========================= */

function angleDifference(a,b){

  let d=b-a;

  while(d>Math.PI){
    d-=Math.PI*2;
  }

  while(d<-Math.PI){
    d+=Math.PI*2;
  }

  return d;

}


/* =========================
   LOCAL MOVEMENT
========================= */

let lastTime=
  performance.now();

function updateGame(){

  const now=
    performance.now();

  let dt=
    Math.min(
      2,
      (now-lastTime)/16.67
    );

  lastTime=now;

  if(!gameStarted){
    return;
  }

  if(!me.alive){

    return;

  }

  updateAim();

  const turn=
    angleDifference(
      me.angle,
      me.targetAngle
    );

  me.angle +=
    Math.max(
      -.13*dt,
      Math.min(
        .13*dt,
        turn
      )
    );

  let speed=4.8;

  if(me.speedPower>0){
    speed=7.5;
    me.speedPower-=dt;
  }

  if(me.boosting){

    speed=8.5;

    me.length-=
      .08*dt;

    if(me.length<30){

      me.boosting=false;

      boosting=false;

    }

  }

  me.x +=
    Math.cos(me.angle)*
    speed*
    dt;

  me.y +=
    Math.sin(me.angle)*
    speed*
    dt;

  /* maailma */

  if(me.x<30){

    me.x=30;

    me.angle=
      Math.PI-me.angle;

  }

  if(me.x>WORLD-30){

    me.x=WORLD-30;

    me.angle=
      Math.PI-me.angle;

  }

  if(me.y<30){

    me.y=30;

    me.angle=
      -me.angle;

  }

  if(me.y>WORLD-30){

    me.y=WORLD-30;

    me.angle=
      -me.angle;

  }

  /* pea */

  me.snake.unshift({

    x:me.x,

    y:me.y

  });

  const wanted=
    Math.max(
      30,
      Math.floor(me.length)
    );

  while(
    me.snake.length>wanted
  ){

    me.snake.pop();

  }

  collectFood();

  collectPowerups();

  updateCamera();

  sendPosition();

}


/* =========================
   SERVERILE POSITSIOON
========================= */

let lastSend=0;

function sendPosition(){

  const now=Date.now();

  if(now-lastSend<70)return;

  lastSend=now;

  send({

    type:"aim",

    angle:me.angle

  });

}


/* =========================
   TOIDU KORJAMINE
========================= */

function collectFood(){

  for(
    let i=food.length-1;
    i>=0;
    i--
  ){

    const f=food[i];

    const dx=
      me.x-f.x;

    const dy=
      me.y-f.y;

    if(
      dx*dx+
      dy*dy<
      32*32
    ){

      let value=f.value;

      if(me.double>0){
        value*=2;
      }

      me.score+=value;

      me.length+=
        value*2;

      spawnParticles(
        f.x,
        f.y,
        f.type==="gold"
        ?"gold"
        :"green"
      );

      beep("eat");

      food.splice(i,1);

      food.push({

        x:Math.random()*WORLD,

        y:Math.random()*WORLD,

        size:
          Math.random()<.04
          ?10
          :5,

        value:
          Math.random()<.04
          ?10
          :1,

        type:
          Math.random()<.04
          ?"gold"
          :"normal",

        pulse:
          Math.random()*10

      });

    }

  }

}


/* =========================
   POWERUP KORJAMINE
========================= */

function collectPowerups(){

  for(
    let i=powers.length-1;
    i>=0;
    i--
  ){

    const p=powers[i];

    if(
      Math.hypot(
        me.x-p.x,
        me.y-p.y
      )<38
    ){

      if(p.type==="speed")
        me.speedPower=600;

      if(p.type==="magnet")
        me.magnet=800;

      if(p.type==="shield")
        me.shield=900;

      if(p.type==="double")
        me.double=900;

      spawnParticles(
        p.x,
        p.y,
        "power"
      );

      beep("power");

      toast(
        p.type==="speed"
        ?"⚡ SPEED!"
        :p.type==="magnet"
        ?"🧲 MAGNET!"
        :p.type==="shield"
        ?"🛡️ SHIELD!"
        :"×2 SCORE!"
      );

      powers.splice(i,1);

      setTimeout(()=>{

        powers.push({

          x:300+
            Math.random()*
            (WORLD-600),

          y:300+
            Math.random()*
            (WORLD-600),

          type:[
            "speed",
            "magnet",
            "shield",
            "double"
          ][
            Math.floor(
              Math.random()*4
            )
          ]

        });

      },5000);

    }

  }

}


/* =========================
   KAAMERA
========================= */

function updateCamera(){

  camera.x +=
    (me.x-camera.x)*
    .13;

  camera.y +=
    (me.y-camera.y)*
    .13;

}


/* =========================
   PARTIKLID
========================= */

function spawnParticles(x,y,type){

  for(let i=0;i<12;i++){

    particles.push({

      x,
      y,

      vx:
        Math.cos(
          Math.random()*Math.PI*2
        )*
        (1+Math.random()*3),

      vy:
        Math.sin(
          Math.random()*Math.PI*2
        )*
        (1+Math.random()*3),

      life:1,

      type

    });

  }

}

function updateParticles(){

  for(
    let i=particles.length-1;
    i>=0;
    i--
  ){

    const p=particles[i];

    p.x+=p.vx;
    p.y+=p.vy;

    p.life-=.035;

    if(p.life<=0){
      particles.splice(i,1);
    }

  }

}


/* =========================
   CANVAS
========================= */

function resize(){

  canvas.width=
    innerWidth*
    devicePixelRatio;

  canvas.height=
    innerHeight*
    devicePixelRatio;

  canvas.style.width=
    innerWidth+"px";

  canvas.style.height=
    innerHeight+"px";

  ctx.setTransform(
    devicePixelRatio,
    0,
    0,
    devicePixelRatio,
    0,
    0
  );

}

addEventListener(
  "resize",
  resize
);

resize();


/* =========================
   JOONISTA
========================= */

function draw(){

  requestAnimationFrame(draw);

  ctx.clearRect(
    0,
    0,
    innerWidth,
    innerHeight
  );

  if(!gameStarted)return;

  const zoom=1.55;

  ctx.save();

  ctx.translate(
    innerWidth/2,
    innerHeight/2
  );

  ctx.scale(
    zoom,
    zoom
  );

  ctx.translate(
    -camera.x,
    -camera.y
  );

  const viewW=
    innerWidth/zoom;

  const viewH=
    innerHeight/zoom;

  /* TAUST */

  ctx.fillStyle="#06190a";

  ctx.fillRect(
    0,
    0,
    WORLD,
    WORLD
  );

  /* GRID */

  const grid=150;

  const left=
    camera.x-viewW/2-100;

  const right=
    camera.x+viewW/2+100;

  const top=
    camera.y-viewH/2-100;

  const bottom=
    camera.y+viewH/2+100;

  ctx.strokeStyle=
    "rgba(100,255,130,.045)";

  ctx.lineWidth=1;

  for(
    let x=Math.floor(left/grid)*grid;
    x<right;
    x+=grid
  ){

    ctx.beginPath();

    ctx.moveTo(x,top);
    ctx.lineTo(x,bottom);

    ctx.stroke();

  }

  for(
    let y=Math.floor(top/grid)*grid;
    y<bottom;
    y+=grid
  ){

    ctx.beginPath();

    ctx.moveTo(left,y);
    ctx.lineTo(right,y);

    ctx.stroke();

  }

  /* KAARDI ÄÄR */

  ctx.strokeStyle="#54ff79";

  ctx.lineWidth=25;

  ctx.strokeRect(
    0,
    0,
    WORLD,
    WORLD
  );

  /* FOOD */

  for(const f of food){

    if(
      f.x<left-50||
      f.x>right+50||
      f.y<top-50||
      f.y>bottom+50
    )continue;

    const pulse=
      Math.sin(
        Date.now()/180+
        f.pulse
      )*1.5;

    const color=
      f.type==="gold"
      ?" #ffe43f"
      :"#ff5574";

    ctx.fillStyle=color;

    ctx.shadowColor=color;

    ctx.shadowBlur=14;

    ctx.beginPath();

    ctx.arc(
      f.x,
      f.y,
      f.size+pulse,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

  ctx.shadowBlur=0;

  /* POWERUPS */

  for(const p of powers){

    if(
      p.x<left-60||
      p.x>right+60||
      p.y<top-60||
      p.y>bottom+60
    )continue;

    let color="#fff";
    let icon="?";

    if(p.type==="speed"){
      color="#42b9ff";
      icon="⚡";
    }

    if(p.type==="magnet"){
      color="#ff42dc";
      icon="🧲";
    }

    if(p.type==="shield"){
      color="#668aff";
      icon="🛡";
    }

    if(p.type==="double"){
      color="#ffd83f";
      icon="×2";
    }

    const pulse=
      Math.sin(
        Date.now()/160
      )*4;

    ctx.fillStyle=color;

    ctx.shadowColor=color;

    ctx.shadowBlur=25;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      22+pulse,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;

    ctx.font="bold 18px Arial";

    ctx.textAlign="center";

    ctx.textBaseline="middle";

    ctx.fillStyle="white";

    ctx.fillText(
      icon,
      p.x,
      p.y
    );

  }

  /* TEISED MÄNGIJAD */

  for(
    const p of Object.values(
      remotePlayers
    )
  ){

    drawSnake(
      p.snake||[],
      p.skin||"#42a5ff",
      p.name,
      p.angle,
      false,
      p.shield>0
    );

  }

  /* MINU SNAKE */

  drawSnake(
    me.snake,
    SKINS[selectedSkin],
    document.getElementById(
      "name"
    ).value || "Sina",
    me.angle,
    true,
    me.shield>0
  );

  /* PARTICLES */

  for(const p of particles){

    ctx.globalAlpha=p.life;

    ctx.fillStyle=
      p.type==="gold"
      ?"#ffe43f"
      :p.type==="power"
      ?"#6affff"
      :"#55ff79";

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      3,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

  ctx.globalAlpha=1;

  ctx.restore();

}


/* =========================
   SNAKE JOONISTAMINE
========================= */

function drawSnake(
  snake,
  color,
  name,
  angle,
  mine,
  shield
){

  if(!snake.length)return;

  for(
    let i=snake.length-1;
    i>=0;
    i--
  ){

    const part=snake[i];

    const t=
      i/snake.length;

    const radius=
      Math.max(
        6,
        15-t*8
      );

    ctx.fillStyle=color;

    ctx.shadowColor=color;

    ctx.shadowBlur=
      mine ? 15 : 7;

    ctx.beginPath();

    ctx.arc(
      part.x,
      part.y,
      radius,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

  ctx.shadowBlur=0;

  const head=snake[0];

  if(!head)return;

  ctx.fillStyle=color;

  ctx.beginPath();

  ctx.arc(
    head.x,
    head.y,
    18,
    0,
    Math.PI*2
  );

  ctx.fill();

  /* silmad */

  const ex=
    Math.cos(angle);

  const ey=
    Math.sin(angle);

  const sx=
    -Math.sin(angle);

  const sy=
    Math.cos(angle);

  ctx.fillStyle="#061008";

  ctx.beginPath();

  ctx.arc(
    head.x+
      ex*9+
      sx*5,
    head.y+
      ey*9+
      sy*5,
    4,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.arc(
    head.x+
      ex*9-
      sx*5,
    head.y+
      ey*9-
      sy*5,
    4,
    0,
    Math.PI*2
  );

  ctx.fill();

  /* shield */

  if(shield){

    ctx.strokeStyle="#67aaff";

    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.arc(
      head.x,
      head.y,
      29+
        Math.sin(
          Date.now()/100
        )*2,
      0,
      Math.PI*2
    );

    ctx.stroke();

  }

  /* nimi */

  ctx.font=
    "bold 13px Arial";

  ctx.textAlign="center";

  ctx.fillStyle="white";

  ctx.fillText(
    safe(name),
    head.x,
    head.y-32
  );

}


/* =========================
   HUD
========================= */

function updateHUD(){

  document.getElementById(
    "score"
  ).textContent=
    Math.floor(me.score);

  document.getElementById(
    "length"
  ).textContent=
    Math.floor(me.length);

  const all=[
    {
      id:myId,
      score:me.score
    },
    ...Object.values(
      remotePlayers
    )
  ];

  all.sort(
    (a,b)=>
      (b.score||0)-
      (a.score||0)
  );

  const myRank=
    all.findIndex(
      p=>p.id===myId
    )+1;

  document.getElementById(
    "rank"
  ).textContent=
    myRank||1;

  const board=
    document.getElementById(
      "board"
    );

  board.innerHTML="";

  all.slice(0,8).forEach(
    (p,i)=>{

      const div=
        document.createElement(
          "div"
        );

      let playerName="Player";

      if(p.id===myId){

        playerName=
          document.getElementById(
            "name"
          ).value||"Sina";

      }else{

        playerName=
          p.name||"Player";

      }

      div.className="rank";

      div.innerHTML=`
        <span>
          ${i+1}. ${safe(playerName)}
        </span>

        <b>
          ${Math.floor(
            p.score||0
          )}
        </b>
      `;

      board.appendChild(div);

    }
  );

}


/* =========================
   TURVALINE TEKST
========================= */

function safe(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");

}


/* =========================
   LOOP
========================= */

function gameLoop(){

  updateGame();

  updateParticles();

  updateHUD();

  requestAnimationFrame(
    gameLoop
  );

}

gameLoop();

draw();

</script>
