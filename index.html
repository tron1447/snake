<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Snake Arena</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#071007;
    touch-action:none;
    font-family:Arial,sans-serif;
}

#game{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

/* MENU */

#menu{
    position:fixed;
    inset:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at center,#17371c 0%,#081008 50%,#020402 100%);
}

.menu{
    width:min(90%,430px);
    padding:32px;
    text-align:center;
    border-radius:25px;
    background:rgba(5,13,6,.95);
    border:1px solid rgba(100,255,120,.35);
    box-shadow:0 0 60px rgba(70,255,90,.15);
}

.logo{
    font-size:72px;
}

h1{
    margin:5px 0;
    font-size:43px;
    color:#69ff7b;
}

.desc{
    margin:10px 0 25px;
    color:#94a895;
}

#name{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid #315a37;
    background:#0b160c;
    color:white;
    outline:none;
    font-size:17px;
    text-align:center;
}

#play{
    width:100%;
    margin-top:14px;
    padding:15px;
    border:0;
    border-radius:12px;
    background:#63ff77;
    color:#061007;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
}

/* HUD */

#hud{
    position:fixed;
    z-index:10;
    top:12px;
    left:12px;
    display:none;
    gap:8px;
}

.box{
    padding:8px 13px;
    border-radius:10px;
    background:rgba(0,0,0,.65);
    border:1px solid rgba(100,255,120,.25);
    color:white;
}

.box span{
    display:block;
    color:#79917d;
    font-size:9px;
}

.box strong{
    font-size:17px;
}

/* MINIMAP */

#minimap{
    position:fixed;
    z-index:10;
    top:12px;
    right:12px;
    width:165px;
    height:165px;
    display:none;
    border-radius:14px;
    overflow:hidden;
    background:#071008;
    border:2px solid rgba(100,255,120,.75);
    box-shadow:0 0 20px rgba(70,255,100,.18);
}

#map{
    width:100%;
    height:100%;
}

.mapLabel{
    position:absolute;
    top:5px;
    left:7px;
    color:#8cff9b;
    font-size:9px;
    font-weight:bold;
}

/* JOYSTICK */

#joystick{
    position:fixed;
    z-index:15;
    left:25px;
    bottom:25px;
    width:145px;
    height:145px;
    display:none;
    border-radius:50%;
    background:rgba(100,255,120,.10);
    border:2px solid rgba(120,255,140,.35);
}

#stick{
    position:absolute;
    width:60px;
    height:60px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:#63e878;
    border:3px solid rgba(255,255,255,.8);
}

/* BOOST */

#boost{
    position:fixed;
    z-index:15;
    right:25px;
    bottom:35px;
    display:none;
    width:95px;
    height:95px;
    border-radius:50%;
    border:3px solid #8edcff;
    background:#09689d;
    color:white;
    font-size:28px;
}

/* ROTATE */

#rotate{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:#020502;
    color:white;
}

#rotate div{
    padding:30px;
}

#rotate .icon{
    font-size:70px;
}

#rotate h2{
    color:#63ff77;
    margin:15px 0;
}

@media(max-width:800px){
    #joystick{
        display:block;
    }

    #boost{
        display:block;
    }

    #minimap{
        width:135px;
        height:135px;
    }
}

@media(max-width:800px) and (orientation:portrait){
    #menu{
        display:none;
    }

    #rotate{
        display:flex;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="rotate">
    <div>
        <div class="icon">📱</div>
        <h2>PÖÖRA TELEFON KÜLILI</h2>
        <p>Snake Arena töötab kõige paremini horisontaalselt.</p>
    </div>
</div>

<div id="menu">
    <div class="menu">
        <div class="logo">🐍</div>
        <h1>SNAKE ARENA</h1>

        <div class="desc">
            Kasvata oma madu ja saa kõige suuremaks!
        </div>

        <input
            id="name"
            maxlength="16"
            placeholder="Sinu nimi">

        <button id="play">
            MÄNGI
        </button>
    </div>
</div>

<div id="hud">

    <div class="box">
        <span>SCORE</span>
        <strong id="score">0</strong>
    </div>

    <div class="box">
        <span>LENGTH</span>
        <strong id="length">20</strong>
    </div>

</div>

<div id="minimap">
    <canvas id="map" width="165" height="165"></canvas>
    <div class="mapLabel">MINIMAP</div>
</div>

<div id="joystick">
    <div id="stick"></div>
</div>

<button id="boost">⚡</button>

<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const mapCanvas=document.getElementById("map");
const mapCtx=mapCanvas.getContext("2d");

let width=innerWidth;
let height=innerHeight;

function resize(){

    width=innerWidth;
    height=innerHeight;

    const dpr=Math.min(devicePixelRatio||1,2);

    canvas.width=width*dpr;
    canvas.height=height*dpr;

    canvas.style.width=width+"px";
    canvas.style.height=height+"px";

    ctx.setTransform(dpr,0,0,dpr,0,0);
}

addEventListener("resize",resize);
resize();


/* =====================================================
   WORLD
===================================================== */

const WORLD_SIZE=20000;


/* =====================================================
   GAME
===================================================== */

let running=false;

let score=0;

let length=20;

let boost=false;

let lastTime=0;

let foods=[];

const player={
    x:WORLD_SIZE/2,
    y:WORLD_SIZE/2,
    angle:0,
    targetAngle:0,
    speed:4.5
};

const camera={
    x:player.x,
    y:player.y
};

let body=[];


/* =====================================================
   FOOD
===================================================== */

function createFood(){

    foods=[];

    for(let i=0;i<1000;i++){

        foods.push({
            x:Math.random()*WORLD_SIZE,
            y:Math.random()*WORLD_SIZE,
            size:3+Math.random()*4,
            hue:Math.random()*360
        });
    }
}


/* =====================================================
   START
===================================================== */

function startGame(){

    running=true;

    score=0;
    length=20;

    player.x=WORLD_SIZE/2;
    player.y=WORLD_SIZE/2;

    player.angle=Math.random()*Math.PI*2;
    player.targetAngle=player.angle;

    camera.x=player.x;
    camera.y=player.y;

    body=[];

    for(let i=0;i<length;i++){

        body.push({
            x:player.x-Math.cos(player.angle)*i*9,
            y:player.y-Math.sin(player.angle)*i*9
        });
    }

    createFood();

    document.getElementById("menu").style.display="none";
    document.getElementById("hud").style.display="flex";
    document.getElementById("minimap").style.display="block";

    if(innerWidth<=800){
        document.getElementById("joystick").style.display="block";
        document.getElementById("boost").style.display="block";
    }
}


/* =====================================================
   KEYBOARD
===================================================== */

const keys={};

addEventListener("keydown",e=>{

    keys[e.key.toLowerCase()]=true;

    if(e.key==="Shift"){
        boost=true;
    }
});

addEventListener("keyup",e=>{

    keys[e.key.toLowerCase()]=false;

    if(e.key==="Shift"){
        boost=false;
    }
});


function keyboardControl(){

    let dx=0;
    let dy=0;

    if(keys["w"]||keys["arrowup"])dy-=1;
    if(keys["s"]||keys["arrowdown"])dy+=1;
    if(keys["a"]||keys["arrowleft"])dx-=1;
    if(keys["d"]||keys["arrowright"])dx+=1;

    if(dx!==0||dy!==0){

        player.targetAngle=Math.atan2(dy,dx);
    }
}


/* =====================================================
   MOUSE
===================================================== */

addEventListener("mousemove",e=>{

    if(!running)return;

    if(innerWidth<=800)return;

    player.targetAngle=Math.atan2(
        e.clientY-height/2,
        e.clientX-width/2
    );
});


/* =====================================================
   JOYSTICK
===================================================== */

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joystickTouch=null;

function moveJoystick(x,y){

    const rect=joystick.getBoundingClientRect();

    const centerX=rect.left+rect.width/2;
    const centerY=rect.top+rect.height/2;

    let dx=x-centerX;
    let dy=y-centerY;

    const max=55;

    const distance=Math.hypot(dx,dy);

    if(distance>max){

        dx=dx/distance*max;
        dy=dy/distance*max;
    }

    stick.style.left=`calc(50% + ${dx}px)`;
    stick.style.top=`calc(50% + ${dy}px)`;

    if(distance>5){

        player.targetAngle=Math.atan2(dy,dx);
    }
}

function resetJoystick(){

    joystickTouch=null;

    stick.style.left="50%";
    stick.style.top="50%";
}

joystick.addEventListener("touchstart",e=>{

    e.preventDefault();

    const t=e.changedTouches[0];

    joystickTouch=t.identifier;

    moveJoystick(t.clientX,t.clientY);

},{passive:false});

joystick.addEventListener("touchmove",e=>{

    e.preventDefault();

    for(const t of e.changedTouches){

        if(t.identifier===joystickTouch){

            moveJoystick(
                t.clientX,
                t.clientY
            );

            break;
        }
    }

},{passive:false});

joystick.addEventListener("touchend",e=>{

    e.preventDefault();

    resetJoystick();

},{passive:false});

joystick.addEventListener("touchcancel",e=>{

    resetJoystick();

});


/* =====================================================
   BOOST BUTTON
===================================================== */

const boostButton=document.getElementById("boost");

boostButton.addEventListener("touchstart",e=>{

    e.preventDefault();
    boost=true;

},{passive:false});

boostButton.addEventListener("touchend",e=>{

    e.preventDefault();
    boost=false;

},{passive:false});

boostButton.addEventListener("touchcancel",()=>{

    boost=false;

});


/* =====================================================
   ANGLE
===================================================== */

function rotateTowards(current,target,amount){

    let difference=target-current;

    while(difference>Math.PI){
        difference-=Math.PI*2;
    }

    while(difference<-Math.PI){
        difference+=Math.PI*2;
    }

    return current+difference*amount;
}


/* =====================================================
   UPDATE
===================================================== */

function update(dt){

    if(!running)return;

    keyboardControl();

    player.angle=rotateTowards(
        player.angle,
        player.targetAngle,
        Math.min(1,dt*8)
    );

    const currentSpeed=
        boost
        ? player.speed*1.8
        : player.speed;


    player.x+=
        Math.cos(player.angle)*
        currentSpeed*
        dt*60;

    player.y+=
        Math.sin(player.angle)*
        currentSpeed*
        dt*60;


    /* WORLD BORDER */

    if(player.x<30){
        player.x=30;
        player.targetAngle=0;
    }

    if(player.y<30){
        player.y=30;
        player.targetAngle=Math.PI/2;
    }

    if(player.x>WORLD_SIZE-30){
        player.x=WORLD_SIZE-30;
        player.targetAngle=Math.PI;
    }

    if(player.y>WORLD_SIZE-30){
        player.y=WORLD_SIZE-30;
        player.targetAngle=-Math.PI/2;
    }


    /* BODY */

    body.unshift({
        x:player.x,
        y:player.y
    });

    while(body.length>Math.floor(length)){
        body.pop();
    }


    /* FOOD */

    for(let i=foods.length-1;i>=0;i--){

        const f=foods[i];

        if(
            Math.hypot(
                player.x-f.x,
                player.y-f.y
            )<24
        ){

            score++;
            length+=1;

            foods[i]={
                x:Math.random()*WORLD_SIZE,
                y:Math.random()*WORLD_SIZE,
                size:3+Math.random()*4,
                hue:Math.random()*360
            };
        }
    }


    /* CAMERA */

    camera.x+=(player.x-camera.x)*Math.min(1,dt*7);
    camera.y+=(player.y-camera.y)*Math.min(1,dt*7);


    document.getElementById("score").textContent=score;
    document.getElementById("length").textContent=Math.floor(length);
}


/* =====================================================
   DRAW
===================================================== */

function draw(){

    ctx.clearRect(0,0,width,height);

    ctx.fillStyle="#071007";
    ctx.fillRect(0,0,width,height);

    if(!running)return;

    /*
       Sama maailma.
       Ainult kaamera liigub.
    */

    const zoom=1.15;

    ctx.save();

    ctx.translate(width/2,height/2);

    ctx.scale(zoom,zoom);

    ctx.translate(
        -camera.x,
        -camera.y
    );


    /* WORLD */

    ctx.fillStyle="#0b1b0d";

    ctx.fillRect(
        0,
        0,
        WORLD_SIZE,
        WORLD_SIZE
    );


    /* GRID */

    const grid=250;

    const visibleW=width/zoom;
    const visibleH=height/zoom;

    const left=camera.x-visibleW/2-500;
    const right=camera.x+visibleW/2+500;

    const top=camera.y-visibleH/2-500;
    const bottom=camera.y+visibleH/2+500;

    ctx.strokeStyle="rgba(100,255,120,.035)";
    ctx.lineWidth=1;

    for(
        let x=Math.floor(left/grid)*grid;
        x<right;
        x+=grid
    ){

        ctx.beginPath();
        ctx.moveTo(x,top);
        ctx.lineTo(x,bottom);
        ctx.stroke();
    }

    for(
        let y=Math.floor(top/grid)*grid;
        y<bottom;
        y+=grid
    ){

        ctx.beginPath();
        ctx.moveTo(left,y);
        ctx.lineTo(right,y);
        ctx.stroke();
    }


    /* FOOD */

    for(const f of foods){

        if(
            f.x<left||
            f.x>right||
            f.y<top||
            f.y>bottom
        )continue;

        ctx.fillStyle=`hsl(${f.hue},90%,60%)`;

        ctx.beginPath();

        ctx.arc(
            f.x,
            f.y,
            f.size,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    /* SNAKE */

    drawSnake();


    /* BORDER */

    ctx.strokeStyle="#55ff70";
    ctx.lineWidth=25;

    ctx.strokeRect(
        0,
        0,
        WORLD_SIZE,
        WORLD_SIZE
    );

    ctx.restore();


    drawMinimap();
}


/* =====================================================
   SNAKE
===================================================== */

function drawSnake(){

    for(let i=body.length-1;i>=0;i--){

        const p=body[i];

        const progress=i/body.length;

        const radius=
            17-progress*7;

        ctx.fillStyle="#63ff78";

        ctx.shadowColor="#63ff78";
        ctx.shadowBlur=7;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            Math.max(7,radius),
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.shadowBlur=0;


    /* HEAD */

    ctx.fillStyle="#63ff78";

    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y,
        18,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* EYES */

    const fx=Math.cos(player.angle);
    const fy=Math.sin(player.angle);

    const sx=-fy;
    const sy=fx;

    ctx.fillStyle="#061006";

    ctx.beginPath();

    ctx.arc(
        player.x+fx*9+sx*5,
        player.y+fy*9+sy*5,
        4,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        player.x+fx*9-sx*5,
        player.y+fy*9-sy*5,
        4,
        0,
        Math.PI*2
    );

    ctx.fill();
}


/* =====================================================
   MINIMAP
===================================================== */

function drawMinimap(){

    const size=165;

    mapCtx.clearRect(
        0,
        0,
        size,
        size
    );

    mapCtx.fillStyle="#071008";

    mapCtx.fillRect(
        0,
        0,
        size,
        size
    );


    /* GRID */

    mapCtx.strokeStyle=
        "rgba(120,255,140,.10)";

    for(let i=1;i<10;i++){

        const p=i*size/10;

        mapCtx.beginPath();
        mapCtx.moveTo(p,0);
        mapCtx.lineTo(p,size);
        mapCtx.stroke();

        mapCtx.beginPath();
        mapCtx.moveTo(0,p);
        mapCtx.lineTo(size,p);
        mapCtx.stroke();
    }


    /* PLAYER */

    const x=
        player.x/WORLD_SIZE*size;

    const y=
        player.y/WORLD_SIZE*size;


    mapCtx.fillStyle="#63ff78";
    mapCtx.shadowColor="#63ff78";
    mapCtx.shadowBlur=10;

    mapCtx.beginPath();

    mapCtx.arc(
        x,
        y,
        6,
        0,
        Math.PI*2
    );

    mapCtx.fill();

    mapCtx.shadowBlur=0;


    /* VIEW AREA */

    const viewW=
        width/WORLD_SIZE*size*2;

    const viewH=
        height/WORLD_SIZE*size*2;

    mapCtx.strokeStyle=
        "rgba(255,255,255,.18)";

    mapCtx.strokeRect(
        x-viewW/2,
        y-viewH/2,
        viewW,
        viewH
    );


    /* BORDER */

    mapCtx.strokeStyle="#63ff78";
    mapCtx.lineWidth=2;

    mapCtx.strokeRect(
        1,
        1,
        size-2,
        size-2
    );
}


/* =====================================================
   PLAY
===================================================== */

document.getElementById("play").addEventListener(
    "click",
    startGame
);


/* =====================================================
   GAME LOOP
===================================================== */

function loop(time){

    const dt=
        Math.min(
            .033,
            (time-lastTime)/1000 || 0
        );

    lastTime=time;

    update(dt);
    draw();

    requestAnimationFrame(loop);
}

requestAnimationFrame(loop);

</script>

</body>
</html>
