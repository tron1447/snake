<!DOCTYPE html>
<html lang="et">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1,
maximum-scale=1,
user-scalable=no">

<title>Snake Arena</title>

<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#020503;
font-family:Arial,sans-serif;
color:white;
touch-action:none;
}

canvas{
position:fixed;
inset:0;
width:100%;
height:100%;
}

.screen{
position:fixed;
inset:0;
z-index:100;
display:flex;
align-items:center;
justify-content:center;
background:
radial-gradient(
circle at center,
#174f27,
#020503 70%
);
}

.card{
width:min(94vw,480px);
padding:30px;
border-radius:28px;

background:
rgba(3,13,6,.97);

border:
1px solid rgba(93,255,130,.7);

box-shadow:
0 0 100px rgba(50,255,100,.2);

text-align:center;
}

.logo{
font-size:75px;
filter:drop-shadow(
0 0 20px #55ff77
);
animation:float 2s infinite ease-in-out;
}

@keyframes float{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(-9px);
}

}

h1{
margin:5px 0 20px;
color:#63ff89;
font-size:36px;
}

input,select{

width:100%;
padding:15px;
margin:6px 0;

border-radius:13px;

border:
1px solid #285832;

background:#071008;

color:white;

font-size:17px;

text-align:center;
}

button{

width:100%;
padding:15px;

margin-top:8px;

border:0;

border-radius:13px;

font-size:17px;

font-weight:bold;

cursor:pointer;
}

.green{
background:#52ff7a;
color:#031008;
}

.blue{
background:#3f91ff;
color:white;
}

.purple{
background:#a74fff;
color:white;
}

.red{
background:#3b1519;
color:#ff9ca3;
}

#skinPreview{

display:flex;
justify-content:center;
flex-wrap:wrap;

gap:9px;

margin:12px;
}

.skin{

width:38px;
height:38px;

border-radius:50%;

border:
3px solid transparent;

cursor:pointer;

transition:.15s;
}

.skin:hover{
transform:scale(1.15);
}

.skin.selected{

border-color:white;

box-shadow:
0 0 18px currentColor;

transform:scale(1.2);
}

#lobby{
display:none;
}

.roomCode{

font-size:52px;

letter-spacing:9px;

color:#5eff88;

text-shadow:
0 0 20px #5eff88;

margin:12px;
}

.player{

display:flex;

align-items:center;

padding:10px;

margin:5px;

border-radius:11px;

background:#0a1c0e;
}

.dot{

width:16px;
height:16px;

border-radius:50%;

margin-right:10px;
}

.host{
margin-left:auto;
}

#status{
margin-top:12px;
color:#91a696;
}

#hud{

position:fixed;

top:12px;

left:50%;

transform:translateX(-50%);

z-index:20;

display:flex;

gap:7px;

pointer-events:none;
}

.stat{

padding:8px 13px;

border-radius:12px;

background:
rgba(2,14,6,.9);

border:
1px solid rgba(100,255,140,.3);

text-align:center;
}

.stat small{

display:block;

font-size:9px;

color:#9cac9f;
}

.stat b{
font-size:18px;
}

#leaderboard{

position:fixed;

top:12px;

right:12px;

z-index:20;

width:190px;

padding:12px;

border-radius:16px;

background:
rgba(2,14,6,.9);

border:
1px solid rgba(100,255,140,.3);
}

#leaderboard h3{

margin:0 0 7px;

color:#65ff8b;
}

.rank{

display:flex;

justify-content:space-between;

padding:3px;

font-size:12px;
}

#boost{

position:fixed;

right:25px;

bottom:25px;

z-index:30;

width:105px;

height:105px;

border-radius:50%;

background:
radial-gradient(
circle,
#61c5ff,
#07519c
);

border:
2px solid #a6e1ff;

color:white;

font-size:28px;

box-shadow:
0 0 35px
rgba(50,160,255,.55);
}

#boost span{

display:block;

font-size:9px;
}

#joystick{

position:fixed;

left:25px;

bottom:25px;

z-index:30;

width:150px;

height:150px;

border-radius:50%;

background:
rgba(70,255,120,.07);

border:
2px solid rgba(100,255,140,.3);
}

#stick{

position:absolute;

left:42px;

top:42px;

width:64px;

height:64px;

border-radius:50%;

background:
rgba(80,255,130,.5);

border:
2px solid #9bffae;
}

#dead{

display:none;

position:fixed;

inset:0;

z-index:200;

align-items:center;

justify-content:center;

background:
rgba(0,0,0,.65);
}

.deadCard{

padding:30px;

border-radius:25px;

background:#09150c;

border:
1px solid #4cff78;

text-align:center;
}

#toast{

position:fixed;

left:50%;

top:18%;

transform:
translate(-50%,-50%)
scale(.8);

z-index:300;

padding:13px 22px;

border-radius:30px;

background:
rgba(5,20,9,.95);

border:
1px solid #5eff88;

opacity:0;

pointer-events:none;

transition:.25s;
}

#toast.show{

opacity:1;

transform:
translate(-50%,-50%)
scale(1);
}

@media(max-width:700px){

#leaderboard{
width:145px;
}

#powers{
display:none;
}

}

@media(min-width:701px){

#joystick{
display:none;
}

}

</style>

</head>

<body>

<canvas id="game"></canvas>

<div id="toast"></div>

<div id="menu" class="screen">

<div class="card">

<div class="logo">🐍</div>

<h1>SNAKE ARENA</h1>

<input
id="name"
maxlength="16"
placeholder="Sinu nimi">

<select id="mode">

<option value="classic">
🍎 Classic
</option>

<option value="battle">
⚔️ Battle
</option>

<option value="power">
⚡ Power Arena
</option>

</select>

<h3>🎨 VALI SKIN</h3>

<div id="skinPreview"></div>

<button
class="green"
onclick="createRoom()">

🟢 LOO ROOM

</button>

<input
id="room"
maxlength="6"
placeholder="ROOM CODE">

<button
class="blue"
onclick="joinRoom()">

🔵 LIITU ROOMI

</button>

<div id="status">
🔄 Ühendan serveriga...
</div>

</div>

</div>

<div id="lobby" class="screen">

<div class="card">

<h1>🐍 LOBBY</h1>

<p>Jaga seda koodi oma sõpradega:</p>

<div id="roomCode"
class="roomCode">
------
</div>

<button
class="purple"
onclick="copyRoom()">

📋 KOPI ROOM CODE

</button>

<h3>👥 MÄNGIJAD</h3>

<div id="players"></div>

<p id="waiting">
⏳ Ootame mängijaid...
</p>

<button
id="start"
class="green"
onclick="startGame()">

🚀 ALUSTA MÄNGU

</button>

<button
class="red"
onclick="location.reload()">

← LAHKU ROOMIST

</button>

</div>

</div>

<div id="hud">

<div class="stat">

<small>SCORE</small>

<b id="score">
0
</b>

</div>

<div class="stat">

<small>LENGTH</small>

<b id="length">
65
</b>

</div>

<div class="stat">

<small>RANK</small>

<b id="rank">
-
</b>

</div>

</div>

<div id="leaderboard">

<h3>🏆 TOP 8</h3>

<div id="board"></div>

</div>

<button id="boost">

⚡

<span>
BOOST
</span>

</button>

<div id="joystick">

<div id="stick"></div>

</div>

<div id="dead">

<div class="deadCard">

<h1>💥</h1>

<h2>SAID PIHTA!</h2>

<p>
Respawn kohe...
</p>

</div>

</div>

<script>

const SERVER =
"wss://snake-riu3.onrender.com";

const SKINS=[
"#55ff72",
"#42a5ff",
"#ff45d4",
"#ffe033",
"#ff713d",
"#a855ff",
"#00eaff",
"#ff4268",
"#ffffff",
"#9dff32",
"#ff9f1c",
"#00ffc8"
];

let selectedSkin=
Number(
localStorage.getItem("snakeSkin")||0
);

let ws;
let myId=null;
let roomCode=null;
let host=false;
let started=false;

let state={
world:12000,
players:{},
food:[],
powers:[]
};

let camera={
x:6000,
y:6000
};

let mouse={
x:innerWidth/2,
y:innerHeight/2
};

let audio=null;

function sound(type){

try{

if(!audio){
audio=
new (window.AudioContext||
window.webkitAudioContext)();
}

const osc=
audio.createOscillator();

const gain=
audio.createGain();

osc.connect(gain);
gain.connect(audio.destination);

let freq=400;

if(type==="eat")freq=650;
if(type==="power")freq=900;
if(type==="boost")freq=180;
if(type==="death")freq=90;
if(type==="start")freq=520;

osc.frequency.value=freq;

gain.gain.setValueAtTime(
.0001,
audio.currentTime
);

gain.gain.exponentialRampToValueAtTime(
.06,
audio.currentTime+.02
);

gain.gain.exponentialRampToValueAtTime(
.0001,
audio.currentTime+.12
);

osc.start();

osc.stop(
audio.currentTime+.13
);

}catch{}

}

function toast(text){

const t=
document.getElementById("toast");

t.textContent=text;

t.classList.add("show");

setTimeout(()=>{
t.classList.remove("show");
},1600);

}

function renderSkins(){

const box=
document.getElementById(
"skinPreview"
);

box.innerHTML="";

SKINS.forEach((color,i)=>{

const el=
document.createElement("div");

el.className="skin";

el.style.background=color;

if(i===selectedSkin){
el.classList.add("selected");
}

el.onclick=()=>{

selectedSkin=i;

localStorage.setItem(
"snakeSkin",
i
);

renderSkins();

sound("power");

};

box.appendChild(el);

});

}

renderSkins();

function send(data){

if(
ws &&
ws.readyState===WebSocket.OPEN
){

ws.send(
JSON.stringify(data)
);

}

}

function connect(){

ws=
new WebSocket(SERVER);

ws.onopen=()=>{

document.getElementById(
"status"
).textContent=
"🟢 SERVER ÜHENDATUD";

};

ws.onmessage=e=>{

let data;

try{
data=JSON.parse(e.data);
}catch{
return;
}

if(data.type==="connected"){
myId=data.id;
}

if(data.type==="roomCreated"){

roomCode=data.room;
host=true;

showLobby();

toast("Room loodud! 🐍");

}

if(data.type==="roomJoined"){

roomCode=data.room;
host=false;

showLobby();

toast("Liitusid roomiga!");

}

if(data.type==="lobby"){

roomCode=data.room;

host=
data.host===myId;

updateLobby(data);

}

if(data.type==="gameStarted"){

started=true;

document.getElementById(
"lobby"
).style.display="none";

sound("start");

toast("🚀 MÄNG ALGAS!");

}

if(data.type==="state"){

state=data.state;

if(state.started){
started=true;
}

updateUI();

}

if(data.type==="error"){

toast("❌ "+data.message);

}

};

ws.onclose=()=>{

document.getElementById(
"status"
).textContent=
"🔴 SERVERIGA POLE ÜHENDUST";

};

}

connect();

function createRoom(){

const name=
document.getElementById(
"name"
).value.trim();

if(!name){

toast("Kirjuta nimi!");

return;
}

send({

type:"createRoom",

name,

skin:selectedSkin,

mode:
document.getElementById(
"mode"
).value

});

}

function joinRoom(){

const name=
document.getElementById(
"name"
).value.trim();

const code=
document.getElementById(
"room"
).value
.trim()
.toUpperCase();

if(!name){

toast("Kirjuta nimi!");

return;
}

if(code.length!==6){

toast("Room code peab olema 6 märki!");

return;
}

send({

type:"joinRoom",

name,

room:code,

skin:selectedSkin

});

}

function showLobby(){

document.getElementById(
"menu"
).style.display="none";

document.getElementById(
"lobby"
).style.display="flex";

document.getElementById(
"roomCode"
).textContent=roomCode;

}

function updateLobby(data){

const box=
document.getElementById(
"players"
);

box.innerHTML="";

data.players.forEach(p=>{

const row=
document.createElement("div");

row.className="player";

const dot=
document.createElement("span");

dot.className="dot";

dot.style.background=p.skin;

const name=
document.createElement("span");

name.textContent=p.name;

row.appendChild(dot);
row.appendChild(name);

if(p.id===data.host){

const crown=
document.createElement("span");

crown.className="host";

crown.textContent="👑";

row.appendChild(crown);

}

box.appendChild(row);

});

const start=
document.getElementById("start");

start.style.display=
host?"block":"none";

document.getElementById(
"waiting"
).textContent=
host
?"👑 Sina oled host — vajuta START!"
:"⏳ Ootame hosti...";

}

function startGame(){

if(!host){

toast(
"❌ Ainult host saab alustada!"
);

return;
}

send({
type:"startGame"
});

}

function copyRoom(){

navigator.clipboard
.writeText(roomCode)
.then(()=>{

toast(
"📋 Room code kopeeritud!"
);

});

}

function aim(angle){

send({
type:"aim",
angle
});

}

setInterval(()=>{

if(!started)return;

const angle=
Math.atan2(
mouse.y-innerHeight/2,
mouse.x-innerWidth/2
);

aim(angle);

},50);

addEventListener(
"mousemove",
e=>{

mouse.x=e.clientX;
mouse.y=e.clientY;

});

let boosting=false;

function setBoost(v){

if(boosting===v)return;

boosting=v;

send({
type:"boost",
active:v
});

if(v){
sound("boost");
}

}

addEventListener(
"keydown",
e=>{

if(
e.code==="ShiftLeft"||
e.code==="ShiftRight"||
e.code==="Space"
){

e.preventDefault();

setBoost(true);

}

});

addEventListener(
"keyup",
e=>{

if(
e.code==="ShiftLeft"||
e.code==="ShiftRight"||
e.code==="Space"
){

e.preventDefault();

setBoost(false);

}

});

const boost=
document.getElementById(
"boost"
);

boost.addEventListener(
"touchstart",
e=>{

e.preventDefault();

setBoost(true);

},
{passive:false}
);

boost.addEventListener(
"touchend",
e=>{

e.preventDefault();

setBoost(false);

},
{passive:false}
);

const joystick=
document.getElementById(
"joystick"
);

const stick=
document.getElementById(
"stick"
);

let joystickActive=false;

function joystickMove(x,y){

const r=
joystick.getBoundingClientRect();

const cx=
r.left+r.width/2;

const cy=
r.top+r.height/2;

let dx=x-cx;
let dy=y-cy;

const max=52;

const len=
Math.hypot(dx,dy);

if(len>max){

dx=dx/len*max;
dy=dy/len*max;

}

stick.style.left=
42+dx+"px";

stick.style.top=
42+dy+"px";

aim(
Math.atan2(dy,dx)
);

}

joystick.addEventListener(
"touchstart",
e=>{

joystickActive=true;

const t=e.touches[0];

joystickMove(
t.clientX,
t.clientY
);

},
{passive:false}
);

joystick.addEventListener(
"touchmove",
e=>{

if(!joystickActive)return;

e.preventDefault();

const t=e.touches[0];

joystickMove(
t.clientX,
t.clientY
);

},
{passive:false}
);

joystick.addEventListener(
"touchend",
()=>{

joystickActive=false;

stick.style.left="42px";
stick.style.top="42px";

},
{passive:false}
);

function updateCamera(){

const me=
state.players[myId];

if(!me)return;

camera.x+=
(me.x-camera.x)*.12;

camera.y+=
(me.y-camera.y)*.12;

}

function updateUI(){

const me=
state.players[myId];

if(!me)return;

document.getElementById(
"score"
).textContent=
Math.floor(me.score);

document.getElementById(
"length"
).textContent=
Math.floor(me.length);

document.getElementById(
"dead"
).style.display=
me.alive
?"none"
:"flex";

const players=
Object.values(
state.players
)
.sort(
(a,b)=>b.score-a.score
);

const rank=
players.findIndex(
p=>p.id===myId
)+1;

document.getElementById(
"rank"
).textContent=
rank;

const board=
document.getElementById(
"board"
);

board.innerHTML="";

players
.slice(0,8)
.forEach((p,i)=>{

const row=
document.createElement("div");

row.className="rank";

row.innerHTML=
`
<span>
${i+1}. ${safe(p.name)}
</span>
<b>
${Math.floor(p.score)}
</b>
`;

board.appendChild(row);

});

}

function safe(s){

return String(s)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;");

}

const canvas=
document.getElementById("game");

const ctx=
canvas.getContext("2d");

function resize(){

canvas.width=
innerWidth*devicePixelRatio;

canvas.height=
innerHeight*devicePixelRatio;

ctx.setTransform(
devicePixelRatio,
0,
0,
devicePixelRatio,
0,
0
);

}

addEventListener(
"resize",
resize
);

resize();

function draw(){

requestAnimationFrame(draw);

ctx.clearRect(
0,
0,
innerWidth,
innerHeight
);

if(!started)return;

updateCamera();

const zoom=1.38;

ctx.save();

ctx.translate(
innerWidth/2,
innerHeight/2
);

ctx.scale(
zoom,
zoom
);

ctx.translate(
-camera.x,
-camera.y
);

/* BACKGROUND */

ctx.fillStyle="#06180a";

ctx.fillRect(
0,
0,
state.world,
state.world
);

/* GRID */

const grid=150;

ctx.strokeStyle=
"rgba(100,255,130,.035)";

ctx.lineWidth=2;

const left=
camera.x-
innerWidth/(2*zoom);

const right=
camera.x+
innerWidth/(2*zoom);

const top=
camera.y-
innerHeight/(2*zoom);

const bottom=
camera.y+
innerHeight/(2*zoom);

for(
let x=Math.floor(left/grid)*grid;
x<right;
x+=grid
){

ctx.beginPath();

ctx.moveTo(x,top);
ctx.lineTo(x,bottom);

ctx.stroke();

}

for(
let y=Math.floor(top/grid)*grid;
y<bottom;
y+=grid
){

ctx.beginPath();

ctx.moveTo(left,y);
ctx.lineTo(right,y);

ctx.stroke();

}

/* BORDER */

ctx.strokeStyle="#52ff79";

ctx.lineWidth=30;

ctx.strokeRect(
0,
0,
state.world,
state.world
);

/* FOOD */

for(const f of state.food){

if(
f.x<left-60||
f.x>right+60||
f.y<top-60||
f.y>bottom+60
)continue;

let color="#ff5b78";

if(f.type==="gold")
color="#ffe84d";

if(f.type==="purple")
color="#c45cff";

if(f.type==="boost")
color="#4dbaff";

if(f.type==="death")
color="#ff7548";

const pulse=
Math.sin(
Date.now()/180+
f.pulse
)*1.5;

ctx.fillStyle=color;

ctx.shadowColor=color;

ctx.shadowBlur=16;

ctx.beginPath();

ctx.arc(
f.x,
f.y,
f.size+pulse,
0,
Math.PI*2
);

ctx.fill();

}

ctx.shadowBlur=0;

/* POWERUPS */

for(const p of state.powers){

if(
p.x<left-70||
p.x>right+70||
p.y<top-70||
p.y>bottom+70
)continue;

let color="#fff";
let icon="";

if(p.type==="speed"){
color="#43b8ff";
icon="⚡";
}

if(p.type==="magnet"){
color="#ff42db";
icon="🧲";
}

if(p.type==="shield"){
color="#6d8cff";
icon="🛡️";
}

if(p.type==="double"){
color="#ffd83d";
icon="×2";
}

const pulse=
Math.sin(Date.now()/180)*4;

ctx.fillStyle=color;

ctx.shadowColor=color;

ctx.shadowBlur=28;

ctx.beginPath();

ctx.arc(
p.x,
p.y,
24+pulse,
0,
Math.PI*2
);

ctx.fill();

ctx.shadowBlur=0;

ctx.font="bold 20px Arial";

ctx.textAlign="center";

ctx.textBaseline="middle";

ctx.fillStyle="white";

ctx.fillText(
icon,
p.x,
p.y
);

}

/* SNAKES */

for(
const p of Object.values(
state.players
)){

if(!p.snake.length)continue;

for(
let i=p.snake.length-1;
i>=0;
i--
){

const part=p.snake[i];

const t=
i/p.snake.length;

const radius=
Math.max(
6,
15-t*8
);

ctx.fillStyle=p.skin;

ctx.shadowColor=p.skin;

ctx.shadowBlur=
p.id===myId
?20
:8;

ctx.beginPath();

ctx.arc(
part.x,
part.y,
radius,
0,
Math.PI*2
);

ctx.fill();

}

ctx.shadowBlur=0;

if(!p.alive)continue;

/* HEAD */

ctx.fillStyle=p.skin;

ctx.beginPath();

ctx.arc(
p.x,
p.y,
18,
0,
Math.PI*2
);

ctx.fill();

/* EYES */

const ex=
Math.cos(p.angle);

const ey=
Math.sin(p.angle);

const sx=
-Math.sin(p.angle);

const sy=
Math.cos(p.angle);

ctx.fillStyle="#061008";

ctx.beginPath();

ctx.arc(
p.x+ex*9+sx*5,
p.y+ey*9+sy*5,
4,
0,
Math.PI*2
);

ctx.fill();

ctx.beginPath();

ctx.arc(
p.x+ex*9-sx*5,
p.y+ey*9-sy*5,
4,
0,
Math.PI*2
);

ctx.fill();

/* SHIELD */

if(p.shield>0){

ctx.strokeStyle="#65aaff";

ctx.lineWidth=4;

ctx.beginPath();

ctx.arc(
p.x,
p.y,
29+
Math.sin(Date.now()/120)*2,
0,
Math.PI*2
);

ctx.stroke();

}

/* NAME */

ctx.font=
"bold 14px Arial";

ctx.textAlign="center";

ctx.fillStyle="white";

ctx.fillText(
p.name,
p.x,
p.y-32
);

}

ctx.restore();

}

draw();

</script>

</body>
</html>
