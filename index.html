<script>
"use strict";

/* =========================
   CANVAS
========================= */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const minimap=document.getElementById("minimap");
const mapCtx=minimap.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){
    W=innerWidth;
    H=innerHeight;
    canvas.width=W;
    canvas.height=H;
}

addEventListener("resize",resize);
resize();

/* =========================
   WORLD
========================= */

const WORLD=20000;

/* =========================
   FOOD
========================= */

const foods=[];
const FOOD_COUNT=700;

const foodColors=[
    "#63ff78",
    "#ffd84d",
    "#ff6075",
    "#55c9ff",
    "#c76cff",
    "#ff963d"
];

function makeFood(){
    return {
        x:Math.random()*WORLD,
        y:Math.random()*WORLD,
        radius:3+Math.random()*4,
        color:foodColors[Math.floor(Math.random()*foodColors.length)],
        value:1+Math.floor(Math.random()*4)
    };
}

for(let i=0;i<FOOD_COUNT;i++){
    foods.push(makeFood());
}

/* =========================
   PLAYER
========================= */

const me={
    id:null,
    x:10000,
    y:10000,
    angle:0,
    targetAngle:0,
    length:20,
    color:"#63ff78",
    skin:"green",
    name:"Player"
};

let body=[];
let others={};
let score=0;
let running=false;
let dead=false;
let boosting=false;

/* =========================
   SKINS
========================= */

document.querySelectorAll(".skin").forEach(btn=>{
    btn.addEventListener("click",()=>{
        document.querySelectorAll(".skin").forEach(b=>b.classList.remove("selected"));
        btn.classList.add("selected");
        me.color=btn.dataset.color;
        me.skin=btn.dataset.skin;
    });
});

function playerName(){
    return (document.getElementById("name").value.trim()||"Player").substring(0,16);
}

/* =========================
   WEBSOCKET
========================= */

let socket=null;
let connected=false;

function connect(){

    const protocol=location.protocol==="https:" ? "wss:" : "ws:";

    socket=new WebSocket(protocol+"//"+location.host);

    setConnection("🟡 Ühendamine...");

    socket.onopen=()=>{
        connected=true;
        setConnection("🟢 Server ühendatud");
    };

    socket.onclose=()=>{
        connected=false;
        setConnection("🔴 Ühendus katkes");
    };

    socket.onerror=()=>{
        setConnection("🔴 Serveri viga");
    };

    socket.onmessage=e=>{
        try{
            serverMessage(JSON.parse(e.data));
        }catch(err){
            console.error(err);
        }
    };
}

function send(data){
    if(!socket || socket.readyState!==WebSocket.OPEN){
        return false;
    }

    socket.send(JSON.stringify(data));
    return true;
}

/* =========================
   SERVER
========================= */

function serverMessage(data){

    if(data.type==="roomCreated"){
        me.id=data.id||me.id;
        showRoom(data.code);
        return;
    }

    if(data.type==="roomJoined"){
        me.id=data.id||me.id;
        showRoom(data.code);
        return;
    }

    if(data.type==="lobby"){
        updateLobby(data.players||[]);
        return;
    }

    if(data.type==="gameStart"){
        me.id=data.id||me.id;
        startGame();
        return;
    }

    if(data.type==="players"){
        others=data.players||{};
        updatePlayerCount();
        return;
    }

    if(data.type==="gameOver"){
        die(data.reason||"Sind tapeti!");
        return;
    }

    if(data.type==="playerKilled"){
        if(data.id!==me.id){
            showKill();
        }
        return;
    }

    if(data.type==="error"){
        showError(data.message||"Viga");
    }
}

/* =========================
   UI
========================= */

function showRoom(code){
    document.getElementById("roomBox").style.display="block";
    document.getElementById("roomCode").textContent=code;
}

function updateLobby(players){

    const box=document.getElementById("players");
    box.innerHTML="";

    players.forEach(p=>{
        const row=document.createElement("div");
        row.className="playerRow";
        row.textContent=(p.host?"👑 ":"🐍 ")+(p.name||"Player");
        row.style.color=p.color||"#fff";
        box.appendChild(row);
    });

    if(players.length){
        document.getElementById("startBtn").style.display="block";
    }
}

function updatePlayerCount(){
    document.getElementById("playerCount").textContent=
        Math.max(1,Object.keys(others).length);
}

function showError(text){
    document.getElementById("error").textContent=text||"";
}

function setConnection(text){
    document.getElementById("connection").textContent=text;
}

/* =========================
   ROOM
========================= */

document.getElementById("createBtn").onclick=()=>{

    showError("");

    if(!connected){
        showError("Serveriga ei ole ühendust.");
        return;
    }

    send({
        type:"createRoom",
        name:playerName(),
        color:me.color,
        skin:me.skin
    });
};

document.getElementById("joinBtn").onclick=()=>{

    showError("");

    const code=document.getElementById("roomInput").value.trim().toUpperCase();

    if(code.length!==6){
        showError("Room code peab olema 6 märki.");
        return;
    }

    if(!connected){
        showError("Serveriga ei ole ühendust.");
        return;
    }

    send({
        type:"joinRoom",
        code,
        name:playerName(),
        color:me.color,
        skin:me.skin
    });
};

document.getElementById("startBtn").onclick=()=>{
    send({type:"startGame"});
};

/* =========================
   KEYBOARD
========================= */

const keys={};

addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()]=true;

    if(e.key==="Shift"){
        boosting=true;
    }
});

addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;

    if(e.key==="Shift"){
        boosting=false;
    }
});

function keyboardDirection(){

    let dx=0;
    let dy=0;

    if(keys.w||keys.arrowup)dy--;
    if(keys.s||keys.arrowdown)dy++;
    if(keys.a||keys.arrowleft)dx--;
    if(keys.d||keys.arrowright)dx++;

    if(dx||dy){
        me.targetAngle=Math.atan2(dy,dx);
    }
}

/* =========================
   MOUSE
========================= */

addEventListener("mousemove",e=>{

    if(!running || innerWidth<=800)return;

    const dx=e.clientX-W/2;
    const dy=e.clientY-H/2;

    if(Math.hypot(dx,dy)>15){
        me.targetAngle=Math.atan2(dy,dx);
    }
});

/* =========================
   MOBILE
========================= */

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joyId=null;

function moveJoystick(x,y){

    const r=joystick.getBoundingClientRect();

    const cx=r.left+r.width/2;
    const cy=r.top+r.height/2;

    let dx=x-cx;
    let dy=y-cy;

    const max=55;
    const distance=Math.hypot(dx,dy);

    if(distance>max){
        dx=dx/distance*max;
        dy=dy/distance*max;
    }

    stick.style.left=`calc(50% + ${dx}px)`;
    stick.style.top=`calc(50% + ${dy}px)`;

    if(distance>7){
        me.targetAngle=Math.atan2(dy,dx);
    }
}

function resetJoystick(){
    joyId=null;
    stick.style.left="50%";
    stick.style.top="50%";
}

joystick.addEventListener("pointerdown",e=>{
    joyId=e.pointerId;
    joystick.setPointerCapture(e.pointerId);
    moveJoystick(e.clientX,e.clientY);
});

joystick.addEventListener("pointermove",e=>{
    if(e.pointerId===joyId){
        moveJoystick(e.clientX,e.clientY);
    }
});

joystick.addEventListener("pointerup",resetJoystick);
joystick.addEventListener("pointercancel",resetJoystick);

const boost=document.getElementById("boost");

boost.addEventListener("pointerdown",()=>{
    boosting=true;
});

boost.addEventListener("pointerup",()=>{
    boosting=false;
});

boost.addEventListener("pointercancel",()=>{
    boosting=false;
});

/* =========================
   START GAME
========================= */

function startGame(){

    running=true;
    dead=false;
    score=0;

    document.getElementById("menu").style.display="none";
    document.getElementById("hud").style.display="flex";
    document.getElementById("minimap").style.display="block";

    me.x=3000+Math.random()*14000;
    me.y=3000+Math.random()*14000;
    me.angle=Math.random()*Math.PI*2;
    me.targetAngle=me.angle;

    body=[];

    for(let i=0;i<Math.floor(me.length);i++){
        body.push({
            x:me.x-Math.cos(me.angle)*i*8,
            y:me.y-Math.sin(me.angle)*i*8
        });
    }
}

/* =========================
   UPDATE
========================= */

let lastSend=0;

function update(){

    if(!running||dead)return;

    keyboardDirection();

    let difference=me.targetAngle-me.angle;

    while(difference>Math.PI)difference-=Math.PI*2;
    while(difference<-Math.PI)difference+=Math.PI*2;

    me.angle+=difference*.14;

    const speed=boosting&&me.length>25?8:4.7;

    me.x+=Math.cos(me.angle)*speed;
    me.y+=Math.sin(me.angle)*speed;

    me.x=Math.max(25,Math.min(WORLD-25,me.x));
    me.y=Math.max(25,Math.min(WORLD-25,me.y));

    body.unshift({x:me.x,y:me.y});

    while(body.length>Math.floor(me.length)){
        body.pop();
    }

    while(body.length<Math.floor(me.length)){
        body.push({x:me.x,y:me.y});
    }

    eatFood();

    if(boosting&&me.length>25){
        me.length-=.025;
    }

    checkCombat();

    const now=performance.now();

    if(now-lastSend>50){
        lastSend=now;

        send({
            type:"state",
            x:me.x,
            y:me.y,
            angle:me.angle,
            length:me.length,
            color:me.color,
            skin:me.skin,
            name:playerName()
        });
    }

    document.getElementById("score").textContent=Math.floor(score);
    document.getElementById("length").textContent=Math.floor(me.length);
}

/* =========================
   FOOD
========================= */

function eatFood(){

    for(let i=foods.length-1;i>=0;i--){

        const f=foods[i];

        if(Math.hypot(f.x-me.x,f.y-me.y)<25+f.radius){

            score+=f.value;
            me.length+=f.value*.5;
            foods[i]=makeFood();
        }
    }
}

/* =========================
   COMBAT
========================= */

let lastCombat=0;

function checkCombat(){

    const now=performance.now();

    if(now-lastCombat<100)return;

    lastCombat=now;

    for(const id in others){

        if(id===me.id)continue;

        const p=others[id];

        if(!p)continue;

        const distance=Math.hypot(
            p.x-me.x,
            p.y-me.y
        );

        if(distance<45){

            const otherLength=Math.max(20,Number(p.length)||20);

            if(me.length>otherLength*1.08){

                score+=50;
                me.length+=Math.min(30,otherLength*.25);

                showKill();

                send({
                    type:"attack",
                    target:id
                });
            }
        }
    }
}

/* =========================
   CAMERA
========================= */

let cameraX=me.x;
let cameraY=me.y;

function updateCamera(){

    cameraX+=(me.x-cameraX)*.12;
    cameraY+=(me.y-cameraY)*.12;
}

/* =========================
   DRAW
========================= */

function draw(){

    ctx.fillStyle="#071008";
    ctx.fillRect(0,0,W,H);

    if(!running)return;

    updateCamera();

    ctx.save();

    ctx.translate(
        W/2-cameraX,
        H/2-cameraY
    );

    drawGrid();
    drawBorder();
    drawFood();
    drawOthers();
    drawMe();

    ctx.restore();

    drawMinimap();
}

function drawGrid(){

    const grid=250;

    const left=cameraX-W/2-500;
    const right=cameraX+W/2+500;
    const top=cameraY-H/2-500;
    const bottom=cameraY+H/2+500;

    ctx.strokeStyle="rgba(99,255,120,.045)";
    ctx.lineWidth=1;

    for(let x=Math.floor(left/grid)*grid;x<right;x+=grid){
        ctx.beginPath();
        ctx.moveTo(x,top);
        ctx.lineTo(x,bottom);
        ctx.stroke();
    }

    for(let y=Math.floor(top/grid)*grid;y<bottom;y+=grid){
        ctx.beginPath();
        ctx.moveTo(left,y);
        ctx.lineTo(right,y);
        ctx.stroke();
    }
}

function drawBorder(){

    ctx.strokeStyle="#63ff78";
    ctx.lineWidth=18;
    ctx.shadowColor="#63ff78";
    ctx.shadowBlur=20;

    ctx.strokeRect(0,0,WORLD,WORLD);

    ctx.shadowBlur=0;
}

function drawFood(){

    for(const f of foods){

        if(Math.abs(f.x-cameraX)>W||Math.abs(f.y-cameraY)>H)continue;

        ctx.fillStyle=f.color;
        ctx.shadowColor=f.color;
        ctx.shadowBlur=10;

        ctx.beginPath();
        ctx.arc(f.x,f.y,f.radius,0,Math.PI*2);
        ctx.fill();
    }

    ctx.shadowBlur=0;
}

/* =========================
   SKIN
========================= */

function drawSkinHead(x,y,r,color,skin){

    ctx.save();
    ctx.translate(x,y);

    ctx.fillStyle=color;
    ctx.shadowColor=color;
    ctx.shadowBlur=18;

    ctx.beginPath();
    ctx.arc(0,0,r,0,Math.PI*2);
    ctx.fill();

    ctx.shadowBlur=0;

    if(skin==="blue"){
        ctx.strokeStyle="#d5f3ff";
        ctx.lineWidth=4;
        ctx.stroke();
    }

    if(skin==="red"){
        ctx.strokeStyle="#ffb5c0";
        ctx.lineWidth=3;
        ctx.beginPath();
        ctx.moveTo(-r*.65,-r*.55);
        ctx.lineTo(r*.65,r*.55);
        ctx.moveTo(r*.65,-r*.55);
        ctx.lineTo(-r*.65,r*.55);
        ctx.stroke();
    }

    if(skin==="yellow"){
        ctx.fillStyle="#fff2a0";
        ctx.beginPath();
        ctx.arc(0,0,r*.35,0,Math.PI*2);
        ctx.fill();
    }

    if(skin==="purple"){
        ctx.fillStyle="#f0c9ff";

        for(let i=0;i<6;i++){
            const a=i*Math.PI/3;
            ctx.beginPath();
            ctx.arc(
                Math.cos(a)*r*.55,
                Math.sin(a)*r*.55,
                4,
                0,
                Math.PI*2
            );
            ctx.fill();
        }
    }

    if(skin==="orange"){
        ctx.strokeStyle="#ffe2c5";
        ctx.lineWidth=4;

        for(let i=-1;i<=1;i++){
            ctx.beginPath();
            ctx.moveTo(-r*.7,i*r*.45);
            ctx.lineTo(r*.7,i*r*.45);
            ctx.stroke();
        }
    }

    if(skin==="cyan"){
        ctx.strokeStyle="#d0fffa";
        ctx.lineWidth=4;
        ctx.beginPath();
        ctx.arc(0,0,r*.65,0,Math.PI*2);
        ctx.stroke();
    }

    if(skin==="white"){
        ctx.strokeStyle="#8b8b8b";
        ctx.lineWidth=2;
        ctx.stroke();
    }

    ctx.restore();
}

/* =========================
   FACE
========================= */

function drawFace(x,y,angle){

    ctx.save();

    ctx.translate(x,y);
    ctx.rotate(angle);

    ctx.fillStyle="white";

    ctx.beginPath();
    ctx.arc(9,-7,6,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(9,7,6,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#111";

    ctx.beginPath();
    ctx.arc(11,-7,3,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(11,7,3,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle="#111";
    ctx.lineWidth=2;

    ctx.beginPath();
    ctx.arc(14,0,5,-.7,.7);
    ctx.stroke();

    ctx.restore();
}

/* =========================
   MY SNAKE
========================= */

function drawMe(){

    for(let i=body.length-1;i>=0;i--){

        const p=body[i];
        const progress=i/body.length;
        const radius=8+(1-progress)*9;

        ctx.globalAlpha=1-progress*.3;
        ctx.fillStyle=me.color;

        ctx.beginPath();
        ctx.arc(p.x,p.y,radius,0,Math.PI*2);
        ctx.fill();
    }

    ctx.globalAlpha=1;

    drawSkinHead(
        me.x,
        me.y,
        21,
        me.color,
        me.skin
    );

    drawFace(
        me.x,
        me.y,
        me.angle
    );

    drawName(
        playerName(),
        me.x,
        me.y-32
    );
}

/* =========================
   OTHER SNAKES
========================= */

function drawOthers(){

    for(const id in others){

        if(id===me.id)continue;

        const p=others[id];

        if(!p)continue;

        const length=Math.min(
            180,
            Math.max(20,Math.floor(p.length||20))
        );

        for(let i=length-1;i>=0;i--){

            const x=p.x-Math.cos(p.angle)*i*8;
            const y=p.y-Math.sin(p.angle)*i*8;

            const progress=i/length;
            const radius=8+(1-progress)*8;

            ctx.globalAlpha=1-progress*.3;
            ctx.fillStyle=p.color||"#4da6ff";

            ctx.beginPath();
            ctx.arc(x,y,radius,0,Math.PI*2);
            ctx.fill();
        }

        ctx.globalAlpha=1;

        drawSkinHead(
            p.x,
            p.y,
            21,
            p.color||"#4da6ff",
            p.skin||"blue"
        );

        drawFace(
            p.x,
            p.y,
            p.angle||0
        );

        drawName(
            p.name||"Player",
            p.x,
            p.y-32
        );
    }
}

function drawName(name,x,y){

    ctx.save();

    ctx.textAlign="center";
    ctx.font="bold 12px Arial";
    ctx.fillStyle="white";
    ctx.shadowColor="black";
    ctx.shadowBlur=5;

    ctx.fillText(name,x,y);

    ctx.restore();
}

/* =========================
   MINIMAP
========================= */

function drawMinimap(){

    const size=minimap.width;

    mapCtx.clearRect(0,0,size,size);

    mapCtx.fillStyle="#061007";
    mapCtx.fillRect(0,0,size,size);

    for(const id in others){

        if(id===me.id)continue;

        const p=others[id];

        if(!p)continue;

        const x=p.x/WORLD*size;
        const y=p.y/WORLD*size;

        mapCtx.fillStyle=p.color||"#ff5268";

        mapCtx.beginPath();
        mapCtx.arc(x,y,4,0,Math.PI*2);
        mapCtx.fill();
    }

    const mx=me.x/WORLD*size;
    const my=me.y/WORLD*size;

    mapCtx.fillStyle=me.color;
    mapCtx.shadowColor=me.color;
    mapCtx.shadowBlur=10;

    mapCtx.beginPath();
    mapCtx.arc(mx,my,6,0,Math.PI*2);
    mapCtx.fill();

    mapCtx.shadowBlur=0;

    mapCtx.strokeStyle="#63ff78";
    mapCtx.lineWidth=2;
    mapCtx.strokeRect(1,1,size-2,size-2);
}

    text.classList.add("show");

    clearTimeout(killTimer);

    killTimer=setTimeout(()=>{

function die(reason){

    if(dead)return;

    dead=true;
    running=false;
    boosting=false;

    document.getElementById("deathReason").textContent=reason;
    document.getElementById("finalScore").textContent=Math.floor(score);
    document.getElementById("gameOver").style.display="flex";

function loop(){

connect();
