<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Snake Arena</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
}

html,
body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#071008;
    font-family:Arial,sans-serif;
    touch-action:none;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

#menu{
    position:fixed;
    inset:0;
    z-index:100;
    overflow:auto;
    padding:20px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
        radial-gradient(
            circle at center,
            #174d20,
            #050805 75%
        );
}

.panel{
    width:min(500px,94vw);
    max-height:95vh;
    overflow:auto;
    background:#09120a;
    border:1px solid #315d37;
    border-radius:24px;
    padding:25px;
    color:white;
    text-align:center;
}

.logo{
    font-size:65px;
}

h1{
    font-size:40px;
    color:#63ff78;
}

.sub{
    color:#819482;
    margin:5px 0 15px;
}

input{
    width:100%;
    height:48px;
    margin:5px 0;
    padding:0 15px;
    border-radius:10px;
    border:1px solid #315d37;
    background:#101b11;
    color:white;
    text-align:center;
    font-size:16px;
}

button{
    font-family:inherit;
}

.btn{
    width:100%;
    min-height:48px;
    margin-top:8px;
    border:0;
    border-radius:10px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.green{
    background:#63ff78;
    color:#061008;
}

.dark{
    background:#122015;
    color:white;
    border:1px solid #315d37;
}

#coinsMenu{
    margin:10px 0;
    padding:10px;
    border-radius:10px;
    background:#111b12;
    color:#ffd84d;
    font-weight:bold;
}

#skins{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    margin:10px;
}

.skinButton{
    width:42px;
    height:42px;
    border-radius:50%;
    border:3px solid transparent;
}

.skinButton.selected{
    border-color:white;
}

#room{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:14px;
    background:#101b11;
}

#roomCode{
    font-size:32px;
    font-weight:bold;
    color:#63ff78;
    letter-spacing:5px;
    margin:5px;
}

#error{
    min-height:24px;
    color:#ff6675;
    margin-top:8px;
}

#shop{
    display:none;
}

.shopGrid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin:15px 0;
}

.shopItem{
    background:#101b11;
    border:1px solid #29472e;
    border-radius:12px;
    padding:12px;
}

.preview{
    width:48px;
    height:48px;
    margin:auto;
    border-radius:50%;
}

.shopItem button{
    width:100%;
    margin-top:7px;
    min-height:35px;
    border:0;
    border-radius:7px;
    font-weight:bold;
}

#hud{
    display:none;
    position:fixed;
    z-index:20;
    top:10px;
    left:10px;
    gap:6px;
}

.stat{
    background:rgba(0,0,0,.8);
    border:1px solid #315d37;
    color:white;
    padding:7px 10px;
    border-radius:8px;
}

.stat small{
    display:block;
    font-size:9px;
    color:#849485;
}

#leaderboard{
    display:none;
    position:fixed;
    z-index:20;
    top:10px;
    right:10px;
    width:185px;
    padding:9px;
    background:rgba(0,0,0,.82);
    border:1px solid #315d37;
    border-radius:12px;
    color:white;
}

.lbTitle{
    color:#63ff78;
    font-weight:bold;
    margin-bottom:5px;
}

.lbRow{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    padding:4px;
}

#minimap{
    display:none;
    position:fixed;
    z-index:25;
    right:10px;
    bottom:10px;
    width:170px;
    height:170px;
    background:#102414;
    border:3px solid #63ff78;
    border-radius:15px;
}

#mini{
    width:100%;
    height:100%;
    border-radius:12px;
}

#miniLabel{
    position:absolute;
    top:5px;
    left:6px;
    background:rgba(0,0,0,.65);
    color:white;
    font-size:9px;
    padding:3px 5px;
    border-radius:5px;
}

#joystick{
    display:none;
    position:fixed;
    z-index:30;
    left:18px;
    bottom:18px;
    width:135px;
    height:135px;
    border-radius:50%;
    background:rgba(99,255,120,.08);
    border:2px solid rgba(99,255,120,.4);
}

#stick{
    position:absolute;
    left:50%;
    top:50%;
    width:55px;
    height:55px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:#63ff78;
    border:3px solid white;
}

#boost{
    display:none;
    position:fixed;
    z-index:30;
    right:170px;
    bottom:25px;
    width:75px;
    height:75px;
    border-radius:50%;
    border:3px solid #a9eaff;
    background:#087eaf;
    color:white;
    font-size:28px;
}

#killMessage{
    position:fixed;
    z-index:50;
    left:50%;
    top:25%;
    transform:translate(-50%,-50%);
    color:#63ff78;
    font-size:35px;
    font-weight:bold;
    opacity:0;
    pointer-events:none;
}

#gameOver{
    display:none;
    position:fixed;
    z-index:200;
    inset:0;
    background:rgba(0,0,0,.8);
    justify-content:center;
    align-items:center;
}

.gameOverBox{
    width:min(400px,90vw);
    background:#09120a;
    border:1px solid #315d37;
    border-radius:20px;
    padding:30px;
    color:white;
    text-align:center;
}

.gameOverBox h2{
    color:#ff6070;
    font-size:38px;
}

@media(max-width:800px){

    #menu{
        align-items:flex-start;
    }

    #joystick,
    #boost{
        display:block;
    }

    #minimap{
        width:140px;
        height:140px;
    }

    #leaderboard{
        width:145px;
    }

}

</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="menu">

<div class="panel">

Suur kaart • toit • botid • multiplayer
</div>

<input

<div id="coinsMenu">

</div>

<button

>
▶ ALUSTA

</div>

</div>

</div>

<div id="shop">

Kill = +10 coins
</p>

<div
    class="shopGrid"
    id="shopGrid"
></div>

<button
    class="btn dark"

← TAGASI

</div>

</div>
</div>

<div id="hud">

<div class="stat">
<small>SCORE</small>
<b id="score">0</b>
</div>

<div class="stat">
<small>KILLS</small>
<b id="kills">0</b>

<small>LENGTH</small>
<b id="length">25</b>
</div>

<div class="stat">
<small>COINS</small>
<b id="coins">0</b>
</div>

</div>

<div class="lbTitle">
🏆 TOP 3
</div>

<div id="lbRows"></div>

</div>

🔄 UUESTI

<script>

const WORLD = 18000;

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

const mini =
    document.getElementById("mini");

const mctx =
    mini.getContext("2d");

let W = innerWidth;
let H = innerHeight;

function resize(){

    W = innerWidth;
    H = innerHeight;

    canvas.width = W;
    canvas.height = H;

    mini.width = 400;
    mini.height = 400;
}

resize();

addEventListener(
    "resize",
    resize
);

/* =========================
   SAVE DATA
========================= */

let coins =
    Number(
        localStorage.getItem(
            "snakeCoins"
        ) || 0
    );

let owned =
    JSON.parse(
        localStorage.getItem(
            "snakeOwned"
        ) || '["green"]'
    );

let skin =
    localStorage.getItem(
        "snakeSkin"
    ) || "green";

const SKINS = [

    ["green","#63ff78",0],
    ["blue","#4da6ff",30],
    ["red","#ff5268",50],
    ["yellow","#ffd84d",80],
    ["purple","#b86cff",100],
    ["orange","#ff8a3d",120],
    ["cyan","#00e5d4",150],
    ["white","#ffffff",200]

];

function skinData(id){

    return (
        SKINS.find(
            s => s[0] === id
        ) || SKINS[0]
    );

}

function save(){

    localStorage.setItem(
        "snakeCoins",
        coins
    );

    localStorage.setItem(
        "snakeOwned",
        JSON.stringify(owned)
    );

    localStorage.setItem(
        "snakeSkin",
        skin
    );

}

/* =========================
   PLAYER
========================= */

const player = {

    name:"Player",

    x:WORLD/2,
    y:WORLD/2,

    angle:0,
    targetAngle:0,

    length:25,
    score:0,
    kills:0,

    color:skinData(skin)[1]

};

let body = [];

let running = false;
let dead = false;
let singlePlayer = false;
let boosting = false;

function resetPlayer(){

    player.x =
        WORLD/2;

    player.y =
        WORLD/2;

    player.angle=0;
    player.targetAngle=0;

    player.length=25;
    player.score=0;
    player.kills=0;

    body=[];

    for(
        let i=0;
        i<25;
        i++
    ){

        body.push({

            x:
                player.x -
                i*8,

            y:
                player.y

        });

    }

}

/* =========================
   FOOD
========================= */

const foods=[];

function createFood(){

    return {

        x:
            100 +
            Math.random() *
            (WORLD-200),

        y:
            100 +
            Math.random() *
            (WORLD-200),

        radius:
            4 +
            Math.random()*4,

        value:
            1 +
            Math.floor(
                Math.random()*4
            ),

        color:
            [
                "#63ff78",
                "#ffd84d",
                "#ff5268",
                "#4da6ff",
                "#b86cff",
                "#ff8a3d"
            ][
                Math.floor(
                    Math.random()*6
                )
            ]

    };

}

for(
    let i=0;
    i<1000;
    i++
){

    foods.push(
        createFood()
    );

}

/* =========================
   BOTS
========================= */

let bots=[];

const botNames=[
    "Viper",
    "Cobra",
    "Shadow",
    "Blaze",
    "Hunter",
    "Ghost",
    "Python",
    "Storm",
    "Ninja",
    "Venom",
    "Rex",
    "Toxic"
];

const botColors=[
    "#4da6ff",
    "#ff5268",
    "#ffd84d",
    "#b86cff",
    "#ff8a3d",
    "#00e5d4"
];

function createBot(){

    const b={

        name:
            botNames[
                Math.floor(
                    Math.random()*
                    botNames.length
                )
            ],

        x:
            500+
            Math.random()*
            (WORLD-1000),

        y:
            500+
            Math.random()*
            (WORLD-1000),

        angle:
            Math.random()*
            Math.PI*2,

        targetAngle:
            Math.random()*
            Math.PI*2,

        length:
            25+
            Math.random()*90,

        score:0,

        color:
            botColors[
                Math.floor(
                    Math.random()*
                    botColors.length
                )
            ],

        body:[],

        think:0

    };

    for(
        let i=0;
        i<b.length;
        i++
    ){

        b.body.push({

            x:
                b.x -
                Math.cos(b.angle)*
                i*8,

            y:
                b.y -
                Math.sin(b.angle)*
                i*8

        });

    }

    return b;
}

function startBots(){

    bots=[];

    for(
        let i=0;
        i<16;
        i++
    ){

        bots.push(
            createBot()
        );

    }

}

/* =========================
   START GAME
========================= */

function startGame(){

    resetPlayer();

    player.name =
        document
        .getElementById("name")
        .value
        .trim()
        .replace(/[<>]/g,"")
        .substring(0,16)
        ||
        "Player";

    running=true;
    dead=false;

    document.getElementById(
        "menu"
    ).style.display="none";

    document.getElementById(
        "hud"
    ).style.display="flex";

    document.getElementById(
        "leaderboard"
    ).style.display="block";

    document.getElementById(
        "minimap"
    ).style.display="block";

    updateHud();

}

/* =========================
   SINGLEPLAYER
========================= */

document.getElementById(
    "singleButton"
).onclick=()=>{

    singlePlayer=true;

    startBots();

    startGame();

};

/* =========================
   MOUSE
========================= */

let mouseX=W/2;
let mouseY=H/2;

addEventListener(
    "mousemove",
    e=>{

        mouseX=e.clientX;
        mouseY=e.clientY;

    }
);

function mouseControl(){

    if(innerWidth<=800)
        return;

    const dx=
        mouseX-W/2;

    const dy=
        mouseY-H/2;

    if(
        Math.hypot(dx,dy)>5
    ){

        player.targetAngle=
            Math.atan2(
                dy,
                dx
            );

    }

}

/* =========================
   JOYSTICK
========================= */

const joystick =
    document.getElementById(
        "joystick"
    );

const stick =
    document.getElementById(
        "stick"
    );

let joy=false;

function joyMove(x,y){

    const r =
        joystick.getBoundingClientRect();

    const cx =
        r.left+r.width/2;

    const cy =
        r.top+r.height/2;

    let dx=x-cx;
    let dy=y-cy;

    const max=52;

    const d=
        Math.hypot(dx,dy);

    if(d>max){

        dx=dx/d*max;
        dy=dy/d*max;

    }

    stick.style.left =
        `calc(50% + ${dx}px)`;

    stick.style.top =
        `calc(50% + ${dy}px)`;

    if(d>7){

        player.targetAngle=
            Math.atan2(
                dy,
                dx
            );

    }

}

joystick.addEventListener(
    "pointerdown",
    e=>{

        joy=true;

        joystick.setPointerCapture(
            e.pointerId
        );

        joyMove(
            e.clientX,
            e.clientY
        );

    }
);

joystick.addEventListener(
    "pointermove",
    e=>{

        if(joy){

            joyMove(
                e.clientX,
                e.clientY
            );

        }

    }
);

function stopJoy(){

    joy=false;

    stick.style.left="50%";
    stick.style.top="50%";

}

joystick.addEventListener(
    "pointerup",
    stopJoy
);

joystick.addEventListener(
    "pointercancel",
    stopJoy
);

/* =========================
   BOOST
========================= */

document.getElementById(
    "boost"
).addEventListener(
    "pointerdown",
    ()=>{
        boosting=true;
    }
);

document.getElementById(
    "boost"
).addEventListener(
    "pointerup",
    ()=>{
        boosting=false;
    }
);

addEventListener(
    "keydown",
    e=>{

        if(e.key==="Shift")
            boosting=true;

    }
);

addEventListener(
    "keyup",
    e=>{

        if(e.key==="Shift")
            boosting=false;

    }
);

/* =========================
   UPDATE PLAYER
========================= */

function updatePlayer(){

    mouseControl();

    let diff =
        player.targetAngle -
        player.angle;

    while(
        diff>Math.PI
    )
        diff-=Math.PI*2;

    while(
        diff<-Math.PI
    )
        diff+=Math.PI*2;

    player.angle +=
        diff*.18;

    const speed =
        boosting
        ? 12
        : 8;

    player.x +=
        Math.cos(
            player.angle
        )*speed;

    player.y +=
        Math.sin(
            player.angle
        )*speed;

    if(
        player.x<25 ||
        player.x>WORLD-25 ||
        player.y<25 ||
        player.y>WORLD-25
    ){

        die(
            "Läksid vastu kaardi äärt!"
        );

        return;

    }

    body.unshift({

        x:player.x,
        y:player.y

    });

    while(
        body.length<
        Math.floor(player.length)
    ){

        body.push({
            x:player.x,
            y:player.y
        });

    }

    while(
        body.length>
        Math.floor(player.length)
    ){

        body.pop();

    }

    eatFood();

    checkBots();

}

/* =========================
   FOOD COLLISION
========================= */

function eatFood(){

    for(
        let i=foods.length-1;
        i>=0;
        i--
    ){

        const f=foods[i];

        if(
            Math.hypot(
                player.x-f.x,
                player.y-f.y
            ) <
            25+f.radius
        ){

            player.score+=
                f.value;

            player.length+=
                f.value*.6;

            foods.splice(i,1);

            foods.push(
                createFood()
            );

        }

    }

}

/* =========================
   BOT UPDATE
========================= */

function updateBots(){

    for(
        const b of bots
    ){

        b.think--;

        if(b.think<=0){

            b.think=
                50+
                Math.random()*100;

            let target=null;
            let best=Infinity;

            for(
                let i=0;
                i<foods.length;
                i+=5
            ){

                const f=foods[i];

                const d=
                    Math.hypot(
                        f.x-b.x,
                        f.y-b.y
                    );

                if(d<best){

                    best=d;
                    target=f;

                }

            }

            if(target){

                b.targetAngle=
                    Math.atan2(
                        target.y-b.y,
                        target.x-b.x
                    );

            }

        }

        let diff=
            b.targetAngle-b.angle;

        while(diff>Math.PI)
            diff-=Math.PI*2;

        while(diff<-Math.PI)
            diff+=Math.PI*2;

        b.angle+=diff*.06;

        b.x+=
            Math.cos(b.angle)*5.5;

        b.y+=
            Math.sin(b.angle)*5.5;

        if(
            b.x<100 ||
            b.x>WORLD-100
        ){

            b.angle=Math.PI-b.angle;

        }

        if(
            b.y<100 ||
            b.y>WORLD-100
        ){

            b.angle=-b.angle;

        }

        b.body.unshift({

            x:b.x,
            y:b.y

        });

        while(
            b.body.length<
            Math.floor(b.length)
        ){

            b.body.push({
                x:b.x,
                y:b.y
            });

        }

        while(
            b.body.length>
            Math.floor(b.length)
        ){

            b.body.pop();

        }

        for(
            let i=foods.length-1;
            i>=0;
            i--
        ){

            const f=foods[i];

            if(
                Math.hypot(
                    b.x-f.x,
                    b.y-f.y
                )<22
            ){

                b.length+=
                    f.value*.5;

                b.score+=
                    f.value;

                foods.splice(i,1);

                foods.push(
                    createFood()
                );

                break;

            }

        }

    }

}

/* =========================
   SNAKE KILLS
========================= */

function checkBots(){

    for(
        const b of bots
    ){

        /*
          MINU PEA
          VASTASE KEHAS
        */

        for(
            let i=8;
            i<b.body.length;
            i++
        ){

            const p=b.body[i];

            if(
                Math.hypot(
                    player.x-p.x,
                    player.y-p.y
                )<22
            ){

                die(
                    b.name+
                    " keha tabas sinu pead!"
                );

                return;

            }

        }

        /*
          BOTI PEA
          MINU KEHAS
        */

        for(
            let i=8;
            i<body.length;
            i++
        ){

            const p=body[i];

            if(
                Math.hypot(
                    b.x-p.x,
                    b.y-p.y
                )<23
            ){

                killBot(b);

                break;

            }

        }

        /*
          PEA vs PEA
        */

        if(
            Math.hypot(
                player.x-b.x,
                player.y-b.y
            )<35
        ){

            if(
                player.length>=
                b.length
            ){

                killBot(b);

            }else{

                die(
                    b.name+
                    " võitis pea-vastu-pea!"
                );

                return;

            }

        }

    }

}

/* =========================
   KILL BOT
========================= */

function killBot(bot){

    const index=
        bots.indexOf(bot);

    if(index===-1)
        return;

    for(
        let i=0;
        i<bot.body.length;
        i+=3
    ){

        const p=bot.body[i];

        foods.push({

            x:p.x,
            y:p.y,

            radius:6,
            value:3,

            color:bot.color

        });

    }

    bots.splice(
        index,
        1
    );

    player.kills++;
    player.score+=10;
    player.length+=12;

    coins+=10;

    save();
    updateCoins();

    showKill();

    setTimeout(
        ()=>{

            if(
                running &&
                singlePlayer &&
                !dead
            ){

                bots.push(
                    createBot()
                );

            }

        },
        1000
    );

}

/* =========================
   DRAW WORLD
========================= */

function draw(){

    ctx.fillStyle="#071008";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    if(!running)
        return;

    ctx.save();

    ctx.translate(
        W/2-player.x,
        H/2-player.y
    );

    /*
      KAART
    */

    ctx.fillStyle="#102414";

    ctx.fillRect(
        0,
        0,
        WORLD,
        WORLD
    );

    /*
      ruudud
    */

    ctx.strokeStyle=
        "rgba(99,255,120,.07)";

    ctx.lineWidth=1;

    const grid=100;

    const startX=
        Math.floor(
            (player.x-W/2)/grid
        )*grid;

    const endX=
        Math.ceil(
            (player.x+W/2)/grid
        )*grid;

    for(
        let x=startX;
        x<=endX;
        x+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(
            x,
            player.y-H/2-100
        );

        ctx.lineTo(
            x,
            player.y+H/2+100
        );

        ctx.stroke();

    }

    const startY=
        Math.floor(
            (player.y-H/2)/grid
        )*grid;

    const endY=
        Math.ceil(
            (player.y+H/2)/grid
        )*grid;

    for(
        let y=startY;
        y<=endY;
        y+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(
            player.x-W/2-100,
            y
        );

        ctx.lineTo(
            player.x+W/2+100,
            y
        );

        ctx.stroke();

    }

    drawFood();

    for(
        const b of bots
    ){

        drawSnake(
            b,
            b.body
        );

    }

    drawSnake(
        player,
        body
    );

    ctx.restore();

    drawMinimap();

}

/* =========================
   FOOD DRAW
========================= */

function drawFood(){

    for(
        const f of foods
    ){

        if(
            Math.abs(
                f.x-player.x
            )>W/2+100 ||
            Math.abs(
                f.y-player.y
            )>H/2+100
        )
            continue;

        ctx.fillStyle=f.color;

        ctx.beginPath();

        ctx.arc(
            f.x,
            f.y,
            f.radius,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

}

/* =========================
   SNAKE DRAW
========================= */

function drawSnake(
    snake,
    parts
){

    if(
        !parts ||
        !parts.length
    )
        return;

    /*
      BODY
    */

    for(
        let i=parts.length-1;
        i>=0;
        i--
    ){

        const p=parts[i];

        const size=
            9+
            Math.min(
                7,
                (parts.length-i)/
                12
            );

        ctx.fillStyle=
            snake.color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            size,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    /*
      HEAD
    */

    ctx.save();

    ctx.translate(
        snake.x,
        snake.y
    );

    ctx.rotate(
        snake.angle
    );

    ctx.fillStyle=
        snake.color;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        24,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
      eyes
    */

    ctx.fillStyle="white";

    ctx.beginPath();

    ctx.arc(
        11,
        -8,
        7,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        11,
        8,
        7,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#111";

    ctx.beginPath();

    ctx.arc(
        13,
        -8,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        13,
        8,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.restore();

    /*
      NAME
    */

    ctx.font=
        "bold 14px Arial";

    ctx.textAlign="center";

    ctx.lineWidth=4;

    ctx.strokeStyle=
        "rgba(0,0,0,.8)";

    ctx.strokeText(
        snake.name || "Player",
        snake.x,
        snake.y-35
    );

    ctx.fillStyle="white";

    ctx.fillText(
        snake.name || "Player",
        snake.x,
        snake.y-35
    );

}

/* =========================
   MINIMAP
========================= */

function miniPoint(
    x,
    y,
    color,
    size
){

    const px=
        x/WORLD*400;

    const py=
        y/WORLD*400;

    mctx.fillStyle=color;

    mctx.beginPath();

    mctx.arc(
        px,
        py,
        size,
        0,
        Math.PI*2
    );

    mctx.fill();

}

function drawMinimap(){

    mctx.clearRect(
        0,
        0,
        400,
        400
    );

    mctx.fillStyle=
        "#102414";

    mctx.fillRect(
        0,
        0,
        400,
        400
    );

    /*
      kogu maailma grid
    */

    mctx.strokeStyle=
        "rgba(99,255,120,.12)";

    for(
        let i=0;
        i<=400;
        i+=20
    ){

        mctx.beginPath();

        mctx.moveTo(
            i,
            0
        );

        mctx.lineTo(
            i,
            400
        );

        mctx.stroke();

        mctx.beginPath();

        mctx.moveTo(
            0,
            i
        );

        mctx.lineTo(
            400,
            i
        );

        mctx.stroke();

    }

    /*
      BOTID
    */

    for(
        const b of bots
    ){

        miniPoint(
            b.x,
            b.y,
            "#ff5268",
            5
        );

    }

    /*
      MINU
    */

    miniPoint(
        player.x,
        player.y,
        "#63ff78",
        8
    );

    mctx.strokeStyle="white";
    mctx.lineWidth=2;

    const x=
        player.x/WORLD*400;

    const y=
        player.y/WORLD*400;

    mctx.beginPath();

    mctx.moveTo(
        x,
        y
    );

    mctx.lineTo(
        x+
        Math.cos(player.angle)*18,
        y+
        Math.sin(player.angle)*18
    );

    mctx.stroke();

    /*
      BORDER
    */

    mctx.strokeStyle="#63ff78";
    mctx.lineWidth=4;

    mctx.strokeRect(
        2,
        2,
        396,
        396
    );

}

/* =========================
   HUD
========================= */

function updateHud(){

    document.getElementById(
        "score"
    ).textContent=
        Math.floor(
            player.score
        );

    document.getElementById(
        "kills"
    ).textContent=
        player.kills;

    document.getElementById(
        "length"
    ).textContent=
        Math.floor(
            player.length
        );

    document.getElementById(
        "coins"
    ).textContent=
        coins;

    updateLeaderboard();

}

function updateLeaderboard(){

    const list=[{

        name:player.name,
        score:player.score,
        color:player.color

    }];

    for(
        const b of bots
    ){

        list.push({

            name:b.name,
            score:b.score,
            color:b.color

        });

    }

    list.sort(
        (a,b)=>
            b.score-a.score
    );

    const box=
        document.getElementById(
            "lbRows"
        );

    box.innerHTML="";

    list
        .slice(0,3)
        .forEach(
            (p,i)=>{

                const row=
                    document.createElement(
                        "div"
                    );

                row.className=
                    "lbRow";

                row.innerHTML=
                    `<span style="color:${p.color}">
                    ${i+1}. ${safe(p.name)}
                    </span>
                    <b>${Math.floor(p.score)}</b>`;

                box.appendChild(row);

            }
        );

}

function safe(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;");

}

/* =========================
   SHOP
========================= */

function renderSkins(){

    const box=
        document.getElementById(
            "skins"
        );

    box.innerHTML="";

    for(
        const s of SKINS
    ){

        if(
            !owned.includes(
                s[0]
            )
        )
            continue;

        const button=
            document.createElement(
                "button"
            );

        button.className=
            "skinButton";

        if(
            skin===s[0]
        ){

            button.classList.add(
                "selected"
            );

        }

        button.style.background=
            s[1];

        button.onclick=()=>{

            skin=s[0];

            player.color=s[1];

            save();

            renderSkins();
            renderShop();

        };

        box.appendChild(
            button
        );

    }

}

function renderShop(){

    const grid=
        document.getElementById(
            "shopGrid"
        );

    grid.innerHTML="";

    for(
        const s of SKINS
    ){

        const id=s[0];
        const color=s[1];
        const price=s[2];

        const have=
            owned.includes(id);

        const item=
            document.createElement(
                "div"
            );

        item.className=
            "shopItem";

        item.innerHTML=`

            <div
                class="preview"
                style="
                    background:${color};
                    box-shadow:0 0 15px ${color};
                "
            ></div>

            <b>${id.toUpperCase()}</b>

            <div
                style="
                    color:#ffd84d;
                    margin-top:5px
                "
            >
                ${
                    price===0
                    ? "TASUTA"
                    : "🪙 "+price
                }
            </div>

            <button>
                ${
                    have
                    ? "✓ KASUTA"
                    : "OSTA"
                }
            </button>
        `;

        item
            .querySelector("button")
            .onclick=()=>{

                if(have){

                    skin=id;

                    player.color=
                        color;

                    save();

                    renderSkins();
                    renderShop();

                    return;

                }

                if(coins<price){

                    alert(
                        "Sul pole piisavalt coine!"
                    );

                    return;

                }

                coins-=price;

                owned.push(id);

                skin=id;

                player.color=
                    color;

                save();

                updateCoins();

                renderSkins();
                renderShop();

            };

        grid.appendChild(item);

    }

}

function updateCoins(){

    document.getElementById(
        "menuCoins"

        coins;

    document.getElementById(
        "coins"

}

/* =========================
   MULTIPLAYER
========================= */

let socket=null;
let myId=null;
let multiplayer=false;

const remotePlayers=
    new Map();

function connect(){

    const protocol=
        location.protocol==="https:"
        ? "wss:"
        : "ws:";

    socket=
        new WebSocket(
            protocol+
            "//"+
            location.host
        );

    socket.onopen=()=>{

        document.getElementById(
            "connection"
        ).textContent=
            "🟢 Server ühendatud";

    };

    socket.onclose=()=>{

        document.getElementById(
            "connection"
        ).textContent=
            "🔴 Server pole ühendatud";

    };

    socket.onerror=()=>{

        document.getElementById(
            "connection"
        ).textContent=
            "🔴 Serveri viga";

    };

    socket.onmessage=e=>{

        let data;

        try{
            data=JSON.parse(e.data);
        }catch{
            return;
        }

        if(data.type==="connected"){

            myId=data.id;

        }

        if(
            data.type==="created" ||
            data.type==="joined"
        ){

            multiplayer=true;

            myId=data.id;

            document.getElementById(
                "room"
            ).style.display=
                "block";

            document.getElementById(
                "roomCode"
            ).textContent=
                data.code;

        }

        if(data.type==="startGame"){

            singlePlayer=false;

            startGame();

        }

        if(data.type==="state"){

            remotePlayers.clear();

            for(
                const p of data.players
            ){

                if(
                    p.id!==myId
                ){

                    remotePlayers.set(
                        p.id,
                        p
                    );

                }

            }

            updateRoomPlayers(
                data.players
            );

        }

        if(data.type==="kill"){

            if(
                data.killer===myId
            ){

                player.kills++;
                player.score+=10;

                coins+=10;

                save();
                updateCoins();

                showKill();

            }

        }

        if(data.type==="error"){

            document.getElementById(
                "error"
            ).textContent=
                data.message;

        }

    };

}

function send(data){

    if(
        socket &&
        socket.readyState===
        WebSocket.OPEN
    ){

        socket.send(
            JSON.stringify(data)
        );

    }

}

/* =========================
   MULTIPLAYER SEND
========================= */

function sendPlayer(){

    if(
        !multiplayer ||
        !running
    )
        return;

    send({

        type:"update",

        x:player.x,
        y:player.y,

        angle:player.angle,

        length:player.length,

        score:player.score,

        kills:player.kills,

        body:body.slice(
            0,
            250
        )

    });

}

   REMOTE DRAW
========================= */

}

/* =========================
   PATCH DRAW FOR MULTI
========================= */

const originalDraw=draw;

function drawGame(){

    originalDraw();

    if(
        !running ||
        !multiplayer
    )
        return;

    /*
       Remote snakes are drawn
       on the same camera.
    */

    ctx.save();

    ctx.translate(
        W/2-player.x,
        H/2-player.y
    );

    for(
        const p of remotePlayers.values()
    ){

        drawSnake(
            p,
            p.body || []
        );

    }

    ctx.restore();

}

/* =========================
   LOOP
========================= */

let lastSend=0;

function loop(time){

    if(running){

        if(singlePlayer){

            updateBots();

        }

        updatePlayer();

        const now=
            performance.now();

        if(
            now-lastSend>80
        ){

            sendPlayer();

            lastSend=now;

        }

    }

    drawGame();

    requestAnimationFrame(
        loop
    );

}

/* =========================
   INIT
========================= */

renderSkins();
renderShop();
updateCoins();
connect();

requestAnimationFrame(
    loop
);
