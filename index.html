<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Snake Arena</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050805;
  font-family:Arial,sans-serif;
}

#game{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}

button,input{
  font-family:inherit;
}

button{
  cursor:pointer;
}

#menu{
  position:fixed;
  inset:0;
  z-index:50;
  overflow-y:auto;
  padding:20px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle at 50% 20%,#245f2d,#0a1b0d 40%,#020402 85%);
}

.panel{
  width:min(94vw,460px);
  max-height:calc(100vh - 40px);
  overflow-y:auto;
  padding:25px;
  background:rgba(4,12,5,.97);
  border:1px solid rgba(99,255,120,.35);
  border-radius:28px;
  box-shadow:0 0 70px rgba(99,255,120,.15);
  color:white;
  text-align:center;
}

.logo{
  font-size:60px;
}

h1{
  color:#63ff78;
  font-size:38px;
}

.subtitle{
  color:#829384;
  margin:5px 0 18px;
}

input{
  width:100%;
  height:48px;
  margin:5px 0;
  background:#071007;
  border:1px solid #315c37;
  border-radius:12px;
  color:white;
  text-align:center;
  font-size:16px;
  outline:none;
}

.mainBtn{
  width:100%;
  min-height:48px;
  margin-top:8px;
  border:0;
  border-radius:12px;
  font-size:15px;
  font-weight:bold;
}

.green{
  background:#63ff78;
  color:#031006;
}

.dark{
  background:#102014;
  color:white;
  border:1px solid #315b36;
}

#skins{
  display:flex;
  gap:8px;
  justify-content:center;
  flex-wrap:wrap;
  margin:14px 0;
}

.skin{
  width:55px;
  height:55px;
  border-radius:50%;
  border:3px solid transparent;
  font-size:25px;
}

.skin.selected{
  border-color:white;
  transform:scale(1.1);
  box-shadow:0 0 18px currentColor;
}

#roomBox{
  display:none;
  margin-top:15px;
}

.roomTitle{
  font-size:11px;
  color:#819482;
}

#roomCode{
  font-size:30px;
  color:#63ff78;
  font-weight:bold;
  letter-spacing:6px;
  margin:5px 0 10px;
}

#players{
  max-height:120px;
  overflow-y:auto;
  text-align:left;
}

.playerRow{
  padding:8px;
  margin:4px 0;
  border-radius:8px;
  background:#0b170d;
}

#error{
  color:#ff6676;
  min-height:20px;
  margin-top:10px;
}

#connection{
  color:#718172;
  font-size:11px;
  margin-top:8px;
}

#hud{
  position:fixed;
  z-index:10;
  left:10px;
  top:10px;
  display:none;
  gap:6px;
}

.stat{
  padding:7px 10px;
  background:rgba(0,0,0,.7);
  border:1px solid rgba(99,255,120,.25);
  border-radius:10px;
  color:white;
}

.stat small{
  display:block;
  color:#78907c;
  font-size:9px;
}

.stat b{
  font-size:16px;
}

#leaderboard{
  position:fixed;
  z-index:15;
  right:10px;
  top:10px;
  width:220px;
  max-width:45vw;
  padding:10px;
  display:none;
  background:rgba(0,0,0,.72);
  border:1px solid rgba(99,255,120,.3);
  border-radius:14px;
  color:white;
}

#leaderboard h3{
  color:#63ff78;
  font-size:15px;
  margin-bottom:6px;
}

.lbrow{
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-size:12px;
  padding:4px 2px;
}

.lbrow.me{
  color:#63ff78;
  font-weight:bold;
}

#minimap{
  position:fixed;
  z-index:12;
  right:10px;
  top:180px;
  width:160px;
  height:160px;
  display:none;
  border-radius:15px;
  border:2px solid rgba(99,255,120,.7);
  background:#061007;
}

#joystick{
  position:fixed;
  z-index:20;
  left:24px;
  bottom:24px;
  width:145px;
  height:145px;
  display:none;
  border-radius:50%;
  background:rgba(99,255,120,.08);
  border:2px solid rgba(99,255,120,.35);
}

#stick{
  position:absolute;
  left:50%;
  top:50%;
  width:62px;
  height:62px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:#63ff78;
  border:3px solid white;
}

#boost{
  position:fixed;
  z-index:20;
  right:25px;
  bottom:30px;
  width:90px;
  height:90px;
  display:none;
  border-radius:50%;
  background:#087bb0;
  color:white;
  border:3px solid #a5e3ff;
  font-size:27px;
}

#killText{
  position:fixed;
  z-index:30;
  left:50%;
  top:25%;
  transform:translateX(-50%) scale(.7);
  opacity:0;
  color:#63ff78;
  font-size:38px;
  font-weight:900;
  text-shadow:0 0 20px #63ff78;
  pointer-events:none;
  transition:.25s;
}

#killText.show{
  opacity:1;
  transform:translateX(-50%) scale(1);
}

#gameOver{
  position:fixed;
  inset:0;
  z-index:60;
  display:none;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.8);
}

.overPanel{
  width:min(90vw,390px);
  padding:30px;
  background:#081008;
  border:1px solid #315b36;
  border-radius:25px;
  text-align:center;
  color:white;
}

.overPanel h2{
  color:#ff596c;
  font-size:38px;
}

@media(max-width:800px){

  #menu{
    align-items:flex-start;
  }

  #joystick,
  #boost{
    display:block;
  }

  #minimap{
    width:125px;
    height:125px;
    top:145px;
  }

  #leaderboard{
    top:10px;
    right:8px;
    width:185px;
    max-width:50vw;
  }

  #hud{
    transform:scale(.9);
    transform-origin:top left;
  }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="menu">

<div class="panel">

<div class="logo">🐍</div>

<h1>SNAKE ARENA</h1>

<div class="subtitle">
Eat • Grow • Fight
</div>

<h3 style="margin-top:10px">🎨 Vali skin</h3>

<div id="skins">

<button class="skin selected"
data-color="#63ff78"
data-skin="green"
style="background:#63ff78">🐍</button>

<button class="skin"
data-color="#4da6ff"
data-skin="blue"
style="background:#4da6ff">😎</button>

<button class="skin"
data-color="#ff5570"
data-skin="red"
style="background:#ff5570">😈</button>

<button class="skin"
data-color="#ffd84d"
data-skin="yellow"
style="background:#ffd84d">😄</button>

<button class="skin"
data-color="#b86cff"
data-skin="purple"
style="background:#b86cff">👾</button>

<button class="skin"
data-color="#ff8a3d"
data-skin="orange"
style="background:#ff8a3d">🔥</button>

data-skin="white"

</div>

</button>

<input id="roomInput"
maxlength="6"
placeholder="ROOM CODE">

</button>

🤖 SINGLEPLAYER — BOTID
</button>

<div id="roomBox">

<div class="roomTitle">ROOM CODE</div>

<div id="roomCode">------</div>

▶ START GAME

</div>

</div>
</div>

<div id="hud">

</div>

<div class="stat">

<b id="length">20</b>

</div>

Skoor: <b id="finalScore">0</b>
</p>

<p>
Kills: <b id="finalKills">0</b>
</p>

<button
class="mainBtn green"
style="margin-top:20px"
onclick="location.reload()">
🔄 TAGASI MENÜÜS
</button>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const minimap=document.getElementById("minimap");
const mapCtx=minimap.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){
  W=innerWidth;
  H=innerHeight;
  canvas.width=W;
  canvas.height=H;
}

addEventListener("resize",resize);
resize();

const WORLD=20000;

const me={
  id:null,
  x:10000,
  y:10000,
  angle:0,
  targetAngle:0,
  length:20,
  color:"#63ff78",
  skin:"green",
  name:"Player",
  score:0,
  kills:0
};

let body=[];
let others={};
let foods=[];
let bots=[];
let running=false;
let dead=false;
let boosting=false;
let singleplayer=false;

let socket=null;
let connected=false;

const foodColors=[
  "#63ff78",
  "#ffd84d",
  "#ff6075",
  "#55c9ff",
  "#c76cff",
  "#ff963d"
];

for(let i=0;i<1400;i++){
  foods.push({
    x:Math.random()*WORLD,
    y:Math.random()*WORLD,
    radius:3+Math.random()*4,
    color:foodColors[Math.floor(Math.random()*foodColors.length)],
    value:1+Math.floor(Math.random()*4)
  });
}

document.querySelectorAll(".skin").forEach(button=>{
  button.onclick=()=>{
    document.querySelectorAll(".skin")
      .forEach(b=>b.classList.remove("selected"));

    button.classList.add("selected");

    me.color=button.dataset.color;
    me.skin=button.dataset.skin;
  };
});

function playerName(){
  return (
    document.getElementById("name").value.trim() ||
    "Player"
  ).substring(0,16);
}

function setConnection(t){
  document.getElementById("connection").textContent=t;
}

function error(t){
  document.getElementById("error").textContent=t||"";
}

function send(data){
  if(socket && socket.readyState===WebSocket.OPEN){
    socket.send(JSON.stringify(data));
    return true;
  }
  return false;
}

function connect(){

  const protocol=
    location.protocol==="https:" ? "wss:" : "ws:";

  socket=new WebSocket(
    protocol+"//"+location.host
  );

  setConnection("🟡 Ühendamine...");

  socket.onopen=()=>{
    connected=true;
    setConnection("🟢 Server ühendatud");
  };

  socket.onclose=()=>{
    connected=false;
    setConnection("🔴 Ühendus katkes");
  };

  socket.onerror=()=>{
    setConnection("🔴 Serveri viga");
  };

  socket.onmessage=e=>{
    try{
      serverMessage(JSON.parse(e.data));
    }catch{}
  };
}

function serverMessage(data){

  if(data.type==="connected"){
    me.id=data.id;
  }

  if(data.type==="roomCreated" ||
     data.type==="roomJoined"){

    me.id=data.id||me.id;

    document.getElementById("roomBox")
      .style.display="block";

    document.getElementById("roomCode")
      .textContent=data.code;

    error("");
  }

  if(data.type==="lobby"){
    updateLobby(data.players||[]);
  }

  if(data.type==="gameStart"){
    me.id=data.id||me.id;
    startGame();
  }

  if(data.type==="players"){
    others=data.players||{};
    updateLeaderboard();
  }

  if(data.type==="playerKilled"){
    showKill();
  }

  if(data.type==="gameOver"){
    die(data.reason||"Sind tapetud!");
  }

  if(data.type==="error"){
    error(data.message||"Viga");
  }
}

function updateLobby(players){

  const box=document.getElementById("players");

  box.innerHTML="";

  players.forEach(p=>{

    const row=document.createElement("div");

    row.className="playerRow";

    row.textContent=
      (p.host?"👑 ":"🐍 ")+
      (p.name||"Player");

    row.style.color=p.color||"white";

    box.appendChild(row);
  });

  if(players.length){
    document.getElementById("startBtn")
      .style.display="block";
  }
}

document.getElementById("createBtn").onclick=()=>{

  if(!connected){
    error("Server pole ühendatud.");
    return;
  }

  send({
    type:"createRoom",
    name:playerName(),
    color:me.color,
    skin:me.skin
  });
};

document.getElementById("joinBtn").onclick=()=>{

  const code=document.getElementById("roomInput")
    .value.trim().toUpperCase();

  if(code.length!==6){
    error("Room code peab olema 6 märki.");
    return;
  }

  if(!connected){
    error("Server pole ühendatud.");
    return;
  }

  send({
    type:"joinRoom",
    code,
    name:playerName(),
    color:me.color,
    skin:me.skin
  });
};

document.getElementById("startBtn").onclick=()=>{
  send({type:"startGame"});
};

document.getElementById("singleBtn").onclick=()=>{
  startSingleplayer();
};

const keys={};

addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;

  if(e.key==="Shift"){
    boosting=true;
  }
});

addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()]=false;

  if(e.key==="Shift"){
    boosting=false;
  }
});

function keyboardDirection(){

  let dx=0;
  let dy=0;

  if(keys.w||keys.arrowup)dy=-1;
  if(keys.s||keys.arrowdown)dy=1;
  if(keys.a||keys.arrowleft)dx=-1;
  if(keys.d||keys.arrowright)dx=1;

  if(dx||dy){
    me.targetAngle=Math.atan2(dy,dx);
  }
}

addEventListener("mousemove",e=>{

  if(!running)return;
  if(innerWidth<=800)return;

  const dx=e.clientX-W/2;
  const dy=e.clientY-H/2;

  if(Math.hypot(dx,dy)>15){
    me.targetAngle=Math.atan2(dy,dx);
  }
});

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joyId=null;

function moveJoystick(x,y){

  const r=joystick.getBoundingClientRect();

  const cx=r.left+r.width/2;
  const cy=r.top+r.height/2;

  let dx=x-cx;
  let dy=y-cy;

  const max=55;
  const d=Math.hypot(dx,dy);

  if(d>max){
    dx=dx/d*max;
    dy=dy/d*max;
  }

  stick.style.left=`calc(50% + ${dx}px)`;
  stick.style.top=`calc(50% + ${dy}px)`;

  if(d>7){
    me.targetAngle=Math.atan2(dy,dx);
  }
}

function resetJoystick(){
  joyId=null;
  stick.style.left="50%";
  stick.style.top="50%";
}

joystick.onpointerdown=e=>{
  joyId=e.pointerId;
  joystick.setPointerCapture(e.pointerId);
  moveJoystick(e.clientX,e.clientY);
};

joystick.onpointermove=e=>{
  if(e.pointerId===joyId){
    moveJoystick(e.clientX,e.clientY);
  }
};

joystick.onpointerup=resetJoystick;
joystick.onpointercancel=resetJoystick;

const boost=document.getElementById("boost");

boost.onpointerdown=()=>{
  boosting=true;
};

boost.onpointerup=()=>{
  boosting=false;
};

boost.onpointercancel=()=>{
  boosting=false;
};

function startGame(){

  running=true;
  dead=false;

  singleplayer=false;

  document.getElementById("menu").style.display="none";
  document.getElementById("hud").style.display="flex";
  document.getElementById("leaderboard").style.display="block";
  document.getElementById("minimap").style.display="block";

  me.name=playerName();
  me.score=0;
  me.kills=0;
  me.length=20;

  me.x=2000+Math.random()*16000;
  me.y=2000+Math.random()*16000;

  me.angle=Math.random()*Math.PI*2;
  me.targetAngle=me.angle;

  createBody();
}

function startSingleplayer(){

  running=true;
  dead=false;
  singleplayer=true;

  document.getElementById("menu").style.display="none";
  document.getElementById("hud").style.display="flex";
  document.getElementById("leaderboard").style.display="block";
  document.getElementById("minimap").style.display="block";

  me.name=playerName();
  me.score=0;
  me.kills=0;
  me.length=20;

  me.x=10000;
  me.y=10000;

  me.angle=0;
  me.targetAngle=0;

  createBody();

  bots=[];

  const names=[
    "Bot Rex",
    "Bot Speed",
    "Bot Max",
    "Bot Ninja",
    "Bot Pro",
    "Bot Shadow",
    "Bot King",
    "Bot Snake"
  ];

  for(let i=0;i<8;i++){

    bots.push({
      id:"bot"+i,
      name:names[i],
      x:1500+Math.random()*17000,
      y:1500+Math.random()*17000,
      angle:Math.random()*Math.PI*2,
      length:20+Math.random()*30,
      color:[
        "#ff5570",
        "#4da6ff",
        "#ffd84d",
        "#b86cff",
        "#ff8a3d",
        "#00e5d4",
        "#ffffff",
        "#63ff78"
      ][i],
      skin:[
        "red",
        "blue",
        "yellow",
        "purple",
        "orange",
        "cyan",
        "white",
        "green"
      ][i],
      score:0,
      kills:0,
      alive:true,
      think:Math.random()*100
    });
  }
}

function createBody(){

  body=[];

  for(let i=0;i<Math.floor(me.length);i++){
    body.push({
      x:me.x-Math.cos(me.angle)*i*8,
      y:me.y-Math.sin(me.angle)*i*8
    });
  }
}

function update(){

  if(!running||dead)return;

  keyboardDirection();

  let diff=me.targetAngle-me.angle;

  while(diff>Math.PI)diff-=Math.PI*2;
  while(diff<-Math.PI)diff+=Math.PI*2;

  me.angle+=diff*.15;

  const speed=boosting?9:5.4;

  me.x+=Math.cos(me.angle)*speed;
  me.y+=Math.sin(me.angle)*speed;

  me.x=Math.max(25,Math.min(WORLD-25,me.x));
  me.y=Math.max(25,Math.min(WORLD-25,me.y));

  body.unshift({
    x:me.x,
    y:me.y
  });

  while(body.length>Math.floor(me.length)){
    body.pop();
  }

  while(body.length<Math.floor(me.length)){
    body.push({
      x:me.x,
      y:me.y
    });
  }

  eatFood();

  if(boosting&&me.length>20){

    me.length-=.04;

    if(Math.random()<.16){
      foods.push({
        x:me.x-Math.cos(me.angle)*30,
        y:me.y-Math.sin(me.angle)*30,
        radius:5,
        color:me.color,
        value:2
      });
    }
  }

  if(singleplayer){
    updateBots();
    checkBotCombat();
  }else{

    send({
      type:"state",
      x:me.x,
      y:me.y,
      angle:me.angle,
      length:me.length,
      score:me.score,
      kills:me.kills,
      color:me.color,
      skin:me.skin,
      name:me.name
    });
  }

  document.getElementById("score").textContent=Math.floor(me.score);
  document.getElementById("kills").textContent=me.kills;
  document.getElementById("length").textContent=Math.floor(me.length);

  updateLeaderboard();
}

function eatFood(){

  for(let i=foods.length-1;i>=0;i--){

    const f=foods[i];

    if(Math.hypot(f.x-me.x,f.y-me.y)<24){

      me.score+=f.value;
      me.length+=f.value*.6;

      foods.splice(i,1);

      foods.push({
        x:Math.random()*WORLD,
        y:Math.random()*WORLD,
        radius:3+Math.random()*4,
        color:foodColors[Math.floor(Math.random()*foodColors.length)],
        value:1+Math.floor(Math.random()*4)
      });
    }
  }
}

function updateBots(){

  for(const b of bots){

    if(!b.alive)continue;

    b.think-=1;

    if(b.think<=0){

      b.think=30+Math.random()*70;

      const dx=me.x-b.x;
      const dy=me.y-b.y;
      const d=Math.hypot(dx,dy);

      if(d<700){
        b.angle=Math.atan2(dy,dx);
      }else{
        b.angle+=(-.5+Math.random())*.8;
      }
    }

    const speed=4.0;

    b.x+=Math.cos(b.angle)*speed;
    b.y+=Math.sin(b.angle)*speed;

    if(b.x<100||b.x>WORLD-100){
      b.angle=Math.PI-b.angle;
    }

    if(b.y<100||b.y>WORLD-100){
      b.angle=-b.angle;
    }

    b.x=Math.max(30,Math.min(WORLD-30,b.x));
    b.y=Math.max(30,Math.min(WORLD-30,b.y));

    if(Math.hypot(b.x-me.x,b.y-me.y)<30){

      if(me.length>=b.length){

        killBot(b);

      }else{

        die("Bot "+b.name+" tappis sind!");
        return;
      }
    }
  }
}

function killBot(b){

  if(!b.alive)return;

  b.alive=false;

  me.kills++;
  me.score+=100;
  me.length+=Math.max(5,b.length*.2);

  showKill();

  for(let i=0;i<Math.min(30,b.length);i++){

    foods.push({
      x:b.x+(Math.random()-.5)*100,
      y:b.y+(Math.random()-.5)*100,
      radius:4+Math.random()*3,
      color:b.color,
      value:2
    });
  }

  setTimeout(()=>{

    b.x=1000+Math.random()*18000;
    b.y=1000+Math.random()*18000;
    b.angle=Math.random()*Math.PI*2;
    b.length=20+Math.random()*30;
    b.alive=true;
    b.score=0;

  },1800);
}

function checkBotCombat(){

  for(const b of bots){

    if(!b.alive)continue;

    if(Math.hypot(b.x-me.x,b.y-me.y)<26){

      if(me.length>=b.length){
        killBot(b);
      }else{
        die("Bot tappis sind!");
      }
    }
  }
}

let cameraX=me.x;
let cameraY=me.y;

function draw(){

  ctx.fillStyle="#071008";
  ctx.fillRect(0,0,W,H);

  if(!running)return;

  cameraX+=(me.x-cameraX)*.1;
  cameraY+=(me.y-cameraY)*.1;

  ctx.save();

  ctx.translate(
    W/2-cameraX,
    H/2-cameraY
  );

  drawGrid();
  drawBorder();
  drawFood();

  if(singleplayer){
    drawBots();
  }else{
    drawOthers();
  }

  drawMe();

  ctx.restore();

  drawMinimap();
}

function drawGrid(){

  const grid=250;

  ctx.strokeStyle="rgba(99,255,120,.05)";
  ctx.lineWidth=1;

  const left=cameraX-W/2-500;
  const right=cameraX+W/2+500;
  const top=cameraY-H/2-500;
  const bottom=cameraY+H/2+500;

  for(let x=Math.floor(left/grid)*grid;x<right;x+=grid){

    ctx.beginPath();
    ctx.moveTo(x,top);
    ctx.lineTo(x,bottom);
    ctx.stroke();
  }

  for(let y=Math.floor(top/grid)*grid;y<bottom;y+=grid){

    ctx.beginPath();
    ctx.moveTo(left,y);
    ctx.lineTo(right,y);
    ctx.stroke();
  }
}

function drawBorder(){

  ctx.strokeStyle="#63ff78";
  ctx.lineWidth=18;
  ctx.shadowColor="#63ff78";
  ctx.shadowBlur=20;

  ctx.strokeRect(0,0,WORLD,WORLD);

  ctx.shadowBlur=0;
}

function drawFood(){

  for(const f of foods){

    if(
      Math.abs(f.x-cameraX)>W||
      Math.abs(f.y-cameraY)>H
    )continue;

    ctx.fillStyle=f.color;
    ctx.shadowColor=f.color;
    ctx.shadowBlur=9;

    ctx.beginPath();
    ctx.arc(f.x,f.y,f.radius,0,Math.PI*2);
    ctx.fill();
  }

  ctx.shadowBlur=0;
}

function drawMe(){

  drawSnakeBody(
    body,
    me.color
  );

  drawHead(
    me.x,
    me.y,
    22,
    me.color,
    me.skin,
    me.angle
  );

  drawName(
    me.name,
    me.x,
    me.y-34
  );
}

function drawOthers(){

  for(const id in others){

    if(id===me.id)continue;

    const p=others[id];

    if(!p||p.alive===false)continue;

    const len=Math.min(
      250,
      Math.max(20,Math.floor(p.length||20))
    );

    const points=[];

    for(let i=0;i<len;i++){

      points.push({
        x:p.x-Math.cos(p.angle)*i*8,
        y:p.y-Math.sin(p.angle)*i*8
      });
    }

    drawSnakeBody(
      points,
      p.color||"#4da6ff"
    );

    drawHead(
      p.x,
      p.y,
      22,
      p.color||"#4da6ff",
      p.skin||"blue",
      p.angle||0
    );

    drawName(
      p.name||"Player",
      p.x,
      p.y-34
    );
  }
}

function drawBots(){

  for(const b of bots){

    if(!b.alive)continue;

    const points=[];

    const len=Math.min(
      250,
      Math.floor(b.length)
    );

    for(let i=0;i<len;i++){

      points.push({
        x:b.x-Math.cos(b.angle)*i*8,
        y:b.y-Math.sin(b.angle)*i*8
      });
    }

    drawSnakeBody(
      points,
      b.color
    );

    drawHead(
      b.x,
      b.y,
      22,
      b.color,
      b.skin,
      b.angle
    );

    drawName(
      b.name,
      b.x,
      b.y-34
    );
  }
}

function drawSnakeBody(points,color){

  for(let i=points.length-1;i>=0;i--){

    const p=points[i];

    const progress=i/Math.max(1,points.length);

    const radius=9+(1-progress)*8;

    ctx.globalAlpha=1-progress*.3;

    ctx.fillStyle=color;
    ctx.shadowColor=color;
    ctx.shadowBlur=i<10?10:3;

    ctx.beginPath();
    ctx.arc(
      p.x,
      p.y,
      radius,
      0,
      Math.PI*2
    );
    ctx.fill();
  }

  ctx.globalAlpha=1;
  ctx.shadowBlur=0;
}

function drawHead(x,y,radius,color,skin,angle){

  ctx.save();

  ctx.translate(x,y);

  ctx.rotate(angle);

  ctx.fillStyle=color;

  ctx.shadowColor=color;
  ctx.shadowBlur=18;

  ctx.beginPath();
  ctx.arc(0,0,radius,0,Math.PI*2);
  ctx.fill();

  ctx.shadowBlur=0;

  /* SKIN MUST COVER THE WHOLE HEAD */

  if(skin==="red"){

    ctx.strokeStyle="#ffd0d6";
    ctx.lineWidth=4;

    for(let i=-1;i<=1;i++){

      ctx.beginPath();
      ctx.moveTo(-15,i*8);
      ctx.lineTo(15,i*8);
      ctx.stroke();
    }
  }

  if(skin==="blue"){

    ctx.strokeStyle="#d5f3ff";
    ctx.lineWidth=4;

    ctx.beginPath();
    ctx.arc(0,0,radius-3,0,Math.PI*2);
    ctx.stroke();
  }

  if(skin==="yellow"){

    ctx.fillStyle="#fff0a0";

    ctx.beginPath();
    ctx.arc(-4,0,10,0,Math.PI*2);
    ctx.fill();
  }

  if(skin==="purple"){

    ctx.fillStyle="#f4d6ff";

    for(let i=0;i<8;i++){

      const a=i*Math.PI/4;

      ctx.beginPath();

      ctx.arc(
        Math.cos(a)*14,
        Math.sin(a)*14,
        3,
        0,
        Math.PI*2
      );

      ctx.fill();
    }
  }

  if(skin==="orange"){

    ctx.strokeStyle="#ffe0bd";
    ctx.lineWidth=4;

    for(let i=-1;i<=1;i++){

      ctx.beginPath();
      ctx.moveTo(-17,i*7);
      ctx.lineTo(17,i*7);
      ctx.stroke();
    }
  }

  if(skin==="cyan"){

    ctx.strokeStyle="#d0fffa";
    ctx.lineWidth=4;

    ctx.beginPath();
    ctx.arc(0,0,14,0,Math.PI*2);
    ctx.stroke();
  }

  if(skin==="white"){

    ctx.strokeStyle="#9c9c9c";
    ctx.lineWidth=3;

    ctx.beginPath();
    ctx.arc(0,0,radius-2,0,Math.PI*2);
    ctx.stroke();
  }

  drawFace();

  ctx.restore();

  function drawFace(){

    ctx.fillStyle="white";

    ctx.beginPath();
    ctx.arc(9,-7,6,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(9,7,6,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#111";

    ctx.beginPath();
    ctx.arc(11,-7,3,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(11,7,3,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle="#111";
    ctx.lineWidth=2;

    ctx.beginPath();
    ctx.arc(14,0,5,-.7,.7);
    ctx.stroke();
  }
}

function drawName(name,x,y){

  ctx.save();

  ctx.textAlign="center";
  ctx.font="bold 12px Arial";
  ctx.fillStyle="white";
  ctx.shadowColor="black";
  ctx.shadowBlur=5;

  ctx.fillText(name,x,y);

  ctx.restore();
}

function drawMinimap(){

  const size=minimap.width;

  mapCtx.clearRect(0,0,size,size);

  mapCtx.fillStyle="#061007";
  mapCtx.fillRect(0,0,size,size);

  for(const f of foods){

    const x=f.x/WORLD*size;
    const y=f.y/WORLD*size;

    mapCtx.fillStyle=f.color;

    mapCtx.globalAlpha=.35;

    mapCtx.beginPath();
    mapCtx.arc(x,y,1.2,0,Math.PI*2);
    mapCtx.fill();
  }

  mapCtx.globalAlpha=1;

  if(singleplayer){

    for(const b of bots){

      if(!b.alive)continue;

      mapCtx.fillStyle=b.color;

      mapCtx.beginPath();
      mapCtx.arc(
        b.x/WORLD*size,
        b.y/WORLD*size,
        3,
        0,
        Math.PI*2
      );
      mapCtx.fill();
    }

  }else{

    for(const id in others){

      if(id===me.id)continue;

      const p=others[id];

      if(!p)continue;

      mapCtx.fillStyle=p.color||"#ff5268";

      mapCtx.beginPath();
      mapCtx.arc(
        p.x/WORLD*size,
        p.y/WORLD*size,
        4,
        0,
        Math.PI*2
      );
      mapCtx.fill();
    }
  }

  mapCtx.fillStyle=me.color;

  mapCtx.beginPath();

  mapCtx.arc(
    me.x/WORLD*size,
    me.y/WORLD*size,
    5,
    0,
    Math.PI*2
  );

  mapCtx.fill();

  mapCtx.strokeStyle="#63ff78";
  mapCtx.lineWidth=2;

  mapCtx.strokeRect(
    1,1,size-2,size-2
  );
}

function updateLeaderboard(){

  const list=[];

  list.push({
    name:me.name,
    score:me.score,
    kills:me.kills,
    length:me.length,
    me:true
  });

  if(singleplayer){

    for(const b of bots){

      list.push({
        name:b.name,
        score:b.score,
        kills:b.kills,
        length:b.length,
        me:false
      });
    }

  }else{

    for(const id in others){

      const p=others[id];

      if(!p)continue;

      list.push({
        name:p.name||"Player",
        score:p.score||0,
        kills:p.kills||0,
        length:p.length||20,
        me:false
      });
    }
  }

  list.sort((a,b)=>{

    if(b.score!==a.score){
      return b.score-a.score;
    }

    return b.length-a.length;
  });

  const box=document.getElementById("lb");

  box.innerHTML="";

  list.slice(0,8).forEach((p,i)=>{

    const row=document.createElement("div");

    row.className="lbrow"+(p.me?" me":"");

    row.innerHTML=
      `<span>${i+1}. ${escapeHtml(p.name)}</span>`+
      `<span>${Math.floor(p.score)} | 💀 ${p.kills}</span>`;

    box.appendChild(row);
  });
}

function escapeHtml(s){

  return String(s)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

let killTimer;

function showKill(){

  const el=document.getElementById("killText");

  el.classList.add("show");

  clearTimeout(killTimer);

  killTimer=setTimeout(()=>{
    el.classList.remove("show");
  },1000);
}

function die(reason){

  if(dead)return;

  dead=true;
  running=false;
  boosting=false;

  document.getElementById("deathReason")
    .textContent=reason;

  document.getElementById("finalScore")
    .textContent=Math.floor(me.score);

  document.getElementById("finalKills")
    .textContent=me.kills;

  document.getElementById("gameOver")
    .style.display="flex";
}

function loop(){

  update();
  draw();

  requestAnimationFrame(loop);
}

connect();
loop();
</script>
