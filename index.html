<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const minimap = document.getElementById("minimap");
const mapCtx = minimap.getContext("2d");

let W = innerWidth;
let H = innerHeight;

function resize(){
    W = innerWidth;
    H = innerHeight;

    canvas.width = W;
    canvas.height = H;
}

addEventListener("resize", resize);
resize();

const WORLD = 12000;

const me = {
    id:null,
    x:6000,
    y:6000,
    angle:0,
    targetAngle:0,
    length:20,
    color:"#63ff78",
    skin:"green",
    name:"Player"
};

let body = [];
let others = {};
let foods = [];

let score = 0;
let running = false;
let dead = false;

const foodColors = [
    "#63ff78",
    "#ffd84d",
    "#ff6075",
    "#55c9ff",
    "#c76cff",
    "#ff963d"
];

function makeFood(){
    return {
        x:Math.random()*WORLD,
        y:Math.random()*WORLD,
        r:3+Math.random()*4,
        color:foodColors[
            Math.floor(Math.random()*foodColors.length)
        ],
        value:1+Math.floor(Math.random()*4)
    };
}

for(let i=0;i<500;i++){
    foods.push(makeFood());
}

/* SKINS */

document.querySelectorAll(".skin").forEach(button=>{
    button.onclick=()=>{
        document.querySelectorAll(".skin").forEach(b=>{
            b.classList.remove("selected");
        });

        button.classList.add("selected");

        me.color = button.dataset.color;
        me.skin = button.dataset.skin;
    };
});

/* SOCKET */

let socket = null;
let connected = false;

function connect(){

    const protocol =
        location.protocol === "https:"
            ? "wss:"
            : "ws:";

    socket = new WebSocket(
        protocol + "//" + location.host
    );

    socket.onopen = ()=>{
        connected = true;
        connection("🟢 Server ühendatud");
    };

    socket.onclose = ()=>{
        connected = false;
        connection("🔴 Serveriga ühendus katkes");
    };

    socket.onerror = ()=>{
        connection("🔴 Serveri viga");
    };

    socket.onmessage = event=>{
        let data;

        try{
            data = JSON.parse(event.data);
        }catch{
            return;
        }

        message(data);
    };
}

function send(data){

    if(
        !socket ||
        socket.readyState !== WebSocket.OPEN
    ){
        return;
    }

    socket.send(JSON.stringify(data));
}

/* SERVER */

function message(data){

    if(data.type === "connected"){
        me.id = data.id;
    }

    if(data.type === "roomCreated"){
        me.id = data.id;
        showRoom(data.code);
    }

    if(data.type === "roomJoined"){
        me.id = data.id;
        showRoom(data.code);
    }

    if(data.type === "lobby"){
        updateLobby(data.players || []);
    }

    if(data.type === "gameStart"){
        me.id = data.id || me.id;
        startGame();
    }

    if(data.type === "players"){
        others = data.players || {};
        updatePlayerCount();
    }

    if(data.type === "kill"){
        score = data.score || score;
        showKill();
    }

    if(data.type === "playerKilled"){
        if(data.id !== me.id){
            delete others[data.id];
        }
    }

    if(data.type === "gameOver"){
        die(data.reason || "Sind elimineeriti!");
    }

    if(data.type === "respawned"){
        dead = false;
        running = true;

        document.getElementById("gameOver").style.display = "none";
    }

    if(data.type === "error"){
        showError(data.message);
    }
}

/* UI */

function playerName(){
    return (
        document.getElementById("name").value.trim() ||
        "Player"
    ).substring(0,16);
}

function showRoom(code){
    document.getElementById("roomBox").style.display = "block";
    document.getElementById("roomCode").textContent = code;
}

function updateLobby(players){

    const box = document.getElementById("players");

    box.innerHTML = "";

    players.forEach(p=>{

        const row = document.createElement("div");

        row.className = "playerRow";

        row.textContent =
            (p.host ? "👑 " : "🐍 ") +
            p.name;

        row.style.color = p.color || "white";

        box.appendChild(row);
    });

    if(players.some(p=>p.host)){
        const meData = players.find(p=>p.id === me.id);

        if(meData && meData.host){
            document.getElementById("startBtn").style.display = "block";
        }
    }
}

function updatePlayerCount(){
    document.getElementById("playerCount").textContent =
        Math.max(1,Object.keys(others).length);
}

function showError(text){
    document.getElementById("error").textContent = text || "";
}

function connection(text){
    document.getElementById("connection").textContent = text;
}

/* CREATE */

document.getElementById("createBtn").onclick = ()=>{

    if(!connected){
        showError("Serveriga pole ühendust.");
        return;
    }

    showError("");

    send({
        type:"createRoom",
        name:playerName(),
        color:me.color,
        skin:me.skin
    });
};

/* JOIN */

document.getElementById("joinBtn").onclick = ()=>{

    const code =
        document.getElementById("roomInput")
            .value
            .trim()
            .toUpperCase();

    if(code.length !== 6){
        showError("Room code peab olema 6 märki.");
        return;
    }

    send({
        type:"joinRoom",
        code,
        name:playerName(),
        color:me.color,
        skin:me.skin
    });
};

/* START */

document.getElementById("startBtn").onclick = ()=>{
    send({
        type:"startGame"
    });
};

/* KEYBOARD */

const keys = {};

addEventListener("keydown", e=>{
    keys[e.key.toLowerCase()] = true;

    if(e.code === "Space"){
        attackNearest();
    }
});

addEventListener("keyup", e=>{
    keys[e.key.toLowerCase()] = false;
});

function keyboardDirection(){

    let dx = 0;
    let dy = 0;

    if(keys.w || keys.arrowup) dy--;
    if(keys.s || keys.arrowdown) dy++;
    if(keys.a || keys.arrowleft) dx--;
    if(keys.d || keys.arrowright) dx++;

    if(dx || dy){
        me.targetAngle = Math.atan2(dy,dx);
    }
}

/* MOUSE */

addEventListener("mousemove", e=>{

    if(!running || innerWidth <= 800){
        return;
    }

    const dx = e.clientX - W/2;
    const dy = e.clientY - H/2;

    if(Math.hypot(dx,dy) > 15){
        me.targetAngle = Math.atan2(dy,dx);
    }
});

/* JOYSTICK */

const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

let joyId = null;

function joystickMove(x,y){

    const r = joystick.getBoundingClientRect();

    const cx = r.left + r.width/2;
    const cy = r.top + r.height/2;

    let dx = x-cx;
    let dy = y-cy;

    const max = 55;
    const distance = Math.hypot(dx,dy);

    if(distance > max){
        dx = dx/distance*max;
        dy = dy/distance*max;
    }

    stick.style.left = `calc(50% + ${dx}px)`;
    stick.style.top = `calc(50% + ${dy}px)`;

    if(distance > 7){
        me.targetAngle = Math.atan2(dy,dx);
    }
}

function joystickReset(){
    joyId = null;

    stick.style.left = "50%";
    stick.style.top = "50%";
}

joystick.onpointerdown = e=>{
    joyId = e.pointerId;

    joystick.setPointerCapture(e.pointerId);

    joystickMove(e.clientX,e.clientY);
};

joystick.onpointermove = e=>{
    if(e.pointerId === joyId){
        joystickMove(e.clientX,e.clientY);
    }
};

joystick.onpointerup = joystickReset;
joystick.onpointercancel = joystickReset;

/* ATTACK */

document.getElementById("attack").onclick = attackNearest;

function attackNearest(){

    if(!running || dead){
        return;
    }

    let nearest = null;
    let nearestDistance = Infinity;

    for(const id in others){

        if(id === me.id){
            continue;
        }

        const p = others[id];

        if(!p || p.alive === false){
            continue;
        }

        const distance = Math.hypot(
            p.x-me.x,
            p.y-me.y
        );

        if(distance < nearestDistance){
            nearestDistance = distance;
            nearest = p;
        }
    }

    if(nearest && nearestDistance < 120){

        send({
            type:"attack",
            targetId:nearest.id
        });
    }
}

/* GAME */

function startGame(){

    running = true;
    dead = false;
    score = 0;

    document.getElementById("menu").style.display = "none";
    document.getElementById("hud").style.display = "flex";

    me.x = 1500 + Math.random()*9000;
    me.y = 1500 + Math.random()*9000;

    me.angle = Math.random()*Math.PI*2;
    me.targetAngle = me.angle;

    body = [];

    for(let i=0;i<me.length;i++){
        body.push({
            x:me.x-Math.cos(me.angle)*i*8,
            y:me.y-Math.sin(me.angle)*i*8
        });
    }
}

function update(){

    if(!running || dead){
        return;
    }

    keyboardDirection();

    let diff = me.targetAngle-me.angle;

    while(diff > Math.PI) diff -= Math.PI*2;
    while(diff < -Math.PI) diff += Math.PI*2;

    me.angle += diff*0.12;

    const speed = 5;

    me.x += Math.cos(me.angle)*speed;
    me.y += Math.sin(me.angle)*speed;

    me.x = Math.max(30,Math.min(WORLD-30,me.x));
    me.y = Math.max(30,Math.min(WORLD-30,me.y));

    body.unshift({
        x:me.x,
        y:me.y
    });

    while(body.length < Math.floor(me.length)){
        body.push({
            x:me.x,
            y:me.y
        });
    }

    while(body.length > Math.floor(me.length)){
        body.pop();
    }

    eatFood();

    send({
        type:"state",
        x:me.x,
        y:me.y,
        angle:me.angle,
        length:me.length,
        color:me.color,
        skin:me.skin,
        name:playerName()
    });

    document.getElementById("score").textContent =
        Math.floor(score);

    document.getElementById("length").textContent =
        Math.floor(me.length);
}

/* FOOD */

function eatFood(){

    for(let i=foods.length-1;i>=0;i--){

        const f = foods[i];

        if(
            Math.hypot(
                f.x-me.x,
                f.y-me.y
            ) < 25
        ){

            score += f.value;
            me.length += f.value*0.5;

            foods[i] = makeFood();
        }
    }
}

/* CAMERA */

let cameraX = me.x;
let cameraY = me.y;

function camera(){

    cameraX += (me.x-cameraX)*0.12;
    cameraY += (me.y-cameraY)*0.12;
}

/* DRAW */

function draw(){

    ctx.fillStyle = "#071008";
    ctx.fillRect(0,0,W,H);

    if(!running){
        return;
    }

    camera();

    ctx.save();

    ctx.translate(
        W/2-cameraX,
        H/2-cameraY
    );

    drawGrid();
    drawBorder();
    drawFood();
    drawOthers();
    drawMe();

    ctx.restore();

    drawMinimap();
}

function drawGrid(){

    const grid = 250;

    const left = cameraX-W/2-500;
    const right = cameraX+W/2+500;
    const top = cameraY-H/2-500;
    const bottom = cameraY+H/2+500;

    ctx.strokeStyle = "rgba(99,255,120,.05)";
    ctx.lineWidth = 1;

    for(
        let x=Math.floor(left/grid)*grid;
        x<right;
        x+=grid
    ){
        ctx.beginPath();
        ctx.moveTo(x,top);
        ctx.lineTo(x,bottom);
        ctx.stroke();
    }

    for(
        let y=Math.floor(top/grid)*grid;
        y<bottom;
        y+=grid
    ){
        ctx.beginPath();
        ctx.moveTo(left,y);
        ctx.lineTo(right,y);
        ctx.stroke();
    }
}

function drawBorder(){

    ctx.strokeStyle = "#63ff78";
    ctx.lineWidth = 18;

    ctx.strokeRect(
        0,
        0,
        WORLD,
        WORLD
    );
}

function drawFood(){

    for(const f of foods){

        if(
            Math.abs(f.x-cameraX)>W ||
            Math.abs(f.y-cameraY)>H
        ){
            continue;
        }

        ctx.fillStyle = f.color;
        ctx.shadowColor = f.color;
        ctx.shadowBlur = 10;

        ctx.beginPath();

        ctx.arc(
            f.x,
            f.y,
            f.r,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.shadowBlur = 0;
}

function drawHead(x,y,r,color,skin,angle){

    ctx.save();

    ctx.translate(x,y);
    ctx.rotate(angle);

    ctx.fillStyle = color;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        r,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.strokeStyle = "rgba(255,255,255,.5)";
    ctx.lineWidth = 2;

    ctx.stroke();

    ctx.fillStyle = "white";

    ctx.beginPath();
    ctx.arc(9,-7,6,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(9,7,6,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "#111";

    ctx.beginPath();
    ctx.arc(11,-7,3,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(11,7,3,0,Math.PI*2);
    ctx.fill();

    if(skin === "red"){
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 3;

        ctx.beginPath();
        ctx.moveTo(-10,-12);
        ctx.lineTo(10,12);
        ctx.moveTo(10,-12);
        ctx.lineTo(-10,12);
        ctx.stroke();
    }

    if(skin === "blue"){
        ctx.strokeStyle = "#d9f5ff";
        ctx.lineWidth = 4;

        ctx.beginPath();
        ctx.arc(0,0,r-4,0,Math.PI*2);
        ctx.stroke();
    }

    if(skin === "purple"){
        ctx.fillStyle = "#f2caff";

        for(let i=0;i<6;i++){

            const a = i*Math.PI/3;

            ctx.beginPath();

            ctx.arc(
                Math.cos(a)*15,
                Math.sin(a)*15,
                3,
                0,
                Math.PI*2
            );

            ctx.fill();
        }
    }

    ctx.restore();
}

function drawName(name,x,y){

    ctx.save();

    ctx.textAlign = "center";
    ctx.font = "bold 12px Arial";
    ctx.fillStyle = "white";

    ctx.shadowColor = "black";
    ctx.shadowBlur = 5;

    ctx.fillText(
        name,
        x,
        y
    );

    ctx.restore();
}

function drawMe(){

    for(
        let i=body.length-1;
        i>=0;
        i--
    ){

        const p = body[i];

        const progress = i/body.length;

        const r = 8+(1-progress)*8;

        ctx.fillStyle = me.color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            r,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    drawHead(
        me.x,
        me.y,
        21,
        me.color,
        me.skin,
        me.angle
    );

    drawName(
        playerName(),
        me.x,
        me.y-30
    );
}

function drawOthers(){

    for(const id in others){

        if(id === me.id){
            continue;
        }

        const p = others[id];

        if(!p || p.alive === false){
            continue;
        }

        const length =
            Math.min(
                180,
                Math.max(
                    20,
                    Math.floor(p.length || 20)
                )
            );

        for(let i=length-1;i>=0;i--){

            const x =
                p.x -
                Math.cos(p.angle)*i*8;

            const y =
                p.y -
                Math.sin(p.angle)*i*8;

            const progress = i/length;

            const r =
                8+(1-progress)*8;

            ctx.fillStyle =
                p.color || "#4da6ff";

            ctx.beginPath();

            ctx.arc(
                x,
                y,
                r,
                0,
                Math.PI*2
            );

            ctx.fill();
        }

        drawHead(
            p.x,
            p.y,
            21,
            p.color || "#4da6ff",
            p.skin || "green",
            p.angle
        );

        drawName(
            p.name || "Player",
            p.x,
            p.y-30
        );
    }
}

/* MINIMAP */

function drawMinimap(){

    const size = minimap.width;

    mapCtx.clearRect(0,0,size,size);

    mapCtx.fillStyle = "#061007";
    mapCtx.fillRect(0,0,size,size);

    for(const id in others){

        if(id === me.id){
            continue;
        }

        const p = others[id];

        if(!p || p.alive === false){
            continue;
        }

        mapCtx.fillStyle =
            p.color || "#ff5268";

        mapCtx.beginPath();

        mapCtx.arc(
            p.x/WORLD*size,
            p.y/WORLD*size,
            4,
            0,
            Math.PI*2
        );

        mapCtx.fill();
    }

    mapCtx.fillStyle = me.color;

    mapCtx.beginPath();

    mapCtx.arc(
        me.x/WORLD*size,
        me.y/WORLD*size,
        6,
        0,
        Math.PI*2
    );

    mapCtx.fill();

    mapCtx.strokeStyle = "#63ff78";
    mapCtx.lineWidth = 2;

    mapCtx.strokeRect(
        1,
        1,
        size-2,
        size-2
    );
}

/* KILL */

function showKill(){

    const el = document.getElementById("killText");

    el.classList.add("show");

    setTimeout(()=>{
        el.classList.remove("show");
    },900);
}

/* DEATH */

function die(reason){

    if(dead){
        return;
    }

    dead = true;
    running = false;

    document.getElementById("deathReason").textContent = reason;

    document.getElementById("finalScore").textContent =
        Math.floor(score);

    document.getElementById("gameOver").style.display = "flex";
}

/* LOOP */

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);
}

connect();
loop();
