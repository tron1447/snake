<style>

*{
box-sizing:border-box;
margin:0;
padding:0;

}

html,
body{
width:100%;
height:100%;

background:#071008;

}

canvas{

#menu{

radial-gradient(circle,#174d20,#050805 75%);

<script>

const WORLD=18000;

const canvas=
document.getElementById("game");

const ctx=
canvas.getContext("2d");

const mini=
document.getElementById("mini");

const mctx=
mini.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){

W=innerWidth;
H=innerHeight;

canvas.width=W;
canvas.height=H;

mini.width=400;
mini.height=400;

}

resize();

addEventListener(
"resize",
resize
);

/* ======================
 SAVE
====================== */

let coins=
Number(
localStorage.getItem("coins") || 0
);

let owned=
JSON.parse(
localStorage.getItem("owned")
|| '["green"]'
);

let currentSkin=
localStorage.getItem("skin")
|| "green";

const SKINS=[
["green","#63ff78",0],
["blue","#4da6ff",30],
["red","#ff5268",50],
["yellow","#ffd84d",80],
["purple","#b86cff",100],
["orange","#ff8a3d",120],
["cyan","#00e5d4",150],
["white","#ffffff",200]
];

function save(){

localStorage.setItem(
"coins",
coins
);

localStorage.setItem(
"owned",
JSON.stringify(owned)
);

localStorage.setItem(
"skin",
currentSkin
);

}

/* ======================
 PLAYER
====================== */

let player={
id:null,
name:"Player",
x:WORLD/2,
y:WORLD/2,
angle:0,
length:25,
score:0,
kills:0,
color:"#63ff78",
body:[]
};

let remote=
new Map();

let bots=[];

let running=false;
let dead=false;
let multiplayer=false;

let socket=null;
let myId=null;

/* ======================
 FOOD
====================== */

const food=[];

function makeFood(){

return{

x:100+
Math.random()*
(WORLD-200),

y:100+
Math.random()*
(WORLD-200),

r:4+
Math.random()*4,

value:1+
Math.floor(
Math.random()*3
),

color:[
"#63ff78",
"#ffd84d",
"#ff5268",
"#4da6ff",
"#b86cff",
"#ff8a3d"
][
Math.floor(
Math.random()*6
)
]

};

}

for(
let i=0;
i<1200;
i++
){

food.push(
makeFood()
);

}

/* ======================
 BOTS
====================== */

const botNames=[
"Viper",
"Cobra",
"Shadow",
"Blaze",
"Hunter",
"Ghost",
"Python",
"Storm",
"Ninja",
"Venom"
];

const botColors=[
"#4da6ff",
"#ff5268",
"#ffd84d",
"#b86cff",
"#ff8a3d",
"#00e5d4"
];

function createBot(){

const angle=
Math.random()*Math.PI*2;

const b={
id:
Math.random()
.toString(36)
.substring(2),

name:
botNames[
Math.floor(
Math.random()*
botNames.length
)
],

x:
500+
Math.random()*
(WORLD-1000),

y:
500+
Math.random()*
(WORLD-1000),

angle,
target:angle,

length:
25+
Math.random()*90,

score:0,

color:
botColors[
Math.floor(
Math.random()*
botColors.length
)
],

body:[],

think:0

};

for(
let i=0;
i<b.length;
i++
){

b.body.push({
x:
b.x-
Math.cos(angle)*i*8,

y:
b.y-
Math.sin(angle)*i*8
});

}

return b;

}

function makeBots(){

bots=[];

for(
let i=0;
i<18;
i++
){

bots.push(
createBot()
);

}

}

/* ======================
 RESET
====================== */

function resetPlayer(){

const angle=
Math.random()*
Math.PI*2;

player.x=
WORLD/2;

player.y=
WORLD/2;

player.angle=angle;

player.length=25;

player.score=0;
player.kills=0;

player.color=
SKINS.find(
s=>s[0]===currentSkin
)[1];

player.body=[];

for(
let i=0;
i<25;
i++
){

player.body.push({

x:
player.x-
Math.cos(angle)*i*8,

y:
player.y-
Math.sin(angle)*i*8

});

}

}

/* ======================
 CONTROL
====================== */

let targetAngle=0;

let mouseX=W/2;
let mouseY=H/2;

addEventListener(
"mousemove",
e=>{

mouseX=e.clientX;
mouseY=e.clientY;

}
);

function mouseControl(){

if(innerWidth<=800)
return;

const dx=
mouseX-W/2;

const dy=
mouseY-H/2;

if(
Math.hypot(dx,dy)>8
){

targetAngle=
Math.atan2(
dy,
dx
);

}

}

/* ======================
 JOYSTICK
====================== */

const joystick=
document.getElementById(
"joystick"
);

const stick=
document.getElementById(
"stick"
);

let joy=false;

function joystickMove(
x,
y
){

const r=
joystick.getBoundingClientRect();

const cx=
r.left+r.width/2;

const cy=
r.top+r.height/2;

let dx=x-cx;
let dy=y-cy;

const max=52;

const d=
Math.hypot(dx,dy);

if(d>max){

dx=dx/d*max;
dy=dy/d*max;

}

stick.style.left=
`calc(50% + ${dx}px)`;

stick.style.top=
`calc(50% + ${dy}px)`;

if(d>7){

targetAngle=
Math.atan2(
dy,
dx
);

}

}

joystick.addEventListener(
"pointerdown",
e=>{

joy=true;

joystick.setPointerCapture(
e.pointerId
);

joystickMove(
e.clientX,
e.clientY
);

}
);

joystick.addEventListener(
"pointermove",
e=>{

if(joy){

joystickMove(
e.clientX,
e.clientY
);

}

}
);

function joyStop(){

joy=false;

stick.style.left="50%";
stick.style.top="50%";

}

joystick.addEventListener(
"pointerup",
joyStop
);

joystick.addEventListener(
"pointercancel",
joyStop
);

/* ======================
 BOOST
====================== */

let boosting=false;

const boost=
document.getElementById(
"boost"
);

boost.addEventListener(
"pointerdown",
e=>{

e.preventDefault();

boosting=true;

}
);

boost.addEventListener(
"pointerup",
()=>{

boosting=false;

}
);

boost.addEventListener(
"pointercancel",
()=>{

boosting=false;

}
);

addEventListener(
"keydown",
e=>{

if(
e.key==="Shift" ||
e.key===" "
){

boosting=true;

}

}
);

addEventListener(
"keyup",
e=>{

if(
e.key==="Shift" ||
e.key===" "
){

boosting=false;

}

}
);

/* ======================
 SINGLE PLAYER
====================== */

function startSingle(){

multiplayer=false;

makeBots();

startGame();

}

/* ======================
 START
====================== */

function startGame(){

resetPlayer();

dead=false;
running=true;

document.getElementById(
"menu"
).style.display="none";

document.getElementById(
"hud"
).style.display="flex";

document.getElementById(
"leaderboard"
).style.display="block";

document.getElementById(
"minimap"
).style.display="block";

}

/* ======================
 PLAYER MOVEMENT
====================== */

function updatePlayer(){

if(!running || dead)
return;

mouseControl();

let diff=
targetAngle-player.angle;

while(diff>Math.PI)
diff-=Math.PI*2;

while(diff<-Math.PI)
diff+=Math.PI*2;

player.angle+=
diff*.16;

const speed=
boosting
?10
:7;

player.x+=
Math.cos(player.angle)*
speed;

player.y+=
Math.sin(player.angle)*
speed;

if(
player.x<30 ||
player.x>WORLD-30 ||
player.y<30 ||
player.y>WORLD-30
){

die(
"Kaardi serv!"
);

return;

}

player.body.unshift({

x:player.x,
y:player.y

});

while(
player.body.length<
Math.floor(player.length)
){

const last=
player.body[
player.body.length-1
] || {
x:player.x,
y:player.y
};

player.body.push({
x:last.x,
y:last.y
});

}

while(
player.body.length>
Math.floor(player.length)
){

player.body.pop();

}

eatFood();

}

/* ======================
 FOOD
====================== */

function eatFood(){

for(
let i=food.length-1;
i>=0;
i--
){

const f=food[i];

if(
Math.hypot(
player.x-f.x,
player.y-f.y
)<27
){

player.score+=
f.value;

player.length+=
f.value*.65;

food.splice(i,1);

food.push(
makeFood()
);

}

}

}

/* ======================
 BOT UPDATE
====================== */

function updateBots(){

for(
const b of bots
){

b.think--;

if(
b.think<=0
){

b.think=
30+
Math.random()*90;

let nearest=null;
let best=Infinity;

for(
let i=0;
i<food.length;
i+=8
){

const f=food[i];

const d=
Math.hypot(
f.x-b.x,
f.y-b.y
);

if(d<best){

best=d;
nearest=f;

}

}

if(nearest){

b.target=
Math.atan2(
nearest.y-b.y,
nearest.x-b.x
);

}

}

let d=
b.target-b.angle;

while(d>Math.PI)
d-=Math.PI*2;

while(d<-Math.PI)
d+=Math.PI*2;

b.angle+=d*.07;

b.x+=
Math.cos(b.angle)*5;

b.y+=
Math.sin(b.angle)*5;

if(
b.x<100 ||
b.x>WORLD-100
){

b.target=
Math.PI-b.target;

}

if(
b.y<100 ||
b.y>WORLD-100
){

b.target=
-b.target;

}

b.body.unshift({

x:b.x,
y:b.y

});

while(
b.body.length<
Math.floor(b.length)
){

const last=
b.body[
b.body.length-1
] || {
x:b.x,
y:b.y
};

b.body.push({
x:last.x,
y:last.y
});

}

while(
b.body.length>
Math.floor(b.length)
){

b.body.pop();

}

for(
let i=food.length-1;
i>=0;
i--
){

const f=food[i];

if(
Math.hypot(
b.x-f.x,
b.y-f.y
)<25
){

b.score+=
f.value;

b.length+=
f.value*.5;

food.splice(i,1);

food.push(
makeFood()
);

break;

}

}

}

botCombat();

}

/* ======================
 BOT COMBAT
====================== */

function botCombat(){

for(
const b of [...bots]
){

/*
BOT HEAD -> PLAYER BODY
*/

for(
let i=8;
i<player.body.length;
i+=2
){

const part=
player.body[i];

if(
Math.hypot(
b.x-part.x,
b.y-part.y
)<23
){

killBot(b);

break;

}

}

if(
!bots.includes(b)
)
continue;

/*
PLAYER HEAD -> BOT BODY
*/

for(
let i=8;
i<b.body.length;
i+=2
){

const part=
b.body[i];

if(
Math.hypot(
player.x-part.x,
player.y-part.y
)<24
){

die(
b.name+
" tabas sinu keha!"
);

return;

}

}

}

}

/* ======================
 KILL BOT
====================== */

function killBot(b){

const index=
bots.indexOf(b);

if(index<0)
return;

for(
let i=0;
i<b.body.length;
i+=5
){

const part=b.body[i];

food.push({

x:part.x,
y:part.y,

r:6,
value:2,

color:b.color

});

}

bots.splice(
index,
1
);

player.kills++;
player.score+=10;
player.length+=12;

coins+=10;

save();
updateCoins();
showKill();

setTimeout(
()=>{

if(
running &&
!dead &&
!multiplayer
){

bots.push(
createBot()
);

}

},
800
);

}

/* ======================
 DRAW SNAKE
====================== */

function drawSnake(
s,
parts
){

if(
!parts ||
!parts.length
)
return;

for(
let i=parts.length-1;
i>=0;
i--
){

const p=parts[i];

const t=
i/(parts.length-1||1);

const radius=
i===0
?23
:Math.max(
8,
11-t*3
);

ctx.fillStyle=
s.color;

ctx.beginPath();

ctx.arc(
p.x,
p.y,
radius,
0,
Math.PI*2
);

ctx.fill();

}

/*
HEAD
*/

ctx.save();

ctx.translate(
s.x,
s.y
);

ctx.rotate(
s.angle
);

ctx.fillStyle=
s.color;

ctx.beginPath();

ctx.arc(
0,
0,
24,
0,
Math.PI*2
);

ctx.fill();

ctx.fillStyle="white";

ctx.beginPath();

ctx.arc(
11,
-9,
7,
0,
Math.PI*2
);

ctx.fill();

ctx.beginPath();

ctx.arc(
11,
9,
7,
0,
Math.PI*2
);

ctx.fill();

ctx.fillStyle="#111";

ctx.beginPath();

ctx.arc(
13,
-9,
3,
0,
Math.PI*2
);

ctx.fill();

ctx.beginPath();

ctx.arc(
13,
9,
3,
0,
Math.PI*2
);

ctx.fill();

ctx.restore();

/*
NAME
*/

ctx.textAlign="center";

ctx.font=
"bold 14px Arial";

ctx.lineWidth=4;

ctx.strokeStyle=
"rgba(0,0,0,.85)";

ctx.strokeText(
s.name||"Player",
s.x,
s.y-36
);

ctx.fillStyle="white";

ctx.fillText(
s.name||"Player",
s.x,
s.y-36
);

}

/* ======================
 DRAW
====================== */

function draw(){

ctx.fillStyle="#071008";

ctx.fillRect(
0,
0,
W,
H
);

if(!running)
return;

ctx.save();

ctx.translate(
W/2-player.x,
H/2-player.y
);

/*
MAP
*/

ctx.fillStyle="#102414";

ctx.fillRect(
0,
0,
WORLD,
WORLD
);

/*
GRID
*/

ctx.strokeStyle=
"rgba(255,255,255,.035)";

const grid=100;

const left=
Math.floor(
(player.x-W/2)/grid
)*grid;

const right=
Math.ceil(
(player.x+W/2)/grid
)*grid;

for(
let x=left;
x<=right;
x+=grid
){

ctx.beginPath();

ctx.moveTo(
x,
player.y-H/2
);

ctx.lineTo(
x,
player.y+H/2
);

ctx.stroke();

}

const top=
Math.floor(
(player.y-H/2)/grid
)*grid;

const bottom=
Math.ceil(
(player.y+H/2)/grid
)*grid;

for(
let y=top;
y<=bottom;
y+=grid
){

ctx.beginPath();

ctx.moveTo(
player.x-W/2,
y
);

ctx.lineTo(
player.x+W/2,
y
);

ctx.stroke();

}

/*
FOOD
*/

for(
const f of food
){

if(
Math.abs(f.x-player.x)>
W/2+80 ||
Math.abs(f.y-player.y)>
H/2+80
)
continue;

ctx.fillStyle=f.color;

ctx.beginPath();

ctx.arc(
f.x,
f.y,
f.r,
0,
Math.PI*2
);

ctx.fill();

}

/*
BOTS
*/

for(
const b of bots
){

drawSnake(
b,
b.body
);

}

/*
REMOTE PLAYERS

SILUETA + KEHA
*/

for(
const p of remote.values()
){

if(p.alive!==false){

drawSnake(
p,
p.body
);

}

}

/*
PLAYER
*/

drawSnake(
player,
player.body
);

ctx.restore();

drawMinimap();

}

/* ======================
 MINIMAP
====================== */

function miniPoint(
x,
y,
color,
size
){

mctx.fillStyle=color;

mctx.beginPath();

mctx.arc(
x/WORLD*400,
y/WORLD*400,
size,
0,
Math.PI*2
);

mctx.fill();

}

function drawMinimap(){

mctx.clearRect(
0,
0,
400,
400
);

mctx.fillStyle=
"#102414";

mctx.fillRect(
0,
0,
400,
400
);

for(
const b of bots
){

miniPoint(
b.x,
b.y,
"#ff5268",
5
);

}

for(
const p of remote.values()
){

if(p.alive!==false){

miniPoint(
p.x,
p.y,
p.color||"#4da6ff",
5
);

}

}

miniPoint(
player.x,
player.y,
"#63ff78",
8
);

mctx.strokeStyle=
"#63ff78";

mctx.lineWidth=4;

mctx.strokeRect(
2,
2,
396,
396
);

}

/* ======================
 HUD
====================== */

function updateHUD(){

document.getElementById(
"score"
).textContent=
Math.floor(
player.score
);

document.getElementById(
"kills"
).textContent=
player.kills;

document.getElementById(
"length"
).textContent=
Math.floor(
player.length
);

"coins"

coins;

function updateLeaderboard(){

const all=[
{
name:player.name,
score:player.score,
color:player.color
}
];

for(
const b of bots
){

all.push({
name:b.name,
score:b.score,
color:b.color
});

}

for(
const p of remote.values()
){

all.push({
name:p.name,
score:p.score,
color:p.color
});

}

all.sort(
(a,b)=>
b.score-a.score
);

const box=
document.getElementById("lb");

box.innerHTML="";

all
.slice(0,3)
.forEach(
(p,i)=>{

const row=
document.createElement(
"div"
);

row.className="lbrow";

const n=
String(p.name)
.replace(
/[<>]/g,
""
);

row.innerHTML=
`
<span style="color:${p.color}">
${i+1}. ${n}
</span>
<b>${Math.floor(p.score)}</b>
`;

box.appendChild(row);

}
);

}

/* ======================
 WEBSOCKET
====================== */

function connect(){

const protocol=
location.protocol==="https:"
?"wss:"
:"ws:";

socket=
new WebSocket(
protocol+
"//"+
location.host
);

socket.onopen=()=>{

document.getElementById(
"status"
).textContent=
"🟢 Multiplayer ühendatud";

};

socket.onclose=()=>{

document.getElementById(
"status"
).textContent=
"🔴 Multiplayer katkes";

};

socket.onerror=()=>{

document.getElementById(
"status"
).textContent=
"🔴 Serveri ühenduse viga";

};

socket.onmessage=e=>{

let data;

try{
data=JSON.parse(e.data);
}
catch{
return;
}

if(
data.type==="connected"
){

myId=data.id;

}

if(
data.type==="created" ||
data.type==="joined"
){

multiplayer=true;

myId=data.id;

document.getElementById(
"room"
).style.display=
"block";

document.getElementById(
"roomCode"
).textContent=
data.code;

}

if(
data.type==="gameStart"
){

startGame();

}

if(
data.type==="state"
){

const mine=
data.players.find(
p=>p.id===myId
);

if(mine){

player.id=mine.id;
player.name=mine.name;
player.x=mine.x;
player.y=mine.y;
player.angle=mine.angle;
player.length=mine.length;
player.score=mine.score;
player.kills=mine.kills;
player.color=mine.color;

if(
Array.isArray(mine.body)
){

player.body=
mine.body;

}

}

remote.clear();

for(
const p of data.players
){

if(
p.id!==myId
){

remote.set(
p.id,
p
);

}

}

updateRoomPlayers(
data.players
);

}

if(
data.type==="kill"
){

if(
data.killer===myId
){

player.kills++;

player.score+=10;

player.length+=12;

coins+=10;

save();

showKill();

}

if(
data.victim===myId
){

die(
"Vastase pea tabas sinu keha!"
);

}

}

if(
data.type==="respawn"
){

if(
data.id===myId
){

dead=false;

document.getElementById(
"gameover"
).style.display=
"none";

running=true;

}

}

if(
data.type==="error"
){

document.getElementById(
"error"
).textContent=
data.message;

}

};

}

function send(data){

if(
socket &&
socket.readyState===
WebSocket.OPEN
){

socket.send(
JSON.stringify(data)
);

}

}

/*
INPUT SERVERILE

Saadame suuna kiiresti,
et teised mängijad ei jääks seisma.
*/

let lastInput=0;

function sendInput(){

if(
!multiplayer ||
!running ||
dead
)
return;

const now=
performance.now();

if(
now-lastInput<40
)
return;

send({

type:"input",

angle:player.angle,

boosting

});

lastInput=now;

}

/* ======================
 SHOP / SKINS
====================== */

function renderSkins(){

const box=
document.getElementById(
"skins"
);

box.innerHTML="";

for(
const s of SKINS
){

if(
!owned.includes(s[0])
)
continue;

const b=
document.createElement(
"button"
);

b.className="skin";

if(
currentSkin===s[0]
){

b.classList.add(
"selected"
);

}

b.style.background=
s[1];

b.onclick=()=>{

currentSkin=s[0];

save();

renderSkins();

};

box.appendChild(b);

}

}

function updateCoins(){

document.getElementById(
"menuCoins"
).textContent=
coins;

document.getElementById(
"coins"
).textContent=
coins;

}

/* ======================
 GAME LOOP
====================== */

function loop(){

if(running){

if(!multiplayer){

updateBots();

updatePlayer();

}else{

/*
multiplayer:
server annab positsiooni,
client saadab ainult inputi
*/

mouseControl();

player.angle=
lerpAngle(
player.angle,
targetAngle,
.12
);

sendInput();

}

updateHUD();

}

draw();

requestAnimationFrame(
loop
);

}

function lerpAngle(
a,
b,
amount
){

let d=b-a;

while(d>Math.PI)
d-=Math.PI*2;

while(d<-Math.PI)
d+=Math.PI*2;

return a+d*amount;

}

 BUTTONS

};

renderSkins();

connect();
