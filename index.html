<!DOCTYPE html>
<html lang="et">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>Snake Online 🐍</title>

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
touch-action:none;
}

html,
body{

margin:0;

width:100%;

height:100%;

overflow:hidden;

background:#020604;

font-family:Arial,sans-serif;

color:white;

}

#game{

position:fixed;

inset:0;

width:100vw;

height:100vh;

background:#06120a;

}

#menu{

position:fixed;

inset:0;

z-index:20;

display:flex;

align-items:center;

justify-content:center;

background:
radial-gradient(
circle at center,
rgba(25,100,45,.55),
rgba(0,0,0,.97)
);

}

.card{

width:min(92vw,440px);

padding:28px;

border-radius:26px;

background:
rgba(6,20,11,.97);

border:1px solid #32814b;

box-shadow:
0 20px 100px rgba(0,0,0,.8);

text-align:center;

}

.logo{

font-size:80px;

filter:
drop-shadow(
0 0 25px #3cff70
);

}

h1{

font-size:40px;

margin:0 0 18px;

color:#5cff8c;

text-shadow:
0 0 20px #35ff70;

}

input,
select{

width:100%;

padding:15px;

margin:6px 0;

border-radius:13px;

border:1px solid #285c39;

background:#061009;

color:white;

font-size:18px;

text-align:center;

outline:none;

}

button{

border:0;

border-radius:14px;

padding:15px;

font-size:18px;

font-weight:bold;

cursor:pointer;

}

.create{

width:100%;

margin-top:8px;

background:#3be174;

color:#031008;

}

.join{

width:100%;

margin-top:8px;

background:#3e91ff;

color:white;

}

#connection{

margin-top:13px;

font-size:14px;

color:#aaa;

}

#hud{

position:fixed;

top:10px;

left:50%;

transform:translateX(-50%);

z-index:5;

display:flex;

gap:7px;

pointer-events:none;

}

.stat{

min-width:78px;

padding:7px 11px;

border-radius:13px;

background:
rgba(4,14,7,.82);

border:
1px solid rgba(70,255,120,.3);

backdrop-filter:blur(8px);

text-align:center;

}

.stat small{

display:block;

color:#8fa693;

font-size:10px;

}

.stat b{

font-size:18px;

}

#room{

position:fixed;

top:75px;

left:50%;

transform:translateX(-50%);

z-index:5;

display:none;

padding:8px 16px;

background:
rgba(4,14,7,.84);

border:
1px solid rgba(70,255,120,.3);

border-radius:13px;

text-align:center;

pointer-events:none;

}

#roomCode{

font-size:27px;

font-weight:bold;

letter-spacing:5px;

color:#60ff92;

}

#players{

font-size:12px;

color:#aaa;

margin-top:3px;

}

#message{

font-size:12px;

color:#8cffaa;

margin-top:3px;

}

#controls{

position:fixed;

left:18px;

bottom:20px;

width:180px;

height:180px;

z-index:10;

}

.ctrl{

position:absolute;

width:60px;

height:60px;

border-radius:18px;

background:
rgba(16,50,27,.84);

border:
1px solid rgba(100,255,140,.35);

display:flex;

align-items:center;

justify-content:center;

font-size:28px;

color:white;

user-select:none;

}

.ctrl:active{

background:#2c7b43;

transform:scale(.9);

}

.up{

left:60px;

top:0;

}

.left{

left:0;

top:60px;

}

.down{

left:60px;

top:120px;

}

.right{

left:120px;

top:60px;

}

#boost{

position:fixed;

right:20px;

bottom:35px;

z-index:10;

width:88px;

height:88px;

border-radius:50%;

background:
radial-gradient(
circle,
#49a5ff,
#17579e
);

border:
2px solid #83c8ff;

color:white;

font-size:30px;

box-shadow:
0 0 35px rgba(50,150,255,.5);

}

#boost:active{

transform:scale(.9);

}

#boostText{

position:absolute;

top:53px;

left:50%;

transform:translateX(-50%);

font-size:9px;

font-weight:bold;

white-space:nowrap;

}

#death{

display:none;

position:fixed;

inset:0;

z-index:30;

align-items:center;

justify-content:center;

background:rgba(0,0,0,.72);

text-align:center;

}

.deathCard{

background:#0b180f;

border:
1px solid #39784a;

border-radius:22px;

padding:30px;

}

.deathCard h2{

font-size:45px;

margin:0;

}

#minimap{

position:fixed;

right:15px;

top:15px;

width:150px;

height:150px;

z-index:6;

background:
rgba(0,0,0,.5);

border:
1px solid rgba(100,255,140,.3);

border-radius:12px;

display:none;

}

@media(max-width:600px){

#minimap{

width:105px;

height:105px;

top:12px;

right:10px;

}

#hud{

left:8px;

transform:none;

}

.stat{

min-width:65px;

padding:6px 8px;

}

}

@media(min-width:800px){

#controls,
#boost{

opacity:.7;

}

}

</style>

</head>


<body>


<canvas id="game"></canvas>

<canvas id="minimap"></canvas>


<div id="menu">

<div class="card">

<div class="logo">
🐍
</div>

<h1>
SNAKE ONLINE
</h1>

<input
id="name"
maxlength="12"
placeholder="Sinu nimi">

<select id="mode">

<option value="classic">
🍎 Classic
</option>

<option value="power">

</option>

</option>

</select>

<input
id="roomInput"
maxlength="6"
placeholder="ROOM CODE">

class="join"
onclick="joinRoom()">

🔵 LIITU TUPA

🟡 Ühendan serveriga...

<b id="score">
0
</b>

0

<b id="count">
0
</b>

</div>

</div>

<div>
ROOM
</div>

<div id="roomCode">
------
</div>

</div>

</div>

</div>

class="ctrl up"
data-dir="up">

⬆️

</div>

data-dir="left">

⬅️

</div>

<div
class="ctrl down"
data-dir="down">

⬇️

</div>

class="ctrl right"
data-dir="right">

➡️

</div>

</div>


<button id="boost">

⚡

<span id="boostText">
SHIFT / SPACE
</span>

</button>

<div class="deathCard">

<h2>
💀
</h2>

<h3>
Su said pihta!
</h3>

Respawn...
</p>

</div>

</div>


<script>

/* =========================
   SERVER
========================= */

const SERVER_URL =
"wss://snake-riu3.onrender.com";


let socket = null;

let myId = null;

let roomCode = null;


/* =========================
   GAME STATE
========================= */

let state = {

width:150,

height:150,

players:{},

food:[],

powerups:[],

walls:[],

mode:"classic"

};


/* =========================
   CANVAS
========================= */

const canvas =
document.getElementById(
"game"
);

const ctx =
canvas.getContext("2d");

const minimap =
document.getElementById(
"minimap"
);

const miniCtx =
minimap.getContext("2d");


let W =
innerWidth;

let H =
innerHeight;


function resize(){

W =
innerWidth;

H =
innerHeight;


const dpr =
Math.min(
devicePixelRatio || 1,
2
);


canvas.width =
Math.floor(
W * dpr
);

canvas.height =
Math.floor(
H * dpr
);


canvas.style.width =
W + "px";

canvas.style.height =
H + "px";


ctx.setTransform(
dpr,
0,
0,
dpr,
0,
0
);


minimap.width =
minimap.clientWidth *
dpr;

minimap.height =
minimap.clientHeight *
dpr;


miniCtx.setTransform(
dpr,
0,
0,
dpr,
0,
0
);

}


addEventListener(
"resize",
resize
);

resize();


/* =========================
   CONNECT
========================= */

function connect(){

socket =
new WebSocket(
SERVER_URL
);


socket.onopen = () => {

document.getElementById(
"connection"
).textContent =
"🟢 Serveriga ühendatud!";

};


socket.onmessage = event => {

let data;

try{

data =
JSON.parse(
event.data
);

}catch{

return;

}


if(
data.type ===
"connected"
){

myId =
data.id;

}


if(
data.type ===
"roomCreated" ||
data.type ===
"roomJoined"
){

roomCode =
data.room;


document.getElementById(
"menu"
).style.display =
"none";


document.getElementById(
"room"
).style.display =
"block";


document.getElementById(
"roomCode"
).textContent =
roomCode;


document.getElementById(
"minimap"
).style.display =
"block";

}


if(
data.type ===
"state"
){

state =
data.state;

updateUI();

}


if(
data.type ===
"start"
){

document.getElementById(
"message"
).textContent =
"🔥 MÄNG ALGAS!";

}


if(
data.type ===
"winner"
){

alert(
"🏆 Võitja: " +
data.winner.name +
"\nScore: " +
data.winner.score
);

}


if(
data.type ===
"error"
){

alert(
data.message
);

}

};


socket.onerror = () => {

document.getElementById(
"connection"
).textContent =
"🔴 Serveri viga";

};


socket.onclose = () => {

document.getElementById(
"connection"
).textContent =
"🔴 Ühendus katkes";

};

}


/* =========================
   SEND
========================= */

function send(data){

if(
socket &&
socket.readyState ===
WebSocket.OPEN
){

socket.send(
JSON.stringify(data)
);

}

}


/* =========================
   CREATE ROOM
========================= */

function createRoom(){

const name =
document.getElementById(
"name"
).value.trim();

const mode =
document.getElementById(
"mode"
).value;


if(!name){

alert(
"Kirjuta kõigepealt nimi!"
);

return;

}


send({

type:
"createRoom",

name:
name,

mode:
mode

});

}


/* =========================
   JOIN ROOM
========================= */

function joinRoom(){

const name =
document.getElementById(
"name"
).value.trim();

const room =
document.getElementById(
"roomInput"
).value
.trim()
.toUpperCase();


if(!name){

alert(
"Kirjuta kõigepealt nimi!"
);

return;

}


if(
room.length !== 6
){

alert(
"Room Code peab olema 6 märki!"
);

return;

}


send({

type:
"joinRoom",

name:
name,

room:
room

});

}


/* =========================
   DIRECTION
========================= */

function changeDirection(
direction
){

send({

type:
"direction",

direction:
direction

});

}


/* =========================
   TOUCH CONTROLS
========================= */

document
.querySelectorAll(
".ctrl"
)
.forEach(
button => {

let lastPress = 0;


function press(event){

event.preventDefault();

event.stopPropagation();


const now =
Date.now();


if(
now - lastPress <
100
){

return;

}


lastPress =
now;


changeDirection(
button.dataset.dir
);

}


button.addEventListener(
"touchstart",
press,
{
passive:false
}
);


button.addEventListener(
"mousedown",
press
);

}
);


/* =========================
   BOOST
========================= */

let boostHeld = false;


function doBoost(){

send({
type:"boost"
});

}


const boostButton =
document.getElementById(
"boost"
);


boostButton.addEventListener(
"touchstart",
event => {

event.preventDefault();

doBoost();

},
{
passive:false
}
);


boostButton.addEventListener(
"click",
event => {

event.preventDefault();

doBoost();

}
);


/* =========================
   KEYBOARD
========================= */

document.addEventListener(
"keydown",
event => {

const directions = {

ArrowUp:"up",

w:"up",

W:"up",

ArrowDown:"down",

s:"down",

S:"down",

ArrowLeft:"left",

a:"left",

A:"left",

ArrowRight:"right",

d:"right",

D:"right"

};


if(
directions[event.key]
){

event.preventDefault();

changeDirection(
directions[event.key]
);

}


/*
   SHIFT BOOST
*/

if(
event.code ===
"ShiftLeft" ||
event.code ===
"ShiftRight"
){

event.preventDefault();

if(!event.repeat){

doBoost();

}

}


/*
   SPACE BOOST
*/

if(
event.code ===
"Space"
){

event.preventDefault();

if(!event.repeat){

doBoost();

}

}

}
);


/* =========================
   UI
========================= */

function updateUI(){

const me =
state.players?.[
myId
];


if(me){

document.getElementById(
"score"
).textContent =
me.score;


document.getElementById(
"coins"
).textContent =
me.coins;


document.getElementById(
"death"
).style.display =
me.alive
? "none"
: "flex";

}


document.getElementById(
"count"
).textContent =
Object.keys(
state.players || {}
).length;


document.getElementById(
"players"
).textContent =
Object.values(
state.players || {}
)
.map(
player =>
"🐍 " +
player.name +
" " +
player.score
)
.join(" • ");

}


/* =========================
   CAMERA
========================= */

let camera = {

x:0,

y:0

};


function getCamera(){

const me =
state.players?.[
myId
];


if(
!me ||
!me.snake ||
!me.snake.length
){

return {

x:camera.x,

y:camera.y,

zoom:.40

};

}


const CELL = 20;


const head =
me.snake[0];


const worldWidth =
state.width *
CELL;


const worldHeight =
state.height *
CELL;


/*
   PALJU ROHKEM ZOOM OUT
*/

let zoom =
0.40;


if(
me.snake.length > 20
){

zoom =
0.36;

}


if(
me.snake.length > 40
){

zoom =
0.32;

}


if(
me.snake.length > 70
){

zoom =
0.28;

}


const viewWidth =
W / zoom;


const viewHeight =
H / zoom;


let targetX =
head.x * CELL +
CELL / 2 -
viewWidth / 2;


let targetY =
head.y * CELL +
CELL / 2 -
viewHeight / 2;


targetX =
Math.max(
0,
Math.min(
targetX,
worldWidth - viewWidth
)
);


targetY =
Math.max(
0,
Math.min(
targetY,
worldHeight - viewHeight
)
);


/*
   Sujuv jälitamine
*/

camera.x +=
(
targetX -
camera.x
) * 0.16;


camera.y +=
(
targetY -
camera.y
) * 0.16;


return {

x:camera.x,

y:camera.y,

zoom:zoom

};

}


/* =========================
   DRAW
========================= */

function draw(){

requestAnimationFrame(
draw
);


ctx.clearRect(
0,
0,
W,
H
);


const cameraData =
getCamera();


const CELL = 20;


/*
   TUMEDAM TAUST
*/

ctx.fillStyle =
"#020604";

ctx.fillRect(
0,
0,
W,
H
);


ctx.save();


/*
   KAAMERA
*/

ctx.translate(
W / 2,
H / 2
);

ctx.scale(
cameraData.zoom,
cameraData.zoom
);

ctx.translate(
-W / 2,
-H / 2
);


ctx.translate(
-cameraData.x,
-cameraData.y
);


/*
   WORLD
*/

const worldWidth =
state.width *
CELL;


const worldHeight =
state.height *
CELL;


ctx.fillStyle =
"#07150c";

ctx.fillRect(
0,
0,
worldWidth,
worldHeight
);


/*
   GRID
*/

ctx.strokeStyle =
"rgba(100,255,130,.055)";

ctx.lineWidth = 1;


const startX =
Math.floor(
cameraData.x / CELL
) * CELL;


const startY =
Math.floor(
cameraData.y / CELL
) * CELL;


const visibleWidth =
W / cameraData.zoom;


const visibleHeight =
H / cameraData.zoom;


for(
let x = startX;
x < cameraData.x +
visibleWidth +
CELL;
x += CELL
){

ctx.beginPath();

ctx.moveTo(
x,
cameraData.y
);

ctx.lineTo(
x,
cameraData.y +
visibleHeight
);

ctx.stroke();

}


for(
let y = startY;
y < cameraData.y +
visibleHeight +
CELL;
y += CELL
){

ctx.beginPath();

ctx.moveTo(
cameraData.x,
y
);

ctx.lineTo(
cameraData.x +
visibleWidth,
y
);

ctx.stroke();

}


/*
   WORLD BORDER
*/

ctx.strokeStyle =
"#3ee878";

ctx.lineWidth = 8;

ctx.strokeRect(
0,
0,
worldWidth,
worldHeight
);


/*
   WALLS
*/

(state.walls || [])
.forEach(
wall => {

ctx.fillStyle =
"#3c4940";

ctx.fillRect(
wall.x * CELL,
wall.y * CELL,
CELL,
CELL
);

ctx.fillStyle =
"rgba(255,255,255,.08)";

ctx.fillRect(
wall.x * CELL + 2,
wall.y * CELL + 2,
CELL - 4,
4
);

}
);


/*
   FOOD
*/

(state.food || [])
.forEach(
food => {

const x =
food.x * CELL +
CELL / 2;

const y =
food.y * CELL +
CELL / 2;


ctx.shadowColor =
"#ff3155";

ctx.shadowBlur = 18;

ctx.fillStyle =
"#ff3155";


ctx.beginPath();

ctx.arc(
x,
y,
CELL * .30,
0,
Math.PI * 2
);

ctx.fill();


ctx.shadowBlur = 0;

}
);


/*
   POWERUPS
*/

const powerColors = {

speed:"#42a5ff",

shield:"#b65cff",

coin:"#ffd43b"

};


const powerIcons = {

speed:"⚡",

shield:"🛡️",

coin:"🪙"

};


(state.powerups || [])
.forEach(
power => {

const x =
power.x * CELL +
CELL / 2;

const y =
power.y * CELL +
CELL / 2;


ctx.fillStyle =
powerColors[
power.type
];


ctx.shadowColor =
ctx.fillStyle;

ctx.shadowBlur = 16;


ctx.beginPath();

ctx.arc(
x,
y,
CELL * .38,
0,
Math.PI * 2
);

ctx.fill();


ctx.shadowBlur = 0;


ctx.font =
"14px Arial";

ctx.textAlign =
"center";

ctx.textBaseline =
"middle";

ctx.fillStyle =
"#06120a";

ctx.fillText(
powerIcons[
power.type
],
x,
y
);

}
);


/*
   SNAKES
*/

Object.values(
state.players || {}
)
.forEach(
player => {

if(
!player.snake
)
return;


player.snake.forEach(
(part,index) => {

let color =
player.color;


if(
player.id === myId
){

color =
"#55ff83";


if(
player.boost > 0
){

color =
"#55aaff";

}

}


ctx.fillStyle =
color;

ctx.shadowColor =
color;

ctx.shadowBlur =
index === 0
? 18
: 5;


ctx.beginPath();

ctx.roundRect(
part.x * CELL + 2,
part.y * CELL + 2,
CELL - 4,
CELL - 4,
6
);

ctx.fill();


ctx.shadowBlur = 0;


/*
   HEAD
*/

if(
index === 0
){

ctx.fillStyle =
"#06120a";


ctx.beginPath();

ctx.arc(
part.x * CELL + 6,
part.y * CELL + 6,
2.5,
0,
Math.PI * 2
);

ctx.fill();


ctx.beginPath();

ctx.arc(
part.x * CELL + 14,
part.y * CELL + 6,
2.5,
0,
Math.PI * 2
);

ctx.fill();


/*
   shield
*/

if(
player.shield
){

ctx.strokeStyle =
"#c05cff";

ctx.lineWidth = 3;

ctx.beginPath();

ctx.arc(
part.x * CELL + 10,
part.y * CELL + 10,
14,
0,
Math.PI * 2
);

ctx.stroke();

}


/*
   BOOST GLOW
*/

if(
player.boost > 0
){

ctx.strokeStyle =
"#65baff";

ctx.lineWidth = 3;

ctx.beginPath();

ctx.arc(
part.x * CELL + 10,
part.y * CELL + 10,
17,
0,
Math.PI * 2
);

ctx.stroke();

}

}

}
);

});


ctx.restore();


drawMinimap();

}


/* =========================
   MINIMAP
========================= */

function drawMinimap(){

if(
minimap.style.display ===
"none"
){

return;

}


const mw =
minimap.clientWidth;

const mh =
minimap.clientHeight;


miniCtx.clearRect(
0,
0,
mw,
mh
);


miniCtx.fillStyle =
"rgba(5,15,8,.8)";

miniCtx.fillRect(
0,
0,
mw,
mh
);


const sx =
mw /
state.width;


const sy =
mh /
state.height;


/*
   FOOD
*/

miniCtx.fillStyle =
"#ff3155";


(state.food || [])
.forEach(
food => {

miniCtx.fillRect(
food.x * sx,
food.y * sy,
2,
2
);

}
);


/*
   PLAYERS
*/

Object.values(
state.players || {}
)
.forEach(
player => {

if(
!player.snake ||
!player.snake.length
)
return;


const head =
player.snake[0];


miniCtx.fillStyle =
player.id === myId
? "#63ff91"
: player.color;


miniCtx.beginPath();

miniCtx.arc(
head.x * sx,
head.y * sy,
3,
0,
Math.PI * 2
);

miniCtx.fill();

}
);


/*
   BORDER
*/

miniCtx.strokeStyle =
"rgba(100,255,140,.6)";

miniCtx.strokeRect(
0,
0,
mw,
mh
);

}


/* =========================
   START
========================= */

connect();

draw();

</script>

</body>

</html>
