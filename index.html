<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Snake Arena</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050805;
    font-family:Arial,sans-serif;
}

canvas{
    position:fixed;
    inset:0;
}

button,input{
    font:inherit;
}

#menu{
    position:fixed;
    inset:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:auto;
    padding:20px;
    background:
        radial-gradient(circle at 50% 20%,#245f2d,#091709 45%,#020402);
}

.panel{
    width:min(94vw,460px);
    max-height:calc(100vh - 40px);
    overflow:auto;
    padding:28px;
    border-radius:25px;
    background:rgba(4,12,5,.98);
    border:1px solid #315b36;
    box-shadow:0 0 60px rgba(99,255,120,.15);
    color:white;
    text-align:center;
}

.logo{
    font-size:65px;
}

h1{
    color:#63ff78;
    font-size:40px;
}

.sub{
    color:#829384;
    margin:5px 0 20px;
}

input{
    width:100%;
    height:48px;
    margin:5px 0;
    padding:0 15px;
    border-radius:12px;
    border:1px solid #315c37;
    background:#071007;
    color:white;
    text-align:center;
    outline:none;
}

.btn{
    width:100%;
    height:48px;
    margin-top:8px;
    border-radius:12px;
    border:0;
    font-weight:bold;
    cursor:pointer;
}

.green{
    background:#63ff78;
    color:#031006;
}

.dark{
    background:#102014;
    color:white;
    border:1px solid #315b36;
}

#skins{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    margin:12px 0;
}

.skin{
    width:52px;
    height:52px;
    border-radius:50%;
    border:3px solid transparent;
    font-size:22px;
}

.skin.selected{
    border-color:white;
    transform:scale(1.1);
}

#roomBox{
    display:none;
    margin-top:15px;
}

#roomCode{
    color:#63ff78;
    font-size:32px;
    font-weight:bold;
    letter-spacing:5px;
    margin:5px;
}

#players{
    max-height:150px;
    overflow:auto;
    margin-top:10px;
}

.player{
    padding:8px;
    margin:4px;
    border-radius:8px;
    background:#0b170d;
}

#error{
    min-height:22px;
    margin-top:8px;
    color:#ff6878;
}

#connection{
    margin-top:8px;
    color:#78907c;
    font-size:12px;
}

#hud{
    display:none;
    position:fixed;
    z-index:10;
    top:10px;
    left:10px;
    gap:6px;
}

.stat{
    min-width:75px;
    padding:7px 10px;
    border-radius:10px;
    background:rgba(0,0,0,.7);
    border:1px solid rgba(99,255,120,.3);
    color:white;
}

.stat small{
    display:block;
    color:#78907c;
    font-size:9px;
}

.stat b{
    font-size:16px;
}

#leaderboard{
    position:fixed;
    z-index:15;
    top:10px;
    right:10px;
    width:190px;
    padding:10px;
    border-radius:12px;
    background:rgba(0,0,0,.7);
    border:1px solid rgba(99,255,120,.3);
    color:white;
}

#leaderboard h3{
    color:#63ff78;
    font-size:13px;
    margin-bottom:5px;
}

.lb{
    display:flex;
    justify-content:space-between;
    padding:3px 0;
    font-size:12px;
}

#minimap{
    position:fixed;
    z-index:12;
    right:10px;
    top:150px;
    width:150px;
    height:150px;
    border-radius:15px;
    border:2px solid #63ff78;
    background:#061007;
}

#joystick{
    position:fixed;
    z-index:20;
    left:25px;
    bottom:25px;
    width:145px;
    height:145px;
    border-radius:50%;
    border:2px solid rgba(99,255,120,.4);
    background:rgba(99,255,120,.08);
    display:none;
}

#stick{
    position:absolute;
    left:50%;
    top:50%;
    width:62px;
    height:62px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:#63ff78;
    border:3px solid white;
}

#boost{
    position:fixed;
    z-index:20;
    right:25px;
    bottom:35px;
    width:90px;
    height:90px;
    border-radius:50%;
    border:3px solid #a5e3ff;
    background:#087bb0;
    color:white;
    font-size:28px;
    display:none;
}

#gameOver{
    display:none;
    position:fixed;
    z-index:70;
    inset:0;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.8);
}

.over{
    width:min(90vw,400px);
    padding:30px;
    border-radius:25px;
    background:#081008;
    border:1px solid #315b36;
    color:white;
    text-align:center;
}

.over h2{
    color:#ff596c;
    font-size:38px;
    margin-bottom:10px;
}

#killText{
    position:fixed;
    z-index:40;
    left:50%;
    top:25%;
    transform:translate(-50%,-50%) scale(.6);
    opacity:0;
    color:#63ff78;
    font-size:38px;
    font-weight:900;
    text-shadow:0 0 20px #63ff78;
    transition:.2s;
}

#killText.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
}

@media(max-width:800px){
    #joystick,#boost{
        display:block;
    }

    #leaderboard{
        width:145px;
        top:10px;
        right:10px;
        font-size:11px;
    }

    #minimap{
        top:125px;
        width:120px;
        height:120px;
    }

    #hud{
        transform:scale(.85);
        transform-origin:top left;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="menu">
<div class="panel">

<div class="logo">🐍</div>
<h1>SNAKE ARENA</h1>
<div class="sub">Eat • Grow • Fight</div>

<input id="name" maxlength="16" placeholder="Sinu nimi">

<h3>🎨 Skin</h3>

<div id="skins">

<button class="skin selected" data-color="#63ff78">🐍</button>
<button class="skin" data-color="#4da6ff">😎</button>
<button class="skin" data-color="#ff5570">😈</button>
<button class="skin" data-color="#ffd84d">😄</button>
<button class="skin" data-color="#b86cff">👾</button>
<button class="skin" data-color="#ff8a3d">🔥</button>
<button class="skin" data-color="#ffffff">👻</button>
<button class="skin" data-color="#00e5d4">🤖</button>

</div>

<button id="create" class="btn green">
🏠 CREATE ROOM
</button>

<input id="roomInput" maxlength="6" placeholder="ROOM CODE">

<button id="join" class="btn dark">
🚪 JOIN ROOM
</button>

<div id="roomBox">

<div style="color:#829384;font-size:11px">
ROOM CODE
</div>

<div id="roomCode">------</div>

<div id="players"></div>

<button id="start" class="btn green">
▶ START GAME
</button>

</div>

<div id="error"></div>
<div id="connection">🟡 Ühendamine...</div>

</div>
</div>

<div id="hud">

<div class="stat">
<small>SCORE</small>
<b id="score">0</b>
</div>

<div class="stat">
<small>LENGTH</small>
<b id="length">20</b>
</div>

<div class="stat">
<small>KILLS</small>
<b id="kills">0</b>
</div>

</div>

<div id="leaderboard">
<h3>🏆 TOP 3</h3>
<div id="lb"></div>
</div>

<canvas id="minimap" width="150" height="150"></canvas>

<div id="killText">💥 ELIMINATED!</div>

<div id="joystick">
<div id="stick"></div>
</div>

<button id="boost">⚡</button>

<div id="gameOver">
<div class="over">

<h2>GAME OVER</h2>

<p id="reason">Sind tapetud!</p>

<p style="margin-top:10px">
Skoor: <b id="finalScore">0</b>
</p>

<button class="btn green" onclick="location.reload()">
🔄 TAGASI MENÜÜS
</button>

</div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const minimap=document.getElementById("minimap");
const mctx=minimap.getContext("2d");

const WORLD=20000;

let W=innerWidth;
let H=innerHeight;

function resize(){
    W=innerWidth;
    H=innerHeight;
    canvas.width=W;
    canvas.height=H;
}

addEventListener("resize",resize);
resize();

const foods=[];

const foodColors=[
    "#63ff78",
    "#ffd84d",
    "#ff6075",
    "#55c9ff",
    "#c76cff",
    "#ff963d"
];

for(let i=0;i<1200;i++){
    foods.push({
        x:Math.random()*WORLD,
        y:Math.random()*WORLD,
        r:3+Math.random()*4,
        color:foodColors[Math.floor(Math.random()*foodColors.length)],
        value:1+Math.floor(Math.random()*4)
    });
}

const me={
    id:null,
    x:10000,
    y:10000,
    angle:0,
    targetAngle:0,
    length:20,
    color:"#63ff78",
    name:"Player",
    alive:true
};

let body=[];
let others={};

let score=0;
let kills=0;
let running=false;
let dead=false;
let boosting=false;

let socket=null;
let connected=false;

function setError(t){
    document.getElementById("error").textContent=t||"";
}

function playerName(){
    return (
        document.getElementById("name").value.trim() ||
        "Player"
    ).slice(0,16);
}

document.querySelectorAll(".skin").forEach(b=>{
    b.onclick=()=>{
        document.querySelectorAll(".skin")
        .forEach(x=>x.classList.remove("selected"));

        b.classList.add("selected");
        me.color=b.dataset.color;
    };
});

function connect(){

    const protocol=
        location.protocol==="https:"
        ?"wss:"
        :"ws:";

    socket=new WebSocket(
        protocol+"//"+location.host
    );

    socket.onopen=()=>{
        connected=true;
        document.getElementById("connection").textContent=
            "🟢 Server ühendatud";
    };

    socket.onclose=()=>{
        connected=false;
        document.getElementById("connection").textContent=
            "🔴 Ühendus katkes";
    };

    socket.onerror=()=>{
        document.getElementById("connection").textContent=
            "🔴 Serveri viga";
    };

    socket.onmessage=e=>{
        try{
            handle(JSON.parse(e.data));
        }catch{}
    };
}

function send(data){
    if(!socket || socket.readyState!==WebSocket.OPEN){
        return false;
    }

    socket.send(JSON.stringify(data));
    return true;
}

function handle(data){

    if(data.type==="connected"){
        me.id=data.id;
    }

    if(data.type==="roomCreated" ||
       data.type==="roomJoined"){

        me.id=data.id;
        document.getElementById("roomBox").style.display="block";
        document.getElementById("roomCode").textContent=data.code;
        setError("");
    }

    if(data.type==="lobby"){
        const box=document.getElementById("players");
        box.innerHTML="";

        data.players.forEach(p=>{
            const div=document.createElement("div");
            div.className="player";
            div.style.color=p.color||"white";

            div.textContent=
                (p.host?"👑 ":"🐍 ")+
                p.name;

            box.appendChild(div);
        });

        document.getElementById("start").style.display=
            data.players.length ? "block":"none";
    }

    if(data.type==="gameStart"){
        me.id=data.id;
        startGame();
    }

    if(data.type==="players"){
        others=data.players||{};
        updateLeaderboard();
    }

    if(data.type==="playerKilled"){

        if(data.killer===me.id){
            kills++;
            showKill();
        }

        if(data.id===me.id){
            die("Sind tapetud!");
        }
    }

    if(data.type==="gameOver"){
        die(data.reason||"Sind tapetud!");
    }

    if(data.type==="error"){
        setError(data.message);
    }
}

document.getElementById("create").onclick=()=>{
    setError("");

    if(!connected){
        setError("Serveriga ei saa ühendust.");
        return;
    }

    send({
        type:"createRoom",
        name:playerName(),
        color:me.color
    });
};

document.getElementById("join").onclick=()=>{
    setError("");

    const code=
        document.getElementById("roomInput")
        .value.trim().toUpperCase();

    if(code.length!==6){
        setError("Sisesta 6-kohaline room code.");
        return;
    }

    if(!connected){
        setError("Serveriga ei saa ühendust.");
        return;
    }

    send({
        type:"joinRoom",
        code,
        name:playerName(),
        color:me.color
    });
};

document.getElementById("start").onclick=()=>{
    send({type:"startGame"});
};

const keys={};

addEventListener("keydown",e=>{
    keys[e.key.toLowerCase()]=true;

    if(e.key==="Shift"){
        boosting=true;
    }
});

addEventListener("keyup",e=>{
    keys[e.key.toLowerCase()]=false;

    if(e.key==="Shift"){
        boosting=false;
    }
});

function keyboard(){

    let dx=0;
    let dy=0;

    if(keys.w || keys.arrowup)dy--;
    if(keys.s || keys.arrowdown)dy++;
    if(keys.a || keys.arrowleft)dx--;
    if(keys.d || keys.arrowright)dx++;

    if(dx || dy){
        me.targetAngle=Math.atan2(dy,dx);
    }
}

addEventListener("mousemove",e=>{
    if(!running || innerWidth<=800)return;

    const dx=e.clientX-W/2;
    const dy=e.clientY-H/2;

    if(Math.hypot(dx,dy)>15){
        me.targetAngle=Math.atan2(dy,dx);
    }
});

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joyId=null;

function joyMove(x,y){

    const r=joystick.getBoundingClientRect();

    const cx=r.left+r.width/2;
    const cy=r.top+r.height/2;

    let dx=x-cx;
    let dy=y-cy;

    const max=55;
    const d=Math.hypot(dx,dy);

    if(d>max){
        dx=dx/d*max;
        dy=dy/d*max;
    }

    stick.style.left=
        `calc(50% + ${dx}px)`;

    stick.style.top=
        `calc(50% + ${dy}px)`;

    if(d>7){
        me.targetAngle=Math.atan2(dy,dx);
    }
}

function joyReset(){
    joyId=null;
    stick.style.left="50%";
    stick.style.top="50%";
}

joystick.onpointerdown=e=>{
    joyId=e.pointerId;
    joystick.setPointerCapture(e.pointerId);
    joyMove(e.clientX,e.clientY);
};

joystick.onpointermove=e=>{
    if(e.pointerId===joyId){
        joyMove(e.clientX,e.clientY);
    }
};

joystick.onpointerup=joyReset;
joystick.onpointercancel=joyReset;

const boost=document.getElementById("boost");

boost.onpointerdown=()=>{
    boosting=true;
};

boost.onpointerup=()=>{
    boosting=false;
};

boost.onpointercancel=()=>{
    boosting=false;
};

function startGame(){

    running=true;
    dead=false;
    me.alive=true;

    score=0;
    kills=0;

    document.getElementById("menu").style.display="none";
    document.getElementById("hud").style.display="flex";

    me.x=3000+Math.random()*14000;
    me.y=3000+Math.random()*14000;

    me.angle=Math.random()*Math.PI*2;
    me.targetAngle=me.angle;

    body=[];

    for(let i=0;i<20;i++){
        body.push({
            x:me.x-Math.cos(me.angle)*i*10,
            y:me.y-Math.sin(me.angle)*i*10
        });
    }
}

function update(){

    if(!running || dead)return;

    keyboard();

    let diff=me.targetAngle-me.angle;

    while(diff>Math.PI)diff-=Math.PI*2;
    while(diff<-Math.PI)diff+=Math.PI*2;

    me.angle+=diff*.16;

    let speed=boosting?8.2:5.2;

    me.x+=Math.cos(me.angle)*speed;
    me.y+=Math.sin(me.angle)*speed;

    me.x=Math.max(20,Math.min(WORLD-20,me.x));
    me.y=Math.max(20,Math.min(WORLD-20,me.y));

    body.unshift({
        x:me.x,
        y:me.y
    });

    const target=Math.floor(me.length);

    while(body.length>target){
        body.pop();
    }

    while(body.length<target){
        body.push({
            x:me.x,
            y:me.y
        });
    }

    eat();

    if(boosting && me.length>22){
        me.length-=.025;
    }

    checkWorldKills();

    document.getElementById("score").textContent=Math.floor(score);
    document.getElementById("length").textContent=Math.floor(me.length);
    document.getElementById("kills").textContent=kills;

    sendState();
}

let lastSend=0;

function sendState(){

    const now=performance.now();

    if(now-lastSend<60)return;

    lastSend=now;

    send({
        type:"state",
        x:me.x,
        y:me.y,
        angle:me.angle,
        length:me.length,
        color:me.color,
        name:playerName()
    });
}

function eat(){

    for(let i=foods.length-1;i>=0;i--){

        const f=foods[i];

        if(Math.hypot(f.x-me.x,f.y-me.y)<24){

            score+=f.value;
            me.length+=f.value*.5;

            foods[i]={
                x:Math.random()*WORLD,
                y:Math.random()*WORLD,
                r:3+Math.random()*4,
                color:foodColors[
                    Math.floor(Math.random()*foodColors.length)
                ],
                value:1+Math.floor(Math.random()*4)
            };
        }
    }
}

function checkWorldKills(){

    const headRadius=18;

    if(
        me.x<20 ||
        me.y<20 ||
        me.x>WORLD-20 ||
        me.y>WORLD-20
    ){
        die("Läksid kaardi serva!");
        return;
    }

    for(const id in others){

        if(id===me.id)continue;

        const p=others[id];

        if(!p || !p.alive)continue;

        const enemyLength=Math.min(
            300,
            Math.floor(p.length||20)
        );

        for(let i=0;i<enemyLength;i++){

            const bx=
                p.x-
                Math.cos(p.angle)*
                i*9;

            const by=
                p.y-
                Math.sin(p.angle)*
                i*9;

            if(Math.hypot(me.x-bx,me.y-by)<20){

                if(i<3){
                    die("Teise mao pea tabas sind!");
                    return;
                }
            }
        }

        const distance=Math.hypot(
            p.x-me.x,
            p.y-me.y
        );

        if(distance<30){

            if(me.length>p.length+2){

                send({
                    type:"kill",
                    target:id
                });
            }
        }
    }
}

function updateCamera(){

    cameraX+=(me.x-cameraX)*.12;
    cameraY+=(me.y-cameraY)*.12;
}

let cameraX=10000;
let cameraY=10000;

function draw(){

    ctx.fillStyle="#071008";
    ctx.fillRect(0,0,W,H);

    if(!running)return;

    updateCamera();

    ctx.save();

    ctx.translate(
        W/2-cameraX,
        H/2-cameraY
    );

    drawGrid();
    drawBorder();
    drawFood();
    drawOthers();
    drawMe();

    ctx.restore();

    drawMinimap();
}

function drawGrid(){

    const size=250;

    const left=cameraX-W;
    const right=cameraX+W;
    const top=cameraY-H;
    const bottom=cameraY+H;

    ctx.strokeStyle="rgba(99,255,120,.05)";
    ctx.lineWidth=1;

    for(
        let x=Math.floor(left/size)*size;
        x<right;
        x+=size
    ){
        ctx.beginPath();
        ctx.moveTo(x,top);
        ctx.lineTo(x,bottom);
        ctx.stroke();
    }

    for(
        let y=Math.floor(top/size)*size;
        y<bottom;
        y+=size
    ){
        ctx.beginPath();
        ctx.moveTo(left,y);
        ctx.lineTo(right,y);
        ctx.stroke();
    }
}

function drawBorder(){

    ctx.strokeStyle="#63ff78";
    ctx.lineWidth=20;
    ctx.shadowColor="#63ff78";
    ctx.shadowBlur=25;

    ctx.strokeRect(
        0,
        0,
        WORLD,
        WORLD
    );

    ctx.shadowBlur=0;
}

function drawFood(){

    for(const f of foods){

        if(
            Math.abs(f.x-cameraX)>W ||
            Math.abs(f.y-cameraY)>H
        )continue;

        ctx.fillStyle=f.color;
        ctx.shadowColor=f.color;
        ctx.shadowBlur=10;

        ctx.beginPath();

        ctx.arc(
            f.x,
            f.y,
            f.r,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.shadowBlur=0;
}

function drawSnakeBody(points,color){

    if(!points.length)return;

    for(let i=points.length-1;i>=0;i--){

        const p=points[i];

        const progress=i/points.length;

        const radius=
            9+
            (1-progress)*10;

        ctx.globalAlpha=
            .75+
            (1-progress)*.25;

        ctx.fillStyle=color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            radius,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.globalAlpha=1;
}

function drawHead(x,y,angle,color){

    ctx.save();

    ctx.translate(x,y);
    ctx.rotate(angle);

    ctx.fillStyle=color;
    ctx.shadowColor=color;
    ctx.shadowBlur=20;

    ctx.beginPath();
    ctx.arc(0,0,22,0,Math.PI*2);
    ctx.fill();

    ctx.shadowBlur=0;

    ctx.fillStyle="white";

    ctx.beginPath();
    ctx.arc(9,-8,6,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(9,8,6,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#111";

    ctx.beginPath();
    ctx.arc(11,-8,3,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(11,8,3,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle="#111";
    ctx.lineWidth=2;

    ctx.beginPath();
    ctx.moveTo(15,-4);
    ctx.lineTo(19,0);
    ctx.lineTo(15,4);
    ctx.stroke();

    ctx.restore();
}

function drawName(name,x,y){

    ctx.save();

    ctx.textAlign="center";
    ctx.font="bold 13px Arial";
    ctx.fillStyle="white";
    ctx.strokeStyle="black";
    ctx.lineWidth=4;

    ctx.strokeText(name,x,y);
    ctx.fillText(name,x,y);

    ctx.restore();
}

function drawMe(){

    drawSnakeBody(
        body,
        me.color
    );

    drawHead(
        me.x,
        me.y,
        me.angle,
        me.color
    );

    drawName(
        playerName(),
        me.x,
        me.y-32
    );
}

function drawOthers(){

    for(const id in others){

        if(id===me.id)continue;

        const p=others[id];

        if(!p || !p.alive)continue;

        const length=Math.min(
            300,
            Math.max(
                20,
                Math.floor(p.length||20)
            )
        );

        const points=[];

        for(let i=0;i<length;i++){

            points.push({
                x:
                    p.x-
                    Math.cos(p.angle)*i*9,

                y:
                    p.y-
                    Math.sin(p.angle)*i*9
            });
        }

        drawSnakeBody(
            points,
            p.color||"#4da6ff"
        );

        drawHead(
            p.x,
            p.y,
            p.angle,
            p.color||"#4da6ff"
        );

        drawName(
            p.name||"Player",
            p.x,
            p.y-32
        );
    }
}

function drawMinimap(){

    const s=minimap.width;

    mctx.clearRect(0,0,s,s);

    mctx.fillStyle="#061007";
    mctx.fillRect(0,0,s,s);

    for(const id in others){

        if(id===me.id)continue;

        const p=others[id];

        if(!p || !p.alive)continue;

        mctx.fillStyle=p.color||"#4da6ff";

        mctx.beginPath();

        mctx.arc(
            p.x/WORLD*s,
            p.y/WORLD*s,
            4,
            0,
            Math.PI*2
        );

        mctx.fill();
    }

    mctx.fillStyle=me.color;

    mctx.beginPath();

    mctx.arc(
        me.x/WORLD*s,
        me.y/WORLD*s,
        5,
        0,
        Math.PI*2
    );

    mctx.fill();

    mctx.strokeStyle="#63ff78";
    mctx.lineWidth=2;
    mctx.strokeRect(1,1,s-2,s-2);
}

function updateLeaderboard(){

    const list=[];

    list.push({
        name:playerName(),
        score:score,
        length:me.length,
        color:me.color,
        me:true
    });

    for(const id in others){

        const p=others[id];

        if(!p)continue;

        list.push({
            name:p.name||"Player",
            score:p.score||0,
            length:p.length||20,
            color:p.color||"white"
        });
    }

    list.sort((a,b)=>{
        return b.length-a.length;
    });

    const top=list.slice(0,3);

    document.getElementById("lb").innerHTML=
        top.map((p,i)=>`
            <div class="lb">
                <span style="color:${p.color}">
                    ${i+1}. ${escapeHtml(p.name)}
                </span>
                <b>${Math.floor(p.length)}</b>
            </div>
        `).join("");
}

function escapeHtml(t){

    return String(t)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;");
}

function showKill(){

    const el=document.getElementById("killText");

    el.classList.add("show");

    setTimeout(()=>{
        el.classList.remove("show");
    },900);
}

function die(reason){

    if(dead)return;

    dead=true;
    running=false;
    boosting=false;
    me.alive=false;

    document.getElementById("reason").textContent=reason;

    document.getElementById("finalScore").textContent=
        Math.floor(score);

    document.getElementById("gameOver").style.display="flex";
}

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);
}

connect();
loop();
</script>

</body>
</html>
