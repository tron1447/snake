<!DOCTYPE html>
<html lang="et">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0,user-scalable=no"
>

<title>Snake Online 🐍</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
  touch-action:none;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#020604;
  color:white;
  font-family:Arial,sans-serif;
}

#game{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
}

.hidden{
  display:none !important;
}

/* MAIN MENU */

#menu{
  position:fixed;
  inset:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      circle at center,
      rgba(25,100,45,.55),
      rgba(0,0,0,.97)
    );
}

.card{
  width:min(92vw,440px);
  padding:28px;
  border-radius:26px;

  background:rgba(6,20,11,.97);

  border:1px solid #32814b;

  box-shadow:
    0 20px 100px rgba(0,0,0,.8);

  text-align:center;
}

.logo{
  font-size:75px;
  filter:drop-shadow(0 0 25px #3cff70);
}

h1{
  font-size:38px;
  margin:0 0 18px;
  color:#5cff8c;
}

input,select{
  width:100%;
  padding:15px;
  margin:6px 0;

  border-radius:13px;
  border:1px solid #285c39;

  background:#061009;
  color:white;

  font-size:18px;
  text-align:center;
}

button{
  border:0;
  border-radius:14px;
  padding:15px;
  font-size:18px;
  font-weight:bold;
  cursor:pointer;
}

.create{
  width:100%;
  margin-top:8px;
  background:#3be174;
  color:#031008;
}

.join{
  width:100%;
  margin-top:8px;
  background:#3e91ff;
  color:white;
}

#connection{
  margin-top:13px;
  color:#aaa;
}

/* LOBBY */

#lobby{
  position:fixed;
  inset:0;
  z-index:25;

  display:none;

  align-items:center;
  justify-content:center;

  background:
    radial-gradient(
      circle at center,
      rgba(20,80,40,.7),
      rgba(0,0,0,.98)
    );
}

.lobbyCard{
  width:min(94vw,500px);
  padding:28px;

  border-radius:28px;

  background:
    rgba(5,18,10,.98);

  border:
    1px solid #397f4c;

  box-shadow:
    0 30px 100px rgba(0,0,0,.85);

  text-align:center;
}

.lobbyTitle{
  font-size:34px;
  color:#60ff92;
  font-weight:bold;
}

.codeLabel{
  margin-top:15px;
  color:#8fa693;
}

#bigRoomCode{
  font-size:48px;
  letter-spacing:9px;
  color:#6cff99;

  margin:8px 0 18px;

  text-shadow:
    0 0 25px rgba(60,255,120,.5);
}

.copyBtn{
  background:#203b28;
  color:#a9ffbd;
  margin-bottom:18px;
}

#lobbyPlayers{
  text-align:left;
  margin:10px 0 20px;
}

.player{
  display:flex;
  align-items:center;
  gap:10px;

  padding:10px;
  margin:5px 0;

  background:#0a1b0e;
  border-radius:12px;
}

.playerDot{
  width:15px;
  height:15px;
  border-radius:50%;
}

.host{
  margin-left:auto;
  color:#ffd75c;
  font-size:12px;
}

#waiting{
  color:#91a99a;
  margin:15px 0;
}

#startButton{
  width:100%;
  background:#42ed7a;
  color:#031008;
  font-size:21px;
}

#startButton:disabled{
  opacity:.35;
}

#leaveButton{
  width:100%;
  margin-top:8px;
  background:#321417;
  color:#ff8790;
}

/* HUD */

#hud{
  position:fixed;
  top:10px;
  left:50%;
  transform:translateX(-50%);

  z-index:5;

  display:flex;
  gap:7px;

  pointer-events:none;
}

.stat{
  min-width:78px;

  padding:7px 11px;

  border-radius:13px;

  background:rgba(4,14,7,.82);

  border:
    1px solid rgba(70,255,120,.3);

  backdrop-filter:blur(8px);

  text-align:center;
}

.stat small{
  display:block;
  color:#8fa693;
  font-size:10px;
}

.stat b{
  font-size:18px;
}

/* ROOM */

#room{
  position:fixed;
  top:75px;
  left:50%;
  transform:translateX(-50%);

  z-index:5;

  display:none;

  padding:8px 16px;

  background:rgba(4,14,7,.84);

  border:
    1px solid rgba(70,255,120,.3);

  border-radius:13px;

  text-align:center;

  pointer-events:none;
}

#roomCode{
  font-size:27px;
  font-weight:bold;
  letter-spacing:5px;
  color:#60ff92;
}

#players{
  font-size:12px;
  color:#aaa;
}

#message{
  font-size:12px;
  color:#8cffaa;
}

/* CONTROLS */

#controls{
  position:fixed;
  left:18px;
  bottom:20px;

  width:180px;
  height:180px;

  z-index:10;
}

.ctrl{
  position:absolute;

  width:60px;
  height:60px;

  border-radius:18px;

  background:rgba(16,50,27,.84);

  border:
    1px solid rgba(100,255,140,.35);

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:28px;
}

.ctrl:active{
  background:#2c7b43;
  transform:scale(.9);
}

.up{
  left:60px;
  top:0;
}

.left{
  left:0;
  top:60px;
}

.down{
  left:60px;
  top:120px;
}

.right{
  left:120px;
  top:60px;
}

/* BOOST */

#boost{
  position:fixed;

  right:20px;
  bottom:35px;

  z-index:10;

  width:88px;
  height:88px;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      #49a5ff,
      #17579e
    );

  border:
    2px solid #83c8ff;

  color:white;

  font-size:30px;

  box-shadow:
    0 0 35px rgba(50,150,255,.5);
}

#boost:active{
  transform:scale(.9);
}

#boostText{
  position:absolute;
  top:53px;
  left:50%;

  transform:translateX(-50%);

  font-size:9px;
  white-space:nowrap;
}

/* DEATH */

#death{
  display:none;

  position:fixed;
  inset:0;

  z-index:30;

  align-items:center;
  justify-content:center;

  background:rgba(0,0,0,.72);

  text-align:center;
}

.deathCard{
  background:#0b180f;

  border:
    1px solid #39784a;

  border-radius:22px;

  padding:30px;
}

/* MINIMAP */

#minimap{
  position:fixed;

  right:15px;
  top:15px;

  width:150px;
  height:150px;

  z-index:6;

  background:rgba(0,0,0,.5);

  border:
    1px solid rgba(100,255,140,.3);

  border-radius:12px;

  display:none;
}

@media(max-width:600px){

  #minimap{
    width:105px;
    height:105px;
    top:12px;
    right:10px;
  }

  #hud{
    left:8px;
    transform:none;
  }

  .stat{
    min-width:65px;
    padding:6px 8px;
  }

  #bigRoomCode{
    font-size:39px;
  }

}

</style>

</head>

<body>

<canvas id="game"></canvas>

<canvas id="minimap"></canvas>


<!-- MAIN MENU -->

<div id="menu">

  <div class="card">

    <div class="logo">🐍</div>

    <h1>SNAKE ONLINE</h1>

    <input
      id="name"
      maxlength="12"
      placeholder="Sinu nimi"
    >

    <select id="mode">

      <option value="classic">
        🍎 Classic
      </option>

      <option value="battle">
        ⚔️ Battle
      </option>

      <option value="power">
        ⚡ Power Rush
      </option>

      <option value="maze">
        🧱 Maze
      </option>

      <option value="last">
        💀 Last Snake
      </option>

    </select>

    <button
      class="create"
      onclick="createRoom()"
    >
      🟢 LOO TUBA
    </button>

    <input
      id="roomInput"
      maxlength="6"
      placeholder="ROOM CODE"
    >

    <button
      class="join"
      onclick="joinRoom()"
    >
      🔵 LIITU TUPA
    </button>

    <div id="connection">
      🟡 Ühendan serveriga...
    </div>

  </div>

</div>


<!-- LOBBY -->

<div id="lobby">

  <div class="lobbyCard">

    <div class="lobbyTitle">
      🐍 SNAKE ROOM
    </div>

    <div class="codeLabel">
      Jaga seda koodi sõpradega:
    </div>

    <div id="bigRoomCode">
      ------
    </div>

    <button
      class="copyBtn"
      onclick="copyRoomCode()"
    >
      📋 KOPI ROOME CODE
    </button>

    <div id="lobbyPlayers"></div>

    <div id="waiting">
      ⏳ Ootame mängijaid...
    </div>

    <button
      id="startButton"
      onclick="startGame()"
    >
      🚀 START GAME
    </button>

    <button
      id="leaveButton"
      onclick="leaveRoom()"
    >
      ← LAHKU
    </button>

  </div>

</div>


<!-- HUD -->

<div id="hud">

  <div class="stat">
    <small>SCORE</small>
    <b id="score">0</b>
  </div>

  <div class="stat">
    <small>🪙 COINS</small>
    <b id="coins">0</b>
  </div>

  <div class="stat">
    <small>👥</small>
    <b id="count">0</b>
  </div>

</div>


<div id="room">

  <div>ROOM</div>

  <div id="roomCode">
    ------
  </div>

  <div id="players"></div>

  <div id="message"></div>

</div>


<!-- CONTROLS -->

<div id="controls">

  <div class="ctrl up" data-dir="up">
    ⬆️
  </div>

  <div class="ctrl left" data-dir="left">
    ⬅️
  </div>

  <div class="ctrl down" data-dir="down">
    ⬇️
  </div>

  <div class="ctrl right" data-dir="right">
    ➡️
  </div>

</div>


<button id="boost">
  ⚡
  <span id="boostText">
    SHIFT / SPACE
  </span>
</button>


<div id="death">

  <div class="deathCard">

    <h2>💀</h2>

    <h3>Su said pihta!</h3>

    <p>Respawn...</p>

  </div>

</div>


<script>

const SERVER_URL =
  "wss://snake-riu3.onrender.com";

let socket = null;
let myId = null;
let roomCode = null;

let isHost = false;

let gameStarted = false;

let state = {
  width:150,
  height:150,
  players:{},
  food:[],
  powerups:[],
  walls:[],
  mode:"classic",
  started:false,
  hostId:null
};


/* CANVAS */

const canvas =
  document.getElementById("game");

const ctx =
  canvas.getContext("2d");

const minimap =
  document.getElementById("minimap");

const miniCtx =
  minimap.getContext("2d");

let W = innerWidth;
let H = innerHeight;

function resize(){

  W = innerWidth;
  H = innerHeight;

  const dpr =
    Math.min(devicePixelRatio || 1,2);

  canvas.width =
    Math.floor(W*dpr);

  canvas.height =
    Math.floor(H*dpr);

  canvas.style.width =
    W+"px";

  canvas.style.height =
    H+"px";

  ctx.setTransform(
    dpr,0,0,dpr,0,0
  );

  minimap.width =
    minimap.clientWidth*dpr;

  minimap.height =
    minimap.clientHeight*dpr;

  miniCtx.setTransform(
    dpr,0,0,dpr,0,0
  );
}

addEventListener(
  "resize",
  resize
);

resize();


/* CONNECT */

function connect(){

  socket =
    new WebSocket(SERVER_URL);

  socket.onopen = () => {

    document.getElementById(
      "connection"
    ).textContent =
      "🟢 Serveriga ühendatud!";

  };

  socket.onmessage = event => {

    let data;

    try{
      data = JSON.parse(event.data);
    }catch{
      return;
    }

    if(data.type === "connected"){
      myId = data.id;
    }

    if(
      data.type === "roomCreated" ||
      data.type === "roomJoined"
    ){

      roomCode = data.room;

      isHost =
        data.host === true;

      showLobby();

    }

    if(data.type === "lobby"){

      roomCode = data.room;

      isHost =
        data.hostId === myId;

      updateLobby(data);

    }

    if(data.type === "gameStarted"){

      gameStarted = true;

      hideLobby();

      document.getElementById(
        "room"
      ).style.display = "block";

      document.getElementById(
        "minimap"
      ).style.display = "block";

    }

    if(data.type === "state"){

      state = data.state;

      gameStarted =
        data.state.started === true;

      if(gameStarted){
        hideLobby();
      }

      updateUI();

    }

    if(data.type === "winner"){

      alert(
        "🏆 Võitja: " +
        data.winner.name +
        "\nScore: " +
        data.winner.score
      );

    }

    if(data.type === "error"){

      alert(data.message);

    }

  };

  socket.onerror = () => {

    document.getElementById(
      "connection"
    ).textContent =
      "🔴 Serveri viga";

  };

  socket.onclose = () => {

    document.getElementById(
      "connection"
    ).textContent =
      "🔴 Ühendus katkes";

  };

}


/* SEND */

function send(data){

  if(
    socket &&
    socket.readyState === WebSocket.OPEN
  ){

    socket.send(
      JSON.stringify(data)
    );

  }

}


/* CREATE ROOM */

function createRoom(){

  const name =
    document.getElementById(
      "name"
    ).value.trim();

  const mode =
    document.getElementById(
      "mode"
    ).value;

  if(!name){

    alert(
      "Kirjuta kõigepealt nimi!"
    );

    return;

  }

  send({
    type:"createRoom",
    name:name,
    mode:mode
  });

}


/* JOIN */

function joinRoom(){

  const name =
    document.getElementById(
      "name"
    ).value.trim();

  const room =
    document.getElementById(
      "roomInput"
    ).value
      .trim()
      .toUpperCase();

  if(!name){

    alert(
      "Kirjuta kõigepealt nimi!"
    );

    return;

  }

  if(room.length !== 6){

    alert(
      "Room Code peab olema 6 märki!"
    );

    return;

  }

  send({
    type:"joinRoom",
    name:name,
    room:room
  });

}


/* SHOW LOBBY */

function showLobby(){

  document.getElementById(
    "menu"
  ).style.display = "none";

  document.getElementById(
    "lobby"
  ).style.display = "flex";

  document.getElementById(
    "bigRoomCode"
  ).textContent =
    roomCode;

  document.getElementById(
    "startButton"
  ).style.display =
    isHost ? "block" : "none";

  document.getElementById(
    "waiting"
  ).textContent =
    isHost
      ? "👑 Sina oled host. Oota sõpru ja vajuta START GAME."
      : "⏳ Ootame, kuni host mängu alustab...";

}


/* UPDATE LOBBY */

function updateLobby(data){

  document.getElementById(
    "bigRoomCode"
  ).textContent =
    data.room;

  const players =
    data.players || [];

  const box =
    document.getElementById(
      "lobbyPlayers"
    );

  box.innerHTML = "";

  players.forEach(player => {

    const div =
      document.createElement("div");

    div.className = "player";

    const dot =
      document.createElement("span");

    dot.className =
      "playerDot";

    dot.style.background =
      player.color;

    const name =
      document.createElement("span");

    name.textContent =
      player.name;

    div.appendChild(dot);
    div.appendChild(name);

    if(player.id === data.hostId){

      const host =
        document.createElement("span");

      host.className = "host";

      host.textContent =
        "👑 HOST";

      div.appendChild(host);

    }

    box.appendChild(div);

  });


  isHost =
    data.hostId === myId;


  const startButton =
    document.getElementById(
      "startButton"
    );


  startButton.style.display =
    isHost ? "block" : "none";


  document.getElementById(
    "waiting"
  ).textContent =
    isHost
      ? `👑 Sina oled host • ${players.length}/8 mängijat`
      : `⏳ Ootame hosti • ${players.length}/8 mängijat`;

}


/* COPY */

function copyRoomCode(){

  if(!roomCode)
    return;

  navigator.clipboard
    .writeText(roomCode)
    .then(() => {

      document.getElementById(
        "waiting"
      ).textContent =
        "✅ Room Code kopeeritud!";

    })
    .catch(() => {

      alert(
        "Room Code: " + roomCode
      );

    });

}


/* START */

function startGame(){

  if(!isHost){

    alert(
      "Ainult host saab mängu alustada!"
    );

    return;

  }

  send({
    type:"startGame"
  });

}


/* LEAVE */

function leaveRoom(){

  location.reload();

}


/* HIDE LOBBY */

function hideLobby(){

  document.getElementById(
    "lobby"
  ).style.display = "none";

}


/* DIRECTION */

function changeDirection(direction){

  if(!gameStarted)
    return;

  send({
    type:"direction",
    direction:direction
  });

}


/* TOUCH */

document
  .querySelectorAll(".ctrl")
  .forEach(button => {

    function press(event){

      event.preventDefault();

      changeDirection(
        button.dataset.dir
      );

    }

    button.addEventListener(
      "touchstart",
      press,
      {passive:false}
    );

    button.addEventListener(
      "mousedown",
      press
    );

  });


/* BOOST */

function doBoost(){

  if(!gameStarted)
    return;

  send({
    type:"boost"
  });

}

document
  .getElementById("boost")
  .addEventListener(
    "touchstart",
    e => {

      e.preventDefault();

      doBoost();

    },
    {passive:false}
  );


document
  .getElementById("boost")
  .addEventListener(
    "click",
    doBoost
  );


/* KEYBOARD */

document.addEventListener(
  "keydown",
  event => {

    const dirs = {

      ArrowUp:"up",
      w:"up",
      W:"up",

      ArrowDown:"down",
      s:"down",
      S:"down",

      ArrowLeft:"left",
      a:"left",
      A:"left",

      ArrowRight:"right",
      d:"right",
      D:"right"

    };

    if(dirs[event.key]){

      event.preventDefault();

      changeDirection(
        dirs[event.key]
      );

    }

    if(
      event.code === "ShiftLeft" ||
      event.code === "ShiftRight" ||
      event.code === "Space"
    ){

      event.preventDefault();

      if(!event.repeat){
        doBoost();
      }

    }

  }
);


/* UI */

function updateUI(){

  const me =
    state.players?.[myId];

  if(me){

    document.getElementById(
      "score"
    ).textContent =
      me.score;

    document.getElementById(
      "coins"
    ).textContent =
      me.coins;

    document.getElementById(
      "death"
    ).style.display =
      me.alive
        ? "none"
        : "flex";

  }

  const players =
    Object.values(
      state.players || {}
    );

  document.getElementById(
    "count"
  ).textContent =
    players.length;

  document.getElementById(
    "roomCode"
  ).textContent =
    roomCode || "------";

  document.getElementById(
    "players"
  ).textContent =
    players
      .map(
        p =>
          "🐍 " +
          p.name +
          " " +
          p.score
      )
      .join(" • ");

}


/* CAMERA */

let camera = {
  x:0,
  y:0
};

function getCamera(){

  const me =
    state.players?.[myId];

  if(
    !me ||
    !me.snake ||
    !me.snake.length
  ){

    return {
      x:camera.x,
      y:camera.y,
      zoom:.40
    };

  }

  const CELL = 20;

  const head =
    me.snake[0];

  const worldWidth =
    state.width * CELL;

  const worldHeight =
    state.height * CELL;

  let zoom = .40;

  if(me.snake.length > 20)
    zoom = .36;

  if(me.snake.length > 40)
    zoom = .32;

  if(me.snake.length > 70)
    zoom = .28;

  const viewWidth =
    W / zoom;

  const viewHeight =
    H / zoom;

  let targetX =
    head.x * CELL +
    CELL / 2 -
    viewWidth / 2;

  let targetY =
    head.y * CELL +
    CELL / 2 -
    viewHeight / 2;

  targetX =
    Math.max(
      0,
      Math.min(
        targetX,
        worldWidth - viewWidth
      )
    );

  targetY =
    Math.max(
      0,
      Math.min(
        targetY,
        worldHeight - viewHeight
      )
    );

  camera.x +=
    (targetX - camera.x) * .16;

  camera.y +=
    (targetY - camera.y) * .16;

  return {
    x:camera.x,
    y:camera.y,
    zoom:zoom
  };

}


/* DRAW */

function draw(){

  requestAnimationFrame(draw);

  ctx.clearRect(
    0,
    0,
    W,
    H
  );

  const cam =
    getCamera();

  const CELL = 20;

  ctx.fillStyle =
    "#020604";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

  ctx.save();

  ctx.translate(
    W/2,
    H/2
  );

  ctx.scale(
    cam.zoom,
    cam.zoom
  );

  ctx.translate(
    -W/2,
    -H/2
  );

  ctx.translate(
    -cam.x,
    -cam.y
  );

  const worldWidth =
    state.width * CELL;

  const worldHeight =
    state.height * CELL;

  ctx.fillStyle =
    "#07150c";

  ctx.fillRect(
    0,
    0,
    worldWidth,
    worldHeight
  );

  /* GRID */

  ctx.strokeStyle =
    "rgba(100,255,130,.055)";

  ctx.lineWidth = 1;

  const startX =
    Math.floor(cam.x/CELL)*CELL;

  const startY =
    Math.floor(cam.y/CELL)*CELL;

  const visibleWidth =
    W/cam.zoom;

  const visibleHeight =
    H/cam.zoom;

  for(
    let x=startX;
    x<cam.x+visibleWidth+CELL;
    x+=CELL
  ){

    ctx.beginPath();

    ctx.moveTo(
      x,
      cam.y
    );

    ctx.lineTo(
      x,
      cam.y+visibleHeight
    );

    ctx.stroke();

  }

  for(
    let y=startY;
    y<cam.y+visibleHeight+CELL;
    y+=CELL
  ){

    ctx.beginPath();

    ctx.moveTo(
      cam.x,
      y
    );

    ctx.lineTo(
      cam.x+visibleWidth,
      y
    );

    ctx.stroke();

  }

  /* BORDER */

  ctx.strokeStyle =
    "#3ee878";

  ctx.lineWidth = 8;

  ctx.strokeRect(
    0,
    0,
    worldWidth,
    worldHeight
  );

  /* WALLS */

  (state.walls || [])
    .forEach(wall => {

      ctx.fillStyle =
        "#3c4940";

      ctx.fillRect(
        wall.x*CELL,
        wall.y*CELL,
        CELL,
        CELL
      );

    });

  /* FOOD */

  (state.food || [])
    .forEach(food => {

      const x =
        food.x*CELL+CELL/2;

      const y =
        food.y*CELL+CELL/2;

      ctx.shadowColor =
        "#ff3155";

      ctx.shadowBlur = 18;

      ctx.fillStyle =
        "#ff3155";

      ctx.beginPath();

      ctx.arc(
        x,
        y,
        CELL*.30,
        0,
        Math.PI*2
      );

      ctx.fill();

      ctx.shadowBlur = 0;

    });

  /* POWERUPS */

  const colors = {
    speed:"#42a5ff",
    shield:"#b65cff",
    coin:"#ffd43b"
  };

  (state.powerups || [])
    .forEach(power => {

      const x =
        power.x*CELL+CELL/2;

      const y =
        power.y*CELL+CELL/2;

      ctx.fillStyle =
        colors[power.type];

      ctx.beginPath();

      ctx.arc(
        x,
        y,
        CELL*.38,
        0,
        Math.PI*2
      );

      ctx.fill();

    });

  /* SNAKES */

  Object.values(
    state.players || {}
  )
  .forEach(player => {

    if(!player.snake)
      return;

    player.snake.forEach(
      (part,index) => {

        let color =
          player.color;

        if(player.id === myId){

          color =
            player.boost > 0
              ? "#55aaff"
              : "#55ff83";

        }

        ctx.fillStyle =
          color;

        ctx.shadowColor =
          color;

        ctx.shadowBlur =
          index === 0
            ? 18
            : 5;

        ctx.beginPath();

        ctx.roundRect(
          part.x*CELL+2,
          part.y*CELL+2,
          CELL-4,
          CELL-4,
          6
        );

        ctx.fill();

        ctx.shadowBlur = 0;

        if(index === 0){

          ctx.fillStyle =
            "#06120a";

          ctx.beginPath();

          ctx.arc(
            part.x*CELL+6,
            part.y*CELL+6,
            2.5,
            0,
            Math.PI*2
          );

          ctx.fill();

          ctx.beginPath();

          ctx.arc(
            part.x*CELL+14,
            part.y*CELL+6,
            2.5,
            0,
            Math.PI*2
          );

          ctx.fill();

        }

      }

    );

  });

  ctx.restore();

  drawMinimap();

}


/* MINIMAP */

function drawMinimap(){

  if(
    minimap.style.display === "none"
  ){
    return;
  }

  const mw =
    minimap.clientWidth;

  const mh =
    minimap.clientHeight;

  miniCtx.clearRect(
    0,
    0,
    mw,
    mh
  );

  miniCtx.fillStyle =
    "rgba(5,15,8,.8)";

  miniCtx.fillRect(
    0,
    0,
    mw,
    mh
  );

  const sx =
    mw/state.width;

  const sy =
    mh/state.height;

  miniCtx.fillStyle =
    "#ff3155";

  (state.food || [])
    .forEach(food => {

      miniCtx.fillRect(
        food.x*sx,
        food.y*sy,
        2,
        2
      );

    });

  Object.values(
    state.players || {}
  )
  .forEach(player => {

    if(
      !player.snake ||
      !player.snake.length
    ){
      return;
    }

    const head =
      player.snake[0];

    miniCtx.fillStyle =
      player.id === myId
        ? "#63ff91"
        : player.color;

    miniCtx.beginPath();

    miniCtx.arc(
      head.x*sx,
      head.y*sy,
      3,
      0,
      Math.PI*2
    );

    miniCtx.fill();

  });

  miniCtx.strokeStyle =
    "rgba(100,255,140,.6)";

  miniCtx.strokeRect(
    0,
    0,
    mw,
    mh
  );

}


/* START */

connect();

draw();

</script>
