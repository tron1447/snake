<body>

<canvas id="game"></canvas>

<div id="menu">
<div class="panel">

<div class="logo">🐍</div>

<input id="name" maxlength="16" placeholder="Sinu nimi">

<button class="skin" data-color="#b86cff" data-skin="purple" style="background:#b86cff">👾</button>
<button class="skin" data-color="#ff8a3d" data-skin="orange" style="background:#ff8a3d">🔥</button>
<button class="skin" data-color="#00e5d4" data-skin="cyan" style="background:#00e5d4">🤖</button>

</div>

</div>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const mini=document.getElementById("minimap");
const mctx=mini.getContext("2d");

let W=innerWidth,H=innerHeight;
function resize(){
 W=innerWidth;H=innerHeight;
 canvas.width=W;canvas.height=H;
}
addEventListener("resize",resize);resize();

const WORLD=20000;
const foods=[];
const FOOD_COUNT=1400;

const colors=["#63ff78","#ffd84d","#ff5570","#55c9ff","#c76cff","#ff963d"];

function food(){
 return {
  x:Math.random()*WORLD,
  y:Math.random()*WORLD,
  r:3+Math.random()*4,
  color:colors[Math.floor(Math.random()*colors.length)],
  value:1+Math.floor(Math.random()*4)
 };
}

for(let i=0;i<FOOD_COUNT;i++)foods.push(food());

const me={
 id:null,x:10000,y:10000,angle:0,target:0,
 length:20,color:"#63ff78",skin:"green",name:"Player"
};

let body=[];
let others={};
let score=0;
let running=false;
let dead=false;
let boosting=false;
let botMode=false;
let socket=null;
let connected=false;
let cameraX=10000,cameraY=10000;
let lastSend=0;

document.querySelectorAll(".skin").forEach(b=>{
 b.onclick=()=>{
  document.querySelectorAll(".skin").forEach(x=>x.classList.remove("selected"));
  b.classList.add("selected");
  me.color=b.dataset.color;
  me.skin=b.dataset.skin;
 };
});

function playerName(){
 return (document.getElementById("name").value.trim()||"Player").substring(0,16);
}

function error(t){
 document.getElementById("error").textContent=t||"";
}

function connect(){
 const protocol=location.protocol==="https:"?"wss:":"ws:";
 socket=new WebSocket(protocol+"//"+location.host);

 socket.onopen=()=>{
  connected=true;
 };

 socket.onclose=()=>{
  connected=false;
 };

 socket.onerror=()=>{
  error("Serveriga ühendus ebaõnnestus.");
 };

 socket.onmessage=e=>{
  try{message(JSON.parse(e.data))}catch{}
 };
}

function send(data){
 if(socket&&socket.readyState===WebSocket.OPEN){
  socket.send(JSON.stringify(data));
  return true;
 }
 return false;
}

function message(d){

 if(d.type==="roomCreated"||d.type==="roomJoined"){
  me.id=d.id||me.id;
  document.getElementById("roomBox").style.display="block";
  document.getElementById("roomCode").textContent=d.code;
 }

 if(d.type==="lobby"){
  const box=document.getElementById("players");
  box.innerHTML="";
  (d.players||[]).forEach(p=>{
   const div=document.createElement("div");
   div.className="player";
   div.textContent=(p.host?"👑 ":"🐍 ")+p.name;
   box.appendChild(div);
  });
 }

 if(d.type==="gameStart"){
  me.id=d.id||me.id;
  startGame();
 }

 if(d.type==="players"){
  others=d.players||{};
  document.getElementById("count").textContent=Math.max(1,Object.keys(others).length);
 }

 if(d.type==="gameOver")die(d.reason||"Sind tapeti!");

 if(d.type==="playerKilled"){
  if(d.id!==me.id)showKill();
 }

 if(d.type==="error")error(d.message);
}

document.getElementById("create").onclick=()=>{
 error("");
 if(!connected){error("Oota serveri ühendust...");return}
 send({
  type:"createRoom",
  name:playerName(),
  color:me.color,
  skin:me.skin
 });
};

document.getElementById("join").onclick=()=>{
 const code=document.getElementById("room").value.trim().toUpperCase();
 if(code.length!==6){error("Room code peab olema 6 märki.");return}
 send({
  type:"joinRoom",
  code,
  name:playerName(),
  color:me.color,
  skin:me.skin
 });
};

document.getElementById("start").onclick=()=>{
 send({type:"startGame"});
};

document.getElementById("botBtn").onclick=()=>{
 botMode=true;
 document.getElementById("menu").style.display="none";
 startGame();
};

const keys={};

addEventListener("keydown",e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.key==="Shift")boosting=true;
});

addEventListener("keyup",e=>{
 keys[e.key.toLowerCase()]=false;
 if(e.key==="Shift")boosting=false;
});

function keyboard(){
 let x=0,y=0;

 if(keys.w||keys.arrowup)y--;
 if(keys.s||keys.arrowdown)y++;
 if(keys.a||keys.arrowleft)x--;
 if(keys.d||keys.arrowright)x++;

 if(x||y)me.target=Math.atan2(y,x);
}

addEventListener("mousemove",e=>{
 if(!running||innerWidth<=800)return;
 const dx=e.clientX-W/2;
 const dy=e.clientY-H/2;
 if(Math.hypot(dx,dy)>15)me.target=Math.atan2(dy,dx);
});

const joy=document.getElementById("joy");
const stick=document.getElementById("stick");
let joyId=null;

function joystickMove(x,y){
 const r=joy.getBoundingClientRect();
 let dx=x-(r.left+r.width/2);
 let dy=y-(r.top+r.height/2);
 const max=55;
 const d=Math.hypot(dx,dy);

 if(d>max){
  dx=dx/d*max;
  dy=dy/d*max;
 }

 stick.style.left=`calc(50% + ${dx}px)`;
 stick.style.top=`calc(50% + ${dy}px)`;

 if(d>7)me.target=Math.atan2(dy,dx);
}

joy.onpointerdown=e=>{
 joyId=e.pointerId;
 joy.setPointerCapture(e.pointerId);
 joystickMove(e.clientX,e.clientY);
};

joy.onpointermove=e=>{
 if(e.pointerId===joyId)joystickMove(e.clientX,e.clientY);
};

function joyReset(){
 joyId=null;
 stick.style.left="50%";
 stick.style.top="50%";
}
joy.onpointerup=joyReset;
joy.onpointercancel=joyReset;

const boost=document.getElementById("boost");

boost.onpointerdown=()=>boosting=true;
boost.onpointerup=()=>boosting=false;
boost.onpointercancel=()=>boosting=false;

function startGame(){

 running=true;
 dead=false;
 score=0;

 document.getElementById("menu").style.display="none";
 document.getElementById("hud").style.display="flex";
 document.getElementById("minimap").style.display="block";

 me.x=1500+Math.random()*(WORLD-3000);
 me.y=1500+Math.random()*(WORLD-3000);
 me.angle=Math.random()*Math.PI*2;
 me.target=me.angle;

 body=[];

 for(let i=0;i<me.length;i++){
  body.push({
   x:me.x-Math.cos(me.angle)*i*8,
   y:me.y-Math.sin(me.angle)*i*8
  });
 }
}

function update(){

 if(!running||dead)return;

 if(!botMode)keyboard();

 let diff=me.target-me.angle;

 while(diff>Math.PI)diff-=Math.PI*2;
 while(diff<-Math.PI)diff+=Math.PI*2;

 me.angle+=diff*.14;

 let speed=boosting?8.5:5.8;

 me.x+=Math.cos(me.angle)*speed;
 me.y+=Math.sin(me.angle)*speed;

 me.x=Math.max(25,Math.min(WORLD-25,me.x));
 me.y=Math.max(25,Math.min(WORLD-25,me.y));

 body.unshift({x:me.x,y:me.y});

 while(body.length>Math.floor(me.length))body.pop();

 eatFood();

 if(boosting&&me.length>22){

  me.length-=.035;

  if(Math.random()<.22){
   foods.push({
    x:body[Math.min(8,body.length-1)].x,
    y:body[Math.min(8,body.length-1)].y,
    r:5,
    color:me.color,
    value:3
   });
  }
 }

 if(botMode)updateBots();

 const now=performance.now();

 if(now-lastSend>40){
  lastSend=now;

  send({
   type:"state",
   x:me.x,
   y:me.y,
   angle:me.angle,
   length:me.length,
   color:me.color,
   skin:me.skin,
   name:playerName()
  });
 }

 document.getElementById("score").textContent=Math.floor(score);
 document.getElementById("length").textContent=Math.floor(me.length);
}

function eatFood(){

 for(let i=foods.length-1;i>=0;i--){

  const f=foods[i];

  if(Math.hypot(f.x-me.x,f.y-me.y)<25){

   score+=f.value;
   me.length+=f.value*.65;

   foods[i]=food();
  }
 }
}

/* ROBOTID */

const bots=[];

function createBots(){

 bots.length=0;

 for(let i=0;i<12;i++){

  bots.push({
   x:1000+Math.random()*18000,
   y:1000+Math.random()*18000,
   angle:Math.random()*Math.PI*2,
   target:Math.random()*Math.PI*2,
   length:20+Math.random()*80,
   color:colors[i%colors.length],
   name:"BOT "+(i+1)
  });
 }
}

function updateBots(){

 if(bots.length===0)createBots();

 for(const b of bots){

  if(Math.random()<.02){
   b.target=Math.random()*Math.PI*2;
  }

  const dx=me.x-b.x;
  const dy=me.y-b.y;
  const dist=Math.hypot(dx,dy);

  if(dist<700&&Math.random()<.025){
   b.target=Math.atan2(dy,dx);
  }

  let d=b.target-b.angle;

  while(d>Math.PI)d-=Math.PI*2;
  while(d<-Math.PI)d+=Math.PI*2;

  b.angle+=d*.04;

  b.x+=Math.cos(b.angle)*3.5;
  b.y+=Math.sin(b.angle)*3.5;

  if(b.x<50||b.x>WORLD-50)b.angle=Math.PI-b.angle;
  if(b.y<50||b.y>WORLD-50)b.angle=-b.angle;

  for(let i=foods.length-1;i>=0;i--){

   const f=foods[i];

   if(Math.hypot(f.x-b.x,f.y-b.y)<20){

    b.length+=f.value*.4;
    foods[i]=food();
   }
  }

  if(Math.hypot(b.x-me.x,b.y-me.y)<32){

   if(me.length>b.length*1.05){
    b.x=Math.random()*WORLD;
    b.y=Math.random()*WORLD;
    b.length=20;
    me.length+=10;
    score+=50;
    showKill();
   }else if(b.length>me.length*1.05){
    die("🤖 Robot tappis sind!");
   }
  }
 }
}

function updateCamera(){
 cameraX+=(me.x-cameraX)*.1;
 cameraY+=(me.y-cameraY)*.1;
}

function draw(){

 ctx.fillStyle="#071008";
 ctx.fillRect(0,0,W,H);

 if(!running)return;

 updateCamera();

 ctx.save();

 ctx.translate(W/2-cameraX,H/2-cameraY);

 drawGrid();
 drawBorder();
 drawFood();
 drawBots();
 drawOthers();
 drawMe();

 ctx.restore();

 drawMini();
}

function drawGrid(){

 const grid=250;
 const left=cameraX-W/2-500;
 const right=cameraX+W/2+500;
 const top=cameraY-H/2-500;
 const bottom=cameraY+H/2+500;

 ctx.strokeStyle="#63ff780a";

 for(let x=Math.floor(left/grid)*grid;x<right;x+=grid){
  ctx.beginPath();
  ctx.moveTo(x,top);
  ctx.lineTo(x,bottom);
  ctx.stroke();
 }

 for(let y=Math.floor(top/grid)*grid;y<bottom;y+=grid){
  ctx.beginPath();
  ctx.moveTo(left,y);
  ctx.lineTo(right,y);
  ctx.stroke();
 }
}

function drawBorder(){
 ctx.strokeStyle="#63ff78";
 ctx.lineWidth=15;
 ctx.strokeRect(0,0,WORLD,WORLD);
}

function drawFood(){

 for(const f of foods){

  if(Math.abs(f.x-cameraX)>W||Math.abs(f.y-cameraY)>H)continue;

  ctx.fillStyle=f.color;
  ctx.shadowColor=f.color;
  ctx.shadowBlur=10;

  ctx.beginPath();
  ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
  ctx.fill();
 }

 ctx.shadowBlur=0;
}

function drawSnakeBody(points,color,length){

 for(let i=points.length-1;i>=0;i--){

  const p=points[i];

  const progress=i/points.length;
  const r=8+(1-progress)*9;

  ctx.globalAlpha=1-progress*.35;
  ctx.fillStyle=color;

  ctx.beginPath();
  ctx.arc(p.x,p.y,r,0,Math.PI*2);
  ctx.fill();
 }

 ctx.globalAlpha=1;
}

function drawMe(){

 drawSnakeBody(body,me.color,me.length);

 drawHead(me.x,me.y,me.angle,me.color,me.skin);
 drawName(playerName(),me.x,me.y-34);
}

function drawOthers(){

 for(const id in others){

  if(id===me.id)continue;

  const p=others[id];
  if(!p)continue;

  const len=Math.min(180,Math.max(20,Math.floor(p.length||20)));
  const points=[];

  for(let i=0;i<len;i++){
   points.push({
    x:p.x-Math.cos(p.angle)*i*8,
    y:p.y-Math.sin(p.angle)*i*8
   });
  }

  drawSnakeBody(points,p.color||"#4da6ff",len);

  drawHead(
   p.x,p.y,p.angle,
   p.color||"#4da6ff",
   p.skin||"green"
  );

  drawName(p.name||"Player",p.x,p.y-34);
 }
}

function drawBots(){

 if(!botMode)return;

 for(const b of bots){

  const points=[];

  const len=Math.min(100,Math.floor(b.length));

  for(let i=0;i<len;i++){
   points.push({
    x:b.x-Math.cos(b.angle)*i*8,
    y:b.y-Math.sin(b.angle)*i*8
   });
  }

  drawSnakeBody(points,b.color,len);

  drawHead(b.x,b.y,b.angle,b.color,"red");
  drawName(b.name,b.x,b.y-34);
 }
}

function drawHead(x,y,a,color,skin){

 ctx.save();
 ctx.translate(x,y);
 ctx.rotate(a);

 ctx.fillStyle=color;
 ctx.shadowColor=color;
 ctx.shadowBlur=15;

 ctx.beginPath();
 ctx.arc(0,0,22,0,Math.PI*2);
 ctx.fill();

 ctx.shadowBlur=0;

 /* SKIN PATTERN */

 if(skin==="blue"){
  ctx.strokeStyle="#d8f5ff";
  ctx.lineWidth=4;
  ctx.stroke();
 }

 if(skin==="red"){
  ctx.strokeStyle="#fff";
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(-13,-13);ctx.lineTo(13,13);
  ctx.moveTo(13,-13);ctx.lineTo(-13,13);
  ctx.stroke();
 }

 if(skin==="yellow"){
  ctx.fillStyle="#fff4a0";
  ctx.beginPath();
  ctx.arc(0,0,8,0,Math.PI*2);
  ctx.fill();
 }

 if(skin==="purple"){
  ctx.strokeStyle="#f2c8ff";
  ctx.lineWidth=3;
  for(let i=0;i<6;i++){
   const a=i*Math.PI/3;
   ctx.beginPath();
   ctx.arc(Math.cos(a)*13,Math.sin(a)*13,4,0,Math.PI*2);
   ctx.stroke();
  }
 }

 if(skin==="orange"){
  ctx.strokeStyle="#ffe2c5";
  ctx.lineWidth=4;
  ctx.beginPath();
  ctx.moveTo(-15,-8);ctx.lineTo(15,-8);
  ctx.moveTo(-15,0);ctx.lineTo(15,0);
  ctx.moveTo(-15,8);ctx.lineTo(15,8);
  ctx.stroke();
 }

 if(skin==="cyan"){
  ctx.strokeStyle="#d8fffb";
  ctx.lineWidth=3;
  ctx.strokeRect(-12,-12,24,24);
 }

 /* EYES */

 ctx.fillStyle="white";

 ctx.beginPath();
 ctx.arc(9,-7,6,0,Math.PI*2);
 ctx.fill();

 ctx.beginPath();
 ctx.arc(9,7,6,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle="#111";

 ctx.beginPath();
 ctx.arc(11,-7,3,0,Math.PI*2);
 ctx.fill();

 ctx.beginPath();
 ctx.arc(11,7,3,0,Math.PI*2);
 ctx.fill();

 ctx.restore();
}

function drawName(name,x,y){

 ctx.save();
 ctx.textAlign="center";
 ctx.font="bold 12px Arial";
 ctx.fillStyle="white";
 ctx.shadowColor="#000";
 ctx.shadowBlur=5;

function drawMini(){

 const s=mini.width;

 mctx.fillStyle="#061007";
 mctx.fillRect(0,0,s,s);

 for(const f of foods){
  mctx.fillStyle=f.color;
  mctx.globalAlpha=.35;
  mctx.fillRect(f.x/WORLD*s,f.y/WORLD*s,1.5,1.5);
 }

 mctx.globalAlpha=1;

 if(botMode){
  for(const b of bots){
   mctx.fillStyle=b.color;
   mctx.beginPath();
   mctx.arc(b.x/WORLD*s,b.y/WORLD*s,3,0,Math.PI*2);
   mctx.fill();
  }
 }

 for(const id in others){
  const p=others[id];
  mctx.fillStyle=p.color||"#fff";
  mctx.beginPath();
  mctx.arc(p.x/WORLD*s,p.y/WORLD*s,3,0,Math.PI*2);
  mctx.fill();
 }

 mctx.fillStyle=me.color;
 mctx.beginPath();
 mctx.arc(me.x/WORLD*s,me.y/WORLD*s,5,0,Math.PI*2);
 mctx.fill();

 mctx.strokeStyle="#63ff78";
 mctx.strokeRect(1,1,s-2,s-2);
}
