<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Snake Arena</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#07100a;
    font-family:Arial,sans-serif;
    touch-action:none;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

#menu{
    position:fixed;
    inset:0;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle,#173d1e 0%,#030805 65%);
}

.card{
    width:min(92%,430px);
    padding:28px;
    border-radius:25px;
    background:rgba(5,15,8,.96);
    border:1px solid #3d7046;
    box-shadow:0 0 60px rgba(60,255,100,.15);
    text-align:center;
    color:white;
}

.logo{
    font-size:65px;
}

h1{
    font-size:40px;
    color:#63ff7e;
    margin-bottom:5px;
}

.sub{
    color:#829486;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #315238;
    border-radius:12px;
    background:#09140b;
    color:white;
    text-align:center;
    font-size:16px;
    outline:none;
}

button{
    width:100%;
    padding:14px;
    margin-top:9px;
    border:0;
    border-radius:12px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

#play{
    background:#63ff7e;
    color:#041007;
}

.label{
    color:#728475;
    font-size:11px;
    margin:17px 0 8px;
    letter-spacing:2px;
}

.skins{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
}

.skin{
    width:34px;
    height:34px;
    border-radius:50%;
    border:3px solid transparent;
}

.skin.active{
    border-color:white;
    transform:scale(1.15);
}

#hud{
    position:fixed;
    z-index:5;
    top:12px;
    left:12px;
    display:none;
    gap:6px;
}

.stat{
    padding:7px 12px;
    border-radius:10px;
    background:rgba(2,10,5,.85);
    border:1px solid rgba(100,255,130,.25);
    color:white;
    text-align:center;
}

.stat small{
    display:block;
    color:#78907d;
    font-size:9px;
}

.stat b{
    font-size:16px;
}

#minimap{
    position:fixed;
    z-index:5;
    top:12px;
    right:12px;
    width:145px;
    height:145px;
    display:none;
    border-radius:14px;
    background:#061008;
    border:2px solid rgba(100,255,130,.5);
}

#map{
    width:100%;
    height:100%;
}

#joystick{
    position:fixed;
    z-index:6;
    left:25px;
    bottom:25px;
    width:145px;
    height:145px;
    border-radius:50%;
    display:none;
    background:rgba(80,120,85,.25);
    border:2px solid rgba(150,255,160,.4);
}

#stick{
    position:absolute;
    width:62px;
    height:62px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:#63ff7e;
    border:3px solid white;
    box-shadow:0 0 20px rgba(90,255,120,.5);
}

#boost{
    position:fixed;
    z-index:6;
    right:30px;
    bottom:30px;
    width:105px;
    height:105px;
    display:none;
    border-radius:50%;
    background:#1785d1;
    border:3px solid #9dddff;
    color:white;
    font-size:30px;
}

#boost small{
    display:block;
    font-size:10px;
}

#rotate{
    display:none;
    position:fixed;
    inset:0;
    z-index:100;
    background:#020604;
    color:white;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.rotateBox{
    padding:30px;
}

.phone{
    font-size:70px;
    margin-bottom:20px;
}

#death{
    position:fixed;
    inset:0;
    z-index:20;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.75);
}

.deathCard{
    width:min(90%,380px);
    padding:30px;
    border-radius:25px;
    background:#071109;
    border:1px solid #63ff7e;
    color:white;
    text-align:center;
}

#again{
    background:#63ff7e;
}

#backMenu{
    background:#18221a;
    color:white;
}

@media(max-width:800px) and (orientation:landscape){

    #joystick{
        display:block;
    }

    #boost{
        display:block;
    }

    #minimap{
        width:120px;
        height:120px;
    }
}

@media(max-width:800px) and (orientation:portrait){

    #rotate{
        display:flex;
    }

    #menu{
        display:none;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="rotate">
    <div class="rotateBox">
        <div class="phone">📱</div>
        <h2>PÖÖRA TELEFON KÜLILI</h2>
        <p>Snake Arena töötab horisontaalselt.</p>
    </div>
</div>

<!-- MENU -->

<div id="menu">

<div class="card">

    <div class="logo">🐍</div>

    <h1>SNAKE ARENA</h1>

    <div class="sub">
        Kasvata oma madu!
    </div>

    <input
        id="name"
        maxlength="16"
        placeholder="Sinu nimi"
    >

    <div class="label">
        VALI SKIN
    </div>

    <div
        id="skins"
        class="skins">
    </div>

    <button id="play">
        ▶ ALUSTA MÄNGU
    </button>

</div>

</div>

<!-- HUD -->

<div id="hud">

    <div class="stat">
        <small>SCORE</small>
        <b id="score">0</b>
    </div>

    <div class="stat">
        <small>PICKUPS</small>
        <b id="length">20</b>
    </div>

</div>

<!-- MINIMAP -->

<div id="minimap">
    <canvas
        id="map"
        width="145"
        height="145">
    </canvas>
</div>

<!-- JOYSTICK -->

<div id="joystick">
    <div id="stick"></div>
</div>

<!-- BOOST -->

<button id="boost">
    ⚡
    <small>BOOST</small>
</button>

<!-- DEATH -->

<div id="death">

    <div class="deathCard">

        <div style="font-size:60px">
            💥
        </div>

        <h2>GAME OVER</h2>

        <p id="finalScore">
            Score: 0
        </p>

        <button id="again">
            🔄 PROOVI UUESTI
        </button>

        <button id="backMenu">
            MENU
        </button>

    </div>

</div>

<script>

/* ================================
   CANVAS
================================ */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

const mapCanvas =
    document.getElementById("map");

const mapCtx =
    mapCanvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

function resize(){

    W = innerWidth;
    H = innerHeight;

    const dpr =
        Math.min(devicePixelRatio || 1,2);

    canvas.width = W*dpr;
    canvas.height = H*dpr;

    canvas.style.width = W+"px";
    canvas.style.height = H+"px";

    ctx.setTransform(
        dpr,0,0,dpr,0,0
    );
}

window.addEventListener(
    "resize",
    resize
);

resize();


/* ================================
   GAME
================================ */

const WORLD = 12000;

let playing = false;

let score = 0;

let snakeLength = 20;

let foods = [];

let particles = [];

let selectedSkin = 0;

const skins = [
    "#63ff7e",
    "#42a5ff",
    "#ff4dd8",
    "#ffd83d",
    "#ff703d",
    "#a95cff",
    "#00eaff",
    "#ffffff",
    "#ff4268",
    "#9cff32"
];

let snake = [];

let player = {
    x:WORLD/2,
    y:WORLD/2,
    angle:0,
    target:0
};

let camera = {
    x:WORLD/2,
    y:WORLD/2
};

let boosting = false;


/* ================================
   SKINS
================================ */

const skinBox =
    document.getElementById("skins");

skins.forEach((color,i)=>{

    const div =
        document.createElement("div");

    div.className = "skin";

    div.style.background = color;

    if(i === 0)
        div.classList.add("active");

    div.onclick = ()=>{

        selectedSkin = i;

        document
        .querySelectorAll(".skin")
        .forEach(x =>
            x.classList.remove("active")
        );

        div.classList.add("active");

    };

    skinBox.appendChild(div);

});


/* ================================
   FOOD
================================ */

function createFood(){

    foods = [];

    for(let i=0;i<900;i++){

        foods.push({

            x:Math.random()*WORLD,

            y:Math.random()*WORLD,

            size:
                Math.random()<.08
                ? 8
                : 5,

            value:
                Math.random()<.08
                ? 5
                : 1,

            phase:
                Math.random()*10

        });

    }

}


/* ================================
   START
================================ */

function start(){

    playing = true;

    document.getElementById(
        "menu"
    ).style.display = "none";

    document.getElementById(
        "death"
    ).style.display = "none";

    document.getElementById(
        "hud"
    ).style.display = "flex";

    document.getElementById(
        "minimap"
    ).style.display = "block";

    score = 0;

    snakeLength = 20;

    player.x =
        WORLD/2;

    player.y =
        WORLD/2;

    player.angle = 0;

    player.target = 0;

    snake = [];

    for(
        let i=0;
        i<snakeLength;
        i++
    ){

        snake.push({

            x:
                player.x-i*9,

            y:
                player.y

        });

    }

    camera.x = player.x;
    camera.y = player.y;

    createFood();

}


/* ================================
   KEYBOARD
================================ */

const keys = {};

window.addEventListener(
    "keydown",
    e=>{

        keys[
            e.key.toLowerCase()
        ] = true;

        if(
            e.key === "Shift"
        ){

            boosting = true;

        }

    }
);

window.addEventListener(
    "keyup",
    e=>{

        keys[
            e.key.toLowerCase()
        ] = false;

        if(
            e.key === "Shift"
        ){

            boosting = false;

        }

    }
);


function keyboard(){

    let dx = 0;
    let dy = 0;

    if(keys["w"] || keys["arrowup"])
        dy--;

    if(keys["s"] || keys["arrowdown"])
        dy++;

    if(keys["a"] || keys["arrowleft"])
        dx--;

    if(keys["d"] || keys["arrowright"])
        dx++;

    if(dx !== 0 || dy !== 0){

        player.target =
            Math.atan2(dy,dx);

    }

}


/* ================================
   MOUSE
================================ */

window.addEventListener(
    "mousemove",
    e=>{

        if(!playing)
            return;

        if(
            window.innerWidth <= 800
        )
            return;

        player.target =
            Math.atan2(
                e.clientY-H/2,
                e.clientX-W/2
            );

    }
);


/* ================================
   TOUCH
================================ */

canvas.addEventListener(
    "touchstart",
    e=>{

        if(!playing)
            return;

        const t =
            e.touches[0];

        player.target =
            Math.atan2(
                t.clientY-H/2,
                t.clientX-W/2
            );

    },
    {passive:false}
);

canvas.addEventListener(
    "touchmove",
    e=>{

        if(!playing)
            return;

        e.preventDefault();

        const t =
            e.touches[0];

        player.target =
            Math.atan2(
                t.clientY-H/2,
                t.clientX-W/2
            );

    },
    {passive:false}
);


/* ================================
   JOYSTICK
================================ */

const joystick =
    document.getElementById("joystick");

const stick =
    document.getElementById("stick");

let joyActive = false;

function joystickMove(x,y){

    const r =
        joystick.getBoundingClientRect();

    const cx =
        r.left+r.width/2;

    const cy =
        r.top+r.height/2;

    let dx = x-cx;
    let dy = y-cy;

    const max =
        r.width/2-32;

    const dist =
        Math.hypot(dx,dy);

    if(dist > max){

        dx = dx/dist*max;
        dy = dy/dist*max;

    }

    stick.style.left =
        `calc(50% + ${dx}px)`;

    stick.style.top =
        `calc(50% + ${dy}px)`;

    if(dist > 6){

        player.target =
            Math.atan2(dy,dx);

    }

}

function joystickReset(){

    joyActive = false;

    stick.style.left = "50%";
    stick.style.top = "50%";

}

joystick.addEventListener(
    "touchstart",
    e=>{

        e.preventDefault();

        joyActive = true;

        const t =
            e.changedTouches[0];

        joystickMove(
            t.clientX,
            t.clientY
        );

    },
    {passive:false}
);

joystick.addEventListener(
    "touchmove",
    e=>{

        e.preventDefault();

        if(!joyActive)
            return;

        const t =
            e.changedTouches[0];

        joystickMove(
            t.clientX,
            t.clientY
        );

    },
    {passive:false}
);

joystick.addEventListener(
    "touchend",
    e=>{

        e.preventDefault();

        joystickReset();

    },
    {passive:false}
);


/* ================================
   BOOST BUTTON
================================ */

const boostButton =
    document.getElementById("boost");

boostButton.addEventListener(
    "touchstart",
    e=>{

        e.preventDefault();

        boosting = true;

    },
    {passive:false}
);

boostButton.addEventListener(
    "touchend",
    e=>{

        e.preventDefault();

        boosting = false;

    },
    {passive:false}
);


/* ================================
   UPDATE
================================ */

function update(){

    if(!playing)
        return;


    keyboard();


    let difference =
        player.target-player.angle;


    while(
        difference > Math.PI
    )
        difference -= Math.PI*2;

    while(
        difference < -Math.PI
    )
        difference += Math.PI*2;


    player.angle +=
        difference*.12;


    let speed = 5;


    if(boosting){

        speed = 8;

        snakeLength -= .03;

        if(snakeLength < 15)
            snakeLength = 15;

    }


    player.x +=
        Math.cos(player.angle)*speed;

    player.y +=
        Math.sin(player.angle)*speed;


    /* maailma ümber */

    if(player.x < 0)
        player.x = WORLD;

    if(player.x > WORLD)
        player.x = 0;

    if(player.y < 0)
        player.y = WORLD;

    if(player.y > WORLD)
        player.y = 0;


    snake.unshift({

        x:player.x,
        y:player.y

    });


    while(
        snake.length >
        Math.floor(snakeLength)
    ){

        snake.pop();

    }


    /* food */

    for(
        let i=foods.length-1;
        i>=0;
        i--
    ){

        const f = foods[i];

        const d =
            Math.hypot(
                player.x-f.x,
                player.y-f.y
            );

        if(d < 30){

            score += f.value;

            snakeLength +=
                f.value*1.8;

            createParticles(
                f.x,
                f.y,
                5
            );

            foods.splice(i,1);

            foods.push({

                x:Math.random()*WORLD,

                y:Math.random()*WORLD,

                size:
                    Math.random()<.08
                    ? 8
                    : 5,

                value:
                    Math.random()<.08
                    ? 5
                    : 1,

                phase:
                    Math.random()*10

            });

        }

    }


    /* camera */

    camera.x +=
        (player.x-camera.x)*.12;

    camera.y +=
        (player.y-camera.y)*.12;


    /* particles */

    for(
        const p of particles
    ){

        p.x += p.vx;
        p.y += p.vy;

        p.life--;

    }

    particles =
        particles.filter(
            p => p.life>0
        );


    document.getElementById(
        "score"
    ).textContent =
        Math.floor(score);

    document.getElementById(
        "length"
    ).textContent =
        Math.floor(snakeLength);

}


/* ================================
   PARTICLES
================================ */

function createParticles(x,y,n){

    for(let i=0;i<n;i++){

        particles.push({

            x:x,

            y:y,

            vx:(Math.random()-.5)*5,

            vy:(Math.random()-.5)*5,

            life:30

        });

    }

}


/* ================================
   DRAW
================================ */

function draw(){

    requestAnimationFrame(draw);

    ctx.clearRect(
        0,0,W,H
    );


    if(!playing){

        ctx.fillStyle="#07100a";

        ctx.fillRect(
            0,0,W,H
        );

        return;

    }


    const zoom =
        W < 900
        ? 1.15
        : 1.45;


    ctx.save();


    ctx.translate(
        W/2,
        H/2
    );

    ctx.scale(
        zoom,
        zoom
    );

    ctx.translate(
        -camera.x,
        -camera.y
    );


    /* background */

    ctx.fillStyle =
        "#07150a";

    ctx.fillRect(
        0,
        0,
        WORLD,
        WORLD
    );


    /* grid */

    const grid = 150;

    ctx.strokeStyle =
        "rgba(100,255,130,.05)";

    ctx.lineWidth=1;


    const left =
        camera.x-W/zoom/2-500;

    const right =
        camera.x+W/zoom/2+500;

    const top =
        camera.y-H/zoom/2-500;

    const bottom =
        camera.y+H/zoom/2+500;


    for(
        let x=Math.floor(left/grid)*grid;
        x<right;
        x+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(x,top);
        ctx.lineTo(x,bottom);

        ctx.stroke();

    }


    for(
        let y=Math.floor(top/grid)*grid;
        y<bottom;
        y+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(left,y);
        ctx.lineTo(right,y);

        ctx.stroke();

    }


    /* border */

    ctx.strokeStyle =
        "#3dff65";

    ctx.lineWidth=25;

    ctx.strokeRect(
        0,
        0,
        WORLD,
        WORLD
    );


    /* food */

    for(
        const f of foods
    ){

        if(
            f.x<left-50 ||
            f.x>right+50 ||
            f.y<top-50 ||
            f.y>bottom+50
        )
            continue;


        const pulse =
            Math.sin(
                performance.now()/200+
                f.phase
            );


        ctx.fillStyle =
            f.value>=5
            ? "#ffd83d"
            : "#ff5872";


        ctx.shadowColor =
            ctx.fillStyle;

        ctx.shadowBlur=12;


        ctx.beginPath();

        ctx.arc(
            f.x,
            f.y,
            f.size+pulse,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.shadowBlur=0;


    /* snake */

    const color =
        skins[selectedSkin];


    for(
        let i=snake.length-1;
        i>=0;
        i--
    ){

        const p =
            snake[i];

        const size =
            15-
            (i/snake.length)*7;


        ctx.fillStyle=color;

        ctx.shadowColor=color;

        ctx.shadowBlur=8;


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            Math.max(7,size),
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.shadowBlur=0;


    /* head */

    ctx.fillStyle=color;

    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y,
        18,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* eyes */

    const ex =
        Math.cos(player.angle);

    const ey =
        Math.sin(player.angle);

    const sx =
        -Math.sin(player.angle);

    const sy =
        Math.cos(player.angle);


    ctx.fillStyle="#061009";


    ctx.beginPath();

    ctx.arc(
        player.x+
        ex*9+
        sx*5,

        player.y+
        ey*9+
        sy*5,

        4,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        player.x+
        ex*9-
        sx*5,

        player.y+
        ey*9-
        sy*5,

        4,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* boost trail */

    if(boosting){

        ctx.strokeStyle =
            "#5ecbff";

        ctx.lineWidth=4;

        ctx.beginPath();

        ctx.moveTo(
            player.x,
            player.y
        );

        ctx.lineTo(
            player.x-
            ex*45,

            player.y-
            ey*45
        );

        ctx.stroke();

    }


    /* particles */

    for(
        const p of particles
    ){

        ctx.fillStyle=color;

        ctx.globalAlpha =
            p.life/30;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            3,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.globalAlpha=1;


    ctx.restore();


    drawMinimap();

}


/* ================================
   MINIMAP
================================ */

function drawMinimap(){

    mapCtx.clearRect(
        0,0,145,145
    );


    mapCtx.fillStyle =
        "#061008";

    mapCtx.fillRect(
        0,0,145,145
    );


    mapCtx.strokeStyle =
        "rgba(100,255,130,.12)";

    for(let i=0;i<=10;i++){

        const p =
            i*14.5;

        mapCtx.beginPath();

        mapCtx.moveTo(p,0);
        mapCtx.lineTo(p,145);

        mapCtx.stroke();

        mapCtx.beginPath();

        mapCtx.moveTo(0,p);
        mapCtx.lineTo(145,p);

        mapCtx.stroke();

    }


    /* snake */

    const x =
        player.x/WORLD*145;

    const y =
        player.y/WORLD*145;


    mapCtx.fillStyle =
        skins[selectedSkin];

    mapCtx.shadowColor =
        skins[selectedSkin];

    mapCtx.shadowBlur=10;


    mapCtx.beginPath();

    mapCtx.arc(
        x,y,
        6,
        0,
        Math.PI*2
    );

    mapCtx.fill();


    mapCtx.shadowBlur=0;


    /* direction */

    mapCtx.strokeStyle="white";

    mapCtx.beginPath();

    mapCtx.moveTo(x,y);

    mapCtx.lineTo(
        x+
        Math.cos(player.angle)*12,

        y+
        Math.sin(player.angle)*12
    );

    mapCtx.stroke();

}


/* ================================
   BUTTONS
================================ */

document.getElementById(
    "play"
).onclick = ()=>{

    let name =
        document.getElementById(
            "name"
        ).value.trim();

    if(!name){

        document.getElementById(
            "name"
        ).value =
            "Player";

    }

    start();

};


document.getElementById(
    "again"
).onclick = ()=>{

    start();

};


document.getElementById(
    "backMenu"
).onclick = ()=>{

    playing=false;

    document.getElementById(
        "death"
    ).style.display="none";

    document.getElementById(
        "hud"
    ).style.display="none";

    document.getElementById(
        "minimap"
    ).style.display="none";

    document.getElementById(
        "menu"
    ).style.display="flex";

};


/* ================================
   LOOP
================================ */

function loop(){

    update();

    requestAnimationFrame(loop);

}

loop();

draw();

</script>
