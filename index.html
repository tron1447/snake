<script>

/* =========================
   CANVAS
========================= */

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const minimap=document.getElementById("minimap");
const mctx=minimap.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){
    W=innerWidth;
    H=innerHeight;

    canvas.width=W;
    canvas.height=H;
}

addEventListener("resize",resize);
resize();


/* =========================
   WORLD
========================= */

const WORLD=20000;


/* =========================
   PLAYER
========================= */

const me={
    id:null,
    x:10000,
    y:10000,
    angle:0,
    target:0,
    length:20,
    color:"#63ff78",
    name:"Player"
};

let body=[];
let others={};

let score=0;
let running=false;
let dead=false;
let boosting=false;


/* =========================
   FOOD
========================= */

const foods=[];

const foodColors=[
    "#63ff78",
    "#ffd84d",
    "#ff6075",
    "#55c9ff",
    "#c76cff",
    "#ff963d"
];

function newFood(){

    return {
        x:Math.random()*WORLD,
        y:Math.random()*WORLD,
        r:3+Math.random()*4,
        color:foodColors[
            Math.floor(Math.random()*foodColors.length)
        ]
    };
}

for(let i=0;i<600;i++){
    foods.push(newFood());
}


/* =========================
   SKINS
========================= */

document.querySelectorAll(".skin").forEach(btn=>{

    btn.onclick=()=>{

        document.querySelectorAll(".skin")
        .forEach(x=>x.classList.remove("selected"));

        btn.classList.add("selected");

        me.color=btn.dataset.color;
    };

});


/* =========================
   WEBSOCKET
========================= */

let ws=null;
let connected=false;

function connect(){

    const protocol=
        location.protocol==="https:"
        ?"wss:"
        :"ws:";

    ws=new WebSocket(
        protocol+"//"+location.host
    );

    ws.onopen=()=>{

        connected=true;

        document.getElementById("connection")
            .textContent="🟢 Server ühendatud";
    };

    ws.onclose=()=>{

        connected=false;

        document.getElementById("connection")
            .textContent="🔴 Ühendus katkes";
    };

    ws.onerror=()=>{

        document.getElementById("connection")
            .textContent="🔴 Serveri viga";
    };

    ws.onmessage=e=>{

        let d;

        try{
            d=JSON.parse(e.data);
        }catch{
            return;
        }

        handleServer(d);
    };
}


function send(data){

    if(!ws || ws.readyState!==WebSocket.OPEN){
        return false;
    }

    ws.send(JSON.stringify(data));

    return true;
}


/* =========================
   SERVER
========================= */

function handleServer(d){

    if(d.type==="roomCreated"){

        if(d.id) me.id=d.id;

        showRoom(d.code);

        return;
    }

    if(d.type==="roomJoined"){

        if(d.id) me.id=d.id;

        showRoom(d.code);

        return;
    }

    if(d.type==="lobby"){

        renderLobby(d.players||[]);

        return;
    }

    if(d.type==="gameStart"){

        if(d.id) me.id=d.id;

        startGame();

        return;
    }

    if(d.type==="players"){

        others=d.players||{};

        document.getElementById("count")
            .textContent=Object.keys(others).length;

        return;
    }

    if(d.type==="gameOver"){

        die(d.reason||"Sind tapeti!");

        return;
    }

    if(d.type==="error"){

        error(d.message||"Viga");

        return;
    }
}


/* =========================
   UI
========================= */

function getName(){

    return (
        document.getElementById("name").value.trim()
        ||"Player"
    ).substring(0,16);
}

function error(text){

    document.getElementById("error")
        .textContent=text;
}

function showRoom(code){

    document.getElementById("roomBox")
        .style.display="block";

    document.getElementById("roomCode")
        .textContent=code;
}

function renderLobby(players){

    const box=document.getElementById("players");

    box.innerHTML="";

    players.forEach((p,i)=>{

        const div=document.createElement("div");

        div.className="player";

        div.textContent=
            (i===0?"👑 ":"🐍 ")+
            (p.name||"Player");

        box.appendChild(div);
    });

    if(players.length){
        document.getElementById("start")
            .style.display="block";
    }
}


/* =========================
   CREATE
========================= */

document.getElementById("create").onclick=()=>{

    error("");

    if(!connected){

        error("Serveriga pole ühendust.");

        return;
    }

    send({
        type:"createRoom",
        name:getName(),
        color:me.color
    });
};


/* =========================
   JOIN
========================= */

document.getElementById("join").onclick=()=>{

    error("");

    const code=
        document.getElementById("room")
        .value.trim().toUpperCase();

    if(code.length!==6){

        error("Sisesta 6-märgiline room code.");

        return;
    }

    send({
        type:"joinRoom",
        code:code,
        name:getName(),
        color:me.color
    });
};


/* =========================
   START
========================= */

document.getElementById("start").onclick=()=>{

    send({
        type:"startGame"
    });
};


/* =========================
   KEYBOARD
========================= */

const keys={};

addEventListener("keydown",e=>{

    keys[e.key.toLowerCase()]=true;

    if(e.key==="Shift"){
        boosting=true;
    }
});

addEventListener("keyup",e=>{

    keys[e.key.toLowerCase()]=false;

    if(e.key==="Shift"){
        boosting=false;
    }
});


function keyboard(){

    let x=0;
    let y=0;

    if(keys.w||keys.arrowup)y--;
    if(keys.s||keys.arrowdown)y++;
    if(keys.a||keys.arrowleft)x--;
    if(keys.d||keys.arrowright)x++;

    if(x||y){

        me.target=Math.atan2(y,x);
    }
}


/* =========================
   MOUSE
========================= */

addEventListener("mousemove",e=>{

    if(!running)return;
    if(innerWidth<=800)return;

    const x=e.clientX-W/2;
    const y=e.clientY-H/2;

    if(Math.hypot(x,y)>15){

        me.target=Math.atan2(y,x);
    }
});


/* =========================
   JOYSTICK
========================= */

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

let joyId=null;

function joystickMove(x,y){

    const r=joystick.getBoundingClientRect();

    const cx=r.left+r.width/2;
    const cy=r.top+r.height/2;

    let dx=x-cx;
    let dy=y-cy;

    const max=55;
    const dist=Math.hypot(dx,dy);

    if(dist>max){

        dx=dx/dist*max;
        dy=dy/dist*max;
    }

    stick.style.left=
        `calc(50% + ${dx}px)`;

    stick.style.top=
        `calc(50% + ${dy}px)`;

    if(dist>7){

        me.target=Math.atan2(dy,dx);
    }
}

function joystickReset(){

    joyId=null;

    stick.style.left="50%";
    stick.style.top="50%";
}

joystick.onpointerdown=e=>{

    joyId=e.pointerId;

    joystick.setPointerCapture(e.pointerId);

    joystickMove(e.clientX,e.clientY);
};

joystick.onpointermove=e=>{

    if(e.pointerId===joyId){

        joystickMove(e.clientX,e.clientY);
    }
};

joystick.onpointerup=joystickReset;
joystick.onpointercancel=joystickReset;


/* =========================
   BOOST
========================= */

const boost=document.getElementById("boost");

boost.onpointerdown=()=>{
    boosting=true;
};

boost.onpointerup=()=>{
    boosting=false;
};

boost.onpointercancel=()=>{
    boosting=false;
};


/* =========================
   START GAME
========================= */

function startGame(){

    running=true;
    dead=false;

    score=0;

    document.getElementById("menu")
        .style.display="none";

    document.getElementById("hud")
        .style.display="flex";

    document.getElementById("minimap")
        .style.display="block";

    me.x=3000+Math.random()*14000;
    me.y=3000+Math.random()*14000;

    me.angle=Math.random()*Math.PI*2;
    me.target=me.angle;

    body=[];

    for(let i=0;i<me.length;i++){

        body.push({
            x:me.x-Math.cos(me.angle)*i*8,
            y:me.y-Math.sin(me.angle)*i*8
        });
    }
}


/* =========================
   UPDATE
========================= */

let lastSend=0;

function update(){

    if(!running||dead)return;

    keyboard();

    let diff=me.target-me.angle;

    while(diff>Math.PI)diff-=Math.PI*2;
    while(diff<-Math.PI)diff+=Math.PI*2;

    me.angle+=diff*.15;

    const speed=boosting?8.5:5.2;

    me.x+=Math.cos(me.angle)*speed;
    me.y+=Math.sin(me.angle)*speed;

    me.x=Math.max(20,Math.min(WORLD-20,me.x));
    me.y=Math.max(20,Math.min(WORLD-20,me.y));

    body.unshift({
        x:me.x,
        y:me.y
    });

    while(body.length<Math.floor(me.length)){

        body.push({
            x:me.x,
            y:me.y
        });
    }

    while(body.length>Math.floor(me.length)){
        body.pop();
    }

    eat();

    if(boosting && me.length>20){
        me.length-=.025;
    }

    const now=performance.now();

    if(now-lastSend>50){

        lastSend=now;

        send({
            type:"state",
            x:me.x,
            y:me.y,
            angle:me.angle,
            length:me.length,
            color:me.color,
            name:getName()
        });
    }

    document.getElementById("score")
        .textContent=Math.floor(score);

    document.getElementById("length")
        .textContent=Math.floor(me.length);
}


/* =========================
   FOOD
========================= */

function eat(){

    for(let i=foods.length-1;i>=0;i--){

        const f=foods[i];

        if(
            Math.hypot(
                f.x-me.x,
                f.y-me.y
            )<25
        ){

            score++;
            me.length+=.6;

            foods[i]=newFood();
        }
    }
}


/* =========================
   CAMERA
========================= */

let cameraX=me.x;
let cameraY=me.y;

function camera(){

    cameraX+=(me.x-cameraX)*.12;
    cameraY+=(me.y-cameraY)*.12;
}


/* =========================
   DRAW
========================= */

function draw(){

    ctx.fillStyle="#071008";
    ctx.fillRect(0,0,W,H);

    if(!running)return;

    camera();

    ctx.save();

    ctx.translate(
        W/2-cameraX,
        H/2-cameraY
    );

    drawGrid();
    drawBorder();
    drawFood();
    drawOthers();
    drawMe();

    ctx.restore();

    drawMinimap();
}


/* =========================
   GRID
========================= */

function drawGrid(){

    const size=250;

    const left=cameraX-W;
    const right=cameraX+W;
    const top=cameraY-H;
    const bottom=cameraY+H;

    ctx.strokeStyle="rgba(99,255,120,.05)";
    ctx.lineWidth=1;

    for(
        let x=Math.floor(left/size)*size;
        x<right;
        x+=size
    ){

        ctx.beginPath();
        ctx.moveTo(x,top);
        ctx.lineTo(x,bottom);
        ctx.stroke();
    }

    for(
        let y=Math.floor(top/size)*size;
        y<bottom;
        y+=size
    ){

        ctx.beginPath();
        ctx.moveTo(left,y);
        ctx.lineTo(right,y);
        ctx.stroke();
    }
}


/* =========================
   BORDER
========================= */

function drawBorder(){

    ctx.strokeStyle="#63ff78";
    ctx.lineWidth=18;

    ctx.strokeRect(
        0,
        0,
        WORLD,
        WORLD
    );
}


/* =========================
   FOOD
========================= */

function drawFood(){

    for(const f of foods){

        if(
            Math.abs(f.x-cameraX)>W ||
            Math.abs(f.y-cameraY)>H
        )continue;

        ctx.fillStyle=f.color;
        ctx.shadowColor=f.color;
        ctx.shadowBlur=10;

        ctx.beginPath();

        ctx.arc(
            f.x,
            f.y,
            f.r,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.shadowBlur=0;
}


/* =========================
   SNAKE BODY
========================= */

function drawBody(points,color){

    for(
        let i=points.length-1;
        i>=0;
        i--
    ){

        const p=points[i];

        const progress=i/points.length;

        const radius=8+(1-progress)*9;

        ctx.globalAlpha=1-progress*.35;

        ctx.fillStyle=color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            radius,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.globalAlpha=1;
}


/* =========================
   FACE
========================= */

function face(x,y,angle,r=22){

    ctx.save();

    ctx.translate(x,y);
    ctx.rotate(angle);

    ctx.fillStyle="white";

    ctx.beginPath();
    ctx.arc(9,-7,6,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(9,7,6,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#111";

    ctx.beginPath();
    ctx.arc(11,-7,3,0,Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(11,7,3,0,Math.PI*2);
    ctx.fill();

    ctx.strokeStyle="#111";
    ctx.lineWidth=2;

    ctx.beginPath();
    ctx.arc(14,0,5,-.7,.7);
    ctx.stroke();

    ctx.restore();
}


/* =========================
   MY SNAKE
========================= */

function drawMe(){

    drawBody(body,me.color);

    ctx.fillStyle=me.color;

    ctx.shadowColor=me.color;
    ctx.shadowBlur=18;

    ctx.beginPath();

    ctx.arc(
        me.x,
        me.y,
        22,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;

    face(
        me.x,
        me.y,
        me.angle
    );

    nameText(
        getName(),
        me.x,
        me.y-32
    );
}


/* =========================
   OTHER SNAKES
========================= */

function drawOthers(){

    for(const id in others){

        if(id===me.id)continue;

        const p=others[id];

        if(!p)continue;

        const len=Math.min(
            150,
            Math.max(20,Math.floor(p.length||20))
        );

        const points=[];

        for(let i=0;i<len;i++){

            points.push({
                x:p.x-Math.cos(p.angle)*i*8,
                y:p.y-Math.sin(p.angle)*i*8
            });
        }

        drawBody(
            points,
            p.color||"#4da6ff"
        );

        ctx.fillStyle=
            p.color||"#4da6ff";

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            22,
            0,
            Math.PI*2
        );

        ctx.fill();

        face(
            p.x,
            p.y,
            p.angle
        );

        nameText(
            p.name||"Player",
            p.x,
            p.y-32
        );
    }
}


/* =========================
   NAME
========================= */

function nameText(text,x,y){

    ctx.save();

    ctx.textAlign="center";
    ctx.font="bold 12px Arial";

    ctx.fillStyle="white";
    ctx.shadowColor="black";
    ctx.shadowBlur=5;

    ctx.fillText(
        text,
        x,
        y
    );

    ctx.restore();
}


/* =========================
   MINIMAP
========================= */

function drawMinimap(){

    const s=minimap.width;

    mctx.clearRect(0,0,s,s);

    mctx.fillStyle="#061007";
    mctx.fillRect(0,0,s,s);

    /* food */

    for(const f of foods){

        mctx.fillStyle=f.color;

        mctx.globalAlpha=.45;

        mctx.beginPath();

        mctx.arc(
            f.x/WORLD*s,
            f.y/WORLD*s,
            1.2,
            0,
            Math.PI*2
        );

        mctx.fill();
    }

    mctx.globalAlpha=1;

    /* players */

    for(const id in others){

        if(id===me.id)continue;

        const p=others[id];

        mctx.fillStyle=p.color||"#ff5368";

        mctx.beginPath();

        mctx.arc(
            p.x/WORLD*s,
            p.y/WORLD*s,
            4,
            0,
            Math.PI*2
        );

        mctx.fill();
    }

    /* me */

    mctx.fillStyle=me.color;

    mctx.beginPath();

    mctx.arc(
        me.x/WORLD*s,
        me.y/WORLD*s,
        5,
        0,
        Math.PI*2
    );

    mctx.fill();

    mctx.strokeStyle="#63ff78";
    mctx.lineWidth=2;

    mctx.strokeRect(
        1,
        1,
        s-2,
        s-2
    );
}


/* =========================
   DEATH
========================= */

function die(reason){

    if(dead)return;

    dead=true;
    running=false;
    boosting=false;

    document.getElementById("reason")
        .textContent=reason;

    document.getElementById("final")
        .textContent=Math.floor(score);

    document.getElementById("gameOver")
        .style.display="flex";
}


/* =========================
   LOOP
========================= */

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);
}


/* =========================
   INIT
========================= */

connect();
loop();

</script>
