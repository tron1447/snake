<!DOCTYPE html>
<html lang="et">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>Snake Arena</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#061008;
  font-family:Arial,sans-serif;
  touch-action:none;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}

button,input{
  font:inherit;
}

button{
  cursor:pointer;
}

#menu{
  position:fixed;
  inset:0;
  z-index:100;
  overflow-y:auto;
  padding:20px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle at top,#1c5725,#050905 75%);
}

.panel{
  width:min(460px,95vw);
  max-height:94vh;
  overflow:auto;
  padding:24px;
  border-radius:24px;
  background:rgba(7,16,9,.96);
  border:1px solid #356b3d;
  box-shadow:0 20px 70px rgba(0,0,0,.55);
  color:white;
  text-align:center;
}

.logo{
  font-size:58px;
}

h1{
  font-size:40px;
  color:#63ff78;
}

.sub{
  color:#829382;
  margin-bottom:14px;
}

input{
  width:100%;
  height:48px;
  border-radius:12px;
  border:1px solid #315d37;
  background:#111b12;
  color:white;
  padding:0 15px;
  margin:5px 0;
  text-align:center;
}

.btn{
  width:100%;
  min-height:48px;
  margin-top:8px;
  border-radius:12px;
  border:1px solid #315d37;
  font-weight:bold;
}

.green{
  background:#63ff78;
  color:#061008;
  border:0;
}

.dark{
  background:#111d13;
  color:white;
}

.gold{
  color:#ffd84d;
}

#menuCoins{
  padding:10px;
  margin:10px 0;
  border-radius:10px;
  background:#111b12;
}

.section{
  margin-top:15px;
  padding-top:15px;
  border-top:1px solid #263c29;
}

.sectionTitle{
  color:#63ff78;
  font-weight:bold;
  margin-bottom:8px;
}

#shop{
  display:none;
}

.shopGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.shopItem{
  padding:10px;
  border-radius:12px;
  background:#111b12;
  border:1px solid #29472d;
}

.skinPreview{
  width:44px;
  height:44px;
  border-radius:50%;
  margin:0 auto 6px;
  border:3px solid white;
}

.price{
  color:#ffd84d;
  font-size:12px;
}

.shopBtn{
  width:100%;
  margin-top:6px;
  padding:7px;
  border-radius:8px;
  border:0;
  background:#63ff78;
}

#roomBox{
  display:none;
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  background:#111b12;
}

#roomCode{
  color:#63ff78;
  font-size:34px;
  font-weight:bold;
  letter-spacing:6px;
}

#error{
  min-height:22px;
  color:#ff6874;
  margin-top:7px;
}

#connection{
  color:#839584;
  font-size:12px;
}

#hud{
  display:none;
  position:fixed;
  z-index:20;
  left:10px;
  top:10px;
  gap:6px;
}

.stat{
  background:rgba(0,0,0,.78);
  border:1px solid #315d37;
  border-radius:9px;
  padding:7px 10px;
  color:white;
}

.stat small{
  display:block;
  color:#829382;
  font-size:9px;
}

#leaderboard{
  display:none;
  position:fixed;
  right:10px;
  top:10px;
  z-index:20;
  width:190px;
  background:rgba(0,0,0,.82);
  border:1px solid #315d37;
  border-radius:12px;
  padding:9px;
  color:white;
}

.lbtitle{
  color:#63ff78;
  font-weight:bold;
  margin-bottom:4px;
}

.lbrow{
  display:flex;
  justify-content:space-between;
  padding:4px;
  font-size:12px;
}

#minimap{
  display:none;
  position:fixed;
  right:10px;
  bottom:10px;
  z-index:20;
  width:170px;
  height:170px;
  border-radius:15px;
  overflow:hidden;
  border:2px solid #63ff78;
  background:#102414;
}

#mini{
  width:100%;
  height:100%;
}

#joystick{
  display:none;
  position:fixed;
  z-index:30;
  left:20px;
  bottom:20px;
  width:135px;
  height:135px;
  border-radius:50%;
  border:2px solid rgba(99,255,120,.35);
  background:rgba(99,255,120,.08);
}

#stick{
  position:absolute;
  width:55px;
  height:55px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:#63ff78;
  border:3px solid white;
}

#boost{
  display:none;
  position:fixed;
  z-index:30;
  right:25px;
  bottom:30px;
  width:80px;
  height:80px;
  border-radius:50%;
  border:3px solid #b8edff;
  background:#0783b7;
  color:white;
  font-size:28px;
}

#gameover{
  display:none;
  position:fixed;
  inset:0;
  z-index:200;
  justify-content:center;
  align-items:center;
  background:rgba(0,0,0,.82);
}

.over{
  width:min(400px,90vw);
  padding:30px;
  border-radius:20px;
  background:#09120a;
  color:white;
  text-align:center;
  border:1px solid #315d37;
}

.over h2{
  color:#ff5268;
  font-size:38px;
  margin-bottom:10px;
}

@media(max-width:800px){

  #menu{
    align-items:flex-start;
  }

  #joystick,
  #boost{
    display:block;
  }

  #leaderboard{
    width:150px;
  }

  #minimap{
    width:140px;
    height:140px;
  }

}

</style>

</head>

<body>

<canvas id="game"></canvas>

<div id="menu">

<div class="panel">

<div class="logo">🐍</div>

<h1>SNAKE ARENA</h1>

<div class="sub">
Grow bigger. Outsmart everyone.
</div>

<input
  id="name"
  maxlength="16"
  placeholder="Sinu nimi"
>

<div id="menuCoins">
🪙 <span id="coinsMenu">0</span> coins
</div>

<button
  class="btn dark"
  id="shopButton"
>
🛒 Pood
</button>

<div
  id="shop"
  class="section"
>

<div class="sectionTitle">
🛒 SNAKE SHOP
</div>

<div
  id="shopGrid"
  class="shopGrid"
></div>

</div>

<div class="section">

<div class="sectionTitle">
🎮 MÄNG
</div>

<button
  class="btn green"
  id="singleButton"
>
🤖 SINGLEPLAYER
</button>

</div>

<div class="section">

<div class="sectionTitle">
👥 MULTIPLAYER
</div>

<button
  class="btn dark"
  id="createButton"
>
🏠 CREATE ROOM
</button>

<input
  id="roomInput"
  maxlength="5"
  placeholder="ROOM CODE"
>

<button
  class="btn dark"
  id="joinButton"
>
🚪 JOIN ROOM
</button>

<div id="roomBox">

<div>ROOM</div>

<div id="roomCode">
-----
</div>

<div id="roomPlayers"></div>

<button
  class="btn green"
  id="startButton"
>
▶ ALUSTA MÄNG
</button>

</div>

</div>

<div id="error"></div>

<div id="connection">
Ühendan serveriga...
</div>

</div>

</div>

<div id="hud">

<div class="stat">
<small>SCORE</small>
<b id="score">0</b>
</div>

<div class="stat">
<small>KILLS</small>
<b id="kills">0</b>
</div>

<div class="stat">
<small>LENGTH</small>
<b id="length">30</b>
</div>

<div class="stat">
<small>COINS</small>
<b id="coins">0</b>
</div>

</div>

<div id="leaderboard">

<div class="lbtitle">
🏆 TOP 3
</div>

<div id="lb"></div>

</div>

<div id="minimap">

<canvas id="mini"></canvas>

</div>

<div id="joystick">

<div id="stick"></div>

</div>

<button id="boost">
⚡
</button>

<div id="gameover">

<div class="over">

<h2>GAME OVER</h2>

<p id="deathReason"></p>

<p style="margin-top:12px">
Score:
<b id="finalScore">0</b>
</p>

<p>
Kills:
<b id="finalKills">0</b>
</p>

<button
  class="btn green"
  onclick="location.reload()"
>
🔄 UUESTI
</button>

</div>

</div>

<script>

/* =========================
SETUP
========================= */

const canvas =
document.getElementById("game");

const ctx =
canvas.getContext("2d");

const mini =
document.getElementById("mini");

const mctx =
mini.getContext("2d");

const WORLD = 18000;

let W = innerWidth;
let H = innerHeight;

function resize(){

  W = innerWidth;
  H = innerHeight;

  canvas.width = W;
  canvas.height = H;

  mini.width = 400;
  mini.height = 400;
}

resize();

addEventListener(
  "resize",
  resize
);

/* =========================
COINS
========================= */

let coins =
Number(localStorage.getItem("snakeCoins") || 0);

let owned =
JSON.parse(
  localStorage.getItem("snakeOwned")
  || '["green"]'
);

let skin =
localStorage.getItem("snakeSkin")
|| "green";

const skins = [

  ["green","🟢","#63ff78",0],

  ["blue","🔵","#4da6ff",30],

  ["red","🔴","#ff5268",50],

  ["yellow","🟡","#ffd84d",80],

  ["purple","🟣","#b86cff",100],

  ["orange","🟠","#ff8a3d",120],

  ["cyan","🔵","#00e5d4",150],

  ["white","⚪","#ffffff",200],

  ["pink","🩷","#ff6fcf",250],

  ["rainbow","🌈","#ff70c8",400]

];

function save(){

  localStorage.setItem(
    "snakeCoins",
    coins
  );

  localStorage.setItem(
    "snakeOwned",
    JSON.stringify(owned)
  );

  localStorage.setItem(
    "snakeSkin",
    skin
  );
}

function updateCoins(){

  document.getElementById(
    "coinsMenu"
  ).textContent = coins;

  document.getElementById(
    "coins"
  ).textContent = coins;
}

/* =========================
SHOP
========================= */

const shop =
document.getElementById("shop");

document.getElementById(
  "shopButton"
).onclick = () => {

  shop.style.display =
    shop.style.display === "block"
      ? "none"
      : "block";

};

function renderShop(){

  const grid =
  document.getElementById(
    "shopGrid"
  );

  grid.innerHTML = "";

  for(const s of skins){

    const ownedNow =
      owned.includes(s[0]);

    const div =
      document.createElement("div");

    div.className = "shopItem";

    let buttonText;

    if(ownedNow){

      buttonText =
        skin === s[0]
          ? "✓ Valitud"
          : "Kasuta";

    }else{

      buttonText =
        `🪙 ${s[3]}`;

    }

    div.innerHTML = `

      <div
        class="skinPreview"
        style="background:${s[2]}"
      ></div>

      <b>${s[1]} ${s[0]}</b>

      <div class="price">
        ${ownedNow ? "OSTETUD" : s[3] + " coins"}
      </div>

      <button
        class="shopBtn"
      >
        ${buttonText}
      </button>

    `;

    const button =
      div.querySelector("button");

    button.onclick = () => {

      if(ownedNow){

        skin = s[0];

        save();

        renderShop();

        player.color = s[2];

      }else{

        if(coins < s[3]){

          alert(
            "Sul pole piisavalt coine!"
          );

          return;
        }

        coins -= s[3];

        owned.push(s[0]);

        skin = s[0];

        player.color = s[2];

        save();

        updateCoins();

        renderShop();

      }

    };

    grid.appendChild(div);
  }
}

/* =========================
PLAYER
========================= */

const player = {

  id:null,

  name:
    localStorage.getItem(
      "snakeName"
    ) || "Player",

  x:WORLD/2,

  y:WORLD/2,

  angle:0,

  targetAngle:0,

  length:30,

  score:0,

  kills:0,

  color:"#63ff78",

  body:[]

};

document.getElementById(
  "name"
).value = player.name;

document.getElementById(
  "name"
).oninput = e => {

  player.name =
    e.target.value
    .replace(/[<>]/g,"")
    .substring(0,16);

  localStorage.setItem(
    "snakeName",
    player.name
  );
};

function applySkin(){

  const s =
    skins.find(
      x => x[0] === skin
    );

  if(s)
    player.color = s[2];

}

applySkin();

/* =========================
REMOTE
========================= */

const remote =
new Map();

let bots = [];

let running = false;
let multiplayer = false;
let dead = false;

function resetPlayer(){

  player.x =
    WORLD/2;

  player.y =
    WORLD/2;

  player.angle =
    Math.random() *
    Math.PI * 2;

  player.targetAngle =
    player.angle;

  player.length = 30;

  player.score = 0;

  player.kills = 0;

  player.body = [];

  for(
    let i=0;
    i<30;
    i++
  ){

    player.body.push({

      x:
        player.x -
        Math.cos(player.angle) *
        i * 8,

      y:
        player.y -
        Math.sin(player.angle) *
        i * 8

    });

  }

}

/* =========================
FOOD
========================= */

const food = [];

function newFood(){

  return {

    x:
      100 +
      Math.random() *
      (WORLD-200),

    y:
      100 +
      Math.random() *
      (WORLD-200),

    r:
      4 +
      Math.random()*4,

    value:
      1 +
      Math.floor(
        Math.random()*3
      ),

    color:[
      "#63ff78",
      "#ffd84d",
      "#ff5268",
      "#4da6ff",
      "#b86cff",
      "#ff8a3d"
    ][
      Math.floor(
        Math.random()*6
      )
    ]

  };

}

for(
  let i=0;
  i<1100;
  i++
){

  food.push(
    newFood()
  );

}

/* =========================
BOTS
========================= */

const botNames = [
  "Viper",
  "Cobra",
  "Ghost",
  "Blaze",
  "Hunter",
  "Storm",
  "Ninja",
  "Python",
  "Venom",
  "Shadow"
];

const botColors = [
  "#4da6ff",
  "#ff5268",
  "#ffd84d",
  "#b86cff",
  "#ff8a3d",
  "#00e5d4"
];

function makeBot(){

  const angle =
    Math.random() *
    Math.PI*2;

  const b = {

    id:
      Math.random()
      .toString(36)
      .substring(2),

    name:
      botNames[
        Math.floor(
          Math.random() *
          botNames.length
        )
      ],

    x:
      800 +
      Math.random() *
      (WORLD-1600),

    y:
      800 +
      Math.random() *
      (WORLD-1600),

    angle,

    target:angle,

    length:
      30 +
      Math.random()*100,

    score:0,

    color:
      botColors[
        Math.floor(
          Math.random() *
          botColors.length
        )
      ],

    body:[],

    think:0

  };

  for(
    let i=0;
    i<b.length;
    i++
  ){

    b.body.push({

      x:
        b.x -
        Math.cos(angle) *
        i * 8,

      y:
        b.y -
        Math.sin(angle) *
        i * 8

    });

  }

  return b;
}

function startBots(){

  bots=[];

  for(
    let i=0;
    i<18;
    i++
  ){

    bots.push(
      makeBot()
    );

  }
}

/* =========================
MOUSE
========================= */

let mouseX =
  innerWidth/2;

let mouseY =
  innerHeight/2;

addEventListener(
  "mousemove",
  e => {

    mouseX=e.clientX;
    mouseY=e.clientY;

  }
);

function mouseControl(){

  if(innerWidth<=800)
    return;

  const dx =
    mouseX - W/2;

  const dy =
    mouseY - H/2;

  if(
    Math.hypot(dx,dy)>8
  ){

    player.targetAngle =
      Math.atan2(
        dy,
        dx
      );

  }

}

/* =========================
JOYSTICK
========================= */

const joystick =
document.getElementById(
  "joystick"
);

const stick =
document.getElementById(
  "stick"
);

let joy=false;

function joystickMove(
  x,
  y
){

  const r =
    joystick.getBoundingClientRect();

  const cx =
    r.left+r.width/2;

  const cy =
    r.top+r.height/2;

  let dx=x-cx;
  let dy=y-cy;

  const max=52;

  const d =
    Math.hypot(dx,dy);

  if(d>max){

    dx =
      dx/d*max;

    dy =
      dy/d*max;

  }

  stick.style.left =
    `calc(50% + ${dx}px)`;

  stick.style.top =
    `calc(50% + ${dy}px)`;

  if(d>7){

    player.targetAngle =
      Math.atan2(
        dy,
        dx
      );

  }

}

joystick.addEventListener(
  "pointerdown",
  e => {

    joy=true;

    joystick.setPointerCapture(
      e.pointerId
    );

    joystickMove(
      e.clientX,
      e.clientY
    );

  }
);

joystick.addEventListener(
  "pointermove",
  e => {

    if(joy){

      joystickMove(
        e.clientX,
        e.clientY
      );

    }

  }
);

function stopJoy(){

  joy=false;

  stick.style.left="50%";
  stick.style.top="50%";

}

joystick.addEventListener(
  "pointerup",
  stopJoy
);

joystick.addEventListener(
  "pointercancel",
  stopJoy
);

/* =========================
BOOST
========================= */

let boosting=false;

const boost =
document.getElementById(
  "boost"
);

boost.onpointerdown = e => {

  e.preventDefault();

  boosting=true;

};

boost.onpointerup = () => {
  boosting=false;
};

boost.onpointercancel = () => {
  boosting=false;
};

addEventListener(
  "keydown",
  e => {

    if(
      e.key==="Shift" ||
      e.key===" "
    ){

      boosting=true;

    }

  }
);

addEventListener(
  "keyup",
  e => {

    if(
      e.key==="Shift" ||
      e.key===" "
    ){

      boosting=false;

    }

  }
);

/* =========================
LOCAL MOVEMENT
========================= */

function smoothAngle(){

  let d =
    player.targetAngle -
    player.angle;

  while(d>Math.PI)
    d-=Math.PI*2;

  while(d<-Math.PI)
    d+=Math.PI*2;

  player.angle += d*.18;

}

function updateLocal(){

  if(
    !running ||
    dead
  )
    return;

  mouseControl();

  smoothAngle();

  const speed =
    boosting
      ? 10.5
      : 7.5;

  player.x +=
    Math.cos(player.angle) *
    speed;

  player.y +=
    Math.sin(player.angle) *
    speed;

  if(
    player.x<30 ||
    player.x>WORLD-30 ||
    player.y<30 ||
    player.y>WORLD-30
  ){

    die(
      "Läksid kaardi serva!"
    );

    return;

  }

  player.body.unshift({

    x:player.x,
    y:player.y

  });

  if(
    boosting &&
    player.length>32
  ){

    player.length-=.025;

  }

  while(
    player.body.length <
    Math.floor(player.length)
  ){

    const last =
      player.body[
        player.body.length-1
      ];

    player.body.push({

      x:last.x,
      y:last.y

    });

  }

  while(
    player.body.length >
    Math.floor(player.length)
  ){

    player.body.pop();

  }

  eatFood();

  checkLocalCollisions();

}

/* =========================
FOOD
========================= */

function eatFood(){

  for(
    let i=food.length-1;
    i>=0;
    i--
  ){

    const f=food[i];

    if(
      Math.hypot(
        player.x-f.x,
        player.y-f.y
      )<28
    ){

      player.score+=f.value;

      player.length+=
        f.value*.7;

      food.splice(i,1);

      food.push(
        newFood()
      );

    }

  }

}

/* =========================
BOTS UPDATE
========================= */

function updateBots(){

  for(
    const b of bots
  ){

    b.think--;

    if(
      b.think<=0
    ){

      b.think =
        30 +
        Math.random()*100;

      let nearest=null;
      let best=Infinity;

      for(
        let i=0;
        i<food.length;
        i+=7
      ){

        const f=food[i];

        const d =
          Math.hypot(
            f.x-b.x,
            f.y-b.y
          );

        if(d<best){

          best=d;
          nearest=f;

        }

      }

      if(nearest){

        b.target =
          Math.atan2(
            nearest.y-b.y,
            nearest.x-b.x
          );

      }

    }

    let d =
      b.target-b.angle;

    while(d>Math.PI)
      d-=Math.PI*2;

    while(d<-Math.PI)
      d+=Math.PI*2;

    b.angle += d*.06;

    b.x +=
      Math.cos(b.angle)*5.5;

    b.y +=
      Math.sin(b.angle)*5.5;

    if(
      b.x<100 ||
      b.x>WORLD-100
    ){

      b.target =
        Math.PI-b.target;

    }

    if(
      b.y<100 ||
      b.y>WORLD-100
    ){

      b.target =
        -b.target;

    }

    b.body.unshift({

      x:b.x,
      y:b.y

    });

    while(
      b.body.length <
      Math.floor(b.length)
    ){

      const last =
        b.body[
          b.body.length-1
        ];

      b.body.push({

        x:last.x,
        y:last.y

      });

    }

    while(
      b.body.length >
      Math.floor(b.length)
    ){

      b.body.pop();

    }

    for(
      let i=food.length-1;
      i>=0;
      i--
    ){

      const f=food[i];

      if(
        Math.hypot(
          b.x-f.x,
          b.y-f.y
        )<25
      ){

        b.score+=f.value;

        b.length+=
          f.value*.5;

        food.splice(i,1);

        food.push(
          newFood()
        );

        break;

      }

    }

  }

  botCombat();

}

/* =========================
SNAKE COLLISION
========================= */

function botCombat(){

  for(
    const b of [...bots]
  ){

    /*
    BOT HEAD -> PLAYER BODY
    */

    for(
      let i=7;
      i<player.body.length;
      i+=2
    ){

      const part =
        player.body[i];

      if(
        Math.hypot(
          b.x-part.x,
          b.y-part.y
        )<25
      ){

        killBot(b);

        break;

      }

    }

    if(
      !bots.includes(b)
    )
      continue;

    /*
    PLAYER HEAD -> BOT BODY
    */

    for(
      let i=7;
      i<b.body.length;
      i+=2
    ){

      const part=b.body[i];

      if(
        Math.hypot(
          player.x-part.x,
          player.y-part.y
        )<25
      ){

        die(
          b.name+
          " tabas sinu keha!"
        );

        return;

      }

    }

  }

}

function checkLocalCollisions(){

  /*
  BODY COLLISION
  */

  for(
    const b of bots
  ){

    for(
      let i=7;
      i<b.body.length;
      i+=2
    ){

      const part=b.body[i];

      if(
        Math.hypot(
          player.x-part.x,
          player.y-part.y
        )<25
      ){

        die(
          b.name+
          " tabas sind!"
        );

        return;

      }

    }

  }

}

/* =========================
KILL
========================= */

function killBot(b){

  const index =
    bots.indexOf(b);

  if(index<0)
    return;

  for(
    let i=0;
    i<b.body.length;
    i+=5
  ){

    food.push({

      x:b.body[i].x,
      y:b.body[i].y,
      r:6,
      value:2,
      color:b.color

    });

  }

  bots.splice(
    index,
    1
  );

  player.kills++;

  player.score+=10;

  player.length+=12;

  coins+=10;

  save();

  updateCoins();

  setTimeout(
    () => {

      if(
        running &&
        !dead &&
        !multiplayer
      ){

        bots.push(
          makeBot()
        );

      }

    },
    700
  );

}

/* =========================
DRAW SNAKE
========================= */

function drawSnake(s){

  if(
    !s.body ||
    !s.body.length
  )
    return;

  for(
    let i=s.body.length-1;
    i>=0;
    i--
  ){

    const p=s.body[i];

    const t =
      i /
      Math.max(
        1,
        s.body.length-1
      );

    const radius =
      i===0
        ? 24
        : 12-t*4;

    ctx.fillStyle=s.color;

    ctx.beginPath();

    ctx.arc(
      p.x,
      p.y,
      Math.max(
        8,
        radius
      ),
      0,
      Math.PI*2
    );

    ctx.fill();

  }

  /*
  HEAD
  */

  ctx.save();

  ctx.translate(
    s.x,
    s.y
  );

  ctx.rotate(
    s.angle
  );

  ctx.fillStyle=s.color;

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    24,
    0,
    Math.PI*2
  );

  ctx.fill();

  /*
  EYES
  */

  ctx.fillStyle="white";

  ctx.beginPath();

  ctx.arc(
    11,
    -9,
    7,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.arc(
    11,
    9,
    7,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.fillStyle="#111";

  ctx.beginPath();

  ctx.arc(
    14,
    -9,
    3,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.arc(
    14,
    9,
    3,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.restore();

  /*
  NAME
  */

  ctx.textAlign="center";

  ctx.font=
    "bold 14px Arial";

  ctx.lineWidth=4;

  ctx.strokeStyle=
    "rgba(0,0,0,.8)";

  ctx.strokeText(
    s.name || "Player",
    s.x,
    s.y-38
  );

  ctx.fillStyle="white";

  ctx.fillText(
    s.name || "Player",
    s.x,
    s.y-38
  );

}

/* =========================
DRAW
========================= */

function draw(){

  ctx.fillStyle="#071008";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

  if(!running)
    return;

  ctx.save();

  ctx.translate(
    W/2-player.x,
    H/2-player.y
  );

  ctx.fillStyle="#102414";

  ctx.fillRect(
    0,
    0,
    WORLD,
    WORLD
  );

  /*
  GRID
  */

  ctx.strokeStyle=
    "rgba(255,255,255,.035)";

  const grid=100;

  const startX =
    Math.floor(
      (player.x-W/2)/grid
    )*grid;

  const endX =
    Math.ceil(
      (player.x+W/2)/grid
    )*grid;

  for(
    let x=startX;
    x<=endX;
    x+=grid
  ){

    ctx.beginPath();

    ctx.moveTo(
      x,
      player.y-H/2
    );

    ctx.lineTo(
      x,
      player.y+H/2
    );

    ctx.stroke();

  }

  const startY =
    Math.floor(
      (player.y-H/2)/grid
    )*grid;

  const endY =
    Math.ceil(
      (player.y+H/2)/grid
    )*grid;

  for(
    let y=startY;
    y<=endY;
    y+=grid
  ){

    ctx.beginPath();

    ctx.moveTo(
      player.x-W/2,
      y
    );

    ctx.lineTo(
      player.x+W/2,
      y
    );

    ctx.stroke();

  }

  /*
  FOOD
  */

  for(
    const f of food
  ){

    if(
      Math.abs(
        f.x-player.x
      )>W/2+100 ||
      Math.abs(
        f.y-player.y
      )>H/2+100
    )
      continue;

    ctx.fillStyle=f.color;

    ctx.beginPath();

    ctx.arc(
      f.x,
      f.y,
      f.r,
      0,
      Math.PI*2
    );

    ctx.fill();

  }

  /*
  BOTS
  */

  for(
    const b of bots
  ){

    drawSnake(b);

  }

  /*
  REMOTE
  */

  for(
    const p of remote.values()
  ){

    if(
      p.alive !== false
    ){

      drawSnake(p);

    }

  }

  /*
  PLAYER
  */

  drawSnake(player);

  ctx.restore();

  drawMinimap();

}

/* =========================
MINIMAP
========================= */

function miniPoint(
  x,
  y,
  color,
  size
){

  mctx.fillStyle=color;

  mctx.beginPath();

  mctx.arc(
    x/WORLD*400,
    y/WORLD*400,
    size,
    0,
    Math.PI*2
  );

  mctx.fill();

}

function drawMinimap(){

  mctx.clearRect(
    0,
    0,
    400,
    400
  );

  mctx.fillStyle="#102414";

  mctx.fillRect(
    0,
    0,
    400,
    400
  );

  for(
    const b of bots
  ){

    miniPoint(
      b.x,
      b.y,
      b.color,
      5
    );

  }

  for(
    const p of remote.values()
  ){

    if(
      p.alive !== false
    ){

      miniPoint(
        p.x,
        p.y,
        p.color,
        5
      );

    }

  }

  miniPoint(
    player.x,
    player.y,
    player.color,
    8
  );

}

/* =========================
HUD

function updateHUD(){

function updateLeaderboard(){

  const all=[

      name:player.name,

      color:player.color

  ];

  for(
    const b of bots
  ){

    all.push({
      name:b.name,

    });

  for(
    const p of remote.values()

    all.push({

      color:p.color
    });

  all.sort(
    (a,b)=>

  );

  all.slice(0,3).forEach(
    (p,i) => {

      const row =

          "div"
        );

      row.className="lbrow";

      row.innerHTML=`

        <span style="color:${p.color}">
          ${i+1}. ${
            String(p.name)
            .replace(/[<>]/g,"")
          }

        <b>
          ${Math.floor(p.score)}
        </b>

      `;

      box.appendChild(row);

    }
  );

}

/* =========================
WEBSOCKET
========================= */

let socket=null;
let myId=null;

function connect(){

  const protocol =
    location.protocol === "https:"
      ? "wss:"
      : "ws:";

  socket =
    new WebSocket(
      protocol+
      "//"+
      location.host
    );

  socket.onopen = () => {

    document.getElementById(
      "connection"
    ).textContent =
      "🟢 Multiplayer ühendatud";

  };

  socket.onclose = () => {

    document.getElementById(
      "connection"
    ).textContent =
      "🔴 Multiplayer katkes";

  };

  socket.onerror = () => {

    document.getElementById(
      "connection"
    ).textContent =
      "🔴 Serveri viga";

  };

  socket.onmessage = e => {

    let data;

    try{
      data=JSON.parse(e.data);
    }
    catch{
      return;
    }

    if(
      data.type==="connected"
    ){

      myId=data.id;

      player.id=myId;

    }

    if(
      data.type==="created" ||
      data.type==="joined"
    ){

      multiplayer=true;

      myId=data.id;

      player.id=myId;

      document.getElementById(
        "roomBox"
      ).style.display="block";

      document.getElementById(
        "roomCode"
      ).textContent=
        data.code;

    }

    if(
      data.type==="gameStart"
    ){

      startGame();

    }

    if(
      data.type==="state"
    ){

      const me =
        data.players.find(
          p=>p.id===myId
        );

      if(me){

        /*
        Server annab positsiooni,
        aga liikumine jääb kliendis
        sujuvaks.
        */

        player.x =
          lerp(
            player.x,
            me.x,
            .45
          );

        player.y =
          lerp(
            player.y,
            me.y,
            .45
          );

        player.angle =
          lerpAngle(
            player.angle,
            me.angle,
            .35
          );

        player.length =
          me.length;

        player.score =
          me.score;

        player.kills =
          me.kills;

        player.color =
          me.color;

        if(
          Array.isArray(me.body)
        ){

          player.body =
            me.body;

        }

      }

      remote.clear();

      for(
        const p of data.players
      ){

        if(
          p.id!==myId
        ){

          remote.set(
            p.id,
            p
          );

        }

      }

      updateRoomPlayers(
        data.players
      );

    }

    if(
      data.type==="error"
    ){

      document.getElementById(
        "error"
      ).textContent =
        data.message;

    }

  };

}

function lerp(a,b,t){

  return a+(b-a)*t;

}

function lerpAngle(a,b,t){

  let d=b-a;

  while(d>Math.PI)
    d-=Math.PI*2;

  while(d<-Math.PI)
    d+=Math.PI*2;

  return a+d*t;

}

/* =========================
SEND INPUT
========================= */

let lastSend=0;

function sendInput(){

  if(
    !multiplayer ||
    !socket ||
    socket.readyState!==WebSocket.OPEN ||
    !running
  )
    return;

  const now=
    performance.now();

  if(
    now-lastSend<30
  )
    return;

  socket.send(
    JSON.stringify({

      type:"input",

      angle:
        player.targetAngle,

      boosting

    })
  );

  lastSend=now;

}

ROOM BUTTONS

function updateRoomPlayers(
  players
){

  const box =
    document.getElementById(
      "roomPlayers"
    );

  box.innerHTML="";

  players.forEach(
    p => {

      const div =
        document.createElement(
          "div"
        );

      div.textContent =
        p.name;

      div.style.color =
        p.color;

      box.appendChild(div);

    }
  );

}

/* =========================
LOOP
========================= */

function loop(){

  if(running){

    if(multiplayer){

      /*
      Multiplayeri klient
      liigub kohe ise.
      */

      mouseControl();

      smoothAngle();

      const speed =
        boosting
          ? 10.5
          : 7.5;

      player.x +=
        Math.cos(player.angle) *
        speed;

      player.y +=
        Math.sin(player.angle) *
        speed;

      player.body.unshift({

        x:player.x,
        y:player.y

      });

      while(
        player.body.length<
        Math.floor(player.length)
      ){

        const last =
          player.body[
            player.body.length-1
          ];

        player.body.push({

          x:last.x,
          y:last.y

        });

      }

      while(
        player.body.length>
        Math.floor(player.length)
      ){

        player.body.pop();

      }

      sendInput();

    }else{

      updateLocal();

      updateBots();

    }

    updateHUD();

  }

  draw();

  requestAnimationFrame(
    loop
  );

}

/* =========================
INIT
========================= */

renderShop();

updateCoins();

connect();

requestAnimationFrame(
  loop
);
