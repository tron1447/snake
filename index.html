<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>Snake Arena</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#050805;
  font-family:Arial,sans-serif;
}

body{
  touch-action:none;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}

button{
  border:0;
  cursor:pointer;
  font-weight:bold;
}

input{
  width:100%;
  height:48px;
  margin:5px 0;
  border-radius:12px;
  border:1px solid #315c37;
  background:#071007;
  color:white;
  text-align:center;
  font-size:16px;
  outline:none;
}

#menu{
  position:fixed;
  inset:0;
  z-index:100;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow-y:auto;
  padding:20px;
  background:
    radial-gradient(circle at 50% 15%,#245f2d,#0a1b0d 45%,#020402 90%);
}

.panel{
  width:min(94vw,470px);
  max-height:calc(100vh - 40px);
  overflow-y:auto;
  padding:25px;
  background:rgba(4,12,5,.97);
  border:1px solid rgba(99,255,120,.4);
  border-radius:28px;
  color:white;
  text-align:center;
  box-shadow:0 0 70px rgba(99,255,120,.15);
}

.logo{
  font-size:62px;
}

h1{
  color:#63ff78;
  font-size:40px;
}

.subtitle{
  color:#829384;
  margin:6px 0 18px;
}

.btn{
  width:100%;
  min-height:48px;
  margin-top:8px;
  border-radius:12px;
  font-size:15px;
}

.green{
  background:#63ff78;
  color:#031006;
}

.dark{
  background:#102014;
  color:white;
  border:1px solid #315b36;
}

.gold{
  background:#ffd84d;
  color:#211b00;
}

#mainMenuButtons{
  display:grid;
  gap:8px;
}

#shop{
  display:none;
}

#skinGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:14px;
}

.skinCard{
  min-height:92px;
  border-radius:14px;
  background:#0c180e;
  border:1px solid #29492d;
  color:white;
  padding:7px;
}

.skinHead{
  width:48px;
  height:48px;
  border-radius:50%;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
}

.skinCard.selected{
  border-color:white;
  box-shadow:0 0 15px rgba(255,255,255,.25);
}

.skinCard.owned{
  border-color:#63ff78;
}

.price{
  color:#ffd84d;
  font-size:11px;
  margin-top:4px;
}

#coins{
  color:#ffd84d;
  font-weight:bold;
}

#roomScreen{
  display:none;
}

#roomCode{
  color:#63ff78;
  font-size:34px;
  font-weight:bold;
  letter-spacing:6px;
  margin:10px;
}

#players{
  margin-top:10px;
  max-height:180px;
  overflow:auto;
}

.playerRow{
  padding:9px;
  margin:5px 0;
  border-radius:10px;
  background:#0b170d;
  text-align:left;
}

#error{
  color:#ff6676;
  min-height:22px;
  margin-top:8px;
}

#connection{
  color:#718172;
  font-size:11px;
  margin-top:8px;
}

#hud{
  position:fixed;
  z-index:20;
  left:10px;
  top:10px;
  display:none;
  gap:6px;
}

.stat{
  padding:7px 10px;
  border-radius:10px;
  background:rgba(0,0,0,.7);
  border:1px solid rgba(99,255,120,.25);
  color:white;
}

.stat small{
  display:block;
  color:#78907c;
  font-size:9px;
}

.stat b{
  font-size:16px;
}

#leaderboard{
  position:fixed;
  z-index:25;
  top:10px;
  right:10px;
  width:190px;
  padding:10px;
  border-radius:14px;
  background:rgba(0,0,0,.72);
  border:1px solid rgba(99,255,120,.3);
  color:white;
  display:none;
}

#leaderboard h3{
  color:#ffd84d;
  font-size:14px;
  margin-bottom:7px;
}

.lb{
  display:flex;
  justify-content:space-between;
  padding:4px 0;
  font-size:12px;
}

#minimap{
  position:fixed;
  z-index:20;
  right:10px;
  top:145px;
  width:150px;
  height:150px;
  display:none;
  border-radius:15px;
  border:2px solid rgba(99,255,120,.7);
  background:#061007;
}

#joystick{
  position:fixed;
  z-index:30;
  left:22px;
  bottom:22px;
  width:145px;
  height:145px;
  display:none;
  border-radius:50%;
  background:rgba(99,255,120,.08);
  border:2px solid rgba(99,255,120,.35);
}

#stick{
  position:absolute;
  left:50%;
  top:50%;
  width:62px;
  height:62px;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:#63ff78;
  border:3px solid white;
  box-shadow:0 0 20px rgba(99,255,120,.5);
}

#boost{
  position:fixed;
  z-index:30;
  right:25px;
  bottom:30px;
  width:90px;
  height:90px;
  display:none;
  border-radius:50%;
  background:#087bb0;
  color:white;
  border:3px solid #a5e3ff;
  font-size:27px;
}

#killText{
  position:fixed;
  z-index:50;
  left:50%;
  top:25%;
  transform:translate(-50%,-50%) scale(.7);
  opacity:0;
  color:#63ff78;
  font-size:36px;
  font-weight:900;
  text-shadow:0 0 20px #63ff78;
  transition:.2s;
  pointer-events:none;
}

#killText.show{
  opacity:1;
  transform:translate(-50%,-50%) scale(1);
}

#gameOver{
  position:fixed;
  inset:0;
  z-index:90;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,.8);
}

.overPanel{
  width:min(90vw,400px);
  padding:30px;
  background:#081008;
  border:1px solid #315b36;
  border-radius:25px;
  text-align:center;
  color:white;
}

.overPanel h2{
  color:#ff596c;
  font-size:38px;
}

#singleBtn{
  background:#b86cff;
  color:white;
}

@media(max-width:800px){

  #joystick,
  #boost{
    display:block;
  }

  #leaderboard{
    width:155px;
    top:10px;
    right:10px;
  }

  #minimap{
    top:155px;
    right:10px;
    width:120px;
    height:120px;
  }

  #hud{
    top:10px;
    left:10px;
  }

  #skinGrid{
    grid-template-columns:repeat(4,1fr);
  }
}

@media(max-width:480px){

  .panel{
    padding:18px;
  }

  h1{
    font-size:32px;
  }

  #skinGrid{
    grid-template-columns:repeat(2,1fr);
  }

}

</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="menu">

  <div class="panel">

    <div class="logo">🐍</div>

    <h1>SNAKE ARENA</h1>

    <div class="subtitle">
      Eat • Grow • Fight
    </div>

    <input
      id="name"
      maxlength="16"
      placeholder="Sinu nimi"
    >

    <div style="margin:12px">
      🪙 <span id="coins">0</span> COINS
    </div>

    <div id="mainMenuButtons">

      <button
        id="singleBtn"
        class="btn"
      >
        🤖 SINGLEPLAYER
      </button>

      <button
        id="multiBtn"
        class="btn green"
      >
        🌐 MULTIPLAYER
      </button>

      <button
        id="shopBtn"
        class="btn gold"
      >
        🛒 POOD
      </button>

    </div>

    <div id="roomScreen">

      <h2 style="margin-top:15px">
        MULTIPLAYER
      </h2>

      <button
        id="createBtn"
        class="btn green"
      >
        🏠 CREATE ROOM
      </button>

      <input
        id="roomInput"
        maxlength="6"
        placeholder="ROOM CODE"
      >

      <button
        id="joinBtn"
        class="btn dark"
      >
        🚪 JOIN ROOM
      </button>

      <div id="roomCode">
        ------
      </div>

      <div id="players"></div>

      <button
        id="startBtn"
        class="btn green"
        style="display:none"
      >
        ▶ START GAME
      </button>

      <button
        id="backBtn"
        class="btn dark"
      >
        ← TAGASI
      </button>

      <div id="connection">
        Ühendamine...
      </div>

      <div id="error"></div>

    </div>

    <div id="shop">

      <h2>🛒 POOD</h2>

      <p style="color:#879889;margin:7px">
        Osta skin ja see jääb sulle alles.
      </p>

      <div id="skinGrid"></div>

      <button
        id="shopBack"
        class="btn dark"
      >
        ← TAGASI
      </button>

    </div>

  </div>

</div>

<div id="hud">

  <div class="stat">
    <small>SCORE</small>
    <b id="score">0</b>
  </div>

  <div class="stat">
    <small>KILLS</small>
    <b id="kills">0</b>
  </div>

  <div class="stat">
    <small>LENGTH</small>
    <b id="length">25</b>
  </div>

</div>

<div id="leaderboard">

  <h3>🏆 TOP 3</h3>

  <div id="lbRows"></div>

</div>

<canvas
  id="minimap"
  width="150"
  height="150">
</canvas>

<div id="killText">
  💥 ELIMINATED +10 🪙
</div>

<div id="joystick">
  <div id="stick"></div>
</div>

<button id="boost">
  ⚡
</button>

<div id="gameOver">

  <div class="overPanel">

    <h2>GAME OVER</h2>

    <p id="deathReason">
      Sind tapeti!
    </p>

    <p style="margin-top:12px">
      Skoor:
      <b id="finalScore">0</b>
    </p>

    <p>
      Killid:
      <b id="finalKills">0</b>
    </p>

    <button
      id="again"
      class="btn green"
    >
      🔄 UUESTI
    </button>

    <button
      id="menuAgain"
      class="btn dark"
    >
      🏠 MENÜÜ
    </button>

  </div>

</div>

<script>

/* ================================
   CANVAS
================================ */

const canvas =
  document.getElementById("game");

const ctx =
  canvas.getContext("2d");

const minimap =
  document.getElementById("minimap");

const mapCtx =
  minimap.getContext("2d");

let W = innerWidth;
let H = innerHeight;

function resize(){

  W = innerWidth;
  H = innerHeight;

  canvas.width = W;
  canvas.height = H;
}

addEventListener("resize",resize);
resize();


/* ================================
   GAME
================================ */

const WORLD = 20000;

let running = false;
let singleplayer = false;
let dead = false;

let score = 0;
let kills = 0;

let boosting = false;

let cameraX = 10000;
let cameraY = 10000;

const me = {

  id:null,

  x:10000,
  y:10000,

  angle:0,
  targetAngle:0,

  length:25,

  color:"#63ff78",
  skin:"green",

  name:"Player"
};

let body = [];

let others = {};


/* ================================
   COINS / SKINS
================================ */

let coins =
  Number(localStorage.getItem("snakeCoins") || 0);

let owned =
  JSON.parse(
    localStorage.getItem("snakeOwned") ||
    '["green"]'
  );

let selectedSkin =
  localStorage.getItem("snakeSkin") ||
  "green";

const skinData = {

  green:{
    color:"#63ff78",
    emoji:"🐍",
    price:0
  },

  blue:{
    color:"#4da6ff",
    emoji:"😎",
    price:20
  },

  red:{
    color:"#ff5570",
    emoji:"😈",
    price:30
  },

  yellow:{
    color:"#ffd84d",
    emoji:"😄",
    price:40
  },

  purple:{
    color:"#b86cff",
    emoji:"👾",
    price:50
  },

  orange:{
    color:"#ff8a3d",
    emoji:"🔥",
    price:60
  },

  white:{
    color:"#ffffff",
    emoji:"👻",
    price:75
  },

  cyan:{
    color:"#00e5d4",
    emoji:"🤖",
    price:90
  },

  pink:{
    color:"#ff69c9",
    emoji:"😺",
    price:110
  },

  gold:{
    color:"#ffc400",
    emoji:"👑",
    price:150
  },

  dark:{
    color:"#6c6c78",
    emoji:"💀",
    price:200
  },

  rainbow:{
    color:"#ffffff",
    emoji:"🌈",
    price:300
  }
};

function saveCoins(){

  localStorage.setItem(
    "snakeCoins",
    String(coins)
  );

  document.getElementById("coins")
    .textContent = coins;
}

function saveSkins(){

  localStorage.setItem(
    "snakeOwned",
    JSON.stringify(owned)
  );

  localStorage.setItem(
    "snakeSkin",
    selectedSkin
  );
}

function applySkin(){

  const s = skinData[selectedSkin];

  me.skin = selectedSkin;
  me.color = s.color;

  saveSkins();
}

applySkin();
saveCoins();


/* ================================
   SHOP
================================ */

function renderShop(){

  const grid =
    document.getElementById("skinGrid");

  grid.innerHTML = "";

  for(const key in skinData){

    const s = skinData[key];

    const card =
      document.createElement("button");

    card.className = "skinCard";

    if(key === selectedSkin){
      card.classList.add("selected");
    }

    if(owned.includes(key)){
      card.classList.add("owned");
    }

    card.innerHTML = `
      <div
        class="skinHead"
        style="
          background:${s.color};
          box-shadow:0 0 15px ${s.color};
        "
      >
        ${s.emoji}
      </div>

      <div style="font-size:11px;margin-top:5px">
        ${key.toUpperCase()}
      </div>

      <div class="price">
        ${
          owned.includes(key)
          ? "✓ OMA"
          : "🪙 "+s.price
        }
      </div>
    `;

    card.onclick = () => {

      if(owned.includes(key)){

        selectedSkin = key;

        applySkin();

        renderShop();

        return;
      }

      if(coins < s.price){

        alert(
          "Sul ei ole piisavalt coine!"
        );

        return;
      }

      coins -= s.price;

      owned.push(key);

      selectedSkin = key;

      applySkin();

      saveCoins();

      renderShop();
    };

    grid.appendChild(card);
  }
}

document
  .getElementById("shopBtn")
  .onclick = () => {

    document
      .getElementById("mainMenuButtons")
      .style.display = "none";

    document
      .getElementById("shop")
      .style.display = "block";

    renderShop();
  };

document
  .getElementById("shopBack")
  .onclick = () => {

    document
      .getElementById("shop")
      .style.display = "none";

    document
      .getElementById("mainMenuButtons")
      .style.display = "grid";
  };


/* ================================
   FOOD
================================ */

const foods = [];

const FOOD_COUNT = 1800;

const foodColors = [
  "#63ff78",
  "#ffd84d",
  "#ff6075",
  "#55c9ff",
  "#c76cff",
  "#ff963d"
];

function makeFood(x,y){

  return {

    x:
      x ??
      Math.random()*WORLD,

    y:
      y ??
      Math.random()*WORLD,

    radius:
      3 + Math.random()*5,

    color:
      foodColors[
        Math.floor(
          Math.random()*foodColors.length
        )
      ],

    value:
      1 + Math.floor(
        Math.random()*5
      )
  };
}

for(let i=0;i<FOOD_COUNT;i++){
  foods.push(makeFood());
}


/* ================================
   DROPPED BOOST FOOD
================================ */

function dropBoostFood(){

  if(me.length <= 20){
    return;
  }

  const count = 1;

  for(let i=0;i<count;i++){

    foods.push({

      x:
        me.x -
        Math.cos(me.angle) *
        (15 + Math.random()*15),

      y:
        me.y -
        Math.sin(me.angle) *
        (15 + Math.random()*15),

      radius:5,

      color:"#55c9ff",

      value:3
    });
  }
}


/* ================================
   SOCKET
================================ */

let socket = null;
let connected = false;

function connect(){

  const protocol =
    location.protocol === "https:"
    ? "wss:"
    : "ws:";

  try{

    socket =
      new WebSocket(
        protocol +
        "//" +
        location.host
      );

    setConnection("🟡 Ühendamine...");

    socket.onopen = () => {

      connected = true;

      setConnection(
        "🟢 Server ühendatud"
      );
    };

    socket.onclose = () => {

      connected = false;

      setConnection(
        "🔴 Ühendus katkes"
      );
    };

    socket.onerror = () => {

      connected = false;

      setConnection(
        "🔴 Serveri viga"
      );
    };

    socket.onmessage = e => {

      let data;

      try{
        data = JSON.parse(e.data);
      }catch{
        return;
      }

      serverMessage(data);
    };

  }catch{

    setConnection(
      "🔴 WebSocket ei tööta"
    );
  }
}

function send(data){

  if(
    !socket ||
    socket.readyState !== WebSocket.OPEN
  ){
    return false;
  }

  socket.send(
    JSON.stringify(data)
  );

  return true;
}


/* ================================
   SERVER
================================ */

function serverMessage(data){

  if(data.type === "roomCreated"){

    me.id = data.id;

    document
      .getElementById("roomCode")
      .textContent = data.code;

    return;
  }

  if(data.type === "roomJoined"){

    me.id = data.id;

    document
      .getElementById("roomCode")
      .textContent = data.code;

    return;
  }

  if(data.type === "lobby"){

    updateLobby(
      data.players || []
    );

    return;
  }

  if(data.type === "gameStart"){

    me.id = data.id;

    startGame(false);

    return;
  }

  if(data.type === "players"){

    others =
      data.players || {};

    updateLeaderboard();

    return;
  }

  if(data.type === "playerKilled"){

    if(data.killer === me.id){

      kills++;

      score += 100;

      coins += 10;

      saveCoins();

      showKill();

      for(
        const p of data.dropped || []
      ){

        foods.push({

          x:p.x,
          y:p.y,

          radius:5,

          color:"#ffcf40",

          value:4
        });
      }
    }

    return;
  }

  if(data.type === "gameOver"){

    die(
      data.reason ||
      "Sind tapeti!"
    );

    return;
  }

  if(data.type === "error"){

    showError(
      data.message || "Viga"
    );
  }
}


/* ================================
   UI
================================ */

function playerName(){

  return (
    document
      .getElementById("name")
      .value
      .trim() ||
    "Player"
  ).substring(0,16);
}

function setConnection(text){

  document
    .getElementById("connection")
    .textContent = text;
}

function showError(text){

  document
    .getElementById("error")
    .textContent = text || "";
}

function updateLobby(players){

  const box =
    document.getElementById("players");

  box.innerHTML = "";

  for(const p of players){

    const row =
      document.createElement("div");

    row.className = "playerRow";

    row.style.color =
      p.color || "#fff";

    row.textContent =
      (p.host ? "👑 " : "🐍 ") +
      (p.name || "Player");

    box.appendChild(row);
  }

  if(players.length){

    document
      .getElementById("startBtn")
      .style.display = "block";
  }
}


/* ================================
   MULTIPLAYER UI
================================ */

document
  .getElementById("multiBtn")
  .onclick = () => {

    document
      .getElementById("mainMenuButtons")
      .style.display = "none";

    document
      .getElementById("roomScreen")
      .style.display = "block";
  };

document
  .getElementById("backBtn")
  .onclick = () => {

    document
      .getElementById("roomScreen")
      .style.display = "none";

    document
      .getElementById("mainMenuButtons")
      .style.display = "grid";
  };

document
  .getElementById("createBtn")
  .onclick = () => {

    showError("");

    if(!connected){

      showError(
        "Serveriga pole ühendust."
      );

      return;
    }

    send({

      type:"createRoom",

      name:playerName(),

      color:me.color,

      skin:me.skin
    });
  };

document
  .getElementById("joinBtn")
  .onclick = () => {

    showError("");

    const code =
      document
        .getElementById("roomInput")
        .value
        .trim()
        .toUpperCase();

    if(code.length !== 6){

      showError(
        "Room code peab olema 6 märki."
      );

      return;
    }

    send({

      type:"joinRoom",

      code,

      name:playerName(),

      color:me.color,

      skin:me.skin
    });
  };

document
  .getElementById("startBtn")
  .onclick = () => {

    send({
      type:"startGame"
    });
  };


/* ================================
   START GAME
================================ */

document
  .getElementById("singleBtn")
  .onclick = () => {

    startGame(true);
  };

function startGame(isSingle){

  singleplayer = isSingle;

  running = true;
  dead = false;

  score = 0;
  kills = 0;

  document
    .getElementById("menu")
    .style.display = "none";

  document
    .getElementById("hud")
    .style.display = "flex";

  document
    .getElementById("leaderboard")
    .style.display = "block";

  document
    .getElementById("minimap")

  me.name = playerName();

  me.x =
    3000 +
    Math.random()*14000;

  me.y =
    3000 +
    Math.random()*14000;

  me.angle =
    Math.random()*Math.PI*2;

  me.targetAngle =
    me.angle;

  me.length = 25;

  body = [];

  for(
    let i=0;
    i<Math.floor(me.length);
    i++
  ){

    body.push({

      x:
        me.x -
        Math.cos(me.angle)*i*8,

      y:

        Math.sin(me.angle)*i*8
    });

  others = {};

  if(singleplayer){

  }

/* ================================
   BOTS
================================ */

const bots = [];

function createBots(){

  bots.length = 0;

  const names = [
    "Raptor",
    "SnakeKing",
    "Speedy",
    "Shadow",
    "Fire",
    "Ghost",
    "Cobra",
    "Ninja",
    "Tiger",
    "Dragon",
    "Pixel",
    "Hunter"
  ];

  const skinKeys =
    Object.keys(skinData);

  for(let i=0;i<12;i++){

    const a =
      Math.random()*Math.PI*2;

    const bot = {

      id:"bot"+i,

      name:
        names[i % names.length],

      x:
        1000+
        Math.random()*18000,

      y:
        1000+
        Math.random()*18000,

      angle:a,

      targetAngle:a,

      length:
        20+
        Math.random()*80,

      score:0,

      kills:0,

      color:
        skinData[
          skinKeys[
            i % skinKeys.length
          ]
        ].color,

      skin:
        skinKeys[
          i % skinKeys.length
        ],

      body:[],

      think:0
    };

    for(
      let j=0;
      j<bot.length;
      j++
    ){

      bot.body.push({

        x:
          bot.x -
          Math.cos(a)*j*8,

        y:
          bot.y -
          Math.sin(a)*j*8
      });
    }

    bots.push(bot);
  }
}

function updateBots(){

  for(const bot of bots){

    bot.think--;

    if(bot.think <= 0){

      bot.think =
        30 +
        Math.random()*80;

      const target =
        foods[
          Math.floor(
            Math.random()*foods.length
          )
        ];

      if(target){

        bot.targetAngle =
          Math.atan2(
            target.y-bot.y,
            target.x-bot.x
          );
      }

      if(
        Math.random()<.12
      ){

        bot.targetAngle +=
          (Math.random()-.5)*2;
      }
    }

    let d =
      bot.targetAngle -
      bot.angle;

    while(d > Math.PI) d -= Math.PI*2;
    while(d < -Math.PI) d += Math.PI*2;

    bot.angle += d*.08;

    const speed =
      3.2 +
      Math.min(
        2,
        bot.length/100
      );

    bot.x +=
      Math.cos(bot.angle)*speed;

    bot.y +=
      Math.sin(bot.angle)*speed;

    if(bot.x < 50){
      bot.x = 50;
      bot.angle = 0;
    }

    if(bot.y < 50){
      bot.y = 50;
      bot.angle = Math.PI/2;
    }

    if(bot.x > WORLD-50){
      bot.x = WORLD-50;
      bot.angle = Math.PI;
    }

    if(bot.y > WORLD-50){
      bot.y = WORLD-50;
      bot.angle = -Math.PI/2;
    }

    bot.body.unshift({
      x:bot.x,
      y:bot.y
    });

    while(
      bot.body.length >
      Math.floor(bot.length)
    ){
      bot.body.pop();
    }

    eatBotFood(bot);

    /*
      Bot pea sinu keha vastu.
    */

    if(
      body.length &&
      distance2(
        bot,
        body[0]
      ) < 18
    ){

      /*
       ainult siis kui bot pea
       ei sõida otse sinu pea sisse
       kontrollime sinu keha.
      */
    }

    for(
      let i=8;
      i<bot.body.length;
      i++
    ){

      if(
        body.length &&
        Math.hypot(
          bot.body[0].x-body[i].x,
          bot.body[0].y-body[i].y
        ) < 17
      ){

        killBot(bot);

        break;
      }
    }
  }

  /*
    Kontrollime kas sinu pea
    sõidab roboti kehasse.
  */

  for(const bot of bots){

    if(!bot.body.length) continue;

    for(
      let i=8;
      i<bot.body.length;
      i++
    ){

      if(
        Math.hypot(
          me.x-bot.body[i].x,
          me.y-bot.body[i].y
        ) < 19
      ){

        killBot(bot);

        break;
      }
    }
  }
}

function distance2(a,b){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );
}

function killBot(bot){

  if(!bot.length) return;

  const index =
    bots.indexOf(bot);

  if(index === -1) return;

  kills++;

  score += 100;

  coins += 10;

  saveCoins();

  showKill();

  for(const p of bot.body){

    if(Math.random()<.35){

      foods.push({

        x:p.x,
        y:p.y,

        radius:5,

        color:"#ffd84d",

        value:4
      });
    }
  }

  bot.x =
    1000+
    Math.random()*18000;

  bot.y =
    1000+
    Math.random()*18000;

  bot.length =
    20+
    Math.random()*50;

  bot.angle =
    Math.random()*Math.PI*2;

  bot.body=[];

  for(
    let i=0;
    i<bot.length;
    i++
  ){

    bot.body.push({

      x:
        bot.x-
        Math.cos(bot.angle)*i*8,

      y:
        bot.y-
        Math.sin(bot.angle)*i*8
    });
  }
}

function eatBotFood(bot){

  for(
    let i=foods.length-1;
    i>=0;
    i--
  ){

    const f = foods[i];

    if(
      Math.hypot(
        bot.x-f.x,
        bot.y-f.y
      ) < 20
    ){

      bot.length +=
        f.value*.4;

      bot.score +=
        f.value;

      foods[i] =
        makeFood();
    }
  }
}

function keyboardDirection(){

  let dx=0;
  let dy=0;

  if(keys.w || keys.arrowup){
    dy--;
  }

  if(keys.s || keys.arrowdown){
    dy++;
  }

  if(keys.a || keys.arrowleft){
    dx--;
  }

  if(keys.d || keys.arrowright){
    dx++;
  }

  if(dx || dy){

    me.targetAngle =
      Math.atan2(dy,dx);
  }
}

/* ================================
   JOYSTICK
================================ */

const joystick =
  document.getElementById("joystick");

const stick =
  document.getElementById("stick");

let joyId = null;

function moveJoystick(x,y){

  const r =
    joystick.getBoundingClientRect();

  const cx =
    r.left+r.width/2;

  const cy =
    r.top+r.height/2;

  let dx=x-cx;
  let dy=y-cy;

  const max=55;

  const dist =
    Math.hypot(dx,dy);

  if(dist>max){

    dx =
      dx/dist*max;

    dy =
      dy/dist*max;
  }

  stick.style.left =
    `calc(50% + ${dx}px)`;

  stick.style.top =
    `calc(50% + ${dy}px)`;

  if(dist>7){

    me.targetAngle =
      Math.atan2(dy,dx);
  }
}

function resetJoystick(){

  joyId=null;

  stick.style.left="50%";
  stick.style.top="50%";
}

joystick.addEventListener(
  "pointerdown",
  e => {

    joyId=e.pointerId;

    joystick.setPointerCapture(
      e.pointerId
    );

    moveJoystick(
      e.clientX,
      e.clientY
    );
  }
);

joystick.addEventListener(
  "pointermove",
  e => {

    if(e.pointerId !== joyId){
      return;
    }

    moveJoystick(
      e.clientX,
      e.clientY
    );
  }
);

joystick.addEventListener(
  "pointerup",
  resetJoystick
);

joystick.addEventListener(
  "pointercancel",
  resetJoystick
);

/* ================================
   UPDATE
================================ */

let lastSend=0;

function update(){

  if(!running || dead){
    return;
  }

  keyboardDirection();

  let diff =
    me.targetAngle -
    me.angle;

  while(diff > Math.PI){
    diff -= Math.PI*2;
  }

  while(diff < -Math.PI){
    diff += Math.PI*2;
  }

  me.angle += diff*.13;

  let speed =
    boosting
    ? 8.2
    : 5.1;

  if(boosting && me.length > 20){

    me.length -= .045;

    if(Math.random()<.20){

      dropBoostFood();
    }
  }

  me.x +=
    Math.cos(me.angle)*speed;

  me.y +=
    Math.sin(me.angle)*speed;

  if(me.x < 25){
    me.x=25;
  }

  if(me.y < 25){
    me.y=25;
  }

  if(me.x > WORLD-25){
    me.x=WORLD-25;
  }

  if(me.y > WORLD-25){
    me.y=WORLD-25;
  }

  body.unshift({
    x:me.x,
    y:me.y
  });

  while(
    body.length >
    Math.floor(me.length)
  ){

    body.pop();
  }

  eatFood();

  if(singleplayer){
    updateBots();
  }

  if(
    !singleplayer &&
    performance.now()-lastSend>50
  ){

    lastSend =
      performance.now();

    send({

      type:"state",

      x:me.x,
      y:me.y,
      angle:me.angle,

      length:me.length,

      score,
      kills,

      color:me.color,
      skin:me.skin,
      name:me.name,

      /*
        PÄRIS KEHA.
        See parandab "pulgad" probleemi.
      */

      body:body.slice(0,800)
    });
  }

  document
    .getElementById("score")
    .textContent =
      Math.floor(score);

  document
    .getElementById("kills")
    .textContent =
      kills;

  document
    .getElementById("length")
    .textContent =
      Math.floor(me.length);

  updateLeaderboard();
}


/* ================================
   FOOD
================================ */

function eatFood(){

  for(
    let i=foods.length-1;
    i>=0;
    i--
  ){

    const f=foods[i];

    if(
      Math.hypot(
        f.x-me.x,
        f.y-me.y
      ) <
      22+f.radius
    ){

      score += f.value;

      me.length +=
        f.value*.45;

      foods[i] =
        makeFood();
    }
  }
}


/* ================================
   LEADERBOARD
================================ */

function updateLeaderboard(){

  const list = [];

  list.push({

    name:me.name,
    score,
    kills,
    me:true
  });

  if(singleplayer){

    for(const bot of bots){

      list.push({

        name:bot.name,
        score:bot.score,
        kills:bot.kills
      });
    }

  }else{

    for(const id in others){

      if(id===me.id) continue;

      const p=others[id];

      list.push({

        name:p.name || "Player",
        score:p.score || 0,
        kills:p.kills || 0
      });
    }
  }

  list.sort(
    (a,b)=>b.score-a.score
  );

  const top =
    list.slice(0,3);

  const box =
    document.getElementById("lbRows");

  box.innerHTML="";

  top.forEach(
    (p,i)=>{

      const row =
        document.createElement("div");

      row.className="lb";

      row.innerHTML =
        `
        <span>
          ${i+1}. ${escapeHtml(p.name)}
        </span>

        <span>
          ${Math.floor(p.score)}
        </span>
        `;

      if(p.me){
        row.style.color="#63ff78";
      }

      box.appendChild(row);
    }
  );
}

function escapeHtml(s){

  return String(s)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

  cameraY +=

/* ================================
   DRAW
================================ */

function draw(){

  ctx.fillStyle="#071008";

  ctx.fillRect(
    0,
    0,
    W,
    H
  );

  if(!running){
    return;
  }

  updateCamera();

  ctx.save();

  ctx.translate(
    W/2-cameraX,
    H/2-cameraY
  );

  drawGrid();

  drawBorder();

  drawFood();

  if(singleplayer){

    drawBots();

  }else{

    drawOthers();
  }

  drawSnake(
    body,
    me
  );

  ctx.restore();

  drawMinimap();
}


/* ================================
   GRID
================================ */

function drawGrid(){

  const grid=250;

  const left =
    cameraX-W/2-500;

  const right =
    cameraX+W/2+500;

  const top =
    cameraY-H/2-500;

  const bottom =
    cameraY+H/2+500;

  ctx.strokeStyle =
    "rgba(99,255,120,.045)";

  ctx.lineWidth=1;

  for(
    let x=
      Math.floor(left/grid)*grid;
    x<right;
    x+=grid
  ){

    ctx.beginPath();

    ctx.moveTo(x,top);
    ctx.lineTo(x,bottom);

    ctx.stroke();
  }

  for(
    let y=
      Math.floor(top/grid)*grid;
    y<bottom;
    y+=grid
  ){

    ctx.beginPath();

    ctx.moveTo(left,y);
    ctx.lineTo(right,y);

    ctx.stroke();
  }
}


/* ================================
   BORDER
================================ */

function drawBorder(){

  ctx.strokeStyle="#63ff78";

  ctx.lineWidth=18;

  ctx.shadowColor="#63ff78";

  ctx.shadowBlur=20;

  ctx.strokeRect(
    0,
    0,
    WORLD,
    WORLD
  );

  ctx.shadowBlur=0;
}


/* ================================
   FOOD DRAW
================================ */

function drawFood(){

  for(const f of foods){

    if(
      Math.abs(f.x-cameraX)>W ||
      Math.abs(f.y-cameraY)>H
    ){
      continue;
    }

    ctx.fillStyle=f.color;

    ctx.shadowColor=f.color;

    ctx.shadowBlur=8;

    ctx.beginPath();

    ctx.arc(
      f.x,
      f.y,
      f.radius,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.shadowBlur=0;
}


/* ================================
   SNAKE DRAW
================================ */

function drawSnake(points,p){

  if(!points || !points.length){
    return;
  }

  const length =
    points.length;

  /*
    Kõigepealt keha.
    Iga segment on ring,
    mitte üks pikk pulk.
  */

  for(
    let i=length-1;
    i>=0;
    i--
  ){

    const point =
      points[i];

    const progress =
      i/length;

    const radius =
      8 +
      (1-progress)*9;

    ctx.globalAlpha =
      1-progress*.25;

    let color =
      p.color || "#63ff78";

    if(p.skin === "rainbow"){

      const hue =
        (i*8+
        performance.now()/15)%360;

      color =
        `hsl(${hue},90%,60%)`;
    }

    ctx.fillStyle=color;

    ctx.shadowColor=color;

    ctx.shadowBlur =
      i<8 ? 13 : 3;

    ctx.beginPath();

    ctx.arc(
      point.x,
      point.y,
      radius,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  ctx.globalAlpha=1;
  ctx.shadowBlur=0;

  const head =
    points[0];

  drawHead(
    head.x,
    head.y,
    22,
    p
  );

  drawFace(
    head.x,
    head.y,
    p.angle || 0
  );

  drawName(
    p.name || "Player",
    head.x,
    head.y-31
  );
}


/* ================================
   HEAD
================================ */

function drawHead(
  x,
  y,
  radius,
  p
){

  const skin =
    p.skin || "green";

  let color =
    p.color || "#63ff78";

  if(skin === "rainbow"){

    color =
      `hsl(${(performance.now()/8)%360},90%,60%)`;
  }

  ctx.save();

  ctx.translate(x,y);

  ctx.fillStyle=color;

  ctx.shadowColor=color;

  ctx.shadowBlur=18;

  ctx.beginPath();

  ctx.arc(
    0,
    0,
    radius,
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.shadowBlur=0;

  /*
    KÕIK SKINID ON KOGU PEAS.
  */

  if(skin==="blue"){

    ctx.strokeStyle="#d8f5ff";
    ctx.lineWidth=4;

    ctx.stroke();
  }

  if(skin==="red"){

    ctx.strokeStyle="#ffb8c4";
    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.moveTo(-13,-13);
    ctx.lineTo(13,13);

    ctx.moveTo(13,-13);
    ctx.lineTo(-13,13);

    ctx.stroke();
  }

  if(skin==="yellow"){

    ctx.fillStyle="#fff3a0";

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      8,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  if(skin==="purple"){

    ctx.fillStyle="#f2d0ff";

    for(let i=0;i<6;i++){

      const a =
        i*Math.PI/3;

      ctx.beginPath();

      ctx.arc(
        Math.cos(a)*13,
        Math.sin(a)*13,
        4,
        0,
        Math.PI*2
      );

      ctx.fill();
    }
  }

  if(skin==="orange"){

    ctx.strokeStyle="#ffe0c0";

    ctx.lineWidth=3;

    for(let i=-1;i<=1;i++){

      ctx.beginPath();

      ctx.moveTo(-15,i*7);
      ctx.lineTo(15,i*7);

      ctx.stroke();
    }
  }

  if(skin==="cyan"){

    ctx.strokeStyle="#d2fffa";
    ctx.lineWidth=4;

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      13,
      0,
      Math.PI*2
    );

    ctx.stroke();
  }

  if(skin==="pink"){

    ctx.fillStyle="#ffc1eb";

    ctx.beginPath();

    ctx.arc(
      -8,
      -10,
      7,
      0,
      Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
      8,
      -10,
      7,
      0,
      Math.PI*2
    );

    ctx.fill();
  }

  if(skin==="gold"){

    ctx.strokeStyle="#fff1a0";
    ctx.lineWidth=5;

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      16,
      0,
      Math.PI*2
    );

    ctx.stroke();
  }

  if(skin==="dark"){

    ctx.strokeStyle="#aaaaaf";
    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      15,
      0,
      Math.PI*2
    );

    ctx.stroke();
  }

  ctx.restore();
}

  );

   OTHER PLAYERS

  ){

/* ================================
   BOTS
================================ */

function drawBots(){

  for(const bot of bots){

    drawSnake(
      bot.body,
      bot
    );
  }
}


/* ================================
   MINIMAP
================================ */

function drawMinimap(){

  const size =
    minimap.width;

  mapCtx.clearRect(
    0,
    0,
    size,
    size
  );

  mapCtx.fillStyle="#061007";

  mapCtx.fillRect(
    0,
    0,
    size,
    size
  );

  /*
    FOOD
  */

  for(const f of foods){

    const x =
      f.x/WORLD*size;

    const y =
      f.y/WORLD*size;

    mapCtx.fillStyle=f.color;

    mapCtx.globalAlpha=.45;

    mapCtx.fillRect(
      x,
      y,
      2,
      2
    );
  }

  mapCtx.globalAlpha=1;

  /*
    OTHER
  */

  if(singleplayer){

    for(const b of bots){

      const x =
        b.x/WORLD*size;

      const y =
        b.y/WORLD*size;

      mapCtx.fillStyle=b.color;

      mapCtx.beginPath();

      mapCtx.arc(
        x,
        y,
        3,
        0,
        Math.PI*2
      );

      mapCtx.fill();
    }

  }else{

    for(
      const id in others
    ){

      const p=others[id];

      const x =
        p.x/WORLD*size;

      const y =
        p.y/WORLD*size;

      mapCtx.fillStyle =
        p.color || "#ff5570";

      mapCtx.beginPath();

      mapCtx.arc(
        x,
        y,
        3,
        0,
        Math.PI*2
      );

      mapCtx.fill();
    }
  }

  /*
    ME
  */

  const mx =
    me.x/WORLD*size;

  const my =
    me.y/WORLD*size;

  mapCtx.fillStyle =
    me.color;

  mapCtx.shadowColor =
    me.color;

  mapCtx.shadowBlur=8;

  mapCtx.beginPath();

  mapCtx.arc(
    mx,
    my,
    5,
    0,
    Math.PI*2
  );

  mapCtx.fill();

  mapCtx.shadowBlur=0;

  mapCtx.strokeStyle="#63ff78";

  mapCtx.lineWidth=2;

  mapCtx.strokeRect(
    1,
    1,
    size-2,
    size-2
  );
}


/* ================================
   KILL MESSAGE
================================ */

let killTimer=null;

function showKill(){

  const el =
    document.getElementById(
      "killText"
    );

  el.classList.add("show");

  clearTimeout(killTimer);

  killTimer =
    setTimeout(
      () => {
        el.classList.remove("show");
      },
      900
    );
}


/* ================================
   DEATH
================================ */

function die(reason){

  if(dead){
    return;
  }

  dead=true;
  running=false;

  boosting=false;

  document
    .getElementById("deathReason")
    .textContent = reason;

  document
    .getElementById("finalScore")
    .textContent =
      Math.floor(score);

  document
    .getElementById("finalKills")
    .textContent =
      kills;

  document
    .getElementById("gameOver")
    .style.display="flex";
}

document
  .getElementById("again")
  .onclick = () => {

    document
      .getElementById("gameOver")
      .style.display="none";

    startGame(
      singleplayer
    );
  };

document
  .getElementById("menuAgain")
  .onclick = () => {

    location.reload();
  };


/* ================================
   LOOP
================================ */

function loop(){

  update();

  draw();

  requestAnimationFrame(loop);
}

connect();

loop();

</script>
