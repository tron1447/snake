<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Snake Arena</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020604;
    font-family:Arial,sans-serif;
    touch-action:none;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

/* ================= MENU ================= */

#menu{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:auto;

    background:
        radial-gradient(
            circle at 50% 30%,
            rgba(67,255,105,.18),
            transparent 30%
        ),
        radial-gradient(
            circle at 20% 80%,
            rgba(20,120,255,.12),
            transparent 25%
        ),
        #020604;
}

.menuGlow{
    position:absolute;
    width:500px;
    height:500px;
    border-radius:50%;
    background:rgba(60,255,100,.07);
    filter:blur(80px);
    animation:glow 4s infinite alternate;
}

@keyframes glow{
    from{transform:scale(.8)}
    to{transform:scale(1.2)}
}

.card{
    position:relative;
    z-index:2;
    width:min(94vw,470px);
    padding:30px;
    border-radius:30px;

    background:
        linear-gradient(
            145deg,
            rgba(13,31,17,.97),
            rgba(2,8,4,.98)
        );

    border:1px solid rgba(105,255,130,.35);

    box-shadow:
        0 0 100px rgba(50,255,90,.12),
        inset 0 0 50px rgba(80,255,100,.025);

    text-align:center;
    color:white;
}

.logo{
    font-size:75px;
    filter:drop-shadow(0 0 18px rgba(80,255,100,.5));
    animation:snakeFloat 2s ease-in-out infinite;
}

@keyframes snakeFloat{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-8px)}
}

h1{
    margin-top:5px;
    font-size:42px;
    font-weight:900;
    letter-spacing:2px;
    color:#63ff7e;
    text-shadow:0 0 25px rgba(70,255,100,.45);
}

.subtitle{
    color:#829987;
    margin:5px 0 22px;
}

.nameInput{
    width:100%;
    padding:15px;
    border-radius:13px;
    border:1px solid #315238;
    background:#071009;
    color:white;
    outline:none;
    font-size:16px;
    text-align:center;
}

.nameInput:focus{
    border-color:#63ff7e;
    box-shadow:0 0 15px rgba(70,255,100,.15);
}

.sectionTitle{
    color:#6f8373;
    font-size:10px;
    letter-spacing:2px;
    margin:18px 0 9px;
}

.skins{
    display:flex;
    justify-content:center;
    gap:9px;
    flex-wrap:wrap;
}

.skin{
    width:36px;
    height:36px;
    border-radius:50%;
    border:3px solid transparent;
    cursor:pointer;
    transition:.15s;
}

.skin:hover{
    transform:scale(1.12);
}

.skin.active{
    border-color:white;
    transform:scale(1.15);
    box-shadow:0 0 14px rgba(255,255,255,.3);
}

.playButton{
    width:100%;
    padding:16px;
    margin-top:20px;
    border:0;
    border-radius:14px;
    background:linear-gradient(135deg,#71ff8c,#38d65c);
    color:#031006;
    font-size:18px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 8px 25px rgba(60,255,90,.2);
}

.playButton:hover{
    filter:brightness(1.08);
}

.playButton:active{
    transform:scale(.98);
}

.infoRow{
    display:flex;
    justify-content:space-between;
    margin-top:17px;
    color:#617364;
    font-size:11px;
}

.tip{
    margin-top:16px;
    padding:10px;
    border-radius:10px;
    background:rgba(80,255,100,.04);
    color:#657967;
    font-size:11px;
}

/* ================= HUD ================= */

#hud{
    position:fixed;
    z-index:20;
    top:12px;
    left:12px;
    display:none;
    gap:6px;
}

.stat{
    min-width:75px;
    padding:7px 10px;
    border-radius:11px;
    background:rgba(2,9,4,.86);
    border:1px solid rgba(100,255,130,.25);
    color:white;
    text-align:center;
    backdrop-filter:blur(5px);
}

.stat small{
    display:block;
    color:#718574;
    font-size:9px;
}

.stat b{
    font-size:16px;
}

/* ================= MINIMAP ================= */

#minimap{
    position:fixed;
    z-index:20;
    top:12px;
    right:12px;
    width:180px;
    height:180px;
    display:none;
    border-radius:17px;
    overflow:hidden;
    background:#061009;
    border:2px solid rgba(105,255,130,.55);
    box-shadow:0 0 25px rgba(50,255,90,.12);
}

#map{
    width:100%;
    height:100%;
}

.mapLabel{
    position:absolute;
    top:6px;
    left:9px;
    color:#8dff9e;
    font-size:9px;
    font-weight:bold;
}

/* ================= JOYSTICK ================= */

#joystick{
    position:fixed;
    z-index:30;
    left:25px;
    bottom:25px;
    width:150px;
    height:150px;
    display:none;
    border-radius:50%;
    background:rgba(100,150,105,.18);
    border:2px solid rgba(145,255,155,.38);
    box-shadow:
        inset 0 0 30px rgba(0,0,0,.3),
        0 0 25px rgba(50,255,90,.08);
}

#stick{
    position:absolute;
    left:50%;
    top:50%;
    width:64px;
    height:64px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle,#82ff9a,#1ab13d);
    border:3px solid rgba(255,255,255,.8);
    box-shadow:0 0 25px rgba(80,255,100,.4);
}

/* ================= BOOST ================= */

#boost{
    position:fixed;
    z-index:30;
    right:30px;
    bottom:30px;
    width:105px;
    height:105px;
    display:none;
    border-radius:50%;
    border:3px solid #a9e5ff;
    background:radial-gradient(circle,#51bdff,#07548e);
    color:white;
    font-size:30px;
    box-shadow:0 0 30px rgba(50,170,255,.35);
}

#boost small{
    display:block;
    font-size:10px;
    margin-top:3px;
}

/* ================= ROTATE ================= */

#rotate{
    position:fixed;
    inset:0;
    z-index:1000;
    display:none;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:#020604;
    color:white;
}

.rotateBox{
    padding:30px;
}

.phone{
    font-size:75px;
    animation:phone 1.5s infinite;
}

@keyframes phone{
    0%,100%{transform:rotate(0)}
    50%{transform:rotate(90deg)}
}

.rotateBox h2{
    color:#63ff7e;
    margin:15px 0;
}

/* ================= DEATH ================= */

#death{
    position:fixed;
    inset:0;
    z-index:200;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.78);
}

.deathCard{
    width:min(90%,390px);
    padding:30px;
    border-radius:25px;
    background:#071109;
    border:1px solid #63ff7e;
    color:white;
    text-align:center;
}

.deathCard h2{
    font-size:30px;
    color:#63ff7e;
}

.deathScore{
    margin:10px;
    color:#849687;
}

.deathButton{
    width:100%;
    padding:14px;
    margin-top:8px;
    border:0;
    border-radius:12px;
    background:#63ff7e;
    color:#031006;
    font-weight:bold;
}

/* ================= MOBILE ================= */

@media(max-width:800px) and (orientation:landscape){

    #joystick{
        display:block;
    }

    #boost{
        display:block;
    }

    #minimap{
        width:135px;
        height:135px;
    }

    .stat{
        min-width:65px;
    }
}

@media(max-width:800px) and (orientation:portrait){

    #rotate{
        display:flex;
    }

    #menu{
        display:none;
    }
}

</style>
</head>

<body>

<canvas id="game"></canvas>

<!-- ROTATE -->

<div id="rotate">

    <div class="rotateBox">

        <div class="phone">📱</div>

        <h2>
            PÖÖRA TELEFON KÜLILI
        </h2>

        <p>
            Snake Arena töötab kõige paremini
            horisontaalselt.
        </p>

    </div>

</div>

<!-- MENU -->

<div id="menu">

    <div class="menuGlow"></div>

    <div class="card">

        <div class="logo">
            🐍
        </div>

        <h1>
            SNAKE ARENA
        </h1>

        <div class="subtitle">
            Kasvata oma madu hiiglaslikuks!
        </div>

        <input
            id="name"
            class="nameInput"
            maxlength="16"
            placeholder="✏️ Sinu nimi"
        >

        <div class="sectionTitle">
            VALI OMA SKIN
        </div>

        <div
            id="skins"
            class="skins">
        </div>

        <button
            id="play"
            class="playButton">

            🚀 ALUSTA MÄNGU

        </button>

        <div class="tip">
            💻 Arvuti: WASD või hiir
            &nbsp; • &nbsp;
            📱 Telefon: joystick
        </div>

        <div class="infoRow">

            <span>
                🗺️ WORLD 20K
            </span>

            <span>
                ⚡ BOOST
            </span>

            <span>
                🏆 BEST:
                <b id="best">0</b>
            </span>

        </div>

    </div>

</div>

<!-- HUD -->

<div id="hud">

    <div class="stat">

        <small>SCORE</small>

        <b id="score">
            0
        </b>

    </div>

    <div class="stat">

        <small>LENGTH</small>

        <b id="length">
            20
        </b>

    </div>

</div>

<!-- MINIMAP -->

<div id="minimap">

    <canvas
        id="map"
        width="180"
        height="180">
    </canvas>

    <div class="mapLabel">
        🗺️ WORLD MAP
    </div>

</div>

<!-- JOYSTICK -->

<div id="joystick">

    <div id="stick"></div>

</div>

<!-- BOOST -->

<button id="boost">

    ⚡

    <small>
        BOOST
    </small>

</button>

<!-- DEATH -->

<div id="death">

    <div class="deathCard">

        <div style="font-size:60px">
            💥
        </div>

        <h2>
            GAME OVER
        </h2>

        <div
            id="deathScore"
            class="deathScore">
            Score: 0
        </div>

        <button
            id="again"
            class="deathButton">

            🔄 PROOVI UUESTI

        </button>

        <button
            id="back"
            class="deathButton"
            style="
            background:#18231a;
            color:white;">

            🏠 MENU

        </button>

    </div>

</div>

<script>

/* =====================================================
   CANVAS
===================================================== */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

const mapCanvas =
    document.getElementById("map");

const mapCtx =
    mapCanvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

function resize(){

    W = innerWidth;
    H = innerHeight;

    const dpr =
        Math.min(
            devicePixelRatio || 1,
            2
        );

    canvas.width =
        W*dpr;

    canvas.height =
        H*dpr;

    canvas.style.width =
        W+"px";

    canvas.style.height =
        H+"px";

    ctx.setTransform(
        dpr,0,0,dpr,0,0
    );

}

window.addEventListener(
    "resize",
    resize
);

resize();


/* =====================================================
   WORLD
===================================================== */

const WORLD = 20000;

let playing = false;

let score = 0;

let snakeLength = 25;

let snake = [];

let foods = [];

let decorations = [];

let particles = [];

let selectedSkin = 0;

let boosting = false;

let camera = {
    x:WORLD/2,
    y:WORLD/2
};

let player = {

    x:WORLD/2,

    y:WORLD/2,

    angle:0,

    target:0

};


/* =====================================================
   SKINS
===================================================== */

const SKINS = [

    "#63ff7e",
    "#42a5ff",
    "#ff4dd8",
    "#ffd83d",
    "#ff713d",
    "#a95cff",
    "#00eaff",
    "#ffffff",
    "#ff4268",
    "#9cff32",
    "#ff9f1c",
    "#00ffc8"

];

const skinBox =
    document.getElementById("skins");

SKINS.forEach(
    (color,i)=>{

        const el =
            document.createElement("div");

        el.className =
            "skin";

        el.style.background =
            color;

        if(i===0)
            el.classList.add("active");

        el.onclick = ()=>{

            selectedSkin = i;

            document
            .querySelectorAll(".skin")
            .forEach(
                x =>
                x.classList.remove("active")
            );

            el.classList.add("active");

        };

        skinBox.appendChild(el);

    }
);


/* =====================================================
   FOOD
===================================================== */

function createFood(){

    foods = [];

    for(
        let i=0;
        i<1800;
        i++
    ){

        foods.push({

            x:Math.random()*WORLD,

            y:Math.random()*WORLD,

            size:
                Math.random()<.07
                ? 9
                : 5,

            value:
                Math.random()<.07
                ? 10
                : 1,

            phase:
                Math.random()*20

        });

    }

}


/* =====================================================
   WORLD DECORATIONS
===================================================== */

function createDecorations(){

    decorations = [];

    for(
        let i=0;
        i<900;
        i++
    ){

        const type =
            Math.random();

        decorations.push({

            x:
                Math.random()*WORLD,

            y:
                Math.random()*WORLD,

            type:
                type<.48
                ? "tree"
                : type<.75
                ? "rock"
                : "flower",

            size:
                20+
                Math.random()*45

        });

    }

}


/* =====================================================
   START
===================================================== */

function start(){

    playing = true;

    document.getElementById(
        "menu"
    ).style.display =
        "none";

    document.getElementById(
        "death"
    ).style.display =
        "none";

    document.getElementById(
        "hud"
    ).style.display =
        "flex";

    document.getElementById(
        "minimap"
    ).style.display =
        "block";


    score = 0;

    snakeLength = 25;


    player.x =
        WORLD/2;

    player.y =
        WORLD/2;

    player.angle =
        Math.random()*
        Math.PI*2;

    player.target =
        player.angle;


    snake = [];


    for(
        let i=0;
        i<snakeLength;
        i++
    ){

        snake.push({

            x:
                player.x-
                Math.cos(player.angle)*
                i*10,

            y:
                player.y-
                Math.sin(player.angle)*
                i*10

        });

    }


    camera.x =
        player.x;

    camera.y =
        player.y;


    createFood();

    createDecorations();

}


/* =====================================================
   KEYBOARD
===================================================== */

const keys = {};

window.addEventListener(
    "keydown",
    e=>{

        keys[
            e.key.toLowerCase()
        ] = true;

        if(e.key==="Shift"){

            boosting = true;

        }

    }
);

window.addEventListener(
    "keyup",
    e=>{

        keys[
            e.key.toLowerCase()
        ] = false;

        if(e.key==="Shift"){

            boosting = false;

        }

    }
);


function keyboard(){

    let dx=0;
    let dy=0;

    if(
        keys["w"] ||
        keys["arrowup"]
    )
        dy--;

    if(
        keys["s"] ||
        keys["arrowdown"]
    )
        dy++;

    if(
        keys["a"] ||
        keys["arrowleft"]
    )
        dx--;

    if(
        keys["d"] ||
        keys["arrowright"]
    )
        dx++;

    if(dx || dy){

        player.target =
            Math.atan2(
                dy,
                dx
            );

    }

}


/* =====================================================
   MOUSE
===================================================== */

window.addEventListener(
    "mousemove",
    e=>{

        if(!playing)
            return;

        if(W<=800)
            return;

        player.target =
            Math.atan2(
                e.clientY-H/2,
                e.clientX-W/2
            );

    }
);


/* =====================================================
   TOUCH
===================================================== */

canvas.addEventListener(
    "touchmove",
    e=>{

        if(!playing)
            return;

        e.preventDefault();

        const t =
            e.touches[0];

        if(!t)
            return;

        player.target =
            Math.atan2(
                t.clientY-H/2,
                t.clientX-W/2
            );

    },
    {passive:false}
);


/* =====================================================
   JOYSTICK
===================================================== */

const joystick =
    document.getElementById(
        "joystick"
    );

const stick =
    document.getElementById(
        "stick"
    );

let joyActive = false;


function joystickMove(x,y){

    const r =
        joystick.getBoundingClientRect();

    const cx =
        r.left+r.width/2;

    const cy =
        r.top+r.height/2;

    let dx =
        x-cx;

    let dy =
        y-cy;

    const max =
        r.width/2-32;

    const distance =
        Math.hypot(dx,dy);

    if(distance>max){

        dx =
            dx/distance*max;

        dy =
            dy/distance*max;

    }


    stick.style.left =
        `calc(50% + ${dx}px)`;

    stick.style.top =
        `calc(50% + ${dy}px)`;


    if(distance>5){

        player.target =
            Math.atan2(
                dy,
                dx
            );

    }

}


function joystickReset(){

    joyActive = false;

    stick.style.left =
        "50%";

    stick.style.top =
        "50%";

}


joystick.addEventListener(
    "touchstart",
    e=>{

        e.preventDefault();

        joyActive=true;

        const t =
            e.changedTouches[0];

        joystickMove(
            t.clientX,
            t.clientY
        );

    },
    {passive:false}
);


joystick.addEventListener(
    "touchmove",
    e=>{

        e.preventDefault();

        if(!joyActive)
            return;

        const t =
            e.changedTouches[0];

        joystickMove(
            t.clientX,
            t.clientY
        );

    },
    {passive:false}
);


joystick.addEventListener(
    "touchend",
    e=>{

        e.preventDefault();

        joystickReset();

    },
    {passive:false}
);


/* =====================================================
   BOOST
===================================================== */

const boostButton =
    document.getElementById(
        "boost"
    );

boostButton.addEventListener(
    "touchstart",
    e=>{

        e.preventDefault();

        boosting=true;

    },
    {passive:false}
);

boostButton.addEventListener(
    "touchend",
    e=>{

        e.preventDefault();

        boosting=false;

    },
    {passive:false}
);


/* =====================================================
   UPDATE
===================================================== */

function update(){

    if(!playing)
        return;


    keyboard();


    let diff =
        player.target-
        player.angle;


    while(diff>Math.PI)
        diff-=Math.PI*2;

    while(diff<-Math.PI)
        diff+=Math.PI*2;


    player.angle +=
        diff*.12;


    let speed =
        boosting
        ? 9
        : 5.5;


    if(boosting){

        snakeLength -= .025;

        if(snakeLength<18)
            snakeLength=18;

    }


    player.x +=
        Math.cos(player.angle)*
        speed;

    player.y +=
        Math.sin(player.angle)*
        speed;


    /* WORLD BORDER */

    if(player.x<40)
        player.x=40;

    if(player.x>WORLD-40)
        player.x=WORLD-40;

    if(player.y<40)
        player.y=40;

    if(player.y>WORLD-40)
        player.y=WORLD-40;


    snake.unshift({

        x:player.x,

        y:player.y

    });


    while(
        snake.length>
        Math.floor(snakeLength)
    ){

        snake.pop();

    }


    /* FOOD */

    for(
        let i=foods.length-1;
        i>=0;
        i--
    ){

        const f =
            foods[i];

        const d =
            Math.hypot(
                player.x-f.x,
                player.y-f.y
            );


        if(d<32){

            score +=
                f.value;

            snakeLength +=
                f.value*1.7;


            createParticles(
                f.x,
                f.y,
                7
            );


            foods.splice(i,1);


            foods.push({

                x:
                    Math.random()*WORLD,

                y:
                    Math.random()*WORLD,

                size:
                    Math.random()<.07
                    ? 9
                    : 5,

                value:
                    Math.random()<.07
                    ? 10
                    : 1,

                phase:
                    Math.random()*20

            });

        }

    }


    /* CAMERA */

    camera.x +=
        (player.x-camera.x)*
        .10;

    camera.y +=
        (player.y-camera.y)*
        .10;


    /* PARTICLES */

    for(
        const p of particles
    ){

        p.x += p.vx;
        p.y += p.vy;

        p.life--;

    }


    particles =
        particles.filter(
            p=>p.life>0
        );


    document.getElementById(
        "score"
    ).textContent =
        Math.floor(score);


    document.getElementById(
        "length"
    ).textContent =
        Math.floor(snakeLength);

}


/* =====================================================
   PARTICLES
===================================================== */

function createParticles(x,y,n){

    for(
        let i=0;
        i<n;
        i++
    ){

        particles.push({

            x:x,

            y:y,

            vx:
                (Math.random()-.5)*5,

            vy:
                (Math.random()-.5)*5,

            life:30

        });

    }

}


/* =====================================================
   DRAW WORLD
===================================================== */

function draw(){

    requestAnimationFrame(draw);


    ctx.clearRect(
        0,
        0,
        W,
        H
    );


    if(!playing){

        ctx.fillStyle =
            "#020604";

        ctx.fillRect(
            0,
            0,
            W,
            H
        );

        return;

    }


    /*
       Smaller number =
       more zoomed out.
    */

    const zoom =
        W<900
        ? 1.05
        : 1.25;


    ctx.save();


    ctx.translate(
        W/2,
        H/2
    );

    ctx.scale(
        zoom,
        zoom
    );

    ctx.translate(
        -camera.x,
        -camera.y
    );


    /* =================
       GRASS
    ================= */

    ctx.fillStyle =
        "#07150a";

    ctx.fillRect(
        0,
        0,
        WORLD,
        WORLD
    );


    /* =================
       LARGE REGIONS
    ================= */

    drawRegions();


    /* =================
       GRID
    ================= */

    const grid=200;

    const left =
        camera.x-W/zoom/2-700;

    const right =
        camera.x+W/zoom/2+700;

    const top =
        camera.y-H/zoom/2-700;

    const bottom =
        camera.y+H/zoom/2+700;


    ctx.strokeStyle =
        "rgba(120,255,140,.035)";

    ctx.lineWidth=1;


    for(
        let x=
        Math.floor(left/grid)*grid;

        x<right;

        x+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(x,top);

        ctx.lineTo(x,bottom);

        ctx.stroke();

    }


    for(
        let y=
        Math.floor(top/grid)*grid;

        y<bottom;

        y+=grid
    ){

        ctx.beginPath();

        ctx.moveTo(left,y);

        ctx.lineTo(right,y);

        ctx.stroke();

    }


    /* =================
       DECORATIONS
    ================= */

    for(
        const d of decorations
    ){

        if(
            d.x<left-100 ||
            d.x>right+100 ||
            d.y<top-100 ||
            d.y>bottom+100
        )
            continue;


        if(d.type==="tree")
            drawTree(d);

        else if(d.type==="rock")
            drawRock(d);

        else
            drawFlower(d);

    }


    /* =================
       FOOD
    ================= */

    for(
        const f of foods
    ){

        if(
            f.x<left-50 ||
            f.x>right+50 ||
            f.y<top-50 ||
            f.y>bottom+50
        )
            continue;


        const pulse =
            Math.sin(
                performance.now()/180+
                f.phase
            )*1.5;


        const color =
            f.value>=10
            ? "#ffd83d"
            : "#ff5274";


        ctx.fillStyle=color;

        ctx.shadowColor=color;

        ctx.shadowBlur=12;


        ctx.beginPath();

        ctx.arc(
            f.x,
            f.y,
            f.size+pulse,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.shadowBlur=0;


    /* =================
       SNAKE
    ================= */

    drawSnake();


    /* =================
       PARTICLES
    ================= */

    for(
        const p of particles
    ){

        ctx.globalAlpha =
            p.life/30;

        ctx.fillStyle =
            SKINS[selectedSkin];

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            3,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.globalAlpha=1;


    /* =================
       WORLD BORDER
    ================= */

    ctx.strokeStyle =
        "#45ff69";

    ctx.lineWidth=35;

    ctx.shadowColor =
        "#45ff69";

    ctx.shadowBlur=20;

    ctx.strokeRect(
        0,
        0,
        WORLD,
        WORLD
    );

    ctx.shadowBlur=0;


    ctx.restore();


    drawMinimap();

}


/* =====================================================
   REGIONS
===================================================== */

function drawRegions(){

    /*
       Four huge zones.
    */

    ctx.fillStyle =
        "rgba(20,80,30,.18)";

    ctx.fillRect(
        0,
        0,
        WORLD/2,
        WORLD/2
    );


    ctx.fillStyle =
        "rgba(20,50,100,.16)";

    ctx.fillRect(
        WORLD/2,
        0,
        WORLD/2,
        WORLD/2
    );


    ctx.fillStyle =
        "rgba(100,70,20,.12)";

    ctx.fillRect(
        0,
        WORLD/2,
        WORLD/2,
        WORLD/2
    );


    ctx.fillStyle =
        "rgba(80,20,80,.12)";

    ctx.fillRect(
        WORLD/2,
        WORLD/2,
        WORLD/2,
        WORLD/2
    );


    /* center */

    ctx.fillStyle =
        "rgba(100,255,120,.06)";

    ctx.beginPath();

    ctx.arc(
        WORLD/2,
        WORLD/2,
        1600,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* =====================================================
   TREE
===================================================== */

function drawTree(d){

    const s=d.size;


    /* shadow */

    ctx.fillStyle =
        "rgba(0,0,0,.2)";

    ctx.beginPath();

    ctx.ellipse(
        d.x,
        d.y+s*.35,
        s*.65,
        s*.25,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* trunk */

    ctx.fillStyle =
        "#70482c";

    ctx.fillRect(
        d.x-s*.12,
        d.y,
        s*.24,
        s*.6
    );


    /* leaves */

    ctx.fillStyle =
        "#176b2d";

    ctx.beginPath();

    ctx.arc(
        d.x,
        d.y,
        s*.5,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle =
        "#238b3c";

    ctx.beginPath();

    ctx.arc(
        d.x-s*.25,
        d.y+s*.05,
        s*.3,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* =====================================================
   ROCK
===================================================== */

function drawRock(d){

    const s=d.size*.55;


    ctx.fillStyle =
        "#47504a";

    ctx.beginPath();

    ctx.moveTo(
        d.x-s,
        d.y+s*.3
    );

    ctx.lineTo(
        d.x-s*.5,
        d.y-s*.6
    );

    ctx.lineTo(
        d.x+s*.35,
        d.y-s*.7
    );

    ctx.lineTo(
        d.x+s,
        d.y+s*.25
    );

    ctx.lineTo(
        d.x+s*.3,
        d.y+s*.7
    );

    ctx.lineTo(
        d.x-s*.5,
        d.y+s*.65
    );

    ctx.closePath();

    ctx.fill();

}


/* =====================================================
   FLOWER
===================================================== */

function drawFlower(d){

    const s =
        Math.min(
            d.size*.18,
            10
        );


    ctx.strokeStyle =
        "#318c43";

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(
        d.x,
        d.y
    );

    ctx.lineTo(
        d.x,
        d.y+s*3
    );

    ctx.stroke();


    ctx.fillStyle =
        "#ff72a5";

    for(
        let i=0;
        i<5;
        i++
    ){

        const a =
            i*Math.PI*2/5;

        ctx.beginPath();

        ctx.arc(
            d.x+
            Math.cos(a)*s,

            d.y+
            Math.sin(a)*s,

            s*.65,

            0,
            Math.PI*2
        );

        ctx.fill();

    }


    ctx.fillStyle =
        "#ffd83d";

    ctx.beginPath();

    ctx.arc(
        d.x,
        d.y,
        s*.45,
        0,
        Math.PI*2
    );

    ctx.fill();

}


/* =====================================================
   SNAKE
===================================================== */

function drawSnake(){

    const color =
        SKINS[selectedSkin];


    for(
        let i=snake.length-1;
        i>=0;
        i--
    ){

        const p =
            snake[i];

        const ratio =
            i/snake.length;

        const size =
            Math.max(
                7,
                16-ratio*8
            );


        ctx.fillStyle=color;

        ctx.shadowColor=color;

        ctx.shadowBlur=9;


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            size,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.shadowBlur=0;


    /* HEAD */

    ctx.fillStyle=color;

    ctx.beginPath();

    ctx.arc(
        player.x,
        player.y,
        19,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* eyes */

    const dx =
        Math.cos(player.angle);

    const dy =
        Math.sin(player.angle);

    const sx =
        -Math.sin(player.angle);

    const sy =
        Math.cos(player.angle);


    ctx.fillStyle =
        "#041007";


    ctx.beginPath();

    ctx.arc(
        player.x+
        dx*9+
        sx*5,

        player.y+
        dy*9+
        sy*5,

        4,

        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
        player.x+
        dx*9-
        sx*5,

        player.y+
        dy*9-
        sy*5,

        4,

        0,
        Math.PI*2
    );

    ctx.fill();


    /* boost */

    if(boosting){

        ctx.strokeStyle =
            "#62caff";

        ctx.lineWidth=5;

        ctx.shadowColor =
            "#62caff";

        ctx.shadowBlur=15;


        ctx.beginPath();

        ctx.moveTo(
            player.x-
            dx*10,

            player.y-
            dy*10
        );

        ctx.lineTo(
            player.x-
            dx*65,

            player.y-
            dy*65
        );

        ctx.stroke();

        ctx.shadowBlur=0;

    }

}


/* =====================================================
   MINIMAP
===================================================== */

function drawMinimap(){

    const size=180;


    mapCtx.clearRect(
        0,
        0,
        size,
        size
    );


    mapCtx.fillStyle =
        "#061008";

    mapCtx.fillRect(
        0,
        0,
        size,
        size
    );


    /* regions */

    mapCtx.fillStyle =
        "rgba(30,100,40,.18)";

    mapCtx.fillRect(
        0,
        0,
        size/2,
        size/2
    );


    mapCtx.fillStyle =
        "rgba(30,60,120,.18)";

    mapCtx.fillRect(
        size/2,
        0,
        size/2,
        size/2
    );


    mapCtx.fillStyle =
        "rgba(120,80,30,.15)";

    mapCtx.fillRect(
        0,
        size/2,
        size/2,
        size/2
    );


    mapCtx.fillStyle =
        "rgba(100,30,100,.15)";

    mapCtx.fillRect(
        size/2,
        size/2,
        size/2,
        size/2
    );


    /* grid */

    mapCtx.strokeStyle =
        "rgba(130,255,150,.1)";

    mapCtx.lineWidth=1;


    for(
        let i=0;
        i<=10;
        i++
    ){

        const p =
            i*size/10;


        mapCtx.beginPath();

        mapCtx.moveTo(p,0);

        mapCtx.lineTo(p,size);

        mapCtx.stroke();


        mapCtx.beginPath();

        mapCtx.moveTo(0,p);

        mapCtx.lineTo(size,p);

        mapCtx.stroke();

    }


    /* food dots */

    mapCtx.fillStyle =
        "rgba(255,80,110,.55)";


    for(
        let i=0;
        i<foods.length;
        i+=8
    ){

        const f=foods[i];

        mapCtx.fillRect(
            f.x/WORLD*size,
            f.y/WORLD*size,
            2,
            2
        );

    }


    /* player */

    const px =
        player.x/WORLD*size;

    const py =
        player.y/WORLD*size;


    mapCtx.fillStyle =
        SKINS[selectedSkin];

    mapCtx.shadowColor =
        SKINS[selectedSkin];

    mapCtx.shadowBlur=12;


    mapCtx.beginPath();

    mapCtx.arc(
        px,
        py,
        6,
        0,
        Math.PI*2
    );

    mapCtx.fill();


    mapCtx.shadowBlur=0;


    /* direction */

    mapCtx.strokeStyle="white";

    mapCtx.lineWidth=2;

    mapCtx.beginPath();

    mapCtx.moveTo(px,py);

    mapCtx.lineTo(
        px+
        Math.cos(player.angle)*13,

        py+
        Math.sin(player.angle)*13
    );

    mapCtx.stroke();


    /* border */

    mapCtx.strokeStyle =
        "#4eff70";

    mapCtx.strokeRect(
        1,
        1,
        size-2,
        size-2
    );

}


/* =====================================================
   BUTTONS
===================================================== */

document.getElementById(
    "play"
).onclick = ()=>{

    const name =
        document.getElementById(
            "name"
        ).value.trim();

    if(!name){

        document.getElementById(
            "name"
        ).value =
            "Player";

    }

    start();

};


document.getElementById(
    "again"
).onclick = ()=>{

    start();

};


document.getElementById(
    "back"
).onclick = ()=>{

    playing=false;

    document.getElementById(
        "death"
    ).style.display =
        "none";

    document.getElementById(
        "hud"
    ).style.display =
        "none";

    document.getElementById(
        "minimap"
    ).style.display =
        "none";

    document.getElementById(
        "menu"
    ).style.display =
        "flex";

};


/* =====================================================
   BEST SCORE
===================================================== */

let best =
    Number(
        localStorage.getItem(
            "snakeBest"
        ) || 0
    );


document.getElementById(
    "best"
).textContent =
    best;


/* =====================================================
   CHECK BEST
===================================================== */

setInterval(()=>{

    if(
        playing &&
        score>best
    ){

        best =
            Math.floor(score);

        localStorage.setItem(
            "snakeBest",
            best
        );

        document.getElementById(
            "best"
        ).textContent =
            best;

    }

},500);


/* =====================================================
   MAIN LOOP
===================================================== */

function gameLoop(){

    update();

    requestAnimationFrame(
        gameLoop
    );

}

gameLoop();

draw();

</script>
