<!DOCTYPE html>
<html lang="et">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Snake Arena</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    user-select:none;
    -webkit-user-select:none;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#050905;
    font-family:Arial,sans-serif;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

button,input{
    font-family:Arial,sans-serif;
}

#menu{
    position:fixed;
    inset:0;
    z-index:100;
    overflow:auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:15px;
    background:radial-gradient(circle at top,#204927,#030603 65%);
}

.panel{
    width:min(95vw,480px);
    max-height:95vh;
    overflow:auto;
    padding:25px;
    border-radius:25px;
    background:rgba(5,12,6,.97);
    border:1px solid #315b36;
    color:white;
    text-align:center;
}

.logo{
    font-size:60px;
}

h1{
    color:#63ff78;
    font-size:38px;
}

.subtitle{
    color:#809280;
    margin-bottom:15px;
}

input{
    width:100%;
    height:46px;
    margin:5px 0;
    border:1px solid #315b36;
    background:#081108;
    color:white;
    border-radius:10px;
    text-align:center;
    font-size:16px;
}

.mainBtn{
    width:100%;
    min-height:47px;
    margin-top:7px;
    border:0;
    border-radius:11px;
    font-weight:bold;
    cursor:pointer;
}

.green{
    background:#63ff78;
    color:#031006;
}

.dark{
    background:#102014;
    color:white;
    border:1px solid #315b36;
}

#coinMenu{
    margin:10px 0;
    padding:10px;
    border-radius:12px;
    background:#101d11;
    color:#ffd84d;
    font-size:20px;
    font-weight:bold;
}

#shop{
    display:none;
    margin-top:15px;
}

.shopGrid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
}

.shopItem{
    padding:10px;
    border-radius:13px;
    background:#0c180e;
    border:1px solid #263e29;
}

.skinPreview{
    width:50px;
    height:50px;
    margin:auto;
    border-radius:50%;
}

.shopBuy{
    width:100%;
    margin-top:7px;
    padding:8px;
    border:0;
    border-radius:8px;
    cursor:pointer;
}

.owned{
    background:#315b36;
    color:white;
}

.buy{
    background:#ffd84d;
    color:#171000;
}

#skins{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:8px;
    margin:10px;
}

.skinSelect{
    width:48px;
    height:48px;
    border-radius:50%;
    border:3px solid transparent;
    cursor:pointer;
}

.skinSelect.selected{
    border-color:white;
}

#roomBox{
    display:none;
    margin-top:15px;
}

#roomCode{
    color:#63ff78;
    font-size:30px;
    font-weight:bold;
    letter-spacing:5px;
}

#error{
    min-height:20px;
    color:#ff6070;
    margin-top:8px;
}

#connection{
    color:#718172;
    font-size:12px;
    margin-top:7px;
}

#hud{
    position:fixed;
    z-index:20;
    top:10px;
    left:10px;
    display:none;
    gap:5px;
}

.stat{
    background:rgba(0,0,0,.75);
    border:1px solid #315b36;
    border-radius:10px;
    color:white;
    padding:7px 10px;
}

.stat small{
    display:block;
    color:#718172;
    font-size:9px;
}

#leaderboard{
    position:fixed;
    z-index:20;
    top:10px;
    right:10px;
    width:180px;
    padding:10px;
    border-radius:14px;
    background:rgba(0,0,0,.78);
    border:1px solid #315b36;
    color:white;
}

.lbTitle{
    color:#63ff78;
    font-weight:bold;
    margin-bottom:5px;
}

.lbRow{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    padding:3px;
}

#joystick{
    position:fixed;
    z-index:30;
    left:20px;
    bottom:20px;
    width:140px;
    height:140px;
    display:none;
    border-radius:50%;
    background:rgba(99,255,120,.08);
    border:2px solid rgba(99,255,120,.35);
}

#stick{
    position:absolute;
    width:60px;
    height:60px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:#63ff78;
    border:3px solid white;
}

#boost{
    position:fixed;
    right:20px;
    bottom:25px;
    z-index:30;
    display:none;
    width:90px;
    height:90px;
    border-radius:50%;
    background:#087cad;
    color:white;
    border:3px solid #a8e8ff;
    font-size:25px;
}

#killText{
    position:fixed;
    z-index:50;
    left:50%;
    top:25%;
    transform:translate(-50%,-50%);
    color:#63ff78;
    font-size:38px;
    font-weight:bold;
    opacity:0;
    pointer-events:none;
    transition:.2s;
}

#killText.show{
    opacity:1;
}

#gameOver{
    position:fixed;
    inset:0;
    z-index:200;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(0,0,0,.8);
}

.over{
    width:min(90vw,400px);
    padding:30px;
    border-radius:25px;
    background:#081008;
    color:white;
    text-align:center;
    border:1px solid #315b36;
}

.over h2{
    color:#ff6070;
    font-size:38px;
}

@media(max-width:800px){

    #joystick,
    #boost{
        display:block;
    }

    #hud{
        flex-wrap:wrap;
        max-width:190px;
    }

    #leaderboard{
        width:145px;
    }
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="menu">

<div class="panel">

<div class="logo">🐍</div>

<h1>SNAKE ARENA</h1>

<div class="subtitle">
Multiplayer • Bots • Shop • Skins
</div>

<input id="name" maxlength="16" placeholder="Sinu nimi">

<div id="coinMenu">
🪙 <span id="menuCoins">0</span> COINS
</div>

<button id="shopButton" class="mainBtn dark">
🛒 SHOP
</button>

<div id="shop">

<h2>🛒 SKIN SHOP</h2>

<p style="color:#718172;margin:6px">
Iga kill = +10 🪙
</p>

<div class="shopGrid" id="shopGrid"></div>

<button id="closeShop" class="mainBtn dark">
⬅ TAGASI
</button>

</div>

<div id="mainMenu">

<h3 style="margin-top:10px">
Sinu skin
</h3>

<div id="skins"></div>

<button id="singleBtn" class="mainBtn green">
🤖 SINGLEPLAYER — BOTID
</button>

<button id="createBtn" class="mainBtn dark">
🏠 CREATE ROOM
</button>

<input id="roomInput" maxlength="6" placeholder="ROOM CODE">

<button id="joinBtn" class="mainBtn dark">
🚪 JOIN ROOM
</button>

<div id="roomBox">

<div style="color:#718172;font-size:11px">
ROOM CODE
</div>

<div id="roomCode">------</div>

<div id="players"></div>

<button id="startBtn" class="mainBtn green">
▶ START GAME
</button>

</div>

<div id="error"></div>

<div id="connection">
Ühendamine...
</div>

</div>

</div>
</div>

<div id="hud">

<div class="stat">
<small>SCORE</small>
<b id="score">0</b>
</div>

<div class="stat">
<small>KILLS</small>
<b id="kills">0</b>
</div>

<div class="stat">
<small>LENGTH</small>
<b id="length">25</b>
</div>

<div class="stat">
<small>COINS</small>
<b id="coins">0</b>
</div>

</div>

<div id="leaderboard">

<div class="lbTitle">
🏆 TOP 3
</div>

<div id="lbRows"></div>

</div>

<div id="killText">
💥 +10 KILL &nbsp; 🪙 +10
</div>

<div id="joystick">
<div id="stick"></div>
</div>

<button id="boost">
⚡
</button>

<div id="gameOver">

<div class="over">

<h2>GAME OVER</h2>

<p id="deathReason"></p>

<p style="margin-top:10px">
Score: <b id="finalScore">0</b>
</p>

<button
class="mainBtn green"
style="margin-top:20px"
onclick="location.reload()">
🔄 MENU
</button>

</div>

</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W=innerWidth;
let H=innerHeight;

function resize(){
    W=innerWidth;
    H=innerHeight;
    canvas.width=W;
    canvas.height=H;
}

addEventListener("resize",resize);
resize();

const WORLD=20000;

const SKINS=[
    {
        id:"green",
        name:"Classic",
        color:"#63ff78",
        price:0
    },
    {
        id:"blue",
        name:"Blue",
        color:"#4da6ff",
        price:30
    },
    {
        id:"red",
        name:"Red",
        color:"#ff5570",
        price:50
    },
    {
        id:"yellow",
        name:"Gold",
        color:"#ffd84d",
        price:80
    },
    {
        id:"purple",
        name:"Purple",
        color:"#b86cff",
        price:100
    },
    {
        id:"orange",
        name:"Fire",
        color:"#ff8a3d",
        price:120
    },
    {
        id:"cyan",
        name:"Cyber",
        color:"#00e5d4",
        price:150
    },
    {
        id:"white",
        name:"Ghost",
        color:"#ffffff",
        price:200
    }
];

let coins=Number(
    localStorage.getItem("snakeCoins")||0
);

let owned=JSON.parse(
    localStorage.getItem("snakeOwned")||
    '["green"]'
);

let selectedSkin=
    localStorage.getItem("snakeSkin")||
    "green";

let selected=SKINS.find(
    s=>s.id===selectedSkin
)||SKINS[0];

const me={
    id:null,
    x:10000,
    y:10000,
    angle:0,
    targetAngle:0,
    length:25,
    score:0,
    kills:0,
    color:selected.color,
    skin:selected.id
};

let body=[];
let bots=[];
let others={};

let running=false;
let dead=false;
let single=false;
let boosting=false;

let socket=null;
let connected=false;

const foods=[];

const foodColors=[
    "#63ff78",
    "#ffd84d",
    "#ff6070",
    "#4da6ff",
    "#b86cff",
    "#ff8a3d"
];

for(let i=0;i<1200;i++){

    foods.push({
        x:Math.random()*WORLD,
        y:Math.random()*WORLD,
        radius:3+Math.random()*5,
        color:foodColors[
            Math.floor(Math.random()*foodColors.length)
        ],
        value:1+Math.floor(Math.random()*4)
    });
}

function saveCoins(){

    localStorage.setItem(
        "snakeCoins",
        coins
    );
}

function saveSkins(){

    localStorage.setItem(
        "snakeOwned",
        JSON.stringify(owned)
    );

    localStorage.setItem(
        "snakeSkin",
        selectedSkin
    );
}

function updateCoins(){

    document.getElementById("menuCoins").textContent=coins;
    document.getElementById("coins").textContent=coins;

    saveCoins();
}

function renderShop(){

    const grid=document.getElementById("shopGrid");

    grid.innerHTML="";

    for(const skin of SKINS){

        const isOwned=owned.includes(skin.id);

        const div=document.createElement("div");

        div.className="shopItem";

        div.innerHTML=`

            <div
                class="skinPreview"
                style="background:${skin.color}">
            </div>

            <b>${skin.name}</b>

            <div style="color:#ffd84d;margin-top:4px">
                ${skin.price===0?"FREE":"🪙 "+skin.price}
            </div>

            <button class="shopBuy ${
                isOwned?"owned":"buy"
            }">

                ${
                    isOwned
                    ?"✓ OWNED"
                    :"BUY"
                }

            </button>

        `;

        const button=div.querySelector("button");

        button.onclick=()=>{

            if(owned.includes(skin.id)){

                selectSkin(skin.id);

                return;
            }

            if(coins<skin.price){

                alert(
                    "Sul on vaja veel "+
                    (skin.price-coins)+
                    " coini!"
                );

                return;
            }

            coins-=skin.price;

            owned.push(skin.id);

            saveCoins();
            saveSkins();

            selectSkin(skin.id);
            renderShop();
            renderSkinSelector();
            updateCoins();
        };

        grid.appendChild(div);
    }
}

function selectSkin(id){

    if(!owned.includes(id))return;

    const skin=SKINS.find(
        s=>s.id===id
    );

    if(!skin)return;

    selectedSkin=id;

    selected=skin;

    me.color=skin.color;
    me.skin=skin.id;

    saveSkins();

    renderSkinSelector();
}

function renderSkinSelector(){

    const box=document.getElementById("skins");

    box.innerHTML="";

    for(const skin of SKINS){

        if(!owned.includes(skin.id))continue;

        const b=document.createElement("button");

        b.className=
            "skinSelect "+
            (skin.id===selectedSkin?"selected":"");

        b.style.background=skin.color;
        b.title=skin.name;

        b.onclick=()=>{
            selectSkin(skin.id);
        };

        box.appendChild(b);
    }
}

document.getElementById("shopButton").onclick=()=>{

    document.getElementById("mainMenu").style.display="none";
    document.getElementById("shop").style.display="block";

    renderShop();
};

document.getElementById("closeShop").onclick=()=>{

    document.getElementById("shop").style.display="none";
    document.getElementById("mainMenu").style.display="block";
};

renderSkinSelector();
updateCoins();

function playerName(){

    return (
        document.getElementById("name").value.trim()||
        "Player"
    ).substring(0,16);
}

function send(data){

    if(
        socket &&
        socket.readyState===WebSocket.OPEN
    ){

        socket.send(JSON.stringify(data));
        return true;
    }

    return false;
}

function connect(){

    if(location.protocol==="file:"){

        document.getElementById("connection").textContent=
            "🟢 Singleplayer";

        return;
    }

    const protocol=
        location.protocol==="https:"
        ?"wss:"
        :"ws:";

    socket=new WebSocket(
        protocol+"//"+location.host
    );

    socket.onopen=()=>{

        connected=true;

        document.getElementById("connection").textContent=
            "🟢 Server connected";

        send({
            type:"hello",
            name:playerName(),
            color:me.color,
            skin:me.skin
        });
    };

    socket.onclose=()=>{

        connected=false;

        document.getElementById("connection").textContent=
            "🔴 Server disconnected";
    };

    socket.onmessage=e=>{

        try{
            handleServer(
                JSON.parse(e.data)
            );
        }catch(err){
            console.log(err);
        }
    };
}

function handleServer(data){

    if(data.type==="roomCreated"||
       data.type==="roomJoined"){

        me.id=data.id;

        document.getElementById("roomBox")
            .style.display="block";

        document.getElementById("roomCode")
            .textContent=data.code;

        return;
    }

    if(data.type==="lobby"){

        const box=document.getElementById("players");

        box.innerHTML="";

        data.players.forEach(p=>{

            const div=document.createElement("div");

            div.className="playerRow";

            div.textContent=
                "🐍 "+p.name;

            div.style.color=
                p.color||"white";

            box.appendChild(div);
        });

        return;
    }

    if(data.type==="gameStart"){

        me.id=data.id;

        startGame(false);

        return;
    }

    if(data.type==="players"){

        others=data.players||{};

        return;
    }

    if(data.type==="kill"){

        me.kills=data.kills;
        me.score=data.score;

        /*
            SERVER ÜTLEB, ET KILL ANDIS 10 COINI.
        */

        coins+=data.coins||10;

        saveCoins();
        updateCoins();
        showKill();

        return;
    }

    if(data.type==="gameOver"){

        die(data.reason);

        return;
    }

    if(data.type==="respawn"){

        dead=false;
        running=true;

        document.getElementById("gameOver")
            .style.display="none";

        return;
    }

    if(data.type==="error"){

        document.getElementById("error")
            .textContent=data.message;
    }
}

document.getElementById("createBtn").onclick=()=>{

    document.getElementById("error").textContent="";

    if(!connected){

        document.getElementById("error").textContent=
            "Serveriga pole ühendust.";

        return;
    }

    send({
        type:"createRoom",
        name:playerName(),
        color:me.color,
        skin:me.skin
    });
};

document.getElementById("joinBtn").onclick=()=>{

    const code=
        document.getElementById("roomInput")
        .value
        .trim()
        .toUpperCase();

    if(code.length!==6){

        document.getElementById("error").textContent=
            "Sisesta 6 märki.";

        return;
    }

    send({
        type:"joinRoom",
        code,
        name:playerName(),
        color:me.color,
        skin:me.skin
    });
};

document.getElementById("startBtn").onclick=()=>{

    send({
        type:"startGame"
    });
};

document.getElementById("singleBtn").onclick=()=>{

    startGame(true);
};

const keys={};

addEventListener("keydown",e=>{

    keys[e.key.toLowerCase()]=true;

    if(e.key==="Shift")boosting=true;
});

addEventListener("keyup",e=>{

    keys[e.key.toLowerCase()]=false;

    if(e.key==="Shift")boosting=false;
});

function keyboard(){

    let dx=0;
    let dy=0;

    if(keys.w||keys.arrowup)dy--;
    if(keys.s||keys.arrowdown)dy++;
    if(keys.a||keys.arrowleft)dx--;
    if(keys.d||keys.arrowright)dx++;

    if(dx||dy){

        me.targetAngle=
            Math.atan2(dy,dx);
    }
}

let joyId=null;

const joystick=document.getElementById("joystick");
const stick=document.getElementById("stick");

joystick.onpointerdown=e=>{

    joyId=e.pointerId;

    joystick.setPointerCapture(e.pointerId);

    joystickMove(
        e.clientX,
        e.clientY
    );
};

joystick.onpointermove=e=>{

    if(e.pointerId===joyId){

        joystickMove(
            e.clientX,
            e.clientY
        );
    }
};

joystick.onpointerup=joyReset;
joystick.onpointercancel=joyReset;

function joystickMove(x,y){

    const r=joystick.getBoundingClientRect();

    const cx=r.left+r.width/2;
    const cy=r.top+r.height/2;

    let dx=x-cx;
    let dy=y-cy;

    const max=52;
    const d=Math.hypot(dx,dy);

    if(d>max){

        dx=dx/d*max;
        dy=dy/d*max;
    }

    stick.style.left=
        "calc(50% + "+dx+"px)";

    stick.style.top=
        "calc(50% + "+dy+"px)";

    if(d>8){

        me.targetAngle=
            Math.atan2(dy,dx);
    }
}

function joyReset(){

    joyId=null;

    stick.style.left="50%";
    stick.style.top="50%";
}

const boost=document.getElementById("boost");

boost.onpointerdown=()=>{
    boosting=true;
};

boost.onpointerup=()=>{
    boosting=false;
};

boost.onpointercancel=()=>{
    boosting=false;
};

function startGame(botMode){

    single=botMode;
    running=true;
    dead=false;

    document.getElementById("menu").style.display="none";
    document.getElementById("hud").style.display="flex";

    me.x=3000+Math.random()*14000;
    me.y=3000+Math.random()*14000;

    me.angle=Math.random()*Math.PI*2;
    me.targetAngle=me.angle;

    me.length=25;
    me.score=0;
    me.kills=0;

    body=[];

    for(let i=0;i<25;i++){

        body.push({
            x:me.x-Math.cos(me.angle)*i*8,
            y:me.y-Math.sin(me.angle)*i*8
        });
    }

    if(single){

        createBots(10);
    }
}

function createBots(n){

    bots=[];

    const colors=[
        "#4da6ff",
        "#ff5570",
        "#ffd84d",
        "#b86cff",
        "#ff8a3d",
        "#00e5d4"
    ];

    const names=[
        "Viper",
        "Cobra",
        "Shadow",
        "Hunter",
        "Blaze",
        "Toxic",
        "Python",
        "Ghost",
        "Rex",
        "Speedy"
    ];

    for(let i=0;i<n;i++){

        const bot={
            id:"bot"+i,

            x:1000+Math.random()*18000,
            y:1000+Math.random()*18000,

            angle:Math.random()*Math.PI*2,
            targetAngle:Math.random()*Math.PI*2,

            length:25+Math.random()*80,

            color:colors[i%colors.length],
            skin:"blue",

            name:names[i],

            body:[],
            timer:0
        };

        bots.push(bot);
    }
}

function update(){

    if(!running||dead)return;

    keyboard();

    let diff=
        me.targetAngle-me.angle;

    while(diff>Math.PI)diff-=Math.PI*2;
    while(diff<-Math.PI)diff+=Math.PI*2;

    me.angle+=diff*.18;

    const speed=
        boosting?10.8:7.2;

    me.x+=Math.cos(me.angle)*speed;
    me.y+=Math.sin(me.angle)*speed;

    me.x=Math.max(25,Math.min(WORLD-25,me.x));
    me.y=Math.max(25,Math.min(WORLD-25,me.y));

    body.unshift({
        x:me.x,
        y:me.y
    });

    while(
        body.length<
        Math.floor(me.length)
    ){

        body.push({
            x:me.x,
            y:me.y
        });
    }

    while(
        body.length>
        Math.floor(me.length)
    ){

        body.pop();
    }

    eatFood();

    if(single){

        updateBots();
        botCollisions();

    }else{

        send({
            type:"state",

            x:me.x,
            y:me.y,

            angle:me.angle,

            length:me.length,

            score:me.score,
            kills:me.kills,

            name:playerName(),
            color:me.color,
            skin:me.skin
        });
    }

    updateHUD();
}

function eatFood(){

    for(let i=foods.length-1;i>=0;i--){

        const f=foods[i];

        if(
            Math.hypot(
                me.x-f.x,
                me.y-f.y
            )<25
        ){

            me.score+=f.value;
            me.length+=f.value*.5;

            foods.splice(i,1);

            foods.push({
                x:Math.random()*WORLD,
                y:Math.random()*WORLD,
                radius:3+Math.random()*4,
                color:foodColors[
                    Math.floor(
                        Math.random()*foodColors.length
                    )
                ],
                value:1+Math.floor(Math.random()*4)
            });
        }
    }
}

function updateBots(){

    for(const bot of bots){

        bot.timer--;

        if(bot.timer<=0){

            bot.timer=
                30+Math.random()*100;

            const food=
                foods[
                    Math.floor(
                        Math.random()*foods.length
                    )
                ];

            if(food){

                bot.targetAngle=
                    Math.atan2(
                        food.y-bot.y,
                        food.x-bot.x
                    );
            }
        }

        let d=
            bot.targetAngle-bot.angle;

        while(d>Math.PI)d-=Math.PI*2;
        while(d<-Math.PI)d+=Math.PI*2;

        bot.angle+=d*.05;

        bot.x+=Math.cos(bot.angle)*5.2;
        bot.y+=Math.sin(bot.angle)*5.2;

        bot.x=Math.max(
            30,
            Math.min(WORLD-30,bot.x)
        );

        bot.y=Math.max(
            30,
            Math.min(WORLD-30,bot.y)
        );

        bot.body.unshift({
            x:bot.x,
            y:bot.y
        });

        while(
            bot.body.length<
            Math.floor(bot.length)
        ){

            bot.body.push({
                x:bot.x,
                y:bot.y
            });
        }

        while(
            bot.body.length>
            Math.floor(bot.length)
        ){

            bot.body.pop();
        }
    }
}

function botCollisions(){

    for(const bot of [...bots]){

        for(let i=7;i<body.length;i++){

            if(
                Math.hypot(
                    bot.x-body[i].x,
                    bot.y-body[i].y
                )<25
            ){

                killBot(bot);
                break;
            }
        }

        if(!bots.includes(bot))continue;

        for(let i=7;i<bot.body.length;i++){

            if(
                Math.hypot(
                    me.x-bot.body[i].x,
                    me.y-bot.body[i].y
                )<25
            ){

                die(
                    bot.name+
                    " tabas sinu keha!"
                );

                return;
            }
        }
    }
}

function killBot(bot){

    const index=bots.indexOf(bot);

    if(index===-1)return;

    for(let i=0;i<bot.body.length;i+=3){

        foods.push({
            x:bot.body[i].x,
            y:bot.body[i].y,
            radius:5,
            color:bot.color,
            value:2
        });
    }

    bots.splice(index,1);

    me.kills++;
    me.score+=10;
    me.length+=12;

    /*
        SINGLEPLAYERIS KA KILL = 10 COINI
    */

    coins+=10;

    saveCoins();
    updateCoins();
    showKill();

    setTimeout(()=>{

        if(running&&!dead){

            createOneBot();
        }

    },800);
}

function createOneBot(){

    const colors=[
        "#4da6ff",
        "#ff5570",
        "#ffd84d",
        "#b86cff",
        "#ff8a3d",
        "#00e5d4"
    ];

    bots.push({

        id:"bot"+Date.now(),

        x:1000+Math.random()*18000,
        y:1000+Math.random()*18000,

        angle:Math.random()*Math.PI*2,
        targetAngle:Math.random()*Math.PI*2,

        length:30+Math.random()*60,

        color:
            colors[
                Math.floor(
                    Math.random()*colors.length
                )
            ],

        skin:"blue",
        name:"Bot "+Math.floor(Math.random()*999),

        body:[],
        timer:0
    });
}

function updateHUD(){

    document.getElementById("score")
        .textContent=Math.floor(me.score);

    document.getElementById("kills")
        .textContent=me.kills;

    document.getElementById("length")
        .textContent=Math.floor(me.length);

    document.getElementById("coins")
        .textContent=coins;

    updateLeaderboard();
}

function updateLeaderboard(){

    const list=[{
        name:playerName(),
        score:me.score,
        color:me.color
    }];

    for(const id in others){

        const p=others[id];

        if(p){

            list.push({
                name:p.name||"Player",
                score:p.score||0,
                color:p.color||"#fff"
            });
        }
    }

    for(const bot of bots){

        list.push({
            name:bot.name,
            score:Math.floor(bot.length),
            color:bot.color
        });
    }

    list.sort(
        (a,b)=>b.score-a.score
    );

    document.getElementById("lbRows").innerHTML=
        list.slice(0,3).map((p,i)=>`

            <div class="lbRow">

                <span style="color:${p.color}">
                    ${i+1}. ${escapeHtml(p.name)}
                </span>

                <b>
                    ${Math.floor(p.score)}
                </b>

            </div>

        `).join("");
}

function escapeHtml(s){

    return String(s)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;");
}

function showKill(){

    const el=document.getElementById("killText");

    el.classList.add("show");

    setTimeout(()=>{
        el.classList.remove("show");
    },900);
}

function die(reason){

    if(dead)return;

    dead=true;
    running=false;

    document.getElementById("deathReason")
        .textContent=reason;

    document.getElementById("finalScore")
        .textContent=Math.floor(me.score);

    document.getElementById("gameOver")
        .style.display="flex";
}

function draw(){

    ctx.fillStyle="#071008";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    if(!running)return;

    ctx.save();

    ctx.translate(
        W/2-me.x,
        H/2-me.y
    );

    drawGrid();
    drawBorder();
    drawFood();

    /*
        BOTID
    */

    for(const bot of bots){

        drawSnake(
            bot,
            bot.body
        );
    }

    /*
        MULTIPLAYER MÄNGIJAD

        IGA MÄNGIJA SAAB:
        - terve keha
        - eraldi segmendid
        - pea
        - silmad
        - suu
        - oma skin
        - oma nimi
    */

    for(const id in others){

        if(id===me.id)continue;

        const p=others[id];

        if(!p||!p.alive)continue;

        const remoteBody=[];

        const len=Math.max(
            15,
            Math.min(
                500,
                Math.floor(p.length||25)
            )
        );

        for(let i=0;i<len;i++){

            remoteBody.push({

                x:
                    p.x-
                    Math.cos(p.angle||0)*
                    i*8,

                y:
                    p.y-
                    Math.sin(p.angle||0)*
                    i*8
            });
        }

        drawSnake(
            {
                x:p.x,
                y:p.y,
                angle:p.angle||0,
                color:p.color||"#4da6ff",
                skin:p.skin||"blue",
                name:p.name||"Player"
            },
            remoteBody
        );
    }

    /*
        MINU SNAKE
    */

    drawSnake(
        {
            x:me.x,
            y:me.y,
            angle:me.angle,
            color:me.color,
            skin:me.skin,
            name:playerName()
        },
        body
    );

    ctx.restore();
}

function drawGrid(){

    const size=250;

    ctx.strokeStyle=
        "rgba(99,255,120,.045)";

    for(
        let x=
            Math.floor(
                (me.x-W)/size
            )*size;
        x<me.x+W;
        x+=size
    ){

        ctx.beginPath();
        ctx.moveTo(x,me.y-H);
        ctx.lineTo(x,me.y+H);
        ctx.stroke();
    }

    for(
        let y=
            Math.floor(
                (me.y-H)/size
            )*size;
        y<me.y+H;
        y+=size
    ){

        ctx.beginPath();
        ctx.moveTo(me.x-W,y);
        ctx.lineTo(me.x+W,y);
        ctx.stroke();
    }
}

function drawBorder(){

    ctx.strokeStyle="#63ff78";
    ctx.lineWidth=14;

    ctx.shadowColor="#63ff78";
    ctx.shadowBlur=20;

    ctx.strokeRect(
        0,
        0,
        WORLD,
        WORLD
    );

    ctx.shadowBlur=0;
}

function drawFood(){

    for(const f of foods){

        if(
            Math.abs(f.x-me.x)>W+200||
            Math.abs(f.y-me.y)>H+200
        )continue;

        ctx.fillStyle=f.color;

        ctx.shadowColor=f.color;
        ctx.shadowBlur=7;

        ctx.beginPath();

        ctx.arc(
            f.x,
            f.y,
            f.radius,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.shadowBlur=0;
}

function drawSnake(snake,snakeBody){

    if(!snakeBody||!snakeBody.length)return;

    /*
        KEHA JOONISTATAKSE TAGANT ETTE.
        See teeb madudest korraliku tervikliku keha.
    */

    for(
        let i=snakeBody.length-1;
        i>=0;
        i--
    ){

        const p=snakeBody[i];

        const progress=
            i/snakeBody.length;

        const radius=
            9+(1-progress)*8;

        ctx.globalAlpha=
            .92-progress*.2;

        ctx.fillStyle=snake.color;

        ctx.shadowColor=snake.color;
        ctx.shadowBlur=i<12?9:2;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            radius,
            0,
            Math.PI*2
        );

        ctx.fill();

        /*
            Väikesed detailid kehal.
        */

        if(i%4===0){

            ctx.fillStyle=
                "rgba(255,255,255,.18)";

            ctx.beginPath();

            ctx.arc(
                p.x-radius*.25,
                p.y-radius*.25,
                radius*.22,
                0,
                Math.PI*2
            );

            ctx.fill();
        }
    }

    ctx.globalAlpha=1;
    ctx.shadowBlur=0;

    drawHead(
        snake.x,
        snake.y,
        snake.color,
        snake.skin,
        snake.angle
    );

    drawName(
        snake.name||"Player",
        snake.x,
        snake.y-36
    );
}

function drawHead(x,y,color,skin,angle){

    ctx.save();

    ctx.translate(x,y);
    ctx.rotate(angle);

    ctx.fillStyle=color;

    ctx.shadowColor=color;
    ctx.shadowBlur=16;

    ctx.beginPath();

    ctx.arc(
        0,
        0,
        23,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.shadowBlur=0;

    /*
        Kõrvad / sarved mõnel skinil.
    */

    if(skin==="purple"){

        ctx.fillStyle=color;

        ctx.beginPath();
        ctx.moveTo(-12,-16);
        ctx.lineTo(-6,-29);
        ctx.lineTo(0,-17);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(-1,-17);
        ctx.lineTo(7,-29);
        ctx.lineTo(12,-15);
        ctx.fill();
    }

    /*
        SILMAD
    */

    ctx.fillStyle="white";

    ctx.beginPath();

    ctx.ellipse(
        10,
        -7,
        7,
        6,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.ellipse(
        10,
        7,
        7,
        6,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.fillStyle="#111";

    ctx.beginPath();

    ctx.arc(
        12,
        -7,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        12,
        7,
        3,
        0,
        Math.PI*2
    );

    ctx.fill();

    /*
        SUU
    */

    ctx.strokeStyle="#111";
    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.arc(
        14,
        0,
        7,
        -.65,
        .65
    );

    ctx.stroke();

    /*
        KEEL
    */

    ctx.strokeStyle="#ff6070";
    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(19,0);
    ctx.lineTo(34,0);

    ctx.stroke();

    ctx.restore();
}

function drawName(name,x,y){

    ctx.save();

    ctx.textAlign="center";

    ctx.font="bold 12px Arial";

    ctx.fillStyle="white";

    ctx.shadowColor="#000";
    ctx.shadowBlur=6;

    ctx.fillText(
        name,
        x,
        y
    );

    ctx.restore();
}

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);
}

connect();
loop();

</script>
